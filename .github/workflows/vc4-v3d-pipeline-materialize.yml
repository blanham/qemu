name: VC4 V3D primitive pipeline materialization

on:
  push:
    branches:
      - agent/vc4-linux-mesa-gles2-frontier
    paths:
      - .github/workflows/vc4-v3d-pipeline-materialize.yml
      - scripts/vc4/.v3d-pipeline-materialize.b64.*
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-v3d-pipeline-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev libpixman-1-dev \
            ninja-build pkg-config python3 zlib1g-dev

      - name: Materialize the bounded primitive pipeline
        run: |
          set -euo pipefail
          cat scripts/vc4/.v3d-pipeline-materialize.b64.* | \
            base64 -d > /tmp/v3d-pipeline-materialize.py
          python3 - <<'PYFIX'
          from pathlib import Path

          path = Path("/tmp/v3d-pipeline-materialize.py")
          text = path.read_text(encoding="utf-8")
          nl = chr(92) + "n"
          replacements = (
              (
                  f'        """    case VC4_PACKET_TILE_RENDERING_MODE_CONFIG:{nl}""",',
                  f'        """        cl->frontier.have_shader_record = true;{nl}'
                  f'        return true;{nl}{nl}'
                  f'    case VC4_PACKET_TILE_RENDERING_MODE_CONFIG:{nl}""",',
              ),
              (
                  f'        """    case VC4_PACKET_VIEWPORT_OFFSET: {{{nl}',
                  f'        """        cl->frontier.have_shader_record = true;{nl}'
                  f'        return true;{nl}{nl}'
                  f'    case VC4_PACKET_VIEWPORT_OFFSET: {{{nl}',
              ),
          )
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"materializer anchor {old!r}: expected once, found {count}"
                  )
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PYFIX
          test "$(sha256sum /tmp/v3d-pipeline-materialize.py | cut -d' ' -f1)" = \
            "f65517e6295e94da31282364e0958f57f55629c850f3ede617b79cc5a33cd1ba"
          python3 -m py_compile /tmp/v3d-pipeline-materialize.py
          python3 /tmp/v3d-pipeline-materialize.py

          # The materializer promotes the shader-record types into the public
          # header so diagnostics and execution share one decoder.  Remove the
          # now-stale private declarations from the implementation, requiring
          # the exact original declaration block rather than editing by line.
          python3 - <<'PYFIX'
          from pathlib import Path

          path = Path("hw/display/vc4_v3d_frontier.c")
          text = path.read_text(encoding="utf-8")
          start_marker = "typedef struct VC4V3DShaderAttribute {\n"
          end_marker = "} VC4V3DShaderRecord;\n\n"
          if text.count(start_marker) != 1:
              raise SystemExit(
                  "private shader-attribute declaration: expected exactly once"
              )
          start = text.index(start_marker)
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit("private shader-record declaration end not found")
          end += len(end_marker)
          text = text[:start] + text[end:]
          if "typedef struct VC4V3DShaderAttribute" in text or \
             "typedef struct VC4V3DShaderRecord" in text:
              raise SystemExit("private shader-record declarations remain")
          path.write_text(text, encoding="utf-8")
          PYFIX

          git diff --check
          grep -n 'VC4_PACKET_START_TILE_BINNING' hw/display/bcm2835_v3d.c
          grep -n 'vc4_v3d_decode_shader_record' \
            include/hw/display/vc4_v3d_frontier.h \
            hw/display/vc4_v3d_frontier.c
          mkdir -p /tmp/vc4-v3d-generated
          cp hw/display/bcm2835_v3d.c /tmp/vc4-v3d-generated/
          cp include/hw/display/bcm2835_v3d.h /tmp/vc4-v3d-generated/
          cp hw/display/vc4_v3d_pipeline.c /tmp/vc4-v3d-generated/
          cp include/hw/display/vc4_v3d_pipeline.h /tmp/vc4-v3d-generated/
          cp hw/display/vc4_v3d_frontier.c /tmp/vc4-v3d-generated/
          cp include/hw/display/vc4_v3d_frontier.h /tmp/vc4-v3d-generated/
          git diff --binary > /tmp/vc4-v3d-generated/product.patch

      - name: Configure and build the product tree
        run: |
          set -euo pipefail
          ./configure \
            --target-list=aarch64-softmmu,vc4-softmmu \
            --disable-docs --disable-werror
          ninja -C build \
            qemu-system-aarch64 qemu-system-vc4 \
            tests/unit/test-vc4-qpu \
            tests/unit/test-vc4-qpu-contract \
            tests/unit/test-vc4-v3d-pipeline

      - name: Upload generated source on every run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-v3d-generated-${{ github.run_attempt }}
          path: /tmp/vc4-v3d-generated
          if-no-files-found: warn
          retention-days: 3

      - name: Run focused architectural regressions
        run: |
          set -euo pipefail
          build/tests/unit/test-vc4-qpu --tap -k
          build/tests/unit/test-vc4-qpu-contract --tap -k
          build/tests/unit/test-vc4-v3d-pipeline --tap -k
          python3 scripts/vc4/v3d-smoke.py \
            --qemu build/qemu-system-aarch64

      - name: Publish only the tested product tree
        env:
          BRANCH: agent/vc4-linux-mesa-gles2-frontier
        run: |
          set -euo pipefail
          git rm -- \
            .github/workflows/vc4-v3d-pipeline-materialize.yml \
            scripts/vc4/.v3d-pipeline-materialize.b64.*
          git add -A
          git diff --cached --check
          git config user.name "VC4 Agent"
          git config user.email "vc4-agent@users.noreply.github.com"
          git commit -m \
            "hw/display: execute bounded VC4 array primitives"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
