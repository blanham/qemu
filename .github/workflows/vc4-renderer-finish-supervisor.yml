name: VC4 renderer finish supervisor

on:
  push:
    branches:
      - agent/vc4-linux-mesa-gles2-frontier
    paths:
      - VC4_LINUX_MESA_GLES2_STATUS.json
      - VC4_CONTINUATION_T002_STATUS.json
      - .github/workflows/vc4-renderer-finish-supervisor.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: vc4-renderer-finish-supervisor
  cancel-in-progress: false

jobs:
  supervise:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BRANCH: agent/vc4-linux-mesa-gles2-frontier
      MESA_STATUS: VC4_LINUX_MESA_GLES2_STATUS.json
      CONT_STATUS: VC4_CONTINUATION_T002_STATUS.json
      STATE_FILE: VC4_RENDERER_FINISH_SUPERVISOR.json
      MAX_ITERATIONS: '8'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read current evidence and decide next action
        id: decide
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          python3 - <<'PY'
          from __future__ import annotations

          from pathlib import Path
          import json
          import os
          import subprocess

          mesa_path = Path(os.environ['MESA_STATUS'])
          cont_path = Path(os.environ['CONT_STATUS'])
          state_path = Path(os.environ['STATE_FILE'])
          max_iterations = int(os.environ['MAX_ITERATIONS'])

          state = {
              'version': 1,
              'iterations': 0,
              'mesa_sources_dispatched': [],
              'continuation_commits_dispatched': [],
              'complete': False,
          }
          if state_path.is_file():
              loaded = json.loads(state_path.read_text())
              if isinstance(loaded, dict):
                  state.update(loaded)

          action = 'wait'
          reason = 'missing-fresh-evidence'
          mesa = None
          source_sha = ''
          mesa_commit = ''
          continuation_commit = ''

          if mesa_path.is_file():
              mesa = json.loads(mesa_path.read_text())
              source_sha = str(
                  mesa.get('source_sha') or mesa.get('tested_source_sha') or ''
              )
              mesa_commit = subprocess.check_output(
                  ['git', 'log', '-1', '--format=%H', '--', str(mesa_path)],
                  text=True,
              ).strip()

          if cont_path.is_file():
              continuation_commit = subprocess.check_output(
                  ['git', 'log', '-1', '--format=%H', '--', str(cont_path)],
                  text=True,
              ).strip()

          complete = False
          if mesa is not None:
              text = json.dumps(mesa).lower()
              complete = any((
                  mesa.get('complete') is True,
                  mesa.get('passed') is True,
                  mesa.get('classification') in {
                      'mesa-gles2-complete', 'exact-pixels', 'success'
                  },
                  'vc4_linux_mesa_gles2_ok' in text,
                  'vc4_linux_mesa_gles2_pixels_ok' in text,
              ))

          if complete:
              state['complete'] = True
              state['completion_source_sha'] = source_sha
              state['completion_mesa_commit'] = mesa_commit
              action = 'complete'
              reason = 'untouched-mesa-exact-pixel-witness'
          elif source_sha:
              try:
                  header = subprocess.check_output(
                      ['git', 'show', f'{source_sha}:include/hw/display/vc4_qpu_exec.h'],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  )
                  source = subprocess.check_output(
                      ['git', 'show', f'{source_sha}:hw/display/vc4_qpu_exec.c'],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  )
                  varying_ready = (
                      'VC4_QPU_EXEC_FAULT_VARYING_READ' in header
                      and 'VC4_QPU_REG_VARYING' in source
                  )
              except subprocess.CalledProcessError:
                  varying_ready = False

              seen_sources = set(state.get('mesa_sources_dispatched') or [])
              seen_cont = set(state.get('continuation_commits_dispatched') or [])

              if not varying_ready:
                  action = 'wait'
                  reason = 'varying-fifo-product-not-yet-in-tested-source'
              elif (
                  continuation_commit
                  and mesa_commit
                  and continuation_commit != mesa_commit
                  and subprocess.run(
                      ['git', 'merge-base', '--is-ancestor', mesa_commit,
                       continuation_commit],
                      check=False,
                  ).returncode == 0
                  and continuation_commit not in seen_cont
              ):
                  action = 'dispatch-evaluators'
                  reason = 'new-continuation-candidate-after-mesa-frontier'
                  state.setdefault(
                      'continuation_commits_dispatched', []
                  ).append(continuation_commit)
              elif source_sha not in seen_sources:
                  iterations = int(state.get('iterations') or 0)
                  if iterations >= max_iterations:
                      action = 'blocked'
                      reason = 'bounded-iteration-limit-reached'
                  else:
                      action = 'dispatch-continuation'
                      reason = 'new-measured-mesa-frontier'
                      state['iterations'] = iterations + 1
                      state.setdefault('mesa_sources_dispatched', []).append(
                          source_sha
                      )
              else:
                  action = 'wait'
                  reason = 'current-mesa-frontier-already-dispatched'

          state['last_action'] = action
          state['last_reason'] = reason
          state['current_source_sha'] = source_sha
          state['current_mesa_commit'] = mesa_commit
          state['current_continuation_commit'] = continuation_commit
          state_path.write_text(json.dumps(state, indent=2, sort_keys=True) + '\n')
          Path('/tmp/ACTION').write_text(action + '\n')
          Path('/tmp/REASON').write_text(reason + '\n')
          PY
          echo "action=$(cat /tmp/ACTION)" >> "$GITHUB_OUTPUT"
          echo "reason=$(cat /tmp/REASON)" >> "$GITHUB_OUTPUT"

      - name: Dispatch bounded continuation
        if: steps.decide.outputs.action == 'dispatch-continuation'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run vc4-continuation-t002-driver.yml \
            --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

      - name: Dispatch measured candidate evaluators
        if: steps.decide.outputs.action == 'dispatch-evaluators'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t workflows < <(
            find .github/workflows -maxdepth 1 -type f -printf '%f\n' | \
              grep -Ei 'vc4.*(tmu|readback).*(candidate.*evaluat|integration.*verif)|vc4.*readback.*evaluat' | \
              sort -u
          )
          test "${#workflows[@]}" -gt 0
          for workflow in "${workflows[@]}"; do
            gh workflow run "$workflow" \
              --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          done

      - name: Persist supervisor state
        run: |
          set -euo pipefail
          git config user.name 'VC4 CI'
          git config user.email 'vc4-ci@users.noreply.github.com'
          git add "$STATE_FILE"
          if ! git diff --cached --quiet; then
            git commit -m \
              "test/vc4: renderer supervisor ${{ steps.decide.outputs.action }} [skip ci]"
            for attempt in 1 2 3; do
              git fetch origin "$BRANCH"
              if git rebase "origin/$BRANCH" && \
                 git push origin "HEAD:$BRANCH"; then
                exit 0
              fi
              git rebase --abort || true
              sleep 2
            done
            exit 1
          fi

      - name: Retire supervisor after exact witness
        if: steps.decide.outputs.action == 'complete'
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          git config user.name 'VC4 CI'
          git config user.email 'vc4-ci@users.noreply.github.com'
          git rm .github/workflows/vc4-renderer-finish-supervisor.yml
          git commit -m 'ci/vc4: retire completed renderer supervisor [skip ci]'
          git push origin "HEAD:$BRANCH"
