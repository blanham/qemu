name: VC4 post-topology KMS frontier

on:
  push:
    branches:
      - agent/vc4-linux-kms-bind-diagnostics
    paths:
      - .github/workflows/vc4-kms-next-frontier.yml
      - .github/vc4-kms-next-frontier.trigger

permissions:
  contents: write

concurrency:
  group: vc4-kms-next-frontier
  cancel-in-progress: false

jobs:
  advance:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      BRANCH: agent/vc4-linux-kms-bind-diagnostics
      RPI_FIRMWARE_COMMIT: 3d301dd924bcd758a4c8cb19fe8531031f033f43
      RPI_KERNEL_RELEASE: 6.18.44-v8+
      OFFICIAL_DIR: /tmp/vc4-next-official
      MODULE_DIR: /tmp/vc4-next-modules
      INITRAMFS_DIR: /tmp/vc4-next-initramfs
      DTB_DIR: /tmp/vc4-next-dtbs
      RENDER_DIR: /tmp/vc4-next-render
      KMS_DIR: /tmp/vc4-next-kms
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Wait for the reconciled clock and monitor frontier
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 240); do
            git fetch origin "$BRANCH"
            if git cat-file -e \
              "origin/$BRANCH:VC4_LINUX_KMS_CONTRACT_STATUS.json" \
              2>/dev/null; then
              ready=true
              break
            fi
            sleep 10
          done
          test "$ready" = true
          git reset --hard "origin/$BRANCH"
          test ! -e .github/workflows/vc4-kms-contract-final.yml

      - name: Select the next frontier from machine-readable evidence
        id: select
        run: |
          set -euo pipefail
          topology=$(python3 - <<'PY'
          import json
          with open("VC4_LINUX_KMS_CONTRACT_STATUS.json") as stream:
              record = json.load(stream)
          print("true" if record["native_kms_topology_clear"] else "false")
          PY
          )
          echo "topology=$topology" >> "$GITHUB_OUTPUT"

          if test "$topology" != true; then
            python3 - <<'PY'
          from pathlib import Path
          import json

          record = json.loads(
              Path("VC4_LINUX_KMS_CONTRACT_STATUS.json").read_text()
          )
          next_record = {
              "schema_version": 1,
              "classification": record["classification"],
              "components": record["components"],
              "errors": record["errors"],
              "next_action": (
                  "Resolve the first remaining supplier, component bind, or "
                  "MMIO contract recorded in errors before adding a modeset gate."
              ),
          }
          Path("VC4_LINUX_KMS_NEXT_CONTRACT.json").write_text(
              json.dumps(next_record, indent=2, sort_keys=True) + "\n"
          )
          lines = [
              "# VC4 Linux KMS next hardware contract",
              "",
              f"Current frontier: **`{record['classification']}`**",
              "",
              "Native KMS topology is not yet clear, so a modeset witness "
              "would conflate object discovery with the remaining hardware "
              "contract. The machine-readable companion preserves the bound "
              "component set and the exact relevant kernel errors.",
              "",
              "## Bound components",
              "",
          ]
          lines.extend(
              f"- `{item['device']}` via `{item['ops']}`"
              for item in record["components"]
          )
          lines.extend(("", "## Relevant errors", ""))
          lines.extend(f"- `{line}`" for line in record["errors"][-80:])
          Path("VC4_LINUX_KMS_NEXT_CONTRACT.md").write_text(
              "\n".join(lines) + "\n"
          )
          PY
          fi

      - name: Add a bounded native modeset witness
        if: steps.select.outputs.topology == 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/vc4/linux-v3d-modular-init.c")
          source = path.read_text()
          if "VC4_LINUX_KMS_MODESET_OK" in source:
              raise SystemExit(0)
          main_anchor = "int main("
          position = source.find(main_anchor)
          if position < 0:
              raise SystemExit("init main function anchor changed")
          helper = r'''
          static int vc4_kms_modeset_ioctl(int fd, unsigned long request,
                                           void *argument)
          {
              int ret;

              do {
                  ret = ioctl(fd, request, argument);
              } while (ret < 0 && errno == EINTR);
              return ret;
          }

          static int vc4_kms_modeset_probe(void)
          {
              struct drm_mode_card_res resources = { 0 };
              struct drm_mode_get_connector connector = { 0 };
              struct drm_mode_get_encoder encoder = { 0 };
              struct drm_mode_create_dumb create = { 0 };
              struct drm_mode_map_dumb map = { 0 };
              struct drm_mode_fb_cmd framebuffer = { 0 };
              struct drm_mode_crtc set = { 0 };
              struct drm_mode_modeinfo *modes = NULL;
              uint32_t *connectors = NULL;
              uint32_t *crtcs = NULL;
              uint32_t *encoders = NULL;
              uint32_t connector_id = 0;
              uint32_t crtc_id = 0;
              void *pixels = MAP_FAILED;
              size_t map_size = 0;
              int fd = -1;
              int result = -1;

              fd = open("/dev/dri/card0", O_RDWR | O_CLOEXEC);
              if (fd < 0) {
                  dprintf(STDOUT_FILENO,
                          "VC4_LINUX_KMS_MODESET_FAILED stage=open errno=%d\n",
                          errno);
                  goto out;
              }
              if (vc4_kms_modeset_ioctl(fd, DRM_IOCTL_MODE_GETRESOURCES,
                                        &resources) < 0 ||
                  resources.count_crtcs == 0 ||
                  resources.count_connectors == 0) {
                  dprintf(STDOUT_FILENO,
                          "VC4_LINUX_KMS_MODESET_FAILED stage=resources errno=%d\n",
                          errno);
                  goto out;
              }
              crtcs = calloc(resources.count_crtcs, sizeof(*crtcs));
              connectors = calloc(resources.count_connectors,
                                  sizeof(*connectors));
              if (!crtcs || !connectors) {
                  goto out;
              }
              resources.crtc_id_ptr = (uintptr_t)crtcs;
              resources.connector_id_ptr = (uintptr_t)connectors;
              if (vc4_kms_modeset_ioctl(fd, DRM_IOCTL_MODE_GETRESOURCES,
                                        &resources) < 0) {
                  goto out;
              }

              for (uint32_t i = 0; i < resources.count_connectors; i++) {
                  memset(&connector, 0, sizeof(connector));
                  connector.connector_id = connectors[i];
                  if (vc4_kms_modeset_ioctl(fd, DRM_IOCTL_MODE_GETCONNECTOR,
                                            &connector) < 0 ||
                      connector.count_modes == 0 ||
                      connector.count_encoders == 0) {
                      continue;
                  }
                  modes = calloc(connector.count_modes, sizeof(*modes));
                  encoders = calloc(connector.count_encoders,
                                    sizeof(*encoders));
                  if (!modes || !encoders) {
                      goto out;
                  }
                  connector.modes_ptr = (uintptr_t)modes;
                  connector.encoders_ptr = (uintptr_t)encoders;
                  if (vc4_kms_modeset_ioctl(fd, DRM_IOCTL_MODE_GETCONNECTOR,
                                            &connector) < 0 ||
                      connector.connection != DRM_MODE_CONNECTED ||
                      connector.count_modes == 0) {
                      free(modes);
                      free(encoders);
                      modes = NULL;
                      encoders = NULL;
                      continue;
                  }
                  connector_id = connector.connector_id;
                  break;
              }
              if (!connector_id) {
                  dprintf(STDOUT_FILENO,
                          "VC4_LINUX_KMS_MODESET_FAILED stage=connector errno=%d\n",
                          errno);
                  goto out;
              }

              if (connector.encoder_id) {
                  encoder.encoder_id = connector.encoder_id;
                  if (vc4_kms_modeset_ioctl(fd, DRM_IOCTL_MODE_GETENCODER,
                                            &encoder) == 0) {
                      crtc_id = encoder.crtc_id;
                  }
              }
              if (!crtc_id) {
                  for (uint32_t i = 0; i < connector.count_encoders; i++) {
                      memset(&encoder, 0, sizeof(encoder));
                      encoder.encoder_id = encoders[i];
                      if (vc4_kms_modeset_ioctl(fd, DRM_IOCTL_MODE_GETENCODER,
                                                &encoder) < 0) {
                          continue;
                      }
                      for (uint32_t bit = 0; bit < resources.count_crtcs; bit++) {
                          if (encoder.possible_crtcs & (UINT32_C(1) << bit)) {
                              crtc_id = crtcs[bit];
                              break;
                          }
                      }
                      if (crtc_id) {
                          break;
                      }
                  }
              }
              if (!crtc_id) {
                  dprintf(STDOUT_FILENO,
                          "VC4_LINUX_KMS_MODESET_FAILED stage=crtc errno=%d\n",
                          errno);
                  goto out;
              }

              create.width = modes[0].hdisplay;
              create.height = modes[0].vdisplay;
              create.bpp = 32;
              if (vc4_kms_modeset_ioctl(fd, DRM_IOCTL_MODE_CREATE_DUMB,
                                        &create) < 0) {
                  dprintf(STDOUT_FILENO,
                          "VC4_LINUX_KMS_MODESET_FAILED stage=create-dumb errno=%d\n",
                          errno);
                  goto out;
              }
              framebuffer.width = create.width;
              framebuffer.height = create.height;
              framebuffer.pitch = create.pitch;
              framebuffer.bpp = 32;
              framebuffer.depth = 24;
              framebuffer.handle = create.handle;
              if (vc4_kms_modeset_ioctl(fd, DRM_IOCTL_MODE_ADDFB,
                                        &framebuffer) < 0) {
                  dprintf(STDOUT_FILENO,
                          "VC4_LINUX_KMS_MODESET_FAILED stage=addfb errno=%d\n",
                          errno);
                  goto out;
              }
              map.handle = create.handle;
              if (vc4_kms_modeset_ioctl(fd, DRM_IOCTL_MODE_MAP_DUMB, &map) < 0) {
                  dprintf(STDOUT_FILENO,
                          "VC4_LINUX_KMS_MODESET_FAILED stage=map-dumb errno=%d\n",
                          errno);
                  goto out;
              }
              map_size = create.size;
              pixels = mmap(NULL, map_size, PROT_READ | PROT_WRITE,
                            MAP_SHARED, fd, map.offset);
              if (pixels == MAP_FAILED) {
                  dprintf(STDOUT_FILENO,
                          "VC4_LINUX_KMS_MODESET_FAILED stage=mmap errno=%d\n",
                          errno);
                  goto out;
              }
              for (uint32_t y = 0; y < create.height; y++) {
                  uint32_t *row = (uint32_t *)((uint8_t *)pixels +
                                              (size_t)y * create.pitch);
                  for (uint32_t x = 0; x < create.width; x++) {
                      row[x] = ((x ^ y) & 32) ? UINT32_C(0x00ff8000)
                                             : UINT32_C(0x000040ff);
                  }
              }
              if (msync(pixels, map_size, MS_SYNC) < 0) {
                  dprintf(STDOUT_FILENO,
                          "VC4_LINUX_KMS_MODESET_FAILED stage=msync errno=%d\n",
                          errno);
                  goto out;
              }

              set.crtc_id = crtc_id;
              set.fb_id = framebuffer.fb_id;
              set.set_connectors_ptr = (uintptr_t)&connector_id;
              set.count_connectors = 1;
              set.mode = modes[0];
              set.mode_valid = 1;
              if (vc4_kms_modeset_ioctl(fd, DRM_IOCTL_MODE_SETCRTC, &set) < 0) {
                  dprintf(STDOUT_FILENO,
                          "VC4_LINUX_KMS_MODESET_FAILED stage=setcrtc errno=%d\n",
                          errno);
                  goto out;
              }
              dprintf(STDOUT_FILENO,
                      "VC4_LINUX_KMS_MODESET_OK connector=%u crtc=%u "
                      "fb=%u width=%u height=%u pitch=%u\n",
                      connector_id, crtc_id, framebuffer.fb_id,
                      create.width, create.height, create.pitch);
              result = 0;

          out:
              if (pixels != MAP_FAILED) {
                  munmap(pixels, map_size);
              }
              free(modes);
              free(encoders);
              free(connectors);
              free(crtcs);
              if (fd >= 0) {
                  close(fd);
              }
              return result;
          }

          '''
          source = source[:position] + helper + source[position:]
          marker_lines = [
              index for index, line in enumerate(source.splitlines())
              if "VC4_LINUX_KMS_TOPOLOGY_OK" in line
          ]
          if len(marker_lines) != 1:
              raise SystemExit(
                  f"topology marker call changed: {marker_lines!r}"
              )
          lines = source.splitlines()
          index = marker_lines[0]
          indent = lines[index][:len(lines[index]) - len(lines[index].lstrip())]
          lines.insert(index + 1, indent + "(void)vc4_kms_modeset_probe();")
          path.write_text("\n".join(lines) + "\n")
          PY
          git diff --check

      - name: Install dependencies
        if: steps.select.outputs.topology == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            binutils-aarch64-linux-gnu cpio curl device-tree-compiler file \
            gcc-aarch64-linux-gnu gzip libdrm-dev \
            libc6-dev-arm64-cross linux-libc-dev-arm64-cross \
            ninja-build pkg-config python3 \
            libglib2.0-dev libpixman-1-dev xz-utils zlib1g-dev zstd
          rm -rf \
            "$OFFICIAL_DIR" "$MODULE_DIR" "$INITRAMFS_DIR" "$DTB_DIR" \
            "$RENDER_DIR" "$KMS_DIR"
          mkdir -p \
            "$OFFICIAL_DIR" "$DTB_DIR" "$RENDER_DIR" "$KMS_DIR"

      - name: Build and run the modeset frontier
        if: steps.select.outputs.topology == 'true'
        run: |
          set -euo pipefail
          for file in kernel8.img bcm2710-rpi-3-b.dtb; do
            curl --fail --location --retry 5 \
              --output "$OFFICIAL_DIR/$file" \
              "https://raw.githubusercontent.com/raspberrypi/firmware/${RPI_FIRMWARE_COMMIT}/boot/$file"
          done
          python3 scripts/vc4/fetch-linux-vc4-modules.py \
            --base-url \
            "https://raw.githubusercontent.com/raspberrypi/firmware/${RPI_FIRMWARE_COMMIT}/modules/${RPI_KERNEL_RELEASE}" \
            --out-dir "$MODULE_DIR" --target vc4
          bash scripts/vc4/build-linux-v3d-modular-initramfs.sh \
            "$INITRAMFS_DIR" "$MODULE_DIR"
          dtc -q -@ -I dts -O dtb \
            -o "$DTB_DIR/render.dtbo" \
            tests/vc4/vc4-render-only-overlay.dts
          bash scripts/vc4/build-v3d-linux-dtb.sh \
            "$OFFICIAL_DIR/bcm2710-rpi-3-b.dtb" \
            "$DTB_DIR/render.dtbo" "$DTB_DIR/render.dtb"
          dtc -q -@ -I dts -O dtb \
            -o "$DTB_DIR/kms.dtbo" \
            tests/vc4/vc4-kms-frontier-overlay.dts
          bash scripts/vc4/build-vc4-kms-linux-dtb.sh \
            "$OFFICIAL_DIR/bcm2710-rpi-3-b.dtb" \
            "$DTB_DIR/kms.dtbo" "$DTB_DIR/kms.dtb"
          ./configure \
            --target-list=aarch64-softmmu,vc4-softmmu \
            --disable-docs --disable-werror
          ninja -C build qemu-system-aarch64 qemu-system-vc4
          python3 scripts/vc4/raspi3-linux-probe.py \
            --mode linux-direct \
            --qemu build/qemu-system-aarch64 \
            --kernel "$OFFICIAL_DIR/kernel8.img" \
            --dtb "$DTB_DIR/render.dtb" \
            --initrd "$INITRAMFS_DIR/initramfs.cpio.gz" \
            --out-dir "$RENDER_DIR" \
            --seconds 50 --sample-interval 5
          grep -Fq VC4_LINUX_DRM_SUBMIT_OK "$RENDER_DIR/serial.log"
          python3 scripts/vc4/raspi3-linux-probe.py \
            --mode linux-direct \
            --qemu build/qemu-system-aarch64 \
            --kernel "$OFFICIAL_DIR/kernel8.img" \
            --dtb "$DTB_DIR/kms.dtb" \
            --initrd "$INITRAMFS_DIR/initramfs.cpio.gz" \
            --out-dir "$KMS_DIR" \
            --seconds 85 --sample-interval 5 || true
          test -f "$KMS_DIR/serial.log"
          grep -Fq VC4_LINUX_KMS_TOPOLOGY_OK "$KMS_DIR/serial.log"

      - name: Record the native modeset result
        if: steps.select.outputs.topology == 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          serial = Path("/tmp/vc4-next-kms/serial.log").read_text(
              errors="replace"
          )
          success = "VC4_LINUX_KMS_MODESET_OK" in serial
          failure = re.search(
              r"VC4_LINUX_KMS_MODESET_FAILED stage=(\S+) errno=(\d+)",
              serial,
          )
          if success:
              classification = "linux-vc4-kms-modeset-clear"
          elif failure:
              classification = "vc4-kms-modeset-" + failure.group(1)
          else:
              classification = "vc4-kms-modeset-not-reached"
          record = {
              "schema_version": 1,
              "passed": success,
              "classification": classification,
              "failure_stage": failure.group(1) if failure else None,
              "failure_errno": int(failure.group(2)) if failure else None,
              "relevant_tail": [
                  line for line in serial.splitlines()
                  if "VC4_LINUX_KMS" in line or "vc4" in line.lower()
                  or "drm" in line.lower() or "failed" in line.lower()
              ][-320:],
          }
          Path("VC4_LINUX_KMS_MODESET_STATUS.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n"
          )
          Path("VC4_LINUX_KMS_MODESET_STATUS.md").write_text(
              "\n".join((
                  "# VC4 Linux native KMS modeset frontier",
                  "",
                  f"Modeset passed: **{'true' if success else 'false'}**",
                  "",
                  f"Frontier: **`{classification}`**",
                  "",
                  "This witness creates and maps a VC4 dumb buffer, writes a "
                  "deterministic pattern, adds a framebuffer, selects the "
                  "connected connector/CRTC pair, and issues SETCRTC.",
              )) + "\n"
          )
          PY

      - name: Publish the selected next frontier
        run: |
          set -euo pipefail
          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          if test "${{ steps.select.outputs.topology }}" = true; then
            git add -- \
              tests/vc4/linux-v3d-modular-init.c \
              VC4_LINUX_KMS_MODESET_STATUS.json \
              VC4_LINUX_KMS_MODESET_STATUS.md
            message="test/vc4: add native Linux KMS modeset frontier"
          else
            git add -- \
              VC4_LINUX_KMS_NEXT_CONTRACT.json \
              VC4_LINUX_KMS_NEXT_CONTRACT.md
            message="test/vc4: record next native KMS hardware contract"
          fi
          git rm -f --ignore-unmatch -- \
            .github/vc4-kms-next-frontier.trigger \
            .github/workflows/vc4-kms-next-frontier.yml
          git commit -m "$message"
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
