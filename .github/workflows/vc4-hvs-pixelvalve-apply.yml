name: VC4 HVS and pixel-valve tranche

# Keep this one-shot workflow explicit so connector-authored staging commits
# can be retriggered without modifying the payload itself.
# This revision is committed through the Git data API to emit a normal ref push.
on:
  push:
    branches:
      - agent/vc4-linux-kms-bind-diagnostics
    paths:
      - .github/workflows/vc4-hvs-pixelvalve-apply.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-hvs-pixelvalve-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/vc4-linux-kms-bind-diagnostics
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev libpixman-1-dev \
            ninja-build pkg-config python3 unzip zlib1g-dev

      - name: Reassemble and verify the tranche
        run: |
          set -euo pipefail
          cat .github/vc4-hvs-pixelvalve-parts/* | \
            base64 --decode > /tmp/vc4-hvs-pixelvalve-bootstrap.zip
          test "$(sha256sum /tmp/vc4-hvs-pixelvalve-bootstrap.zip | cut -d' ' -f1)" = \
            302fb220479e5983488a2c71b0f17a0663c8c47c61248a6e78ec4e73cf4df54d
          rm -rf /tmp/vc4-hvs-pixelvalve-tranche
          mkdir -p /tmp/vc4-hvs-pixelvalve-tranche
          unzip -q /tmp/vc4-hvs-pixelvalve-bootstrap.zip \
            -d /tmp/vc4-hvs-pixelvalve-tranche
          chmod +x \
            /tmp/vc4-hvs-pixelvalve-tranche/tranche/apply.py \
            /tmp/vc4-hvs-pixelvalve-tranche/tranche/validate.sh

          # Both validators were checking for QOM type macros in the SoC
          # aggregate header.  That header correctly contains device-state
          # fields instead, so repair the assertions in the staged bundle and
          # in the permanent workflow text generated by apply.py.
          python3 - <<'PY'
          from pathlib import Path

          root = Path("/tmp/vc4-hvs-pixelvalve-tranche/tranche")
          assertions = {
              "TYPE_BCM2835_HVS": "BCM2835HVSState hvs;",
              "TYPE_BCM2835_HDMI": "BCM2835HDMIState hdmi;",
              "TYPE_BCM2835_PIXELVALVE":
                  "BCM2835PixelValveState pixelvalve[3];",
          }
          for name in ("apply.py", "validate.sh"):
              path = root / name
              text = path.read_text()
              for macro, declaration in assertions.items():
                  old = f"grep -Fq {macro} "
                  new = f"grep -Fq '{declaration}' "
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(
                          f"{path}: expected one {macro} assertion, found {count}"
                      )
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY

      - name: Apply and fully validate the display contract
        run: |
          set -euxo pipefail
          python3 \
            /tmp/vc4-hvs-pixelvalve-tranche/tranche/apply.py \
            --repo "$GITHUB_WORKSPACE" --apply
          git diff --stat

          set +e
          VC4_FULL_BUILD=1 bash -x \
            /tmp/vc4-hvs-pixelvalve-tranche/tranche/validate.sh \
            "$GITHUB_WORKSPACE" > /tmp/vc4-hvs-validation.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo '::group::VC4 HVS validation failure tail'
            tail -n 600 /tmp/vc4-hvs-validation.log
            echo '::endgroup::'
            exit "$rc"
          fi
          cat /tmp/vc4-hvs-validation.log

      - name: Upload validation transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-hvs-validation-${{ github.run_attempt }}
          path: /tmp/vc4-hvs-validation.log
          if-no-files-found: warn
          retention-days: 14

      - name: Publish the validated model
        run: |
          set -euo pipefail
          rm -rf .github/vc4-hvs-pixelvalve-parts
          rm -f .github/workflows/vc4-hvs-pixelvalve-apply.yml
          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --name-status
          git commit -m "hw/display: model VC4 HVS flip completion"
          git pull --rebase origin agent/vc4-linux-kms-bind-diagnostics
          git push origin HEAD:agent/vc4-linux-kms-bind-diagnostics
