name: Dispatch VC4 direct-Linux mailbox fix

on:
  push:
    branches:
      - agent/vc4-hetero-direct-linux
    paths:
      - .github/workflows/vc4-dispatch-direct-linux-mailbox-fix.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/vc4-hetero-direct-linux
          fetch-depth: 0

      - name: Dispatch the repaired direct-Linux workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ['REPOSITORY']
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/actions/workflows/'
              'vc4-hetero-direct-linux.yml/dispatches',
              data=json.dumps({
                  'ref': 'agent/vc4-hetero-direct-linux',
              }).encode('utf-8'),
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'vc4-direct-linux-mailbox-fix-dispatch',
              },
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              if response.status != 204:
                  raise SystemExit(
                      f'unexpected dispatch status {response.status}'
                  )
          PY

      - name: Remove one-shot dispatcher
        run: |
          set -euo pipefail
          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git rm -- .github/workflows/vc4-dispatch-direct-linux-mailbox-fix.yml
          git commit -m "ci/vc4: clean direct-Linux mailbox dispatcher [skip ci]"
          git pull --rebase origin agent/vc4-hetero-direct-linux
          git push origin HEAD:agent/vc4-hetero-direct-linux
