name: VC4 QPU varying FIFO materialize and integrate v2

on:
  push:
    branches:
      - agent/vc4-qpu-varying-fifo
    paths:
      - .github/workflows/vc4-qpu-varying-fifo-materialize-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-qpu-varying-fifo-materialize-v2
  cancel-in-progress: false

jobs:
  materialize-integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      SOURCE_BRANCH: agent/vc4-qpu-varying-fifo
      TARGET_BRANCH: agent/vc4-linux-mesa-gles2-frontier
      WORKFLOW_PATH: .github/workflows/vc4-qpu-varying-fifo-materialize-v2.yml
      EVIDENCE: /tmp/vc4-varying-materialize-v2
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev libpixman-1-dev ninja-build pkg-config \
            python3 zlib1g-dev
          rm -rf "$EVIDENCE"
          mkdir -p "$EVIDENCE"

      - name: Materialize architectural varying FIFO implementation
        id: source
        run: |
          set -euo pipefail
          git fetch origin "$SOURCE_BRANCH" "$TARGET_BRANCH"
          git checkout -B "$SOURCE_BRANCH" "origin/$SOURCE_BRANCH"
          source_before=$(git rev-parse HEAD)
          target_before=$(git rev-parse "origin/$TARGET_BRANCH")
          printf '%s\n' "$source_before" > "$EVIDENCE/SOURCE_HEAD_BEFORE"
          printf '%s\n' "$target_before" > "$EVIDENCE/TARGET_HEAD_BEFORE"
          helper=$(git ls-files 'scripts/vc4/*.py' | \
            grep -E 'varying.*fifo|fifo.*varying' | head -n 1 || true)
          test -n "$helper"
          printf '%s\n' "$helper" > "$EVIDENCE/HELPER"
          python3 -m py_compile "$helper"
          python3 "$helper"
          git diff --check
          git diff --name-only > "$EVIDENCE/SOURCE_CHANGED_FILES"
          allowed='^(include/hw/display/vc4_qpu_exec.h|hw/display/vc4_qpu_exec.c|tests/unit/test-vc4-qpu.c)$'
          while IFS= read -r path; do
            test -z "$path" && continue
            if ! grep -Eq "$allowed" <<<"$path"; then
              echo "unexpected materialized path: $path" >&2
              exit 1
            fi
          done < "$EVIDENCE/SOURCE_CHANGED_FILES"
          grep -Fq 'VC4_QPU_EXEC_FAULT_VARYING_READ' \
            include/hw/display/vc4_qpu_exec.h
          grep -Fq 'VC4_QPU_REG_VARYING' hw/display/vc4_qpu_exec.c
          grep -Fq 'vc4_qpu_exec_set_varyings' hw/display/vc4_qpu_exec.c
          grep -Fq 'state->accumulator[5]' hw/display/vc4_qpu_exec.c
          grep -Eq 'varying.*read|read.*varying' tests/unit/test-vc4-qpu.c
          if grep -E '0x100049e0203e303e|shader.*fingerprint|firmware.*fingerprint' \
              hw/display/vc4_qpu_exec.c include/hw/display/vc4_qpu_exec.h; then
            echo 'workload fingerprint found in production source' >&2
            exit 1
          fi
          if test -s "$EVIDENCE/SOURCE_CHANGED_FILES"; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Build and test materialized source
        run: |
          set -euo pipefail
          rm -rf build
          ./configure \
            --target-list=aarch64-softmmu,vc4-softmmu \
            --disable-docs --disable-werror \
            2>&1 | tee "$EVIDENCE/source-configure.log"
          ninja -C build \
            qemu-system-aarch64 qemu-system-vc4 \
            tests/unit/test-vc4-qpu \
            tests/unit/test-vc4-qpu-contract \
            tests/unit/test-vc4-v3d-pipeline \
            2>&1 | tee "$EVIDENCE/source-build.log"
          build/tests/unit/test-vc4-qpu --tap -k \
            2>&1 | tee "$EVIDENCE/source-qpu.tap"
          build/tests/unit/test-vc4-qpu-contract --tap -k \
            2>&1 | tee "$EVIDENCE/source-qpu-contract.tap"
          build/tests/unit/test-vc4-v3d-pipeline --tap -k \
            2>&1 | tee "$EVIDENCE/source-v3d-pipeline.tap"

      - name: Publish source product commit
        run: |
          set -euo pipefail
          git config user.name 'VC4 CI'
          git config user.email 'vc4-ci@users.noreply.github.com'
          if test -s "$EVIDENCE/SOURCE_CHANGED_FILES"; then
            git add \
              include/hw/display/vc4_qpu_exec.h \
              hw/display/vc4_qpu_exec.c \
              tests/unit/test-vc4-qpu.c
            git commit -m 'hw/display: implement VC4 QPU varying FIFO reads'
            git fetch origin "$SOURCE_BRANCH"
            test "$(git rev-parse FETCH_HEAD)" = \
              "$(cat "$EVIDENCE/SOURCE_HEAD_BEFORE")"
            git push origin "HEAD:refs/heads/$SOURCE_BRANCH"
          fi
          git rev-parse HEAD > "$EVIDENCE/SOURCE_PRODUCT_HEAD"

      - name: Integrate exact product files onto Mesa frontier
        id: target
        run: |
          set -euo pipefail
          product=$(cat "$EVIDENCE/SOURCE_PRODUCT_HEAD")
          target_before=$(cat "$EVIDENCE/TARGET_HEAD_BEFORE")
          git checkout -B "$TARGET_BRANCH" "$target_before"
          files=(
            include/hw/display/vc4_qpu_exec.h
            hw/display/vc4_qpu_exec.c
            tests/unit/test-vc4-qpu.c
          )
          git checkout "$product" -- "${files[@]}"
          git diff --check
          git diff --name-only > "$EVIDENCE/TARGET_CHANGED_FILES"
          while IFS= read -r path; do
            test -z "$path" && continue
            case "$path" in
              include/hw/display/vc4_qpu_exec.h|hw/display/vc4_qpu_exec.c|tests/unit/test-vc4-qpu.c) ;;
              *) echo "unexpected target path $path" >&2; exit 1 ;;
            esac
          done < "$EVIDENCE/TARGET_CHANGED_FILES"
          grep -Fq 'VC4_QPU_EXEC_FAULT_VARYING_READ' \
            include/hw/display/vc4_qpu_exec.h
          grep -Fq 'VC4_QPU_REG_VARYING' hw/display/vc4_qpu_exec.c
          grep -Fq 'vc4_qpu_exec_set_varyings' hw/display/vc4_qpu_exec.c
          if test -s "$EVIDENCE/TARGET_CHANGED_FILES"; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild and retest exact target integration
        if: steps.target.outputs.changed == 'true'
        run: |
          set -euo pipefail
          rm -rf build
          ./configure \
            --target-list=aarch64-softmmu,vc4-softmmu \
            --disable-docs --disable-werror \
            2>&1 | tee "$EVIDENCE/target-configure.log"
          ninja -C build \
            qemu-system-aarch64 qemu-system-vc4 \
            tests/unit/test-vc4-qpu \
            tests/unit/test-vc4-qpu-contract \
            tests/unit/test-vc4-v3d-pipeline \
            2>&1 | tee "$EVIDENCE/target-build.log"
          build/tests/unit/test-vc4-qpu --tap -k \
            2>&1 | tee "$EVIDENCE/target-qpu.tap"
          build/tests/unit/test-vc4-qpu-contract --tap -k \
            2>&1 | tee "$EVIDENCE/target-qpu-contract.tap"
          build/tests/unit/test-vc4-v3d-pipeline --tap -k \
            2>&1 | tee "$EVIDENCE/target-v3d-pipeline.tap"

      - name: Publish exact tested target integration
        if: steps.target.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name 'VC4 CI'
          git config user.email 'vc4-ci@users.noreply.github.com'
          git add \
            include/hw/display/vc4_qpu_exec.h \
            hw/display/vc4_qpu_exec.c \
            tests/unit/test-vc4-qpu.c
          git commit -m 'hw/display: implement VC4 QPU varying FIFO reads'
          git rev-parse HEAD > "$EVIDENCE/TARGET_PRODUCT_HEAD"
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = \
            "$(cat "$EVIDENCE/TARGET_HEAD_BEFORE")"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

      - name: Record evidence
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          e = Path('/tmp/vc4-varying-materialize-v2')
          def get(name):
              p = e / name
              return p.read_text().strip() if p.exists() else None
          data = {
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'helper': get('HELPER'),
              'source_head_before': get('SOURCE_HEAD_BEFORE'),
              'source_product_head': get('SOURCE_PRODUCT_HEAD'),
              'target_head_before': get('TARGET_HEAD_BEFORE'),
              'target_product_head': get('TARGET_PRODUCT_HEAD'),
              'source_changed_files': (e / 'SOURCE_CHANGED_FILES').read_text().splitlines()
                  if (e / 'SOURCE_CHANGED_FILES').exists() else [],
              'target_changed_files': (e / 'TARGET_CHANGED_FILES').read_text().splitlines()
                  if (e / 'TARGET_CHANGED_FILES').exists() else [],
          }
          Path('VC4_QPU_VARYING_MATERIALIZE_V2.json').write_text(
              json.dumps(data, indent=2, sort_keys=True) + '\n')
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-qpu-varying-materialize-v2-${{ github.run_attempt }}
          path: |
            VC4_QPU_VARYING_MATERIALIZE_V2.json
            /tmp/vc4-varying-materialize-v2
          retention-days: 14

      - name: Retire one-shot workflow
        if: always()
        run: |
          set -euo pipefail
          git fetch origin "$SOURCE_BRANCH"
          git checkout -B "$SOURCE_BRANCH" "origin/$SOURCE_BRANCH"
          git config user.name 'VC4 CI'
          git config user.email 'vc4-ci@users.noreply.github.com'
          if test -f "$WORKFLOW_PATH"; then
            git rm "$WORKFLOW_PATH"
            git commit -m 'ci/vc4: retire varying FIFO materializer v2 [skip ci]'
            git push origin "HEAD:refs/heads/$SOURCE_BRANCH"
          fi
