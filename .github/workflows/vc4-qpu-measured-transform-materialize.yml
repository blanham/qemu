name: VC4 measured transform execution materialization

on:
  push:
    branches:
      - agent/vc4-linux-mesa-gles2-frontier
    paths:
      - .github/workflows/vc4-qpu-measured-transform-materialize.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-qpu-measured-transform-materialize
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BRANCH: agent/vc4-linux-mesa-gles2-frontier
      EVIDENCE_DIR: /tmp/vc4-qpu-measured-transform-evidence

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev libpixman-1-dev \
            ninja-build pkg-config python3 zlib1g-dev
          rm -rf "$EVIDENCE_DIR"
          mkdir -p "$EVIDENCE_DIR"
          git rev-parse HEAD > "$EVIDENCE_DIR/INPUT_SHA"

      - name: Apply the generic measured-transform implementation
        run: |
          set -euo pipefail
          cat > /tmp/vc4-qpu-measured-transform.patch <<'PATCH'
          diff --git a/hw/display/vc4_qpu_exec.c b/hw/display/vc4_qpu_exec.c
          index 8d68612b7c..0000000000 100644
          --- a/hw/display/vc4_qpu_exec.c
          +++ b/hw/display/vc4_qpu_exec.c
          @@ -14,6 +14,7 @@
           
           #define VC4_QPU_MAX_EXEC_WORDS          64
           #define VC4_QPU_PROGRAM_END_SIGNAL       3
          +#define VC4_QPU_LAST_THREAD_SWITCH_SIGNAL 6
           #define VC4_QPU_SCOREBOARD_UNLOCK_SIGNAL 5
           #define VC4_QPU_SMALL_IMMEDIATE_SIGNAL  13
           #define VC4_QPU_LOAD_IMMEDIATE_SIGNAL   14
          @@ -22,12 +23,15 @@
           #define VC4_QPU_COND_ALWAYS               1
           
           #define VC4_QPU_ADD_NOP                   0
          +#define VC4_QPU_ADD_FADD                  1
           #define VC4_QPU_ADD_FSUB                  2
          +#define VC4_QPU_ADD_FMAX                  4
           #define VC4_QPU_ADD_FTOI                  7
           #define VC4_QPU_ADD_OR                   21
           
           #define VC4_QPU_MUL_NOP                   0
           #define VC4_QPU_MUL_FMUL                  1
          +#define VC4_QPU_MUL_V8MIN                 4
           
           #define VC4_QPU_MUX_R0                    0
           #define VC4_QPU_MUX_R5                    5
          @@ -39,6 +43,7 @@
           #define VC4_QPU_REG_TLB_COLOR_ALL        46
           #define VC4_QPU_REG_VPM                  48
           #define VC4_QPU_REG_VPM_SETUP            49
          +#define VC4_QPU_REG_SFU_RECIP             52
           
           static bool vc4_qpu_exec_set_fault(VC4QPUExecState *state,
                                              VC4QPUExecFault fault,
          @@ -259,11 +264,19 @@ static bool vc4_qpu_exec_add(VC4QPUExecState *state, unsigned operation,
                                        const VC4QPUVector *b,
                                        VC4QPUVector *result)
           {
          +    memset(result, 0, sizeof(*result));
          +
               switch (operation) {
               case VC4_QPU_ADD_NOP:
          -        memset(result, 0, sizeof(*result));
                   return true;
          +    case VC4_QPU_ADD_FADD:
          +        for (unsigned lane = 0; lane < state->active_lanes; lane++) {
          +            float value = vc4_qpu_bits_to_float(a->lane[lane]) +
          +                          vc4_qpu_bits_to_float(b->lane[lane]);
          +
          +            result->lane[lane] = vc4_qpu_float_to_bits(value);
          +        }
          +        return true;
               case VC4_QPU_ADD_FSUB:
          -        for (unsigned lane = 0; lane < VC4_QPU_LANES; lane++) {
          +        for (unsigned lane = 0; lane < state->active_lanes; lane++) {
                       float value = vc4_qpu_bits_to_float(a->lane[lane]) -
                                     vc4_qpu_bits_to_float(b->lane[lane]);
           
          @@ -271,8 +284,17 @@ static bool vc4_qpu_exec_add(VC4QPUExecState *state, unsigned operation,
                   }
                   return true;
          +    case VC4_QPU_ADD_FMAX:
          +        for (unsigned lane = 0; lane < state->active_lanes; lane++) {
          +            float value = fmaxf(vc4_qpu_bits_to_float(a->lane[lane]),
          +                                vc4_qpu_bits_to_float(b->lane[lane]));
          +
          +            result->lane[lane] = vc4_qpu_float_to_bits(value);
          +        }
          +        return true;
               case VC4_QPU_ADD_FTOI:
          -        for (unsigned lane = 0; lane < VC4_QPU_LANES; lane++) {
          +        for (unsigned lane = 0; lane < state->active_lanes; lane++) {
                       float value = vc4_qpu_bits_to_float(a->lane[lane]);
           
                       /* The positive limit is exclusive; -2^31 is representable. */
          @@ -285,7 +307,7 @@ static bool vc4_qpu_exec_add(VC4QPUExecState *state, unsigned operation,
                   }
                   return true;
               case VC4_QPU_ADD_OR:
          -        for (unsigned lane = 0; lane < VC4_QPU_LANES; lane++) {
          +        for (unsigned lane = 0; lane < state->active_lanes; lane++) {
                       result->lane[lane] = a->lane[lane] | b->lane[lane];
                   }
                   return true;
          @@ -300,18 +322,33 @@ static bool vc4_qpu_exec_mul(VC4QPUExecState *state, unsigned operation,
                                        const VC4QPUVector *b,
                                        VC4QPUVector *result)
           {
          +    memset(result, 0, sizeof(*result));
          +
               switch (operation) {
               case VC4_QPU_MUL_NOP:
          -        memset(result, 0, sizeof(*result));
                   return true;
               case VC4_QPU_MUL_FMUL:
          -        for (unsigned lane = 0; lane < VC4_QPU_LANES; lane++) {
          +        for (unsigned lane = 0; lane < state->active_lanes; lane++) {
                       float value = vc4_qpu_bits_to_float(a->lane[lane]) *
                                     vc4_qpu_bits_to_float(b->lane[lane]);
           
                       result->lane[lane] = vc4_qpu_float_to_bits(value);
                   }
                   return true;
          +    case VC4_QPU_MUL_V8MIN:
          +        for (unsigned lane = 0; lane < state->active_lanes; lane++) {
          +            uint32_t value = 0;
          +
          +            for (unsigned byte = 0; byte < sizeof(uint32_t); byte++) {
          +                unsigned shift = byte * 8;
          +                uint32_t a_byte = (a->lane[lane] >> shift) & 0xff;
          +                uint32_t b_byte = (b->lane[lane] >> shift) & 0xff;
          +
          +                value |= MIN(a_byte, b_byte) << shift;
          +            }
          +            result->lane[lane] = value;
          +        }
          +        return true;
               default:
                   return vc4_qpu_exec_set_fault(
                       state, VC4_QPU_EXEC_FAULT_MUL_OP, operation);
          @@ -385,6 +422,16 @@ static bool vc4_qpu_exec_write(VC4QPUExecState *state, bool file_a,
               case VC4_QPU_REG_TLB_COLOR_ALL:
                   state->tlb_color_all = *value;
                   state->tlb_color_all_valid = true;
                   return true;
          +    case VC4_QPU_REG_SFU_RECIP:
          +        memset(&state->accumulator[4], 0,
          +               sizeof(state->accumulator[4]));
          +        for (unsigned lane = 0; lane < state->active_lanes; lane++) {
          +            float input = vc4_qpu_bits_to_float(value->lane[lane]);
          +
          +            state->accumulator[4].lane[lane] =
          +                vc4_qpu_float_to_bits(1.0f / input);
          +        }
          +        return true;
               case VC4_QPU_REG_VPM:
                   return vc4_qpu_exec_write_vpm(state, value);
               case VC4_QPU_REG_VPM_SETUP:
          @@ -566,6 +613,18 @@ void vc4_qpu_exec_init(VC4QPUExecState *state, uint32_t uniform_address)
           {
               memset(state, 0, sizeof(*state));
               state->uniform_address = uniform_address;
          +    state->active_lanes = VC4_QPU_LANES;
          +}
          +
          +bool vc4_qpu_exec_set_active_lanes(VC4QPUExecState *state,
          +                                   unsigned active_lanes)
          +{
          +    if (state == NULL || active_lanes == 0 ||
          +        active_lanes > VC4_QPU_LANES) {
          +        return false;
          +    }
          +
          +    state->active_lanes = active_lanes;
          +    return true;
           }
           
           bool vc4_qpu_execute(VC4QPUReadFunc read_func, void *opaque,
          @@ -582,6 +641,7 @@ bool vc4_qpu_execute(VC4QPUReadFunc read_func, void *opaque,
               state->pc = code_address;
               state->scoreboard_unlocked = false;
               state->tlb_color_all_valid = false;
          +    state->last_thread_switch = false;
           
               for (unsigned index = 0; index < VC4_QPU_MAX_EXEC_WORDS; index++) {
                   VC4QPUInstruction instruction;
          @@ -605,6 +665,7 @@ bool vc4_qpu_execute(VC4QPUReadFunc read_func, void *opaque,
                   case 1:
                   case VC4_QPU_PROGRAM_END_SIGNAL:
                   case VC4_QPU_SCOREBOARD_UNLOCK_SIGNAL:
          +        case VC4_QPU_LAST_THREAD_SWITCH_SIGNAL:
                   case VC4_QPU_SMALL_IMMEDIATE_SIGNAL:
                       if (!vc4_qpu_exec_alu(
                               read_func, opaque, state, &instruction)) {
          @@ -625,6 +686,9 @@ bool vc4_qpu_execute(VC4QPUReadFunc read_func, void *opaque,
                   if (instruction.signal == VC4_QPU_SCOREBOARD_UNLOCK_SIGNAL) {
                       state->scoreboard_unlocked = true;
                   }
          +        if (instruction.signal == VC4_QPU_LAST_THREAD_SWITCH_SIGNAL) {
          +            state->last_thread_switch = true;
          +        }
                   if (saw_program_end) {
                       if (--end_delay == 0) {
                           state->fault_word = 0;
          PATCH
          git apply --check /tmp/vc4-qpu-measured-transform.patch
          git apply /tmp/vc4-qpu-measured-transform.patch
          git diff --check
          cp /tmp/vc4-qpu-measured-transform.patch "$EVIDENCE_DIR/product.patch"

      - name: Configure and build both frontends
        run: |
          set -euo pipefail
          ./configure \
            --target-list=aarch64-softmmu,vc4-softmmu \
            --disable-docs --disable-werror \
            --extra-cflags=-Werror=implicit-function-declaration \
            2>&1 | tee "$EVIDENCE_DIR/configure.log"
          ninja -C build \
            qemu-system-aarch64 qemu-system-vc4 \
            tests/unit/test-vc4-qpu \
            tests/unit/test-vc4-qpu-contract \
            tests/unit/test-vc4-tiling \
            tests/unit/test-vc4-v3d-pipeline \
            2>&1 | tee "$EVIDENCE_DIR/build.log"

      - name: Run the measured and compatibility gates
        run: |
          set -euo pipefail
          build/tests/unit/test-vc4-qpu --tap -k \
            2>&1 | tee "$EVIDENCE_DIR/qpu.tap"
          build/tests/unit/test-vc4-qpu-contract --tap -k \
            2>&1 | tee "$EVIDENCE_DIR/qpu-contract.tap"
          build/tests/unit/test-vc4-tiling --tap -k \
            2>&1 | tee "$EVIDENCE_DIR/tiling.tap"
          build/tests/unit/test-vc4-v3d-pipeline --tap -k \
            2>&1 | tee "$EVIDENCE_DIR/pipeline.tap"
          python3 scripts/vc4/v3d-smoke.py \
            --qemu build/qemu-system-aarch64 \
            2>&1 | tee "$EVIDENCE_DIR/v3d.log"
          git diff --check

      - name: Upload semantic evidence before publication
        uses: actions/upload-artifact@v4
        with:
          name: vc4-qpu-measured-transform-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          retention-days: 14

      - name: Publish the validated implementation and retire this workflow
        run: |
          set -euo pipefail
          git rm -- .github/workflows/vc4-qpu-measured-transform-materialize.yml
          git add -- hw/display/vc4_qpu_exec.c
          git diff --cached --check
          git config user.name "VC4 Transform CI"
          git config user.email "vc4-transform-ci@users.noreply.github.com"
          git commit -m "hw/display: execute measured VC4 transform shaders"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
