name: Export validated VC4 page-flip visual workflow

on:
  push:
    branches:
      - agent/vc4-linux-kms-bind-diagnostics
    paths:
      - .github/workflows/vc4-pageflip-visual-stage.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vc4-pageflip-visual-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reconstruct and validate the exact staged workflow
        run: |
          set -euo pipefail
          source_tree=/tmp/vc4-pageflip-visual-source
          stage_script=/tmp/vc4-pageflip-visual-stage.py
          export_dir="$GITHUB_WORKSPACE/vc4-pageflip-visual-export"
          rm -rf "$source_tree" "$export_dir" "$stage_script"
          git worktree add --detach "$source_tree" \
            d2db69bfdb9fb6a5b3a5f2cc3dd0c9dfc25bfa05
          cat "$source_tree"/.github/vc4-pageflip-visual-parts/* | \
            base64 --decode | gzip --decompress > "$stage_script"
          test "$(sha256sum "$stage_script" | cut -d' ' -f1)" = \
            38d985c33b9833c426bd1650e8e195f91e28bdb056e6ddf999516ce472c61ed2

          (
            cd "$source_tree"
            python3 "$stage_script"
            python3 -m py_compile \
              "$stage_script" \
              scripts/vc4/enable-linux-kms-pageflip-probe.py \
              scripts/vc4/kms-pageflip-image.py \
              scripts/vc4/raspi3-kms-pageflip-visual-probe.py
            python3 scripts/vc4/kms-pageflip-image.py --self-test
            git diff --check
            grep -Fq 'VC4_LINUX_KMS_PAGEFLIP_VISUAL_READY' \
              tests/vc4/linux-kms-pageflip-probe.inc.c
            grep -Fq 'raspi3-kms-pageflip-visual-probe.py' \
              .github/workflows/vc4-kms-pageflip-probe.yml
            grep -Fq 'linux-vc4-kms-pageflip-visual-clear' \
              .github/workflows/vc4-kms-pageflip-probe.yml
          )

          mkdir -p "$export_dir"
          cp "$source_tree/.github/workflows/vc4-kms-pageflip-probe.yml" \
            "$export_dir/vc4-kms-pageflip-probe.yml"
          cp "$stage_script" "$export_dir/vc4-pageflip-visual-stage.py"
          sha256sum "$export_dir"/* > "$export_dir/SHA256SUMS"
          cat "$export_dir/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: vc4-pageflip-visual-workflow-${{ github.run_attempt }}
          path: vc4-pageflip-visual-export
          if-no-files-found: error
          retention-days: 14
