name: Prepare validated VC4 page-flip visual workflow blob

on:
  push:
    branches:
      - agent/vc4-linux-kms-bind-diagnostics
    paths:
      - .github/workflows/vc4-pageflip-visual-stage.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-pageflip-visual-blob
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reconstruct, validate, and upload the exact workflow blob
        run: |
          set -euo pipefail
          source_tree=/tmp/vc4-pageflip-visual-source
          stage_script=/tmp/vc4-pageflip-visual-stage.py
          workflow_path="$source_tree/.github/workflows/vc4-kms-pageflip-probe.yml"
          manifest_dir="$GITHUB_WORKSPACE/vc4-pageflip-visual-blob"
          rm -rf "$source_tree" "$manifest_dir" "$stage_script"
          git worktree add --detach "$source_tree" \
            d2db69bfdb9fb6a5b3a5f2cc3dd0c9dfc25bfa05
          cat "$source_tree"/.github/vc4-pageflip-visual-parts/* | \
            base64 --decode | gzip --decompress > "$stage_script"
          test "$(sha256sum "$stage_script" | cut -d' ' -f1)" = \
            38d985c33b9833c426bd1650e8e195f91e28bdb056e6ddf999516ce472c61ed2

          (
            cd "$source_tree"
            python3 "$stage_script"
            python3 -m py_compile \
              "$stage_script" \
              scripts/vc4/enable-linux-kms-pageflip-probe.py \
              scripts/vc4/kms-pageflip-image.py \
              scripts/vc4/raspi3-kms-pageflip-visual-probe.py
            python3 scripts/vc4/kms-pageflip-image.py --self-test
            git diff --check
            grep -Fq 'VC4_LINUX_KMS_PAGEFLIP_VISUAL_READY' \
              tests/vc4/linux-kms-pageflip-probe.inc.c
            grep -Fq 'raspi3-kms-pageflip-visual-probe.py' \
              .github/workflows/vc4-kms-pageflip-probe.yml
            grep -Fq 'linux-vc4-kms-pageflip-visual-clear' \
              .github/workflows/vc4-kms-pageflip-probe.yml
          )

          workflow_base64=$(base64 -w0 "$workflow_path")
          blob_sha=$(jq -n \
            --arg content "$workflow_base64" \
            '{content: $content, encoding: "base64"}' | \
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/git/blobs" \
              --input - --jq .sha)
          test -n "$blob_sha"
          test "$blob_sha" = "$(git hash-object "$workflow_path")"

          mkdir -p "$manifest_dir"
          jq -n \
            --arg parent_sha "$GITHUB_SHA" \
            --arg base_tree_sha "$(git rev-parse "$GITHUB_SHA^{tree}")" \
            --arg workflow_blob_sha "$blob_sha" \
            --arg workflow_sha256 "$(sha256sum "$workflow_path" | cut -d' ' -f1)" \
            --arg stage_script_sha256 "$(sha256sum "$stage_script" | cut -d' ' -f1)" \
            '{
              schema_version: 1,
              parent_sha: $parent_sha,
              base_tree_sha: $base_tree_sha,
              workflow_blob_sha: $workflow_blob_sha,
              workflow_sha256: $workflow_sha256,
              stage_script_sha256: $stage_script_sha256,
              target_path: ".github/workflows/vc4-kms-pageflip-probe.yml",
              delete_path: ".github/workflows/vc4-pageflip-visual-stage.yml"
            }' > "$manifest_dir/manifest.json"
          cat "$manifest_dir/manifest.json"

      - uses: actions/upload-artifact@v4
        with:
          name: vc4-pageflip-visual-blob-${{ github.run_attempt }}
          path: vc4-pageflip-visual-blob
          if-no-files-found: error
          retention-days: 14
