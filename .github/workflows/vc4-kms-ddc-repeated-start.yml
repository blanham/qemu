name: VC4 HDMI DDC Linux transfer sequence

on:
  push:
    branches:
      - agent/vc4-linux-kms-ddc-repeated-start
    paths:
      - .github/workflows/vc4-kms-ddc-repeated-start.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-hdmi-ddc-linux-sequence
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build pkg-config python3 \
            libglib2.0-dev libpixman-1-dev zlib1g-dev

      - name: Validate and build Raspberry Pi frontends
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/vc4/property-power-domain-smoke.py \
            scripts/vc4/bcm2835-hdmi-ddc-smoke.py
          git diff --check
          ./configure \
            --target-list=aarch64-softmmu,vc4-softmmu \
            --disable-docs --disable-werror
          ninja -C build qemu-system-aarch64 qemu-system-vc4

      - name: Exercise Linux-style DDC write/read handoff
        run: |
          set -euo pipefail
          python3 scripts/vc4/bcm2835-hdmi-ddc-smoke.py \
            --qemu build/qemu-system-aarch64 \
            | tee /tmp/hdmi-ddc-linux-sequence.log
          grep -Fq 'Linux-style write/read verified' \
            /tmp/hdmi-ddc-linux-sequence.log

      - name: Publish validated transfer witness
        run: |
          set -euo pipefail
          {
            echo '# VC4 Raspberry Pi HDMI DDC validation'
            echo
            echo 'Validation passed: **true**'
            echo
            echo '- Both AArch64 and VC4 system frontends built.'
            echo '- BSC2 returned a valid, checksummed EDID 1.4 block.'
            echo '- Separate pointer/write and read transactions passed.'
            echo '- The Linux i2c-bcm2835 two-message write/read handoff passed.'
            echo '- DDC pointer addressing and reset behavior passed.'
            echo
            echo '```text'
            cat /tmp/hdmi-ddc-linux-sequence.log
            echo '```'
          } > VC4_HDMI_DDC_STATUS.md

          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git add -- \
            scripts/vc4/bcm2835-hdmi-ddc-smoke.py \
            VC4_HDMI_DDC_STATUS.md
          git rm -- .github/workflows/vc4-kms-ddc-repeated-start.yml
          git commit -m \
            "tests/vc4: validate Linux HDMI DDC transfer sequence [skip ci]"
          git pull --rebase origin agent/vc4-linux-kms-ddc-repeated-start
          git push origin HEAD:agent/vc4-linux-kms-ddc-repeated-start
