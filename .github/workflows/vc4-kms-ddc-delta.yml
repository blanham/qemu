name: VC4 native KMS HDMI DDC delta

on:
  push:
    branches:
      - agent/vc4-linux-kms-bind-diagnostics
    paths:
      - .github/workflows/vc4-kms-ddc-delta.yml

permissions:
  contents: write

concurrency:
  group: vc4-native-kms-ddc-delta
  cancel-in-progress: false

jobs:
  delta:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BRANCH: agent/vc4-linux-kms-bind-diagnostics
      RPI_FIRMWARE_COMMIT: 3d301dd924bcd758a4c8cb19fe8531031f033f43
      RPI_KERNEL_RELEASE: 6.18.44-v8+
      OFFICIAL_DIR: /tmp/vc4-ddc-official
      MODULE_DIR: /tmp/vc4-ddc-modules
      INITRAMFS_DIR: /tmp/vc4-ddc-initramfs
      DTB_DIR: /tmp/vc4-ddc-dtbs
      BEFORE_DIR: /tmp/vc4-ddc-before
      AFTER_DIR: /tmp/vc4-ddc-after
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Wait for and adopt the focused clock-contract commit
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 60); do
            git fetch origin "$BRANCH"
            if git cat-file -e \
              "origin/$BRANCH:scripts/vc4/property-clock-enumeration-smoke.py" \
              2>/dev/null; then
              ready=true
              break
            fi
            sleep 10
          done
          test "$ready" = true
          git reset --hard "origin/$BRANCH"
          test ! -e .github/workflows/vc4-kms-clock-contract-apply.yml

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            binutils-aarch64-linux-gnu cpio curl device-tree-compiler file \
            gcc-aarch64-linux-gnu gzip libdrm-dev \
            libc6-dev-arm64-cross linux-libc-dev-arm64-cross \
            ninja-build pkg-config python3 \
            libglib2.0-dev libpixman-1-dev xz-utils zlib1g-dev zstd
          rm -rf \
            "$OFFICIAL_DIR" "$MODULE_DIR" "$INITRAMFS_DIR" \
            "$DTB_DIR" "$BEFORE_DIR" "$AFTER_DIR"
          mkdir -p \
            "$OFFICIAL_DIR" "$DTB_DIR" "$BEFORE_DIR" "$AFTER_DIR"

      - name: Build the pinned Linux fixture and QEMU
        run: |
          set -euo pipefail
          for file in kernel8.img bcm2710-rpi-3-b.dtb; do
            curl --fail --location --retry 5 \
              --output "$OFFICIAL_DIR/$file" \
              "https://raw.githubusercontent.com/raspberrypi/firmware/${RPI_FIRMWARE_COMMIT}/boot/$file"
          done
          python3 scripts/vc4/fetch-linux-vc4-modules.py \
            --base-url \
            "https://raw.githubusercontent.com/raspberrypi/firmware/${RPI_FIRMWARE_COMMIT}/modules/${RPI_KERNEL_RELEASE}" \
            --out-dir "$MODULE_DIR" --target vc4
          bash scripts/vc4/build-linux-v3d-modular-initramfs.sh \
            "$INITRAMFS_DIR" "$MODULE_DIR"
          dtc -q -@ -I dts -O dtb \
            -o "$DTB_DIR/native-kms.dtbo" \
            tests/vc4/vc4-kms-frontier-overlay.dts
          bash scripts/vc4/build-vc4-kms-linux-dtb.sh \
            "$OFFICIAL_DIR/bcm2710-rpi-3-b.dtb" \
            "$DTB_DIR/native-kms.dtbo" \
            "$DTB_DIR/native-kms.dtb"
          ./configure \
            --target-list=aarch64-softmmu \
            --disable-docs --disable-werror
          ninja -C build qemu-system-aarch64
          python3 scripts/vc4/property-clock-enumeration-smoke.py \
            --qemu build/qemu-system-aarch64

      - name: Capture the clock-corrected baseline
        run: |
          set -euo pipefail
          python3 scripts/vc4/raspi3-linux-probe.py \
            --mode linux-direct \
            --qemu build/qemu-system-aarch64 \
            --kernel "$OFFICIAL_DIR/kernel8.img" \
            --dtb "$DTB_DIR/native-kms.dtb" \
            --initrd "$INITRAMFS_DIR/initramfs.cpio.gz" \
            --out-dir "$BEFORE_DIR" \
            --seconds 60 --sample-interval 5 || true
          test -f "$BEFORE_DIR/serial.log"
          grep -Fq VC4_LINUX_MODULE_CLOSURE_OK "$BEFORE_DIR/serial.log"
          if grep -Fq 'of_clk_hw_onecell_get: invalid index 9' \
              "$BEFORE_DIR/serial.log"; then
            echo 'clock contract did not clear the original index-9 failure' >&2
            exit 1
          fi
          if grep -Fq 'Failed to get pixel clock' "$BEFORE_DIR/serial.log"; then
            echo 'clock contract did not clear the original pixel-clock failure' >&2
            exit 1
          fi

      - name: Attach a deterministic monitor to the BCM2835 HDMI DDC bus
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          kconfig_path = Path("hw/arm/Kconfig")
          kconfig = kconfig_path.read_text()
          raspi_start = kconfig.index("config RASPI\n")
          raspi_end = kconfig.index("\nconfig ", raspi_start + 1)
          raspi = kconfig[raspi_start:raspi_end]
          if "    select DDC\n" not in raspi:
              anchor = "    select BCM2835_I2C\n"
              if raspi.count(anchor) != 1:
                  raise SystemExit("RASPI BCM2835_I2C anchor changed")
              raspi = raspi.replace(anchor, anchor + "    select DDC\n", 1)
              kconfig = kconfig[:raspi_start] + raspi + kconfig[raspi_end:]
              kconfig_path.write_text(kconfig)

          path = Path("hw/arm/bcm2835_peripherals.c")
          source = path.read_text()
          include = '#include "hw/display/i2c-ddc.h"\n'
          if include not in source:
              anchor = '#include "hw/arm/bcm2835_peripherals.h"\n'
              if source.count(anchor) != 1:
                  raise SystemExit("peripherals include anchor changed")
              source = source.replace(anchor, anchor + include, 1)

          define = "#define BCM2835_HDMI_DDC_ADDRESS 0x50\n"
          if define not in source:
              anchor = "#define ORGATED_I2C_IRQ_COUNT 3\n"
              if source.count(anchor) != 1:
                  raise SystemExit("peripherals define anchor changed")
              source = source.replace(anchor, anchor + "\n" + define, 1)

          creation = """    /*
           * BSC2 is the DDC controller consumed by the BCM2835 HDMI node.
           * Model a connected deterministic monitor so a headless QEMU run
           * can exercise physical connector and mode discovery.
           */
          i2c_slave_create_simple(s->i2c[2].bus, TYPE_I2CDDC,
                                  BCM2835_HDMI_DDC_ADDRESS);

          """
          if "TYPE_I2CDDC" not in source.split("static void", 1)[-1]:
              anchor = """    for (n = 0; n < 3; n++) {
                  if (!sysbus_realize(SYS_BUS_DEVICE(&s->i2c[n]), errp)) {
                      return;
                  }
              }

          """
              if source.count(anchor) != 1:
                  raise SystemExit("I2C realization anchor changed")
              source = source.replace(anchor, anchor + creation, 1)
          path.write_text(source)
          PY
          git diff --check
          ninja -C build qemu-system-aarch64

      - name: Capture the DDC delta
        run: |
          set -euo pipefail
          python3 scripts/vc4/raspi3-linux-probe.py \
            --mode linux-direct \
            --qemu build/qemu-system-aarch64 \
            --kernel "$OFFICIAL_DIR/kernel8.img" \
            --dtb "$DTB_DIR/native-kms.dtb" \
            --initrd "$INITRAMFS_DIR/initramfs.cpio.gz" \
            --out-dir "$AFTER_DIR" \
            --seconds 60 --sample-interval 5 || true
          test -f "$AFTER_DIR/serial.log"
          grep -Fq VC4_LINUX_MODULE_CLOSURE_OK "$AFTER_DIR/serial.log"

      - name: Prove and record whether DDC advances native KMS
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          before = Path("/tmp/vc4-ddc-before/serial.log").read_text(errors="replace")
          after = Path("/tmp/vc4-ddc-after/serial.log").read_text(errors="replace")
          markers = (
              "VC4_LINUX_KMS_RESOURCES_OK",
              "VC4_LINUX_KMS_CRTC_OK",
              "VC4_LINUX_KMS_CONNECTOR_OBJECT_OK",
              "VC4_LINUX_KMS_PHYSICAL_CONNECTOR_OK",
              "VC4_LINUX_KMS_CONNECTED_OK",
              "VC4_LINUX_KMS_MODE_OK",
              "VC4_LINUX_KMS_TOPOLOGY_OK",
          )
          before_markers = {marker: marker in before for marker in markers}
          after_markers = {marker: marker in after for marker in markers}
          before_score = sum(before_markers.values())
          after_score = sum(after_markers.values())
          bind_re = re.compile(r"vc4-drm soc:gpu: bound (\S+) \(ops (\S+) \[vc4\]\)")
          before_components = bind_re.findall(before)
          after_components = bind_re.findall(after)
          improved = (
              after_score > before_score
              or len(set(after_components)) > len(set(before_components))
              or (
                  "Failed to get ddc i2c adapter by node" in before
                  and "Failed to get ddc i2c adapter by node" not in after
              )
          )
          record = {
              "schema_version": 1,
              "improved": improved,
              "before_marker_score": before_score,
              "after_marker_score": after_score,
              "before_markers": before_markers,
              "after_markers": after_markers,
              "before_components": before_components,
              "after_components": after_components,
              "before_relevant_tail": [
                  line for line in before.splitlines()
                  if "vc4" in line.lower() or "drm" in line.lower()
                  or "clock" in line.lower() or "ddc" in line.lower()
              ][-160:],
              "after_relevant_tail": [
                  line for line in after.splitlines()
                  if "vc4" in line.lower() or "drm" in line.lower()
                  or "clock" in line.lower() or "ddc" in line.lower()
              ][-160:],
          }
          Path("VC4_LINUX_KMS_DDC_DELTA.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n"
          )
          lines = [
              "# VC4 Linux KMS HDMI DDC delta",
              "",
              f"DDC advances the frontier: **{'true' if improved else 'false'}**",
              "",
              f"- Marker score before: `{before_score}`",
              f"- Marker score after: `{after_score}`",
              f"- Bound components before: `{len(set(before_components))}`",
              f"- Bound components after: `{len(set(after_components))}`",
              "",
              "The hardware change is retained only when this controlled "
              "two-boot comparison advances a native-KMS marker, binds an "
              "additional VC4 component, or clears an explicit missing-DDC "
              "supplier failure.",
          ]
          Path("VC4_LINUX_KMS_DDC_DELTA.md").write_text("\n".join(lines) + "\n")
          if not improved:
              Path("/tmp/ddc-not-improved").touch()
          PY

          if test -e /tmp/ddc-not-improved; then
            git restore -- hw/arm/Kconfig hw/arm/bcm2835_peripherals.c
          fi
          git diff --check

      - name: Publish the measured delta and remove this transient workflow
        run: |
          set -euo pipefail
          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git add -- \
            VC4_LINUX_KMS_DDC_DELTA.json \
            VC4_LINUX_KMS_DDC_DELTA.md \
            hw/arm/Kconfig \
            hw/arm/bcm2835_peripherals.c
          git rm -- .github/workflows/vc4-kms-ddc-delta.yml
          git commit -m "test/vc4: measure HDMI DDC native-KMS delta"
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
