name: WD40 AArch64 memory-read diagnostic

on:
  push:
    branches:
      - wd40/qol-memory-read-aarch64-diagnostic
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  probe-aarch64:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Download the validated diagnostic emulator
        uses: actions/download-artifact@v4
        with:
          name: qemu-system-aarch64
          repository: blanham/qemu
          run-id: 33040823112
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract emulator
        run: |
          tar -xzf qemu-system-aarch64.tar.gz
          chmod +x qemu-system-aarch64

      - name: Locate a reset-stable RAM fixture
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess

          value_addresses = (
              0x40010000,
              0x40100000,
              0x41000000,
              0x44000000,
              0x47F00000,
          )
          file_address = 0x44001000
          Path("wd40-seed.bin").write_bytes(b"WXYZ")

          loader = []
          for index, address in enumerate(value_addresses):
              loader += [
                  "-device",
                  (
                      f"loader,id=wd40-value{index},addr=0x{address:x},"
                      "data=0x44434241,data-len=4"
                  ),
              ]
          loader += [
              "-device",
              (
                  f"loader,id=wd40-file,addr=0x{file_address:x},"
                  "file=wd40-seed.bin,force-raw=on"
              ),
          ]

          requests = [
              {"execute": "qmp_capabilities", "id": "cap"},
          ]
          for index, address in enumerate((*value_addresses, file_address)):
              for space in ("physical", "virtual"):
                  requests.append(
                      {
                          "execute": "x-wd40-read-memory",
                          "arguments": {
                              "space": space,
                              "address": address,
                              "size": 4,
                          },
                          "id": f"{space}-{index}",
                      }
                  )
          requests.append({"execute": "quit", "id": "quit"})

          command = [
              "./qemu-system-aarch64",
              "-machine", "virt,accel=tcg",
              "-cpu", "max",
              "-smp", "2",
              "-m", "128M",
              *loader,
              "-display", "none",
              "-serial", "none",
              "-monitor", "none",
              "-nodefaults",
              "-S",
              "-qmp", "stdio",
          ]
          run = subprocess.run(
              command,
              input="\n".join(json.dumps(item) for item in requests) + "\n",
              text=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              timeout=60,
              check=False,
          )

          replies = {}
          for line in run.stdout.splitlines():
              try:
                  item = json.loads(line)
              except json.JSONDecodeError:
                  continue
              identifier = item.get("id")
              if isinstance(identifier, str) and (
                  identifier.startswith("physical-")
                  or identifier.startswith("virtual-")
              ):
                  replies[identifier] = item

          for index, address in enumerate((*value_addresses, file_address)):
              print(f"ADDRESS 0x{address:x}")
              print(json.dumps(replies.get(f"physical-{index}"), sort_keys=True))
              print(json.dumps(replies.get(f"virtual-{index}"), sort_keys=True))
          if run.stderr:
              print("STDERR", run.stderr.strip())
          print(f"RETURN_CODE {run.returncode}")
          PY
