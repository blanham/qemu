name: VC4-controlled Cortex-A53 release

on:
  push:
    branches:
      - agent/vc4-arm-release

permissions:
  contents: write

jobs:
  build-and-execute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install QEMU build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            pkg-config \
            python3 \
            python3-venv \
            libglib2.0-dev \
            libpixman-1-dev \
            zlib1g-dev

      - name: Materialize ARM-release tranche
        run: |
          python3 scripts/vc4/arm-release-bootstrap.py
          chmod +x scripts/vc4/arm-release-smoke.py
          git diff --check

      - name: Configure both guest targets
        run: |
          ./configure \
            --target-list=aarch64-softmmu,vc4-softmmu \
            --disable-docs \
            --disable-werror

      - name: Build linked and native frontends
        run: |
          ninja -C build qemu-system-aarch64 qemu-system-vc4

      - name: Verify heterogeneous machine registration
        run: |
          build/qemu-system-aarch64 -machine help | tee /tmp/aarch64-machines.txt
          grep -q 'vc4-arm-release-smoke' /tmp/aarch64-machines.txt

      - name: Execute VC4-to-ARM release regression
        run: |
          python3 scripts/vc4/arm-release-smoke.py \
            build/qemu-system-aarch64

      - name: Preserve the green implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hw/arm/meson.build \
                  hw/arm/vc4_arm_release_smoke.c \
                  scripts/vc4/arm-release-smoke.py
          if git diff --cached --quiet; then
            echo "No generated implementation changes to commit."
            exit 0
          fi
          git commit -m "hw/arm: prove VC4-controlled Cortex-A53 release"
          git push origin HEAD:${GITHUB_REF_NAME}
