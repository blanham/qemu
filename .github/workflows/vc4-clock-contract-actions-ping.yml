name: VC4 clock contract Actions ping

on:
  push:
    branches:
      - agent/vc4-linux-kms-clock-contract-v2
    paths:
      - .github/workflows/vc4-clock-contract-actions-ping.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Publish sentinel
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > VC4_CLOCK_ACTIONS_PING
          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git add VC4_CLOCK_ACTIONS_PING
          git rm .github/workflows/vc4-clock-contract-actions-ping.yml
          git commit -m "test/vc4: confirm clock-contract Actions execution"
          git pull --rebase origin agent/vc4-linux-kms-clock-contract-v2
          git push origin HEAD:agent/vc4-linux-kms-clock-contract-v2
