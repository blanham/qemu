name: VC4 Raspberry Pi HDMI DDC monitor

on:
  push:
    branches:
      - agent/vc4-linux-kms-ddc-monitor
    paths:
      - .github/workflows/vc4-kms-ddc-monitor.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-kms-ddc-monitor
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Attach a deterministic monitor to the HDMI DDC bus
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{label}: expected one source anchor, found {count}"
                  )
              path.write_text(text.replace(old, new, 1))

          replace_once(
              Path("hw/arm/Kconfig"),
              "    select BCM2835_SPI\n"
              "    select BCM2835_I2C\n",
              "    select BCM2835_SPI\n"
              "    select BCM2835_I2C\n"
              "    select DDC\n",
              "RASPI DDC Kconfig",
          )

          peripherals = Path("hw/arm/bcm2835_peripherals.c")
          replace_once(
              peripherals,
              '#include "hw/arm/bcm2835_peripherals.h"\n',
              '#include "hw/arm/bcm2835_peripherals.h"\n'
              '#include "hw/display/i2c-ddc.h"\n',
              "DDC include",
          )
          replace_once(
              peripherals,
              "#define ORGATED_I2C_IRQ_COUNT 3\n",
              "#define ORGATED_I2C_IRQ_COUNT 3\n\n"
              "#define BCM2835_HDMI_DDC_ADDRESS 0x50\n",
              "DDC address",
          )

          old_i2c = (
              "    for (n = 0; n < 3; n++) {\n"
              "        if (!sysbus_realize(SYS_BUS_DEVICE(&s->i2c[n]), errp)) {\n"
              "            return;\n"
              "        }\n"
              "    }\n"
              "\n"
              "    memory_region_add_subregion(&s->peri_mr, BSC0_OFFSET,\n"
          )
          new_i2c = (
              "    for (n = 0; n < 3; n++) {\n"
              "        if (!sysbus_realize(SYS_BUS_DEVICE(&s->i2c[n]), errp)) {\n"
              "            return;\n"
              "        }\n"
              "    }\n"
              "\n"
              "    /*\n"
              "     * BSC2 is the HDMI DDC controller on BCM2835.  Model a\n"
              "     * connected monitor with deterministic EDID so native VC4\n"
              "     * KMS can probe physical display modes without host display\n"
              "     * dependencies.\n"
              "     */\n"
              "    i2c_slave_create_simple(s->i2c[2].bus, TYPE_I2CDDC,\n"
              "                            BCM2835_HDMI_DDC_ADDRESS);\n"
              "\n"
              "    memory_region_add_subregion(&s->peri_mr, BSC0_OFFSET,\n"
          )
          replace_once(peripherals, old_i2c, new_i2c, "BSC2 DDC attachment")
          PY

          python3 -m py_compile \
            scripts/vc4/property-power-domain-smoke.py \
            scripts/vc4/property-clock-enumeration-smoke.py \
            scripts/vc4/bcm2835-hdmi-ddc-smoke.py
          git diff --check
          grep -Fq 'select DDC' hw/arm/Kconfig
          grep -Fq TYPE_I2CDDC hw/arm/bcm2835_peripherals.c

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build pkg-config python3 \
            libglib2.0-dev libpixman-1-dev zlib1g-dev

      - name: Build both Raspberry Pi frontends
        run: |
          set -euo pipefail
          ./configure \
            --target-list=aarch64-softmmu,vc4-softmmu \
            --disable-docs --disable-werror
          ninja -C build qemu-system-aarch64 qemu-system-vc4

      - name: Run property and HDMI DDC witnesses
        run: |
          set -euo pipefail
          python3 scripts/vc4/property-clock-enumeration-smoke.py \
            --qemu build/qemu-system-aarch64 \
            | tee /tmp/property-clocks.log
          python3 scripts/vc4/property-power-domain-smoke.py \
            --qemu build/qemu-system-aarch64 \
            | tee /tmp/property-state.log
          python3 scripts/vc4/bcm2835-hdmi-ddc-smoke.py \
            --qemu build/qemu-system-aarch64 \
            | tee /tmp/hdmi-ddc.log

      - name: Publish the validated DDC model
        run: |
          set -euo pipefail
          {
            echo '# VC4 Raspberry Pi HDMI DDC validation'
            echo
            echo 'Validation passed: **true**'
            echo
            echo '- Both AArch64 and VC4 system frontends built.'
            echo '- Firmware clock enumeration passed.'
            echo '- Firmware power/domain/GPIO state passed.'
            echo '- BSC2 returned a valid, checksummed monitor EDID.'
            echo '- DDC pointer addressing and reset behavior passed.'
            echo
            echo '```text'
            cat /tmp/hdmi-ddc.log
            echo '```'
          } > VC4_HDMI_DDC_STATUS.md

          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git add -- \
            hw/arm/Kconfig \
            hw/arm/bcm2835_peripherals.c \
            scripts/vc4/bcm2835-hdmi-ddc-smoke.py \
            VC4_HDMI_DDC_STATUS.md
          git rm -- .github/workflows/vc4-kms-ddc-monitor.yml
          git commit -m \
            "hw/arm: expose monitor EDID on Raspberry Pi HDMI DDC [skip ci]"
          git pull --rebase origin agent/vc4-linux-kms-ddc-monitor
          git push origin HEAD:agent/vc4-linux-kms-ddc-monitor
