name: VC4 V3D T and LT render-target integration

on:
  push:
    branches:
      - agent/vc4-linux-mesa-gles2-frontier
    paths:
      - .github/workflows/vc4-v3d-tiling-materialize.yml
      - scripts/vc4/v3d-tiling-materialize.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-v3d-tiling-materialize
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      EVIDENCE_DIR: vc4-v3d-tiling-evidence
      BRANCH: agent/vc4-linux-mesa-gles2-frontier

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev libpixman-1-dev \
            ninja-build pkg-config python3 zlib1g-dev
          rm -rf "$EVIDENCE_DIR"
          mkdir -p "$EVIDENCE_DIR"
          git rev-parse HEAD > "$EVIDENCE_DIR/INPUT_SHA"

      - name: Materialize T and LT tiling support
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/vc4/v3d-tiling-materialize.py
          python3 scripts/vc4/v3d-tiling-materialize.py
          python3 -m py_compile scripts/vc4/v3d-tiling-smoke.py
          git diff --check

          sha256sum \
            include/hw/display/vc4_tiling.h \
            hw/display/vc4_tiling.c \
            tests/unit/test-vc4-tiling.c \
            scripts/vc4/v3d-tiling-smoke.py \
            hw/display/bcm2835_v3d.c \
            > "$EVIDENCE_DIR/FIRST_MATERIALIZATION_SHA256SUMS"

          python3 scripts/vc4/v3d-tiling-materialize.py
          sha256sum \
            include/hw/display/vc4_tiling.h \
            hw/display/vc4_tiling.c \
            tests/unit/test-vc4-tiling.c \
            scripts/vc4/v3d-tiling-smoke.py \
            hw/display/bcm2835_v3d.c \
            > "$EVIDENCE_DIR/SECOND_MATERIALIZATION_SHA256SUMS"
          cmp \
            "$EVIDENCE_DIR/FIRST_MATERIALIZATION_SHA256SUMS" \
            "$EVIDENCE_DIR/SECOND_MATERIALIZATION_SHA256SUMS"
          git diff --binary > "$EVIDENCE_DIR/product.patch"

      - name: Configure and build both frontends
        run: |
          set -euo pipefail
          ./configure \
            --target-list=aarch64-softmmu,vc4-softmmu \
            --disable-docs --disable-werror \
            --extra-cflags=-Werror=implicit-function-declaration \
            2>&1 | tee "$EVIDENCE_DIR/configure.log"
          ninja -C build \
            qemu-system-aarch64 qemu-system-vc4 \
            tests/unit/test-vc4-tiling \
            tests/unit/test-vc4-qpu \
            tests/unit/test-vc4-qpu-contract \
            tests/unit/test-vc4-v3d-pipeline \
            2>&1 | tee "$EVIDENCE_DIR/build.log"

      - name: Run focused unit and device regressions
        run: |
          set -euo pipefail
          build/tests/unit/test-vc4-tiling --tap -k \
            2>&1 | tee "$EVIDENCE_DIR/tiling-unit.tap"
          build/tests/unit/test-vc4-qpu --tap -k \
            2>&1 | tee "$EVIDENCE_DIR/qpu.tap"
          build/tests/unit/test-vc4-qpu-contract --tap -k \
            2>&1 | tee "$EVIDENCE_DIR/qpu-contract.tap"
          build/tests/unit/test-vc4-v3d-pipeline --tap -k \
            2>&1 | tee "$EVIDENCE_DIR/pipeline.tap"
          python3 scripts/vc4/v3d-smoke.py \
            --qemu build/qemu-system-aarch64 \
            2>&1 | tee "$EVIDENCE_DIR/v3d-linear.log"
          python3 scripts/vc4/v3d-tiling-smoke.py \
            --qemu build/qemu-system-aarch64 \
            2>&1 | tee "$EVIDENCE_DIR/v3d-tiling.log"

      - name: Record validated tiling checkpoint
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          import os
          import subprocess

          source_sha = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip()
          record = {
              'schema_version': 1,
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'source_sha': source_sha,
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
              'validated': True,
              'layouts': ['linear-rgba8888', 'lt-rgba8888', 't-rgba8888'],
              't_tile_bytes': 4096,
              'subtile_bytes': 1024,
              'utile': {'width': 4, 'height': 4, 'bytes': 64},
              'tests': {
                  'tiling_unit': True,
                  'qpu_measured': True,
                  'qpu_contract': True,
                  'primitive_pipeline': True,
                  'linear_render_store': True,
                  't_lt_render_store': True,
                  'dual_frontend_build': True,
              },
              'mesa_gate': 'not-claimed-by-this-workflow',
          }
          Path('VC4_V3D_TILING_STATUS.json').write_text(
              json.dumps(record, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          Path('VC4_V3D_TILING_STATUS.md').write_text(
              '# VC4 V3D RGBA8888 tiling checkpoint\n\n'
              'Validation passed: **true**\n\n'
              '- Linear, LT, and T RGBA8888 address translation passed.\n'
              '- T-tile odd-row reversal and subtile ordering passed.\n'
              '- CT1 stores completed for T and LT render targets.\n'
              '- Existing QPU, primitive-pipeline, and linear-render gates passed.\n'
              '- Both AArch64/VC4 QEMU frontends built successfully.\n\n'
              'This checkpoint removes the measured `config=0x0044` render-store '
              'failure. It does not claim the later Mesa TMU/readback resolve is '
              'implemented; the real Mesa workflow determines that frontier.\n',
              encoding='utf-8',
          )
          PY
          cp VC4_V3D_TILING_STATUS.* "$EVIDENCE_DIR/"
          git diff --check

      - name: Upload complete validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-v3d-tiling-${{ github.run_attempt }}
          path: vc4-v3d-tiling-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Publish only the tested product tree
        run: |
          set -euo pipefail
          git rm -- \
            .github/workflows/vc4-v3d-tiling-materialize.yml \
            scripts/vc4/v3d-tiling-materialize.py
          rm -rf "$EVIDENCE_DIR"
          git add -A
          git diff --cached --check
          git config user.name "VC4 Tiling CI"
          git config user.email "vc4-tiling-ci@users.noreply.github.com"
          git commit -m "hw/display: model VC4 T and LT render layouts"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
