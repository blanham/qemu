name: VC4 Actions observer

on:
  push:
    branches:
      - agent/vc4-actions-observer
    paths:
      - .github/workflows/vc4-actions-observer.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/vc4-actions-observer
          fetch-depth: 0

      - name: Capture target workflow runs and jobs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          api = f'https://api.github.com/repos/{repo}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'vc4-actions-observer',
          }

          def get(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          targets = {
              'deterministic': {
                  'branch': 'agent/vc4-deterministic-time-linux',
                  'workflow': 'vc4-deterministic-time-linux.yml',
              },
              'direct': {
                  'branch': 'agent/vc4-hetero-direct-linux',
                  'workflow': 'vc4-hetero-direct-linux.yml',
              },
          }
          output = {
              'schema_version': 1,
              'observed_at': datetime.now(timezone.utc).isoformat(),
              'targets': {},
          }
          for key, target in targets.items():
              query = urllib.parse.urlencode({
                  'branch': target['branch'],
                  'per_page': 20,
              })
              runs = get(f"{api}/actions/workflows/{target['workflow']}/runs?{query}")
              records = []
              for run in runs.get('workflow_runs', [])[:10]:
                  jobs = get(f"{api}/actions/runs/{run['id']}/jobs?per_page=100")
                  records.append({
                      field: run.get(field)
                      for field in (
                          'id', 'name', 'head_branch', 'head_sha', 'event',
                          'status', 'conclusion', 'run_number', 'run_attempt',
                          'created_at', 'updated_at', 'html_url'
                      )
                  } | {
                      'jobs': [
                          {
                              field: job.get(field)
                              for field in (
                                  'id', 'name', 'status', 'conclusion',
                                  'started_at', 'completed_at', 'html_url'
                              )
                          } | {
                              'steps': [
                                  {
                                      field: step.get(field)
                                      for field in (
                                          'number', 'name', 'status',
                                          'conclusion', 'started_at',
                                          'completed_at'
                                      )
                                  }
                                  for step in job.get('steps', [])
                              ]
                          }
                          for job in jobs.get('jobs', [])
                      ],
                  })
              output['targets'][key] = {
                  **target,
                  'runs': records,
              }
          Path('VC4_ACTIONS_OBSERVER.json').write_text(
              json.dumps(output, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(output, indent=2, sort_keys=True))
          PY

      - name: Publish observation and remove workflow
        run: |
          set -euo pipefail
          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git rm -- .github/workflows/vc4-actions-observer.yml
          git add -- VC4_ACTIONS_OBSERVER.json
          git diff --cached --check
          git commit -m "ci/vc4: capture active workflow state [skip ci]"
          git pull --rebase origin agent/vc4-actions-observer
          git push origin HEAD:agent/vc4-actions-observer
