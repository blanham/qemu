name: VC4 Actions observer refresh

on:
  push:
    branches:
      - agent/vc4-actions-observer
    paths:
      - .github/workflows/vc4-actions-observer.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/vc4-actions-observer
          fetch-depth: 0
      - name: Capture current VC4 runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json, os, urllib.parse, urllib.request
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'vc4-actions-observer',
          }
          api = f"https://api.github.com/repos/{os.environ['REPOSITORY']}"
          def get(url):
              with urllib.request.urlopen(
                  urllib.request.Request(url, headers=headers), timeout=60
              ) as response:
                  return json.load(response)
          targets = [
              ('deterministic', 'agent/vc4-deterministic-time-linux',
               'vc4-deterministic-time-linux.yml'),
              ('deterministic-fix', 'agent/vc4-deterministic-time-linux',
               'vc4-fix-deterministic-classifier.yml'),
              ('direct', 'agent/vc4-hetero-direct-linux',
               'vc4-hetero-direct-linux.yml'),
              ('direct-dispatch', 'agent/vc4-hetero-direct-linux',
               'vc4-dispatch-direct-linux-repair.yml'),
          ]
          result = {
              'schema_version': 2,
              'observed_at': datetime.now(timezone.utc).isoformat(),
              'targets': {},
          }
          for key, branch, workflow in targets:
              query = urllib.parse.urlencode({'branch': branch, 'per_page': 10})
              try:
                  runs = get(f'{api}/actions/workflows/{workflow}/runs?{query}')
              except Exception as exc:
                  result['targets'][key] = {
                      'branch': branch, 'workflow': workflow,
                      'error': f'{type(exc).__name__}: {exc}',
                  }
                  continue
              records = []
              for run in runs.get('workflow_runs', [])[:5]:
                  jobs = get(f"{api}/actions/runs/{run['id']}/jobs?per_page=100")
                  records.append({
                      field: run.get(field) for field in (
                          'id', 'head_sha', 'event', 'status', 'conclusion',
                          'run_number', 'run_attempt', 'created_at',
                          'updated_at', 'html_url'
                      )
                  } | {
                      'jobs': [{
                          field: job.get(field) for field in (
                              'id', 'name', 'status', 'conclusion',
                              'started_at', 'completed_at', 'html_url'
                          )
                      } | {
                          'steps': [{
                              field: step.get(field) for field in (
                                  'number', 'name', 'status', 'conclusion',
                                  'started_at', 'completed_at'
                              )
                          } for step in job.get('steps', [])]
                      } for job in jobs.get('jobs', [])],
                  })
              result['targets'][key] = {
                  'branch': branch, 'workflow': workflow, 'runs': records,
              }
          Path('VC4_ACTIONS_OBSERVER.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n'
          )
          PY
      - name: Publish refreshed observation
        run: |
          set -euo pipefail
          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git rm -- .github/workflows/vc4-actions-observer.yml
          git add -- VC4_ACTIONS_OBSERVER.json
          git commit -m "ci/vc4: refresh active workflow state [skip ci]"
          git pull --rebase origin agent/vc4-actions-observer
          git push origin HEAD:agent/vc4-actions-observer
