name: VC4 direct Linux proof promotion

on:
  push:
    branches:
      - agent/vc4-hetero-direct-linux
    paths:
      - .github/workflows/vc4-direct-linux-promote.yml
      - VC4_HETERO_DIRECT_LINUX_STATUS.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-direct-linux-proof-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require a complete Linux and framebuffer proof
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          path = Path("VC4_HETERO_DIRECT_LINUX_STATUS.json")
          if not path.is_file():
              raise SystemExit("direct Linux status is missing")
          status = json.loads(path.read_text(encoding="utf-8"))
          bare = status.get("bare") or {}
          linux = status.get("linux") or {}
          required = {
              "bare framebuffer": bool(bare.get("passed")),
              "Linux version": bool(linux.get("linux_version_seen")),
              "Linux init": bool(linux.get("init_seen")),
              "Linux framebuffer marker": bool(
                  linux.get("framebuffer_marker_seen")
                  or linux.get("fb_marker_seen")
                  or linux.get("fb_ok_seen")
              ),
              "Linux QMP scanout": bool(linux.get("passed")),
          }
          failed = [name for name, passed in required.items() if not passed]
          if failed:
              raise SystemExit(
                  "direct-control proof is incomplete: " + ", ".join(failed)
              )
          Path("VC4_LINUX_FRAMEBUFFER_DIRECT_PROOF.md").write_text(
              "# VC4 heterogeneous Linux/framebuffer control proof\n\n"
              f"Source commit: `{status.get('source_sha', 'unknown')}`\n\n"
              f"Workflow run: `{status.get('run_id', 'unknown')}`\n\n"
              "Validated results:\n\n"
              "- both AArch64 and VC4 QEMU frontends built;\n"
              "- processor-control and multicore-sync regressions passed;\n"
              "- the bare-metal property-mailbox framebuffer witness passed;\n"
              "- the pinned Raspberry Pi Linux kernel reached `/init`;\n"
              "- `/init` opened and painted `/dev/fb0`;\n"
              "- QMP scanout matched the four-quadrant framebuffer witness.\n",
              encoding="utf-8",
          )
          print(json.dumps(required, indent=2))
          PY

      - name: Publish the proof and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/vc4-direct-linux-promote.yml
          git add VC4_LINUX_FRAMEBUFFER_DIRECT_PROOF.md
          git diff --cached --check
          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git commit -m "tests/vc4: record Linux framebuffer control proof"
          git pull --rebase origin agent/vc4-hetero-direct-linux
          git push origin HEAD:agent/vc4-hetero-direct-linux
          git push --force-with-lease \
            origin HEAD:agent/vc4-linux-framebuffer-bringup

      - name: Kick the stock-firmware Linux frontier
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/vc4-deterministic-time-linux
          git switch -C agent/vc4-deterministic-time-linux \
            origin/agent/vc4-deterministic-time-linux
          workflow=$(grep -l -E \
            'deterministic.*(Linux|linux)|(Linux|linux).*deterministic' \
            .github/workflows/*.yml .github/workflows/*.yaml 2>/dev/null \
            | head -n 1 || true)
          if [ -z "$workflow" ]; then
            echo "No deterministic-time Linux workflow was found" >&2
            exit 1
          fi
          printf '\n# Direct Linux/framebuffer control validated at %s\n' \
            "${GITHUB_SHA}" >> "$workflow"
          git add "$workflow"
          git diff --cached --check
          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git commit -m "ci/vc4: rerun stock Linux after direct control proof"
          git push origin HEAD:agent/vc4-deterministic-time-linux
