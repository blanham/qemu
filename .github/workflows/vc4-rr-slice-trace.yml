name: VC4 RR slice trace

on:
  push:
    branches:
      - agent/vc4-stock-bootcode
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vc4-rr-slice-trace-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trace-rr-slices:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    env:
      RPI_FIRMWARE_COMMIT: 3d301dd924bcd758a4c8cb19fe8531031f033f43

    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            ninja-build \
            pkg-config \
            python3 \
            python3-venv \
            libglib2.0-dev \
            libpixman-1-dev \
            zlib1g-dev

      - name: Materialize bounded scheduler diagnostics
        run: |
          python3 -m py_compile scripts/vc4/rr-slice-trace-fixup.py
          python3 scripts/vc4/rr-slice-trace-fixup.py
          first="$(sha256sum accel/tcg/tcg-accel-ops-rr.c)"
          python3 scripts/vc4/rr-slice-trace-fixup.py
          second="$(sha256sum accel/tcg/tcg-accel-ops-rr.c)"
          test "$first" = "$second"
          grep -q 'VC4_RR_SLICE enter' accel/tcg/tcg-accel-ops-rr.c
          grep -q 'VC4_RR_SLICE leave' accel/tcg/tcg-accel-ops-rr.c
          grep -q 'VC4_RR_KICK seq=' accel/tcg/tcg-accel-ops-rr.c
          git diff --check

      - name: Configure and build linked targets
        run: |
          ./configure \
            --target-list=aarch64-softmmu,vc4-softmmu \
            --disable-docs \
            --disable-werror
          ninja -C build qemu-system-aarch64 qemu-system-vc4 \
            > /tmp/vc4-rr-slice-build.log 2>&1

      - name: Download pinned official bootcode.bin
        run: |
          curl --fail --location --retry 4 \
            --output /tmp/bootcode.bin \
            "https://raw.githubusercontent.com/raspberrypi/firmware/${RPI_FIRMWARE_COMMIT}/boot/bootcode.bin"
          test "$(git hash-object /tmp/bootcode.bin)" = \
            7642d2d89e4235e7d68875ff70688bdde6e71b5a

      - name: Trace stock-firmware CPU slices
        run: |
          set -o pipefail
          python3 scripts/vc4/raspi3-stock-bootcode-0200.py \
            build/qemu-system-aarch64 \
            /tmp/bootcode.bin \
            --seconds 12 \
            --barrier-is-success \
            2>&1 | tee /tmp/vc4-rr-slice-stock.log

          grep -E \
            'VC4_RR_(SLICE|KICK)|STOCK_BOOTCODE_(TRACE|BARRIER)|vc4-debug-' \
            /tmp/vc4-rr-slice-stock.log \
            > /tmp/vc4-rr-slice-summary.log || true
          tail -n 500 /tmp/vc4-rr-slice-summary.log
          test -s /tmp/vc4-rr-slice-summary.log

      - name: Preserve scheduler trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-rr-slice-trace-${{ github.run_attempt }}
          path: |
            /tmp/vc4-rr-slice-build.log
            /tmp/vc4-rr-slice-stock.log
            /tmp/vc4-rr-slice-summary.log
          if-no-files-found: warn
          retention-days: 14
