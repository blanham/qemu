name: VC4 stock boot SDHOST candidate matrix

on:
  push:
    branches:
      - agent/vc4-deterministic-time-linux
    paths:
      - .github/workflows/vc4-stock-sdhost-matrix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-stock-sdhost-candidate-matrix
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RPI_FIRMWARE_COMMIT: 3d301dd924bcd758a4c8cb19fe8531031f033f43
      MATRIX_DIR: /tmp/vc4-stock-sdhost-matrix

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            binutils-aarch64-linux-gnu \
            curl ninja-build pkg-config python3 python3-venv \
            libglib2.0-dev libpixman-1-dev zlib1g-dev

      - name: Fetch candidate branches and pinned firmware
        shell: bash
        run: |
          set -euo pipefail
          candidates=(
            agent/vc4-sdhost-transfer-fix
            agent/vc4-sdhost-open-ended-hblc
            agent/vc4-sdhost-open-ended-transfer
            agent/vc4-sdhost-zero-unbounded
            agent/vc4-sdhost-sticky-data-flag
            agent/vc4-sdhost-stop-semantics-probe
            agent/vc4-sdhost-transfer-semantics-probe
            agent/vc4-sdhost-open-transfer-probe
          )
          for branch in "${candidates[@]}"; do
            git fetch origin "$branch:refs/remotes/origin/$branch" || true
          done
          mkdir -p "$MATRIX_DIR/firmware"
          for file in bootcode.bin start.elf fixup.dat; do
            curl --fail --location --retry 5 \
              --output "$MATRIX_DIR/firmware/$file" \
              "https://raw.githubusercontent.com/raspberrypi/firmware/${RPI_FIRMWARE_COMMIT}/boot/$file"
          done
          test "$(git hash-object "$MATRIX_DIR/firmware/bootcode.bin")" = \
            7642d2d89e4235e7d68875ff70688bdde6e71b5a
          test "$(git hash-object "$MATRIX_DIR/firmware/start.elf")" = \
            0cefcf3a756740760f9903f35cc3843117853712
          test "$(git hash-object "$MATRIX_DIR/firmware/fixup.dat")" = \
            1845e38de9d4f9a6d9ad7f5273bfe58b2582a7e6

      - name: Build the ARM-entry witness and both QEMU frontends
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$MATRIX_DIR/payload"
          cat >"$MATRIX_DIR/payload/witness.S" <<'EOF'
          .section .text
          .global _start
          .type _start, %function
          _start:
              mov x4, x0
              mov x5, sp
              mrs x6, mpidr_el1
              ldr x0, =0x0000000000001000
              ldr x1, =0x5643345f41524d21
              str x1, [x0]
              str x4, [x0, #8]
              str x5, [x0, #16]
              str x6, [x0, #24]
              dsb sy
          1:
              wfe
              b 1b
              .ltorg
          .size _start, . - _start
          EOF
          aarch64-linux-gnu-as \
            -o "$MATRIX_DIR/payload/witness.o" \
            "$MATRIX_DIR/payload/witness.S"
          aarch64-linux-gnu-ld \
            -nostdlib --entry=_start -Ttext=0x80000 \
            -o "$MATRIX_DIR/payload/witness.elf" \
            "$MATRIX_DIR/payload/witness.o"
          aarch64-linux-gnu-objcopy -O binary \
            "$MATRIX_DIR/payload/witness.elf" \
            "$MATRIX_DIR/payload/kernel8.img"

          ./configure \
            --target-list=aarch64-softmmu,vc4-softmmu \
            --disable-docs --disable-werror
          ninja -C build qemu-system-aarch64 qemu-system-vc4
          python3 scripts/vc4/preg-mutex-smoke.py \
            --qemu build/qemu-system-vc4
          python3 scripts/vc4/msync-smoke.py \
            --qemu build/qemu-system-aarch64

      - name: Run baseline and SDHOST candidates
        id: cases
        shell: bash
        run: |
          set -euo pipefail
          BASE=$(git rev-parse HEAD)
          printf '%s\n' "$BASE" >"$MATRIX_DIR/base.sha"
          mkdir -p "$MATRIX_DIR/cases" "$MATRIX_DIR/patches"
          candidates=(
            baseline
            agent/vc4-sdhost-transfer-fix
            agent/vc4-sdhost-open-ended-hblc
            agent/vc4-sdhost-open-ended-transfer
            agent/vc4-sdhost-zero-unbounded
            agent/vc4-sdhost-sticky-data-flag
            agent/vc4-sdhost-stop-semantics-probe
            agent/vc4-sdhost-transfer-semantics-probe
            agent/vc4-sdhost-open-transfer-probe
          )

          for candidate in "${candidates[@]}"; do
            git reset --hard "$BASE"
            safe=${candidate//\//_}
            patch="$MATRIX_DIR/patches/$safe.patch"
            apply_status=baseline
            if [ "$candidate" != baseline ]; then
              ref="refs/remotes/origin/$candidate"
              if ! git rev-parse --verify "$ref" >/dev/null 2>&1; then
                printf 'missing branch\n' >"$MATRIX_DIR/cases/$safe.skip"
                continue
              fi
              merge_base=$(git merge-base "$BASE" "$ref")
              git diff --binary "$merge_base..$ref" -- \
                hw/sd/bcm2835_sdhost.c \
                include/hw/sd/bcm2835_sdhost.h \
                hw/sd/trace-events \
                hw/sd/meson.build >"$patch"
              if [ ! -s "$patch" ]; then
                printf 'empty scoped patch\n' >"$MATRIX_DIR/cases/$safe.skip"
                continue
              fi
              if ! git apply --3way "$patch"; then
                git reset --hard "$BASE"
                printf 'patch did not apply\n' >"$MATRIX_DIR/cases/$safe.skip"
                continue
              fi
              apply_status=applied
              git diff --check
            fi

            ninja -C build qemu-system-aarch64 \
              >"$MATRIX_DIR/cases/$safe.build.log" 2>&1
            out="$MATRIX_DIR/cases/$safe"
            mkdir -p "$out"
            set +e
            python3 scripts/vc4/raspi3-stock-arm-payload.py \
              build/qemu-system-aarch64 \
              "$MATRIX_DIR/firmware/bootcode.bin" \
              "$MATRIX_DIR/firmware/start.elf" \
              "$MATRIX_DIR/firmware/fixup.dat" \
              "$MATRIX_DIR/payload/kernel8.img" \
              --seconds 75 --out-dir "$out" \
              >"$out/probe.stdout" 2>"$out/probe.stderr"
            rc=$?
            set -e
            printf '%s\n' "$rc" >"$out/probe.rc"
            printf '%s\n' "$candidate" >"$out/candidate"
            printf '%s\n' "$apply_status" >"$out/apply-status"
          done
          git reset --hard "$BASE"
          ninja -C build qemu-system-aarch64

      - name: Classify the matrix without using PC movement as success
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import os
          import re

          root = Path(os.environ["MATRIX_DIR"])
          rows = []
          for case in sorted((root / "cases").iterdir()):
              if not case.is_dir():
                  continue
              result_path = case / "result.json"
              result = (
                  json.loads(result_path.read_text())
                  if result_path.is_file() else {}
              )
              candidate_path = case / "candidate"
              candidate = (
                  candidate_path.read_text().strip()
                  if candidate_path.is_file() else case.name
              )
              vpu_pcs = []
              for cpu in result.get("cpu_snapshot", {}).get("cpus", []):
                  if "vc4" not in str(cpu.get("qom_type", "")).lower():
                      continue
                  match = re.search(
                      r"(?:^|\s)pc\s*=\s*([0-9a-f]+)",
                      str(cpu.get("registers", "")),
                      re.IGNORECASE,
                  )
                  if match:
                      vpu_pcs.append("0x" + match.group(1).lower())
              rows.append({
                  "candidate": candidate,
                  "signature_seen": bool(result.get("signature_seen")),
                  "observed_signature": result.get("observed_signature"),
                  "kernel_word_after_boot": result.get(
                      "kernel_word_after_boot"
                  ),
                  "arm_control0": result.get("arm_control0"),
                  "arm_control1": result.get("arm_control1"),
                  "arm_status": result.get("arm_status"),
                  "pm_proc": result.get("pm_proc"),
                  "vpu_pcs": vpu_pcs,
                  "qemu_returncode": result.get("qemu_returncode"),
                  "probe_error": result.get("probe_error"),
              })

          winners = [row for row in rows if row["signature_seen"]]
          selected = winners[0]["candidate"] if winners else None
          report = {
              "schema_version": 1,
              "base_sha": (root / "base.sha").read_text().strip(),
              "selected": selected,
              "selection_rule": (
                  "ARM witness signature only; VPU PC movement is diagnostic"
              ),
              "cases": rows,
          }
          Path("VC4_STOCK_SDHOST_MATRIX.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          md = [
              "# VC4 stock-boot SDHOST candidate matrix",
              "",
              "Candidates are promoted only when the stock firmware reaches "
              "the supplied AArch64 witness. PC movement alone is not a pass.",
              "",
              "| Candidate | ARM witness | VPU PCs | Kernel word |",
              "|---|---:|---|---|",
          ]
          for row in rows:
              md.append(
                  f"| `{row['candidate']}` | "
                  f"`{row['signature_seen']}` | "
                  f"`{', '.join(row['vpu_pcs'])}` | "
                  f"`{row['kernel_word_after_boot']}` |"
              )
          md += ["", f"Selected: `{selected}`", ""]
          Path("VC4_STOCK_SDHOST_MATRIX.md").write_text("\n".join(md))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"selected={selected or ''}\n")
          print(json.dumps(report, indent=2))
          PY

      - name: Upload all matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-stock-sdhost-matrix-${{ github.run_attempt }}
          path: |
            /tmp/vc4-stock-sdhost-matrix
            VC4_STOCK_SDHOST_MATRIX.json
            VC4_STOCK_SDHOST_MATRIX.md
          if-no-files-found: warn
          retention-days: 14

      - name: Publish a passing candidate on an isolated branch
        if: steps.classify.outputs.selected != ''
        shell: bash
        env:
          SELECTED: ${{ steps.classify.outputs.selected }}
        run: |
          set -euo pipefail
          BASE=$(cat "$MATRIX_DIR/base.sha")
          safe=${SELECTED//\//_}
          git reset --hard "$BASE"
          if [ "$SELECTED" != baseline ]; then
            git apply --3way "$MATRIX_DIR/patches/$safe.patch"
          fi
          rm -f .github/workflows/vc4-stock-sdhost-matrix.yml
          git add -A
          cp /tmp/vc4-stock-sdhost-matrix/base.sha /tmp/base.sha
          git add VC4_STOCK_SDHOST_MATRIX.json VC4_STOCK_SDHOST_MATRIX.md
          git diff --cached --check
          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git commit -m "hw/sd: select stock-firmware ARM-release semantics"
          git push --force-with-lease \
            origin HEAD:agent/vc4-stock-linux-framebuffer

      - name: Preserve a no-winner frontier without changing hardware
        if: steps.classify.outputs.selected == ''
        shell: bash
        run: |
          set -euo pipefail
          BASE=$(cat "$MATRIX_DIR/base.sha")
          git reset --hard "$BASE"
          rm -f .github/workflows/vc4-stock-sdhost-matrix.yml
          git add VC4_STOCK_SDHOST_MATRIX.json VC4_STOCK_SDHOST_MATRIX.md
          git add -u .github/workflows/vc4-stock-sdhost-matrix.yml
          git diff --cached --check
          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git commit -m "tests/vc4: record stock SDHOST candidate frontier [skip ci]"
          git push --force-with-lease \
            origin HEAD:agent/vc4-stock-linux-frontier
