name: VC4 post-varying continuation dispatch v2

on:
  push:
    branches:
      - agent/vc4-linux-mesa-gles2-frontier
    paths:
      - VC4_LINUX_MESA_GLES2_STATUS.json
      - .github/workflows/vc4-post-varying-continuation-dispatch-v2.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: vc4-post-varying-continuation-dispatch-v2
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BRANCH: agent/vc4-linux-mesa-gles2-frontier
      STATUS: VC4_LINUX_MESA_GLES2_STATUS.json
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Wait for fresh Mesa evidence containing varying FIFO support
        id: evidence
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 150); do
            git fetch origin "$BRANCH"
            if git show "origin/$BRANCH:$STATUS" > /tmp/mesa-status.json 2>/dev/null; then
              source_sha=$(python3 - <<'PY'
          import json
          status = json.load(open('/tmp/mesa-status.json'))
          print(status.get('source_sha') or status.get('tested_source_sha') or '')
          PY
              )
              run_id=$(python3 - <<'PY'
          import json
          status = json.load(open('/tmp/mesa-status.json'))
          print(status.get('run_id') or status.get('workflow_run_id') or '')
          PY
              )
              if test -n "$source_sha" && test -n "$run_id" && \
                 git cat-file -e "$source_sha^{commit}" 2>/dev/null && \
                 git show "$source_sha:include/hw/display/vc4_qpu_exec.h" | \
                   grep -Fq VC4_QPU_EXEC_FAULT_VARYING_READ && \
                 git show "$source_sha:hw/display/vc4_qpu_exec.c" | \
                   grep -Fq VC4_QPU_REG_VARYING; then
                printf '%s\n' "$source_sha" > /tmp/MESA_SOURCE_SHA
                printf '%s\n' "$run_id" > /tmp/MESA_RUN_ID
                ready=true
                break
              fi
            fi
            sleep 10
          done
          test "$ready" = true

      - name: Classify success or dispatch next bounded tranche
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          complete=$(python3 - <<'PY'
          import json
          status = json.load(open('/tmp/mesa-status.json'))
          text = json.dumps(status).lower()
          markers = (
              status.get('complete') is True,
              status.get('passed') is True,
              status.get('classification') in {
                  'mesa-gles2-complete',
                  'exact-pixels',
                  'success',
              },
              'vc4_linux_mesa_gles2_ok' in text,
              'vc4_linux_mesa_gles2_pixels_ok' in text,
          )
          print('true' if any(markers) else 'false')
          PY
          )
          if test "$complete" = true; then
            printf '%s\n' complete > /tmp/DISPOSITION
          else
            gh workflow run vc4-continuation-t002-driver.yml \
              --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
            printf '%s\n' dispatched > /tmp/DISPOSITION
          fi

      - name: Record dispatch boundary and retire workflow
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          git config user.name 'VC4 CI'
          git config user.email 'vc4-ci@users.noreply.github.com'
          cat > VC4_POST_VARYING_CONTINUATION_STATUS.json <<EOF
          {
            "disposition": "$(cat /tmp/DISPOSITION)",
            "mesa_source_sha": "$(cat /tmp/MESA_SOURCE_SHA)",
            "mesa_run_id": "$(cat /tmp/MESA_RUN_ID)",
            "unmodified_mesa_required": true,
            "software_renderer_forbidden": true,
            "host_draw_bypass_forbidden": true
          }
          EOF
          git add VC4_POST_VARYING_CONTINUATION_STATUS.json
          git rm .github/workflows/vc4-post-varying-continuation-dispatch-v2.yml
          git commit -m 'test/vc4: record post-varying continuation boundary [skip ci]'
          git push origin "HEAD:$BRANCH"
