name: VC4 current heterogeneous ARM release

on:
  push:
    branches:
      - agent/vc4-current-arm-release-smoke
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-arm-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build pkg-config python3 python3-venv \
            libglib2.0-dev libpixman-1-dev zlib1g-dev

      - name: Check the current ARM-release smoke test
        run: |
          python3 -m py_compile \
            scripts/vc4/raspi3-current-arm-release-smoke.py
          git diff --check

      - name: Configure and build the heterogeneous emulator
        run: |
          ./configure \
            --target-list=aarch64-softmmu \
            --disable-docs \
            --disable-werror
          ninja -C build qemu-system-aarch64

      - name: Release Cortex-A53 CPU0 from a VPU payload
        run: |
          set -o pipefail
          out=/tmp/vc4-current-arm-release
          rm -rf "$out"
          mkdir -p "$out"
          python3 scripts/vc4/raspi3-current-arm-release-smoke.py \
            build/qemu-system-aarch64 \
            --json "$out/summary.json" \
            2>&1 | tee "$out/run.log"

      - name: Retain the validated regression without permanent CI
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/vc4-current-arm-release-smoke.yml
          git commit -m 'tests/vc4: retain heterogeneous ARM release smoke test'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload ARM-release validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-current-arm-release-${{ github.run_attempt }}
          path: /tmp/vc4-current-arm-release
          if-no-files-found: warn
          retention-days: 14
