name: WD40 structured-log document replay repair

on:
  push:
    branches:
      - wd40/qol-structured-log-doc-replay-fix
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wd40-structured-log-doc-replay-fix
  cancel-in-progress: false

jobs:
  repair-test-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure commit identity
        run: |
          git config user.name "WD40 Build Bot"
          git config user.email "wd40-build@users.noreply.github.com"

      - name: Repair and replay the complete transform contract
        run: |
          set -Eeuo pipefail

          python3 scripts/wd40/apply-structured-log-control-composability.py

          apply_contract() {
            python3 scripts/wd40/apply-rustless-build.py
            python3 scripts/wd40/apply-amd-1tb-hole-control-hardening.py
            python3 scripts/wd40/apply-amd-1tb-hole-control.py
            python3 scripts/wd40/apply-subtractive-log-mask.py
            python3 scripts/wd40/apply-hmp-command-introspection-hardening.py
            python3 scripts/wd40/apply-hmp-command-introspection.py
            python3 scripts/wd40/apply-hmp-argument-introspection.py
            python3 scripts/wd40/apply-structured-log-control-composability.py
            python3 scripts/wd40/apply-structured-log-control.py
            python3 scripts/wd40/apply-structured-log-control-hardening.py
            python3 scripts/wd40/apply-split-irq-exception-logs.py
          }

          apply_contract
          git diff --no-ext-diff --binary > /tmp/wd40-repair-pass1.diff
          apply_contract
          git diff --no-ext-diff --binary > /tmp/wd40-repair-pass2.diff
          cmp /tmp/wd40-repair-pass1.diff /tmp/wd40-repair-pass2.diff

          python3 scripts/ci/check-wd40-rustless.py
          python3 scripts/ci/check-wd40-amd-1tb-hole.py
          python3 scripts/ci/check-wd40-subtractive-log-mask.py
          python3 scripts/ci/check-wd40-hmp-command-introspection.py
          python3 scripts/ci/check-wd40-hmp-argument-introspection.py
          python3 scripts/ci/check-wd40-transform-composability.py
          python3 scripts/ci/check-wd40-structured-log-control.py
          python3 scripts/ci/check-wd40-split-irq-exception-logs.py
          git diff --check

      - name: Publish validated transformer repair
        run: |
          set -Eeuo pipefail
          # GitHub Actions tokens cannot publish workflow-file changes.  The
          # connected repository writer lands that reviewed integration-CI
          # update separately; this job publishes only ordinary source files.
          git add \
            scripts/wd40/apply-structured-log-control.py \
            scripts/wd40/apply-structured-log-control-hardening.py
          if git diff --cached --quiet; then
            echo "Transformer repair already published"
            exit 0
          fi
          git commit -m "scripts/wd40: make structured-log docs replay composable"
          git push origin HEAD:wd40/qol-structured-log-doc-replay-fix
