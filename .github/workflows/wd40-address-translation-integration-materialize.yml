name: WD40 address translation integration materializer

on:
  push:
    branches:
      - wd40/qol-address-translation-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wd40-address-translation-integration-materializer
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out integration candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate canonical integration files
        run: |
          set -Eeuo pipefail
          python3 scripts/wd40/materialize-address-translation-integration.py
          python3 scripts/ci/check-wd40-address-translation-service.py
          git diff --check

          mkdir generated
          cp .github/workflows/wd40-qol-integration.yml \
            generated/wd40-qol-integration.yml
          cp .github/workflows/wd40-address-translation-service.yml \
            generated/wd40-address-translation-service.yml
          git diff --binary > generated/address-translation-integration.patch

      - name: Publish generated integration files
        uses: actions/upload-artifact@v4
        with:
          name: wd40-address-translation-integration-files
          path: generated
          if-no-files-found: error
          retention-days: 1
