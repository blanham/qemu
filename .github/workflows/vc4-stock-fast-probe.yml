name: Fast VC4 stock-firmware barrier probe

on:
  push:
    branches:
      - agent/vc4-stock-bootcode
    paths:
      - .github/workflows/vc4-stock-fast-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RPI_FIRMWARE_COMMIT: 3d301dd924bcd758a4c8cb19fe8531031f033f43

    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl ninja-build pkg-config python3 python3-venv \
            libglib2.0-dev libpixman-1-dev zlib1g-dev

      - name: Download pinned official bootcode.bin
        run: |
          curl --fail --location --retry 4 \
            --output /tmp/bootcode.bin \
            "https://raw.githubusercontent.com/raspberrypi/firmware/${RPI_FIRMWARE_COMMIT}/boot/bootcode.bin"
          echo '4245ec23b58158dc3e55f3e065eb4ecc0c0705d76c8db506e9f824941feee32e  /tmp/bootcode.bin' \
            | sha256sum --check --strict

      - name: Configure and build heterogeneous system emulator
        run: |
          ./configure \
            --target-list=aarch64-softmmu \
            --disable-docs \
            --disable-werror
          ninja -C build qemu-system-aarch64

      - name: Cross the stock 100 ms timer delay
        run: |
          python3 scripts/vc4/raspi3-stock-bootcode-0200.py \
            build/qemu-system-aarch64 \
            /tmp/bootcode.bin \
            --seconds 12 \
            --icount-shift 15 \
            --barrier-is-success
