name: VC4 processor-control register decode

on:
  push:
    branches:
      - agent/vc4-preg-mutex
    paths:
      - .github/workflows/vc4-preg-mutex.yml
      - scripts/vc4/preg-mutex-fixup.py
      - scripts/vc4/preg-mutex-smoke.py
      - target/vc4/cpu.h
      - target/vc4/helper.h
      - target/vc4/op_helper.c
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-preg-mutex-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install QEMU build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            pkg-config \
            python3 \
            python3-venv \
            libglib2.0-dev \
            libpixman-1-dev \
            zlib1g-dev

      - name: Materialize the scalar decoder
        run: |
          python3 -m py_compile \
            scripts/vc4/preg-mutex-fixup.py \
            scripts/vc4/preg-mutex-smoke.py
          python3 scripts/vc4/preg-mutex-fixup.py
          git diff --check
          git diff -- target/vc4/translate.c

      - name: Configure and build qemu-system-vc4
        run: |
          ./configure \
            --target-list=vc4-softmmu \
            --disable-docs \
            --disable-werror
          ninja -C build qemu-system-vc4

      - name: Exercise processor-control registers and mutexes
        run: |
          python3 scripts/vc4/preg-mutex-smoke.py \
            --qemu build/qemu-system-vc4

      - name: Commit the validated decoder
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add target/vc4/translate.c
          if git diff --cached --quiet; then
            echo "Decoder was already materialized."
            exit 0
          fi
          git commit -m "target/vc4: decode processor-control register moves"
          git push origin HEAD:${GITHUB_REF_NAME}
