name: VC4 Linux run locator

on:
  push:
    branches:
      - agent/vc4-linux-bringup
    paths:
      - .github/workflows/vc4-linux-run-locator.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  locate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_BRANCH: agent/vc4-linux-bringup
      TARGET_SHA: b61c317cf258b2e636e1daccc0bf8eb9861411b5
      TARGET_WORKFLOW: vc4-linux-bringup.yml

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Locate the exact bring-up run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          repo = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          branch = os.environ['TARGET_BRANCH']
          target_sha = os.environ['TARGET_SHA']
          workflow = os.environ['TARGET_WORKFLOW']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'vc4-linux-run-locator',
          }
          query = urllib.parse.urlencode({
              'branch': branch,
              'event': 'push',
              'per_page': 30,
          })
          url = (
              f'https://api.github.com/repos/{repo}/actions/workflows/'
              f'{workflow}/runs?{query}'
          )
          selected = None
          recent = []
          deadline = time.monotonic() + 8 * 60
          while time.monotonic() < deadline:
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  payload = json.load(response)
              recent = payload.get('workflow_runs', [])
              selected = next(
                  (run for run in recent if run.get('head_sha') == target_sha),
                  None,
              )
              if selected is not None:
                  break
              time.sleep(10)
          if selected is None:
              raise SystemExit(
                  f'no run found for {target_sha}; recent={recent[:10]}'
              )
          result = {
              'schema_version': 1,
              'located_at': datetime.now(timezone.utc).isoformat(),
              'workflow_file': workflow,
              'run': {
                  key: selected.get(key)
                  for key in (
                      'id', 'name', 'head_branch', 'head_sha', 'status',
                      'conclusion', 'event', 'run_number', 'run_attempt',
                      'created_at', 'updated_at', 'html_url', 'jobs_url',
                      'artifacts_url'
                  )
              },
          }
          Path('VC4_LINUX_RUN.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n'
          )
          Path('VC4_LINUX_RUN.md').write_text(
              '# VC4 Linux bring-up Actions run\n\n'
              f"- Run ID: `{selected.get('id')}`\n"
              f"- Status: `{selected.get('status')}`\n"
              f"- Conclusion: `{selected.get('conclusion')}`\n"
              f"- Head SHA: `{selected.get('head_sha')}`\n"
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Publish locator result and remove this workflow
        run: |
          set -euo pipefail
          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git rm -- .github/workflows/vc4-linux-run-locator.yml
          git add -- VC4_LINUX_RUN.json VC4_LINUX_RUN.md
          git commit -m "ci/vc4: record Linux bring-up run [skip ci]"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin HEAD:"$TARGET_BRANCH"
