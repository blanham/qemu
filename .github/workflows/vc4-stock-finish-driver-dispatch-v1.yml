name: VC4 stock finish driver dispatch v1

on:
  push:
    branches:
      - agent/vc4-stock-arm-handoff-recovered
    paths:
      - VC4_STOCK_LOWPC_CONTRACT_MAP_V2.json
      - .github/workflows/vc4-stock-finish-driver-dispatch-v1.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BRANCH: agent/vc4-stock-arm-handoff-recovered
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Wait for measured contract map
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 100); do
            git fetch origin "$BRANCH"
            if git show "origin/$BRANCH:VC4_STOCK_LOWPC_CONTRACT_MAP_V2.json" \
                 > /tmp/contract-map.json 2>/dev/null; then
              disposition=$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/contract-map.json')).get('disposition', ''))
          PY
              )
              case "$disposition" in
                low-pc-mmio-contract|low-pc-ram-or-rom-contract)
                  ready=true
                  break
                  ;;
                blocked-no-low-pc-access-contract)
                  echo 'trace did not produce a product-actionable contract' >&2
                  exit 1
                  ;;
              esac
            fi
            sleep 8
          done
          test "$ready" = true
      - name: Dispatch bounded continuation driver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run vc4-continuation-t002-driver.yml \
            --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
      - name: Retire dispatcher
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          git config user.name 'VC4 CI'
          git config user.email 'vc4-ci@users.noreply.github.com'
          git rm .github/workflows/vc4-stock-finish-driver-dispatch-v1.yml
          git commit -m 'ci/vc4: retire stock finish dispatcher [skip ci]'
          git push origin "HEAD:$BRANCH"
