name: VC4 SWI exception validation v2

on:
  push:
    branches:
      - agent/vc4-swi-exception
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-swi-exception:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RPI_FIRMWARE_COMMIT: 3d301dd924bcd758a4c8cb19fe8531031f033f43

    steps:
      - uses: actions/checkout@v5

      - name: Install build and probe dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl ninja-build pkg-config python3 python3-venv gdb-multiarch \
            libglib2.0-dev libpixman-1-dev zlib1g-dev

      - name: Validate committed SWI implementation sources
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'bool vc4_cpu_enter_swi' target/vc4/cpu.c
          grep -q 'DEF_HELPER_3(vc4_swi' target/vc4/helper.h
          grep -q 'gen_helper_vc4_swi' target/vc4/translate.c
          grep -q 'G_NORETURN void helper_vc4_swi' target/vc4/op_helper.c
          grep -q 'external_irq_frames' target/vc4/cpu.h
          python3 -m py_compile \
            scripts/vc4/check-swi-exception.py \
            scripts/vc4/raspi3-stock-bootcode-probe.py \
            scripts/vc4/raspi3-stock-bootcode-mmio.py \
            scripts/vc4/stock_bootcode_progress.py

      - name: Download pinned official firmware trio
        run: |
          for file in bootcode.bin start.elf fixup.dat; do
            curl --fail --location --retry 4 \
              --output "/tmp/${file}" \
              "https://raw.githubusercontent.com/raspberrypi/firmware/${RPI_FIRMWARE_COMMIT}/boot/${file}"
          done
          test "$(git hash-object /tmp/bootcode.bin)" = \
            7642d2d89e4235e7d68875ff70688bdde6e71b5a
          test "$(git hash-object /tmp/start.elf)" = \
            0cefcf3a756740760f9903f35cc3843117853712
          test "$(git hash-object /tmp/fixup.dat)" = \
            1845e38de9d4f9a6d9ad7f5273bfe58b2582a7e6

      - name: Configure and build the heterogeneous emulator
        run: |
          mkdir -p /tmp/vc4-swi-exception-v2
          ./configure \
            --target-list=aarch64-softmmu \
            --disable-docs \
            --disable-werror
          set -o pipefail
          ninja -C build qemu-system-aarch64 2>&1 \
            | tee /tmp/vc4-swi-exception-v2/build-qemu.log

      - name: Run focused immediate and register-form SWI regressions
        run: |
          set -euo pipefail
          out=/tmp/vc4-swi-exception-v2
          set -o pipefail
          python3 scripts/vc4/check-swi-exception.py \
            build/qemu-system-aarch64 \
            --json "$out/focused-swi.json" 2>&1 \
            | tee "$out/focused-swi.log"

      - name: Run unchanged official firmware beyond SWI zero
        run: |
          set -euo pipefail
          out=/tmp/vc4-swi-exception-v2
          set -o pipefail
          python3 scripts/vc4/raspi3-stock-bootcode-mmio.py \
            build/qemu-system-aarch64 \
            /tmp/bootcode.bin \
            --start-elf /tmp/start.elf \
            --fixup-dat /tmp/fixup.dat \
            --seconds 90 \
            --trace-samples 300 \
            --trace-interval 0.05 \
            --qemu-debug in_asm,unimp,guest_errors,int \
            --qemu-debug-filter 0x1eddba80..0x1eddbd80 \
            --out-dir "$out" 2>&1 | tee "$out/probe.log"

          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          out = Path('/tmp/vc4-swi-exception-v2')
          probe = (out / 'probe.log').read_text(errors='replace').splitlines()
          qemu = (out / 'qemu-mmio.log').read_text(errors='replace').splitlines()
          lines = probe + qemu

          old = [line for line in lines
                 if ('0x01c0' in line.lower() and
                     '0x1eddba9a' in line.lower() and
                     ('unimplemented' in line.lower() or
                      'illegal' in line.lower()))]
          if old:
              raise SystemExit('SWI zero still reaches the illegal path: ' + old[0])
          if any(line.startswith('VC4_LOW_PC_WRITE ') for line in probe):
              raise SystemExit('unexpected low-memory PC write')

          swi_entries = [line for line in qemu
                         if 'VideoCore IV: SWI vector=32 ' in line]
          if not swi_entries:
              raise SystemExit('official firmware did not enter SWI vector 32')
          rti_records = [line for line in qemu
                         if 'VideoCore IV: RTI ' in line]
          if not rti_records:
              raise SystemExit('official firmware did not return through RTI')

          barrier = next((line for line in reversed(probe)
                          if line.startswith('STOCK_BOOTCODE_BARRIER ')), None)
          if barrier is None:
              raise SystemExit('missing stock firmware barrier record')
          match = re.search(r'\bpc=0x([0-9a-fA-F]+)', barrier)
          if not match:
              raise SystemExit('barrier record has no PC: ' + barrier)
          pc = int(match.group(1), 16)
          if pc == 0x1eddba9a:
              raise SystemExit('official firmware remains at SWI zero')

          summary = {
              'schema_version': 2,
              'old_frontier': '0x1eddba9a',
              'new_barrier_pc': f'0x{pc:08x}',
              'barrier': barrier,
              'swi_entry_count': len(swi_entries),
              'rti_count': len(rti_records),
              'last_swi_entries': swi_entries[-20:],
              'last_rti_records': rti_records[-20:],
          }
          (out / 'summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload SWI build and firmware frontier
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-swi-exception-v2-${{ github.run_attempt }}
          path: /tmp/vc4-swi-exception-v2
          if-no-files-found: warn
          retention-days: 14
