name: VC4 SWI exception validation v2

on:
  push:
    branches:
      - agent/vc4-swi-exception
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-swi-exception:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RPI_FIRMWARE_COMMIT: 3d301dd924bcd758a4c8cb19fe8531031f033f43

    steps:
      - uses: actions/checkout@v5

      - name: Install build and probe dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl ninja-build pkg-config python3 python3-venv gdb-multiarch \
            libglib2.0-dev libpixman-1-dev zlib1g-dev

      - name: Reuse the original SWI materializer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/vc4-swi-exception.yml')
          if not workflow.exists():
              raise SystemExit('original SWI workflow is missing')
          lines = workflow.read_text().splitlines()
          blocks = []
          i = 0
          while i < len(lines):
              match = re.match(r'^(\s*)run:\s*\|[-+]?\s*$', lines[i])
              if not match:
                  i += 1
                  continue
              indent = len(match.group(1))
              body = []
              i += 1
              while i < len(lines):
                  line = lines[i]
                  stripped = line.lstrip(' ')
                  lead = len(line) - len(stripped)
                  if stripped and lead <= indent:
                      break
                  if not stripped:
                      body.append('')
                  else:
                      body.append(line[min(len(line), indent + 2):])
                  i += 1
              script = '\n'.join(body) + '\n'
              if ('VC4_EXCP_SWI' in script or 'vc4_swi' in script) and \
                 ('target/vc4' in script or 'cpu.h' in script):
                  blocks.append(script)
          if len(blocks) != 1:
              raise SystemExit(
                  f'expected one SWI materializer block, found {len(blocks)}'
              )
          Path('/tmp/materialize-swi.sh').write_text(
              '#!/usr/bin/env bash\nset -euo pipefail\n' + blocks[0]
          )
          PY
          chmod +x /tmp/materialize-swi.sh
          /tmp/materialize-swi.sh
          git diff --check
          git status --short

      - name: Download pinned official firmware trio
        run: |
          for file in bootcode.bin start.elf fixup.dat; do
            curl --fail --location --retry 4 \
              --output "/tmp/${file}" \
              "https://raw.githubusercontent.com/raspberrypi/firmware/${RPI_FIRMWARE_COMMIT}/boot/${file}"
          done
          test "$(git hash-object /tmp/bootcode.bin)" = \
            7642d2d89e4235e7d68875ff70688bdde6e71b5a
          test "$(git hash-object /tmp/start.elf)" = \
            0cefcf3a756740760f9903f35cc3843117853712
          test "$(git hash-object /tmp/fixup.dat)" = \
            1845e38de9d4f9a6d9ad7f5273bfe58b2582a7e6

      - name: Configure and build the heterogeneous emulator first
        run: |
          mkdir -p /tmp/vc4-swi-exception-v2
          ./configure \
            --target-list=aarch64-softmmu \
            --disable-docs \
            --disable-werror
          set -o pipefail
          ninja -C build qemu-system-aarch64 2>&1 \
            | tee /tmp/vc4-swi-exception-v2/build-qemu.log

      - name: Build and run focused SWI regressions
        run: |
          set -euo pipefail
          mkdir -p /tmp/vc4-swi-exception-v2
          mapfile -t tests < <(
            git diff --name-only -- tests \
              | sed -n 's#^tests/qtest/\(.*-test\)\.c$#tests/qtest/\1#p'
          )
          if ((${#tests[@]})); then
            printf '%s\n' "${tests[@]}" \
              | tee /tmp/vc4-swi-exception-v2/test-targets.txt
            ninja -C build "${tests[@]}" 2>&1 \
              | tee /tmp/vc4-swi-exception-v2/build-tests.log
            for test in "${tests[@]}"; do
              binary="build/${test}"
              test -x "$binary"
              QTEST_QEMU_BINARY="$PWD/build/qemu-system-aarch64" \
                "$binary" 2>&1 \
                | tee -a /tmp/vc4-swi-exception-v2/test-results.log
            done
          else
            echo 'No qtest source was added by the original materializer.' \
              | tee /tmp/vc4-swi-exception-v2/test-targets.txt
          fi

          for script in $(git diff --name-only -- scripts/vc4 \
                            | grep -E '(swi|exception).*(smoke|test)\.py$' \
                            || true); do
            python3 -m py_compile "$script"
            python3 "$script" \
              build/qemu-system-aarch64 2>&1 \
              | tee -a /tmp/vc4-swi-exception-v2/test-results.log
          done

      - name: Run unchanged official firmware beyond SWI zero
        run: |
          set -euo pipefail
          out=/tmp/vc4-swi-exception-v2
          python3 -m py_compile \
            scripts/vc4/raspi3-stock-bootcode-probe.py \
            scripts/vc4/raspi3-stock-bootcode-mmio.py \
            scripts/vc4/stock_bootcode_progress.py

          set -o pipefail
          python3 scripts/vc4/raspi3-stock-bootcode-mmio.py \
            build/qemu-system-aarch64 \
            /tmp/bootcode.bin \
            --start-elf /tmp/start.elf \
            --fixup-dat /tmp/fixup.dat \
            --seconds 70 \
            --trace-samples 240 \
            --trace-interval 0.05 \
            --qemu-debug in_asm,unimp,guest_errors \
            --qemu-debug-filter 0x1eddba80..0x1eddbc80 \
            --out-dir "$out" 2>&1 | tee "$out/probe.log"

          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          out = Path('/tmp/vc4-swi-exception-v2')
          probe = (out / 'probe.log').read_text(errors='replace').splitlines()
          qemu = (out / 'qemu-mmio.log').read_text(errors='replace').splitlines()
          joined = '\n'.join(probe + qemu)

          old = [line for line in probe + qemu
                 if ('0x01c0' in line.lower() and
                     '0x1eddba9a' in line.lower() and
                     ('unimplemented' in line.lower() or
                      'illegal' in line.lower()))]
          if old:
              raise SystemExit('SWI zero still reaches the illegal path: ' + old[0])
          if any(line.startswith('VC4_LOW_PC_WRITE ') for line in probe):
              raise SystemExit('unexpected low-memory PC write')

          barrier = next((line for line in reversed(probe)
                          if line.startswith('STOCK_BOOTCODE_BARRIER ')), None)
          if barrier is None:
              raise SystemExit('missing stock firmware barrier record')
          match = re.search(r'\bpc=0x([0-9a-fA-F]+)', barrier)
          if not match:
              raise SystemExit('barrier record has no PC: ' + barrier)
          pc = int(match.group(1), 16)
          if pc == 0x1eddba9a:
              raise SystemExit('official firmware remains at SWI zero')

          summary = {
              'schema_version': 1,
              'old_frontier': '0x1eddba9a',
              'new_barrier_pc': f'0x{pc:08x}',
              'barrier': barrier,
              'old_illegal_records': old,
          }
          (out / 'summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Commit the validated SWI implementation
        run: |
          set -euo pipefail
          mapfile -t changed < <(
            git status --porcelain \
              | sed -E 's/^.. //' \
              | grep -v '^\.github/workflows/'
          )
          if ((${#changed[@]} == 0)); then
            echo 'No production or regression changes remain to commit.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email \
            41898282+github-actions[bot]@users.noreply.github.com
          git add -- "${changed[@]}"
          git diff --cached --check
          git commit -m 'target/vc4: implement software interrupt exceptions'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload SWI build and firmware frontier
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-swi-exception-v2-${{ github.run_attempt }}
          path: /tmp/vc4-swi-exception-v2
          if-no-files-found: warn
          retention-days: 14
