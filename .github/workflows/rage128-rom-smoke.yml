name: Validate Rage 128 PLL and option ROMs

on:
  push:
    branches:
      - agent/rage128-rom-smoke-qemu

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Transform, build, test, boot ROMs, and publish
        shell: bash
        run: |
          set -Eeuo pipefail
          staging=agent/rage128-rom-smoke-qemu
          target=agent/rage128-upstream-20260823

          base64 -d .github/rage128-pll/transform.py.xz.b64 \
            | xz -d > /tmp/rage128-pll-transform.py
          echo '346ae52cd41a2650223997689ec4a188a020934c9daa5a9814a61678c8958c14  /tmp/rage128-pll-transform.py' \
            | sha256sum -c -
          python3 -m py_compile /tmp/rage128-pll-transform.py

          git config user.name 'Bryce Lanham'
          git config user.email 'blanham@gmail.com'
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/qemu/qemu.git
          git fetch --no-tags upstream master
          git fetch --no-tags origin "$target"

          upstream_sha=$(git rev-parse upstream/master)
          source_sha=$(git rev-parse "origin/$target")
          source_parent=$(git rev-parse "$source_sha^")
          git merge-base --is-ancestor "$source_parent" "$upstream_sha"

          git checkout -B rage128-pll-work "$upstream_sha"
          git cherry-pick "$source_sha"
          python3 /tmp/rage128-pll-transform.py
          git diff --check

          grep -q 'uint32_t pll_regs\[64\]' hw/display/ati_int.h
          grep -q 'PLL_INDEX_MASK' hw/display/ati_regs.h
          grep -q 'rage128-pll' tests/qtest/display-vga-test.c

          sudo apt-get update
          sudo apt-get install -y \
            build-essential ninja-build pkg-config python3-venv \
            libglib2.0-dev libpixman-1-dev libfdt-dev libslirp-dev

          mkdir build
          cd build
          ../configure \
            --target-list=x86_64-softmmu,ppc-softmmu \
            --enable-debug \
            --disable-werror \
            --disable-docs
          ninja -j2 \
            qemu-system-x86_64 \
            qemu-system-ppc \
            tests/unit/test-ati-rop3 \
            tests/qtest/display-vga-test
          meson test \
            test-ati-rop3 \
            display-vga-test \
            --print-errorlogs
          cd ..

          mkdir -p roms logs
          base=https://raw.githubusercontent.com/blanham/86Box/7b0412684076a05c20d39483b2b9e75baba11b54/roms/video/ati_rage128
          curl --fail --location --retry 3 \
            "$base/113-57403-102.rom" -o roms/113-57403-102.rom
          curl --fail --location --retry 3 \
            "$base/113-53008-100.rom" -o roms/113-53008-100.rom
          cat > roms/SHA256SUMS <<'SUMS'
          91837fab2f2a71df54d3f031fd15bc5ed658b148d2df806b05e30f370fe60afe  113-57403-102.rom
          9100ea06532a08e50afd496ddddb943ff69e9b8dbf9b03bd375a4de17a85741b  113-53008-100.rom
          SUMS
          (cd roms && sha256sum -c SHA256SUMS)

          run_rom() {
            name=$1
            rom=$2
            subsystem=$3
            debug="logs/${name}.seabios.log"
            qlog="logs/${name}.qemu.log"

            set +e
            timeout --signal=TERM 12s \
              build/qemu-system-x86_64 \
                -machine pc,accel=tcg \
                -m 64M \
                -nodefaults \
                -display none \
                -monitor none \
                -serial none \
                -no-reboot \
                -boot menu=off,strict=on \
                -chardev file,id=debugcon,path="$debug" \
                -device isa-debugcon,iobase=0x402,chardev=debugcon \
                -device ati-vga,model=rage128re,x-subsystem-id="$subsystem",romfile="$rom" \
                -D "$qlog" \
                -d guest_errors,unimp
            rc=$?
            set -e
            if [[ $rc -ne 0 && $rc -ne 124 && $rc -ne 143 ]]; then
              exit "$rc"
            fi

            grep -q 'Running option rom at c000:0003' "$debug"
            grep -q 'Turning on vga text mode console' "$debug"
            grep -q 'ATA controller 1' "$debug"
          }

          run_rom xpert roms/113-57403-102.rom 0x0008
          run_rom aiw roms/113-53008-100.rom 0x0068

          git add \
            hw/display/ati.c \
            hw/display/ati_int.h \
            hw/display/ati_regs.h \
            tests/qtest/display-vga-test.c
          git commit --amend -m 'hw/display/ati: strengthen Rage 128 emulation and ROM initialization

          Preserve the complete synchronous 2D engine, PF AGP and RE PCI
          profiles, PCI power management, DDC/EDID, GUI reset and cache
          behavior, XAA brushes and lines, persistent HOST_DATA uploads,
          color comparison, and exhaustive ROP3 validation.

          Model the 64-entry indexed PLL register bank behind
          CLOCK_CNTL_INDEX/CLOCK_CNTL_DATA, including byte-lane access,
          PLL_WR_EN gating, divider-selection readback, reset defaults, and
          immediate completion of PPLL atomic updates. Add live qtests for
          protected writes, partial accesses, and the atomic-update handshake.

          Validate the final tree with x86_64 and PowerPC system builds, the
          ROP3 unit suite, all display qtests, and successful execution of the
          repository-supplied Xpert 128 and All-in-Wonder 128 option ROMs.'

          test "$(git rev-list --count "$upstream_sha..HEAD")" = 1
          test "$(git merge-base "$upstream_sha" HEAD)" = "$upstream_sha"
          test -z "$(git diff --name-only "$upstream_sha..HEAD" \
                    | grep '^\.github/' || true)"

          git push --force-with-lease=refs/heads/${target}:${source_sha} \
            origin HEAD:"$target"
          git push --force origin "$upstream_sha":"$staging"
