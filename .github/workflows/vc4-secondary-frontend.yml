name: VC4 heterogeneous TCG frontend

on:
  push:
    branches:
      - agent/vc4-secondary-frontend

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install QEMU build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            pkg-config \
            python3 \
            python3-venv \
            libglib2.0-dev \
            libpixman-1-dev \
            zlib1g-dev

      - name: Materialize heterogeneous frontend tranche
        run: |
          cat scripts/vc4/secondary-bootstrap.py.part00 \
              scripts/vc4/secondary-bootstrap.py.part01 \
              scripts/vc4/secondary-bootstrap.py.part02 \
              scripts/vc4/secondary-bootstrap.py.part03 \
              > scripts/vc4/secondary-bootstrap.py
          echo 'a702ecf4349f26bea1bf53328e70fa3ae38131cfd8ed83686ee41575ac6861f2  scripts/vc4/secondary-bootstrap.py' | \
            sha256sum --check --strict
          rm scripts/vc4/secondary-bootstrap.py.part*
          python3 -m py_compile scripts/vc4/secondary-bootstrap.py
          python3 scripts/vc4/secondary-bootstrap.py

      - name: Configure and build both system targets
        run: |
          ./configure \
            --target-list=aarch64-softmmu,vc4-softmmu \
            --disable-docs \
            --disable-werror
          ninja -C build qemu-system-aarch64 qemu-system-vc4

      - name: Verify machine registration
        run: |
          build/qemu-system-aarch64 -machine help | tee /tmp/aarch64-machines.txt
          grep -q 'vc4-hetero-smoke' /tmp/aarch64-machines.txt
          build/qemu-system-vc4 -machine help | tee /tmp/vc4-machines.txt
          grep -q 'vc4-vpu' /tmp/vc4-machines.txt
          grep -q 'raspi3b-vc4' /tmp/vc4-machines.txt

      - name: Execute native VC4 scalar smoke firmware
        run: |
          python3 - <<'PY'
          import struct

          halfwords = (
              0x00e0,             # cpuid r0
              0x4001,             # mov r1, r0
              0x6231,             # add r1, 3
              0xb019, 0x0100,     # mov sp, 0x100
              0x0601,             # st r1, (sp)
              0x0402,             # ld r2, (sp)
              0x0000,             # halt
          )
          with open('/tmp/vc4-smoke.bin', 'wb') as out:
              out.write(struct.pack('<%dH' % len(halfwords), *halfwords))
          PY

          set +e
          timeout 3s build/qemu-system-vc4 \
            -M vc4-vpu \
            -m 1M \
            -kernel /tmp/vc4-smoke.bin \
            -display none \
            -monitor none \
            -serial none \
            -accel tcg,thread=single,one-insn-per-tb=on \
            -d cpu,exec \
            -D /tmp/vc4-native.log
          rc=$?
          set -e
          cat /tmp/vc4-native.log
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            exit "$rc"
          fi

          python3 - <<'PY'
          import re

          log = open('/tmp/vc4-native.log', encoding='utf-8').read()
          blocks = re.split(r'(?=^pc=[0-9a-f]{8}\s+sr=)', log,
                            flags=re.MULTILINE | re.IGNORECASE)
          final = next((b for b in reversed(blocks)
                        if re.match(r'^pc=0000000e\s+sr=', b,
                                    re.IGNORECASE)), None)
          if final is None:
              raise SystemExit('native VC4 did not reach HALT at PC 0x0e')
          for reg, value in {0: 0x04000104, 1: 0x04000107,
                             2: 0x04000107, 25: 0x100}.items():
              if not re.search(rf'r{reg}\s*=\s*{value:08x}', final,
                               re.IGNORECASE):
                  raise SystemExit(f'native VC4 r{reg} mismatch:\n{final}')
          PY

      - name: Execute AArch64 and VC4 at the same physical PC
        run: |
          set +e
          timeout 4s build/qemu-system-aarch64 \
            -M vc4-hetero-smoke \
            -m 16M \
            -display none \
            -monitor none \
            -serial none \
            -accel tcg,thread=single,one-insn-per-tb=on \
            -d cpu,exec \
            -D /tmp/vc4-hetero.log
          rc=$?
          set -e
          cat /tmp/vc4-hetero.log
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            exit "$rc"
          fi

          grep -Eq 'Trace 0: .*\/0000000000000000\/' /tmp/vc4-hetero.log
          grep -Eq 'Trace 1: .*\/0000000000000000\/' /tmp/vc4-hetero.log
          grep -q 'VideoCore IV: HALT at 0x00000002' /tmp/vc4-hetero.log

      - name: Commit green heterogeneous implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git commit -m "tcg: support linked heterogeneous guest frontends"
          git push origin HEAD:${GITHUB_REF_NAME}
