name: VC4 HVS packed-RGB scanout

on:
  push:
    branches:
      - agent/vc4-linux-kms-bind-diagnostics
    paths:
      - .github/workflows/vc4-hvs-packed-rgb.yml
      - hw/display/bcm2835_fb.c
      - hw/display/bcm2835_hvs.c
      - include/hw/display/bcm2835_fb.h
      - scripts/vc4/hvs-dlist-smoke.py
      - scripts/vc4/hvs-packed-rgb-smoke.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vc4-hvs-packed-rgb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packed-rgb:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Install focused build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libpixman-1-dev \
            ninja-build \
            pkg-config \
            python3

      - name: Build QEMU
        run: |
          set -euo pipefail
          ./configure \
            --target-list=aarch64-softmmu \
            --disable-docs \
            --disable-werror
          ninja -C build qemu-system-aarch64

      - name: Check packed-RGB scanout
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/vc4/hvs-dlist-smoke.py \
            scripts/vc4/hvs-packed-rgb-smoke.py
          python3 scripts/vc4/hvs-dlist-smoke.py \
            --qemu build/qemu-system-aarch64
          python3 scripts/vc4/hvs-packed-rgb-smoke.py \
            --qemu build/qemu-system-aarch64
