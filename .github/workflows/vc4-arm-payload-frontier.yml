name: Summarize VC4 ARM-payload frontier

on:
  push:
    branches:
      - agent/vc4-preg-mutex
    paths:
      - VC4_ARM_PAYLOAD_STATUS.json

permissions:
  contents: write

jobs:
  summarize-frontier:
    if: ${{ github.actor == 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/vc4-preg-mutex
          fetch-depth: 0

      - name: Generate compact frontier
        run: |
          python3 -m py_compile scripts/vc4/summarize-arm-payload-status.py
          python3 scripts/vc4/summarize-arm-payload-status.py

      - name: Commit changed frontier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add VC4_ARM_PAYLOAD_FRONTIER.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci/vc4: record compact ARM-payload frontier [skip ci]"
          git push origin HEAD:agent/vc4-preg-mutex
