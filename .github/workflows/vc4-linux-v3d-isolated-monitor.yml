name: VC4 Linux V3D isolated run monitor

on:
  push:
    branches:
      - agent/vc4-linux-v3d-modular-isolated
    paths:
      - .github/workflows/vc4-linux-v3d-isolated-monitor.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  record:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Record latest isolated modular runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/vc4-linux-v3d-modular.yml/runs?branch=$REF_NAME&per_page=10" \
            > /tmp/runs.json
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          import os

          raw = json.loads(Path('/tmp/runs.json').read_text())
          runs = []
          for run in raw.get('workflow_runs', []):
              runs.append({
                  'id': run.get('id'),
                  'name': run.get('name'),
                  'event': run.get('event'),
                  'status': run.get('status'),
                  'conclusion': run.get('conclusion'),
                  'head_sha': run.get('head_sha'),
                  'run_number': run.get('run_number'),
                  'run_attempt': run.get('run_attempt'),
                  'created_at': run.get('created_at'),
                  'updated_at': run.get('updated_at'),
                  'html_url': run.get('html_url'),
              })
          result = {
              'schema_version': 1,
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'branch': os.environ['REF_NAME'],
              'runs': runs,
          }
          Path('VC4_LINUX_V3D_ISOLATED_RUNS.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git add -- VC4_LINUX_V3D_ISOLATED_RUNS.json
          git commit -m 'ci/vc4: record isolated modular run state [skip ci]'
          git pull --rebase origin agent/vc4-linux-v3d-modular-isolated
          git push origin HEAD:agent/vc4-linux-v3d-modular-isolated
