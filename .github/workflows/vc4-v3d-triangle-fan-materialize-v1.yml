name: VC4 V3D measured triangle-fan materialization

on:
  push:
    branches:
      - agent/vc4-linux-mesa-gles2-frontier
    paths:
      - .github/workflows/vc4-v3d-triangle-fan-materialize-v1.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-v3d-triangle-fan-materialize-v1
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BRANCH: agent/vc4-linux-mesa-gles2-frontier
      EVIDENCE_DIR: /tmp/vc4-v3d-triangle-fan-evidence

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev libpixman-1-dev \
            ninja-build pkg-config python3 zlib1g-dev
          rm -rf "$EVIDENCE_DIR"
          mkdir -p "$EVIDENCE_DIR"
          git rev-parse HEAD > "$EVIDENCE_DIR/INPUT_SHA"
          git diff --check

      - name: Add architecture-correct triangle-fan assembly
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_s: str, old: str, new: str) -> None:
              path = Path(path_s)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f'{path}: expected one replacement marker, found {count}'
                  )
              path.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'include/hw/display/vc4_v3d_pipeline.h',
              '#define VC4_V3D_PIPELINE_MAX_TRIANGLES (VC4_QPU_LANES / 3)\n',
              '/* A fan can emit N-2 triangles from one bounded QPU batch. */\n'
              '#define VC4_V3D_PIPELINE_MAX_TRIANGLES (VC4_QPU_LANES - 2)\n',
          )

          replace_once(
              'hw/display/vc4_v3d_pipeline.c',
              '#define VC4_PRIMITIVE_TRIANGLES        4\n',
              '#define VC4_PRIMITIVE_TRIANGLES        4\n'
              '#define VC4_PRIMITIVE_TRIANGLE_FAN     6\n',
          )
          replace_once(
              'hw/display/vc4_v3d_pipeline.c',
              '    uint8_t packed_row;\n    uint32_t color;\n',
              '    uint8_t packed_row;\n    uint8_t primitive_mode;\n'
              '    uint32_t color;\n',
          )
          replace_once(
              'hw/display/vc4_v3d_pipeline.c',
              '    if ((primitive->mode_byte & 0xf) != VC4_PRIMITIVE_TRIANGLES) {\n'
              '        return vc4_v3d_pipeline_set_fault(\n'
              '            result, VC4_V3D_PIPELINE_FAULT_MODE,\n'
              '            primitive->mode_byte & 0xf);\n'
              '    }\n'
              '    if (primitive->length < 3 ||\n'
              '        primitive->length > VC4_V3D_PIPELINE_MAX_VERTICES ||\n'
              '        (primitive->length % 3) != 0 ||\n'
              '        primitive->first > UINT32_MAX - primitive->length) {\n'
              '        return vc4_v3d_pipeline_set_fault(\n'
              '            result, VC4_V3D_PIPELINE_FAULT_LENGTH, primitive->length);\n'
              '    }\n',
              '    primitive_mode = primitive->mode_byte & 0xf;\n'
              '    if (primitive_mode != VC4_PRIMITIVE_TRIANGLES &&\n'
              '        primitive_mode != VC4_PRIMITIVE_TRIANGLE_FAN) {\n'
              '        return vc4_v3d_pipeline_set_fault(\n'
              '            result, VC4_V3D_PIPELINE_FAULT_MODE, primitive_mode);\n'
              '    }\n'
              '    if (primitive->length < 3 ||\n'
              '        primitive->length > VC4_V3D_PIPELINE_MAX_VERTICES ||\n'
              '        (primitive_mode == VC4_PRIMITIVE_TRIANGLES &&\n'
              '         (primitive->length % 3) != 0) ||\n'
              '        primitive->first > UINT32_MAX - primitive->length) {\n'
              '        return vc4_v3d_pipeline_set_fault(\n'
              '            result, VC4_V3D_PIPELINE_FAULT_LENGTH, primitive->length);\n'
              '    }\n',
          )
          replace_once(
              'hw/display/vc4_v3d_pipeline.c',
              '    result->triangle_count = primitive->length / 3;\n'
              '    for (unsigned triangle = 0;\n'
              '         triangle < result->triangle_count; triangle++) {\n'
              '        VC4V3DPipelineTriangle *output = &result->triangles[triangle];\n\n'
              '        output->color = color;\n'
              '        for (unsigned vertex = 0; vertex < 3; vertex++) {\n'
              '            unsigned lane = triangle * 3 + vertex;\n'
              '            uint32_t packed = coordinate_qpu.vpm[packed_row].lane[lane];\n',
              '    result->triangle_count =\n'
              '        primitive_mode == VC4_PRIMITIVE_TRIANGLE_FAN ?\n'
              '        primitive->length - 2 : primitive->length / 3;\n'
              '    for (unsigned triangle = 0;\n'
              '         triangle < result->triangle_count; triangle++) {\n'
              '        VC4V3DPipelineTriangle *output = &result->triangles[triangle];\n\n'
              '        output->color = color;\n'
              '        for (unsigned vertex = 0; vertex < 3; vertex++) {\n'
              '            unsigned lane;\n\n'
              '            if (primitive_mode == VC4_PRIMITIVE_TRIANGLE_FAN) {\n'
              '                lane = vertex == 0 ? 0 : triangle + vertex;\n'
              '            } else {\n'
              '                lane = triangle * 3 + vertex;\n'
              '            }\n'
              '            uint32_t packed = coordinate_qpu.vpm[packed_row].lane[lane];\n',
          )

          replace_once(
              'tests/unit/test-vc4-v3d-pipeline.c',
              '    uint8_t attributes[24];\n',
              '    uint8_t attributes[32];\n',
          )
          replace_once(
              'tests/unit/test-vc4-v3d-pipeline.c',
              '        0xbf800000, 0x40400000,\n'
              '    };\n',
              '        0xbf800000, 0x40400000,\n'
              '        0x40400000, 0x40400000,\n'
              '    };\n',
          )
          replace_once(
              'tests/unit/test-vc4-v3d-pipeline.c',
              'static void test_bad_mode_fails_closed(void)\n',
              '''static void test_measured_triangle_fan(void)
{
    PipelineFixture fixture;
    VC4V3DPipelineResult result;

    fixture_init(&fixture);
    fixture.primitive.mode_byte = 6;
    fixture.primitive.length = 4;
    g_assert_true(vc4_v3d_execute_array_primitive(
        test_memory_read, &fixture.memory,
        &fixture.state, &fixture.primitive, 0x0200, 0x0200, &result));
    g_assert_cmpint(result.fault, ==, VC4_V3D_PIPELINE_FAULT_NONE);
    g_assert_cmpuint(result.triangle_count, ==, 2);
    g_assert_cmphex(result.triangles[0].color, ==, 0xff2080df);
    g_assert_cmphex(result.triangles[1].color, ==, 0xff2080df);

    /* Fan assembly is [0,1,2], [0,2,3], not a duplicated strip. */
    g_assert_cmpint(result.triangles[1].x[0], ==,
                    result.triangles[0].x[0]);
    g_assert_cmpint(result.triangles[1].y[0], ==,
                    result.triangles[0].y[0]);
    g_assert_cmpint(result.triangles[1].x[1], ==,
                    result.triangles[0].x[2]);
    g_assert_cmpint(result.triangles[1].y[1], ==,
                    result.triangles[0].y[2]);
    g_assert_cmpint(result.triangles[1].x[2], ==, 2048);
    g_assert_cmpint(result.triangles[1].y[2], ==, -1024);
}

static void test_bad_mode_fails_closed(void)
''',
          )
          replace_once(
              'tests/unit/test-vc4-v3d-pipeline.c',
              '    g_test_add_func("/vc4/v3d-pipeline/bad-mode",\n'
              '                    test_bad_mode_fails_closed);\n',
              '    g_test_add_func("/vc4/v3d-pipeline/measured-triangle-fan",\n'
              '                    test_measured_triangle_fan);\n'
              '    g_test_add_func("/vc4/v3d-pipeline/bad-mode",\n'
              '                    test_bad_mode_fails_closed);\n',
          )
          PY
          git diff --check
          git diff -- \
            include/hw/display/vc4_v3d_pipeline.h \
            hw/display/vc4_v3d_pipeline.c \
            tests/unit/test-vc4-v3d-pipeline.c \
            > "$EVIDENCE_DIR/product.patch"

      - name: Configure and build both frontends
        run: |
          set -euo pipefail
          ./configure \
            --target-list=aarch64-softmmu,vc4-softmmu \
            --disable-docs --disable-werror \
            --extra-cflags=-Werror=implicit-function-declaration \
            2>&1 | tee "$EVIDENCE_DIR/configure.log"
          ninja -C build \
            qemu-system-aarch64 qemu-system-vc4 \
            tests/unit/test-vc4-qpu \
            tests/unit/test-vc4-qpu-contract \
            tests/unit/test-vc4-v3d-pipeline \
            2>&1 | tee "$EVIDENCE_DIR/build.log"

      - name: Run bounded renderer regressions
        run: |
          set -euo pipefail
          build/tests/unit/test-vc4-qpu --tap -k \
            2>&1 | tee "$EVIDENCE_DIR/qpu.tap"
          build/tests/unit/test-vc4-qpu-contract --tap -k \
            2>&1 | tee "$EVIDENCE_DIR/qpu-contract.tap"
          build/tests/unit/test-vc4-v3d-pipeline --tap -k \
            2>&1 | tee "$EVIDENCE_DIR/pipeline.tap"
          python3 scripts/vc4/v3d-smoke.py \
            --qemu build/qemu-system-aarch64 \
            2>&1 | tee "$EVIDENCE_DIR/v3d-linear.log"
          if test -f scripts/vc4/v3d-tiling-smoke.py; then
            python3 scripts/vc4/v3d-tiling-smoke.py \
              --qemu build/qemu-system-aarch64 \
              2>&1 | tee "$EVIDENCE_DIR/v3d-tiling.log"
          fi

      - name: Record validated primitive coverage
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          import os

          record = {
              'schema_version': 1,
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'source_sha': os.environ.get('GITHUB_SHA'),
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
              'validated': True,
              'primitive_modes': {
                  'triangles': 4,
                  'triangle_fan': 6,
              },
              'fan_assembly': '[0,i+1,i+2]',
              'maximum_input_vertices': 16,
              'maximum_fan_triangles': 14,
              'does_not_claim': [
                  'fragment varyings',
                  'TMU reads',
                  'indexed primitives',
                  'triangle strips',
              ],
          }
          Path('VC4_V3D_TRIANGLE_FAN_STATUS.json').write_text(
              json.dumps(record, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          Path('VC4_V3D_TRIANGLE_FAN_STATUS.md').write_text(
              '# VC4 V3D measured triangle-fan checkpoint\n\n'
              'Validation passed: **true**\n\n'
              '- Array triangles remain supported.\n'
              '- Array triangle fans are assembled as `[0,i+1,i+2]`.\n'
              '- A bounded 16-vertex fan can emit at most 14 triangles.\n'
              '- Existing QPU, pipeline, linear-store, and tiled-store gates passed.\n\n'
              'This is a primitive-assembly checkpoint only. It does not claim '
              'fragment-varying or TMU support; the real Mesa run determines the '
              'next frontier.\n',
              encoding='utf-8',
          )
          PY
          cp VC4_V3D_TRIANGLE_FAN_STATUS.* "$EVIDENCE_DIR/"
          git diff --check

      - name: Upload complete validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: vc4-v3d-triangle-fan-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          retention-days: 14

      - name: Publish clean product commit
        run: |
          set -euo pipefail
          git rm -- .github/workflows/vc4-v3d-triangle-fan-materialize-v1.yml
          git add -- \
            include/hw/display/vc4_v3d_pipeline.h \
            hw/display/vc4_v3d_pipeline.c \
            tests/unit/test-vc4-v3d-pipeline.c \
            VC4_V3D_TRIANGLE_FAN_STATUS.json \
            VC4_V3D_TRIANGLE_FAN_STATUS.md
          git diff --cached --check
          git config user.name "VC4 Triangle Fan CI"
          git config user.email "vc4-triangle-fan-ci@users.noreply.github.com"
          git commit -m "hw/display: assemble VC4 array triangle fans"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
