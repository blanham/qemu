name: VC4 Linux current result capture

on:
  push:
    branches:
      - agent/vc4-linux-bringup
    paths:
      - .github/workflows/vc4-linux-result-capture-current.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: vc4-linux-result-capture-current
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TARGET_BRANCH: agent/vc4-linux-bringup
      TARGET_SHA: dd88d335ab6558af34833599de3ccd8cf3a978aa
      TARGET_WORKFLOW: vc4-linux-bringup.yml

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Wait for and capture the current bring-up result
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          from io import BytesIO
          from pathlib import Path
          from zipfile import ZipFile
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          repo = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          branch = os.environ['TARGET_BRANCH']
          target_sha = os.environ['TARGET_SHA']
          workflow = os.environ['TARGET_WORKFLOW']
          api = f'https://api.github.com/repos/{repo}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'vc4-linux-current-capture',
          }

          def get_json(url: str):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=90) as response:
                  return json.load(response)

          def get_bytes(url: str) -> bytes:
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=300) as response:
                  return response.read()

          query = urllib.parse.urlencode({
              'branch': branch,
              'event': 'push',
              'per_page': 50,
          })
          runs_url = f'{api}/actions/workflows/{workflow}/runs?{query}'
          deadline = time.monotonic() + 55 * 60
          selected = None
          recent = []
          while time.monotonic() < deadline:
              recent = get_json(runs_url).get('workflow_runs', [])
              selected = next(
                  (run for run in recent if run.get('head_sha') == target_sha),
                  None,
              )
              if selected and selected.get('status') == 'completed':
                  break
              time.sleep(15)
          if not selected or selected.get('status') != 'completed':
              raise SystemExit(f'no completed run for {target_sha}: {recent[:5]}')

          run_id = selected['id']
          artifacts = get_json(
              f'{api}/actions/runs/{run_id}/artifacts?per_page=100'
          ).get('artifacts', [])
          artifact = next(
              (item for item in artifacts
               if str(item.get('name', '')).startswith('vc4-linux-bringup-')
               and not item.get('expired')),
              None,
          )
          capture = {
              'schema_version': 2,
              'captured_at': datetime.now(timezone.utc).isoformat(),
              'target_sha': target_sha,
              'run': {key: selected.get(key) for key in (
                  'id', 'name', 'head_branch', 'head_sha', 'status',
                  'conclusion', 'event', 'run_number', 'run_attempt',
                  'created_at', 'updated_at', 'html_url')},
              'artifact': None,
          }
          if artifact:
              capture['artifact'] = {key: artifact.get(key) for key in (
                  'id', 'name', 'size_in_bytes', 'created_at',
                  'updated_at', 'digest')}
              blob = get_bytes(artifact['archive_download_url'])
              root = Path('/tmp/vc4-linux-current')
              root.mkdir(parents=True, exist_ok=True)
              with ZipFile(BytesIO(blob)) as archive:
                  archive.extractall(root)
              for name in ('VC4_LINUX_BRINGUP_STATUS.json',
                           'VC4_LINUX_BRINGUP_STATUS.md'):
                  candidates = list(root.rglob(name))
                  if candidates:
                      Path(name).write_bytes(candidates[0].read_bytes())

          if not Path('VC4_LINUX_BRINGUP_STATUS.json').is_file():
              fallback = {
                  'schema_version': 2,
                  'classification': 'workflow-failed-before-result',
                  'capture': capture,
              }
              Path('VC4_LINUX_BRINGUP_STATUS.json').write_text(
                  json.dumps(fallback, indent=2, sort_keys=True) + '\n'
              )
              Path('VC4_LINUX_BRINGUP_STATUS.md').write_text(
                  '# VC4 Linux and framebuffer bring-up\n\n'
                  f'Workflow `{run_id}` concluded `{selected.get("conclusion")}` '
                  'without a complete result document.\n'
              )
          Path('VC4_LINUX_BRINGUP_CAPTURE.json').write_text(
              json.dumps(capture, indent=2, sort_keys=True) + '\n'
          )
          PY

      - name: Publish result and remove this one-shot capture
        run: |
          set -euo pipefail
          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git rm -- .github/workflows/vc4-linux-result-capture-current.yml
          git add -- \
            VC4_LINUX_BRINGUP_STATUS.json \
            VC4_LINUX_BRINGUP_STATUS.md \
            VC4_LINUX_BRINGUP_CAPTURE.json
          git commit -m "ci/vc4: record current Linux bring-up frontier [skip ci]"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin HEAD:"$TARGET_BRANCH"
