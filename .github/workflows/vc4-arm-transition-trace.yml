name: VC4 ARM handoff transition trace

on:
  push:
    branches:
      - agent/vc4-post-preg-arm-release
    paths:
      - .github/workflows/vc4-arm-transition-trace.yml
      - scripts/vc4/arm-transition-trace.py
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: vc4-arm-transition-trace
  cancel-in-progress: false

jobs:
  trace-after-rejected-wakeup:
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/vc4-post-preg-arm-release
          fetch-depth: 0

      - name: Wait for scheduler A/B and select the next action
        id: scheduler
        env:
          NEXT_BRANCH: agent/vc4-post-msync-silent-halt
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          deadline=$((SECONDS + 65 * 60))
          result=pending
          while (( SECONDS < deadline )); do
            git fetch origin "$NEXT_BRANCH" || true
            if git show "origin/$NEXT_BRANCH:VC4_SCHEDULER_WAKE_AB.md" \
                 >/tmp/vc4-scheduler-ab.md 2>/dev/null; then
              if grep -qi 'candidate rejected' /tmp/vc4-scheduler-ab.md; then
                result=rejected
              elif grep -Eqi \
                   'candidate proven|baseline already reached|clean baseline' \
                   /tmp/vc4-scheduler-ab.md; then
                result=resolved
              else
                result=unknown
              fi
              break
            fi
            sleep 20
          done
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "Scheduler A/B result: $result"

      - name: Install QEMU build dependencies
        if: steps.scheduler.outputs.result == 'rejected'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build pkg-config python3 python3-venv \
            libglib2.0-dev libpixman-1-dev zlib1g-dev

      - name: Check out the rejected-candidate branch and tracer
        if: steps.scheduler.outputs.result == 'rejected'
        id: prepare
        env:
          NEXT_BRANCH: agent/vc4-post-msync-silent-halt
          SOURCE_SHA: ${{ steps.scheduler.outputs.source_sha }}
        run: |
          set -euo pipefail
          git checkout -B transition-trace "origin/$NEXT_BRANCH"
          git checkout "$SOURCE_SHA" -- \
            scripts/vc4/scheduler-ab.py \
            scripts/vc4/arm-transition-trace.py
          # Correct the trace helper's portable integer formatting before use.
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/vc4/arm-transition-trace.py')
          text = path.read_text()
          text = text.replace(
              'f"function={function} value=0x%" " PRIx64 " " cpu=%p",\n'
              '                    f"(uint64_t)({value}), (void *)({expr})",',
              'f"function={function} value=%llu cpu=%p",\n'
              '                    f"(unsigned long long)({value}), "\n'
              '                    f"(void *)({expr})",',
          )
          path.write_text(text)
          PY
          python3 -m py_compile \
            scripts/vc4/scheduler-ab.py \
            scripts/vc4/arm-transition-trace.py
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Recover the pinned stock SD image
        if: steps.scheduler.outputs.result == 'rejected'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from zipfile import ZipFile, BadZipFile
          import json
          import os
          import urllib.request

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPOSITORY']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'vc4-transition-trace',
          }

          def fetch(url: str) -> bytes:
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=240) as response:
                  return response.read()

          def images(blob: bytes, prefix: str = ''):
              try:
                  with ZipFile(BytesIO(blob)) as archive:
                      for info in archive.infolist():
                          if info.is_dir():
                              continue
                          data = archive.read(info)
                          name = prefix + info.filename
                          lower = info.filename.lower()
                          if lower.endswith(('.img', '.raw', '.sd')):
                              yield name, data
                          elif lower.endswith('.zip'):
                              yield from images(data, name + '!')
              except BadZipFile:
                  return

          urls = [
              f'https://api.github.com/repos/{repo}/actions/artifacts/'
              '9352094453/zip',
          ]
          candidates = []
          for url in urls:
              try:
                  candidates.extend(images(fetch(url)))
              except Exception:
                  continue
          if not candidates:
              raise SystemExit('stock image missing from known frontier artifact')
          candidates.sort(key=lambda item: len(item[1]), reverse=True)
          name, data = candidates[0]
          if len(data) < 1 << 20:
              raise SystemExit(f'candidate image too small: {len(data)}')
          Path('/tmp/vc4-stock-arm-payload.img').write_bytes(data)
          Path('VC4_ARM_TRANSITION_IMAGE.json').write_text(
              json.dumps({
                  'artifact_id': 9352094453,
                  'image_name': name,
                  'image_size': len(data),
              }, indent=2, sort_keys=True) + '\n'
          )
          PY

      - name: Temporarily instrument CPU transitions
        if: steps.scheduler.outputs.result == 'rejected'
        id: instrument
        run: |
          set +e
          python3 scripts/vc4/arm-transition-trace.py materialize \
            --root . \
            --out VC4_ARM_TRANSITION_INSTRUMENTATION.json
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          git diff --check
          git diff --stat

      - name: Build the instrumented dual-target emulator
        if: >-
          steps.scheduler.outputs.result == 'rejected' &&
          steps.instrument.outputs.rc == '0'
        run: |
          set -euo pipefail
          mkdir build-arm-transition
          cd build-arm-transition
          ../configure \
            --target-list=vc4-softmmu,aarch64-softmmu \
            --disable-docs \
            --disable-werror
          ninja qemu-system-vc4 qemu-system-aarch64
          cd ..
          if test -f scripts/vc4/preg-mutex-smoke.py; then
            python3 scripts/vc4/preg-mutex-smoke.py \
              --qemu build-arm-transition/qemu-system-vc4
          fi
          if test -f scripts/vc4/msync-smoke.py; then
            python3 scripts/vc4/msync-smoke.py \
              --qemu build-arm-transition/qemu-system-vc4
          fi

      - name: Run and classify the transition trace
        if: >-
          steps.scheduler.outputs.result == 'rejected' &&
          steps.instrument.outputs.rc == '0'
        run: |
          set +e
          python3 scripts/vc4/scheduler-ab.py probe \
            --qemu build-arm-transition/qemu-system-vc4 \
            --image /tmp/vc4-stock-arm-payload.img \
            --thread-mode single \
            --seconds 240 \
            --out VC4_ARM_TRANSITION_PROBE.json
          probe_rc=$?
          set -e
          python3 scripts/vc4/arm-transition-trace.py classify \
            --probe VC4_ARM_TRANSITION_PROBE.json \
            --stderr VC4_ARM_TRANSITION_PROBE.stderr \
            --manifest VC4_ARM_TRANSITION_INSTRUMENTATION.json \
            --out VC4_ARM_TRANSITION_TRACE.json \
            --markdown VC4_ARM_TRANSITION_TRACE.md
          python3 - <<PY
          from pathlib import Path
          import json
          Path('VC4_ARM_TRANSITION_STATUS.json').write_text(
              json.dumps({'probe_rc': $probe_rc},
                         indent=2, sort_keys=True) + '\n'
          )
          PY

      - name: Preserve evidence and discard all instrumentation
        if: steps.scheduler.outputs.result == 'rejected'
        id: preserve
        env:
          NEXT_BRANCH: agent/vc4-post-msync-silent-halt
          BASE_SHA: ${{ steps.prepare.outputs.base_sha }}
          SOURCE_SHA: ${{ steps.scheduler.outputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/vc4-transition-report
          cp -f VC4_ARM_TRANSITION_*.json \
                VC4_ARM_TRANSITION_*.md \
                /tmp/vc4-transition-report/ 2>/dev/null || true
          diagnosis=$(python3 - <<'PY'
          from pathlib import Path
          import json
          path = Path('VC4_ARM_TRANSITION_TRACE.json')
          print(json.loads(path.read_text()).get(
              'diagnosis', 'instrumentation-failed'
          ) if path.is_file() else 'instrumentation-failed')
          PY
          )
          git reset --hard "$BASE_SHA"
          git checkout "$SOURCE_SHA" -- \
            scripts/vc4/scheduler-ab.py \
            scripts/vc4/arm-transition-trace.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/vc4/arm-transition-trace.py')
          text = path.read_text()
          text = text.replace(
              'f"function={function} value=0x%" " PRIx64 " " cpu=%p",\n'
              '                    f"(uint64_t)({value}), (void *)({expr})",',
              'f"function={function} value=%llu cpu=%p",\n'
              '                    f"(unsigned long long)({value}), "\n'
              '                    f"(void *)({expr})",',
          )
          path.write_text(text)
          PY
          cp -f /tmp/vc4-transition-report/* . 2>/dev/null || true
          git rm -f .github/workflows/vc4-arm-transition-trace.yml \
            2>/dev/null || true
          git add \
            scripts/vc4/scheduler-ab.py \
            scripts/vc4/arm-transition-trace.py \
            VC4_ARM_TRANSITION_*.json \
            VC4_ARM_TRANSITION_*.md
          git commit -m "vc4: trace stock-firmware ARM handoff transitions"
          git push origin HEAD:"$NEXT_BRANCH"
          case "$diagnosis" in
            pre-arm-release-vpu-stall)
              diagnosis_branch=agent/vc4-post-msync-vpu-frontier ;;
            missing-arm-release-side-effect)
              diagnosis_branch=agent/vc4-arm-release-side-effect ;;
            arm-release-state-overwritten)
              diagnosis_branch=agent/vc4-arm-release-state ;;
            missing-arm-entry-pc-transfer)
              diagnosis_branch=agent/vc4-arm-entry-pc ;;
            arm-entry-state-or-exception)
              diagnosis_branch=agent/vc4-arm-entry-exception ;;
            release-before-payload-load)
              diagnosis_branch=agent/vc4-arm-release-ordering ;;
            handoff-reached)
              diagnosis_branch=agent/vc4-arm-handoff-confirmed ;;
            *)
              diagnosis_branch=agent/vc4-arm-transition-followup ;;
          esac
          git push --force-with-lease origin HEAD:"$diagnosis_branch"
          echo "diagnosis=$diagnosis" >> "$GITHUB_OUTPUT"
          echo "branch=$diagnosis_branch" >> "$GITHUB_OUTPUT"

      - name: Remove trace workflow from the source branch
        if: steps.scheduler.outputs.result != 'pending'
        run: |
          set -euo pipefail
          git fetch origin agent/vc4-post-preg-arm-release
          git checkout -B cleanup-transition-trace \
            origin/agent/vc4-post-preg-arm-release
          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git rm -f .github/workflows/vc4-arm-transition-trace.yml \
            2>/dev/null || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci/vc4: clean ARM transition trace workflow"
          git pull --rebase origin agent/vc4-post-preg-arm-release
          git push origin HEAD:agent/vc4-post-preg-arm-release
