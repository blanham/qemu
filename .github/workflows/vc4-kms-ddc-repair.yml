name: VC4 KMS HDMI DDC repair

on:
  push:
    branches:
      - agent/vc4-linux-kms-frontier
    paths:
      - .github/workflows/vc4-kms-ddc-repair.yml

permissions:
  contents: write

concurrency:
  group: vc4-kms-ddc-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Attach a deterministic HDMI monitor and clean the staged sources
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          kconfig_path = Path("hw/arm/Kconfig")
          kconfig = kconfig_path.read_text()
          kconfig_anchor = """    select BCM2835_SPI
              select BCM2835_I2C
          """
          kconfig_replacement = """    select BCM2835_SPI
              select BCM2835_I2C
              select DDC
          """
          if kconfig.count(kconfig_anchor) != 1:
              raise SystemExit("RASPI Kconfig anchor changed")
          kconfig_path.write_text(
              kconfig.replace(kconfig_anchor, kconfig_replacement, 1)
          )

          peripherals_path = Path("hw/arm/bcm2835_peripherals.c")
          peripherals = peripherals_path.read_text()
          include_anchor = '#include "hw/arm/bcm2835_peripherals.h"\n'
          include_replacement = (
              include_anchor + '#include "hw/display/i2c-ddc.h"\n'
          )
          if peripherals.count(include_anchor) != 1:
              raise SystemExit("peripherals include anchor changed")
          peripherals = peripherals.replace(
              include_anchor, include_replacement, 1
          )

          define_anchor = "#define ORGATED_I2C_IRQ_COUNT 3\n"
          define_replacement = (
              define_anchor + "\n#define BCM2835_HDMI_DDC_ADDRESS 0x50\n"
          )
          if peripherals.count(define_anchor) != 1:
              raise SystemExit("I2C define anchor changed")
          peripherals = peripherals.replace(
              define_anchor, define_replacement, 1
          )

          realize_anchor = """    for (n = 0; n < 3; n++) {
                  if (!sysbus_realize(SYS_BUS_DEVICE(&s->i2c[n]), errp)) {
                      return;
                  }
              }

              memory_region_add_subregion(&s->peri_mr, BSC0_OFFSET,
          """
          realize_replacement = """    for (n = 0; n < 3; n++) {
                  if (!sysbus_realize(SYS_BUS_DEVICE(&s->i2c[n]), errp)) {
                      return;
                  }
              }

              /*
               * BSC2 is wired to the HDMI DDC channel.  Keep a monitor
               * present so native VC4 KMS can discover a physical connector
               * and deterministic modes without host display dependencies.
               */
              i2c_slave_create_simple(s->i2c[2].bus, TYPE_I2CDDC,
                                      BCM2835_HDMI_DDC_ADDRESS);

              memory_region_add_subregion(&s->peri_mr, BSC0_OFFSET,
          """
          if peripherals.count(realize_anchor) != 1:
              raise SystemExit("I2C realization anchor changed")
          peripherals_path.write_text(
              peripherals.replace(realize_anchor, realize_replacement, 1)
          )

          property_path = Path("hw/misc/bcm2835_property.c")
          property_source = property_path.read_text()
          property_source = property_source.replace(
              "#define BCM2835_PROPERTY_EXP_GPIO_COUNT 8\n\n\n",
              "#define BCM2835_PROPERTY_EXP_GPIO_COUNT 8\n\n",
              1,
          )
          old_helpers = """static uint32_t bcm2835_property_get_bit(uint32_t states,
                                                            uint32_t id)
          {
          """
          new_helpers = """static uint32_t bcm2835_property_get_bit(uint32_t states, uint32_t id)
          {
          """
          if property_source.count(old_helpers) != 1:
              raise SystemExit("get-bit formatting anchor changed")
          property_source = property_source.replace(old_helpers, new_helpers, 1)

          old_set = """static uint32_t bcm2835_property_set_bit(uint32_t *states,
                                                            uint32_t id,
                                                            uint32_t requested)
          {
          """
          new_set = """static uint32_t bcm2835_property_set_bit(uint32_t *states, uint32_t id,
                                                    uint32_t requested)
          {
          """
          if property_source.count(old_set) != 1:
              raise SystemExit("set-bit formatting anchor changed")
          property_source = property_source.replace(old_set, new_set, 1)

          old_index = """static bool bcm2835_property_exp_gpio_index(uint32_t id,
                                                         uint32_t *index)
          {
          """
          new_index = """static bool bcm2835_property_exp_gpio_index(uint32_t id, uint32_t *index)
          {
          """
          if property_source.count(old_index) != 1:
              raise SystemExit("GPIO-index formatting anchor changed")
          property_path.write_text(
              property_source.replace(old_index, new_index, 1)
          )

          smoke_path = Path("scripts/vc4/property-power-domain-smoke.py")
          smoke = smoke_path.read_text()
          smoke = smoke.replace(
              '"""Exercise Raspberry Pi firmware legacy and modern power-state tags."""',
              '"""Exercise Raspberry Pi firmware state and HDMI DDC plumbing."""',
              1,
          )
          constants_anchor = """PROPERTY_RESPONSE_LENGTH = (1 << 31) | 8

          RPI_FWREQ_GET_POWER_STATE = 0x00020001
          """
          constants_replacement = """PROPERTY_RESPONSE_LENGTH = (1 << 31) | 8

          BSC2_BASE = RPI3_PERIPHERAL_BASE + 0x00805000
          BCM2835_I2C_C = BSC2_BASE + 0x00
          BCM2835_I2C_S = BSC2_BASE + 0x04
          BCM2835_I2C_DLEN = BSC2_BASE + 0x08
          BCM2835_I2C_A = BSC2_BASE + 0x0C
          BCM2835_I2C_FIFO = BSC2_BASE + 0x10
          BCM2835_I2C_C_READ = 1 << 0
          BCM2835_I2C_C_ST = 1 << 7
          BCM2835_I2C_C_I2CEN = 1 << 15
          BCM2835_I2C_S_DONE = 1 << 1
          BCM2835_I2C_S_ERR = 1 << 8
          BCM2835_I2C_S_CLKT = 1 << 9
          HDMI_DDC_ADDRESS = 0x50
          EDID_LENGTH = 128
          EDID_HEADER = bytes((0x00, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0x00))

          RPI_FWREQ_GET_POWER_STATE = 0x00020001
          """
          if smoke.count(constants_anchor) != 1:
              raise SystemExit("smoke constants anchor changed")
          smoke = smoke.replace(constants_anchor, constants_replacement, 1)

          helper_anchor = "\ndef expect_state(\n"
          helper = '''

          def bsc2_status(qtest: QTestClient) -> int:
              return qtest.readl(BCM2835_I2C_S)


          def bsc2_require_success(qtest: QTestClient, operation: str) -> None:
              status = bsc2_status(qtest)
              if status & (BCM2835_I2C_S_ERR | BCM2835_I2C_S_CLKT):
                  raise RuntimeError(
                      f"BSC2 {operation} failed with status 0x{status:08x}"
                  )
              if not status & BCM2835_I2C_S_DONE:
                  raise RuntimeError(
                      f"BSC2 {operation} did not complete: 0x{status:08x}"
                  )


          def bsc2_clear_status(qtest: QTestClient) -> None:
              qtest.writel(
                  BCM2835_I2C_S,
                  BCM2835_I2C_S_DONE | BCM2835_I2C_S_ERR |
                  BCM2835_I2C_S_CLKT,
              )


          def bsc2_set_ddc_offset(qtest: QTestClient, offset: int) -> None:
              bsc2_clear_status(qtest)
              qtest.writel(BCM2835_I2C_A, HDMI_DDC_ADDRESS)
              qtest.writel(BCM2835_I2C_DLEN, 1)
              qtest.writel(
                  BCM2835_I2C_C,
                  BCM2835_I2C_C_I2CEN | BCM2835_I2C_C_ST,
              )
              qtest.writel(BCM2835_I2C_FIFO, offset)
              bsc2_require_success(qtest, "DDC offset write")


          def bsc2_read_edid(qtest: QTestClient) -> bytes:
              bsc2_set_ddc_offset(qtest, 0)
              bsc2_clear_status(qtest)
              qtest.writel(BCM2835_I2C_A, HDMI_DDC_ADDRESS)
              qtest.writel(BCM2835_I2C_DLEN, EDID_LENGTH)
              qtest.writel(
                  BCM2835_I2C_C,
                  BCM2835_I2C_C_I2CEN | BCM2835_I2C_C_ST |
                  BCM2835_I2C_C_READ,
              )
              edid = bytes(
                  qtest.readl(BCM2835_I2C_FIFO) & 0xFF
                  for _ in range(EDID_LENGTH)
              )
              bsc2_require_success(qtest, "EDID read")
              return edid
          '''
          if smoke.count(helper_anchor) != 1:
              raise SystemExit("expect-state insertion anchor changed")
          smoke = smoke.replace(helper_anchor, helper + helper_anchor, 1)
          smoke = smoke.replace(
              "        )\ndef expect_state(\n",
              "        )\n\n\ndef expect_state(\n",
              1,
          )
          smoke = smoke.replace(
              "\n\n            for offset in range(EXP_GPIO_COUNT):",
              "\n            for offset in range(EXP_GPIO_COUNT):",
              1,
          )

          runtime_anchor = """            qmp.execute("system_reset")
              if exp_gpio_get_config(qtest, EXP_GPIO_HDMI_HPD) != (0, 0, 0, 0):
                  raise RuntimeError("expander GPIO config survived reset")
              if exp_gpio_get_state(qtest, EXP_GPIO_HDMI_HPD) != 0:
                  raise RuntimeError("expander GPIO state survived reset")
          """
          runtime_replacement = runtime_anchor + """

              edid = bsc2_read_edid(qtest)
              if not edid.startswith(EDID_HEADER):
                  raise RuntimeError(f"invalid EDID header: {edid[:8].hex()}")
              if sum(edid) & 0xFF:
                  raise RuntimeError("EDID checksum is invalid")
              if edid[18:20] != bytes((1, 4)):
                  raise RuntimeError(
                      f"unexpected EDID version {edid[18]}.{edid[19]}"
                  )
          """
          if smoke.count(runtime_anchor) != 1:
              raise SystemExit("runtime DDC insertion anchor changed")
          smoke = smoke.replace(runtime_anchor, runtime_replacement, 1)
          smoke = smoke.replace(
              'print("Raspberry Pi firmware power-domain and expander GPIO smoke test passed")',
              'print("Raspberry Pi firmware state and HDMI DDC smoke test passed")',
              1,
          )
          smoke_path.write_text(smoke)
          PY

          python3 -m py_compile scripts/vc4/property-power-domain-smoke.py
          git diff --check
          grep -Fq 'select DDC' hw/arm/Kconfig
          grep -Fq TYPE_I2CDDC hw/arm/bcm2835_peripherals.c
          grep -Fq bsc2_read_edid scripts/vc4/property-power-domain-smoke.py

      - name: Publish the repair and remove this transient workflow
        run: |
          set -euo pipefail
          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git add -- \
            hw/arm/Kconfig \
            hw/arm/bcm2835_peripherals.c \
            hw/misc/bcm2835_property.c \
            scripts/vc4/property-power-domain-smoke.py
          git rm -- .github/workflows/vc4-kms-ddc-repair.yml
          git commit -m "hw/arm: provide Raspberry Pi HDMI EDID over DDC"
          git pull --rebase origin agent/vc4-linux-kms-frontier
          git push origin HEAD:agent/vc4-linux-kms-frontier
