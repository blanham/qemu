name: VC4 Linux DRM UAPI direct matrix

on:
  push:
    branches:
      - agent/vc4-linux-v3d-driver-probe
    paths:
      - .github/workflows/vc4-linux-v3d-uapi-direct.yml
      - hw/arm/bcm2835_peripherals.c
      - hw/display/bcm2835_v3d.c
      - include/hw/arm/bcm2835_peripherals.h
      - include/hw/display/bcm2835_v3d.h
      - scripts/vc4/build-linux-v3d-uapi-initramfs.sh
      - scripts/vc4/build-v3d-linux-dtb.sh
      - scripts/vc4/summarize-linux-v3d-uapi.py
      - scripts/vc4/raspi3-linux-probe.py
      - scripts/vc4/preg-mutex-smoke.py
      - scripts/vc4/msync-smoke.py
      - scripts/vc4/v3d-smoke.py
      - tests/vc4/linux-v3d-uapi-init.c
      - tests/vc4/vc4-render-only-overlay.dts
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-linux-v3d-uapi-direct
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RPI_FIRMWARE_COMMIT: 3d301dd924bcd758a4c8cb19fe8531031f033f43
      OFFICIAL_DIR: /tmp/vc4-linux-drm-uapi-official
      DTB_DIR: /tmp/vc4-linux-drm-uapi-dtbs
      MATRIX_DIR: /tmp/vc4-linux-drm-uapi-matrix
      EVIDENCE_DIR: vc4-linux-drm-uapi-evidence

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        id: dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            binutils-aarch64-linux-gnu \
            cpio curl device-tree-compiler file \
            gcc-aarch64-linux-gnu gzip \
            libc6-dev-arm64-cross linux-libc-dev-arm64-cross \
            ninja-build pkg-config python3 python3-venv \
            libglib2.0-dev libpixman-1-dev zlib1g-dev

      - name: Validate source and fetch pinned Raspberry Pi artifacts
        id: source
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/vc4/raspi3-linux-probe.py \
            scripts/vc4/summarize-linux-v3d-uapi.py \
            scripts/vc4/preg-mutex-smoke.py \
            scripts/vc4/msync-smoke.py \
            scripts/vc4/v3d-smoke.py
          bash -n \
            scripts/vc4/build-linux-v3d-uapi-initramfs.sh \
            scripts/vc4/build-v3d-linux-dtb.sh
          git diff --check
          grep -q 'V3D_IDENT0_VALUE' hw/display/bcm2835_v3d.c
          grep -q 'TYPE_BCM2835_V3D' hw/arm/bcm2835_peripherals.c

          rm -rf "$OFFICIAL_DIR" "$DTB_DIR" "$MATRIX_DIR" "$EVIDENCE_DIR"
          mkdir -p "$OFFICIAL_DIR" "$DTB_DIR" "$MATRIX_DIR" "$EVIDENCE_DIR"
          for file in kernel8.img bcm2710-rpi-3-b.dtb; do
            curl --fail --location --retry 5 \
              --output "$OFFICIAL_DIR/$file" \
              "https://raw.githubusercontent.com/raspberrypi/firmware/${RPI_FIRMWARE_COMMIT}/boot/$file"
          done
          for overlay in vc4-kms-v3d.dtbo vc4-fkms-v3d.dtbo; do
            curl --fail --location --retry 5 \
              --output "$OFFICIAL_DIR/$overlay" \
              "https://raw.githubusercontent.com/raspberrypi/firmware/${RPI_FIRMWARE_COMMIT}/boot/overlays/$overlay"
          done
          test "$(git hash-object "$OFFICIAL_DIR/kernel8.img")" = \
            a694aa64988bbecadc770c874488165303eac673
          test "$(git hash-object "$OFFICIAL_DIR/bcm2710-rpi-3-b.dtb")" = \
            398c480adc49a5fcb03aa4c095ea74db5d1f893b
          test "$(git hash-object "$OFFICIAL_DIR/vc4-kms-v3d.dtbo")" = \
            572697308de9c682e973633514205e02b173c277
          test "$(git hash-object "$OFFICIAL_DIR/vc4-fkms-v3d.dtbo")" = \
            230dd8cb0923f2dce912569a3e8959ad68cd7273
          sha256sum "$OFFICIAL_DIR"/* > "$EVIDENCE_DIR/OFFICIAL_SHA256SUMS"

      - name: Configure and build both frontends
        id: build
        run: |
          set -euo pipefail
          ./configure \
            --target-list=aarch64-softmmu,vc4-softmmu \
            --disable-docs --disable-werror \
            2>&1 | tee "$EVIDENCE_DIR/configure.log"
          ninja -C build qemu-system-aarch64 qemu-system-vc4 \
            2>&1 | tee "$EVIDENCE_DIR/build.log"

      - name: Preserve VC4 architectural regressions
        id: regressions
        run: |
          set -euo pipefail
          python3 scripts/vc4/preg-mutex-smoke.py \
            --qemu build/qemu-system-vc4 \
            2>&1 | tee "$EVIDENCE_DIR/preg.log"
          python3 scripts/vc4/msync-smoke.py \
            --qemu build/qemu-system-aarch64 \
            2>&1 | tee "$EVIDENCE_DIR/msync.log"
          python3 scripts/vc4/v3d-smoke.py \
            --qemu build/qemu-system-aarch64 \
            2>&1 | tee "$EVIDENCE_DIR/v3d.log"

      - name: Build deterministic Linux UAPI fixture and DT matrix
        id: fixtures
        run: |
          set -euo pipefail
          bash scripts/vc4/build-linux-v3d-uapi-initramfs.sh \
            build/vc4-linux-v3d-uapi-initramfs
          test -s build/vc4-linux-v3d-uapi-initramfs/initramfs.cpio.gz

          cp "$OFFICIAL_DIR/bcm2710-rpi-3-b.dtb" "$DTB_DIR/base.dtb"
          dtc -q -@ -I dts -O dtb \
            -o "$DTB_DIR/render-only.dtbo" \
            tests/vc4/vc4-render-only-overlay.dts
          bash scripts/vc4/build-v3d-linux-dtb.sh \
            "$OFFICIAL_DIR/bcm2710-rpi-3-b.dtb" \
            "$DTB_DIR/render-only.dtbo" \
            "$DTB_DIR/render-only.dtb"
          bash scripts/vc4/build-v3d-linux-dtb.sh \
            "$OFFICIAL_DIR/bcm2710-rpi-3-b.dtb" \
            "$OFFICIAL_DIR/vc4-fkms-v3d.dtbo" \
            "$DTB_DIR/fkms.dtb"
          bash scripts/vc4/build-v3d-linux-dtb.sh \
            "$OFFICIAL_DIR/bcm2710-rpi-3-b.dtb" \
            "$OFFICIAL_DIR/vc4-kms-v3d.dtbo" \
            "$DTB_DIR/kms.dtb"
          sha256sum "$DTB_DIR"/* > "$EVIDENCE_DIR/DTB_SHA256SUMS"
          cp build/vc4-linux-v3d-uapi-initramfs/SHA256SUMS \
            "$EVIDENCE_DIR/INITRAMFS_SHA256SUMS"

      - name: Boot Linux across the V3D DT matrix
        id: matrix
        run: |
          set -euo pipefail
          for variant in base render-only fkms kms; do
            out="$MATRIX_DIR/$variant"
            mkdir -p "$out"
            set +e
            python3 scripts/vc4/raspi3-linux-probe.py \
              --mode linux-direct \
              --qemu build/qemu-system-aarch64 \
              --kernel "$OFFICIAL_DIR/kernel8.img" \
              --dtb "$DTB_DIR/$variant.dtb" \
              --initrd build/vc4-linux-v3d-uapi-initramfs/initramfs.cpio.gz \
              --out-dir "$out" \
              --seconds 55 --sample-interval 5 \
              > "$out/probe.stdout" 2>&1
            rc=$?
            set -e
            printf '%s\n' "$rc" > "$out/return-code"
            cat "$out/probe.stdout"
          done

      - name: Record exact Linux DRM UAPI frontier
        id: record
        if: always()
        run: |
          set +e
          python3 scripts/vc4/summarize-linux-v3d-uapi.py \
            --root "$MATRIX_DIR" \
            --variants base render-only fkms kms \
            --json VC4_LINUX_DRM_UAPI_DIRECT_STATUS.json \
            --markdown VC4_LINUX_DRM_UAPI_DIRECT_STATUS.md
          rc=$?
          set -e
          echo "return_code=$rc" >> "$GITHUB_OUTPUT"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          status = json.loads(
              Path('VC4_LINUX_DRM_UAPI_DIRECT_STATUS.json').read_text()
          )
          print('passed=' + str(bool(status.get('passed'))).lower())
          print('best_variant=' + str(status.get('best', {}).get('variant')))
          print('classification=' +
                str(status.get('best', {}).get('classification')))
          PY

      - name: Collect full evidence
        if: always()
        run: |
          set -euo pipefail
          cp -a "$MATRIX_DIR" "$EVIDENCE_DIR/matrix" || true
          cp -a "$DTB_DIR" "$EVIDENCE_DIR/dtbs" || true
          cp VC4_LINUX_DRM_UAPI_DIRECT_STATUS.json "$EVIDENCE_DIR/" || true
          cp VC4_LINUX_DRM_UAPI_DIRECT_STATUS.md "$EVIDENCE_DIR/" || true

      - name: Upload full evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-linux-drm-uapi-direct-${{ github.run_attempt }}
          path: vc4-linux-drm-uapi-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Publish frontier and retire successful one-shot gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f VC4_LINUX_DRM_UAPI_DIRECT_STATUS.json
          passed=$(python3 - <<'PY'
          import json
          from pathlib import Path
          print('true' if json.loads(
              Path('VC4_LINUX_DRM_UAPI_DIRECT_STATUS.json').read_text()
          ).get('passed') else 'false')
          PY
          )

          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git add -- \
            VC4_LINUX_DRM_UAPI_DIRECT_STATUS.json \
            VC4_LINUX_DRM_UAPI_DIRECT_STATUS.md
          if [ "$passed" = true ]; then
            git rm -- .github/workflows/vc4-linux-v3d-uapi-direct.yml
            message='hw/display: validate Linux VC4 DRM UAPI'
          else
            message='ci/vc4: record Linux DRM UAPI frontier [skip ci]'
          fi
          git diff --cached --check
          git commit -m "$message"
          git pull --rebase origin agent/vc4-linux-v3d-driver-probe
          git push origin HEAD:agent/vc4-linux-v3d-driver-probe
