name: WD40 QMP pipe repair

on:
  push:
    branches:
      - wd40/qol-integration
    paths:
      - .github/workflows/wd40-qmp-pipe-repair.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wd40-qmp-pipe-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the integration branch
        uses: actions/checkout@v4
        with:
          ref: wd40/qol-integration
          fetch-depth: 0

      - name: Configure commit identity
        run: |
          git config user.name "WD40 Build Bot"
          git config user.email "wd40-build@users.noreply.github.com"

      - name: Repair the QMP reader and wire its regression witness
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          checker = Path("scripts/ci/check-wd40-debug-point-service.py")
          text = checker.read_text(encoding="utf-8")

          replacements = (
              (
                  "import os",
                  """from dataclasses import dataclass
          import json
          from pathlib import Path
          """,
                  """from dataclasses import dataclass
          import json
          import os
          from pathlib import Path
          """,
              ),
              (
                  "binary subprocess pipes",
                  """        self.process = subprocess.Popen(
                      command,
                      text=True,
                      encoding="utf-8",
                      stdin=subprocess.PIPE,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      bufsize=1,
                  )
          """,
                  """        self.process = subprocess.Popen(
                      command,
                      stdin=subprocess.PIPE,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      bufsize=0,
                  )
          """,
              ),
              (
                  "explicit receive buffer",
                  """        self.selector = selectors.DefaultSelector()
                  self.selector.register(self.process.stdout, selectors.EVENT_READ)
                  self.sequence = 0
          """,
                  """        self.selector = selectors.DefaultSelector()
                  self.selector.register(self.process.stdout, selectors.EVENT_READ)
                  self.output = bytearray()
                  self.sequence = 0
          """,
              ),
              (
                  "binary stderr decoding",
                  """        return self.process.stderr.read()
          """,
                  """        return self.process.stderr.read().decode(
                      "utf-8",
                      errors="replace",
                  )
          """,
              ),
              (
                  "buffer-draining QMP parser",
                  """    def _next_json(self, timeout: float) -> dict[str, Any]:
                  deadline = time.monotonic() + timeout
                  while True:
                      remaining = deadline - time.monotonic()
                      if remaining <= 0:
                          self._abort("timed out waiting for a QMP reply")
                      ready = self.selector.select(remaining)
                      if not ready:
                          if self.process.poll() is not None:
                              self._abort("QEMU exited before the expected QMP reply")
                          self._abort("timed out waiting for QMP output")
                      line = self.process.stdout.readline()
                      if line == "":
                          self._abort("QMP stdout closed unexpectedly")
                      line = line.strip()
                      if not line.startswith("{"):
                          continue
                      try:
                          item = json.loads(line)
                      except json.JSONDecodeError:
                          continue
                      if isinstance(item, dict):
                          return item
          """,
                  """    def _pop_json(self) -> dict[str, Any] | None:
                  while True:
                      newline = self.output.find(b"\\n")
                      if newline < 0:
                          return None
                      line = bytes(self.output[:newline])
                      del self.output[:newline + 1]
                      line = line.strip()
                      if not line.startswith(b"{"):
                          continue
                      try:
                          item = json.loads(line)
                      except (json.JSONDecodeError, UnicodeDecodeError):
                          continue
                      if isinstance(item, dict):
                          return item

              def _next_json(self, timeout: float) -> dict[str, Any]:
                  deadline = time.monotonic() + timeout
                  while True:
                      item = self._pop_json()
                      if item is not None:
                          return item
                      remaining = deadline - time.monotonic()
                      if remaining <= 0:
                          self._abort("timed out waiting for a QMP reply")
                      ready = self.selector.select(remaining)
                      if not ready:
                          if self.process.poll() is not None:
                              self._abort("QEMU exited before the expected QMP reply")
                          self._abort("timed out waiting for QMP output")
                      chunk = os.read(self.process.stdout.fileno(), 65536)
                      if not chunk:
                          self._abort("QMP stdout closed unexpectedly")
                      self.output.extend(chunk)
          """,
              ),
              (
                  "binary QMP writes",
                  """            self.process.stdin.write(json.dumps(message) + "\\n")
          """,
                  """            self.process.stdin.write(
                      json.dumps(message).encode("utf-8") + b"\\n"
                  )
          """,
              ),
          )

          changed = []
          for label, old, new in replacements:
              old_count = text.count(old)
              new_count = text.count(new)
              if old_count == 1 and new_count == 0:
                  text = text.replace(old, new, 1)
                  changed.append(label)
              elif old_count == 0 and new_count == 1:
                  continue
              else:
                  raise SystemExit(
                      f"{label}: expected one old or one new block; "
                      f"old={old_count}, new={new_count}"
                  )

          compile(text, str(checker), "exec")
          checker.write_text(text, encoding="utf-8")
          print("checker transformations:", ", ".join(changed) or "already applied")

          workflow = Path(".github/workflows/wd40-qol-integration.yml")
          workflow_text = workflow.read_text(encoding="utf-8")
          marker = "      - name: Reproduce QMP event/reply burst buffering\n"
          anchor = "      - name: Exercise typed breakpoints and watchpoints\n"
          block = """      - name: Reproduce QMP event/reply burst buffering
                  run: |
                    set -Eeuo pipefail
                    python3 scripts/ci/test-wd40-qmp-pipe-buffer.py

          """
          if marker not in workflow_text:
              if workflow_text.count(anchor) != 1:
                  raise SystemExit("integration workflow: missing unique debug-point step")
              workflow_text = workflow_text.replace(anchor, block + anchor, 1)
              workflow.write_text(workflow_text, encoding="utf-8")
              print("wired QMP burst-buffer regression witness")
          else:
              print("QMP burst-buffer regression witness already wired")
          PY

          python3 -m py_compile scripts/ci/check-wd40-debug-point-service.py
          git diff --check

      - name: Commit the durable repair and remove this scaffold
        run: |
          set -Eeuo pipefail
          git rm -- .github/workflows/wd40-qmp-pipe-repair.yml
          git add -- \
            .github/workflows/wd40-qol-integration.yml \
            scripts/ci/check-wd40-debug-point-service.py
          git diff --cached --check
          git diff --cached --stat
          git commit -m "tests: drain buffered QMP replies in WD40 checker"
          git push origin HEAD:wd40/qol-integration
