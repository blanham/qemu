name: WD40 QMP pipe repair

on:
  push:
    branches:
      - wd40/qol-integration
    paths:
      - .github/workflows/wd40-qmp-pipe-repair.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wd40-qmp-pipe-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the integration branch
        uses: actions/checkout@v4
        with:
          ref: wd40/qol-integration
          fetch-depth: 0

      - name: Configure commit identity
        run: |
          git config user.name "WD40 Build Bot"
          git config user.email "wd40-build@users.noreply.github.com"

      - name: Repair and exercise the QMP reader
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          checker = Path("scripts/ci/check-wd40-debug-point-service.py")
          text = checker.read_text(encoding="utf-8")

          replacements = (
              (
                  "import os",
                  """from dataclasses import dataclass
          import json
          from pathlib import Path
          """,
                  """from dataclasses import dataclass
          import json
          import os
          from pathlib import Path
          """,
              ),
              (
                  "binary subprocess pipes",
                  """        self.process = subprocess.Popen(
                      command,
                      text=True,
                      encoding="utf-8",
                      stdin=subprocess.PIPE,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      bufsize=1,
                  )
          """,
                  """        self.process = subprocess.Popen(
                      command,
                      stdin=subprocess.PIPE,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      bufsize=0,
                  )
          """,
              ),
              (
                  "explicit receive buffer",
                  """        self.selector = selectors.DefaultSelector()
                  self.selector.register(self.process.stdout, selectors.EVENT_READ)
                  self.sequence = 0
          """,
                  """        self.selector = selectors.DefaultSelector()
                  self.selector.register(self.process.stdout, selectors.EVENT_READ)
                  self.output = bytearray()
                  self.sequence = 0
          """,
              ),
              (
                  "binary stderr decoding",
                  """        return self.process.stderr.read()
          """,
                  """        return self.process.stderr.read().decode(
                      "utf-8",
                      errors="replace",
                  )
          """,
              ),
              (
                  "buffer-draining QMP parser",
                  """    def _next_json(self, timeout: float) -> dict[str, Any]:
                  deadline = time.monotonic() + timeout
                  while True:
                      remaining = deadline - time.monotonic()
                      if remaining <= 0:
                          self._abort("timed out waiting for a QMP reply")
                      ready = self.selector.select(remaining)
                      if not ready:
                          if self.process.poll() is not None:
                              self._abort("QEMU exited before the expected QMP reply")
                          self._abort("timed out waiting for QMP output")
                      line = self.process.stdout.readline()
                      if line == "":
                          self._abort("QMP stdout closed unexpectedly")
                      line = line.strip()
                      if not line.startswith("{"):
                          continue
                      try:
                          item = json.loads(line)
                      except json.JSONDecodeError:
                          continue
                      if isinstance(item, dict):
                          return item
          """,
                  """    def _pop_json(self) -> dict[str, Any] | None:
                  while True:
                      newline = self.output.find(b"\\n")
                      if newline < 0:
                          return None
                      line = bytes(self.output[:newline])
                      del self.output[:newline + 1]
                      line = line.strip()
                      if not line.startswith(b"{"):
                          continue
                      try:
                          item = json.loads(line)
                      except (json.JSONDecodeError, UnicodeDecodeError):
                          continue
                      if isinstance(item, dict):
                          return item

              def _next_json(self, timeout: float) -> dict[str, Any]:
                  deadline = time.monotonic() + timeout
                  while True:
                      item = self._pop_json()
                      if item is not None:
                          return item
                      remaining = deadline - time.monotonic()
                      if remaining <= 0:
                          self._abort("timed out waiting for a QMP reply")
                      ready = self.selector.select(remaining)
                      if not ready:
                          if self.process.poll() is not None:
                              self._abort("QEMU exited before the expected QMP reply")
                          self._abort("timed out waiting for QMP output")
                      chunk = os.read(self.process.stdout.fileno(), 65536)
                      if not chunk:
                          self._abort("QMP stdout closed unexpectedly")
                      self.output.extend(chunk)
          """,
              ),
              (
                  "binary QMP writes",
                  """            self.process.stdin.write(json.dumps(message) + "\\n")
          """,
                  """            self.process.stdin.write(
                      json.dumps(message).encode("utf-8") + b"\\n"
                  )
          """,
              ),
          )

          changed = []
          for label, old, new in replacements:
              old_count = text.count(old)
              new_count = text.count(new)
              if old_count == 1 and new_count == 0:
                  text = text.replace(old, new, 1)
                  changed.append(label)
              elif old_count == 0 and new_count == 1:
                  continue
              else:
                  raise SystemExit(
                      f"{label}: expected one old or one new block; "
                      f"old={old_count}, new={new_count}"
                  )

          compile(text, str(checker), "exec")
          checker.write_text(text, encoding="utf-8")
          print("checker transformations:", ", ".join(changed) or "already applied")
          PY

          python3 -m py_compile scripts/ci/check-wd40-debug-point-service.py

          python3 - <<'PY'
          import importlib.util
          import json
          from pathlib import Path
          import sys
          import tempfile

          checker = Path("scripts/ci/check-wd40-debug-point-service.py")
          spec = importlib.util.spec_from_file_location("wd40_debug_checker", checker)
          if spec is None or spec.loader is None:
              raise SystemExit("could not load transformed checker")
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)

          peer_source = '''#!/usr/bin/env python3
          import json
          import sys

          sys.stdout.write(json.dumps({"QMP": {"version": {}, "capabilities": []}}) + "\\n")
          sys.stdout.flush()
          for line in sys.stdin:
              request = json.loads(line)
              command = request["execute"]
              if command == "qmp_capabilities":
                  response = {"return": {}, "id": request["id"]}
                  sys.stdout.write(json.dumps(response) + "\\n")
                  sys.stdout.flush()
              elif command == "cont":
                  event = {"event": "RESUME", "data": {}}
                  response = {"return": {}, "id": request["id"]}
                  sys.stdout.write(json.dumps(event) + "\\n" + json.dumps(response) + "\\n")
                  sys.stdout.flush()
              elif command == "quit":
                  response = {"return": {}, "id": request["id"]}
                  sys.stdout.write(json.dumps(response) + "\\n")
                  sys.stdout.flush()
                  break
          '''

          with tempfile.TemporaryDirectory() as directory:
              peer = Path(directory) / "fake-qmp.py"
              peer.write_text(peer_source, encoding="utf-8")
              peer.chmod(0o755)
              with module.QMPClient(peer, ()) as client:
                  reply = client.execute("cont")
                  if reply.get("return") != {}:
                      raise SystemExit(f"unexpected burst reply: {reply!r}")
          print("WD40 QMP event/reply burst witness: PASS")
          PY

          git diff --check

      - name: Commit the durable source repair
        run: |
          set -Eeuo pipefail
          git add -- scripts/ci/check-wd40-debug-point-service.py
          git diff --cached --check
          git diff --cached --stat
          git commit -m "tests: drain buffered QMP replies in WD40 checker"
          git push origin HEAD:wd40/qol-integration
