name: VC4 merge validated processor-control slice once

on:
  push:
    branches:
      - agent/vc4-preg-mutex
    paths:
      - .github/workflows/vc4-merge-preg-once.yml

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vc4-preg-mutex
          fetch-depth: 0

      - name: Check validation gates
        id: gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          import re

          status = json.loads(Path('VC4_PREG_MUTEX_STATUS.json').read_text())
          report = Path('VC4_NEXT_FRONTIER.md').read_text()
          if not status.get('passed'):
              raise SystemExit('processor-control build/smoke status did not pass')
          match = re.search(
              r'Previous p16 blocker occurrences:\s*\*\*(\d+)\*\*',
              report,
          )
          if not match:
              raise SystemExit('frontier report lacks the p16 blocker count')
          if int(match.group(1)) != 0:
              raise SystemExit('stock firmware still reports the old p16 blocker')
          PY

      - name: Squash validated slice into ARM-payload stage branch
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          feature=agent/vc4-preg-mutex
          base=agent/vc4-arm-payload-stage-repair
          git fetch origin "$feature" "$base"
          git switch --detach "origin/$base"
          git merge --squash "origin/$feature"
          rm -f .github/workflows/vc4-apply-preg-translator.yml
          rm -f .github/workflows/vc4-dispatch-stock-once.yml
          rm -f .github/workflows/vc4-validate-preg-once.yml
          rm -f .github/workflows/vc4-summarize-frontier-once.yml
          rm -f .github/workflows/vc4-atomic-preg-once.yml
          rm -f .github/workflows/vc4-merge-preg-once.yml
          rm -f scripts/vc4/preg-translator.patch
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'target/vc4: implement processor-control registers and mutexes'
          git push origin HEAD:"$base"
          echo "base_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record merge and clean feature branch
        if: always()
        shell: bash
        env:
          BASE_COMMIT: ${{ steps.merge.outputs.base_commit }}
          GATE_OUTCOME: ${{ steps.gates.outcome }}
          MERGE_OUTCOME: ${{ steps.merge.outcome }}
        run: |
          set -euo pipefail
          git fetch origin agent/vc4-preg-mutex
          git switch -C agent/vc4-preg-mutex \
            origin/agent/vc4-preg-mutex
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          result = {
              'schema': 1,
              'validation_gate': os.environ.get('GATE_OUTCOME'),
              'merge_step': os.environ.get('MERGE_OUTCOME'),
              'merged': os.environ.get('MERGE_OUTCOME') == 'success',
              'base_branch': 'agent/vc4-arm-payload-stage-repair',
              'base_commit': os.environ.get('BASE_COMMIT') or None,
          }
          Path('VC4_PREG_MERGE_STATUS.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n'
          )
          PY
          rm -f .github/workflows/vc4-merge-preg-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci/vc4: record processor-control slice merge [skip ci]'
          git pull --rebase origin agent/vc4-preg-mutex
          git push origin HEAD:agent/vc4-preg-mutex
