name: VC4 current-integration ARM release control

on:
  push:
    branches:
      - agent/vc4-arm-payload-stage-repair
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm-release-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build pkg-config python3 python3-venv \
            libglib2.0-dev libpixman-1-dev zlib1g-dev

      - name: Recover the independent ARM release witness
        run: |
          git fetch origin agent/vc4-raspi3-arm-start
          git show \
            origin/agent/vc4-raspi3-arm-start:scripts/vc4/raspi3-arm-start-smoke.py \
            >/tmp/raspi3-arm-start-smoke.py
          python3 -m py_compile /tmp/raspi3-arm-start-smoke.py

      - name: Configure and build current integration
        run: |
          ./configure \
            --target-list=aarch64-softmmu \
            --disable-docs \
            --disable-werror
          ninja -C build qemu-system-aarch64

      - name: Run the VC4-to-Cortex-A53 release control
        run: |
          set -o pipefail
          mkdir -p /tmp/vc4-current-arm-release-control
          python3 /tmp/raspi3-arm-start-smoke.py \
            build/qemu-system-aarch64 2>&1 \
            | tee /tmp/vc4-current-arm-release-control/control.log

      - name: Upload the control result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-current-arm-release-control-${{ github.run_attempt }}
          path: /tmp/vc4-current-arm-release-control
          if-no-files-found: warn
          retention-days: 14
