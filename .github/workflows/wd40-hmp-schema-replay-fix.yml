name: WD40 HMP schema replay repair

on:
  push:
    branches:
      - wd40/qol-hmp-schema-replay-fix
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wd40-hmp-schema-replay-fix
  cancel-in-progress: false

jobs:
  repair-build-test-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure commit identity
        run: |
          git config user.name "WD40 Build Bot"
          git config user.email "wd40-build@users.noreply.github.com"

      - name: Repair and replay HMP command schemas
        run: |
          set -Eeuo pipefail

          apply_hmp_contract() {
            python3 scripts/wd40/apply-hmp-command-schema-composability.py
            python3 scripts/wd40/apply-hmp-command-introspection-hardening.py
            python3 scripts/wd40/apply-hmp-command-introspection.py
            python3 scripts/wd40/apply-hmp-argument-introspection.py
          }

          apply_hmp_contract
          git diff --no-ext-diff --binary > /tmp/wd40-hmp-schema-pass1.diff
          apply_hmp_contract
          git diff --no-ext-diff --binary > /tmp/wd40-hmp-schema-pass2.diff
          cmp /tmp/wd40-hmp-schema-pass1.diff /tmp/wd40-hmp-schema-pass2.diff

          python3 scripts/ci/check-wd40-hmp-command-introspection.py
          python3 scripts/ci/check-wd40-hmp-argument-introspection.py
          python3 scripts/ci/check-wd40-hmp-schema-composability.py
          git diff --check

      - name: Install C build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            pkg-config \
            python3-venv \
            libglib2.0-dev \
            libpixman-1-dev

      - name: Build x86_64 without Rust
        run: |
          set -Eeuo pipefail
          mkdir .wd40-poison
          for tool in rustc cargo rustdoc rustfmt bindgen; do
            cat > ".wd40-poison/$tool" <<EOF
          #!/bin/sh
          echo "WD40 Rustless contract: unexpected invocation of $tool" >&2
          exit 99
          EOF
            chmod +x ".wd40-poison/$tool"
          done
          export PATH="$PWD/.wd40-poison:$PATH"

          mkdir build-hmp-schema
          cd build-hmp-schema
          ../configure \
            --target-list=x86_64-softmmu \
            --disable-rust \
            --enable-fdt=internal \
            --disable-docs \
            --disable-werror
          ninja -j2 qemu-system-x86_64
          cd ..

      - name: Exercise the live command and argument registry
        run: |
          set -Eeuo pipefail
          python3 scripts/ci/check-wd40-hmp-command-introspection.py \
            build-hmp-schema
          python3 scripts/ci/check-wd40-hmp-argument-introspection.py \
            build-hmp-schema

      - name: Publish validated schema ownership repair
        run: |
          set -Eeuo pipefail
          rm -rf .wd40-poison build-hmp-schema
          git add \
            scripts/wd40/apply-hmp-command-introspection.py \
            scripts/wd40/apply-hmp-command-introspection-hardening.py
          if git diff --cached --quiet; then
            echo "HMP schema ownership repair already published"
            exit 0
          fi
          git commit -m "scripts/wd40: make HMP schema replay composable"
          git push origin HEAD:wd40/qol-hmp-schema-replay-fix
