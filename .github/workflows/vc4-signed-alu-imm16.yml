name: VC4 signed scalar ALU imm16

on:
  push:
    branches:
      - agent/vc4-signed-alu-imm16
  workflow_dispatch:

permissions:
  contents: write

jobs:
  signed-alu-imm16:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RPI_FIRMWARE_COMMIT: 3d301dd924bcd758a4c8cb19fe8531031f033f43

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl ninja-build pkg-config python3 python3-venv \
            libglib2.0-dev libpixman-1-dev zlib1g-dev

      - name: Apply signed scalar ALU imm16 fix
        run: |
          python3 scripts/vc4/signed-alu-imm16-fixup.py
          git diff --check

      - name: Configure and build heterogeneous system emulator
        run: |
          ./configure \
            --target-list=aarch64-softmmu \
            --disable-docs \
            --disable-werror
          ninja -C build qemu-system-aarch64

      - name: Run signed scalar ALU imm16 regression
        run: |
          set -o pipefail
          python3 scripts/vc4/raspi3-signed-alu-imm16-smoke.py \
            build/qemu-system-aarch64 2>&1 | \
            tee /tmp/vc4-signed-alu-imm16-smoke.log

      - name: Commit production decoder fix locally
        id: production_commit
        run: |
          if git diff --quiet -- target/vc4/translate.c; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git add target/vc4/translate.c
          git commit -m "target/vc4: sign-extend scalar ALU imm16"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Download pinned official firmware trio
        run: |
          for file in bootcode.bin start.elf fixup.dat; do
            curl --fail --location --retry 4 \
              --output "/tmp/${file}" \
              "https://raw.githubusercontent.com/raspberrypi/firmware/${RPI_FIRMWARE_COMMIT}/boot/${file}"
          done
          test "$(git hash-object /tmp/bootcode.bin)" = \
            7642d2d89e4235e7d68875ff70688bdde6e71b5a
          test "$(git hash-object /tmp/start.elf)" = \
            0cefcf3a756740760f9903f35cc3843117853712
          test "$(git hash-object /tmp/fixup.dat)" = \
            1845e38de9d4f9a6d9ad7f5273bfe58b2582a7e6

      - name: Instrument low-memory POP-to-PC transfers
        run: |
          python3 scripts/vc4/signed-alu-imm16-progress-instrument.py
          git diff --check
          ninja -C build qemu-system-aarch64

      - name: Verify official firmware advances beyond the old stack failure
        run: |
          set -o pipefail
          python3 scripts/vc4/raspi3-stock-bootcode-0200.py \
            build/qemu-system-aarch64 \
            /tmp/bootcode.bin \
            --start-elf /tmp/start.elf \
            --fixup-dat /tmp/fixup.dat \
            --seconds 12 \
            --fast-tcg \
            --barrier-is-success 2>&1 | \
            tee /tmp/vc4-signed-alu-imm16-stock.log
          python3 scripts/vc4/check-signed-alu-imm16-progress.py \
            /tmp/vc4-signed-alu-imm16-stock.log

      - name: Restore production-only tree
        run: |
          git reset --hard HEAD
          git clean -fd
          git diff --exit-code

      - name: Push validated production fix
        if: steps.production_commit.outputs.created == 'true'
        run: |
          git push origin HEAD:refs/heads/agent/vc4-signed-alu-imm16

      - name: Upload signed-imm16 validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-signed-alu-imm16-${{ github.run_attempt }}
          path: |
            /tmp/vc4-signed-alu-imm16-smoke.log
            /tmp/vc4-signed-alu-imm16-stock.log
          if-no-files-found: warn
          retention-days: 14
