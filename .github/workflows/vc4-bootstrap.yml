name: Bootstrap VideoCore IV TCG target

on:
  push:
    branches:
      - agent/vc4-tcg-vpu

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install QEMU build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            pkg-config \
            python3 \
            python3-venv \
            libglib2.0-dev \
            libpixman-1-dev \
            zlib1g-dev

      - name: Materialize VC4 target
        run: python3 scripts/vc4/bootstrap.py

      - name: Apply current-QEMU compatibility fixes
        run: |
          sed -i '/#include "exec\/translation-block.h"/a #include "exec/target_page.h"' target/vc4/cpu.c

      - name: Configure
        run: |
          ./configure \
            --target-list=vc4-softmmu \
            --disable-docs \
            --disable-werror

      - name: Build
        run: ninja -C build qemu-system-vc4

      - name: Smoke-test target registration
        run: |
          build/qemu-system-vc4 -machine help | tee /tmp/vc4-machines.txt
          grep -q 'vc4-vpu' /tmp/vc4-machines.txt
          build/qemu-system-vc4 -cpu help | tee /tmp/vc4-cpus.txt
          grep -q 'vpu' /tmp/vc4-cpus.txt

      - name: Commit green implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git commit -m "target/vc4: add initial VideoCore IV VPU TCG frontend"
          git push origin HEAD:${GITHUB_REF_NAME}
