name: VC4 Linux framebuffer integration validation

on:
  push:
    branches:
      - agent/vc4-linux-framebuffer-integration
    paths:
      - .github/workflows/vc4-linux-framebuffer-integration.yml
      - hw/arm/vc4_raspi3_hetero.c
      - target/arm/tcg/op_helper.c
      - scripts/vc4/build-arm-framebuffer-smoke.sh
      - scripts/vc4/build-linux-initramfs.sh
      - scripts/vc4/raspi3-linux-probe.py
      - scripts/vc4/preg-mutex-smoke.py
      - scripts/vc4/msync-smoke.py
      - tests/vc4/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-linux-framebuffer-integration
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RPI_FIRMWARE_COMMIT: 3d301dd924bcd758a4c8cb19fe8531031f033f43
      OFFICIAL_DIR: /tmp/vc4-official
      BARE_DIR: /tmp/vc4-integration-bare
      LINUX_DIR: /tmp/vc4-integration-linux

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        id: dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            binutils-aarch64-linux-gnu \
            cpio curl file gcc-aarch64-linux-gnu gzip \
            libc6-dev-arm64-cross linux-libc-dev-arm64-cross \
            ninja-build pkg-config python3 python3-venv \
            libglib2.0-dev libpixman-1-dev zlib1g-dev

      - name: Validate source and fetch pinned Linux artifacts
        id: artifacts
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/vc4/raspi3-linux-probe.py \
            scripts/vc4/preg-mutex-smoke.py \
            scripts/vc4/msync-smoke.py
          git diff --check
          grep -q 'direct-arm-kernel' hw/arm/vc4_raspi3_hetero.c
          grep -q 'object_dynamic_cast(OBJECT(cs), TYPE_ARM_CPU)' \
            target/arm/tcg/op_helper.c

          rm -rf "$OFFICIAL_DIR"
          mkdir -p "$OFFICIAL_DIR"
          for file in kernel8.img bcm2710-rpi-3-b.dtb; do
            curl --fail --location --retry 5 \
              --output "$OFFICIAL_DIR/$file" \
              "https://raw.githubusercontent.com/raspberrypi/firmware/${RPI_FIRMWARE_COMMIT}/boot/$file"
          done
          test "$(git hash-object "$OFFICIAL_DIR/kernel8.img")" = \
            a694aa64988bbecadc770c874488165303eac673
          test "$(git hash-object "$OFFICIAL_DIR/bcm2710-rpi-3-b.dtb")" = \
            398c480adc49a5fcb03aa4c095ea74db5d1f893b
          sha256sum "$OFFICIAL_DIR"/* > "$OFFICIAL_DIR/SHA256SUMS"

      - name: Configure and build both frontends
        id: build
        run: |
          set -euo pipefail
          ./configure \
            --target-list=aarch64-softmmu,vc4-softmmu \
            --disable-docs --disable-werror \
            2>&1 | tee /tmp/vc4-integration-configure.log
          ninja -C build qemu-system-aarch64 qemu-system-vc4 \
            2>&1 | tee /tmp/vc4-integration-build.log

      - name: Preserve VC4 architectural regressions
        id: regressions
        run: |
          set -euo pipefail
          python3 scripts/vc4/preg-mutex-smoke.py \
            --qemu build/qemu-system-vc4 \
            2>&1 | tee /tmp/vc4-integration-preg.log
          python3 scripts/vc4/msync-smoke.py \
            --qemu build/qemu-system-aarch64 \
            2>&1 | tee /tmp/vc4-integration-msync.log

      - name: Build deterministic ARM and Linux fixtures
        id: fixtures
        run: |
          set -euo pipefail
          bash scripts/vc4/build-arm-framebuffer-smoke.sh \
            build/vc4-arm-framebuffer
          bash scripts/vc4/build-linux-initramfs.sh \
            build/vc4-linux-initramfs
          test -s build/vc4-arm-framebuffer/kernel8.img
          test -s build/vc4-linux-initramfs/initramfs.cpio.gz

      - name: Prove bare ARM mailbox and framebuffer scanout
        id: bare
        run: |
          set +e
          rm -rf "$BARE_DIR"
          python3 scripts/vc4/raspi3-linux-probe.py \
            --mode bare-direct \
            --qemu build/qemu-system-aarch64 \
            --kernel build/vc4-arm-framebuffer/kernel8.img \
            --out-dir "$BARE_DIR" \
            --seconds 120 --sample-interval 2
          rc=$?
          set -e
          echo "return_code=$rc" >> "$GITHUB_OUTPUT"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          result = json.loads(
              (Path(os.environ['BARE_DIR']) / 'result.json').read_text()
          )
          print('passed=' + str(bool(result.get('passed'))).lower())
          PY

      - name: Boot pinned Raspberry Pi Linux and paint /dev/fb0
        id: linux
        if: steps.bare.outputs.passed == 'true'
        run: |
          set +e
          rm -rf "$LINUX_DIR"
          python3 scripts/vc4/raspi3-linux-probe.py \
            --mode linux-direct \
            --qemu build/qemu-system-aarch64 \
            --kernel "$OFFICIAL_DIR/kernel8.img" \
            --dtb "$OFFICIAL_DIR/bcm2710-rpi-3-b.dtb" \
            --initrd build/vc4-linux-initramfs/initramfs.cpio.gz \
            --out-dir "$LINUX_DIR" \
            --seconds 300 --sample-interval 5
          rc=$?
          set -e
          echo "return_code=$rc" >> "$GITHUB_OUTPUT"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          result = json.loads(
              (Path(os.environ['LINUX_DIR']) / 'result.json').read_text()
          )
          print('passed=' + str(bool(result.get('passed'))).lower())
          print('linux_version_seen=' +
                str(bool(result.get('linux_version_seen'))).lower())
          print('init_seen=' + str(bool(result.get('init_seen'))).lower())
          print('framebuffer_marker_seen=' +
                str(bool(result.get('framebuffer_marker_seen'))).lower())
          PY

      - name: Record concise validation result
        id: record
        if: always()
        env:
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          ARTIFACTS_OUTCOME: ${{ steps.artifacts.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          REGRESSIONS_OUTCOME: ${{ steps.regressions.outcome }}
          FIXTURES_OUTCOME: ${{ steps.fixtures.outcome }}
          BARE_OUTCOME: ${{ steps.bare.outcome }}
          BARE_RC: ${{ steps.bare.outputs.return_code }}
          BARE_PASSED: ${{ steps.bare.outputs.passed }}
          LINUX_OUTCOME: ${{ steps.linux.outcome }}
          LINUX_RC: ${{ steps.linux.outputs.return_code }}
          LINUX_PASSED: ${{ steps.linux.outputs.passed }}
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          import os

          def load_result(directory):
              path = Path(directory) / 'result.json'
              return json.loads(path.read_text()) if path.is_file() else {}

          bare = load_result(os.environ['BARE_DIR'])
          linux = load_result(os.environ['LINUX_DIR'])
          outcomes = {
              key.removesuffix('_OUTCOME').lower(): value
              for key, value in os.environ.items()
              if key.endswith('_OUTCOME')
          }
          passed = (
              all(outcomes.get(key) == 'success' for key in (
                  'dependencies', 'artifacts', 'build', 'regressions',
                  'fixtures', 'bare', 'linux'))
              and bare.get('passed') is True
              and linux.get('passed') is True
          )
          status = {
              'schema_version': 1,
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'source_sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'passed': passed,
              'outcomes': outcomes,
              'bare_return_code': os.environ.get('BARE_RC'),
              'linux_return_code': os.environ.get('LINUX_RC'),
              'bare': {
                  'passed': bare.get('passed'),
                  'marker_seen': bare.get('bare_marker_seen'),
                  'signature_seen': bare.get('bare_signature_seen'),
                  'quadrants_match': (
                      bare.get('screenshot', {}).get('quadrants_match')
                  ),
                  'elapsed_seconds': bare.get('elapsed_seconds'),
              },
              'linux': {
                  'passed': linux.get('passed'),
                  'version_seen': linux.get('linux_version_seen'),
                  'userspace_handoff_seen': linux.get(
                      'userspace_handoff_seen'),
                  'init_seen': linux.get('init_seen'),
                  'framebuffer_marker_seen': linux.get(
                      'framebuffer_marker_seen'),
                  'quadrants_match': (
                      linux.get('screenshot', {}).get('quadrants_match')
                  ),
                  'elapsed_seconds': linux.get('elapsed_seconds'),
              },
          }
          Path('VC4_LINUX_FRAMEBUFFER_VALIDATION.json').write_text(
              json.dumps(status, indent=2, sort_keys=True) + '\n'
          )
          Path('VC4_LINUX_FRAMEBUFFER_VALIDATION.md').write_text(
              '# VC4 Linux framebuffer integration\n\n'
              f'Validation passed: **{str(passed).lower()}**\n\n'
              f'- Source commit: `{os.environ["GITHUB_SHA"]}`\n'
              f'- Workflow run: `{os.environ["GITHUB_RUN_ID"]}`\n'
              f'- Dual AArch64/VC4 build: '
              f'`{outcomes.get("build") == "success"}`\n'
              f'- Processor-control and multicore-sync regressions: '
              f'`{outcomes.get("regressions") == "success"}`\n'
              f'- Bare mailbox/framebuffer/QMP scanout: '
              f'`{bare.get("passed") is True}`\n'
              f'- Pinned Raspberry Pi Linux reached `/init`: '
              f'`{linux.get("init_seen") is True}`\n'
              f'- Linux `/dev/fb0` four-quadrant QMP scanout: '
              f'`{linux.get("passed") is True}`\n'
          )
          print(json.dumps(status, indent=2, sort_keys=True))
          PY

      - name: Upload full evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-linux-framebuffer-integration-${{ github.run_attempt }}
          path: |
            VC4_LINUX_FRAMEBUFFER_VALIDATION.json
            VC4_LINUX_FRAMEBUFFER_VALIDATION.md
            /tmp/vc4-integration-configure.log
            /tmp/vc4-integration-build.log
            /tmp/vc4-integration-preg.log
            /tmp/vc4-integration-msync.log
            /tmp/vc4-official/SHA256SUMS
            /tmp/vc4-integration-bare
            /tmp/vc4-integration-linux
            build/vc4-linux-initramfs/SHA256SUMS
          if-no-files-found: warn
          retention-days: 14

      - name: Publish result and retire one-shot gate on success
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f VC4_LINUX_FRAMEBUFFER_VALIDATION.json
          passed=$(python3 - <<'PY'
          import json
          from pathlib import Path
          print('true' if json.loads(
              Path('VC4_LINUX_FRAMEBUFFER_VALIDATION.json').read_text()
          ).get('passed') else 'false')
          PY
          )

          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git add -- \
            VC4_LINUX_FRAMEBUFFER_VALIDATION.json \
            VC4_LINUX_FRAMEBUFFER_VALIDATION.md
          if [ "$passed" = true ]; then
            git rm -- .github/workflows/vc4-linux-framebuffer-integration.yml
            message='hw/arm: record validated Linux framebuffer integration'
          else
            message='ci/vc4: record Linux framebuffer integration failure [skip ci]'
          fi
          git diff --cached --check
          git commit -m "$message"
          git pull --rebase origin agent/vc4-linux-framebuffer-integration
          git push origin HEAD:agent/vc4-linux-framebuffer-integration
