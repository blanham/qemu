name: VC4 start.elf ARM release trace

on:
  push:
    branches:
      - agent/vc4-stock-bootcode
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  arm-release-trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    env:
      GH_TOKEN: ${{ github.token }}
      RPI_FIRMWARE_COMMIT: 3d301dd924bcd758a4c8cb19fe8531031f033f43

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            ninja-build \
            pkg-config \
            python3 \
            libglib2.0-dev \
            libpixman-1-dev \
            zlib1g-dev

      - name: Validate trace tools
        run: |
          python3 -m py_compile \
            scripts/vc4/raspi3-firmware-volume.py \
            scripts/vc4/raspi3-startelf-probe.py \
            scripts/vc4/raspi3-startelf-arm-trace.py
          python3 scripts/vc4/raspi3-firmware-volume.py selftest

      - name: Prepare official second-stage firmware volume
        run: |
          mkdir -p /tmp/vc4-arm-trace
          for file in bootcode.bin start.elf fixup.dat; do
            curl --fail --location --retry 4 \
              --output "/tmp/vc4-arm-trace/${file}" \
              "https://raw.githubusercontent.com/raspberrypi/firmware/${RPI_FIRMWARE_COMMIT}/boot/${file}"
          done
          cat > /tmp/vc4-arm-trace/config.txt <<'EOF'
          arm_64bit=1
          kernel=kernel8.img
          disable_commandline_tags=1
          EOF
          python3 scripts/vc4/raspi3-startelf-probe.py \
            make-kernel /tmp/vc4-arm-trace/kernel8.img
          python3 scripts/vc4/raspi3-firmware-volume.py build \
            --output /tmp/vc4-arm-trace/pi3-startelf.img \
            BOOTCODE.BIN=/tmp/vc4-arm-trace/bootcode.bin \
            START.ELF=/tmp/vc4-arm-trace/start.elf \
            FIXUP.DAT=/tmp/vc4-arm-trace/fixup.dat \
            CONFIG.TXT=/tmp/vc4-arm-trace/config.txt \
            KERNEL8.IMG=/tmp/vc4-arm-trace/kernel8.img

      - name: Configure and build linked targets
        run: |
          ./configure \
            --target-list=aarch64-softmmu,vc4-softmmu \
            --disable-docs \
            --disable-werror
          set +e
          ninja -C build qemu-system-aarch64 qemu-system-vc4 \
            > /tmp/vc4-arm-trace/build.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            grep -n -E \
              'FAILED:|error:|fatal error:|undefined reference|multiple definition' \
              /tmp/vc4-arm-trace/build.log | tail -n 240 || true
            tail -n 260 /tmp/vc4-arm-trace/build.log
            exit "$rc"
          fi

      - name: Capture ARM0, PM and VPU state
        run: |
          set -o pipefail
          timeout 170s python3 \
            scripts/vc4/raspi3-startelf-arm-trace.py \
            build/qemu-system-aarch64 \
            /tmp/vc4-arm-trace/pi3-startelf.img \
            --seconds 120 \
            --output /tmp/vc4-arm-trace/arm-release.json \
            --qemu-log /tmp/vc4-arm-trace/qemu.log \
            2>&1 | tee /tmp/vc4-arm-trace/probe.log

      - name: Upload ARM release trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-startelf-arm-release-${{ github.run_attempt }}
          path: |
            /tmp/vc4-arm-trace/arm-release.json
            /tmp/vc4-arm-trace/probe.log
            /tmp/vc4-arm-trace/qemu.log
          if-no-files-found: warn

      - name: Publish sticky ARM release report
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          def read(path: str, limit: int) -> str:
              file = Path(path)
              if not file.exists():
                  return f'{path}: not produced'
              return file.read_text(errors='replace')[-limit:]

          body = f'''<!-- vc4-startelf-arm-release -->
          ## VC4 `start.elf` ARM-release trace

          Workflow: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}

          ### ARM0, power-management and live VPU snapshot

          ```json
          {read('/tmp/vc4-arm-trace/arm-release.json', 18000)}
          ```

          ### QEMU diagnostics

          ```text
          {read('/tmp/vc4-arm-trace/qemu.log', 8000)}
          ```
          '''
          Path('/tmp/vc4-arm-trace/comment.md').write_text(body)
          PY
          marker='<!-- vc4-startelf-arm-release -->'
          comment_id="$({
            gh api "repos/${GITHUB_REPOSITORY}/issues/4/comments" \
              --paginate \
              --jq ".[] | select(.body | contains(\"${marker}\")) | .id"
          } | head -n 1)"
          body="$(cat /tmp/vc4-arm-trace/comment.md)"
          if [ -n "$comment_id" ]; then
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              --raw-field body="$body"
          else
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/4/comments" \
              --raw-field body="$body"
          fi
