name: VC4 stock Linux continuation trigger

on:
  push:
    branches:
      - agent/vc4-deterministic-time-linux
    paths:
      - .github/workflows/vc4-stock-linux-resume.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-stock-linux-continuation-trigger
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Locate and retrigger the stock-firmware Linux probe
        shell: bash
        run: |
          set -euo pipefail
          workflow=$(grep -l -E \
            'deterministic.*(Linux|linux)|(Linux|linux).*deterministic|stock.*(Linux|linux)' \
            .github/workflows/*.yml .github/workflows/*.yaml 2>/dev/null \
            | grep -v 'vc4-stock-linux-resume.yml' \
            | head -n 1 || true)
          if [ -z "$workflow" ]; then
            echo "No stock/deterministic Linux workflow found" >&2
            exit 1
          fi
          printf '\n# Explicit stock Linux continuation: %s\n' \
            "$GITHUB_SHA" >> "$workflow"
          rm .github/workflows/vc4-stock-linux-resume.yml
          git add -A
          git diff --cached --check
          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git commit -m "ci/vc4: resume stock Linux framebuffer probe"
          git pull --rebase origin agent/vc4-deterministic-time-linux
          git push origin HEAD:agent/vc4-deterministic-time-linux
