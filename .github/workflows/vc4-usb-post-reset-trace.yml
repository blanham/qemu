name: VC4 stock USB post-reset frontier

on:
  push:
    branches:
      - agent/vc4-usb-post-reset-trace
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stock-usb-post-reset:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RPI_FIRMWARE_COMMIT: 3d301dd924bcd758a4c8cb19fe8531031f033f43

    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl ninja-build pkg-config python3 python3-venv \
            libglib2.0-dev libpixman-1-dev zlib1g-dev

      - name: Check post-reset probes
        run: |
          python3 -m py_compile \
            scripts/vc4/raspi3-stock-bootcode-mmio.py \
            scripts/vc4/analyze-stock-mmio-frontier.py \
            scripts/vc4/assert-stock-usb-root-hub.py \
            scripts/vc4/summarize-stock-usb-post-reset.py \
            scripts/vc4/stock_bootcode_progress.py
          python3 scripts/vc4/stock_bootcode_progress.py

          cat >/tmp/probe.log <<'EOF'
          STOCK_BOOTCODE_PROGRESS {"delay_generation_count":2,"delay_generations":[{"return_pc":1456,"start_timer":100},{"return_pc":1456,"start_timer":220}],"delay_reentered":true,"former_delay_frontier_crossed":true,"former_delay_pc":1348,"left_former_delay_pc":false,"pc_transitions":[1348],"reason":"delay-helper-returned-and-was-reentered","sample_count":4,"schema_version":1,"timer_forward_step_count":3}
          STOCK_BOOTCODE_BARRIER kind=stalled-state pc=0x00000544
          EOF
          cat >/tmp/frontier.json <<'EOF'
          {"accesses":[{"block":"hreg0","operation":"read","register":"HPRT0","value":135173}],"host_channels":[]}
          EOF
          python3 scripts/vc4/summarize-stock-usb-post-reset.py \
            /tmp/probe.log /tmp/frontier.json --require-delay-crossed \
            | grep -q '"next_frontier": "pre-host-channel-initialization"'
          git diff --check

      - name: Download pinned official firmware trio
        run: |
          for file in bootcode.bin start.elf fixup.dat; do
            curl --fail --location --retry 4 \
              --output "/tmp/${file}" \
              "https://raw.githubusercontent.com/raspberrypi/firmware/${RPI_FIRMWARE_COMMIT}/boot/${file}"
          done
          test "$(git hash-object /tmp/bootcode.bin)" = \
            7642d2d89e4235e7d68875ff70688bdde6e71b5a
          test "$(git hash-object /tmp/start.elf)" = \
            0cefcf3a756740760f9903f35cc3843117853712
          test "$(git hash-object /tmp/fixup.dat)" = \
            1845e38de9d4f9a6d9ad7f5273bfe58b2582a7e6

      - name: Configure and build heterogeneous system emulator
        run: |
          ./configure \
            --target-list=aarch64-softmmu \
            --disable-docs \
            --disable-werror
          ninja -C build qemu-system-aarch64

      - name: Run official firmware beyond the root-port reset
        run: |
          set -o pipefail
          out=/tmp/vc4-usb-post-reset
          rm -rf "$out"
          mkdir -p "$out"

          python3 scripts/vc4/raspi3-stock-bootcode-mmio.py \
            build/qemu-system-aarch64 \
            /tmp/bootcode.bin \
            --start-elf /tmp/start.elf \
            --fixup-dat /tmp/fixup.dat \
            --seconds 75 \
            --trace-samples 200 \
            --trace-interval 0.05 \
            --qemu-debug in_asm \
            --qemu-debug-filter 0x520..0x620 \
            --out-dir "$out" 2>&1 | tee "$out/probe.log"

          python3 scripts/vc4/analyze-stock-mmio-frontier.py \
            "$out/qemu-mmio.log" \
            --json "$out/mmio-frontier.json" \
            | tee "$out/mmio-frontier.txt"

          python3 scripts/vc4/assert-stock-usb-root-hub.py \
            "$out/mmio-frontier.json" \
            --probe-log "$out/probe.log" \
            | tee "$out/usb-root-hub-summary.json"

          python3 scripts/vc4/summarize-stock-usb-post-reset.py \
            "$out/probe.log" \
            "$out/mmio-frontier.json" \
            --require-delay-crossed \
            | tee "$out/post-reset-summary.json"

          test -s "$out/mmio-frontier.json"
          test -s "$out/post-reset-summary.json"

      - name: Upload post-reset frontier
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-usb-post-reset-${{ github.run_attempt }}
          path: /tmp/vc4-usb-post-reset
          if-no-files-found: warn
          retention-days: 14
