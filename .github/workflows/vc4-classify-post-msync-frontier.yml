name: Classify post-msync VC4 frontier

on:
  push:
    branches:
      - agent/vc4-post-preg-arm-release
    paths:
      - VC4_POST_MSYNC_FRONTIER.json
      - .github/workflows/vc4-classify-post-msync-frontier.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-post-msync-classify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/vc4-post-preg-arm-release
          fetch-depth: 0

      - name: Classify captured frontier
        run: |
          set -euo pipefail
          test -f VC4_POST_MSYNC_FRONTIER.json
          python3 - <<'PY'
          from pathlib import Path
          import json

          source = json.loads(
              Path('VC4_POST_MSYNC_FRONTIER.json').read_text()
          )
          run = source.get('source_run') or {}
          conclusion = run.get('conclusion')
          signature = bool(source.get('arm_payload_signature_seen'))
          opcodes = source.get('opcode_counts') or []
          mmio = source.get('mmio_counts') or []

          if conclusion != 'success':
              classification = 'probe-failed'
          elif signature:
              classification = 'arm-payload-reached'
          elif opcodes:
              classification = 'scalar-opcode'
          elif mmio:
              classification = 'mmio'
          else:
              classification = 'silent-halt'

          top_opcode = opcodes[0] if opcodes else None
          top_mmio = mmio[0] if mmio else None
          result = {
              'schema_version': 1,
              'classification': classification,
              'source_run': run,
              'arm_payload_signature_seen': signature,
              'former_p16_blocker_count': source.get(
                  'former_p16_blocker_count'
              ),
              'top_opcode': top_opcode,
              'top_mmio': top_mmio,
          }
          Path('VC4_FRONTIER_CLASSIFICATION.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n'
          )
          lines = [
              '# VC4 post-msync frontier classification',
              '',
              f"Classification: **`{classification}`**",
              f"ARM payload signature: **{signature}**",
              f"Source conclusion: **`{conclusion}`**",
              f"Former p16 hits: **{result['former_p16_blocker_count']}**",
              '',
              f"Top scalar opcode: `{top_opcode}`",
              f"Top MMIO access: `{top_mmio}`",
          ]
          Path('VC4_FRONTIER_CLASSIFICATION.md').write_text(
              '\n'.join(lines) + '\n'
          )
          marker_root = Path('.vc4-frontier')
          marker_root.mkdir(exist_ok=True)
          for marker in marker_root.iterdir():
              if marker.is_file():
                  marker.unlink()
          (marker_root / classification).write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n'
          )
          PY

      - name: Publish classification and remove classifier
        run: |
          set -euo pipefail
          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git add \
            VC4_FRONTIER_CLASSIFICATION.json \
            VC4_FRONTIER_CLASSIFICATION.md \
            .vc4-frontier
          git rm .github/workflows/vc4-classify-post-msync-frontier.yml
          git commit -m "ci/vc4: classify post-msync frontier"
          git pull --rebase origin agent/vc4-post-preg-arm-release
          git push origin HEAD:agent/vc4-post-preg-arm-release
