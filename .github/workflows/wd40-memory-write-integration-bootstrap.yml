name: WD40 memory-write integration bootstrap

on:
  push:
    branches:
      - wd40/qol-memory-write-integration
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wd40-memory-write-integration-bootstrap-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  export-integration-workflow:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out helper branch
        uses: actions/checkout@v4

      - name: Configure commit identity
        run: |
          git config user.name "WD40 Build Bot"
          git config user.email "wd40-build@users.noreply.github.com"

      - name: Generate the canonical integration contract
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path(".github/workflows/wd40-qol-integration.yml")
          output = Path("scripts/wd40/generated-qol-integration-workflow.yml")
          text = source.read_text(encoding="utf-8")

          replacements = (
              (
                  "      - wd40/qol-address-translation-integration\n",
                  "      - wd40/qol-address-translation-integration\n"
                  "      - wd40/qol-memory-write-integration\n",
                  1,
              ),
              (
                  "            python3 scripts/wd40/apply-address-translation-service.py\n"
                  "          }\n",
                  "            python3 scripts/wd40/apply-address-translation-service.py\n"
                  "            python3 scripts/wd40/apply-address-translation-checker-composability.py\n"
                  "            python3 scripts/wd40/apply-memory-write-service.py\n"
                  "          }\n",
                  1,
              ),
              (
                  "          python3 scripts/ci/check-wd40-address-translation-service.py\n"
                  "          git diff --check\n",
                  "          python3 scripts/ci/check-wd40-address-translation-service.py\n"
                  "          python3 scripts/ci/check-wd40-memory-write-service.py\n"
                  "          git diff --check\n",
                  2,
              ),
              (
                  "      - name: Publish the validated integration history\n",
                  "      - name: Exercise bounded memory writes\n"
                  "        run: |\n"
                  "          set -Eeuo pipefail\n"
                  "          python3 scripts/ci/check-wd40-memory-write-service.py \\\n"
                  "            build-qol-integration x86_64 aarch64 m68k ppc\n"
                  "\n"
                  "      - name: Publish the validated integration history\n",
                  1,
              ),
          )

          for old, new, expected in replacements:
              old_count = text.count(old)
              new_count = text.count(new)
              if old_count == 0 and new_count == expected:
                  continue
              if old_count != expected or new_count != 0:
                  raise RuntimeError(
                      f"{source}: ambiguous integration edit: "
                      f"old={old_count}, new={new_count}, "
                      f"expected={expected}, marker={old!r}"
                  )
              text = text.replace(old, new)

          required_counts = {
              "wd40/qol-memory-write-integration": 1,
              "apply-address-translation-checker-composability.py": 1,
              "apply-memory-write-service.py": 1,
              "check-wd40-memory-write-service.py": 3,
              "Exercise bounded memory writes": 1,
              "build-qol-integration x86_64 aarch64 m68k ppc": 1,
          }
          wrong = {
              marker: (text.count(marker), expected)
              for marker, expected in required_counts.items()
              if text.count(marker) != expected
          }
          if wrong:
              raise RuntimeError(f"{source}: integrated marker counts: {wrong!r}")

          output.write_text(text, encoding="utf-8")
          PY

          git diff --check
          if cmp -s \
              scripts/wd40/generated-qol-integration-workflow.yml \
              .github/workflows/wd40-qol-integration.yml; then
            echo "generated workflow unexpectedly matches the old contract" >&2
            exit 1
          fi

      - name: Publish the generated workflow source
        run: |
          set -Eeuo pipefail
          git add scripts/wd40/generated-qol-integration-workflow.yml
          git diff --cached --check
          git commit -m "ci: export bounded memory-write integration workflow"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          test -z "$(git status --porcelain)"
