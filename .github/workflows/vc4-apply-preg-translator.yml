name: VC4 apply processor-control translator patch

on:
  push:
    branches:
      - agent/vc4-preg-mutex
    paths:
      - .github/workflows/vc4-apply-preg-translator.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vc4-preg-mutex
          fetch-depth: 0

      - name: Apply translator decoder
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'static void vc4_gen_preg_read' target/vc4/translate.c; then
            echo 'Translator decoder is already present.'
          else
            git apply --check scripts/vc4/preg-translator.patch
            git apply scripts/vc4/preg-translator.patch
          fi

      - name: Commit decoder and remove one-shot scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/vc4/preg-translator.patch
          rm -f .github/workflows/vc4-apply-preg-translator.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'target/vc4: decode processor-control moves [skip ci]'
          git push origin HEAD:agent/vc4-preg-mutex
