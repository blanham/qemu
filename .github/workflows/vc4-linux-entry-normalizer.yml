name: VC4 Linux entry normalizer

on:
  push:
    branches:
      - agent/vc4-hetero-direct-linux
    paths:
      - .github/workflows/vc4-linux-entry-normalizer.yml
      - tests/vc4/linux-entry-normalizer.S
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-linux-entry-normalizer
  cancel-in-progress: true

jobs:
  normalize-entry:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RPI_FIRMWARE_COMMIT: 3d301dd924bcd758a4c8cb19fe8531031f033f43
      OFFICIAL_DIR: /tmp/vc4-official
      OUT_DIR: /tmp/vc4-linux-normalizer

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            binutils-aarch64-linux-gnu cpio curl file \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
            linux-libc-dev-arm64-cross ninja-build pkg-config \
            python3 python3-venv libglib2.0-dev libpixman-1-dev zlib1g-dev

      - name: Materialize and build QEMU
        run: |
          set -euo pipefail
          python3 scripts/vc4/hetero-direct-linux-integrate.py
          python3 scripts/vc4/hetero-direct-linux-integrate.py
          python3 -m py_compile \
            scripts/vc4/raspi3-direct-linux-control.py \
            scripts/vc4/preg-mutex-smoke.py \
            scripts/vc4/msync-smoke.py
          bash -n scripts/vc4/build-linux-initramfs-v2.sh
          git diff --check
          ./configure \
            --target-list=aarch64-softmmu,vc4-softmmu \
            --disable-docs --disable-werror \
            2>&1 | tee /tmp/vc4-normalizer-configure.log
          ninja -C build qemu-system-aarch64 qemu-system-vc4 \
            2>&1 | tee /tmp/vc4-normalizer-build.log
          python3 scripts/vc4/preg-mutex-smoke.py \
            --qemu build/qemu-system-vc4 \
            2>&1 | tee /tmp/vc4-normalizer-preg.log
          python3 scripts/vc4/msync-smoke.py \
            --qemu build/qemu-system-aarch64 \
            2>&1 | tee /tmp/vc4-normalizer-msync.log

      - name: Download and inspect the pinned Linux Image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OFFICIAL_DIR" "$OUT_DIR"
          mkdir -p "$OFFICIAL_DIR" "$OUT_DIR"
          for file in kernel8.img bcm2710-rpi-3-b.dtb; do
            curl --fail --location --retry 5 \
              --output "$OFFICIAL_DIR/$file" \
              "https://raw.githubusercontent.com/raspberrypi/firmware/${RPI_FIRMWARE_COMMIT}/boot/$file"
          done
          test "$(git hash-object "$OFFICIAL_DIR/kernel8.img")" = \
            a694aa64988bbecadc770c874488165303eac673
          test "$(git hash-object "$OFFICIAL_DIR/bcm2710-rpi-3-b.dtb")" = \
            398c480adc49a5fcb03aa4c095ea74db5d1f893b
          python3 - <<'PY'
          from pathlib import Path
          import json
          import os
          import struct

          image = Path(os.environ['OFFICIAL_DIR']) / 'kernel8.img'
          header = image.read_bytes()[:64]
          if len(header) != 64 or header[56:60] != b'ARM\x64':
              raise SystemExit('pinned kernel8.img lacks an arm64 Image header')
          text_offset = struct.unpack_from('<Q', header, 8)[0]
          image_size = struct.unpack_from('<Q', header, 16)[0]
          flags = struct.unpack_from('<Q', header, 24)[0]
          effective_offset = text_offset or 0x80000
          base = 0x200000
          entry = base + effective_offset
          metadata = {
              'text_offset': text_offset,
              'effective_text_offset': effective_offset,
              'image_size': image_size,
              'flags': flags,
              'load_base': base,
              'entry': entry,
          }
          Path(os.environ['OUT_DIR'], 'image-header.json').write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + '\n'
          )
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'entry=0x{entry:x}\n')
          print(json.dumps(metadata, indent=2))
          PY

      - name: Build normalized trampoline and diagnostic initramfs
        env:
          LINUX_ENTRY: ${{ steps.image.outputs.entry }}
        run: |
          set -euo pipefail
          mkdir -p build/vc4-linux-normalizer
          aarch64-linux-gnu-gcc \
            -c -x assembler-with-cpp \
            -DLINUX_ENTRY="$LINUX_ENTRY" \
            tests/vc4/linux-entry-normalizer.S \
            -o build/vc4-linux-normalizer/normalizer.o
          aarch64-linux-gnu-ld \
            -nostdlib --entry=_start -Ttext=0x80000 \
            -o build/vc4-linux-normalizer/normalizer.elf \
            build/vc4-linux-normalizer/normalizer.o
          aarch64-linux-gnu-objcopy \
            -O binary \
            build/vc4-linux-normalizer/normalizer.elf \
            build/vc4-linux-normalizer/normalizer.bin
          aarch64-linux-gnu-objdump -d \
            build/vc4-linux-normalizer/normalizer.elf \
            >build/vc4-linux-normalizer/normalizer.dis
          test -s build/vc4-linux-normalizer/normalizer.bin
          bash scripts/vc4/build-linux-initramfs-v2.sh \
            "$PWD/build/vc4-linux-initramfs-v2"

      - name: Enter Linux through normalized state
        id: probe
        shell: bash
        env:
          LINUX_ENTRY: ${{ steps.image.outputs.entry }}
        run: |
          set -uo pipefail
          cat >"$OUT_DIR/qemu-wrapper" <<EOF
          #!/usr/bin/env bash
          exec "$PWD/build/qemu-system-aarch64" "\$@" \
            -device loader,file="$OFFICIAL_DIR/kernel8.img",addr=$LINUX_ENTRY,force-raw=on
          EOF
          chmod +x "$OUT_DIR/qemu-wrapper"
          python3 scripts/vc4/raspi3-direct-linux-control.py \
            "$OUT_DIR/qemu-wrapper" \
            build/vc4-linux-normalizer/normalizer.bin \
            "$OFFICIAL_DIR/bcm2710-rpi-3-b.dtb" \
            build/vc4-linux-initramfs-v2/initramfs.cpio \
            --seconds 180 \
            --out-dir "$OUT_DIR" \
            2>&1 | tee "$OUT_DIR/probe.log"
          rc=${PIPESTATUS[0]}
          echo "return_code=$rc" >>"$GITHUB_OUTPUT"
          exit 0

      - name: Classify normalized handoff
        if: always()
        shell: bash
        env:
          PROBE_RC: ${{ steps.probe.outputs.return_code }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          import os
          import re

          out = Path(os.environ['OUT_DIR'])
          result_path = out / 'result.json'
          result = json.loads(result_path.read_text()) if result_path.is_file() else {}
          serial = '\n'.join(result.get('serial_tail', []))
          start = 'VC4_ARM_NORMALIZER_START' in serial
          jump = 'VC4_ARM_NORMALIZER_JUMP' in serial
          bad_el = 'VC4_ARM_NORMALIZER_BAD_EL' in serial
          linux = bool(re.search(r'Linux version\s+\S+', serial))
          init_seen = 'VC4_LINUX_INIT_START' in serial
          fb = 'VC4_LINUX_FB_OK' in serial
          scanout = bool(result.get('scanout_passed'))
          if bad_el:
              classification = 'normalizer-unsupported-currentel'
          elif not start:
              classification = 'normalizer-not-entered'
          elif not jump:
              classification = 'normalizer-state-setup-blocked'
          elif not linux:
              classification = 'normalized-linux-image-entry-blocked'
          elif not init_seen:
              classification = 'normalized-linux-init-blocked'
          elif not fb:
              classification = 'normalized-linux-framebuffer-blocked'
          elif not scanout:
              classification = 'normalized-linux-scanout-blocked'
          else:
              classification = 'normalized-linux-framebuffer-scanout'
          header_path = out / 'image-header.json'
          status = {
              'schema_version': 1,
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'source_sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'classification': classification,
              'probe_return_code': os.environ.get('PROBE_RC', ''),
              'normalizer_start_seen': start,
              'normalizer_jump_seen': jump,
              'normalizer_bad_el_seen': bad_el,
              'linux_version_seen': linux,
              'init_seen': init_seen,
              'framebuffer_marker_seen': fb,
              'scanout_passed': scanout,
              'image_header': (
                  json.loads(header_path.read_text())
                  if header_path.is_file() else None
              ),
              'result': result,
          }
          Path('VC4_LINUX_ENTRY_NORMALIZER_STATUS.json').write_text(
              json.dumps(status, indent=2, sort_keys=True) + '\n'
          )
          Path('VC4_LINUX_ENTRY_NORMALIZER_STATUS.md').write_text(
              '# VC4 Linux entry normalizer\n\n'
              f'Classification: **`{classification}`**\n\n'
              f'Normalizer start: `{start}`\n\n'
              f'Normalizer jump: `{jump}`\n\n'
              f'Linux banner: `{linux}`\n\n'
              f'Init: `{init_seen}`\n\n'
              f'Framebuffer marker: `{fb}`\n\n'
              f'Scanout: `{scanout}`\n'
          )
          print(json.dumps({
              key: status[key]
              for key in (
                  'classification',
                  'normalizer_start_seen',
                  'normalizer_jump_seen',
                  'normalizer_bad_el_seen',
                  'linux_version_seen',
                  'init_seen',
                  'framebuffer_marker_seen',
                  'scanout_passed',
              )
          }, indent=2))
          PY

      - name: Upload normalized-entry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-linux-entry-normalizer-${{ github.run_attempt }}
          path: |
            VC4_LINUX_ENTRY_NORMALIZER_STATUS.json
            VC4_LINUX_ENTRY_NORMALIZER_STATUS.md
            /tmp/vc4-linux-normalizer
            /tmp/vc4-normalizer-configure.log
            /tmp/vc4-normalizer-build.log
            /tmp/vc4-normalizer-preg.log
            /tmp/vc4-normalizer-msync.log
            build/vc4-linux-normalizer
            build/vc4-linux-initramfs-v2/SHA256SUMS
          if-no-files-found: warn
          retention-days: 14

      - name: Publish normalized-entry status
        if: always()
        run: |
          set -euo pipefail
          cp VC4_LINUX_ENTRY_NORMALIZER_STATUS.json /tmp/normalizer-status.json
          cp VC4_LINUX_ENTRY_NORMALIZER_STATUS.md /tmp/normalizer-status.md
          git reset --hard "$GITHUB_SHA"
          cp /tmp/normalizer-status.json VC4_LINUX_ENTRY_NORMALIZER_STATUS.json
          cp /tmp/normalizer-status.md VC4_LINUX_ENTRY_NORMALIZER_STATUS.md
          git rm .github/workflows/vc4-linux-entry-normalizer.yml
          git add \
            VC4_LINUX_ENTRY_NORMALIZER_STATUS.json \
            VC4_LINUX_ENTRY_NORMALIZER_STATUS.md
          git diff --cached --check
          git config user.name 'VC4 CI'
          git config user.email 'vc4-ci@users.noreply.github.com'
          classification=$(python3 -c \
            'import json; print(json.load(open("VC4_LINUX_ENTRY_NORMALIZER_STATUS.json"))["classification"])')
          git commit -m "ci/vc4: record ${classification} [skip ci]"
          git pull --rebase origin agent/vc4-hetero-direct-linux
          git push origin HEAD:agent/vc4-hetero-direct-linux
