name: Publish durable VC4 Linux KMS diagnostics

on:
  push:
    branches:
      - agent/vc4-linux-kms-bind-diagnostics
    paths:
      - .github/workflows/vc4-kms-durable-report-publish.yml
      - .github/vc4-kms-durable-report-publish/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-kms-durable-report-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BRANCH: agent/vc4-linux-kms-bind-diagnostics
      PATCH_DIR: .github/vc4-kms-durable-report-publish

    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/vc4-linux-kms-bind-diagnostics
          fetch-depth: 0

      - name: Install witness build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            libdrm-dev \
            linux-libc-dev-arm64-cross \
            python3

      - name: Apply the durable-output change
        run: |
          set -euo pipefail
          python3 -m py_compile "$PATCH_DIR/rebase.py"
          python3 "$PATCH_DIR/rebase.py"
          git diff --check
          grep -Fq 'static void emit_text' \
            tests/vc4/linux-v3d-uapi-init.c
          grep -Fq \
            'Detailed report() records and semantic markers share' \
            tests/vc4/linux-v3d-modular-init.c

      - name: Compile the complete static Linux witness
        run: |
          set -euo pipefail
          aarch64-linux-gnu-gcc \
            -static \
            -O2 \
            -g0 \
            -Wall \
            -Wextra \
            -Werror \
            -fno-ident \
            -I/usr/include/libdrm \
            -Wl,--build-id=none \
            -o /tmp/vc4-linux-kms-init \
            tests/vc4/linux-v3d-modular-init.c
          test -x /tmp/vc4-linux-kms-init
          file /tmp/vc4-linux-kms-init | \
            grep -Fq 'ELF 64-bit LSB executable, ARM aarch64'

      - name: Publish the validated commit and remove the transient publisher
        run: |
          set -euo pipefail
          staging_sha="$GITHUB_SHA"

          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"

          git rm -r .github/vc4-kms-durable-report-publish
          git rm .github/workflows/vc4-kms-durable-report-publish.yml
          git add \
            tests/vc4/linux-v3d-modular-init.c \
            tests/vc4/linux-v3d-uapi-init.c

          git diff --cached --check
          git diff --exit-code
          test -z "$(git diff --name-only)"

          git commit \
            -m "test/vc4: make Linux KMS detail records durable" \
            -m "Route formatted witness diagnostics through the same /dev/kmsg fallback as semantic markers so nonblocking serial pressure cannot erase resource counts, connector records, or exact failure details. Preserve the caller's errno across both output paths, reject zero-progress writes instead of spinning, update the witness contract, and compile the complete static aarch64 initramfs program before publication."

          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$staging_sha"
          git push origin "HEAD:$BRANCH"
