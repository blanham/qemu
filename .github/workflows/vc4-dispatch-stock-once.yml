name: VC4 dispatch stock firmware validation once

on:
  push:
    branches:
      - agent/vc4-preg-mutex
    paths:
      - .github/workflows/vc4-dispatch-stock-once.yml

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vc4-preg-mutex
          fetch-depth: 0

      - name: Dispatch stock ARM-payload workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'vc4-stock-arm-payload.yml',
              ref: 'agent/vc4-preg-mutex',
            });

      - name: Remove one-shot dispatcher
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/vc4-dispatch-stock-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci/vc4: dispatch stock validation [skip ci]'
          git push origin HEAD:agent/vc4-preg-mutex
