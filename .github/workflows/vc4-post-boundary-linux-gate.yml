name: VC4 post-boundary Linux framebuffer gate

on:
  push:
    branches:
      - agent/vc4-hetero-direct-linux
    paths:
      - .github/workflows/vc4-post-boundary-linux-gate.yml
      - hw/arm/vc4_raspi3_hetero.c
      - scripts/vc4/build-linux-initramfs-v2.sh
      - scripts/vc4/raspi3-direct-linux-control.py
      - tests/vc4/linux-init-v2.c
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-post-boundary-linux-gate
  cancel-in-progress: true

jobs:
  linux-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RPI_FIRMWARE_COMMIT: 3d301dd924bcd758a4c8cb19fe8531031f033f43
      OFFICIAL_DIR: /tmp/vc4-official
      OUT_DIR: /tmp/vc4-post-boundary-linux

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            binutils-aarch64-linux-gnu cpio curl file \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
            linux-libc-dev-arm64-cross ninja-build pkg-config \
            python3 python3-venv libglib2.0-dev libpixman-1-dev zlib1g-dev

      - name: Materialize and build
        run: |
          set -euo pipefail
          python3 scripts/vc4/hetero-direct-linux-integrate.py
          python3 scripts/vc4/hetero-direct-linux-integrate.py
          python3 -m py_compile \
            scripts/vc4/raspi3-direct-linux-control.py \
            scripts/vc4/preg-mutex-smoke.py \
            scripts/vc4/msync-smoke.py
          bash -n scripts/vc4/build-linux-initramfs-v2.sh
          git diff --check
          ./configure \
            --target-list=aarch64-softmmu,vc4-softmmu \
            --disable-docs --disable-werror \
            2>&1 | tee /tmp/vc4-post-boundary-configure.log
          ninja -C build qemu-system-aarch64 qemu-system-vc4 \
            2>&1 | tee /tmp/vc4-post-boundary-build.log
          python3 scripts/vc4/preg-mutex-smoke.py \
            --qemu build/qemu-system-vc4 \
            2>&1 | tee /tmp/vc4-post-boundary-preg.log
          python3 scripts/vc4/msync-smoke.py \
            --qemu build/qemu-system-aarch64 \
            2>&1 | tee /tmp/vc4-post-boundary-msync.log

      - name: Acquire pinned Linux and build initramfs
        run: |
          set -euo pipefail
          rm -rf "$OFFICIAL_DIR" "$OUT_DIR"
          mkdir -p "$OFFICIAL_DIR" "$OUT_DIR"
          for file in kernel8.img bcm2710-rpi-3-b.dtb; do
            curl --fail --location --retry 5 \
              --output "$OFFICIAL_DIR/$file" \
              "https://raw.githubusercontent.com/raspberrypi/firmware/${RPI_FIRMWARE_COMMIT}/boot/$file"
          done
          test "$(git hash-object "$OFFICIAL_DIR/kernel8.img")" = \
            a694aa64988bbecadc770c874488165303eac673
          test "$(git hash-object "$OFFICIAL_DIR/bcm2710-rpi-3-b.dtb")" = \
            398c480adc49a5fcb03aa4c095ea74db5d1f893b
          bash scripts/vc4/build-linux-initramfs-v2.sh \
            "$PWD/build/vc4-linux-initramfs-v2"

      - name: Boot Linux and require userspace framebuffer scanout
        id: probe
        shell: bash
        run: |
          set -uo pipefail
          append='console=ttyAMA0,115200 earlycon=pl011,mmio32,0x3f201000 rdinit=/init init=/init root=/dev/ram0 rw loglevel=8 ignore_loglevel panic=-1 printk.time=1'
          python3 scripts/vc4/raspi3-direct-linux-control.py \
            build/qemu-system-aarch64 \
            "$OFFICIAL_DIR/kernel8.img" \
            "$OFFICIAL_DIR/bcm2710-rpi-3-b.dtb" \
            build/vc4-linux-initramfs-v2/initramfs.cpio \
            --seconds 180 \
            --append "$append" \
            --out-dir "$OUT_DIR" \
            2>&1 | tee "$OUT_DIR/probe.log"
          rc=${PIPESTATUS[0]}
          echo "return_code=$rc" >>"$GITHUB_OUTPUT"
          exit 0

      - name: Classify post-boundary Linux
        id: classify
        if: always()
        shell: bash
        env:
          PROBE_RC: ${{ steps.probe.outputs.return_code }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          import os
          import re

          result_path = Path(os.environ['OUT_DIR']) / 'result.json'
          result = json.loads(result_path.read_text()) if result_path.is_file() else {}
          serial = '\n'.join(result.get('serial_tail', []))
          linux = bool(result.get('linux_version_seen')) or \
                  bool(re.search(r'Linux version\s+\S+', serial))
          init_seen = bool(result.get('init_seen')) or \
                      'VC4_LINUX_INIT_START' in serial
          fb = bool(result.get('framebuffer_marker_seen')) or \
               'VC4_LINUX_FB_OK' in serial
          scanout = bool(result.get('scanout_passed'))
          if linux and init_seen and fb and scanout:
              classification = 'linux-framebuffer-scanout'
          elif init_seen and 'VC4_LINUX_FB_FAIL stage=open' in serial:
              classification = 'linux-framebuffer-device-missing'
          elif init_seen and 'VC4_LINUX_FB_FAIL stage=paint' in serial:
              classification = 'linux-framebuffer-paint-blocked'
          elif init_seen:
              classification = 'linux-init-framebuffer-unclassified'
          elif linux:
              classification = 'linux-kernel-initramfs-blocked'
          elif result:
              classification = 'linux-entry-or-console-blocked'
          else:
              classification = 'linux-probe-infrastructure-failed'
          status = {
              'schema_version': 1,
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'source_sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'classification': classification,
              'probe_return_code': os.environ.get('PROBE_RC', ''),
              'linux_version_seen': linux,
              'init_seen': init_seen,
              'framebuffer_marker_seen': fb,
              'scanout_passed': scanout,
              'result': result,
          }
          Path('VC4_POST_BOUNDARY_LINUX_STATUS.json').write_text(
              json.dumps(status, indent=2, sort_keys=True) + '\n'
          )
          Path('VC4_POST_BOUNDARY_LINUX_STATUS.md').write_text(
              '# VC4 post-boundary Linux framebuffer gate\n\n'
              f'Classification: **`{classification}`**\n\n'
              f'Linux banner: `{linux}`\n\n'
              f'Init: `{init_seen}`\n\n'
              f'Framebuffer marker: `{fb}`\n\n'
              f'Scanout: `{scanout}`\n'
          )
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'classification={classification}\n')
              output.write('passed=' + (
                  'true' if classification == 'linux-framebuffer-scanout'
                  else 'false'
              ) + '\n')
          print(json.dumps({
              'classification': classification,
              'linux_version_seen': linux,
              'init_seen': init_seen,
              'framebuffer_marker_seen': fb,
              'scanout_passed': scanout,
          }, indent=2))
          PY

      - name: Upload full Linux evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-post-boundary-linux-${{ github.run_attempt }}
          path: |
            VC4_POST_BOUNDARY_LINUX_STATUS.json
            VC4_POST_BOUNDARY_LINUX_STATUS.md
            /tmp/vc4-post-boundary-linux
            /tmp/vc4-post-boundary-configure.log
            /tmp/vc4-post-boundary-build.log
            /tmp/vc4-post-boundary-preg.log
            /tmp/vc4-post-boundary-msync.log
            build/vc4-linux-initramfs-v2/SHA256SUMS
          if-no-files-found: warn
          retention-days: 14

      - name: Publish gate result
        if: always()
        shell: bash
        env:
          PASSED: ${{ steps.classify.outputs.passed }}
          CLASSIFICATION: ${{ steps.classify.outputs.classification }}
        run: |
          set -euo pipefail
          cp VC4_POST_BOUNDARY_LINUX_STATUS.json /tmp/post-boundary.json
          cp VC4_POST_BOUNDARY_LINUX_STATUS.md /tmp/post-boundary.md
          git reset --hard "$GITHUB_SHA"
          cp /tmp/post-boundary.json VC4_POST_BOUNDARY_LINUX_STATUS.json
          cp /tmp/post-boundary.md VC4_POST_BOUNDARY_LINUX_STATUS.md
          git rm .github/workflows/vc4-post-boundary-linux-gate.yml
          git add \
            VC4_POST_BOUNDARY_LINUX_STATUS.json \
            VC4_POST_BOUNDARY_LINUX_STATUS.md
          git diff --cached --check
          git config user.name 'VC4 CI'
          git config user.email 'vc4-ci@users.noreply.github.com'
          git commit -m "ci/vc4: record ${CLASSIFICATION} [skip ci]"
          git pull --rebase origin agent/vc4-hetero-direct-linux
          git push origin HEAD:agent/vc4-hetero-direct-linux
          if [ "$PASSED" = true ]; then
            git push --force-with-lease \
              origin HEAD:agent/vc4-linux-framebuffer-bringup
          fi
