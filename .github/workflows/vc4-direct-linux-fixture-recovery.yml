name: VC4 direct Linux fixture recovery

on:
  push:
    branches:
      - agent/vc4-hetero-direct-linux
    paths:
      - .github/workflows/vc4-direct-linux-fixture-recovery.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-direct-linux-fixture-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Repair relative initramfs output handling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          builder = Path('scripts/vc4/build-linux-initramfs.sh')
          text = builder.read_text(encoding='utf-8')
          marker = '# VC4_ABSOLUTE_OUTPUT_DIR'
          if marker not in text:
              lines = text.splitlines(keepends=True)
              assignment_index = None
              variable = None
              assignment = re.compile(
                  r'^\s*(?P<var>[A-Za-z_][A-Za-z0-9_]*)='
                  r'.*(?:\$\{?1\}?|\$\{1[:?+-])'
              )
              for index, line in enumerate(lines):
                  match = assignment.search(line)
                  if match:
                      assignment_index = index
                      variable = match.group('var')
                      break
              if assignment_index is None or variable is None:
                  raise SystemExit(
                      'could not locate the initramfs output-directory assignment'
                  )
              canonicalize = (
                  f'{marker}\n'
                  f'case "${variable}" in\n'
                  f'    /*) ;;\n'
                  f'    *) {variable}="$PWD/${variable}" ;;\n'
                  f'esac\n'
              )
              lines.insert(assignment_index + 1, canonicalize)
              builder.write_text(''.join(lines), encoding='utf-8')

          workflow = Path('.github/workflows/vc4-hetero-direct-linux.yml')
          workflow_text = workflow.read_text(encoding='utf-8')
          old = (
              'bash scripts/vc4/build-linux-initramfs.sh \\\n'
              '  build/vc4-linux-initramfs'
          )
          new = (
              'bash scripts/vc4/build-linux-initramfs.sh \\\n'
              '  "$GITHUB_WORKSPACE/build/vc4-linux-initramfs"'
          )
          if old in workflow_text:
              workflow_text = workflow_text.replace(old, new, 1)
          elif '$GITHUB_WORKSPACE/build/vc4-linux-initramfs' not in workflow_text:
              raise SystemExit('could not locate the workflow initramfs invocation')
          workflow.write_text(workflow_text, encoding='utf-8')
          PY

          bash -n scripts/vc4/build-linux-initramfs.sh
          python3 - <<'PY'
          from pathlib import Path
          text = Path('scripts/vc4/build-linux-initramfs.sh').read_text()
          assert '# VC4_ABSOLUTE_OUTPUT_DIR' in text
          text = Path('.github/workflows/vc4-hetero-direct-linux.yml').read_text()
          assert '$GITHUB_WORKSPACE/build/vc4-linux-initramfs' in text
          PY
          git diff --check

      - name: Publish the repair and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/vc4-direct-linux-fixture-recovery.yml
          git add \
            scripts/vc4/build-linux-initramfs.sh \
            .github/workflows/vc4-hetero-direct-linux.yml
          git diff --cached --check
          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git commit -m "tests/vc4: make Linux initramfs output path stable"
          git pull --rebase origin agent/vc4-hetero-direct-linux
          git push origin HEAD:agent/vc4-hetero-direct-linux
