name: Install VC4 firmware power-domain support

on:
  push:
    branches:
      - agent/vc4-linux-v3d-modular-isolated
    paths:
      - .github/workflows/vc4-power-domain-install.yml

permissions:
  contents: write

concurrency:
  group: vc4-power-domain-install
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply and publish the implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/vc4/apply-power-domain-patch.py \
            scripts/vc4/property-power-domain-smoke.py
          python3 scripts/vc4/apply-power-domain-patch.py
          git diff --check

          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git add -- \
            hw/misc/bcm2835_property.c \
            include/hw/misc/bcm2835_property.h \
            .github/workflows/vc4-linux-v3d-modular.yml
          git rm -- \
            scripts/vc4/apply-power-domain-patch.py \
            .github/workflows/vc4-power-domain-install.yml
          git diff --cached --check
          git commit -m 'hw/misc: model Raspberry Pi firmware power domains'
          git pull --rebase origin agent/vc4-linux-v3d-modular-isolated
          git push origin HEAD:agent/vc4-linux-v3d-modular-isolated
