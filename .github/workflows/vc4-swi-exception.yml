name: VC4 software-interrupt entry

on:
  push:
    branches:
      - agent/vc4-swi-exception
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-vc4-swi:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      RPI_FIRMWARE_COMMIT: 3d301dd924bcd758a4c8cb19fe8531031f033f43

    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl ninja-build pkg-config python3 python3-venv \
            libglib2.0-dev libpixman-1-dev zlib1g-dev

      - name: Apply architectural SWI and interrupt wiring changes
        run: |
          python3 scripts/vc4/apply-swi-exception.py
          python3 -m py_compile \
            scripts/vc4/apply-swi-exception.py \
            scripts/vc4/check-swi-exception.py
          git diff --check
          git status --short

      - name: Download pinned official firmware trio
        run: |
          for file in bootcode.bin start.elf fixup.dat; do
            curl --fail --location --retry 4 \
              --output "/tmp/${file}" \
              "https://raw.githubusercontent.com/raspberrypi/firmware/${RPI_FIRMWARE_COMMIT}/boot/${file}"
          done
          test "$(git hash-object /tmp/bootcode.bin)" = \
            7642d2d89e4235e7d68875ff70688bdde6e71b5a
          test "$(git hash-object /tmp/start.elf)" = \
            0cefcf3a756740760f9903f35cc3843117853712
          test "$(git hash-object /tmp/fixup.dat)" = \
            1845e38de9d4f9a6d9ad7f5273bfe58b2582a7e6

      - name: Check stock-firmware probes
        run: |
          python3 -m py_compile \
            scripts/vc4/raspi3-stock-bootcode-probe.py \
            scripts/vc4/raspi3-stock-bootcode-state.py \
            scripts/vc4/raspi3-stock-bootcode-0200.py \
            scripts/vc4/raspi3-stock-bootcode-mmio.py \
            scripts/vc4/stock_bootcode_progress.py
          python3 scripts/vc4/stock_bootcode_progress.py

      - name: Configure and build the heterogeneous emulator
        run: |
          ./configure \
            --target-list=aarch64-softmmu \
            --disable-docs \
            --disable-werror
          ninja -C build qemu-system-aarch64

      - name: Exercise immediate and register-form SWI entry
        run: |
          set -o pipefail
          out=/tmp/vc4-swi-exception
          rm -rf "$out"
          mkdir -p "$out"
          python3 scripts/vc4/check-swi-exception.py \
            build/qemu-system-aarch64 \
            --json "$out/unit-summary.json" \
            2>&1 | tee "$out/unit.log"

      - name: Run official firmware beyond swi 0
        run: |
          set -o pipefail
          out=/tmp/vc4-swi-exception
          mkdir -p "$out/official"

          python3 scripts/vc4/raspi3-stock-bootcode-mmio.py \
            build/qemu-system-aarch64 \
            /tmp/bootcode.bin \
            --start-elf /tmp/start.elf \
            --fixup-dat /tmp/fixup.dat \
            --seconds 120 \
            --trace-samples 420 \
            --trace-interval 0.05 \
            --qemu-debug in_asm,int,guest_errors \
            --qemu-debug-filter 0x1eddba80..0x1eddbc80 \
            --out-dir "$out/official" 2>&1 | tee "$out/official/probe.log"

          test -s "$out/official/probe.log"

      - name: Assert the software-interrupt frontier is crossed
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path
          import re

          out = Path('/tmp/vc4-swi-exception')
          probe = (out / 'official/probe.log').read_text(
              encoding='utf-8', errors='replace'
          ).splitlines()

          if any(line.startswith('VC4_LOW_PC_WRITE ') for line in probe):
              raise SystemExit('unexpected low-memory PC write')
          if any('unimplemented opcode 0x01c0' in line for line in probe):
              raise SystemExit('swi 0 is still reaching the illegal-opcode path')

          swi = [
              line for line in probe
              if 'VideoCore IV: SWI vector=32 ' in line
          ]
          if not swi:
              raise SystemExit('official firmware did not enter SWI vector 32')

          barrier = next((
              line for line in reversed(probe)
              if line.startswith('STOCK_BOOTCODE_BARRIER ')
          ), None)
          if barrier is None:
              raise SystemExit('missing official-firmware barrier record')
          match = re.search(r'\bpc=0x([0-9a-fA-F]+)', barrier)
          if not match:
              raise SystemExit(f'barrier has no PC: {barrier}')
          barrier_pc = int(match.group(1), 16)
          if barrier_pc == 0x1eddba9a:
              raise SystemExit('official firmware remained at swi 0')

          progress = None
          for line in probe:
              if line.startswith('STOCK_BOOTCODE_PROGRESS '):
                  progress = json.loads(line.split(' ', 1)[1])
          if progress is None:
              raise SystemExit('missing stock progress record')

          diagnostics = [
              line for line in probe
              if ('unimplemented opcode' in line or
                  'illegal instruction' in line or
                  'could not enter SWI' in line or
                  'bad read offset' in line or
                  'bad write offset' in line)
          ]
          summary = {
              'schema_version': 1,
              'barrier_pc': f'0x{barrier_pc:08x}',
              'barrier': barrier,
              'swi_entries': swi[-20:],
              'diagnostics': diagnostics[-80:],
              'progress': progress,
          }
          (out / 'official-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Commit validated VC4 software-interrupt support
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            hw/arm/vc4_raspi3_hetero.c \
            scripts/vc4/check-swi-exception.py \
            target/vc4/cpu.c \
            target/vc4/cpu.h \
            target/vc4/cpu-qom.h \
            target/vc4/helper.h \
            target/vc4/op_helper.c \
            target/vc4/translate.c
          git rm \
            scripts/vc4/apply-swi-exception.py \
            .github/workflows/vc4-swi-exception.yml
          git commit -m 'target/vc4: implement software-interrupt entry'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload VC4 software-interrupt frontier
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-swi-exception-${{ github.run_attempt }}
          path: /tmp/vc4-swi-exception
          if-no-files-found: warn
          retention-days: 14
