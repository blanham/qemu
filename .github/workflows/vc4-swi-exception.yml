name: VC4 software-interrupt entry

on:
  push:
    branches:
      - agent/vc4-swi-exception
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-vc4-swi:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      RPI_FIRMWARE_COMMIT: 3d301dd924bcd758a4c8cb19fe8531031f033f43

    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl ninja-build pkg-config python3 python3-venv \
            libglib2.0-dev libpixman-1-dev zlib1g-dev

      - name: Implement architectural VC4 software interrupts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              file = Path(path)
              text = file.read_text()
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'target/vc4/cpu.h',
              '#define VC4_CPUID_VALUE 0x04000104u\n',
              '#define VC4_CPUID_VALUE 0x04000104u\n'
              '#define VC4_MAX_EXCEPTION_DEPTH 32\n',
              'exception-depth limit')

          replace_once(
              'target/vc4/cpu.h',
              '    uint32_t normal_sp;\n'
              '    uint8_t exception_depth;\n',
              '    uint32_t normal_sp;\n'
              '    uint32_t external_irq_frames;\n'
              '    uint8_t exception_depth;\n',
              'exception-frame state')

          replace_once(
              'target/vc4/cpu.h',
              'void vc4_translate_init(void);\n',
              'bool vc4_cpu_enter_swi(VC4CPU *cpu, uint32_t number,\n'
              '                       uint32_t return_pc);\n\n'
              'void vc4_translate_init(void);\n',
              'SWI entry declaration')

          old = '''static bool vc4_cpu_enter_irq(VC4CPU *cpu)
          {
              CPUState *cs = CPU(cpu);
              CPUVC4State *env = vc4_cpu_env(cs);
              uint32_t vector;
              uint32_t vector_base;
              uint32_t vector_entry;
              uint32_t saved_sr = env->sr;

              if (!cpu->intc ||
                  !bcm2835_vc4_intc_acknowledge(cpu->intc, &vector, &vector_base)) {
                  return false;
              }

              if (env->exception_depth == 0) {
                  env->normal_sp = env->gpr[VC4_REG_SP];
                  env->gpr[VC4_REG_SP] = env->gpr[28];
              }

              vc4_irq_push(cs, env, env->pc);
              vc4_irq_push(cs, env, saved_sr);
              env->exception_depth++;

              vector_entry = cpu_ldl_le_data(vc4_tcg_env(cs),
                                             vector_base + vector * 4);

              env->sr = saved_sr & ~(VC4_SR_U | VC4_SR_I | VC4_SR_S);
              if (vector_entry & 1) {
                  env->sr |= VC4_SR_S;
              }
              env->pc = vector_entry & ~1u;
              cs->halted = 0;
              return true;
          }
          '''
          new = '''static bool vc4_cpu_enter_vector(VC4CPU *cpu, uint32_t vector,
                                                    uint32_t vector_base,
                                                    uint32_t return_pc,
                                                    bool external)
          {
              CPUState *cs = CPU(cpu);
              CPUVC4State *env = vc4_cpu_env(cs);
              uint32_t vector_entry;
              uint32_t saved_sr = env->sr;
              uint32_t frame_bit;

              if (env->exception_depth >= VC4_MAX_EXCEPTION_DEPTH) {
                  qemu_log_mask(LOG_GUEST_ERROR,
                                "VideoCore IV: exception nesting overflow at "
                                "0x%08x\\n", return_pc);
                  return false;
              }

              if (env->exception_depth == 0) {
                  env->normal_sp = env->gpr[VC4_REG_SP];
                  env->gpr[VC4_REG_SP] = env->gpr[28];
              }

              vc4_irq_push(cs, env, return_pc);
              vc4_irq_push(cs, env, saved_sr);

              frame_bit = UINT32_C(1) << env->exception_depth;
              if (external) {
                  env->external_irq_frames |= frame_bit;
              } else {
                  env->external_irq_frames &= ~frame_bit;
              }
              env->exception_depth++;

              vector_entry = cpu_ldl_le_data(vc4_tcg_env(cs),
                                             vector_base + vector * 4);

              env->sr = saved_sr & ~(VC4_SR_U | VC4_SR_I | VC4_SR_S);
              if (vector_entry & 1) {
                  env->sr |= VC4_SR_S;
              }
              env->pc = vector_entry & ~1u;
              cs->halted = 0;

              qemu_log_mask(CPU_LOG_INT,
                            "VideoCore IV: %s vector=%u entry=0x%08x "
                            "return=0x%08x depth=%u\\n",
                            external ? "IRQ" : "SWI", vector, vector_entry,
                            return_pc, env->exception_depth);
              return true;
          }

          static bool vc4_cpu_enter_irq(VC4CPU *cpu)
          {
              CPUState *cs = CPU(cpu);
              CPUVC4State *env = vc4_cpu_env(cs);
              uint32_t vector;
              uint32_t vector_base;

              if (!cpu->intc ||
                  !bcm2835_vc4_intc_acknowledge(cpu->intc, &vector, &vector_base)) {
                  return false;
              }

              if (!vc4_cpu_enter_vector(cpu, vector, vector_base, env->pc, true)) {
                  bcm2835_vc4_intc_complete(cpu->intc);
                  return false;
              }
              return true;
          }

          bool vc4_cpu_enter_swi(VC4CPU *cpu, uint32_t number,
                                 uint32_t return_pc)
          {
              if (!cpu->intc) {
                  return false;
              }

              return vc4_cpu_enter_vector(cpu, 32 + (number & 31),
                                          cpu->intc->vaddr, return_pc, false);
          }
          '''
          replace_once('target/vc4/cpu.c', old, new, 'common vector entry')

          replace_once(
              'target/vc4/helper.h',
              'DEF_HELPER_1(vc4_rti, void, env)\n',
              'DEF_HELPER_3(vc4_swi, noreturn, env, i32, i32)\n'
              'DEF_HELPER_1(vc4_rti, void, env)\n',
              'SWI helper declaration')

          old = '''void helper_vc4_rti(CPUArchState *envp)
          {
              CPUVC4State *env = vc4_helper_env(envp);
              VC4CPU *cpu = vc4_env_archcpu(env);
              uint32_t sp = env->gpr[VC4_REG_SP];

              env->sr = cpu_ldl_le_data(envp, sp);
              env->pc = cpu_ldl_le_data(envp, sp + 4);
              env->gpr[VC4_REG_SP] = sp + 8;

              if (env->exception_depth) {
                  env->exception_depth--;
                  if (env->exception_depth == 0) {
                      env->gpr[28] = env->gpr[VC4_REG_SP];
                      env->gpr[VC4_REG_SP] = env->normal_sp;
                  }
              }

              if (cpu->intc) {
                  bcm2835_vc4_intc_complete(cpu->intc);
              }
          }
          '''
          new = '''G_NORETURN void helper_vc4_swi(CPUArchState *envp,
                                                   uint32_t number,
                                                   uint32_t return_pc)
          {
              CPUVC4State *env = vc4_helper_env(envp);
              CPUState *cs = env_cpu(envp);
              VC4CPU *cpu = vc4_env_archcpu(env);

              if (!vc4_cpu_enter_swi(cpu, number, return_pc)) {
                  env->pc = return_pc - 2;
                  cs->exception_index = VC4_EXCP_ILLEGAL;
                  qemu_log_mask(LOG_GUEST_ERROR,
                                "VideoCore IV: could not enter SWI %u at "
                                "0x%08x\\n", number & 31, env->pc);
              }
              cpu_loop_exit(cs);
          }

          void helper_vc4_rti(CPUArchState *envp)
          {
              CPUVC4State *env = vc4_helper_env(envp);
              VC4CPU *cpu = vc4_env_archcpu(env);
              uint32_t sp = env->gpr[VC4_REG_SP];
              bool external = false;

              env->sr = cpu_ldl_le_data(envp, sp);
              env->pc = cpu_ldl_le_data(envp, sp + 4);
              env->gpr[VC4_REG_SP] = sp + 8;

              if (env->exception_depth) {
                  uint32_t frame_bit = UINT32_C(1) <<
                                       (env->exception_depth - 1);

                  external = (env->external_irq_frames & frame_bit) != 0;
                  env->external_irq_frames &= ~frame_bit;
                  env->exception_depth--;
                  if (env->exception_depth == 0) {
                      env->gpr[28] = env->gpr[VC4_REG_SP];
                      env->gpr[VC4_REG_SP] = env->normal_sp;
                  }
              }

              if (external && cpu->intc) {
                  bcm2835_vc4_intc_complete(cpu->intc);
              }

              qemu_log_mask(CPU_LOG_INT,
                            "VideoCore IV: RTI pc=0x%08x sr=0x%08x depth=%u\\n",
                            env->pc, env->sr, env->exception_depth);
          }
          '''
          replace_once('target/vc4/op_helper.c', old, new,
                       'SWI and RTI helpers')

          old = '''    if ((insn & 0xffe0) == 0x0040) {
                  tcg_gen_mov_i32(cpu_pc, vc4_get_reg(ctx, insn & 0x1f));
          '''
          new = '''    if ((insn & 0xffe0) == 0x0020) {
                  gen_helper_vc4_swi(tcg_env,
                                      vc4_get_reg(ctx, insn & 0x1f),
                                      tcg_constant_i32(ctx->base.pc_next));
                  ctx->base.is_jmp = DISAS_NORETURN;
                  return true;
              }
              if ((insn & 0xffc0) == 0x01c0) {
                  gen_helper_vc4_swi(tcg_env,
                                      tcg_constant_i32(insn & 0x3f),
                                      tcg_constant_i32(ctx->base.pc_next));
                  ctx->base.is_jmp = DISAS_NORETURN;
                  return true;
              }
              if ((insn & 0xffe0) == 0x0040) {
                  tcg_gen_mov_i32(cpu_pc, vc4_get_reg(ctx, insn & 0x1f));
          '''
          replace_once('target/vc4/translate.c', old, new,
                       '16-bit SWI decoder')
          PY

          cat > scripts/vc4/check-swi-exception.py <<'PY'
          #!/usr/bin/env python3
          """Exercise both VideoCore IV software-interrupt encodings."""

          from __future__ import annotations

          import argparse
          import json
          from pathlib import Path
          import re
          import socket
          import struct
          import subprocess
          import tempfile
          import time
          from typing import Any

          VECTOR_BASE = 0x1000
          HANDLER = 0x0200
          EXCEPTION_STACK_TOP = 0x2000
          IC0_VADDR = 0x7E002030
          VC4_SR_S = 1 << 29


          class QMP:
              def __init__(self, path: Path, timeout: float = 5.0) -> None:
                  deadline = time.monotonic() + timeout
                  last_error: OSError | None = None
                  while time.monotonic() < deadline:
                      client = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
                      try:
                          client.connect(str(path))
                      except OSError as error:
                          last_error = error
                          client.close()
                          time.sleep(0.01)
                          continue
                      self.socket = client
                      self.stream = client.makefile('rwb', buffering=0)
                      greeting = self._read()
                      if 'QMP' not in greeting:
                          raise RuntimeError(f'invalid QMP greeting: {greeting!r}')
                      self.execute('qmp_capabilities')
                      return
                  raise RuntimeError(f'could not connect to QMP: {last_error}')

              def _read(self) -> dict[str, Any]:
                  line = self.stream.readline()
                  if not line:
                      raise RuntimeError('QMP connection closed')
                  return json.loads(line)

              def execute(self, command: str,
                          arguments: dict[str, Any] | None = None) -> Any:
                  request: dict[str, Any] = {'execute': command}
                  if arguments:
                      request['arguments'] = arguments
                  self.stream.write(json.dumps(request).encode() + b'\n')
                  while True:
                      response = self._read()
                      if 'event' in response:
                          continue
                      if 'error' in response:
                          raise RuntimeError(
                              f'QMP {command} failed: {response["error"]!r}'
                          )
                      if 'return' in response:
                          return response['return']

              def hmp(self, command: str) -> str:
                  result = self.execute(
                      'human-monitor-command', {'command-line': command}
                  )
                  if not isinstance(result, str):
                      raise RuntimeError(f'HMP returned non-string {result!r}')
                  return result

              def close(self) -> None:
                  self.stream.close()
                  self.socket.close()


          def mov32(register: int, value: int) -> bytes:
              if not 0 <= register < 32:
                  raise ValueError(register)
              return struct.pack('<HHH', 0xE800 | register,
                                 value & 0xFFFF, value >> 16)


          def store_word(source: int, base: int) -> bytes:
              if not 0 <= source < 16 or not 0 <= base < 16:
                  raise ValueError((source, base))
              return struct.pack('<H', 0x0900 | (base << 4) | source)


          def common_prefix() -> bytes:
              return b''.join((
                  mov32(0, IC0_VADDR),
                  mov32(1, VECTOR_BASE),
                  store_word(1, 0),
                  mov32(28, EXCEPTION_STACK_TOP),
              ))


          def make_image(register_form: bool) -> tuple[bytes, int, int, int]:
              image = bytearray(0x1100)
              code = bytearray(common_prefix())
              if register_form:
                  code.extend(mov32(2, 1))
                  code.extend(struct.pack('<H', 0x0022))  # swi r2
                  vector = 33
                  image[HANDLER:HANDLER + 2] = struct.pack('<H', 0x000A)
              else:
                  code.extend(struct.pack('<H', 0x01C0))  # swi 0
                  vector = 32
                  image[HANDLER:HANDLER + 2] = struct.pack('<H', 0x0000)

              return_pc = len(code)
              code.extend(struct.pack('<H', 0x0000))
              image[:len(code)] = code
              struct.pack_into('<I', image, VECTOR_BASE + vector * 4,
                               HANDLER | 1)
              final_pc = return_pc + 2 if register_form else HANDLER + 2
              return bytes(image), vector, return_pc, final_pc


          def parse_register(output: str, name: str) -> int:
              match = re.search(rf'\b{name}=([0-9a-fA-F]{{8}})\b', output)
              if not match:
                  raise RuntimeError(f'{name} missing from registers:\n{output}')
              return int(match.group(1), 16)


          def stop_process(process: subprocess.Popen[bytes]) -> None:
              if process.poll() is not None:
                  return
              process.terminate()
              try:
                  process.wait(timeout=2)
              except subprocess.TimeoutExpired:
                  process.kill()
                  process.wait(timeout=2)


          def run_case(qemu: Path, register_form: bool) -> dict[str, Any]:
              image, vector, return_pc, final_pc = make_image(register_form)
              name = 'register' if register_form else 'immediate'

              with tempfile.TemporaryDirectory(prefix=f'vc4-swi-{name}-') as tmp_s:
                  tmp = Path(tmp_s)
                  image_path = tmp / 'swi.bin'
                  qmp_path = tmp / 'qmp.sock'
                  log_path = tmp / 'qemu.log'
                  stderr_path = tmp / 'qemu.stderr'
                  stack_path = tmp / 'stack.bin'
                  image_path.write_bytes(image)

                  command = [
                      str(qemu),
                      '-M', 'raspi3b-vc4',
                      '-m', '64M',
                      '-accel', 'tcg,thread=single,one-insn-per-tb=on',
                      '-kernel', str(image_path),
                      '-S',
                      '-display', 'none',
                      '-serial', 'none',
                      '-monitor', 'none',
                      '-qmp', f'unix:{qmp_path},server=on,wait=off',
                      '-d', 'int,guest_errors',
                      '-D', str(log_path),
                      '-no-reboot',
                  ]
                  with stderr_path.open('wb') as stderr:
                      process = subprocess.Popen(
                          command, stdout=subprocess.DEVNULL, stderr=stderr
                      )

                  qmp: QMP | None = None
                  registers = ''
                  try:
                      qmp = QMP(qmp_path)
                      qmp.execute('cont')
                      deadline = time.monotonic() + 5.0
                      while time.monotonic() < deadline:
                          if process.poll() is not None:
                              raise RuntimeError(
                                  f'QEMU exited with status {process.returncode}'
                              )
                          registers = qmp.hmp('info registers')
                          if parse_register(registers, 'pc') == final_pc:
                              break
                          time.sleep(0.005)
                      else:
                          raise RuntimeError(
                              f'CPU did not halt at 0x{final_pc:08x}:\n'
                              f'{registers}'
                          )

                      qmp.execute('stop')
                      qmp.hmp(
                          f'pmemsave 0x{EXCEPTION_STACK_TOP - 8:x} '
                          f'8 {stack_path}'
                      )
                  finally:
                      if qmp is not None:
                          qmp.close()
                      stop_process(process)

                  if not stack_path.is_file():
                      raise RuntimeError('pmemsave did not create the stack image')
                  saved_sr, saved_pc = struct.unpack('<II', stack_path.read_bytes())
                  log = log_path.read_text(encoding='utf-8', errors='replace')
                  stderr = stderr_path.read_text(
                      encoding='utf-8', errors='replace'
                  )

                  if saved_sr != 0 or saved_pc != return_pc:
                      raise RuntimeError(
                          f'{name} SWI saved sr=0x{saved_sr:08x} '
                          f'pc=0x{saved_pc:08x}, expected sr=0 pc=0x{return_pc:08x}'
                      )
                  if f'VideoCore IV: SWI vector={vector} ' not in log:
                      raise RuntimeError(f'{name} SWI entry was not logged:\n{log}')

                  pc = parse_register(registers, 'pc')
                  sr = parse_register(registers, 'sr')
                  sp = parse_register(registers, 'r25')
                  exception_sp = parse_register(registers, 'r28')
                  if pc != final_pc:
                      raise RuntimeError(f'{name} final PC 0x{pc:08x}')
                  if exception_sp != EXCEPTION_STACK_TOP:
                      raise RuntimeError(
                          f'{name} r28 0x{exception_sp:08x}, expected '
                          f'0x{EXCEPTION_STACK_TOP:08x}'
                      )

                  if register_form:
                      if sr != 0 or sp != 0:
                          raise RuntimeError(
                              f'register SWI did not restore sr/sp: '
                              f'sr=0x{sr:08x} sp=0x{sp:08x}'
                          )
                      if 'VideoCore IV: RTI ' not in log:
                          raise RuntimeError('register SWI did not execute RTI')
                  else:
                      if sr != VC4_SR_S or sp != EXCEPTION_STACK_TOP - 8:
                          raise RuntimeError(
                              f'immediate SWI entry state sr=0x{sr:08x} '
                              f'sp=0x{sp:08x}'
                          )

                  return {
                      'case': name,
                      'vector': vector,
                      'return_pc': f'0x{return_pc:08x}',
                      'final_pc': f'0x{pc:08x}',
                      'saved_sr': f'0x{saved_sr:08x}',
                      'saved_pc': f'0x{saved_pc:08x}',
                      'sr': f'0x{sr:08x}',
                      'sp': f'0x{sp:08x}',
                      'r28': f'0x{exception_sp:08x}',
                      'stderr': stderr,
                  }


          def main() -> int:
              parser = argparse.ArgumentParser()
              parser.add_argument('qemu', type=Path)
              parser.add_argument('--json', type=Path)
              args = parser.parse_args()
              qemu = args.qemu.resolve()
              if not qemu.is_file():
                  parser.error(f'not a file: {qemu}')

              summary = {
                  'schema_version': 1,
                  'cases': [
                      run_case(qemu, register_form=False),
                      run_case(qemu, register_form=True),
                  ],
              }
              rendered = json.dumps(summary, indent=2, sort_keys=True) + '\n'
              if args.json:
                  args.json.write_text(rendered)
              print(rendered, end='')
              return 0


          if __name__ == '__main__':
              raise SystemExit(main())
          PY
          chmod +x scripts/vc4/check-swi-exception.py

          python3 -m py_compile scripts/vc4/check-swi-exception.py
          git diff --check
          git status --short

      - name: Download pinned official firmware trio
        run: |
          for file in bootcode.bin start.elf fixup.dat; do
            curl --fail --location --retry 4 \
              --output "/tmp/${file}" \
              "https://raw.githubusercontent.com/raspberrypi/firmware/${RPI_FIRMWARE_COMMIT}/boot/${file}"
          done
          test "$(git hash-object /tmp/bootcode.bin)" = \
            7642d2d89e4235e7d68875ff70688bdde6e71b5a
          test "$(git hash-object /tmp/start.elf)" = \
            0cefcf3a756740760f9903f35cc3843117853712
          test "$(git hash-object /tmp/fixup.dat)" = \
            1845e38de9d4f9a6d9ad7f5273bfe58b2582a7e6

      - name: Check VC4 probes
        run: |
          python3 -m py_compile \
            scripts/vc4/raspi3-stock-bootcode-probe.py \
            scripts/vc4/raspi3-stock-bootcode-state.py \
            scripts/vc4/raspi3-stock-bootcode-0200.py \
            scripts/vc4/raspi3-stock-bootcode-mmio.py \
            scripts/vc4/stock_bootcode_progress.py
          python3 scripts/vc4/stock_bootcode_progress.py

      - name: Configure and build the heterogeneous emulator
        run: |
          ./configure \
            --target-list=aarch64-softmmu \
            --disable-docs \
            --disable-werror
          ninja -C build qemu-system-aarch64

      - name: Exercise immediate and register-form SWI entry
        run: |
          out=/tmp/vc4-swi-exception
          rm -rf "$out"
          mkdir -p "$out"
          python3 scripts/vc4/check-swi-exception.py \
            build/qemu-system-aarch64 \
            --json "$out/unit-summary.json"

      - name: Run official firmware beyond swi 0
        run: |
          set -o pipefail
          out=/tmp/vc4-swi-exception

          python3 scripts/vc4/raspi3-stock-bootcode-mmio.py \
            build/qemu-system-aarch64 \
            /tmp/bootcode.bin \
            --start-elf /tmp/start.elf \
            --fixup-dat /tmp/fixup.dat \
            --seconds 120 \
            --trace-samples 420 \
            --trace-interval 0.05 \
            --qemu-debug in_asm,int,guest_errors \
            --qemu-debug-filter 0x1eddba80..0x1eddbc80 \
            --out-dir "$out/official" 2>&1 | tee "$out/official/probe.log"

          test -s "$out/official/probe.log"

      - name: Assert the software-interrupt frontier is crossed
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path
          import re

          out = Path('/tmp/vc4-swi-exception')
          probe = (out / 'official/probe.log').read_text(
              encoding='utf-8', errors='replace'
          ).splitlines()

          if any(line.startswith('VC4_LOW_PC_WRITE ') for line in probe):
              raise SystemExit('unexpected low-memory PC write')
          if any('unimplemented opcode 0x01c0' in line for line in probe):
              raise SystemExit('swi 0 is still reaching the illegal-opcode path')

          swi = [
              line for line in probe
              if 'VideoCore IV: SWI vector=32 ' in line
          ]
          if not swi:
              raise SystemExit('official firmware did not enter SWI vector 32')

          barrier = next((
              line for line in reversed(probe)
              if line.startswith('STOCK_BOOTCODE_BARRIER ')
          ), None)
          if barrier is None:
              raise SystemExit('missing official-firmware barrier record')
          match = re.search(r'\bpc=0x([0-9a-fA-F]+)', barrier)
          if not match:
              raise SystemExit(f'barrier has no PC: {barrier}')
          barrier_pc = int(match.group(1), 16)
          if barrier_pc == 0x1eddba9a:
              raise SystemExit('official firmware remained at swi 0')

          progress = None
          for line in probe:
              if line.startswith('STOCK_BOOTCODE_PROGRESS '):
                  progress = json.loads(line.split(' ', 1)[1])
          if progress is None:
              raise SystemExit('missing stock progress record')

          diagnostics = [
              line for line in probe
              if ('unimplemented opcode' in line or
                  'illegal instruction' in line or
                  'bad read offset' in line or
                  'bad write offset' in line)
          ]
          summary = {
              'schema_version': 1,
              'barrier_pc': f'0x{barrier_pc:08x}',
              'barrier': barrier,
              'swi_entries': swi[-20:],
              'diagnostics': diagnostics[-80:],
              'progress': progress,
          }
          (out / 'official-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Commit validated VC4 software-interrupt support
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            scripts/vc4/check-swi-exception.py \
            target/vc4/cpu.c \
            target/vc4/cpu.h \
            target/vc4/helper.h \
            target/vc4/op_helper.c \
            target/vc4/translate.c
          git rm .github/workflows/vc4-swi-exception.yml
          git commit -m 'target/vc4: implement software-interrupt entry'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload VC4 software-interrupt frontier
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-swi-exception-${{ github.run_attempt }}
          path: /tmp/vc4-swi-exception
          if-no-files-found: warn
          retention-days: 14
