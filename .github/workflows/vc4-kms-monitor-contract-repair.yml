name: VC4 monitor contract gate repair

on:
  push:
    branches:
      - agent/vc4-linux-kms-bind-diagnostics
    paths:
      - .github/workflows/vc4-kms-monitor-contract-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Make optional monitor witnesses truly optional
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/vc4-kms-monitor-contract.yml")
          source = path.read_text()
          old = """          git add -- \\
            VC4_LINUX_KMS_MONITOR_DELTA.json \\
            VC4_LINUX_KMS_MONITOR_DELTA.md \\
            hw/arm/Kconfig \\
            hw/arm/bcm2835_peripherals.c \\
            hw/misc/bcm2835_property.c \\
            include/hw/misc/bcm2835_property.h \\
            scripts/vc4/property-expander-gpio-smoke.py
          git rm -- .github/workflows/vc4-kms-monitor-contract.yml
          """
          new = """          git add -- \\
            VC4_LINUX_KMS_MONITOR_DELTA.json \\
            VC4_LINUX_KMS_MONITOR_DELTA.md \\
            hw/arm/Kconfig \\
            hw/arm/bcm2835_peripherals.c \\
            hw/misc/bcm2835_property.c \\
            include/hw/misc/bcm2835_property.h
          if test -e scripts/vc4/property-expander-gpio-smoke.py; then
            git add -- scripts/vc4/property-expander-gpio-smoke.py
          fi
          git rm -- .github/workflows/vc4-kms-monitor-contract.yml
          """
          if source.count(old) != 1:
              raise SystemExit("monitor publication anchor changed")
          path.write_text(source.replace(old, new, 1))
          PY
          git diff --check

      - name: Publish the repaired gate
        run: |
          set -euo pipefail
          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git add -- .github/workflows/vc4-kms-monitor-contract.yml
          git rm -- .github/workflows/vc4-kms-monitor-contract-repair.yml
          git commit -m "ci/vc4: harden optional monitor witness publication"
          git pull --rebase origin agent/vc4-linux-kms-bind-diagnostics
          git push origin HEAD:agent/vc4-linux-kms-bind-diagnostics
