name: VC4 direct Linux diagnostic init

on:
  push:
    branches:
      - agent/vc4-hetero-direct-linux
    paths:
      - .github/workflows/vc4-direct-linux-diagnostic-init.yml
      - scripts/vc4/build-linux-initramfs-v2.sh
      - scripts/vc4/raspi3-direct-linux-control.py
      - tests/vc4/linux-init-v2.c
      - scripts/vc4/hetero-direct-linux-integrate.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-direct-linux-diagnostic-init
  cancel-in-progress: true

jobs:
  diagnostic-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RPI_FIRMWARE_COMMIT: 3d301dd924bcd758a4c8cb19fe8531031f033f43
      OFFICIAL_DIR: /tmp/vc4-official
      OUT_DIR: /tmp/vc4-direct-linux-diagnostic

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            binutils-aarch64-linux-gnu \
            cpio curl file gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross linux-libc-dev-arm64-cross \
            ninja-build pkg-config python3 python3-venv \
            libglib2.0-dev libpixman-1-dev zlib1g-dev

      - name: Materialize and lint
        run: |
          set -euo pipefail
          python3 scripts/vc4/hetero-direct-linux-integrate.py
          python3 scripts/vc4/hetero-direct-linux-integrate.py
          python3 -m py_compile \
            scripts/vc4/hetero-direct-linux-integrate.py \
            scripts/vc4/raspi3-direct-linux-control.py \
            scripts/vc4/preg-mutex-smoke.py \
            scripts/vc4/msync-smoke.py
          bash -n scripts/vc4/build-linux-initramfs-v2.sh
          git diff --check

      - name: Download pinned Linux artifacts
        run: |
          set -euo pipefail
          rm -rf "$OFFICIAL_DIR"
          mkdir -p "$OFFICIAL_DIR"
          for file in kernel8.img bcm2710-rpi-3-b.dtb; do
            curl --fail --location --retry 5 \
              --output "$OFFICIAL_DIR/$file" \
              "https://raw.githubusercontent.com/raspberrypi/firmware/${RPI_FIRMWARE_COMMIT}/boot/$file"
          done
          test "$(git hash-object "$OFFICIAL_DIR/kernel8.img")" = \
            a694aa64988bbecadc770c874488165303eac673
          test "$(git hash-object "$OFFICIAL_DIR/bcm2710-rpi-3-b.dtb")" = \
            398c480adc49a5fcb03aa4c095ea74db5d1f893b
          sha256sum "$OFFICIAL_DIR"/* >"$OFFICIAL_DIR/SHA256SUMS"

      - name: Configure and build
        run: |
          set -euo pipefail
          ./configure \
            --target-list=aarch64-softmmu,vc4-softmmu \
            --disable-docs --disable-werror \
            2>&1 | tee /tmp/vc4-linux-diag-configure.log
          ninja -C build qemu-system-aarch64 qemu-system-vc4 \
            2>&1 | tee /tmp/vc4-linux-diag-build.log

      - name: Run architectural regressions
        run: |
          set -euo pipefail
          python3 scripts/vc4/preg-mutex-smoke.py \
            --qemu build/qemu-system-vc4 \
            2>&1 | tee /tmp/vc4-linux-diag-preg.log
          python3 scripts/vc4/msync-smoke.py \
            --qemu build/qemu-system-aarch64 \
            2>&1 | tee /tmp/vc4-linux-diag-msync.log

      - name: Build the diagnostic initramfs reproducibly
        run: |
          set -euo pipefail
          rm -rf \
            build/vc4-linux-initramfs-v2-a \
            build/vc4-linux-initramfs-v2-b
          bash scripts/vc4/build-linux-initramfs-v2.sh \
            build/vc4-linux-initramfs-v2-a
          bash scripts/vc4/build-linux-initramfs-v2.sh \
            "$PWD/build/vc4-linux-initramfs-v2-b"
          cmp \
            build/vc4-linux-initramfs-v2-a/initramfs.cpio \
            build/vc4-linux-initramfs-v2-b/initramfs.cpio
          cpio -it <build/vc4-linux-initramfs-v2-a/initramfs.cpio \
            | grep -E -q '(^|/)init$'

      - name: Boot Linux and diagnose framebuffer scanout
        id: probe
        shell: bash
        run: |
          set -uo pipefail
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"
          python3 scripts/vc4/raspi3-direct-linux-control.py \
            build/qemu-system-aarch64 \
            "$OFFICIAL_DIR/kernel8.img" \
            "$OFFICIAL_DIR/bcm2710-rpi-3-b.dtb" \
            build/vc4-linux-initramfs-v2-a/initramfs.cpio \
            --seconds 180 \
            --out-dir "$OUT_DIR" \
            2>&1 | tee "$OUT_DIR/probe.log"
          rc=${PIPESTATUS[0]}
          echo "return_code=$rc" >>"$GITHUB_OUTPUT"
          exit 0

      - name: Reduce the diagnostic frontier
        id: classify
        if: always()
        shell: bash
        env:
          PROBE_RC: ${{ steps.probe.outputs.return_code }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          import os
          import re

          result_path = Path(os.environ['OUT_DIR']) / 'result.json'
          result = (
              json.loads(result_path.read_text())
              if result_path.is_file() else {}
          )
          serial = '\n'.join(result.get('serial_tail', []))
          failures = Counter(
              match.group(1)
              for match in re.finditer(r'VC4_LINUX_FB_FAIL stage=([^ ]+)', serial)
          )
          if result.get('passed'):
              classification = 'linux-framebuffer-scanout'
          elif result.get('framebuffer_marker_seen'):
              classification = 'linux-framebuffer-painted-scanout-blocked'
          elif 'VC4_LINUX_FB_FAIL stage=paint' in serial:
              classification = 'linux-framebuffer-paint-blocked'
          elif 'VC4_LINUX_FB_FAIL stage=open' in serial:
              classification = 'linux-framebuffer-device-missing'
          elif result.get('init_seen'):
              classification = 'linux-init-before-framebuffer-result'
          elif result.get('linux_version_seen'):
              classification = 'linux-kernel-before-init'
          elif result:
              classification = 'linux-entry-or-serial'
          else:
              classification = 'linux-probe-infrastructure'
          status = {
              'schema_version': 1,
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'source_sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'classification': classification,
              'probe_return_code': os.environ.get('PROBE_RC', ''),
              'framebuffer_failure_counts': dict(failures),
              'result': result,
          }
          Path('VC4_DIRECT_LINUX_DIAGNOSTIC_STATUS.json').write_text(
              json.dumps(status, indent=2, sort_keys=True) + '\n'
          )
          Path('VC4_DIRECT_LINUX_DIAGNOSTIC_STATUS.md').write_text(
              '# VC4 direct Linux diagnostic init\n\n'
              f'Classification: **`{classification}`**\n\n'
              f'Linux banner: `{bool(result.get("linux_version_seen"))}`\n\n'
              f'Init: `{bool(result.get("init_seen"))}`\n\n'
              f'Framebuffer marker: '
              f'`{bool(result.get("framebuffer_marker_seen"))}`\n\n'
              f'Scanout: `{bool(result.get("scanout_passed"))}`\n'
          )
          print(json.dumps({
              'classification': classification,
              'linux_version_seen': result.get('linux_version_seen'),
              'init_seen': result.get('init_seen'),
              'framebuffer_marker_seen': result.get(
                  'framebuffer_marker_seen'
              ),
              'scanout_passed': result.get('scanout_passed'),
          }, indent=2))
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'classification={classification}\n')
              output.write(
                  'passed=' + ('true' if result.get('passed') else 'false')
                  + '\n'
              )
          PY

      - name: Upload complete diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-direct-linux-diagnostic-${{ github.run_attempt }}
          path: |
            VC4_DIRECT_LINUX_DIAGNOSTIC_STATUS.json
            VC4_DIRECT_LINUX_DIAGNOSTIC_STATUS.md
            /tmp/vc4-direct-linux-diagnostic
            /tmp/vc4-linux-diag-configure.log
            /tmp/vc4-linux-diag-build.log
            /tmp/vc4-linux-diag-preg.log
            /tmp/vc4-linux-diag-msync.log
            /tmp/vc4-official/SHA256SUMS
            build/vc4-linux-initramfs-v2-a/SHA256SUMS
          if-no-files-found: warn
          retention-days: 14

      - name: Publish diagnostic status and validated fixtures
        if: always()
        shell: bash
        env:
          PASSED: ${{ steps.classify.outputs.passed }}
          CLASSIFICATION: ${{ steps.classify.outputs.classification }}
        run: |
          set -euo pipefail
          cp VC4_DIRECT_LINUX_DIAGNOSTIC_STATUS.json /tmp/diag-status.json
          cp VC4_DIRECT_LINUX_DIAGNOSTIC_STATUS.md /tmp/diag-status.md
          git config user.name 'VC4 CI'
          git config user.email 'vc4-ci@users.noreply.github.com'
          git reset --hard "$GITHUB_SHA"
          cp /tmp/diag-status.json VC4_DIRECT_LINUX_DIAGNOSTIC_STATUS.json
          cp /tmp/diag-status.md VC4_DIRECT_LINUX_DIAGNOSTIC_STATUS.md
          git add \
            VC4_DIRECT_LINUX_DIAGNOSTIC_STATUS.json \
            VC4_DIRECT_LINUX_DIAGNOSTIC_STATUS.md
          if [ "$PASSED" = true ]; then
            message='ci/vc4: record direct Linux framebuffer scanout [skip ci]'
          else
            message="ci/vc4: record ${CLASSIFICATION} [skip ci]"
          fi
          git diff --cached --check
          git commit -m "$message"
          git pull --rebase origin agent/vc4-hetero-direct-linux
          git push origin HEAD:agent/vc4-hetero-direct-linux
          if [ "$PASSED" = true ]; then
            git push --force-with-lease \
              origin HEAD:agent/vc4-linux-framebuffer-bringup
          fi
