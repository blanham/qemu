name: VC4 architectural halt origin

on:
  push:
    branches:
      - agent/vc4-stock-bootcode
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace-halt-origin:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RPI_FIRMWARE_COMMIT: 3d301dd924bcd758a4c8cb19fe8531031f033f43

    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl ninja-build pkg-config python3 python3-venv \
            libglib2.0-dev libpixman-1-dev zlib1g-dev

      - name: Download pinned official firmware trio
        run: |
          for file in bootcode.bin start.elf fixup.dat; do
            curl --fail --location --retry 4 \
              --output "/tmp/${file}" \
              "https://raw.githubusercontent.com/raspberrypi/firmware/${RPI_FIRMWARE_COMMIT}/boot/${file}"
          done
          test "$(git hash-object /tmp/bootcode.bin)" = \
            7642d2d89e4235e7d68875ff70688bdde6e71b5a
          test "$(git hash-object /tmp/start.elf)" = \
            0cefcf3a756740760f9903f35cc3843117853712
          test "$(git hash-object /tmp/fixup.dat)" = \
            1845e38de9d4f9a6d9ad7f5273bfe58b2582a7e6

      - name: Enable firmware-context architectural halt tracing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("target/vc4/op_helper.c")
          text = path.read_text()
          old = (
              '    qemu_log_mask(CPU_LOG_EXEC, '
              '"VideoCore IV: HALT at 0x%08x\\n", env->pc);\n'
          )
          new = (
              '    if (env->gpr[VC4_REG_LR] >= 0x200) {\n'
              '        qemu_log_mask(LOG_GUEST_ERROR,\n'
              '                      "VC4_ARCH_HALT insn-pc=0x%08x '
              'next-pc=0x%08x lr=0x%08x sr=0x%08x\\n",\n'
              '                      env->pc - 2, env->pc,\n'
              '                      env->gpr[VC4_REG_LR], env->sr);\n'
              '    }\n'
          )
          if text.count(old) != 1:
              raise SystemExit("unexpected helper_vc4_halt source")
          path.write_text(text.replace(old, new))
          PY
          git diff --check

      - name: Configure and build heterogeneous system emulator
        run: |
          ./configure \
            --target-list=aarch64-softmmu \
            --disable-docs \
            --disable-werror
          ninja -C build qemu-system-aarch64

      - name: Run official-firmware halt-origin probe
        run: |
          set -o pipefail
          python3 scripts/vc4/raspi3-stock-bootcode-0200.py \
            build/qemu-system-aarch64 \
            /tmp/bootcode.bin \
            --start-elf /tmp/start.elf \
            --fixup-dat /tmp/fixup.dat \
            --seconds 8 \
            --fast-tcg \
            --barrier-is-success 2>&1 | tee /tmp/vc4-halt-origin.log

          grep -E \
            '^(VC4_ARCH_HALT|VideoCore IV: (illegal instruction|unknown exception)|STOCK_BOOTCODE_TRACE|STOCK_BOOTCODE_BARRIER)' \
            /tmp/vc4-halt-origin.log > /tmp/vc4-halt-origin-summary.log || true
          cat /tmp/vc4-halt-origin-summary.log

          if ! grep -q '^VC4_ARCH_HALT ' /tmp/vc4-halt-origin.log; then
            echo 'No firmware-context architectural VC4 HALT/SLEEP was observed.' >&2
            exit 1
          fi

      - name: Upload halt-origin trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-halt-origin-${{ github.run_attempt }}
          path: |
            /tmp/vc4-halt-origin.log
            /tmp/vc4-halt-origin-summary.log
          if-no-files-found: warn
          retention-days: 14
