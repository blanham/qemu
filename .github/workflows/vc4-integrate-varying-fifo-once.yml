name: VC4 integrate validated varying FIFO product

on:
  push:
    branches:
      - agent/vc4-linux-mesa-gles2-frontier
    paths:
      - .github/workflows/vc4-integrate-varying-fifo-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-integrate-varying-fifo-once
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_BRANCH: agent/vc4-linux-mesa-gles2-frontier
      SOURCE_BRANCH: agent/vc4-qpu-varying-fifo
      PRODUCT_COMMIT: 0e5b07e07c00b6136bb9d247ef02613208da8bbd
      WORKFLOW_PATH: .github/workflows/vc4-integrate-varying-fifo-once.yml

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Materialize only the validated product delta
        run: |
          set -euo pipefail
          git fetch origin "$SOURCE_BRANCH" "$TARGET_BRANCH"
          test "$(git rev-parse "$PRODUCT_COMMIT")" = "$PRODUCT_COMMIT"
          test "$(git show -s --format=%s "$PRODUCT_COMMIT")" = \
            'hw/display: model VC4 QPU varying FIFO reads'
          git cherry-pick --no-commit "$PRODUCT_COMMIT"
          expected=$(cat <<'EOF'
          hw/display/vc4_qpu_exec.c
          include/hw/display/vc4_qpu_exec.h
          tests/unit/test-vc4-qpu.c
          EOF
          )
          actual=$(git diff --name-only | LC_ALL=C sort)
          test "$actual" = "$(printf '%s\n' "$expected" | sed 's/^          //' | LC_ALL=C sort)"
          git diff --check

      - name: Build and validate on the current Mesa frontier
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev libpixman-1-dev \
            ninja-build pkg-config python3 zlib1g-dev
          ./configure \
            --target-list=aarch64-softmmu,vc4-softmmu \
            --disable-docs --disable-werror
          ninja -C build \
            qemu-system-aarch64 qemu-system-vc4 \
            tests/unit/test-vc4-qpu \
            tests/unit/test-vc4-qpu-contract \
            tests/unit/test-vc4-v3d-pipeline
          build/tests/unit/test-vc4-qpu --tap -k
          build/tests/unit/test-vc4-qpu-contract --tap -k
          build/tests/unit/test-vc4-v3d-pipeline --tap -k
          python3 scripts/vc4/v3d-smoke.py \
            --qemu build/qemu-system-aarch64

      - name: Publish product and retire the one-shot integrator
        run: |
          set -euo pipefail
          git config user.name 'VC4 Integration CI'
          git config user.email 'vc4-integration-ci@users.noreply.github.com'
          git add -- \
            hw/display/vc4_qpu_exec.c \
            include/hw/display/vc4_qpu_exec.h \
            tests/unit/test-vc4-qpu.c
          git diff --cached --check
          git commit -m 'hw/display: model VC4 QPU varying FIFO reads'
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"

          git rm -- "$WORKFLOW_PATH"
          git commit -m 'ci/vc4: retire varying FIFO integrator [skip ci]'
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
