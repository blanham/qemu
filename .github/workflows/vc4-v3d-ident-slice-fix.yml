name: VC4 V3D identification workflow repair

on:
  push:
    branches:
      - agent/vc4-v3d-bringup
    paths:
      - .github/workflows/vc4-v3d-ident-slice-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Repair and retrigger the source materializer
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/vc4-v3d-ident-slice.yml
          test -f "$workflow"
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/vc4-v3d-ident-slice.yml")
          text = path.read_text(encoding="utf-8")
          old = "          from pathlib import Path\n          import re\n"
          new = (
              "          from pathlib import Path\n"
              "          import re\n"
              "          import subprocess\n"
          )
          if old in text and "          import subprocess\n" not in text:
              text = text.replace(old, new, 1)
          elif "          import subprocess\n" not in text:
              raise SystemExit("materializer import anchor not found")
          path.write_text(text, encoding="utf-8")
          PY
          rm .github/workflows/vc4-v3d-ident-slice-fix.yml
          git add -A
          git diff --cached --check
          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git commit -m "ci/vc4: repair V3D identification materializer"
          git pull --rebase origin agent/vc4-v3d-bringup
          git push origin HEAD:agent/vc4-v3d-bringup
