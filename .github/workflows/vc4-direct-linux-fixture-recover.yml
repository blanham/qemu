name: VC4 direct Linux fixture recovery

on:
  push:
    branches:
      - agent/vc4-hetero-direct-linux
    paths:
      - .github/workflows/vc4-direct-linux-fixture-recover.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-direct-linux-fixture-recovery
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Repair the deterministic initramfs output path
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/vc4/build-linux-initramfs.sh")
          text = path.read_text(encoding="utf-8")
          fix = 'mkdir -p -- "${1:-build/vc4-linux-initramfs}"\n'
          if fix not in text:
              lines = text.splitlines(keepends=True)
              for index, line in enumerate(lines):
                  if "initramfs.cpio" in line and ">" in line:
                      lines.insert(index, fix)
                      break
              else:
                  raise SystemExit("initramfs output redirection not found")
              path.write_text("".join(lines), encoding="utf-8")
          PY
          bash -n scripts/vc4/build-linux-initramfs.sh
          git diff --check

      - name: Publish the repair and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/vc4-direct-linux-fixture-recover.yml
          git add scripts/vc4/build-linux-initramfs.sh
          git diff --cached --check
          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git commit -m "tests/vc4: create initramfs output directory"
          git pull --rebase origin agent/vc4-hetero-direct-linux
          git push origin HEAD:agent/vc4-hetero-direct-linux
