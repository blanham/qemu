name: WD40 QoL integration

on:
  push:
    branches:
      - wd40/qol-integration
      - wd40/qol-transform-composition-fix
      - wd40/qol-output-capture-integration
      - wd40/qol-hmp-completion-integration
      - wd40/qol-cpu-register-integration
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wd40-qol-integration-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  integrate-build-test-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure commit identity
        run: |
          git config user.name "WD40 Build Bot"
          git config user.email "wd40-build@users.noreply.github.com"

      - name: Transplant the fork-only VC4 handoff probes
        run: |
          set -Eeuo pipefail
          git fetch origin master

          if test ! -f tests/vc4/aarch64-handoff.S; then
            git cherry-pick 3386b05f8923b208805440f6e8b297741e01b95d
          fi
          if test ! -f tests/vc4/aarch64-handoff.ld; then
            git cherry-pick caf2bf6002766c644a1fefff832d9fe02b7f4c05
          fi
          if test ! -f scripts/vc4/raspi3-arm-payload-probe.py; then
            git cherry-pick a1cffdb7eda8cab773e6594aef1ba4a92b344261
          fi

      - name: Apply, replay, and validate the complete QoL contract
        run: |
          set -Eeuo pipefail

          apply_contract() {
            python3 scripts/wd40/apply-rustless-build.py
            python3 scripts/wd40/apply-amd-1tb-hole-control-hardening.py
            python3 scripts/wd40/apply-amd-1tb-hole-control.py
            python3 scripts/wd40/apply-subtractive-log-mask.py
            python3 scripts/wd40/apply-hmp-command-schema-composability.py
            python3 scripts/wd40/apply-hmp-command-introspection-hardening.py
            python3 scripts/wd40/apply-hmp-command-introspection.py
            python3 scripts/wd40/apply-hmp-argument-introspection.py
            python3 scripts/wd40/apply-structured-log-control-composability.py
            python3 scripts/wd40/apply-structured-log-control.py
            python3 scripts/wd40/apply-structured-log-control-hardening.py
            python3 scripts/wd40/apply-split-irq-exception-logs.py
            python3 scripts/wd40/apply-monitor-output-capture.py
            python3 scripts/wd40/apply-monitor-output-capture-hardening.py
            python3 scripts/wd40/apply-hmp-completion.py
            python3 scripts/wd40/apply-gdb-register-gap-accounting.py
            python3 scripts/wd40/apply-cpu-register-snapshots.py
          }

          apply_contract
          git diff --no-ext-diff --binary \
            > /tmp/wd40-integration-pass1.diff
          apply_contract
          git diff --no-ext-diff --binary \
            > /tmp/wd40-integration-pass2.diff
          if ! cmp -s \
              /tmp/wd40-integration-pass1.diff \
              /tmp/wd40-integration-pass2.diff; then
            echo "complete QoL replay changed the generated tree" >&2
            diff -u \
              /tmp/wd40-integration-pass1.diff \
              /tmp/wd40-integration-pass2.diff || true
            exit 1
          fi

          python3 scripts/ci/check-wd40-rustless.py
          python3 scripts/ci/check-wd40-amd-1tb-hole.py
          python3 scripts/ci/check-wd40-subtractive-log-mask.py
          python3 scripts/ci/check-wd40-hmp-command-introspection.py
          python3 scripts/ci/check-wd40-hmp-argument-introspection.py
          python3 scripts/ci/check-wd40-hmp-schema-composability.py
          python3 scripts/ci/check-wd40-transform-composability.py
          python3 scripts/ci/check-wd40-structured-log-control.py
          python3 scripts/ci/check-wd40-split-irq-exception-logs.py
          python3 scripts/ci/check-wd40-monitor-output-capture.py
          python3 scripts/ci/check-wd40-hmp-completion.py
          python3 scripts/ci/check-wd40-gdb-register-gap-accounting.py
          python3 scripts/ci/check-wd40-cpu-register-snapshots.py
          git diff --check

      - name: Install C and probe build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils-aarch64-linux-gnu \
            build-essential \
            ninja-build \
            pkg-config \
            python3-venv \
            libglib2.0-dev \
            libpixman-1-dev

      - name: Validate the VC4 probe assets
        run: |
          set -Eeuo pipefail
          test -f scripts/vc4/raspi3-arm-payload-probe.py
          test -f tests/vc4/aarch64-handoff.S
          test -f tests/vc4/aarch64-handoff.ld

          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/vc4/raspi3-arm-payload-probe.py")
          compile(path.read_text(encoding="utf-8"), str(path), "exec")
          PY

          aarch64-linux-gnu-as \
            -o /tmp/aarch64-handoff.o \
            tests/vc4/aarch64-handoff.S
          aarch64-linux-gnu-ld \
            -T tests/vc4/aarch64-handoff.ld \
            -o /tmp/aarch64-handoff.elf \
            /tmp/aarch64-handoff.o
          aarch64-linux-gnu-objcopy \
            -O binary \
            /tmp/aarch64-handoff.elf \
            /tmp/aarch64-handoff.bin

          entry="$({ aarch64-linux-gnu-readelf -h /tmp/aarch64-handoff.elf; } \
            | awk '/Entry point address:/ { print $4 }')"
          test "$entry" = "0x80000"
          test -s /tmp/aarch64-handoff.bin
          aarch64-linux-gnu-readelf -r /tmp/aarch64-handoff.elf \
            | grep -F "There are no relocations in this file."

      - name: Build four system targets and user mode without Rust
        timeout-minutes: 110
        run: |
          set -Eeuo pipefail
          mkdir .wd40-poison
          for tool in rustc cargo rustdoc rustfmt bindgen; do
            cat > ".wd40-poison/$tool" <<EOF
          #!/bin/sh
          echo "WD40 Rustless contract: unexpected invocation of $tool" >&2
          exit 99
          EOF
            chmod +x ".wd40-poison/$tool"
          done
          export PATH="$PWD/.wd40-poison:$PATH"

          mkdir build-qol-integration
          cd build-qol-integration
          ../configure \
            --target-list=x86_64-softmmu,aarch64-softmmu,m68k-softmmu,ppc-softmmu,x86_64-linux-user \
            --disable-rust \
            --enable-fdt=internal \
            --disable-docs \
            --disable-werror
          timeout --foreground --signal=TERM --kill-after=5m 95m \
            ninja -j2 \
              tests/unit/test-logging \
              qemu-system-x86_64 \
              qemu-system-aarch64 \
              qemu-system-m68k \
              qemu-system-ppc \
              qemu-x86_64
          cd ..

      - name: Exercise logging front ends and structured control
        run: |
          set -Eeuo pipefail
          ./build-qol-integration/tests/unit/test-logging --tap -k
          python3 scripts/ci/check-wd40-rustless.py build-qol-integration

          set +e
          ./build-qol-integration/qemu-system-x86_64 -d help \
            > /tmp/wd40-system-log-help.txt 2>&1
          system_help_rc=$?
          ./build-qol-integration/qemu-x86_64 -d help \
            > /tmp/wd40-user-log-help.txt 2>&1
          user_help_rc=$?
          set -e

          grep -F "prefix '+' to add and '-' to remove" \
            /tmp/wd40-system-log-help.txt
          grep -F "prefix '+' to add and '-' to remove" \
            /tmp/wd40-user-log-help.txt
          if [[ $system_help_rc -eq 0 || $user_help_rc -eq 0 ]]; then
            echo "-d help unexpectedly continued into emulation" >&2
            exit 1
          fi

          ./build-qol-integration/qemu-x86_64 -h \
            | grep -F "enable logging; prefix '-' to exclude an item"

          printf 'log guest_errors,int,-int\nlog all,-tid,-int,-exec,-cpu\nquit\n' \
            | timeout 30 ./build-qol-integration/qemu-system-x86_64 \
                -machine none \
                -display none \
                -nodefaults \
                -S \
                -monitor stdio

          set +e
          ./build-qol-integration/qemu-system-x86_64 \
            -machine none \
            -display none \
            -nodefaults \
            -d all,-definitely-not-a-log-item \
            > /tmp/wd40-invalid-mask.txt 2>&1
          invalid_rc=$?
          set -e
          if [[ $invalid_rc -eq 0 ]]; then
            cat /tmp/wd40-invalid-mask.txt
            echo "invalid subtractive log item unexpectedly succeeded" >&2
            exit 1
          fi

          python3 scripts/ci/check-wd40-structured-log-control.py \
            build-qol-integration
          python3 scripts/ci/check-wd40-split-irq-exception-logs.py \
            build-qol-integration

      - name: Exercise the AMD memory-layout overrides
        run: |
          set -Eeuo pipefail
          python3 scripts/ci/check-wd40-amd-1tb-hole.py build-qol-integration

      - name: Query HMP registries, arguments, and initialization phases
        run: |
          set -Eeuo pipefail
          python3 scripts/ci/check-wd40-hmp-command-introspection.py \
            build-qol-integration
          python3 scripts/ci/check-wd40-hmp-argument-introspection.py \
            build-qol-integration
          python3 scripts/ci/check-wd40-hmp-schema-composability.py

      - name: Exercise QMP and HMP output capture and completion
        run: |
          set -Eeuo pipefail
          python3 scripts/ci/check-wd40-monitor-output-capture.py \
            build-qol-integration
          python3 scripts/ci/check-wd40-hmp-completion.py \
            build-qol-integration

      - name: Exercise x86-64 and AArch64 register snapshots
        run: |
          set -Eeuo pipefail
          python3 scripts/ci/check-wd40-cpu-register-snapshots.py \
            build-qol-integration x86_64
          python3 scripts/ci/check-wd40-cpu-register-snapshots.py \
            build-qol-integration aarch64

      - name: Exercise m68k register snapshots
        run: |
          set -Eeuo pipefail
          python3 scripts/ci/check-wd40-cpu-register-snapshots.py \
            build-qol-integration m68k

      - name: Exercise PowerPC snapshots and GDB register gaps
        run: |
          set -Eeuo pipefail
          python3 scripts/ci/check-wd40-gdb-register-gap-accounting.py
          python3 scripts/ci/check-wd40-cpu-register-snapshots.py \
            build-qol-integration ppc

      - name: Publish the validated integration history
        if: github.ref_name == 'wd40/qol-integration'
        run: |
          set -Eeuo pipefail
          rm -rf .wd40-poison build-qol-integration
          python3 scripts/ci/check-wd40-rustless.py
          python3 scripts/ci/check-wd40-amd-1tb-hole.py
          python3 scripts/ci/check-wd40-subtractive-log-mask.py
          python3 scripts/ci/check-wd40-hmp-command-introspection.py
          python3 scripts/ci/check-wd40-hmp-argument-introspection.py
          python3 scripts/ci/check-wd40-hmp-schema-composability.py
          python3 scripts/ci/check-wd40-transform-composability.py
          python3 scripts/ci/check-wd40-structured-log-control.py
          python3 scripts/ci/check-wd40-split-irq-exception-logs.py
          python3 scripts/ci/check-wd40-monitor-output-capture.py
          python3 scripts/ci/check-wd40-hmp-completion.py
          python3 scripts/ci/check-wd40-gdb-register-gap-accounting.py
          python3 scripts/ci/check-wd40-cpu-register-snapshots.py
          git diff --check
          git status --short
          test -z "$(git status --porcelain)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
