name: VC4 low-PC virtual-clock recovery

on:
  push:
    branches:
      - agent/vc4-post-msync-lowpc-trace
    paths:
      - .github/workflows/vc4-lowpc-clock-recovery.yml
      - scripts/vc4/raspi3-stock-arm-payload.py
      - scripts/vc4/raspi3-stock-bootcode-probe.py
      - scripts/vc4/msync-smoke.py
      - hw/arm/bcm2835_peripherals.c
      - hw/misc/bcm2835_msync.c
      - hw/timer/bcm2835_systmr.c
      - target/vc4/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-lowpc-clock-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RPI_FIRMWARE_COMMIT: 3d301dd924bcd758a4c8cb19fe8531031f033f43
      OUT_DIR: /tmp/vc4-lowpc-clock-recovery

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            binutils-aarch64-linux-gnu \
            curl \
            ninja-build \
            pkg-config \
            python3 \
            python3-venv \
            libglib2.0-dev \
            libpixman-1-dev \
            zlib1g-dev

      - name: Validate probe sources
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/vc4/raspi3-stock-arm-payload.py \
            scripts/vc4/raspi3-stock-bootcode-probe.py \
            scripts/vc4/msync-smoke.py \
            scripts/vc4/stock_bootcode_progress.py
          python3 scripts/vc4/stock_bootcode_progress.py
          git diff --check

      - name: Build heterogeneous frontend
        run: |
          set -euo pipefail
          ./configure \
            --target-list=aarch64-softmmu \
            --disable-docs \
            --disable-werror \
            2>&1 | tee /tmp/vc4-clock-configure.log
          ninja -C build qemu-system-aarch64 \
            2>&1 | tee /tmp/vc4-clock-build.log

      - name: Retain multicore-sync regression coverage
        run: |
          set -euo pipefail
          python3 scripts/vc4/msync-smoke.py \
            --qemu build/qemu-system-aarch64 \
            2>&1 | tee /tmp/vc4-clock-msync.log

      - name: Download pinned official firmware
        run: |
          set -euo pipefail
          for file in bootcode.bin start.elf fixup.dat; do
            curl --fail --location --retry 4 \
              --output "/tmp/${file}" \
              "https://raw.githubusercontent.com/raspberrypi/firmware/${RPI_FIRMWARE_COMMIT}/boot/${file}"
          done
          test "$(git hash-object /tmp/bootcode.bin)" = \
            7642d2d89e4235e7d68875ff70688bdde6e71b5a
          test "$(git hash-object /tmp/start.elf)" = \
            0cefcf3a756740760f9903f35cc3843117853712
          test "$(git hash-object /tmp/fixup.dat)" = \
            1845e38de9d4f9a6d9ad7f5273bfe58b2582a7e6

      - name: Build AArch64 handoff witness
        run: |
          set -euo pipefail
          cat >/tmp/vc4-arm-payload.S <<'EOF'
          .section .text
          .global _start
          .type _start, %function
          _start:
              mov x4, x0
              mov x5, sp
              mrs x6, mpidr_el1
              ldr x0, =0x0000000000001000
              ldr x1, =0x5643345f41524d21
              str x1, [x0]
              str x4, [x0, #8]
              str x5, [x0, #16]
              str x6, [x0, #24]
              dsb sy
          1:
              wfe
              b 1b
              .ltorg
          .size _start, . - _start
          EOF
          aarch64-linux-gnu-as \
            -o /tmp/vc4-arm-payload.o /tmp/vc4-arm-payload.S
          aarch64-linux-gnu-ld \
            -nostdlib --entry=_start -Ttext=0x80000 \
            -o /tmp/vc4-arm-payload.elf /tmp/vc4-arm-payload.o
          aarch64-linux-gnu-objcopy \
            -O binary /tmp/vc4-arm-payload.elf /tmp/kernel8.img
          aarch64-linux-gnu-objdump -d /tmp/vc4-arm-payload.elf \
            >/tmp/vc4-arm-payload.dis
          test -s /tmp/kernel8.img

      - name: Run clock-synchronized stock-firmware probe
        id: probe
        run: |
          set -euo pipefail
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"
          cp /tmp/kernel8.img "$OUT_DIR/kernel8.img"
          cp /tmp/vc4-arm-payload.dis "$OUT_DIR/payload.dis"
          set +e
          python3 scripts/vc4/raspi3-stock-arm-payload.py \
            build/qemu-system-aarch64 \
            /tmp/bootcode.bin \
            /tmp/start.elf \
            /tmp/fixup.dat \
            /tmp/kernel8.img \
            --seconds 90 \
            --out-dir "$OUT_DIR" \
            2>&1 | tee "$OUT_DIR/probe.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "return_code=$rc" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$rc" >"$OUT_DIR/probe.status"

      - name: Verify virtual-clock recovery
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path("/tmp/vc4-lowpc-clock-recovery/result.json").read_text()
          )
          if result.get("probe_error"):
              raise SystemExit(result["probe_error"])
          steps = int(result.get("qtest_clock_steps", 0))
          stepped_ns = int(result.get("qtest_clock_step_ns", 0))
          timer_delta = int(result.get("system_timer_delta_us", 0))
          if steps <= 0 or stepped_ns < 100_000_000:
              raise SystemExit(
                  f"qtest clock did not advance: steps={steps} ns={stepped_ns}"
              )
          if timer_delta < 100_000:
              raise SystemExit(
                  f"BCM2835 system timer remained starved: {timer_delta} us"
              )
          print(json.dumps({
              "clock_steps": steps,
              "clock_step_ns": stepped_ns,
              "system_timer_delta_us": timer_delta,
              "signature_seen": result.get("signature_seen"),
          }, indent=2))
          PY

      - name: Record the recovered frontier
        env:
          PROBE_RETURN_CODE: ${{ steps.probe.outputs.return_code }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import os
          import re

          result = json.loads(
              Path("/tmp/vc4-lowpc-clock-recovery/result.json").read_text()
          )
          vpu = None
          for cpu in result.get("cpu_snapshot", {}).get("cpus", []):
              if "vc4" in str(cpu.get("qom_type", "")).lower():
                  vpu = cpu
                  break
          registers = str((vpu or {}).get("registers", ""))
          match = re.search(
              r"(?:^|\s)pc\s*=\s*([0-9a-f]+)", registers, re.IGNORECASE
          )
          vpu_pc = f"0x{match.group(1)}" if match else None
          diagnostic_lines = [
              line for line in result.get("qemu_diagnostics_tail", [])
              if any(token in line.lower() for token in (
                  "unimplemented", "illegal instruction", "guest error"
              ))
          ]
          status = {
              "schema_version": 1,
              "source_sha": os.environ["GITHUB_SHA"],
              "ref_name": os.environ["GITHUB_REF_NAME"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "run_url": (
                  f"{os.environ['GITHUB_SERVER_URL']}/"
                  f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
                  f"{os.environ['GITHUB_RUN_ID']}"
              ),
              "probe_return_code": os.environ.get(
                  "PROBE_RETURN_CODE", ""
              ),
              "virtual_clock_recovered": (
                  int(result.get("system_timer_delta_us", 0)) >= 100_000
              ),
              "qtest_clock_steps": result.get("qtest_clock_steps"),
              "qtest_clock_step_ns": result.get("qtest_clock_step_ns"),
              "qtest_virtual_clock_ns": result.get("qtest_virtual_clock_ns"),
              "system_timer_clo_before": result.get(
                  "system_timer_clo_before"
              ),
              "system_timer_clo_after": result.get(
                  "system_timer_clo_after"
              ),
              "system_timer_delta_us": result.get(
                  "system_timer_delta_us"
              ),
              "arm_payload_signature_seen": result.get("signature_seen"),
              "observed_signature": result.get("observed_signature"),
              "kernel_word_after_boot": result.get(
                  "kernel_word_after_boot"
              ),
              "arm_control0": result.get("arm_control0"),
              "arm_control1": result.get("arm_control1"),
              "arm_status": result.get("arm_status"),
              "arm_id": result.get("arm_id"),
              "pm_proc": result.get("pm_proc"),
              "elapsed_seconds": result.get("elapsed_seconds"),
              "final_vpu_pc": vpu_pc,
              "final_vpu_registers": registers,
              "diagnostic_lines": diagnostic_lines,
          }
          Path("VC4_POST_MSYNC_CLOCK_STATUS.json").write_text(
              json.dumps(status, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          lines = [
              "# VC4 post-multicore-sync clock recovery",
              "",
              "The earlier `0x544` frontier was a BCM2835 system-timer",
              "delay loop starved by qtest's manual virtual-clock mode.",
              "The stock-firmware probe now advances `QEMU_CLOCK_VIRTUAL`",
              "from measured wall-time deltas while retaining physical-memory",
              "inspection through qtest.",
              "",
              f"- Virtual clock recovered: **{status['virtual_clock_recovered']}**",
              f"- System-timer advance: `{status['system_timer_delta_us']}` us",
              f"- ARM payload signature reached: **{status['arm_payload_signature_seen']}**",
              f"- Final VPU PC: `{status['final_vpu_pc']}`",
              f"- Probe return code: `{status['probe_return_code']}`",
              f"- Workflow run: `{status['run_id']}`",
          ]
          if diagnostic_lines:
              lines.extend([
                  "",
                  "## Relevant diagnostics",
                  "",
                  *[f"- `{line}`" for line in diagnostic_lines],
              ])
          Path("VC4_POST_MSYNC_CLOCK_STATUS.md").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          PY
          git diff --check

      - name: Upload full probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-lowpc-clock-recovery-${{ github.run_attempt }}
          path: |
            /tmp/vc4-lowpc-clock-recovery
            /tmp/vc4-clock-configure.log
            /tmp/vc4-clock-build.log
            /tmp/vc4-clock-msync.log
            VC4_POST_MSYNC_CLOCK_STATUS.json
            VC4_POST_MSYNC_CLOCK_STATUS.md
          if-no-files-found: warn
          retention-days: 14

      - name: Publish recovered probe and frontier
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          remote_head=$(git rev-parse "origin/$GITHUB_REF_NAME")
          if test "$remote_head" != "$GITHUB_SHA"; then
            echo "Branch moved from $GITHUB_SHA to $remote_head" >&2
            exit 1
          fi

          rm -f .github/workflows/vc4-lowpc-clock-recovery.yml
          git add -A
          git diff --cached --check
          git config user.name "VC4 Clock Recovery CI"
          git config user.email "vc4-clock-recovery-ci@users.noreply.github.com"

          if python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(
              Path("/tmp/vc4-lowpc-clock-recovery/result.json").read_text()
          )
          raise SystemExit(0 if result.get("signature_seen") else 1)
          PY
          then
            message="scripts/vc4: unfreeze stock firmware and reach ARM payload [skip ci]"
          else
            message="scripts/vc4: unfreeze stock firmware and record next frontier [skip ci]"
          fi
          git commit -m "$message"
          git push origin HEAD:"$GITHUB_REF_NAME"
