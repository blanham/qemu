name: VC4 SDHOST transfer lifecycle fix

on:
  push:
    branches:
      - agent/vc4-sdhost-transfer-fix
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-sdhost-transfer-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RPI_FIRMWARE_COMMIT: 3d301dd924bcd758a4c8cb19fe8531031f033f43

    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl ninja-build pkg-config python3 python3-venv \
            libglib2.0-dev libpixman-1-dev zlib1g-dev

      - name: Materialize SDHOST transfer lifecycle fixes
        run: |
          cat > /tmp/bcm2835-sdhost-test.c <<'EOF'
          /*
           * QTest testcase for BCM2835 SDHOST transfer lifecycle semantics
           *
           * SPDX-License-Identifier: GPL-2.0-or-later
           */

          #include "qemu/osdep.h"
          #include "qemu/bswap.h"
          #include "libqtest-single.h"

          #define GPIO_BASE       0x3f200000u
          #define GPFSEL4         (GPIO_BASE + 0x10)
          #define GPFSEL5         (GPIO_BASE + 0x14)

          #define SDHOST_BASE     0x3f202000u
          #define SDCMD           (SDHOST_BASE + 0x00)
          #define SDARG           (SDHOST_BASE + 0x04)
          #define SDCDIV          (SDHOST_BASE + 0x0c)
          #define SDRSP0          (SDHOST_BASE + 0x10)
          #define SDHSTS          (SDHOST_BASE + 0x20)
          #define SDVDD           (SDHOST_BASE + 0x30)
          #define SDEDM           (SDHOST_BASE + 0x34)
          #define SDHCFG          (SDHOST_BASE + 0x38)
          #define SDHBCT          (SDHOST_BASE + 0x3c)
          #define SDDATA          (SDHOST_BASE + 0x40)
          #define SDHBLC          (SDHOST_BASE + 0x50)

          #define SDCMD_NEW_FLAG      0x8000u
          #define SDCMD_FAIL_FLAG     0x4000u
          #define SDCMD_BUSYWAIT      0x0800u
          #define SDCMD_NO_RESPONSE   0x0400u
          #define SDCMD_LONG_RESPONSE 0x0200u
          #define SDCMD_READ_CMD      0x0040u

          #define SDHSTS_DATA_FLAG    0x0001u
          #define SDEDM_FSM_MASK      0x000fu
          #define SDEDM_FSM_DATAMODE  0x0001u

          #define TEST_IMAGE_SIZE (64 * 1024 * 1024)
          #define TEST_SECTORS 4
          #define WORDS_PER_SECTOR (512 / sizeof(uint32_t))

          static uint32_t expected_word(unsigned sector, unsigned word)
          {
              return 0xa5000000u | (sector << 16) | word;
          }

          static char *create_test_image(void)
          {
              g_autoptr(GError) error = NULL;
              uint8_t data[TEST_SECTORS * 512];
              char *path = NULL;
              int fd;
              unsigned sector;
              unsigned word;

              fd = g_file_open_tmp("bcm2835-sdhost-XXXXXX", &path, &error);
              g_assert_no_error(error);
              g_assert_cmpint(fd, >=, 0);
              g_assert_cmpint(ftruncate(fd, TEST_IMAGE_SIZE), ==, 0);

              for (sector = 0; sector < TEST_SECTORS; sector++) {
                  for (word = 0; word < WORDS_PER_SECTOR; word++) {
                      stl_le_p(data + sector * 512 + word * sizeof(uint32_t),
                               expected_word(sector, word));
                  }
              }
              g_assert_cmpint(pwrite(fd, data, sizeof(data), 0),
                              ==, sizeof(data));
              close(fd);
              return path;
          }

          static void sdhost_command(uint32_t argument, uint32_t command)
          {
              uint32_t result;

              writel(SDARG, argument);
              writel(SDCMD, SDCMD_NEW_FLAG | command);
              result = readl(SDCMD);
              g_assert_cmphex(result & SDCMD_NEW_FLAG, ==, 0);
              g_assert_cmphex(result & SDCMD_FAIL_FLAG, ==, 0);
          }

          static uint32_t initialize_card(void)
          {
              uint32_t rca;

              writel(GPFSEL4, 0x24000000);
              writel(GPFSEL5, 0x00000924);

              writel(SDCDIV, 0x148);
              writel(SDHCFG, 0x0a);
              writel(SDVDD, 1);

              sdhost_command(0, SDCMD_NO_RESPONSE | 0);
              sdhost_command(0x155, 8);
              sdhost_command(0, 55);
              sdhost_command(0x40200000, 41);
              sdhost_command(0, SDCMD_LONG_RESPONSE | 2);
              sdhost_command(0, 3);
              rca = readl(SDRSP0) & 0xffff0000u;
              g_assert_cmphex(rca, !=, 0);
              sdhost_command(rca, SDCMD_LONG_RESPONSE | 9);
              sdhost_command(rca, SDCMD_BUSYWAIT | 7);
              sdhost_command(rca, 55);
              sdhost_command(0, 42);
              sdhost_command(512, 16);
              sdhost_command(rca, 55);
              sdhost_command(2, 6);
              return rca;
          }

          static void read_and_check_sector(unsigned sector)
          {
              unsigned word;

              g_assert_cmphex(readl(SDHSTS) & SDHSTS_DATA_FLAG,
                              ==, SDHSTS_DATA_FLAG);
              for (word = 0; word < WORDS_PER_SECTOR; word++) {
                  g_assert_cmphex(readl(SDDATA), ==,
                                  expected_word(sector, word));
              }
          }

          static void stop_transfer(void)
          {
              sdhost_command(0, SDCMD_BUSYWAIT | 12);
              g_assert_cmphex(readl(SDHSTS) & SDHSTS_DATA_FLAG, ==, 0);
              g_assert_cmphex(readl(SDEDM) & SDEDM_FSM_MASK,
                              ==, SDEDM_FSM_DATAMODE);
              g_assert_cmphex(readl(SDDATA), ==, 0);
          }

          static void test_transfer_lifecycle(void)
          {
              g_autofree char *path = create_test_image();
              g_autofree char *quoted = g_shell_quote(path);
              g_autofree char *args = g_strdup_printf(
                  "-M raspi3b -drive file=%s,format=raw,if=sd", quoted);

              qtest_start(args);
              initialize_card();

              /*
               * Stock bootcode inherits the reset HBCT/HBLC values from the
               * boot ROM.  Zero in the 9-bit block counter denotes 512 blocks.
               */
              g_assert_cmphex(readl(SDHBCT), ==, 0x400);
              g_assert_cmphex(readl(SDHBLC), ==, 0);

              sdhost_command(0, SDCMD_READ_CMD | 18);
              read_and_check_sector(0);
              stop_transfer();

              /* A new data command must reload the internal transfer count. */
              sdhost_command(512, SDCMD_READ_CMD | 18);
              read_and_check_sector(1);
              stop_transfer();

              /* A finite one-block transfer clears DATA_FLAG when drained. */
              writel(SDHBCT, 512);
              writel(SDHBLC, 1);
              sdhost_command(1024, SDCMD_READ_CMD | 18);
              read_and_check_sector(2);
              g_assert_cmphex(readl(SDHSTS) & SDHSTS_DATA_FLAG, ==, 0);
              g_assert_cmphex(readl(SDEDM) & SDEDM_FSM_MASK,
                              ==, SDEDM_FSM_DATAMODE);
              stop_transfer();

              qtest_end();
              g_assert_cmpint(unlink(path), ==, 0);
          }

          int main(int argc, char **argv)
          {
              g_test_init(&argc, &argv, NULL);
              g_test_add_func("/bcm2835/sdhost/transfer-lifecycle",
                              test_transfer_lifecycle);
              return g_test_run();
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          path = Path('hw/sd/bcm2835_sdhost.c')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '#define SDHBCT_RESET                    0x00000400\n',
              '#define SDHBCT_RESET                    0x00000400\n'
              '#define SDHBLC_MASK                     0x0000ffff\n'
              '#define SDHBLC_ZERO_BLOCK_COUNT         512\n',
              'SDHOST transfer constants')

          helpers = r'''
          static uint32_t bcm2835_sdhost_block_count(BCM2835SDHostState *s)
          {
              /* The hardware counter is nine bits wide; zero encodes 512. */
              return s->hblc ? s->hblc : SDHBLC_ZERO_BLOCK_COUNT;
          }

          static void bcm2835_sdhost_update_data_flag(BCM2835SDHostState *s)
          {
              bool ready = false;

              if (s->cmd & SDCMD_READ_CMD) {
                  ready = s->fifo_len != 0;
              } else if (s->cmd & SDCMD_WRITE_CMD) {
                  ready = s->datacnt != 0 &&
                          s->fifo_len < BCM2835_SDHOST_FIFO_LEN;
              }

              if (ready) {
                  s->status |= SDHSTS_DATA_FLAG;
                  if (s->config & SDHCFG_DATA_IRPT_EN) {
                      s->status |= SDHSTS_SDIO_IRPT;
                  }
              } else {
                  s->status &= ~SDHSTS_DATA_FLAG;
              }
          }

          static void bcm2835_sdhost_stop_transfer(BCM2835SDHostState *s)
          {
              s->datacnt = 0;
              s->fifo_pos = 0;
              s->fifo_len = 0;
              memset(s->fifo, 0, sizeof(s->fifo));
              s->status &= ~(SDHSTS_DATA_FLAG | SDHSTS_BLOCK_IRPT |
                             SDHSTS_SDIO_IRPT);
              s->edm &= ~(SDEDM_FSM_MASK | (0x1f << 4));
              s->edm |= SDEDM_FSM_DATAMODE;
              trace_bcm2835_sdhost_edm_change("stop command", s->edm);
              bcm2835_sdhost_update_irq(s);
          }

          static void bcm2835_sdhost_start_transfer(BCM2835SDHostState *s)
          {
              uint64_t bytes;

              if (!(s->cmd & (SDCMD_READ_CMD | SDCMD_WRITE_CMD))) {
                  return;
              }

              bytes = (uint64_t)bcm2835_sdhost_block_count(s) * s->hbct;
              s->datacnt = MIN(bytes, (uint64_t)UINT32_MAX);
              s->fifo_pos = 0;
              s->fifo_len = 0;
              memset(s->fifo, 0, sizeof(s->fifo));
              s->status &= ~(SDHSTS_DATA_FLAG | SDHSTS_BLOCK_IRPT |
                             SDHSTS_SDIO_IRPT);
              s->edm &= ~(SDEDM_FSM_MASK | (0x1f << 4));
              s->edm |= (s->cmd & SDCMD_READ_CMD) ?
                        SDEDM_FSM_READDATA : SDEDM_FSM_WRITEDATA;
              trace_bcm2835_sdhost_edm_change("data command", s->edm);
          }

          '''
          replace_once(
              'static void bcm2835_sdhost_send_command(BCM2835SDHostState *s)\n',
              helpers +
              'static void bcm2835_sdhost_send_command(BCM2835SDHostState *s)\n',
              'SDHOST lifecycle helpers')

          replace_once(
              '    /* We never really delay commands, so if this was a '
              "'busywait' command\n",
              '    if (request.cmd == 12) {\n'
              '        bcm2835_sdhost_stop_transfer(s);\n'
              '    } else {\n'
              '        bcm2835_sdhost_start_transfer(s);\n'
              '    }\n'
              '    /* We never really delay commands, so if this was a '
              "'busywait' command\n",
              'SDHOST command lifecycle')

          text = text.replace(
              '                    s->status |= SDHSTS_DATA_FLAG;\n'
              '                    if (s->config & SDHCFG_DATA_IRPT_EN) {\n'
              '                        s->status |= SDHSTS_SDIO_IRPT;\n'
              '                    }\n',
              '')
          text = text.replace(
              '                s->status |= SDHSTS_DATA_FLAG;\n'
              '                if (s->config & SDHCFG_DATA_IRPT_EN) {\n'
              '                    s->status |= SDHSTS_SDIO_IRPT;\n'
              '                }\n',
              '')
          text = text.replace(
              '                    s->status |= SDHSTS_DATA_FLAG;\n'
              '                    if (s->config & SDHCFG_DATA_IRPT_EN) {\n'
              '                        s->status |= SDHSTS_SDIO_IRPT;\n'
              '                    }\n',
              '')
          text = text.replace(
              '            /* set data interrupt after each transfer */\n'
              '            s->status |= SDHSTS_DATA_FLAG;\n'
              '            if (s->config & SDHCFG_DATA_IRPT_EN) {\n'
              '                s->status |= SDHSTS_SDIO_IRPT;\n'
              '            }\n',
              '')

          replace_once(
              '    bcm2835_sdhost_update_irq(s);\n\n'
              '    s->edm &= ~(0x1f << 4);\n',
              '    bcm2835_sdhost_update_data_flag(s);\n'
              '    bcm2835_sdhost_update_irq(s);\n\n'
              '    s->edm &= ~(0x1f << 4);\n',
              'SDHOST DATA_FLAG recomputation')

          replace_once(
              '    case SDHBLC:\n'
              '        s->hblc = value;\n'
              '        s->datacnt = s->hblc * s->hbct;\n'
              '        bcm2835_sdhost_fifo_run(s);\n'
              '        break;\n',
              '    case SDHBLC:\n'
              '        s->hblc = value & SDHBLC_MASK;\n'
              '        break;\n',
              'SDHOST block-count write')

          path.write_text(text)
          PY

          cp /tmp/bcm2835-sdhost-test.c tests/qtest/bcm2835-sdhost-test.c

          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/qtest/meson.build')
          text = path.read_text()
          old = (
              "  (config_all_devices.has_key('CONFIG_RASPI') ? "
              "['bcm2835-dbus-test', 'bcm2835-dma-test', "
              "'bcm2835-i2c-test'] : []) +  \\\n"
          )
          new = (
              "  (config_all_devices.has_key('CONFIG_RASPI') ? "
              "['bcm2835-dbus-test', 'bcm2835-dma-test', "
              "'bcm2835-i2c-test', 'bcm2835-sdhost-test'] : []) +  \\\n"
          )
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit('SDHOST qtest registration anchor missing')
              path.write_text(text.replace(old, new, 1))
          PY

          git diff --check
          git status --short

      - name: Add temporary official-firmware storage tracing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/vc4/raspi3-stock-bootcode-mmio.py')
          text = path.read_text()
          old = '    "usb_port_reset",\n)\n'
          events = '''    "usb_port_reset",
              "bcm2835_sdhost_read",
              "bcm2835_sdhost_write",
              "bcm2835_sdhost_edm_change",
              "sdbus_command",
              "sdcard_normal_command",
              "sdcard_app_command",
              "sdcard_response",
              "sdcard_req_addr",
              "sdcard_read_block",
          )
          '''
          if '    "sdcard_read_block",\n)\n' not in text:
              if text.count(old) != 1:
                  raise SystemExit('stock trace event anchor missing')
              path.write_text(text.replace(old, events, 1))
          PY
          python3 -m py_compile scripts/vc4/raspi3-stock-bootcode-mmio.py

      - name: Download pinned official firmware trio
        run: |
          for file in bootcode.bin start.elf fixup.dat; do
            curl --fail --location --retry 4 \
              --output "/tmp/${file}" \
              "https://raw.githubusercontent.com/raspberrypi/firmware/${RPI_FIRMWARE_COMMIT}/boot/${file}"
          done
          test "$(git hash-object /tmp/bootcode.bin)" = \
            7642d2d89e4235e7d68875ff70688bdde6e71b5a
          test "$(git hash-object /tmp/start.elf)" = \
            0cefcf3a756740760f9903f35cc3843117853712
          test "$(git hash-object /tmp/fixup.dat)" = \
            1845e38de9d4f9a6d9ad7f5273bfe58b2582a7e6

      - name: Check stock-firmware probes
        run: |
          python3 -m py_compile \
            scripts/vc4/raspi3-stock-bootcode-probe.py \
            scripts/vc4/raspi3-stock-bootcode-state.py \
            scripts/vc4/raspi3-stock-bootcode-0200.py \
            scripts/vc4/raspi3-stock-bootcode-mmio.py \
            scripts/vc4/stock_bootcode_progress.py
          python3 scripts/vc4/stock_bootcode_progress.py

      - name: Configure and build emulator and SDHOST qtest
        run: |
          ./configure \
            --target-list=aarch64-softmmu \
            --disable-docs \
            --disable-werror
          ninja -C build \
            qemu-system-aarch64 \
            tests/qtest/bcm2835-sdhost-test

      - name: Exercise SDHOST transfer lifecycle through QTest
        run: |
          QTEST_QEMU_BINARY="$PWD/build/qemu-system-aarch64" \
            build/tests/qtest/bcm2835-sdhost-test

      - name: Run official firmware through the repaired storage path
        run: |
          set -o pipefail
          out=/tmp/vc4-sdhost-transfer-fix
          rm -rf "$out"
          mkdir -p "$out"

          python3 scripts/vc4/raspi3-stock-bootcode-mmio.py \
            build/qemu-system-aarch64 \
            /tmp/bootcode.bin \
            --start-elf /tmp/start.elf \
            --fixup-dat /tmp/fixup.dat \
            --seconds 35 \
            --trace-samples 140 \
            --trace-interval 0.05 \
            --qemu-debug in_asm \
            --qemu-debug-filter 0x6800..0x6920 \
            --out-dir "$out" 2>&1 | tee "$out/probe.log"

          test -s "$out/qemu-mmio.log"
          test -s "$out/probe.log"

      - name: Assert the new official-firmware frontier
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path
          import re

          out = Path('/tmp/vc4-sdhost-transfer-fix')
          trace = (out / 'qemu-mmio.log').read_text(
              encoding='utf-8', errors='replace'
          ).splitlines()
          probe = (out / 'probe.log').read_text(
              encoding='utf-8', errors='replace'
          ).splitlines()

          if any(line.startswith('VC4_LOW_PC_WRITE ') for line in probe):
              raise SystemExit('unexpected low-memory PC write')

          barrier = next((
              line for line in reversed(probe)
              if line.startswith('STOCK_BOOTCODE_BARRIER ')
          ), None)
          if barrier is None:
              raise SystemExit('missing stock boot barrier record')
          match = re.search(r'\bpc=0x([0-9a-fA-F]+)', barrier)
          if not match:
              raise SystemExit(f'barrier has no PC: {barrier}')
          barrier_pc = int(match.group(1), 16)
          if barrier_pc < 0x6800 or barrier_pc in (0x7880, 0x7882):
              raise SystemExit(
                  f'official firmware did not cross the SDHOST frontier: '
                  f'pc=0x{barrier_pc:08x}'
              )

          progress = None
          for line in probe:
              if line.startswith('STOCK_BOOTCODE_PROGRESS '):
                  progress = json.loads(line.split(' ', 1)[1])
          if progress is None:
              raise SystemExit('missing stock progress record')
          returns = [
              item.get('return_pc')
              for item in progress.get('delay_generations', [])
          ]
          if any(returns[i:i + 8] == [0x596, 0x5a2] * 4
                 for i in range(max(0, len(returns) - 7))):
              raise SystemExit('official firmware still reports start*.elf missing')

          commands = [
              line for line in trace if line.startswith('sdbus_command')
          ]
          stops = [line for line in commands if ' CMD12 ' in line]
          reads = [
              line for line in trace if line.startswith('sdcard_read_block')
          ]
          if len(stops) < 20:
              raise SystemExit(f'too few completed CMD12 cycles: {len(stops)}')
          if len(reads) < 500:
              raise SystemExit(f'too few SD blocks reached start.elf: {len(reads)}')
          if not any('addr 0x311400 ' in line for line in reads):
              raise SystemExit('the first start.elf extent was not read')

          bad = [
              line for line in trace
              if ('bcm2835_sdhost_read: Bad offset' in line or
                  'bcm2835_sdhost_write: Bad offset' in line)
          ]
          if bad:
              raise SystemExit('unexpected SDHOST MMIO diagnostics: ' + bad[0])

          summary = {
              'schema_version': 1,
              'barrier_pc': f'0x{barrier_pc:08x}',
              'command_count': len(commands),
              'stop_command_count': len(stops),
              'read_block_count': len(reads),
              'barrier': barrier,
          }
          (out / 'summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Commit validated SDHOST fix
        run: |
          if test -n "$(git status --porcelain -- \
              hw/sd/bcm2835_sdhost.c \
              tests/qtest/bcm2835-sdhost-test.c \
              tests/qtest/meson.build)"; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add \
              hw/sd/bcm2835_sdhost.c \
              tests/qtest/bcm2835-sdhost-test.c \
              tests/qtest/meson.build
            git commit -m 'hw/sd: model BCM2835 SDHOST transfer lifecycle'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo 'SDHOST implementation already matches the validated model.'
          fi

      - name: Upload SDHOST validation frontier
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-sdhost-transfer-fix-${{ github.run_attempt }}
          path: /tmp/vc4-sdhost-transfer-fix
          if-no-files-found: warn
          retention-days: 14
