name: VC4 stock low-PC root-cause source map

on:
  push:
    branches:
      - agent/vc4-stock-arm-handoff-recovered
    paths:
      - .github/workflows/vc4-stock-lowpc-root-cause-map-v1.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-stock-lowpc-root-cause-map-v1
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BRANCH: agent/vc4-stock-arm-handoff-recovered
      RESULT_DIR: /tmp/vc4-stock-lowpc-root-cause

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Wait for measured execlog record
        run: |
          set -euo pipefail
          rm -rf "$RESULT_DIR"
          mkdir -p "$RESULT_DIR"
          matched=false
          for attempt in $(seq 1 75); do
            git fetch origin "$BRANCH"
            if git show \
              "origin/$BRANCH:VC4_STOCK_VPU_LOWPC_EXECLOG_STATUS.json" \
              > "$RESULT_DIR/execlog.json" 2>/dev/null; then
              measured_run=$(python3 - <<'PY'
          import json
          from pathlib import Path
          record = json.loads(Path('/tmp/vc4-stock-lowpc-root-cause/execlog.json').read_text())
          print(record.get('run_id') or '')
          PY
              )
              if test -n "$measured_run"; then
                printf '%s\n' "$measured_run" > "$RESULT_DIR/MEASURED_RUN_ID"
                matched=true
                break
              fi
            fi
            sleep 12
          done
          if test "$matched" != true; then
            echo "low-PC execlog record did not publish within bounded wait" >&2
            exit 1
          fi
          git checkout -B "$BRANCH" "origin/$BRANCH"
          git diff --check

      - name: Normalize bus aliases and rank source contracts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          import os
          import re
          import subprocess

          result_dir = Path('/tmp/vc4-stock-lowpc-root-cause')
          trace = json.loads((result_dir / 'execlog.json').read_text())
          counts = trace.get('candidate_peripheral_addresses') or {}
          excerpts = trace.get('access_excerpt') or []
          context = trace.get('low_pc_context') or []
          temporal = trace.get('temporal_control') or {}

          regions = [
              (0x003000, 0x004000, 'system-timer',
               ['hw/timer/bcm2835_systmr.c']),
              (0x007000, 0x008000, 'dma',
               ['hw/dma/bcm2835_dma.c']),
              (0x00b000, 0x00c000, 'arm-timer-interrupt-mailbox',
               ['hw/intc/bcm2835_ic.c', 'hw/timer/bcm2835_systmr.c',
                'hw/misc/bcm2835_mbox.c']),
              (0x100000, 0x101000, 'power-management',
               ['hw/misc/bcm2835_cprman.c', 'hw/misc/bcm2835_property.c']),
              (0x101000, 0x102000, 'clock-manager',
               ['hw/misc/bcm2835_cprman.c']),
              (0x200000, 0x201000, 'gpio',
               ['hw/gpio/bcm2835_gpio.c']),
              (0x201000, 0x202000, 'pl011-uart',
               ['hw/char/pl011.c']),
              (0x202000, 0x203000, 'uart-adjacent',
               ['hw/char/pl011.c', 'hw/arm/bcm2835_peripherals.c']),
              (0x203000, 0x204000, 'pcm',
               ['hw/arm/bcm2835_peripherals.c']),
              (0x204000, 0x205000, 'spi0',
               ['hw/ssi/bcm2835_spi.c']),
              (0x215000, 0x216000, 'aux',
               ['hw/char/bcm2835_aux.c']),
              (0x300000, 0x301000, 'emmc',
               ['hw/sd/sdhci.c', 'hw/arm/bcm2835_peripherals.c']),
              (0x980000, 0x990000, 'usb',
               ['hw/usb/hcd-dwc2.c']),
          ]

          def peripheral_offset(value):
              if 0x7e000000 <= value <= 0x7effffff:
                  return value - 0x7e000000, 'vpu-bus'
              if 0x3f000000 <= value <= 0x3fffffff:
                  return value - 0x3f000000, 'arm-physical'
              return None, None

          def classify_offset(offset):
              for start, end, name, paths in regions:
                  if start <= offset < end:
                      return name, paths, offset - start
              return 'unmapped-peripheral-window', [], offset

          access_text = '\n'.join(str(line) for line in excerpts)
          records = []
          for token, count in counts.items():
              try:
                  value = int(token, 16)
              except (TypeError, ValueError):
                  continue
              offset, alias = peripheral_offset(value)
              if offset is None:
                  continue
              region, paths, region_offset = classify_offset(offset)
              token_re = re.compile(re.escape(token), re.IGNORECASE)
              matching = [
                  str(line) for line in excerpts if token_re.search(str(line))
              ][:32]
              operation = 'unknown'
              lower = '\n'.join(matching).lower()
              if 'store' in lower or 'write' in lower:
                  operation = 'write-or-mixed'
              elif 'load' in lower or 'read' in lower:
                  operation = 'read'
              records.append({
                  'address': f'0x{value:08x}',
                  'alias': alias,
                  'peripheral_offset': f'0x{offset:06x}',
                  'region': region,
                  'region_offset': f'0x{region_offset:x}',
                  'count': int(count),
                  'operation': operation,
                  'candidate_source_paths': paths,
                  'matching_excerpt': matching,
              })

          records.sort(key=lambda item: (-item['count'], item['address']))
          region_counts = {}
          for item in records:
              region_counts[item['region']] = (
                  region_counts.get(item['region'], 0) + item['count']
              )

          source_hits = {}
          paths = sorted({
              path for item in records for path in item['candidate_source_paths']
          })
          for path in paths:
              candidate = Path(path)
              if candidate.is_file():
                  source_hits[path] = {
                      'sha256': subprocess.check_output(
                          ['sha256sum', path], text=True
                      ).split()[0],
                      'lines': len(candidate.read_text(
                          encoding='utf-8', errors='replace'
                      ).splitlines()),
                  }
              else:
                  source_hits[path] = {'missing': True}

          ranked_regions = sorted(
              region_counts.items(), key=lambda item: (-item[1], item[0])
          )
          top_region = ranked_regions[0][0] if ranked_regions else None
          timer_advanced = int(temporal.get('system_timer_delta_us') or 0) > 0
          arm_control_zero = all(
              temporal.get(key) in (None, '0x00000000')
              for key in ('arm_control0', 'arm_control1', 'arm_status')
          )

          if trace.get('classification') == 'stock-firmware-aarch64-handoff-clear':
              classification = 'stock-firmware-aarch64-handoff-clear'
              next_contract = None
          elif not records:
              classification = 'stock-lowpc-plugin-format-needs-decoder'
              next_contract = 'decode execlog memory operands before product changes'
          elif top_region == 'system-timer' and timer_advanced:
              classification = 'stock-lowpc-timer-traffic-with-advancing-clock'
              next_contract = (
                  'compare VPU timer alias/read width and wraparound semantics '
                  'against the sampled delay-loop operands'
              )
          elif top_region in ('arm-timer-interrupt-mailbox', 'power-management'):
              classification = 'stock-lowpc-arm-power-sequencing-traffic'
              next_contract = (
                  'verify read/write and interrupt side effects in the mapped '
                  'ARM/power device model without forcing control state'
              )
          elif top_region in ('gpio', 'pl011-uart', 'uart-adjacent'):
              classification = 'stock-lowpc-board-initialization-traffic'
              next_contract = (
                  'verify the mapped board-peripheral readiness/poll contract '
                  'before treating the loop as ARM handoff logic'
              )
          else:
              classification = 'stock-lowpc-peripheral-contract-ranked'
              next_contract = (
                  f'inspect the highest-frequency `{top_region}` access contract'
              )

          record = {
              'schema_version': 1,
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'source_sha': os.environ.get('GITHUB_SHA'),
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'measured_execlog_run_id': trace.get('run_id'),
              'input_classification': trace.get('classification'),
              'classification': classification,
              'normal_tcg': trace.get('normal_tcg'),
              'timer_advanced': timer_advanced,
              'arm_control_remained_zero': arm_control_zero,
              'ranked_regions': [
                  {'region': region, 'count': count}
                  for region, count in ranked_regions
              ],
              'normalized_accesses': records,
              'source_hits': source_hits,
              'next_contract': next_contract,
              'low_pc_context': context[:400],
              'prohibited_shortcuts': [
                  'PC-specific branch forcing',
                  'firmware or payload patching',
                  'synthetic interrupt injection',
                  'fabricated ARM-control writes',
                  'qtest clock stepping',
              ],
          }
          Path('VC4_STOCK_LOWPC_ROOT_CAUSE_MAP.json').write_text(
              json.dumps(record, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )

          region_lines = [
              f'- **{region}**: `{count}` observed accesses'
              for region, count in ranked_regions
          ] or ['- No peripheral operand was decoded.']
          Path('VC4_STOCK_LOWPC_ROOT_CAUSE_MAP.md').write_text(
              '\n'.join([
                  '# VC4 stock-firmware low-PC root-cause map',
                  '',
                  f'Classification: **`{classification}`**',
                  '',
                  f'- Normal TCG: `{trace.get("normal_tcg")}`',
                  f'- System timer advanced: `{timer_advanced}`',
                  f'- ARM control remained zero: `{arm_control_zero}`',
                  '',
                  '## Ranked peripheral regions',
                  '',
                  *region_lines,
                  '',
                  '## Next bounded contract',
                  '',
                  str(next_contract),
                  '',
                  'No product fix is authorized solely by frequency. The next '
                  'change must reproduce and test the exact read/write side effect '
                  'identified by this map.',
                  '',
              ]),
              encoding='utf-8',
          )
          print(json.dumps({
              'classification': classification,
              'ranked_regions': record['ranked_regions'],
              'next_contract': next_contract,
          }, indent=2, sort_keys=True))
          PY
          cp VC4_STOCK_LOWPC_ROOT_CAUSE_MAP.* "$RESULT_DIR/"
          git diff --check

      - name: Upload source-map evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-stock-lowpc-root-cause-${{ github.run_attempt }}
          path: |
            VC4_STOCK_LOWPC_ROOT_CAUSE_MAP.json
            VC4_STOCK_LOWPC_ROOT_CAUSE_MAP.md
            /tmp/vc4-stock-lowpc-root-cause
          if-no-files-found: warn
          retention-days: 14

      - name: Publish source map and retire one-shot workflow
        if: always()
        run: |
          set -euo pipefail
          test -f VC4_STOCK_LOWPC_ROOT_CAUSE_MAP.json
          test -f VC4_STOCK_LOWPC_ROOT_CAUSE_MAP.md
          git rm -- .github/workflows/vc4-stock-lowpc-root-cause-map-v1.yml
          git add -- \
            VC4_STOCK_LOWPC_ROOT_CAUSE_MAP.json \
            VC4_STOCK_LOWPC_ROOT_CAUSE_MAP.md
          git diff --cached --check
          git config user.name "VC4 Low-PC Classifier CI"
          git config user.email "vc4-lowpc-classifier-ci@users.noreply.github.com"
          git commit -m \
            "tests/vc4: rank stock low-PC peripheral contracts [skip ci]"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
