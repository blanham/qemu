name: VC4 direct ARM load and release boundary

on:
  push:
    branches:
      - agent/vc4-hetero-direct-linux
    paths:
      - .github/workflows/vc4-direct-arm-boundary.yml
      - scripts/vc4/direct-arm-boundary-probe.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-direct-arm-boundary
  cancel-in-progress: true

jobs:
  boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RPI_FIRMWARE_COMMIT: 3d301dd924bcd758a4c8cb19fe8531031f033f43
      OFFICIAL_DIR: /tmp/vc4-official
      OUT_DIR: /tmp/vc4-arm-boundary

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            binutils-aarch64-linux-gnu cpio curl file \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
            linux-libc-dev-arm64-cross ninja-build pkg-config \
            python3 python3-venv libglib2.0-dev libpixman-1-dev zlib1g-dev

      - name: Materialize, build, and preserve regressions
        run: |
          set -euo pipefail
          python3 scripts/vc4/hetero-direct-linux-integrate.py
          python3 scripts/vc4/hetero-direct-linux-integrate.py
          python3 -m py_compile \
            scripts/vc4/direct-arm-boundary-probe.py \
            scripts/vc4/preg-mutex-smoke.py \
            scripts/vc4/msync-smoke.py
          bash -n scripts/vc4/build-direct-arm-entry.sh
          bash -n scripts/vc4/build-linux-initramfs-v2.sh
          git diff --check
          ./configure \
            --target-list=aarch64-softmmu,vc4-softmmu \
            --disable-docs --disable-werror \
            2>&1 | tee /tmp/vc4-boundary-configure.log
          ninja -C build qemu-system-aarch64 qemu-system-vc4 \
            2>&1 | tee /tmp/vc4-boundary-build.log
          python3 scripts/vc4/preg-mutex-smoke.py \
            --qemu build/qemu-system-vc4 \
            2>&1 | tee /tmp/vc4-boundary-preg.log
          python3 scripts/vc4/msync-smoke.py \
            --qemu build/qemu-system-aarch64 \
            2>&1 | tee /tmp/vc4-boundary-msync.log

      - name: Download Linux and build witnesses
        id: image
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OFFICIAL_DIR" "$OUT_DIR"
          mkdir -p "$OFFICIAL_DIR" "$OUT_DIR"
          for file in kernel8.img bcm2710-rpi-3-b.dtb; do
            curl --fail --location --retry 5 \
              --output "$OFFICIAL_DIR/$file" \
              "https://raw.githubusercontent.com/raspberrypi/firmware/${RPI_FIRMWARE_COMMIT}/boot/$file"
          done
          test "$(git hash-object "$OFFICIAL_DIR/kernel8.img")" = \
            a694aa64988bbecadc770c874488165303eac673
          test "$(git hash-object "$OFFICIAL_DIR/bcm2710-rpi-3-b.dtb")" = \
            398c480adc49a5fcb03aa4c095ea74db5d1f893b
          bash scripts/vc4/build-direct-arm-entry.sh \
            "$PWD/build/vc4-direct-arm-entry"
          bash scripts/vc4/build-linux-initramfs-v2.sh \
            "$PWD/build/vc4-linux-initramfs-v2"
          python3 - <<'PY'
          from pathlib import Path
          import os
          import struct
          image = Path(os.environ['OFFICIAL_DIR'], 'kernel8.img').read_bytes()[:64]
          if image[56:60] != b'ARM\x64':
              raise SystemExit('invalid ARM64 Image header')
          offset = struct.unpack_from('<Q', image, 8)[0] or 0x80000
          entry = 0x200000 + offset
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'entry=0x{entry:x}\n')
          PY

      - name: Build exception-level normalizer
        env:
          LINUX_ENTRY: ${{ steps.image.outputs.entry }}
        run: |
          set -euo pipefail
          mkdir -p build/vc4-linux-normalizer
          aarch64-linux-gnu-gcc \
            -c -x assembler-with-cpp \
            -DLINUX_ENTRY="$LINUX_ENTRY" \
            tests/vc4/linux-entry-normalizer.S \
            -o build/vc4-linux-normalizer/normalizer.o
          aarch64-linux-gnu-ld \
            -nostdlib --entry=_start -Ttext=0x80000 \
            -o build/vc4-linux-normalizer/normalizer.elf \
            build/vc4-linux-normalizer/normalizer.o
          aarch64-linux-gnu-objcopy \
            -O binary \
            build/vc4-linux-normalizer/normalizer.elf \
            build/vc4-linux-normalizer/normalizer.bin

      - name: Verify direct witness bytes, CPU release, serial, and RAM
        id: witness
        shell: bash
        run: |
          set -uo pipefail
          python3 scripts/vc4/direct-arm-boundary-probe.py \
            build/qemu-system-aarch64 \
            build/vc4-direct-arm-entry/direct-arm-entry.bin \
            --serial-marker VC4_ARM_DIRECT_ENTRY \
            --memory-marker 0x1000=0x5643345f44495245 \
            --seconds 12 \
            --out-dir "$OUT_DIR/direct-entry" \
            2>&1 | tee "$OUT_DIR/direct-entry.log"
          rc=${PIPESTATUS[0]}
          echo "return_code=$rc" >>"$GITHUB_OUTPUT"
          exit 0

      - name: Verify secondary Image load and normalized jump
        id: normalizer
        shell: bash
        env:
          LINUX_ENTRY: ${{ steps.image.outputs.entry }}
        run: |
          set -uo pipefail
          append='console=ttyAMA0,115200 earlycon=pl011,mmio32,0x3f201000 rdinit=/init init=/init root=/dev/ram0 rw loglevel=8 ignore_loglevel panic=-1'
          python3 scripts/vc4/direct-arm-boundary-probe.py \
            build/qemu-system-aarch64 \
            build/vc4-linux-normalizer/normalizer.bin \
            --load "$OFFICIAL_DIR/kernel8.img@$LINUX_ENTRY" \
            --dtb "$OFFICIAL_DIR/bcm2710-rpi-3-b.dtb" \
            --initrd build/vc4-linux-initramfs-v2/initramfs.cpio \
            --append "$append" \
            --serial-marker VC4_ARM_NORMALIZER_JUMP \
            --memory-marker 0x1040=0x5643345f4e4f524d \
            --seconds 15 \
            --out-dir "$OUT_DIR/normalizer" \
            2>&1 | tee "$OUT_DIR/normalizer.log"
          rc=${PIPESTATUS[0]}
          echo "return_code=$rc" >>"$GITHUB_OUTPUT"
          exit 0

      - name: Classify loader and release boundaries
        if: always()
        shell: bash
        env:
          WITNESS_RC: ${{ steps.witness.outputs.return_code }}
          NORMALIZER_RC: ${{ steps.normalizer.outputs.return_code }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          import os

          out = Path(os.environ['OUT_DIR'])
          def load(name):
              path = out / name / 'result.json'
              return json.loads(path.read_text()) if path.is_file() else {}
          witness = load('direct-entry')
          normalizer = load('normalizer')
          witness_load = bool(witness.get('load_checks')) and all(
              item.get('matched') for item in witness['load_checks']
          )
          witness_memory = bool(witness.get('memory_marker_checks')) and all(
              item.get('matched') for item in witness['memory_marker_checks']
          )
          normalizer_load = bool(normalizer.get('load_checks')) and all(
              item.get('matched') for item in normalizer['load_checks']
          )
          normalizer_memory = bool(normalizer.get('memory_marker_checks')) and all(
              item.get('matched') for item in normalizer['memory_marker_checks']
          )
          if not witness_load:
              classification = 'direct-arm-primary-image-load-blocked'
          elif not witness.get('serial_marker_seen') and not witness_memory:
              classification = 'direct-arm-cpu-release-blocked'
          elif witness_memory and not witness.get('serial_marker_seen'):
              classification = 'direct-arm-pl011-output-blocked'
          elif not normalizer_load:
              classification = 'direct-arm-secondary-image-load-blocked'
          elif not normalizer.get('serial_marker_seen') and not normalizer_memory:
              classification = 'direct-arm-normalizer-execution-blocked'
          elif normalizer_memory and not normalizer.get('serial_marker_seen'):
              classification = 'direct-arm-normalizer-pl011-blocked'
          else:
              classification = 'direct-arm-load-release-and-normalized-jump'
          status = {
              'schema_version': 1,
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'source_sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'classification': classification,
              'witness_return_code': os.environ.get('WITNESS_RC', ''),
              'normalizer_return_code': os.environ.get('NORMALIZER_RC', ''),
              'witness': witness,
              'normalizer': normalizer,
          }
          Path('VC4_DIRECT_ARM_BOUNDARY_STATUS.json').write_text(
              json.dumps(status, indent=2, sort_keys=True) + '\n'
          )
          Path('VC4_DIRECT_ARM_BOUNDARY_STATUS.md').write_text(
              '# VC4 direct ARM load/release boundary\n\n'
              f'Classification: **`{classification}`**\n\n'
              f'Primary bytes matched: `{witness_load}`\n\n'
              f'Direct serial marker: '
              f'`{bool(witness.get("serial_marker_seen"))}`\n\n'
              f'Direct RAM marker: `{witness_memory}`\n\n'
              f'Secondary Image bytes matched: `{normalizer_load}`\n\n'
              f'Normalizer serial marker: '
              f'`{bool(normalizer.get("serial_marker_seen"))}`\n\n'
              f'Normalizer RAM marker: `{normalizer_memory}`\n'
          )
          print(json.dumps({
              'classification': classification,
              'primary_load': witness_load,
              'direct_serial': witness.get('serial_marker_seen'),
              'direct_memory': witness_memory,
              'secondary_load': normalizer_load,
              'normalizer_serial': normalizer.get('serial_marker_seen'),
              'normalizer_memory': normalizer_memory,
          }, indent=2))
          PY

      - name: Upload complete boundary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-direct-arm-boundary-${{ github.run_attempt }}
          path: |
            VC4_DIRECT_ARM_BOUNDARY_STATUS.json
            VC4_DIRECT_ARM_BOUNDARY_STATUS.md
            /tmp/vc4-arm-boundary
            /tmp/vc4-boundary-configure.log
            /tmp/vc4-boundary-build.log
            /tmp/vc4-boundary-preg.log
            /tmp/vc4-boundary-msync.log
            build/vc4-direct-arm-entry/SHA256SUMS
            build/vc4-linux-initramfs-v2/SHA256SUMS
          if-no-files-found: warn
          retention-days: 14

      - name: Publish boundary classification
        if: always()
        run: |
          set -euo pipefail
          cp VC4_DIRECT_ARM_BOUNDARY_STATUS.json /tmp/boundary-status.json
          cp VC4_DIRECT_ARM_BOUNDARY_STATUS.md /tmp/boundary-status.md
          git reset --hard "$GITHUB_SHA"
          cp /tmp/boundary-status.json VC4_DIRECT_ARM_BOUNDARY_STATUS.json
          cp /tmp/boundary-status.md VC4_DIRECT_ARM_BOUNDARY_STATUS.md
          git rm .github/workflows/vc4-direct-arm-boundary.yml
          git add \
            VC4_DIRECT_ARM_BOUNDARY_STATUS.json \
            VC4_DIRECT_ARM_BOUNDARY_STATUS.md
          git diff --cached --check
          git config user.name 'VC4 CI'
          git config user.email 'vc4-ci@users.noreply.github.com'
          classification=$(python3 -c \
            'import json; print(json.load(open("VC4_DIRECT_ARM_BOUNDARY_STATUS.json"))["classification"])')
          git commit -m "ci/vc4: record ${classification} [skip ci]"
          git pull --rebase origin agent/vc4-hetero-direct-linux
          git push origin HEAD:agent/vc4-hetero-direct-linux
