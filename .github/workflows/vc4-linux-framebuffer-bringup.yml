name: VC4 Linux and framebuffer bring-up

on:
  push:
    branches:
      - agent/vc4-linux-framebuffer-bringup
    paths:
      - .github/workflows/vc4-linux-framebuffer-bringup.yml
      - scripts/vc4/build-initramfs.py
      - scripts/vc4/build-linux-initramfs.sh
      - scripts/vc4/build-stock-framebuffer.sh
      - scripts/vc4/raspi3-stock-arm-payload.py
      - scripts/vc4/raspi3-stock-bootcode-probe.py
      - scripts/vc4/raspi3-stock-framebuffer.py
      - scripts/vc4/raspi3-stock-linux.py
      - scripts/vc4/msync-smoke.py
      - scripts/vc4/preg-mutex-smoke.py
      - tests/vc4/linux-init.c
      - tests/vc4/stock-framebuffer-start.S
      - tests/vc4/stock-framebuffer.c
      - tests/vc4/stock-framebuffer.ld
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-linux-framebuffer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bring-up:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RPI_FIRMWARE_COMMIT: 3d301dd924bcd758a4c8cb19fe8531031f033f43
      FIRMWARE_DIR: /tmp/rpi-firmware
      HANDOFF_DIR: /tmp/vc4-handoff
      FRAMEBUFFER_DIR: /tmp/vc4-framebuffer
      LINUX_DIR: /tmp/vc4-linux
      PAYLOAD_DIR: /tmp/vc4-framebuffer-payload
      INITRAMFS_DIR: /tmp/vc4-linux-initramfs

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install build and probe dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils-aarch64-linux-gnu \
            curl \
            gcc-aarch64-linux-gnu \
            ninja-build \
            pkg-config \
            python3 \
            python3-venv \
            libglib2.0-dev \
            libpixman-1-dev \
            zlib1g-dev

      - name: Normalize the Linux console ordering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/vc4/raspi3-stock-linux.py')
          text = path.read_text()
          old = 'b"console=ttyAMA0,115200 console=tty1 "'
          new = 'b"console=tty1 console=ttyAMA0,115200 "'
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit('ambiguous Linux console command line')
              text = text.replace(old, new)
              path.write_text(text)
          elif new not in text:
              raise SystemExit('Linux console command line not found')
          PY

      - name: Validate all source-level harnesses
        run: |
          python3 -m py_compile \
            scripts/vc4/build-initramfs.py \
            scripts/vc4/raspi3-stock-arm-payload.py \
            scripts/vc4/raspi3-stock-bootcode-probe.py \
            scripts/vc4/raspi3-stock-framebuffer.py \
            scripts/vc4/raspi3-stock-linux.py \
            scripts/vc4/msync-smoke.py \
            scripts/vc4/preg-mutex-smoke.py
          bash -n \
            scripts/vc4/build-linux-initramfs.sh \
            scripts/vc4/build-stock-framebuffer.sh
          git diff --check

      - name: Build the framebuffer and Linux test payloads
        run: |
          bash scripts/vc4/build-stock-framebuffer.sh "$PAYLOAD_DIR"
          bash scripts/vc4/build-linux-initramfs.sh "$INITRAMFS_DIR"
          test -s "$PAYLOAD_DIR/kernel8.img"
          test -s "$INITRAMFS_DIR/initramfs.cpio.gz"
          gzip -t "$INITRAMFS_DIR/initramfs.cpio.gz"

      - name: Configure and build both QEMU frontends
        run: |
          ./configure \
            --target-list=aarch64-softmmu,vc4-softmmu \
            --disable-docs \
            --disable-werror
          ninja -C build qemu-system-aarch64 qemu-system-vc4

      - name: Run focused VC4 architectural regressions
        run: |
          python3 scripts/vc4/preg-mutex-smoke.py \
            --qemu build/qemu-system-vc4
          python3 scripts/vc4/msync-smoke.py \
            --qemu build/qemu-system-aarch64

      - name: Download one pinned firmware, kernel, and DTB set
        run: |
          mkdir -p "$FIRMWARE_DIR"
          for file in \
            bootcode.bin \
            start.elf \
            fixup.dat \
            kernel8.img \
            bcm2710-rpi-3-b.dtb; do
            curl --fail --location --retry 4 \
              --output "$FIRMWARE_DIR/$file" \
              "https://raw.githubusercontent.com/raspberrypi/firmware/${RPI_FIRMWARE_COMMIT}/boot/$file"
          done
          test "$(git hash-object "$FIRMWARE_DIR/bootcode.bin")" = \
            7642d2d89e4235e7d68875ff70688bdde6e71b5a
          test "$(git hash-object "$FIRMWARE_DIR/start.elf")" = \
            0cefcf3a756740760f9903f35cc3843117853712
          test "$(git hash-object "$FIRMWARE_DIR/fixup.dat")" = \
            1845e38de9d4f9a6d9ad7f5273bfe58b2582a7e6
          test "$(git hash-object "$FIRMWARE_DIR/kernel8.img")" = \
            a694aa64988bbecadc770c874488165303eac673
          test "$(git hash-object "$FIRMWARE_DIR/bcm2710-rpi-3-b.dtb")" = \
            398c480adc49a5fcb03aa4c095ea74db5d1f893b

      - name: Build the minimal ARM handoff witness
        run: |
          cat >/tmp/vc4-arm-payload.S <<'EOF'
          .section .text
          .global _start
          .type _start, %function
          _start:
              mov x4, x0
              mov x5, sp
              mrs x6, mpidr_el1
              ldr x0, =0x0000000000001000
              ldr x1, =0x5643345f41524d21
              str x1, [x0]
              str x4, [x0, #8]
              str x5, [x0, #16]
              str x6, [x0, #24]
              dsb sy
          1:
              wfe
              b 1b
              .ltorg
          .size _start, . - _start
          EOF
          aarch64-linux-gnu-as \
            -o /tmp/vc4-arm-payload.o /tmp/vc4-arm-payload.S
          aarch64-linux-gnu-ld \
            -nostdlib --entry=_start -Ttext=0x80000 \
            -o /tmp/vc4-arm-payload.elf /tmp/vc4-arm-payload.o
          aarch64-linux-gnu-objcopy \
            -O binary /tmp/vc4-arm-payload.elf /tmp/vc4-handoff-kernel8.img
          aarch64-linux-gnu-objdump -d /tmp/vc4-arm-payload.elf \
            >/tmp/vc4-arm-payload.dis

      - name: Prove the corrected stock-firmware ARM handoff
        id: handoff
        shell: bash
        run: |
          rm -rf "$HANDOFF_DIR"
          mkdir -p "$HANDOFF_DIR"
          cp /tmp/vc4-arm-payload.dis "$HANDOFF_DIR/payload.dis"
          set +e
          python3 scripts/vc4/raspi3-stock-arm-payload.py \
            build/qemu-system-aarch64 \
            "$FIRMWARE_DIR/bootcode.bin" \
            "$FIRMWARE_DIR/start.elf" \
            "$FIRMWARE_DIR/fixup.dat" \
            /tmp/vc4-handoff-kernel8.img \
            --seconds 240 \
            --clock-step-ns 10000000 \
            --out-dir "$HANDOFF_DIR" \
            2>&1 | tee "$HANDOFF_DIR/probe.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$rc" > "$HANDOFF_DIR/probe.status"

      - name: Prove the mailbox framebuffer and real scanout
        id: framebuffer
        if: steps.handoff.outputs.rc == '0'
        shell: bash
        run: |
          rm -rf "$FRAMEBUFFER_DIR"
          mkdir -p "$FRAMEBUFFER_DIR"
          set +e
          python3 scripts/vc4/raspi3-stock-framebuffer.py \
            build/qemu-system-aarch64 \
            "$FIRMWARE_DIR/bootcode.bin" \
            "$FIRMWARE_DIR/start.elf" \
            "$FIRMWARE_DIR/fixup.dat" \
            "$PAYLOAD_DIR/kernel8.img" \
            --seconds 300 \
            --clock-step-ns 10000000 \
            --out-dir "$FRAMEBUFFER_DIR" \
            2>&1 | tee "$FRAMEBUFFER_DIR/probe.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$rc" > "$FRAMEBUFFER_DIR/probe.status"

      - name: Boot the pinned Raspberry Pi Linux kernel and paint /dev/fb0
        id: linux
        if: steps.handoff.outputs.rc == '0'
        shell: bash
        run: |
          rm -rf "$LINUX_DIR"
          mkdir -p "$LINUX_DIR"
          set +e
          python3 scripts/vc4/raspi3-stock-linux.py \
            build/qemu-system-aarch64 \
            "$FIRMWARE_DIR/bootcode.bin" \
            "$FIRMWARE_DIR/start.elf" \
            "$FIRMWARE_DIR/fixup.dat" \
            "$FIRMWARE_DIR/kernel8.img" \
            "$FIRMWARE_DIR/bcm2710-rpi-3-b.dtb" \
            "$INITRAMFS_DIR/initramfs.cpio.gz" \
            --seconds 900 \
            --clock-step-ns 10000000 \
            --poll-interval 0.005 \
            --out-dir "$LINUX_DIR" \
            2>&1 | tee "$LINUX_DIR/probe.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$rc" > "$LINUX_DIR/probe.status"

      - name: Classify and record the exact next frontier
        if: always()
        env:
          HANDOFF_RC: ${{ steps.handoff.outputs.rc }}
          FRAMEBUFFER_RC: ${{ steps.framebuffer.outputs.rc }}
          LINUX_RC: ${{ steps.linux.outputs.rc }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import os
          import re

          def load(path: str):
              target = Path(path)
              if not target.is_file():
                  return {}
              return json.loads(target.read_text())

          def cpu_frontier(result):
              records = []
              for cpu in result.get('cpu_snapshot', {}).get('cpus', []):
                  registers = str(cpu.get('registers', ''))
                  match = re.search(r'(?:^|\s)pc\s*=\s*([0-9a-f]+)',
                                    registers, re.I)
                  records.append({
                      'cpu_index': cpu.get('cpu_index'),
                      'qom_type': cpu.get('qom_type'),
                      'halted': cpu.get('halted'),
                      'pc': None if match is None else f"0x{match.group(1)}",
                  })
              return records

          handoff = load('/tmp/vc4-handoff/result.json')
          framebuffer = load('/tmp/vc4-framebuffer/result.json')
          linux = load('/tmp/vc4-linux/result.json')

          if not handoff.get('signature_seen'):
              classification = 'stock-firmware-handoff'
          elif not framebuffer.get('passed'):
              classification = 'bare-metal-framebuffer'
          elif not linux.get('linux_banner_seen'):
              classification = 'linux-kernel-entry'
          elif not linux.get('init_marker_seen'):
              classification = 'linux-userspace-entry'
          elif not linux.get('framebuffer_marker_seen'):
              classification = 'linux-framebuffer-device'
          elif not linux.get('screendump_samples_match'):
              classification = 'linux-framebuffer-scanout'
          else:
              classification = 'complete'

          status = {
              'schema_version': 1,
              'source_sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'classification': classification,
              'return_codes': {
                  'handoff': os.environ.get('HANDOFF_RC', ''),
                  'framebuffer': os.environ.get('FRAMEBUFFER_RC', ''),
                  'linux': os.environ.get('LINUX_RC', ''),
              },
              'handoff': {
                  'signature_seen': handoff.get('signature_seen'),
                  'observed_signature': handoff.get('observed_signature'),
                  'qtest_clock_ns': handoff.get('qtest_clock_ns'),
                  'qtest_clock_steps': handoff.get('qtest_clock_steps'),
                  'kernel_word_after_boot': handoff.get('kernel_word_after_boot'),
                  'arm_control0': handoff.get('arm_control0'),
                  'arm_control1': handoff.get('arm_control1'),
                  'arm_status': handoff.get('arm_status'),
                  'pm_proc': handoff.get('pm_proc'),
                  'probe_error': handoff.get('probe_error'),
                  'cpu_frontier': cpu_frontier(handoff),
                  'diagnostics_tail': handoff.get('qemu_diagnostics_tail', [])[-100:],
              },
              'framebuffer': {
                  'passed': framebuffer.get('passed'),
                  'payload_completed': framebuffer.get('payload_completed'),
                  'status': framebuffer.get('status'),
                  'stage': framebuffer.get('stage'),
                  'geometry_ok': framebuffer.get('geometry_ok'),
                  'framebuffer_bus': framebuffer.get('framebuffer_bus'),
                  'framebuffer_phys': framebuffer.get('framebuffer_phys'),
                  'pitch': framebuffer.get('pitch'),
                  'width': framebuffer.get('width'),
                  'height': framebuffer.get('height'),
                  'payload_samples_match':
                      framebuffer.get('payload_samples_match'),
                  'qtest_samples_match': framebuffer.get('qtest_samples_match'),
                  'screendump_samples_match':
                      framebuffer.get('screendump_samples_match'),
                  'probe_error': framebuffer.get('probe_error'),
                  'cpu_frontier': cpu_frontier(framebuffer),
                  'diagnostics_tail':
                      framebuffer.get('qemu_diagnostics_tail', [])[-100:],
              },
              'linux': {
                  'passed': linux.get('passed'),
                  'linux_banner_seen': linux.get('linux_banner_seen'),
                  'init_marker_seen': linux.get('init_marker_seen'),
                  'framebuffer_marker_seen':
                      linux.get('framebuffer_marker_seen'),
                  'framebuffer_failure_marker':
                      linux.get('framebuffer_failure_marker'),
                  'screendump_samples_match':
                      linux.get('screendump_samples_match'),
                  'screendump_width': linux.get('screendump_width'),
                  'screendump_height': linux.get('screendump_height'),
                  'qtest_clock_ns': linux.get('qtest_clock_ns'),
                  'qtest_clock_steps': linux.get('qtest_clock_steps'),
                  'arm_control0': linux.get('arm_control0'),
                  'arm_control1': linux.get('arm_control1'),
                  'arm_status': linux.get('arm_status'),
                  'pm_proc': linux.get('pm_proc'),
                  'probe_error': linux.get('probe_error'),
                  'cpu_frontier': cpu_frontier(linux),
                  'serial_tail': linux.get('serial_tail', [])[-300:],
                  'diagnostics_tail': linux.get('qemu_diagnostics_tail', [])[-150:],
              },
          }
          Path('VC4_LINUX_FRAMEBUFFER_STATUS.json').write_text(
              json.dumps(status, indent=2, sort_keys=True) + '\n'
          )

          lines = [
              '# VC4 Linux and framebuffer bring-up',
              '',
              f"Classification: **`{classification}`**",
              '',
              '## Gates',
              '',
              f"- Stock firmware entered ARM payload: "
              f"**{bool(handoff.get('signature_seen'))}**",
              f"- Bare-metal mailbox framebuffer and QMP scanout: "
              f"**{bool(framebuffer.get('passed'))}**",
              f"- Linux banner observed: "
              f"**{bool(linux.get('linux_banner_seen'))}**",
              f"- Linux `/init` observed: "
              f"**{bool(linux.get('init_marker_seen'))}**",
              f"- Linux `/dev/fb0` painter completed: "
              f"**{bool(linux.get('framebuffer_marker_seen'))}**",
              f"- Linux QMP quadrant scanout matched: "
              f"**{bool(linux.get('screendump_samples_match'))}**",
              '',
              '## Exact next frontier',
              '',
          ]
          next_steps = {
              'stock-firmware-handoff': (
                  'Continue from the post-clock-step VPU/ARM register '
                  'frontier; do not diagnose Linux or framebuffer yet.'
              ),
              'bare-metal-framebuffer': (
                  'Fix the property-mailbox, framebuffer allocation, RAM '
                  'mapping, or display refresh boundary identified by the '
                  'bare-metal result before attributing anything to Linux.'
              ),
              'linux-kernel-entry': (
                  'Compare the pinned kernel image, DTB placement, ARM boot '
                  'registers, exception state, and earliest serial/CPU '
                  'frontier against a direct raspi3b control boot.'
              ),
              'linux-userspace-entry': (
                  'Follow the serial kernel log to the initramfs or exec '
                  'failure and keep the framebuffer result as a proven '
                  'hardware baseline.'
              ),
              'linux-framebuffer-device': (
                  'Inspect firmware framebuffer DT properties and Linux '
                  'bcm2835-fb/simplefb registration; userspace itself is proven.'
              ),
              'linux-framebuffer-scanout': (
                  'The Linux framebuffer write completed; repair only the '
                  'QEMU display invalidation/pixel conversion path.'
              ),
              'complete': (
                  'Promote the validated slice, retain these tests, then '
                  'advance Linux toward storage, USB, networking, and a real '
                  'root filesystem.'
              ),
          }
          lines.append(next_steps[classification])
          Path('VC4_LINUX_FRAMEBUFFER_STATUS.md').write_text(
              '\n'.join(lines) + '\n'
          )
          print(json.dumps(status, indent=2, sort_keys=True))
          PY

      - name: Upload all payloads, images, logs, and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-linux-framebuffer-${{ github.run_attempt }}
          path: |
            /tmp/vc4-handoff
            /tmp/vc4-framebuffer
            /tmp/vc4-linux
            /tmp/vc4-framebuffer-payload
            /tmp/vc4-linux-initramfs
            VC4_LINUX_FRAMEBUFFER_STATUS.json
            VC4_LINUX_FRAMEBUFFER_STATUS.md
          if-no-files-found: warn
          retention-days: 14

      - name: Publish the reproducible result on the feature branch
        if: always()
        run: |
          set -euo pipefail
          test -f VC4_LINUX_FRAMEBUFFER_STATUS.json
          test -f VC4_LINUX_FRAMEBUFFER_STATUS.md
          git fetch origin agent/vc4-linux-framebuffer-bringup
          remote_head=$(git rev-parse origin/agent/vc4-linux-framebuffer-bringup)
          if test "$remote_head" != "$GITHUB_SHA"; then
            echo "Branch moved from $GITHUB_SHA to $remote_head; preserving artifacts only."
            exit 1
          fi
          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git add -- \
            scripts/vc4/raspi3-stock-linux.py \
            VC4_LINUX_FRAMEBUFFER_STATUS.json \
            VC4_LINUX_FRAMEBUFFER_STATUS.md
          git diff --cached --check
          git commit -m "ci/vc4: record Linux framebuffer frontier [skip ci]"
          git push origin HEAD:agent/vc4-linux-framebuffer-bringup

      - name: Require complete Linux framebuffer proof
        run: |
          python3 - <<'PY'
          import json
          status = json.load(open('VC4_LINUX_FRAMEBUFFER_STATUS.json'))
          raise SystemExit(0 if status['classification'] == 'complete' else 1)
          PY
