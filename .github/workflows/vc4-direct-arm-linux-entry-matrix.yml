name: VC4 direct ARM and Linux entry matrix

on:
  push:
    branches:
      - agent/vc4-hetero-direct-linux
    paths:
      - .github/workflows/vc4-direct-arm-linux-entry-matrix.yml
      - tests/vc4/direct-arm-entry.S
      - tests/vc4/linux-entry-trampoline.S
      - scripts/vc4/build-direct-arm-entry.sh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-direct-arm-linux-entry-matrix
  cancel-in-progress: true

jobs:
  entry-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RPI_FIRMWARE_COMMIT: 3d301dd924bcd758a4c8cb19fe8531031f033f43
      OFFICIAL_DIR: /tmp/vc4-official
      OUT_DIR: /tmp/vc4-entry-matrix

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            binutils-aarch64-linux-gnu cpio curl file \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
            linux-libc-dev-arm64-cross ninja-build pkg-config \
            python3 python3-venv libglib2.0-dev libpixman-1-dev zlib1g-dev

      - name: Materialize and build the machine
        run: |
          set -euo pipefail
          python3 scripts/vc4/hetero-direct-linux-integrate.py
          python3 scripts/vc4/hetero-direct-linux-integrate.py
          python3 -m py_compile \
            scripts/vc4/raspi3-direct-linux-control.py \
            scripts/vc4/preg-mutex-smoke.py \
            scripts/vc4/msync-smoke.py
          bash -n scripts/vc4/build-direct-arm-entry.sh
          bash -n scripts/vc4/build-linux-initramfs-v2.sh
          git diff --check
          ./configure \
            --target-list=aarch64-softmmu,vc4-softmmu \
            --disable-docs --disable-werror \
            2>&1 | tee /tmp/vc4-entry-configure.log
          ninja -C build qemu-system-aarch64 qemu-system-vc4 \
            2>&1 | tee /tmp/vc4-entry-build.log
          python3 scripts/vc4/preg-mutex-smoke.py \
            --qemu build/qemu-system-vc4 \
            2>&1 | tee /tmp/vc4-entry-preg.log
          python3 scripts/vc4/msync-smoke.py \
            --qemu build/qemu-system-aarch64 \
            2>&1 | tee /tmp/vc4-entry-msync.log

      - name: Download pinned Linux artifacts and build witnesses
        run: |
          set -euo pipefail
          rm -rf "$OFFICIAL_DIR" "$OUT_DIR"
          mkdir -p "$OFFICIAL_DIR" "$OUT_DIR"
          for file in kernel8.img bcm2710-rpi-3-b.dtb; do
            curl --fail --location --retry 5 \
              --output "$OFFICIAL_DIR/$file" \
              "https://raw.githubusercontent.com/raspberrypi/firmware/${RPI_FIRMWARE_COMMIT}/boot/$file"
          done
          test "$(git hash-object "$OFFICIAL_DIR/kernel8.img")" = \
            a694aa64988bbecadc770c874488165303eac673
          test "$(git hash-object "$OFFICIAL_DIR/bcm2710-rpi-3-b.dtb")" = \
            398c480adc49a5fcb03aa4c095ea74db5d1f893b
          bash scripts/vc4/build-direct-arm-entry.sh \
            "$PWD/build/vc4-direct-arm-entry"
          bash scripts/vc4/build-linux-initramfs-v2.sh \
            "$PWD/build/vc4-linux-initramfs-v2"

      - name: Prove direct ARM entry and PL011 output
        id: arm_entry
        shell: bash
        run: |
          set -uo pipefail
          serial="$OUT_DIR/direct-entry.serial"
          stderr="$OUT_DIR/direct-entry.stderr"
          timeout --signal=TERM --kill-after=3 12 \
            build/qemu-system-aarch64 \
            -M raspi3b-vc4-hetero,direct-arm-kernel=on \
            -m 1G \
            -kernel build/vc4-direct-arm-entry/direct-arm-entry.bin \
            -display none -monitor none \
            -serial "file:$serial" \
            -no-reboot \
            > /dev/null 2>"$stderr"
          rc=$?
          grep -q 'VC4_ARM_DIRECT_ENTRY' "$serial"
          marker_rc=$?
          echo "qemu_return_code=$rc" >>"$GITHUB_OUTPUT"
          echo "marker_seen=$([ "$marker_rc" -eq 0 ] && echo true || echo false)" \
            >>"$GITHUB_OUTPUT"
          exit 0

      - name: Hand off from a marked trampoline into real Linux
        id: linux_jump
        shell: bash
        run: |
          set -uo pipefail
          jump_dir="$OUT_DIR/linux-jump"
          mkdir -p "$jump_dir"
          cat >"$jump_dir/qemu-wrapper" <<EOF
          #!/usr/bin/env bash
          exec "$PWD/build/qemu-system-aarch64" "\$@" \
            -device loader,file="$OFFICIAL_DIR/kernel8.img",addr=0x00280000,force-raw=on
          EOF
          chmod +x "$jump_dir/qemu-wrapper"
          python3 scripts/vc4/raspi3-direct-linux-control.py \
            "$jump_dir/qemu-wrapper" \
            build/vc4-direct-arm-entry/linux-entry-trampoline.bin \
            "$OFFICIAL_DIR/bcm2710-rpi-3-b.dtb" \
            build/vc4-linux-initramfs-v2/initramfs.cpio \
            --seconds 180 \
            --out-dir "$jump_dir" \
            2>&1 | tee "$jump_dir/probe.log"
          rc=${PIPESTATUS[0]}
          echo "return_code=$rc" >>"$GITHUB_OUTPUT"
          exit 0

      - name: Reduce every entry boundary
        id: classify
        if: always()
        shell: bash
        env:
          ARM_MARKER: ${{ steps.arm_entry.outputs.marker_seen }}
          ARM_RC: ${{ steps.arm_entry.outputs.qemu_return_code }}
          LINUX_RC: ${{ steps.linux_jump.outputs.return_code }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          import os
          import re

          out = Path(os.environ['OUT_DIR'])
          direct_serial = (out / 'direct-entry.serial').read_text(
              encoding='utf-8', errors='replace'
          ) if (out / 'direct-entry.serial').is_file() else ''
          jump_result_path = out / 'linux-jump' / 'result.json'
          jump = (
              json.loads(jump_result_path.read_text())
              if jump_result_path.is_file() else {}
          )
          jump_serial = '\n'.join(jump.get('serial_tail', []))
          direct_entry = 'VC4_ARM_DIRECT_ENTRY' in direct_serial
          jump_entry = 'VC4_ARM_LINUX_JUMP' in jump_serial
          linux_version = bool(re.search(r'Linux version\s+\S+', jump_serial))
          init_seen = 'VC4_LINUX_INIT_START' in jump_serial
          fb_marker = 'VC4_LINUX_FB_OK' in jump_serial
          scanout = bool(jump.get('scanout_passed'))
          if not direct_entry:
              classification = 'direct-arm-entry-or-pl011-blocked'
          elif not jump_entry:
              classification = 'linux-trampoline-entry-blocked'
          elif not linux_version:
              classification = 'linux-image-entry-or-boot-protocol-blocked'
          elif not init_seen:
              classification = 'linux-initramfs-or-init-blocked'
          elif not fb_marker:
              classification = 'linux-framebuffer-device-or-paint-blocked'
          elif not scanout:
              classification = 'linux-framebuffer-scanout-blocked'
          else:
              classification = 'linux-framebuffer-scanout'
          status = {
              'schema_version': 1,
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'source_sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'classification': classification,
              'direct_arm_entry_seen': direct_entry,
              'linux_jump_marker_seen': jump_entry,
              'linux_version_seen': linux_version,
              'init_seen': init_seen,
              'framebuffer_marker_seen': fb_marker,
              'scanout_passed': scanout,
              'direct_qemu_return_code': os.environ.get('ARM_RC', ''),
              'linux_probe_return_code': os.environ.get('LINUX_RC', ''),
              'direct_serial': direct_serial.splitlines()[-100:],
              'linux_jump_result': jump,
          }
          Path('VC4_DIRECT_ARM_LINUX_ENTRY_MATRIX.json').write_text(
              json.dumps(status, indent=2, sort_keys=True) + '\n'
          )
          Path('VC4_DIRECT_ARM_LINUX_ENTRY_MATRIX.md').write_text(
              '# VC4 direct ARM/Linux entry matrix\n\n'
              f'Classification: **`{classification}`**\n\n'
              f'Direct ARM marker: `{direct_entry}`\n\n'
              f'Linux jump marker: `{jump_entry}`\n\n'
              f'Linux banner: `{linux_version}`\n\n'
              f'Init: `{init_seen}`\n\n'
              f'Framebuffer marker: `{fb_marker}`\n\n'
              f'Scanout: `{scanout}`\n'
          )
          print(json.dumps({
              key: status[key]
              for key in (
                  'classification',
                  'direct_arm_entry_seen',
                  'linux_jump_marker_seen',
                  'linux_version_seen',
                  'init_seen',
                  'framebuffer_marker_seen',
                  'scanout_passed',
              )
          }, indent=2))
          PY

      - name: Upload complete entry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-direct-arm-linux-entry-${{ github.run_attempt }}
          path: |
            VC4_DIRECT_ARM_LINUX_ENTRY_MATRIX.json
            VC4_DIRECT_ARM_LINUX_ENTRY_MATRIX.md
            /tmp/vc4-entry-matrix
            /tmp/vc4-entry-configure.log
            /tmp/vc4-entry-build.log
            /tmp/vc4-entry-preg.log
            /tmp/vc4-entry-msync.log
            build/vc4-direct-arm-entry/SHA256SUMS
            build/vc4-linux-initramfs-v2/SHA256SUMS
          if-no-files-found: warn
          retention-days: 14

      - name: Publish entry classification
        if: always()
        run: |
          set -euo pipefail
          cp VC4_DIRECT_ARM_LINUX_ENTRY_MATRIX.json /tmp/entry-matrix.json
          cp VC4_DIRECT_ARM_LINUX_ENTRY_MATRIX.md /tmp/entry-matrix.md
          git reset --hard "$GITHUB_SHA"
          cp /tmp/entry-matrix.json VC4_DIRECT_ARM_LINUX_ENTRY_MATRIX.json
          cp /tmp/entry-matrix.md VC4_DIRECT_ARM_LINUX_ENTRY_MATRIX.md
          git rm .github/workflows/vc4-direct-arm-linux-entry-matrix.yml
          git add \
            VC4_DIRECT_ARM_LINUX_ENTRY_MATRIX.json \
            VC4_DIRECT_ARM_LINUX_ENTRY_MATRIX.md
          git diff --cached --check
          git config user.name 'VC4 CI'
          git config user.email 'vc4-ci@users.noreply.github.com'
          classification=$(python3 -c \
            'import json; print(json.load(open("VC4_DIRECT_ARM_LINUX_ENTRY_MATRIX.json"))["classification"])')
          git commit -m "ci/vc4: record ${classification} [skip ci]"
          git pull --rebase origin agent/vc4-hetero-direct-linux
          git push origin HEAD:agent/vc4-hetero-direct-linux
