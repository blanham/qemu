name: VC4 V3D materialization check

on:
  push:
    branches:
      - agent/vc4-v3d-bringup
    paths:
      - .github/workflows/vc4-v3d-materialize-check.yml

permissions:
  contents: write

concurrency:
  group: vc4-v3d-materialize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate exact integration delta
        id: validate
        shell: bash
        run: |
          set +e
          python3 -m py_compile \
            scripts/vc4/v3d-integrate.py \
            scripts/vc4/v3d-smoke.py \
            >/tmp/vc4-v3d-materialize-fast.log 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            python3 scripts/vc4/v3d-integrate.py \
              >>/tmp/vc4-v3d-materialize-fast.log 2>&1
            rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            python3 scripts/vc4/v3d-integrate.py \
              >>/tmp/vc4-v3d-materialize-fast.log 2>&1
            rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            git diff --check >>/tmp/vc4-v3d-materialize-fast.log 2>&1
            rc=$?
          fi
          echo "rc=$rc" >>"$GITHUB_OUTPUT"
          exit 0
      - name: Publish result
        env:
          RC: ${{ steps.validate.outputs.rc }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import os
          log = Path('/tmp/vc4-v3d-materialize-fast.log')
          status = {
              'source_sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'return_code': int(os.environ['RC']),
              'passed': int(os.environ['RC']) == 0,
              'log': log.read_text(
                  encoding='utf-8', errors='replace'
              ).splitlines()[-200:] if log.is_file() else [],
          }
          Path('/tmp/VC4_V3D_MATERIALIZE_STATUS.json').write_text(
              json.dumps(status, indent=2, sort_keys=True) + '\n'
          )
          PY
          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git reset --hard "$GITHUB_SHA"
          cp /tmp/VC4_V3D_MATERIALIZE_STATUS.json \
            VC4_V3D_MATERIALIZE_STATUS.json
          git rm -- .github/workflows/vc4-v3d-materialize-check.yml
          git add -- VC4_V3D_MATERIALIZE_STATUS.json
          git commit -m "ci/vc4: record V3D materialization status [skip ci]"
          git pull --rebase origin agent/vc4-v3d-bringup
          git push origin HEAD:agent/vc4-v3d-bringup
