name: VC4 post-p-register multicore-sync validation v2

on:
  push:
    branches:
      - agent/vc4-post-preg-arm-release
    paths:
      - .github/workflows/vc4-post-preg-msync-v2.yml
      - scripts/vc4/msync-integrate.py
      - scripts/vc4/msync-smoke.py
      - scripts/vc4/preg-mutex-smoke.py
      - hw/misc/bcm2835_msync.c
      - include/hw/misc/bcm2835_msync.h
      - include/hw/arm/bcm2835_peripherals.h
      - target/vc4/cpu.h
      - target/vc4/helper.h
      - target/vc4/op_helper.c
      - target/vc4/translate.c
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-post-preg-msync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RPI_FIRMWARE_COMMIT: 3d301dd924bcd758a4c8cb19fe8531031f033f43
      OUT_DIR: /tmp/vc4-post-preg-msync-v2

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install build and payload dependencies
        id: dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            binutils-aarch64-linux-gnu \
            curl \
            ninja-build \
            pkg-config \
            python3 \
            python3-venv \
            libglib2.0-dev \
            libpixman-1-dev \
            zlib1g-dev

      - name: Materialize and validate the production delta
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/vc4/msync-integrate.py \
            scripts/vc4/msync-smoke.py \
            scripts/vc4/preg-mutex-smoke.py \
            scripts/vc4/raspi3-stock-arm-payload.py \
            scripts/vc4/raspi3-stock-bootcode-probe.py \
            scripts/vc4/stock_bootcode_progress.py
          python3 scripts/vc4/msync-integrate.py
          python3 scripts/vc4/msync-integrate.py
          python3 scripts/vc4/stock_bootcode_progress.py
          git diff --check
          grep -q "bcm2835_msync.c" hw/misc/meson.build
          grep -q "MSYNC_OFFSET" hw/arm/bcm2835_peripherals.c
          grep -q "INTERRUPT_MULTICORESYNC0" hw/arm/bcm2835_peripherals.c

      - name: Configure and build both VC4 frontends
        id: build
        shell: bash
        run: |
          set -euo pipefail
          ./configure \
            --target-list=aarch64-softmmu,vc4-softmmu \
            --disable-docs \
            --disable-werror \
            2>&1 | tee /tmp/vc4-post-preg-configure.log
          ninja -C build qemu-system-aarch64 qemu-system-vc4 \
            2>&1 | tee /tmp/vc4-post-preg-build.log

      - name: Exercise processor-control registers
        id: preg_smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/vc4/preg-mutex-smoke.py \
            --qemu build/qemu-system-vc4 \
            2>&1 | tee /tmp/vc4-post-preg-smoke.log

      - name: Exercise multicore-sync MMIO
        id: msync_smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/vc4/msync-smoke.py \
            --qemu build/qemu-system-aarch64 \
            2>&1 | tee /tmp/vc4-msync-smoke.log

      - name: Download the pinned official firmware trio
        id: firmware
        shell: bash
        run: |
          set -euo pipefail
          for file in bootcode.bin start.elf fixup.dat; do
            curl --fail --location --retry 4 \
              --output "/tmp/${file}" \
              "https://raw.githubusercontent.com/raspberrypi/firmware/${RPI_FIRMWARE_COMMIT}/boot/${file}"
          done
          test "$(git hash-object /tmp/bootcode.bin)" = \
            7642d2d89e4235e7d68875ff70688bdde6e71b5a
          test "$(git hash-object /tmp/start.elf)" = \
            0cefcf3a756740760f9903f35cc3843117853712
          test "$(git hash-object /tmp/fixup.dat)" = \
            1845e38de9d4f9a6d9ad7f5273bfe58b2582a7e6

      - name: Build the freestanding kernel8.img witness
        id: payload
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/vc4-arm-payload.S <<'EOF'
          .section .text
          .global _start
          .type _start, %function
          _start:
              mov x4, x0
              mov x5, sp
              mrs x6, mpidr_el1
              ldr x0, =0x0000000000001000
              ldr x1, =0x5643345f41524d21
              str x1, [x0]
              str x4, [x0, #8]
              str x5, [x0, #16]
              str x6, [x0, #24]
              dsb sy
          1:
              wfe
              b 1b
              .ltorg
          .size _start, . - _start
          EOF
          aarch64-linux-gnu-as \
            -o /tmp/vc4-arm-payload.o /tmp/vc4-arm-payload.S
          aarch64-linux-gnu-ld \
            -nostdlib --entry=_start -Ttext=0x80000 \
            -o /tmp/vc4-arm-payload.elf /tmp/vc4-arm-payload.o
          aarch64-linux-gnu-objcopy \
            -O binary /tmp/vc4-arm-payload.elf /tmp/kernel8.img
          aarch64-linux-gnu-objdump -d /tmp/vc4-arm-payload.elf \
            >/tmp/vc4-arm-payload.dis
          test -s /tmp/kernel8.img

      - name: Probe the next unchanged stock-firmware frontier
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"
          cp /tmp/vc4-arm-payload.dis "$OUT_DIR/payload.dis"
          cp /tmp/kernel8.img "$OUT_DIR/kernel8.img"
          set +e
          python3 scripts/vc4/raspi3-stock-arm-payload.py \
            build/qemu-system-aarch64 \
            /tmp/bootcode.bin \
            /tmp/start.elf \
            /tmp/fixup.dat \
            /tmp/kernel8.img \
            --seconds 120 \
            --out-dir "$OUT_DIR" \
            2>&1 | tee "$OUT_DIR/probe.log"
          rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$rc" >"$OUT_DIR/probe.status"
          echo "return_code=$rc" >>"$GITHUB_OUTPUT"

      - name: Record build, smoke, and firmware frontier
        id: record
        if: always()
        shell: bash
        env:
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          MATERIALIZE_OUTCOME: ${{ steps.materialize.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PREG_SMOKE_OUTCOME: ${{ steps.preg_smoke.outcome }}
          MSYNC_SMOKE_OUTCOME: ${{ steps.msync_smoke.outcome }}
          FIRMWARE_OUTCOME: ${{ steps.firmware.outcome }}
          PAYLOAD_OUTCOME: ${{ steps.payload.outcome }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          PROBE_RETURN_CODE: ${{ steps.probe.outputs.return_code }}
        run: |
          python3 - <<'PY'
          from collections import Counter
          import json
          import os
          from pathlib import Path
          import re

          out = Path(os.environ["OUT_DIR"])

          def read_text(path: Path) -> str:
              if not path.is_file():
                  return ""
              return path.read_text(encoding="utf-8", errors="replace")

          result_path = out / "result.json"
          result = (
              json.loads(result_path.read_text())
              if result_path.is_file() else {}
          )
          diagnostics = read_text(out / "qemu.stderr")
          diagnostic_counts = Counter()
          for line in diagnostics.splitlines():
              lowered = line.lower()
              if ("unimplemented" in lowered or
                      "illegal instruction" in lowered or
                      "guest error" in lowered):
                  diagnostic_counts[line] += 1

          cpu_frontier = []
          vpu_pcs = []
          for cpu in result.get("cpu_snapshot", {}).get("cpus", []):
              registers = str(cpu.get("registers", ""))
              match = re.search(
                  r"(?:^|\s)pc\s*=\s*([0-9a-f]+)",
                  registers,
                  re.IGNORECASE,
              )
              pc = f"0x{match.group(1)}" if match else None
              qom_type = cpu.get("qom_type")
              if qom_type and "vc4" in str(qom_type).lower() and pc:
                  vpu_pcs.append(pc.lower())
              cpu_frontier.append({
                  "cpu_index": cpu.get("cpu_index"),
                  "qom_type": qom_type,
                  "halted": cpu.get("halted"),
                  "pc": pc,
                  "registers": registers,
              })

          outcomes = {
              "dependencies": os.environ.get("DEPENDENCIES_OUTCOME"),
              "materialize": os.environ.get("MATERIALIZE_OUTCOME"),
              "build": os.environ.get("BUILD_OUTCOME"),
              "preg_smoke": os.environ.get("PREG_SMOKE_OUTCOME"),
              "msync_smoke": os.environ.get("MSYNC_SMOKE_OUTCOME"),
              "firmware": os.environ.get("FIRMWARE_OUTCOME"),
              "payload": os.environ.get("PAYLOAD_OUTCOME"),
              "probe": os.environ.get("PROBE_OUTCOME"),
          }
          production_validated = all(
              outcomes.get(key) == "success"
              for key in (
                  "dependencies",
                  "materialize",
                  "build",
                  "preg_smoke",
                  "msync_smoke",
              )
          )
          old_pc = "0x1ec6134e"
          status = {
              "schema_version": 2,
              "source_sha": os.environ["GITHUB_SHA"],
              "ref_name": os.environ["GITHUB_REF_NAME"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "run_url": (
                  f"{os.environ['GITHUB_SERVER_URL']}/"
                  f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
                  f"{os.environ['GITHUB_RUN_ID']}"
              ),
              "production_validated": production_validated,
              "old_vpusema_loop_pc": old_pc,
              "observed_vpu_pcs": vpu_pcs,
              "old_vpusema_loop_cleared": bool(vpu_pcs) and all(
                  pc != old_pc for pc in vpu_pcs
              ),
              "outcomes": outcomes,
              "probe_return_code": os.environ.get(
                  "PROBE_RETURN_CODE", ""
              ),
              "result": {
                  key: result.get(key)
                  for key in (
                      "schema_version",
                      "signature_address",
                      "expected_signature",
                      "signature_seen",
                      "observed_signature",
                      "elapsed_seconds",
                      "qemu_returncode",
                      "probe_error",
                      "kernel_word_before_boot",
                      "kernel_word_after_boot",
                      "payload_argument_x0",
                      "payload_initial_sp",
                      "payload_mpidr_el1",
                      "arm_control0",
                      "arm_control1",
                      "arm_status",
                      "arm_id",
                      "pm_proc",
                  )
                  if key in result
              },
              "cpu_frontier": cpu_frontier,
              "diagnostic_counts": [
                  {"count": count, "line": line}
                  for line, count in diagnostic_counts.most_common(100)
              ],
              "qemu_diagnostics_tail": diagnostics.splitlines()[-240:],
              "probe_log_tail": read_text(
                  out / "probe.log"
              ).splitlines()[-160:],
              "configure_log_tail": read_text(
                  Path("/tmp/vc4-post-preg-configure.log")
              ).splitlines()[-160:],
              "build_log_tail": read_text(
                  Path("/tmp/vc4-post-preg-build.log")
              ).splitlines()[-240:],
              "preg_smoke_log": read_text(
                  Path("/tmp/vc4-post-preg-smoke.log")
              ).splitlines()[-100:],
              "msync_smoke_log": read_text(
                  Path("/tmp/vc4-msync-smoke.log")
              ).splitlines()[-100:],
          }
          Path("VC4_POST_PREG_MSYNC_STATUS.json").write_text(
              json.dumps(status, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({
              "production_validated": production_validated,
              "signature_seen": status["result"].get("signature_seen"),
              "old_vpusema_loop_cleared": status[
                  "old_vpusema_loop_cleared"
              ],
              "observed_vpu_pcs": vpu_pcs,
              "outcomes": outcomes,
          }, indent=2))
          PY

      - name: Upload complete diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-post-preg-msync-v2-${{ github.run_attempt }}
          path: |
            /tmp/vc4-post-preg-msync-v2
            /tmp/vc4-post-preg-configure.log
            /tmp/vc4-post-preg-build.log
            /tmp/vc4-post-preg-smoke.log
            /tmp/vc4-msync-smoke.log
            VC4_POST_PREG_MSYNC_STATUS.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publish production changes or failure diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status=VC4_POST_PREG_MSYNC_STATUS.json
          test -f "$status"
          cp "$status" /tmp/VC4_POST_PREG_MSYNC_STATUS.json

          validated=$(python3 - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(
              Path("VC4_POST_PREG_MSYNC_STATUS.json").read_text()
          )
          print("true" if status.get("production_validated") else "false")
          PY
          )

          git fetch origin "$GITHUB_REF_NAME"
          remote_head=$(git rev-parse "origin/$GITHUB_REF_NAME")
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "Branch moved from $GITHUB_SHA to $remote_head; refusing to overwrite it."
            exit 1
          fi

          if [ "$validated" = true ]; then
            rm -f \
              .github/workflows/vc4-post-preg-msync.yml \
              .github/workflows/vc4-post-preg-msync-v2.yml \
              scripts/vc4/msync-integrate.py
            git add -A
            if python3 - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(
              Path("VC4_POST_PREG_MSYNC_STATUS.json").read_text()
          )
          raise SystemExit(
              0 if status.get("result", {}).get("signature_seen") else 1
          )
          PY
            then
              message="hw/misc: wire multicore sync and reach ARM payload"
            else
              message="hw/misc: wire BCM2835 multicore synchronization"
            fi
          else
            git reset --hard "$GITHUB_SHA"
            git clean -fd
            cp /tmp/VC4_POST_PREG_MSYNC_STATUS.json "$status"
            git add "$status"
            message="ci/vc4: record multicore-sync validation failure [skip ci]"
          fi

          git diff --cached --check
          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git commit -m "$message"
          git push origin HEAD:"$GITHUB_REF_NAME"
