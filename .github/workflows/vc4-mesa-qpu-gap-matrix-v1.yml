name: VC4 post-fan Mesa QPU coverage matrix

on:
  push:
    branches:
      - agent/vc4-linux-mesa-gles2-frontier
    paths:
      - .github/workflows/vc4-mesa-qpu-gap-matrix-v1.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-mesa-qpu-gap-matrix-v1
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BRANCH: agent/vc4-linux-mesa-gles2-frontier
      BASELINE_MESA_RUN_ID: "34361009904"
      RESULT_DIR: /tmp/vc4-mesa-qpu-gap

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Wait for clean fan product and its real Mesa replay
        run: |
          set -euo pipefail
          rm -rf "$RESULT_DIR"
          mkdir -p "$RESULT_DIR"
          matched=false
          for attempt in $(seq 1 75); do
            git fetch origin "$BRANCH"
            fan_commit=$(git log \
              --format=%H --grep='hw/display: assemble VC4 array triangle fans' \
              -n 1 "origin/$BRANCH" || true)
            if test -n "$fan_commit" && \
               git show "origin/$BRANCH:VC4_V3D_TRIANGLE_FAN_STATUS.json" \
                 > "$RESULT_DIR/fan-status.json" 2>/dev/null && \
               git show "origin/$BRANCH:VC4_LINUX_MESA_GLES2_STATUS.json" \
                 > "$RESULT_DIR/mesa-status.json" 2>/dev/null; then
              run_id=$(python3 - <<'PY'
          import json
          from pathlib import Path
          record = json.loads(Path('/tmp/vc4-mesa-qpu-gap/mesa-status.json').read_text())
          print(record.get('run_id') or '')
          PY
              )
              source_sha=$(python3 - <<'PY'
          import json
          from pathlib import Path
          record = json.loads(Path('/tmp/vc4-mesa-qpu-gap/mesa-status.json').read_text())
          print(record.get('source_sha') or record.get('tested_source_sha') or '')
          PY
              )
              if test -n "$run_id" && test "$run_id" != "$BASELINE_MESA_RUN_ID"; then
                if test -z "$source_sha" || \
                   git merge-base --is-ancestor "$fan_commit" "$source_sha"; then
                  printf '%s\n' "$fan_commit" > "$RESULT_DIR/FAN_COMMIT"
                  printf '%s\n' "$run_id" > "$RESULT_DIR/MESA_RUN_ID"
                  printf '%s\n' "$source_sha" > "$RESULT_DIR/MESA_SOURCE_SHA"
                  matched=true
                  break
                fi
              fi
            fi
            sleep 12
          done
          if test "$matched" != true; then
            echo "post-fan Mesa replay did not publish within the bounded wait" >&2
            exit 1
          fi
          git checkout -B "$BRANCH" "origin/$BRANCH"
          git diff --check

      - name: Derive ordered semantic coverage gaps
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from collections import defaultdict
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          import os
          import re

          result_dir = Path('/tmp/vc4-mesa-qpu-gap')
          status = json.loads((result_dir / 'mesa-status.json').read_text())
          qpu_source = Path('hw/display/vc4_qpu_exec.c').read_text()
          pipeline_source = Path('hw/display/vc4_v3d_pipeline.c').read_text()

          diagnostics = []
          for key in ('qemu_diagnostics_tail', 'serial_tail'):
              value = status.get(key)
              if isinstance(value, list):
                  diagnostics.extend(str(line) for line in value)
          summary = status.get('probe_result_summary')
          if isinstance(summary, dict):
              for value in summary.values():
                  if isinstance(value, list):
                      diagnostics.extend(str(line) for line in value)

          primitive_re = re.compile(
              r'frontier primitive .*?mode=(\d+):([^ ]+) length=(\d+)',
          )
          record_re = re.compile(
              r'frontier shader record=.*?attrs=(\d+).*?varyings=(\d+)',
          )
          qpu_re = re.compile(
              r'qpu frontier stage=(\w+) index=(\d+) .*?word=(0x[0-9a-f]+) '
              r'sig=(\d+):([^ ]+) unpack=(\d+) pm=(\d+) pack=(\d+) '
              r'ca=(\d+) cm=(\d+) sf=(\d+) ws=(\d+) wa=(\d+) wm=(\d+) '
              r'add=(\d+) mul=(\d+) ra=(\d+) rb=(\d+) '
              r'aa=(\d+) ab=(\d+) ma=(\d+) mb=(\d+)',
              re.IGNORECASE,
          )

          primitive = None
          shader_record = None
          instructions = []
          for line in diagnostics:
              match = primitive_re.search(line)
              if match:
                  primitive = {
                      'mode': int(match.group(1)),
                      'name': match.group(2),
                      'length': int(match.group(3)),
                  }
              match = record_re.search(line)
              if match:
                  shader_record = {
                      'attributes': int(match.group(1)),
                      'fragment_varyings': int(match.group(2)),
                  }
              match = qpu_re.search(line)
              if match:
                  values = match.groups()
                  instructions.append({
                      'stage': values[0],
                      'index': int(values[1]),
                      'word': values[2],
                      'signal': int(values[3]),
                      'signal_name': values[4],
                      'unpack': int(values[5]),
                      'pm': int(values[6]),
                      'pack': int(values[7]),
                      'cond_add': int(values[8]),
                      'cond_mul': int(values[9]),
                      'set_flags': int(values[10]),
                      'write_swap': int(values[11]),
                      'waddr_add': int(values[12]),
                      'waddr_mul': int(values[13]),
                      'op_add': int(values[14]),
                      'op_mul': int(values[15]),
                      'raddr_a': int(values[16]),
                      'raddr_b': int(values[17]),
                      'add_a': int(values[18]),
                      'add_b': int(values[19]),
                      'mul_a': int(values[20]),
                      'mul_b': int(values[21]),
                  })

          # These are source-derived contracts, not assumptions about Mesa.
          allowed_signals = {1, 3, 5, 13, 14}
          allowed_add_ops = {0, 2, 7, 21}
          allowed_mul_ops = {0, 1}
          if 'case 6:' in qpu_source:
              allowed_signals.add(6)
          if 'case 10:' in qpu_source:
              allowed_signals.add(10)

          observed = defaultdict(set)
          for insn in instructions:
              observed['signals'].add(insn['signal'])
              observed['add_ops'].add(insn['op_add'])
              observed['mul_ops'].add(insn['op_mul'])
              if insn['unpack']:
                  observed['unpack_modes'].add(insn['unpack'])
              if insn['pack']:
                  observed['pack_modes'].add(insn['pack'])
              if insn['set_flags']:
                  observed['set_flags'].add(insn['set_flags'])
              if insn['cond_add'] > 1:
                  observed['add_conditions'].add(insn['cond_add'])
              if insn['cond_mul'] > 1:
                  observed['mul_conditions'].add(insn['cond_mul'])
              for key in ('raddr_a', 'raddr_b'):
                  address = insn[key]
                  if address >= 32:
                      observed['special_reads'].add(address)
              for key in ('waddr_add', 'waddr_mul'):
                  address = insn[key]
                  if address >= 32:
                      observed['special_writes'].add(address)

          gaps = []
          def add_gap(priority, category, detail, evidence):
              gaps.append({
                  'priority': priority,
                  'category': category,
                  'detail': detail,
                  'evidence': evidence,
              })

          fan_supported = 'VC4_PRIMITIVE_TRIANGLE_FAN' in pipeline_source
          if primitive and primitive['mode'] == 6 and not fan_supported:
              add_gap(10, 'primitive-assembly', 'triangle fan mode 6', primitive)
          if shader_record and shader_record['fragment_varyings']:
              add_gap(
                  20,
                  'fragment-varying-pipeline',
                  f"{shader_record['fragment_varyings']} fragment varyings",
                  shader_record,
              )

          unsupported_signals = sorted(observed['signals'] - allowed_signals)
          if unsupported_signals:
              add_gap(30, 'qpu-signals', unsupported_signals, {
                  str(value): sorted({
                      i['signal_name'] for i in instructions
                      if i['signal'] == value
                  }) for value in unsupported_signals
              })
          unsupported_add = sorted(observed['add_ops'] - allowed_add_ops)
          if unsupported_add:
              add_gap(40, 'qpu-add-operations', unsupported_add, None)
          unsupported_mul = sorted(observed['mul_ops'] - allowed_mul_ops)
          if unsupported_mul:
              add_gap(50, 'qpu-mul-operations', unsupported_mul, None)
          if observed['unpack_modes']:
              add_gap(60, 'qpu-unpack', sorted(observed['unpack_modes']), None)
          if observed['pack_modes']:
              add_gap(70, 'qpu-pack', sorted(observed['pack_modes']), None)
          if observed['set_flags']:
              add_gap(80, 'qpu-flags', sorted(observed['set_flags']), None)
          if observed['add_conditions'] or observed['mul_conditions']:
              add_gap(90, 'qpu-conditions', {
                  'add': sorted(observed['add_conditions']),
                  'mul': sorted(observed['mul_conditions']),
              }, None)

          # Address 35 is the fragment varying FIFO; 56/57 are TMU parameter
          # writes in the measured program, and signal 10 requests TMU0 load.
          if 35 in observed['special_reads']:
              add_gap(100, 'varying-fifo-read', 35, None)
          tmu_writes = sorted(observed['special_writes'] & {56, 57, 58, 59})
          if tmu_writes or 10 in observed['signals']:
              add_gap(110, 'tmu0-state-and-load', {
                  'parameter_writes': tmu_writes,
                  'load_signal': 10 in observed['signals'],
              }, None)

          gaps.sort(key=lambda item: item['priority'])
          record = {
              'schema_version': 1,
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'source_sha': os.environ.get('GITHUB_SHA'),
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'measured_mesa_run_id': status.get('run_id'),
              'measured_mesa_source_sha': (
                  status.get('source_sha') or status.get('tested_source_sha')
              ),
              'mesa_classification': status.get('classification'),
              'last_marker': status.get('last_marker'),
              'next_missing_marker': status.get('next_missing_marker'),
              'primitive': primitive,
              'shader_record': shader_record,
              'instruction_count': len(instructions),
              'instructions': instructions,
              'observed': {
                  key: sorted(values) for key, values in observed.items()
              },
              'source_contract': {
                  'fan_supported': fan_supported,
                  'allowed_signals': sorted(allowed_signals),
                  'allowed_add_ops': sorted(allowed_add_ops),
                  'allowed_mul_ops': sorted(allowed_mul_ops),
              },
              'ordered_gaps': gaps,
              'first_gap': gaps[0] if gaps else None,
              'complete': not gaps,
          }
          Path('VC4_MESA_QPU_COVERAGE_GAP.json').write_text(
              json.dumps(record, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )

          gap_lines = []
          for gap in gaps:
              gap_lines.append(
                  f"- P{gap['priority']:03d} **{gap['category']}**: "
                  f"`{json.dumps(gap['detail'], sort_keys=True)}`"
              )
          if not gap_lines:
              gap_lines.append('- No remaining gap was detected by this matrix.')
          Path('VC4_MESA_QPU_COVERAGE_GAP.md').write_text(
              '\n'.join([
                  '# VC4 Mesa QPU coverage gap matrix',
                  '',
                  f"Mesa frontier: **`{status.get('classification')}`**",
                  f"Last marker: **`{status.get('last_marker')}`**",
                  '',
                  '## Ordered architectural gaps',
                  '',
                  *gap_lines,
                  '',
                  'This matrix is derived from the exact real Mesa command and '
                  'shader trace. It does not authorize address-, shader-, or '
                  'fixture-fingerprint shortcuts.',
                  '',
              ]),
              encoding='utf-8',
          )
          print(json.dumps({
              'mesa_classification': record['mesa_classification'],
              'primitive': primitive,
              'shader_record': shader_record,
              'first_gap': record['first_gap'],
              'ordered_gaps': gaps,
          }, indent=2, sort_keys=True))
          if not instructions:
              raise SystemExit('no measured QPU instructions found in Mesa status')
          PY
          cp VC4_MESA_QPU_COVERAGE_GAP.* "$RESULT_DIR/"
          git diff --check

      - name: Upload complete gap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-mesa-qpu-gap-${{ github.run_attempt }}
          path: |
            VC4_MESA_QPU_COVERAGE_GAP.json
            VC4_MESA_QPU_COVERAGE_GAP.md
            /tmp/vc4-mesa-qpu-gap
          if-no-files-found: warn
          retention-days: 14

      - name: Publish matrix and retire one-shot workflow
        if: always()
        run: |
          set -euo pipefail
          test -f VC4_MESA_QPU_COVERAGE_GAP.json
          test -f VC4_MESA_QPU_COVERAGE_GAP.md
          git rm -- .github/workflows/vc4-mesa-qpu-gap-matrix-v1.yml
          git add -- \
            VC4_MESA_QPU_COVERAGE_GAP.json \
            VC4_MESA_QPU_COVERAGE_GAP.md
          git diff --cached --check
          git config user.name "VC4 Mesa Gap CI"
          git config user.email "vc4-mesa-gap-ci@users.noreply.github.com"
          git commit -m \
            "tests/vc4: record measured Mesa QPU coverage gaps [skip ci]"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
