name: VC4 Linux native KMS modeset route

on:
  push:
    branches:
      - agent/vc4-linux-kms-modeset-frontier
    paths:
      - .github/workflows/vc4-kms-modeset-route.yml
      - VC4_LINUX_KMS_MODESET_STATUS.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-linux-native-kms-modeset-route
  cancel-in-progress: true

jobs:
  route:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      BRANCH: agent/vc4-linux-kms-modeset-frontier
      STATUS: VC4_LINUX_KMS_MODESET_STATUS.json
      ROUTE_JSON: VC4_LINUX_KMS_MODESET_ROUTE.json
      ROUTE_MD: VC4_LINUX_KMS_MODESET_ROUTE.md
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Obtain the authoritative modeset status
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            git fetch --quiet origin "$BRANCH"
            if git show "origin/$BRANCH:$STATUS" > /tmp/status.json 2>/dev/null; then
              python3 - <<'PY'
          import json
          value = json.load(open('/tmp/status.json'))
          raise SystemExit(0 if value.get('source_sha') else 1)
          PY
              if [ $? -eq 0 ]; then
                break
              fi
            fi
            sleep 5
          done
          test -s /tmp/status.json
          cp /tmp/status.json "$STATUS"

      - name: Route the first missing modeset contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path
          import re

          status = json.load(open('/tmp/status.json'))
          classification = str(status.get('classification') or 'unknown')
          outcomes = status.get('outcomes') or {}
          markers = status.get('markers') or {}
          failures = status.get('failures') or []
          failed_steps = [key for key, value in outcomes.items() if value != 'success']

          route = 'OTHER'
          if failed_steps or classification.startswith('workflow-'):
              route = 'WORKFLOW_FAILED'
          elif classification == 'kms-topology-regression':
              route = 'TOPOLOGY_REGRESSION'
          elif classification in {
              'modeset-probe-not-invoked',
              'modeset-child-not-started',
          }:
              route = 'PROBE_NOT_INVOKED'
          elif classification == 'modeset-connector-selection-failed':
              route = 'CONNECTOR_SELECTION_FAILED'
          elif classification == 'modeset-dumb-buffer-create-failed':
              route = 'DUMB_CREATE_FAILED'
          elif classification == 'modeset-dumb-buffer-map-failed':
              route = 'MAP_FAILED'
          elif classification == 'modeset-framebuffer-create-failed':
              route = 'FB_CREATE_FAILED'
          elif classification == 'modeset-setcrtc-timeout':
              route = 'SETCRTC_TIMEOUT'
          elif classification.startswith('modeset-setcrtc-errno-'):
              route = 'SETCRTC_ERRNO'
          elif classification == 'modeset-setcrtc-unavailable':
              route = 'SETCRTC_ERRNO'
          elif classification == 'modeset-post-setcrtc-incomplete':
              route = 'POST_SETCRTC_INCOMPLETE'
          elif classification == 'linux-vc4-kms-modeset-clear':
              route = 'CLEAR'

          marker_path = Path(f'VC4_MODESET_ROUTE_{route}')
          for old in Path('.').glob('VC4_MODESET_ROUTE_*'):
              if old.name not in {
                  'VC4_LINUX_KMS_MODESET_ROUTE.json',
                  'VC4_LINUX_KMS_MODESET_ROUTE.md',
              }:
                  old.unlink()
          payload = {
              'route': route,
              'classification': classification,
              'source_sha': status.get('source_sha'),
              'run_id': status.get('run_id'),
              'failed_workflow_steps': failed_steps,
              'last_failure': failures[-1] if failures else None,
              'markers': markers,
              'connector': status.get('connector'),
              'dumb_buffer': status.get('dumb_buffer'),
          }
          marker_path.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          Path('VC4_LINUX_KMS_MODESET_ROUTE.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n'
          )
          Path('VC4_LINUX_KMS_MODESET_ROUTE.md').write_text(
              '# VC4 Linux native KMS modeset route\n\n'
              f"- Source SHA: `{payload['source_sha']}`\n"
              f"- Frontier: **`{classification}`**\n"
              f"- Route: **`{route}`**\n"
              f"- Last failure: `{payload['last_failure']}`\n"
              f"- Connector: `{payload['connector']}`\n"
              f"- Dumb buffer: `{payload['dumb_buffer']}`\n"
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Publish route
        run: |
          set -euo pipefail
          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git pull --rebase origin "$BRANCH"
          cp /tmp/status.json "$STATUS"
          git add -A -- \
            "$STATUS" "$ROUTE_JSON" "$ROUTE_MD" \
            VC4_MODESET_ROUTE_*
          git rm -f --ignore-unmatch \
            .github/workflows/vc4-kms-modeset-route.yml
          git commit -m "test/vc4: route the native KMS modeset frontier"
          git push origin "HEAD:$BRANCH"
