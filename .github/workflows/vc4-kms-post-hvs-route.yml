name: VC4 Linux native KMS post-HVS route

on:
  push:
    branches:
      - agent/vc4-linux-kms-scanout-frontier
    paths:
      - .github/workflows/vc4-kms-post-hvs-route.yml
      - hw/display/bcm2835_hvs.c
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-linux-native-kms-post-hvs-route
  cancel-in-progress: true

jobs:
  route:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      BRANCH: agent/vc4-linux-kms-scanout-frontier
      STATUS: VC4_LINUX_KMS_SCANOUT_STATUS.json
      OLD_ROUTE: VC4_LINUX_KMS_SCANOUT_ROUTE.json
      OUTPUT_JSON: VC4_LINUX_KMS_POST_HVS.json
      OUTPUT_MD: VC4_LINUX_KMS_POST_HVS.md
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Wait for the post-HVS scanout gate
        run: |
          set -euo pipefail
          git fetch --quiet origin "$BRANCH"
          old_source=$(git show "origin/$BRANCH:$OLD_ROUTE" 2>/dev/null \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("source_sha", ""))' \
            || true)
          for attempt in $(seq 1 120); do
            git fetch --quiet origin "$BRANCH"
            if git show "origin/$BRANCH:$STATUS" > /tmp/candidate.json 2>/dev/null; then
              if python3 - "$old_source" <<'PY'
          import json
          import sys
          status = json.load(open('/tmp/candidate.json'))
          source = status.get('source_sha') or ''
          raise SystemExit(0 if source and source != sys.argv[1] else 1)
          PY
              then
                cp /tmp/candidate.json /tmp/status.json
                break
              fi
            fi
            sleep 5
          done
          test -s /tmp/status.json
          cp /tmp/status.json "$STATUS"

      - name: Route the post-HVS result
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          status = json.load(open('/tmp/status.json'))
          classification = str(status.get('classification') or 'unknown')
          routes = {
              'linux-vc4-kms-scanout-clear': 'CLEAR',
              'kms-modeset-regression': 'MODESET_REGRESSION',
              'kms-mode-marker-unavailable': 'MODE_MARKER_UNAVAILABLE',
              'qmp-screendump-unavailable': 'NO_SCREENSHOT',
              'kms-scanout-blank': 'BLANK',
              'kms-scanout-dimensions-mismatch': 'DIMENSIONS_MISMATCH',
              'kms-scanout-pattern-mismatch': 'PATTERN_MISMATCH',
          }
          route = routes.get(classification, 'OTHER')
          for old in Path('.').glob('VC4_POST_HVS_ROUTE_*'):
              old.unlink()
          record = {
              'schema_version': 1,
              'source_sha': status.get('source_sha'),
              'run_id': status.get('run_id'),
              'classification': classification,
              'route': route,
              'mode': status.get('mode'),
              'frame_count': status.get('frame_count'),
              'valid_frame_count': status.get('valid_frame_count'),
              'matching_frame_count': status.get('matching_frame_count'),
              'best_frame': status.get('best_frame'),
              'capture_errors': (status.get('capture_record') or {}).get('errors'),
              'serial_tail': status.get('serial_tail') or [],
          }
          Path(f'VC4_POST_HVS_ROUTE_{route}').write_text(
              json.dumps(record, indent=2, sort_keys=True) + '\n'
          )
          Path('VC4_LINUX_KMS_POST_HVS.json').write_text(
              json.dumps(record, indent=2, sort_keys=True) + '\n'
          )
          Path('VC4_LINUX_KMS_POST_HVS.md').write_text(
              '# VC4 Linux native KMS after HVS primary scanout\n\n'
              f"- Source SHA: `{record['source_sha']}`\n"
              f"- Frontier: **`{classification}`**\n"
              f"- Route: **`{route}`**\n"
              f"- Guest mode: `{record['mode']}`\n"
              f"- Best frame: `{record['best_frame']}`\n"
          )
          print(json.dumps(record, indent=2, sort_keys=True))
          PY

      - name: Publish post-HVS route
        run: |
          set -euo pipefail
          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git pull --rebase origin "$BRANCH"
          cp /tmp/status.json "$STATUS"
          git add -A -- \
            "$STATUS" "$OUTPUT_JSON" "$OUTPUT_MD" VC4_POST_HVS_ROUTE_*
          git rm -f --ignore-unmatch \
            .github/workflows/vc4-kms-post-hvs-route.yml
          git commit -m "test/vc4: route the post-HVS host scanout frontier"
          git push origin "HEAD:$BRANCH"
