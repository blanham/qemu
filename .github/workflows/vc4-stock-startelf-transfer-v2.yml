name: VC4 stock START.ELF transfer v2

on:
  push:
    branches:
      - agent/vc4-stock-arm-handoff-recovered
    paths:
      - .github/workflows/vc4-stock-startelf-transfer-v2.yml
      - scripts/vc4/summarize-stock-startelf-transfer.py
      - scripts/vc4/raspi3-stock-arm-payload.py
      - scripts/vc4/raspi3-stock-bootcode-probe.py
      - scripts/vc4/raspi3-stock-vpu-trace.py
      - hw/sd/bcm2835_sdhost.c
      - include/hw/sd/bcm2835_sdhost.h
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-stock-startelf-transfer-v2
  cancel-in-progress: false

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      BRANCH: agent/vc4-stock-arm-handoff-recovered
      RPI_FIRMWARE_COMMIT: 3d301dd924bcd758a4c8cb19fe8531031f033f43
      FIXTURE_DIR: /tmp/vc4-stock-startelf-fixtures
      RESULT_DIR: /tmp/vc4-stock-startelf-result
      STATUS_JSON: VC4_STOCK_STARTELF_TRANSFER_STATUS.json
      STATUS_MD: VC4_STOCK_STARTELF_TRANSFER_STATUS.md

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Pin unchanged firmware and build handoff payload
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            binutils-aarch64-linux-gnu curl gcc-aarch64-linux-gnu \
            libglib2.0-dev libpixman-1-dev ninja-build pkg-config \
            python3 zlib1g-dev zstd
          rm -rf "$FIXTURE_DIR" "$RESULT_DIR"
          mkdir -p "$FIXTURE_DIR" "$RESULT_DIR"
          python3 -m py_compile \
            scripts/vc4/raspi3-stock-arm-payload.py \
            scripts/vc4/raspi3-stock-bootcode-probe.py \
            scripts/vc4/raspi3-stock-vpu-trace.py \
            scripts/vc4/summarize-stock-startelf-transfer.py

          for file in bootcode.bin start.elf fixup.dat bcm2710-rpi-3-b.dtb; do
            curl --fail --location --retry 5 \
              --output "$FIXTURE_DIR/$file" \
              "https://raw.githubusercontent.com/raspberrypi/firmware/${RPI_FIRMWARE_COMMIT}/boot/$file"
          done
          test "$(git hash-object "$FIXTURE_DIR/bootcode.bin")" = \
            7642d2d89e4235e7d68875ff70688bdde6e71b5a
          test "$(git hash-object "$FIXTURE_DIR/start.elf")" = \
            0cefcf3a756740760f9903f35cc3843117853712
          test "$(git hash-object "$FIXTURE_DIR/fixup.dat")" = \
            1845e38de9d4f9a6d9ad7f5273bfe58b2582a7e6
          test "$(git hash-object "$FIXTURE_DIR/bcm2710-rpi-3-b.dtb")" = \
            398c480adc49a5fcb03aa4c095ea74db5d1f893b

          aarch64-linux-gnu-as \
            -o "$FIXTURE_DIR/aarch64-handoff.o" tests/vc4/aarch64-handoff.S
          aarch64-linux-gnu-ld \
            -nostdlib -T tests/vc4/aarch64-handoff.ld \
            -o "$FIXTURE_DIR/aarch64-handoff.elf" \
            "$FIXTURE_DIR/aarch64-handoff.o"
          aarch64-linux-gnu-objcopy \
            -O binary "$FIXTURE_DIR/aarch64-handoff.elf" \
            "$FIXTURE_DIR/kernel8.img"
          sha256sum "$FIXTURE_DIR"/* > "$FIXTURE_DIR/SHA256SUMS"

      - name: Build normal-TCG frontends and bounded memory plugin
        run: |
          set -euo pipefail
          # Diagnostic-only instrumentation: preserve the stock plugin's
          # addresses, widths, directions and values, add cpu_index to each
          # row, and register callbacks only for VPU PCs below 0x10000.
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/tcg/plugins/mem.c')
          source = path.read_text()
          old = '''        struct qemu_plugin_insn *insn = qemu_plugin_tb_get_insn(tb, i);\n\n        if (do_inline) {\n'''
          new = '''        struct qemu_plugin_insn *insn = qemu_plugin_tb_get_insn(tb, i);\n        uint64_t insn_vaddr = qemu_plugin_insn_vaddr(insn);\n\n        if (insn_vaddr > 0x10000) {\n            continue;\n        }\n\n        if (do_inline) {\n'''
          if source.count(old) != 1:
              raise SystemExit('mem plugin translation anchor changed')
          source = source.replace(old, new, 1)

          old = '''                    "0x%"PRIx64",%s,0x%"PRIx64",0x%"PRIx64",%d,%s,",\n                    insn_info->vaddr, insn_info->sym,\n                    vaddr, hwaddr, size, type);\n'''
          new = '''                    "%u,0x%"PRIx64",%s,0x%"PRIx64",0x%"PRIx64",%d,%s,",\n                    cpu_index, insn_info->vaddr, insn_info->sym,\n                    vaddr, hwaddr, size, type);\n'''
          if source.count(old) != 1:
              raise SystemExit('mem plugin CSV row anchor changed')
          path.write_text(source.replace(old, new, 1))
          PY

          ./configure \
            --target-list=aarch64-softmmu,vc4-softmmu \
            --enable-plugins --disable-docs --disable-werror \
            2>&1 | tee "$RESULT_DIR/configure.log"
          ninja -C build qemu-system-aarch64 qemu-system-vc4 test-plugins \
            2>&1 | tee "$RESULT_DIR/build.log"
          plugin=$(find build -type f -name 'libmem.so' -print -quit)
          test -n "$plugin"
          realpath "$plugin" > "$RESULT_DIR/PLUGIN_PATH"
          sha256sum "$plugin" > "$RESULT_DIR/PLUGIN_SHA256"

          git checkout -- tests/tcg/plugins/mem.c
          git diff --check

      - name: Preserve heterogeneous CPU contracts and build firmware volume
        run: |
          set -euo pipefail
          python3 scripts/vc4/preg-mutex-smoke.py \
            --qemu build/qemu-system-vc4 \
            2>&1 | tee "$RESULT_DIR/preg.log"
          python3 scripts/vc4/msync-smoke.py \
            --qemu build/qemu-system-aarch64 \
            2>&1 | tee "$RESULT_DIR/msync.log"

          python3 - <<'PY'
          from pathlib import Path
          import importlib.util

          scripts = Path('scripts/vc4')
          spec = importlib.util.spec_from_file_location(
              'vc4_stock_handoff', scripts / 'raspi3-stock-arm-payload.py')
          if spec is None or spec.loader is None:
              raise SystemExit('could not load stock handoff helper')
          handoff = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(handoff)
          stock = handoff.load_stock_probe()
          fixtures = Path('/tmp/vc4-stock-startelf-fixtures')
          result = Path('/tmp/vc4-stock-startelf-result')
          files = [
              ('BOOTCODE.BIN', (fixtures / 'bootcode.bin').read_bytes()),
              ('START.ELF', (fixtures / 'start.elf').read_bytes()),
              ('FIXUP.DAT', (fixtures / 'fixup.dat').read_bytes()),
              ('CONFIG.TXT', handoff.default_config(True)),
              ('CMDLINE.TXT', b'console=serial0,115200 earlycon=pl011,0x3f201000\n'),
              ('RPI3.DTB', (fixtures / 'bcm2710-rpi-3-b.dtb').read_bytes()),
              ('KERNEL8.IMG', (fixtures / 'kernel8.img').read_bytes()),
          ]
          layout = stock.build_fat32_image(result / 'stock-startelf.img', files)
          (result / 'FAT_LAYOUT.txt').write_text(
              '\n'.join(f'{name}: {chain}' for name, chain in layout.items()) + '\n')
          PY

      - name: Trace the full START.ELF transfer under normal TCG
        run: |
          set -euo pipefail
          plugin=$(cat "$RESULT_DIR/PLUGIN_PATH")
          command=(
            build/qemu-system-aarch64
            -M raspi3b-vc4-hetero
            -m 1G
            -smp 5
            -drive "file=$RESULT_DIR/stock-startelf.img,format=raw,if=sd"
            -accel tcg,thread=single
            -display none
            -monitor none
            -serial none
            -no-reboot
            -plugin "$plugin,print-accesses=true,haddr=true,track=rw"
            -d plugin,guest_errors,unimp
            -D "$RESULT_DIR/memtrace.log"
          )
          printf '%s\n' "${command[@]}" > "$RESULT_DIR/COMMAND_ARGS"
          set +e
          timeout --signal=TERM --kill-after=3s 20s \
            "${command[@]}" 2>"$RESULT_DIR/qemu.stderr"
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$RESULT_DIR/RETURN_CODE"
          case "$rc" in
            0|124|143) ;;
            *) cat "$RESULT_DIR/qemu.stderr" >&2; exit "$rc" ;;
          esac
          test -s "$RESULT_DIR/memtrace.log"
          grep -Eq ',0x0*7690,' "$RESULT_DIR/memtrace.log"

      - name: Reconfirm behavior without plugin observation
        run: |
          set -euo pipefail
          python3 scripts/vc4/raspi3-stock-vpu-trace.py \
            build/qemu-system-aarch64 \
            "$FIXTURE_DIR/bootcode.bin" "$FIXTURE_DIR/start.elf" \
            "$FIXTURE_DIR/fixup.dat" "$FIXTURE_DIR/bcm2710-rpi-3-b.dtb" \
            "$FIXTURE_DIR/kernel8.img" \
            --out-dir "$RESULT_DIR/temporal" \
            --seconds 60 --interval 0.05 \
            2>&1 | tee "$RESULT_DIR/temporal.stdout"

      - name: Classify exact START.ELF progress
        run: |
          set -euo pipefail
          python3 scripts/vc4/summarize-stock-startelf-transfer.py \
            --trace "$RESULT_DIR/memtrace.log" \
            --start-elf "$FIXTURE_DIR/start.elf" \
            --temporal "$RESULT_DIR/temporal/VC4_STOCK_VPU_TRACE.json" \
            --command-args "$RESULT_DIR/COMMAND_ARGS" \
            --json "$STATUS_JSON" \
            --markdown "$STATUS_MD" \
            --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            2>&1 | tee "$RESULT_DIR/classify.log"

      - name: Publish exact stock-firmware frontier
        run: |
          set -euo pipefail
          git config user.name 'VC4 Stock Firmware CI'
          git config user.email 'vc4-stock-firmware-ci@users.noreply.github.com'
          git add -- "$STATUS_JSON" "$STATUS_MD"
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'tests/vc4: record START.ELF transfer frontier [skip ci]'
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            if git rebase "origin/$BRANCH" && \
               git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            git rebase --abort || true
            sleep 2
          done
          exit 1

      - name: Compress diagnostic evidence
        if: always()
        run: |
          set -euo pipefail
          if test -s "$RESULT_DIR/memtrace.log"; then
            zstd -T0 -3 -f \
              "$RESULT_DIR/memtrace.log" \
              -o "$RESULT_DIR/memtrace.log.zst"
            rm -f "$RESULT_DIR/memtrace.log"
          fi
          rm -f "$RESULT_DIR/stock-startelf.img"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-stock-startelf-transfer-${{ github.run_attempt }}
          path: |
            VC4_STOCK_STARTELF_TRANSFER_STATUS.json
            VC4_STOCK_STARTELF_TRANSFER_STATUS.md
            /tmp/vc4-stock-startelf-fixtures/SHA256SUMS
            /tmp/vc4-stock-startelf-result
          if-no-files-found: warn
          retention-days: 14
