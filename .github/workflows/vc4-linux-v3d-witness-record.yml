name: VC4 Linux DRM witness record

on:
  push:
    branches:
      - agent/vc4-linux-v3d-modular-isolated
    paths:
      - .github/workflows/vc4-linux-v3d-witness-record.yml
      - scripts/vc4/raspi3-linux-probe.py
      - tests/vc4/linux-v3d-modular-init.c
      - tests/vc4/linux-v3d-submit-init.c
      - tests/vc4/linux-v3d-uapi-init.c
      - tests/vc4/vc4-render-only-overlay.dts
      - scripts/vc4/fetch-linux-vc4-modules.py
      - scripts/vc4/build-linux-v3d-modular-initramfs.sh
      - scripts/vc4/build-v3d-linux-dtb.sh
      - hw/display/bcm2835_v3d.c
      - hw/misc/bcm2835_property.c
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-linux-v3d-witness-record
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RPI_FIRMWARE_COMMIT: 3d301dd924bcd758a4c8cb19fe8531031f033f43
      RPI_KERNEL_RELEASE: 6.18.44-v8+
      OFFICIAL_DIR: /tmp/vc4-linux-v3d-official
      MODULE_DIR: /tmp/vc4-linux-v3d-modules
      INITRAMFS_DIR: /tmp/vc4-linux-v3d-initramfs
      DTB_DIR: /tmp/vc4-linux-v3d-dtbs
      OUT_DIR: /tmp/vc4-linux-v3d-witness
      STATUS_PATH: VC4_LINUX_V3D_WITNESS_STATUS.json

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        id: dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            binutils-aarch64-linux-gnu \
            cpio curl device-tree-compiler file \
            gcc-aarch64-linux-gnu gzip libdrm-dev \
            libc6-dev-arm64-cross linux-libc-dev-arm64-cross \
            ninja-build pkg-config python3 \
            libglib2.0-dev libpixman-1-dev xz-utils zlib1g-dev zstd
          rm -rf \
            "$OFFICIAL_DIR" "$MODULE_DIR" "$INITRAMFS_DIR" \
            "$DTB_DIR" "$OUT_DIR"
          mkdir -p "$OFFICIAL_DIR" "$DTB_DIR" "$OUT_DIR"

      - name: Validate changed sources
        id: source
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/vc4/raspi3-linux-probe.py \
            scripts/vc4/fetch-linux-vc4-modules.py
          bash -n \
            scripts/vc4/build-linux-v3d-modular-initramfs.sh \
            scripts/vc4/build-v3d-linux-dtb.sh
          git diff --check

      - name: Fetch pinned kernel and device tree
        id: pinned
        run: |
          set -euo pipefail
          for file in kernel8.img bcm2710-rpi-3-b.dtb; do
            curl --fail --location --retry 5 \
              --output "$OFFICIAL_DIR/$file" \
              "https://raw.githubusercontent.com/raspberrypi/firmware/${RPI_FIRMWARE_COMMIT}/boot/$file"
          done
          test "$(git hash-object "$OFFICIAL_DIR/kernel8.img")" = \
            a694aa64988bbecadc770c874488165303eac673
          test "$(git hash-object "$OFFICIAL_DIR/bcm2710-rpi-3-b.dtb")" = \
            398c480adc49a5fcb03aa4c095ea74db5d1f893b

      - name: Build pinned VC4 module fixture
        id: fixture
        run: |
          set -euo pipefail
          python3 scripts/vc4/fetch-linux-vc4-modules.py \
            --base-url \
            "https://raw.githubusercontent.com/raspberrypi/firmware/${RPI_FIRMWARE_COMMIT}/modules/${RPI_KERNEL_RELEASE}" \
            --out-dir "$MODULE_DIR" \
            --target vc4
          bash scripts/vc4/build-linux-v3d-modular-initramfs.sh \
            "$INITRAMFS_DIR" "$MODULE_DIR"

      - name: Build render-oriented VC4 device tree
        id: dtb
        run: |
          set -euo pipefail
          dtc -q -@ -I dts -O dtb \
            -o "$DTB_DIR/render-only.dtbo" \
            tests/vc4/vc4-render-only-overlay.dts
          bash scripts/vc4/build-v3d-linux-dtb.sh \
            "$OFFICIAL_DIR/bcm2710-rpi-3-b.dtb" \
            "$DTB_DIR/render-only.dtbo" \
            "$DTB_DIR/render-only.dtb"

      - name: Build QEMU AArch64 frontend
        id: build
        run: |
          set -euo pipefail
          ./configure \
            --target-list=aarch64-softmmu \
            --disable-docs --disable-werror
          ninja -C build qemu-system-aarch64

      - name: Boot Linux through the complete DRM witness
        id: runtime
        run: |
          set -euo pipefail
          python3 scripts/vc4/raspi3-linux-probe.py \
            --mode linux-direct \
            --qemu build/qemu-system-aarch64 \
            --kernel "$OFFICIAL_DIR/kernel8.img" \
            --dtb "$DTB_DIR/render-only.dtb" \
            --initrd "$INITRAMFS_DIR/initramfs.cpio.gz" \
            --out-dir "$OUT_DIR" \
            --seconds 45 --sample-interval 5

      - name: Verify the complete DRM witness
        id: verification
        run: |
          set -euo pipefail
          serial="$OUT_DIR/serial.log"
          for marker in \
            VC4_LINUX_MODULE_LOAD_DONE \
            VC4_LINUX_MODULE_CLOSURE_OK \
            VC4_LINUX_DRM_IDENT_OK \
            VC4_LINUX_DRM_CREATE_BO_OK \
            VC4_LINUX_DRM_MMAP_BO_OK \
            VC4_LINUX_DRM_UAPI_OK \
            VC4_LINUX_DRM_SUBMIT_CL_OK \
            VC4_LINUX_DRM_SUBMIT_WAIT_OK \
            VC4_LINUX_DRM_SUBMIT_PIXELS_OK \
            VC4_LINUX_DRM_SUBMIT_OK \
            VC4_LINUX_V3D_MODULAR_DONE \
            VC4_LINUX_V3D_MODULAR_OK \
            VC4_LINUX_FB_OK; do
            grep -Fq "$marker" "$serial"
          done
          grep -Eq 'VC4_LINUX_DRM_(CARD0|RENDER128)_OK' "$serial"

          python3 - "$OUT_DIR/result.json" <<'PY'
          import json
          import pathlib
          import sys

          result = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert result.get("passed") is True, result
          assert result.get("init_seen") is True, result
          assert result.get("framebuffer_marker_seen") is True, result
          assert result.get("screenshot", {}).get("quadrants_match") is True, result
          assert result.get("elapsed_seconds", 999) < 45, result
          print(json.dumps(result, indent=2))
          PY

      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-linux-v3d-witness-record
          path: /tmp/vc4-linux-v3d-witness
          if-no-files-found: warn

      - name: Record exact witness status
        if: always()
        env:
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          PINNED_OUTCOME: ${{ steps.pinned.outcome }}
          FIXTURE_OUTCOME: ${{ steps.fixture.outcome }}
          DTB_OUTCOME: ${{ steps.dtb.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
          VERIFICATION_OUTCOME: ${{ steps.verification.outcome }}
        run: |
          set -euo pipefail
          python3 - "$OUT_DIR/result.json" "$OUT_DIR/serial.log" "$STATUS_PATH" <<'PY'
          import datetime
          import json
          import os
          import pathlib
          import sys

          result_path = pathlib.Path(sys.argv[1])
          serial_path = pathlib.Path(sys.argv[2])
          status_path = pathlib.Path(sys.argv[3])
          result = json.loads(result_path.read_text()) if result_path.is_file() else {}
          serial = serial_path.read_text(errors="replace") if serial_path.is_file() else ""
          expected_markers = [
              "VC4_LINUX_MODULE_LOAD_DONE",
              "VC4_LINUX_MODULE_CLOSURE_OK",
              "VC4_LINUX_DRM_IDENT_OK",
              "VC4_LINUX_DRM_CREATE_BO_OK",
              "VC4_LINUX_DRM_MMAP_BO_OK",
              "VC4_LINUX_DRM_UAPI_OK",
              "VC4_LINUX_DRM_SUBMIT_CL_OK",
              "VC4_LINUX_DRM_SUBMIT_WAIT_OK",
              "VC4_LINUX_DRM_SUBMIT_PIXELS_OK",
              "VC4_LINUX_DRM_SUBMIT_OK",
              "VC4_LINUX_V3D_MODULAR_DONE",
              "VC4_LINUX_V3D_MODULAR_OK",
              "VC4_LINUX_FB_OK",
          ]
          outcomes = {
              "dependencies": os.environ.get("DEPENDENCIES_OUTCOME", "unknown"),
              "source": os.environ.get("SOURCE_OUTCOME", "unknown"),
              "pinned": os.environ.get("PINNED_OUTCOME", "unknown"),
              "fixture": os.environ.get("FIXTURE_OUTCOME", "unknown"),
              "dtb": os.environ.get("DTB_OUTCOME", "unknown"),
              "build": os.environ.get("BUILD_OUTCOME", "unknown"),
              "runtime": os.environ.get("RUNTIME_OUTCOME", "unknown"),
              "verification": os.environ.get("VERIFICATION_OUTCOME", "unknown"),
          }
          markers = {marker: marker in serial for marker in expected_markers}
          node_seen = (
              "VC4_LINUX_DRM_CARD0_OK" in serial
              or "VC4_LINUX_DRM_RENDER128_OK" in serial
          )
          passed = (
              all(value == "success" for value in outcomes.values())
              and result.get("passed") is True
              and all(markers.values())
              and node_seen
          )
          record = {
              "schema_version": 1,
              "generated_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "source_sha": os.environ.get("GITHUB_SHA"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "passed": passed,
              "outcomes": outcomes,
              "markers": markers,
              "node_seen": node_seen,
              "result": result,
              "serial_tail": serial.splitlines()[-240:],
          }
          status_path.write_text(json.dumps(record, indent=2, sort_keys=True) + "\n")
          print(json.dumps(record, indent=2, sort_keys=True))
          PY

          passed=$(python3 -c \
            'import json,sys; print("true" if json.load(open(sys.argv[1]))["passed"] else "false")' \
            "$STATUS_PATH")
          if [ "$passed" = true ]; then
            rm -f .github/workflows/vc4-linux-v3d-witness-record.yml
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- "$STATUS_PATH"
          if [ "$passed" = true ]; then
            git add -u -- .github/workflows/vc4-linux-v3d-witness-record.yml
          fi
          if ! git diff --cached --quiet; then
            git commit -m "test/vc4: record Linux DRM witness [skip ci]"
            git push
          fi
          test "$passed" = true
