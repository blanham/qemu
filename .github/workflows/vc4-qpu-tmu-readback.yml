name: VC4 QPU TMU readback contract

on:
  push:
    branches:
      - agent/vc4-fragment-varying-tmu
    paths:
      - .github/workflows/vc4-qpu-tmu-readback.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-qpu-tmu-readback
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BRANCH: agent/vc4-fragment-varying-tmu
      EVIDENCE: vc4-qpu-tmu-readback-evidence
      STATUS: VC4_QPU_TMU_READBACK_STATUS.json

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev libpixman-1-dev \
            ninja-build pkg-config python3 zlib1g-dev
          rm -rf "$EVIDENCE"
          mkdir -p "$EVIDENCE"

      - name: Materialize architectural QPU contract
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/vc4/materialize-qpu-tmu-readback.py
          python3 scripts/vc4/materialize-qpu-tmu-readback.py \
            2>&1 | tee "$EVIDENCE/materialize.log"
          python3 scripts/vc4/materialize-qpu-tmu-readback.py \
            2>&1 | tee "$EVIDENCE/idempotence.log"
          git diff --check
          git diff -- \
            include/hw/display/vc4_qpu_exec.h \
            hw/display/vc4_qpu_exec.c \
            tests/unit/test-vc4-qpu.c \
            > "$EVIDENCE/product.patch"
          test -s "$EVIDENCE/product.patch"

      - name: Configure and build both QEMU frontends
        run: |
          set -euo pipefail
          ./configure \
            --target-list=aarch64-softmmu,vc4-softmmu \
            --disable-docs --disable-werror \
            2>&1 | tee "$EVIDENCE/configure.log"
          ninja -C build \
            qemu-system-aarch64 qemu-system-vc4 \
            tests/unit/test-vc4-qpu \
            tests/unit/test-vc4-qpu-contract \
            tests/unit/test-vc4-v3d-pipeline \
            tests/unit/test-vc4-tiling \
            2>&1 | tee "$EVIDENCE/build.log"

      - name: Run focused and preserved regressions
        run: |
          set -euo pipefail
          build/tests/unit/test-vc4-qpu --tap -k \
            2>&1 | tee "$EVIDENCE/qpu.tap"
          grep -Fq 'ok 11 /vc4/qpu/mesa-readback-tmu' \
            "$EVIDENCE/qpu.tap"
          build/tests/unit/test-vc4-qpu-contract --tap -k \
            2>&1 | tee "$EVIDENCE/qpu-contract.tap"
          build/tests/unit/test-vc4-v3d-pipeline --tap -k \
            2>&1 | tee "$EVIDENCE/v3d-pipeline.tap"
          build/tests/unit/test-vc4-tiling --tap -k \
            2>&1 | tee "$EVIDENCE/tiling.tap"
          python3 scripts/vc4/v3d-smoke.py \
            --qemu build/qemu-system-aarch64 \
            2>&1 | tee "$EVIDENCE/v3d-smoke.log"
          python3 scripts/vc4/msync-smoke.py \
            --qemu build/qemu-system-aarch64 \
            2>&1 | tee "$EVIDENCE/msync.log"

      - name: Record validated product status
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import hashlib
          import json
          import os
          import subprocess

          files = [
              'include/hw/display/vc4_qpu_exec.h',
              'hw/display/vc4_qpu_exec.c',
              'tests/unit/test-vc4-qpu.c',
          ]
          status = {
              'schema_version': 1,
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'source_sha': os.environ.get('GITHUB_SHA', ''),
              'run_id': os.environ.get('GITHUB_RUN_ID', ''),
              'validated': True,
              'mesa_source_modified': False,
              'contracts': {
                  'varying_c_commits_after_issuing_instruction': True,
                  'tmu0_t_s_request': True,
                  'implicit_texture_p0_p1_uniforms': True,
                  'tmu0_load_to_r4': True,
                  'r4_unorm8_unpack_8a_8d': True,
                  'mul_unorm8_pack_8a_8d': True,
                  'measured_readback_shader_exact_color': '0xffdf8020',
              },
              'tests': [
                  'test-vc4-qpu',
                  'test-vc4-qpu-contract',
                  'test-vc4-v3d-pipeline',
                  'test-vc4-tiling',
                  'v3d-smoke',
                  'msync-smoke',
              ],
              'files': {},
          }
          for name in files:
              data = Path(name).read_bytes()
              status['files'][name] = hashlib.sha256(data).hexdigest()
          Path(os.environ['STATUS']).write_text(
              json.dumps(status, indent=2, sort_keys=True) + '\n'
          )
          PY
          cp "$STATUS" "$EVIDENCE/"

      - name: Publish clean product commit
        run: |
          set -euo pipefail
          git config user.name 'VC4 CI'
          git config user.email 'vc4-ci@users.noreply.github.com'
          git add -- \
            include/hw/display/vc4_qpu_exec.h \
            hw/display/vc4_qpu_exec.c \
            tests/unit/test-vc4-qpu.c \
            "$STATUS"
          git diff --cached --check
          git commit -m 'hw/display: execute bounded VC4 TMU readback shader'
          product_sha=$(git rev-parse HEAD)
          printf '%s\n' "$product_sha" > "$EVIDENCE/PRODUCT_SHA"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            if git rebase "origin/$BRANCH" && \
               git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            git rebase --abort || true
            sleep 2
          done
          exit 1

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-qpu-tmu-readback-${{ github.run_attempt }}
          path: |
            VC4_QPU_TMU_READBACK_STATUS.json
            vc4-qpu-tmu-readback-evidence
          if-no-files-found: warn
          retention-days: 14
