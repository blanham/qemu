name: Record VC4 p-register validation

on:
  push:
    branches:
      - agent/vc4-preg-mutex
    paths:
      - .github/workflows/vc4-preg-mutex-status.yml

permissions:
  contents: write

jobs:
  validate-and-record:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/vc4-preg-mutex
          fetch-depth: 0

      - name: Synchronize with landed decoder
        run: |
          for attempt in $(seq 1 120); do
            git fetch origin agent/vc4-preg-mutex
            if git show FETCH_HEAD:target/vc4/translate.c | \
                 grep -q '(i1 & 0xffe0) == 0xcc20'; then
              git reset --hard FETCH_HEAD
              exit 0
            fi
            sleep 5
          done
          echo "processor-control decoder did not land" >&2
          exit 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libglib2.0-dev \
            libpixman-1-dev \
            meson \
            ninja-build \
            pkg-config \
            python3

      - name: Configure and build VC4
        run: |
          mkdir build-vc4-preg-status
          cd build-vc4-preg-status
          ../configure \
            --target-list=vc4-softmmu \
            --disable-docs \
            --disable-gtk \
            --disable-sdl \
            --disable-werror
          ninja qemu-system-vc4

      - name: Execute p-register firmware
        run: |
          python3 -m py_compile scripts/vc4/preg-mutex-smoke.py
          python3 scripts/vc4/preg-mutex-smoke.py \
            --qemu build-vc4-preg-status/qemu-system-vc4

      - name: Record validated commit
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          commit = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          status = {
              "schema": 1,
              "source_commit": commit,
              "result": "pass",
              "coverage": {
                  "p16_first_claim": 0,
                  "p16_reclaim_while_held": 1,
                  "p16_claim_after_release": 0,
                  "p17_first_claim": 0,
                  "p17_reclaim_while_held": 1,
                  "p0_latch_round_trip": 1,
                  "p15_outstanding_reads": 0,
              },
          }
          Path("VC4_PREG_MUTEX_STATUS.json").write_text(
              json.dumps(status, indent=2) + "\n"
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add VC4_PREG_MUTEX_STATUS.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci/vc4: record p-register smoke status [skip ci]"
          git push origin HEAD:agent/vc4-preg-mutex
