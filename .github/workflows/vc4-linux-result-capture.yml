name: VC4 Linux bring-up result capture

on:
  push:
    branches:
      - agent/vc4-linux-bringup
    paths:
      - .github/workflows/vc4-linux-result-capture.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: vc4-linux-result-capture
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TARGET_BRANCH: agent/vc4-linux-bringup
      TARGET_SHA: b61c317cf258b2e636e1daccc0bf8eb9861411b5
      TARGET_WORKFLOW: vc4-linux-bringup.yml

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Wait for and capture the bring-up artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          from io import BytesIO
          from pathlib import Path
          from zipfile import ZipFile
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          repo = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          branch = os.environ['TARGET_BRANCH']
          target_sha = os.environ['TARGET_SHA']
          workflow = os.environ['TARGET_WORKFLOW']
          api = f'https://api.github.com/repos/{repo}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'vc4-linux-result-capture',
          }

          def request_json(url: str) -> dict:
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=90) as response:
                  return json.load(response)

          def request_bytes(url: str) -> bytes:
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=300) as response:
                  return response.read()

          query = urllib.parse.urlencode({
              'branch': branch,
              'event': 'push',
              'per_page': 30,
          })
          runs_url = f'{api}/actions/workflows/{workflow}/runs?{query}'
          deadline = time.monotonic() + 55 * 60
          selected = None
          recent = []
          while time.monotonic() < deadline:
              payload = request_json(runs_url)
              recent = payload.get('workflow_runs', [])
              selected = next(
                  (run for run in recent
                   if run.get('head_sha') == target_sha),
                  None,
              )
              if selected is not None and selected.get('status') == 'completed':
                  break
              time.sleep(15)

          if selected is None or selected.get('status') != 'completed':
              raise SystemExit(
                  f'bring-up run for {target_sha} did not complete; recent={recent[:5]}'
              )

          run_id = selected['id']
          artifacts = request_json(
              f'{api}/actions/runs/{run_id}/artifacts?per_page=100'
          ).get('artifacts', [])
          artifact = next(
              (item for item in artifacts
               if str(item.get('name', '')).startswith('vc4-linux-bringup-')
               and not item.get('expired')),
              None,
          )

          capture = {
              'schema_version': 1,
              'captured_at': datetime.now(timezone.utc).isoformat(),
              'run': {
                  key: selected.get(key)
                  for key in (
                      'id', 'name', 'head_branch', 'head_sha', 'status',
                      'conclusion', 'event', 'run_number', 'run_attempt',
                      'created_at', 'updated_at', 'html_url'
                  )
              },
              'artifact': None,
          }

          if artifact is not None:
              capture['artifact'] = {
                  key: artifact.get(key)
                  for key in (
                      'id', 'name', 'size_in_bytes', 'created_at',
                      'updated_at', 'digest'
                  )
              }
              blob = request_bytes(artifact['archive_download_url'])
              with ZipFile(BytesIO(blob)) as archive:
                  archive.extractall('/tmp/vc4-linux-captured')
              root = Path('/tmp/vc4-linux-captured')
              json_candidates = list(root.rglob('VC4_LINUX_BRINGUP_STATUS.json'))
              md_candidates = list(root.rglob('VC4_LINUX_BRINGUP_STATUS.md'))
              if json_candidates and md_candidates:
                  Path('VC4_LINUX_BRINGUP_STATUS.json').write_bytes(
                      json_candidates[0].read_bytes()
                  )
                  Path('VC4_LINUX_BRINGUP_STATUS.md').write_bytes(
                      md_candidates[0].read_bytes()
                  )

          if not Path('VC4_LINUX_BRINGUP_STATUS.json').is_file():
              classification = (
                  'workflow-failed-before-artifact'
                  if selected.get('conclusion') != 'success'
                  else 'workflow-completed-without-result-artifact'
              )
              fallback = {
                  'schema_version': 1,
                  'classification': classification,
                  'capture': capture,
              }
              Path('VC4_LINUX_BRINGUP_STATUS.json').write_text(
                  json.dumps(fallback, indent=2, sort_keys=True) + '\n'
              )
              Path('VC4_LINUX_BRINGUP_STATUS.md').write_text(
                  '# VC4 Linux and framebuffer bring-up\n\n'
                  f'Classification: **`{classification}`**\n\n'
                  f'Workflow run: `{run_id}`; conclusion: '
                  f'`{selected.get("conclusion")}`.\n'
              )

          Path('VC4_LINUX_BRINGUP_CAPTURE.json').write_text(
              json.dumps(capture, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(capture, indent=2, sort_keys=True))
          PY

      - name: Publish the recoverable frontier
        run: |
          set -euo pipefail
          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git add -- \
            VC4_LINUX_BRINGUP_STATUS.json \
            VC4_LINUX_BRINGUP_STATUS.md \
            VC4_LINUX_BRINGUP_CAPTURE.json
          git commit -m "ci/vc4: record Linux bring-up frontier [skip ci]"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin HEAD:"$TARGET_BRANCH"

      - name: Upload captured metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-linux-result-capture-${{ github.run_attempt }}
          path: |
            VC4_LINUX_BRINGUP_STATUS.json
            VC4_LINUX_BRINGUP_STATUS.md
            VC4_LINUX_BRINGUP_CAPTURE.json
          if-no-files-found: warn
          retention-days: 14
