name: VC4 QPU varying FIFO product v2

on:
  push:
    branches:
      - agent/vc4-linux-mesa-gles2-frontier
    paths:
      - .github/workflows/vc4-varying-fifo-product-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-qpu-varying-fifo-product-v2
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_BRANCH: agent/vc4-linux-mesa-gles2-frontier
      CANDIDATE_BRANCH: agent/vc4-qpu-varying-fifo
      EVIDENCE: /tmp/vc4-varying-fifo-product-v2
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev libpixman-1-dev \
            ninja-build pkg-config python3 zlib1g-dev
          rm -rf "$EVIDENCE"
          mkdir -p "$EVIDENCE"

      - name: Materialize architectural varying FIFO support
        id: materialize
        run: |
          set -euo pipefail
          git fetch origin "$CANDIDATE_BRANCH"
          candidate=$(git rev-parse FETCH_HEAD)
          printf '%s\n' "$candidate" > "$EVIDENCE/CANDIDATE_SHA"
          helper=$(git ls-tree -r --name-only "$candidate" | \
            grep -E '^scripts/vc4/.*varying.*fifo.*\.py$' | head -n 1 || true)
          test -n "$helper"
          printf '%s\n' "$helper" > "$EVIDENCE/HELPER_PATH"
          git show "$candidate:$helper" > /tmp/vc4-materialize-varying-fifo.py
          python3 -m py_compile /tmp/vc4-materialize-varying-fifo.py
          python3 /tmp/vc4-materialize-varying-fifo.py \
            2>&1 | tee "$EVIDENCE/materialize.log"

          git diff --check
          git diff --name-only | sort > "$EVIDENCE/CHANGED_FILES"
          python3 - <<'PY'
          from pathlib import Path
          allowed = {
              'hw/display/vc4_qpu_exec.c',
              'include/hw/display/vc4_qpu_exec.h',
              'tests/unit/test-vc4-qpu.c',
              'tests/unit/test-vc4-qpu-contract.c',
          }
          changed = {
              line.strip()
              for line in Path('/tmp/vc4-varying-fifo-product-v2/CHANGED_FILES').read_text().splitlines()
              if line.strip()
          }
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit('unexpected materializer paths: ' + ', '.join(unexpected))
          PY

          grep -Fq 'VC4_QPU_EXEC_FAULT_VARYING_READ' \
            include/hw/display/vc4_qpu_exec.h
          grep -Fq 'VC4_QPU_REG_VARYING' hw/display/vc4_qpu_exec.c
          grep -Fq 'vc4_qpu_exec_set_varyings' \
            include/hw/display/vc4_qpu_exec.h
          grep -Fq 'state->accumulator[5]' hw/display/vc4_qpu_exec.c

      - name: Build both QEMU frontends and focused regressions
        run: |
          set -euo pipefail
          ./configure \
            --target-list=aarch64-softmmu,vc4-softmmu \
            --disable-docs --disable-werror \
            2>&1 | tee "$EVIDENCE/configure.log"
          ninja -C build \
            qemu-system-aarch64 qemu-system-vc4 \
            tests/unit/test-vc4-qpu \
            tests/unit/test-vc4-qpu-contract \
            tests/unit/test-vc4-tiling \
            tests/unit/test-vc4-v3d-pipeline \
            2>&1 | tee "$EVIDENCE/build.log"

      - name: Run architectural regressions
        run: |
          set -euo pipefail
          build/tests/unit/test-vc4-qpu --tap -k \
            2>&1 | tee "$EVIDENCE/qpu.tap"
          build/tests/unit/test-vc4-qpu-contract --tap -k \
            2>&1 | tee "$EVIDENCE/qpu-contract.tap"
          build/tests/unit/test-vc4-tiling --tap -k \
            2>&1 | tee "$EVIDENCE/tiling.tap"
          build/tests/unit/test-vc4-v3d-pipeline --tap -k \
            2>&1 | tee "$EVIDENCE/v3d-pipeline.tap"
          python3 scripts/vc4/v3d-smoke.py \
            --qemu build/qemu-system-aarch64 \
            2>&1 | tee "$EVIDENCE/v3d-smoke.log"

      - name: Publish product commit and retire materializer
        id: publish
        run: |
          set -euo pipefail
          git config user.name 'VC4 CI'
          git config user.email 'vc4-ci@users.noreply.github.com'

          product_files=(
            hw/display/vc4_qpu_exec.c
            include/hw/display/vc4_qpu_exec.h
            tests/unit/test-vc4-qpu.c
            tests/unit/test-vc4-qpu-contract.c
          )
          git add -- "${product_files[@]}"
          if ! git diff --cached --quiet; then
            git commit -m 'hw/display: implement VC4 QPU varying FIFO reads'
            git rev-parse HEAD > "$EVIDENCE/PRODUCT_SHA"
          else
            printf '%s\n' "$(git rev-parse HEAD)" > "$EVIDENCE/PRODUCT_SHA"
            printf '%s\n' already-present > "$EVIDENCE/PRODUCT_STATE"
          fi

          git rm .github/workflows/vc4-varying-fifo-product-v2.yml
          git commit -m 'ci/vc4: retire varying FIFO materializer [skip ci]'

          for attempt in 1 2 3; do
            git fetch origin "$TARGET_BRANCH"
            if git rebase "origin/$TARGET_BRANCH"; then
              if git push origin "HEAD:$TARGET_BRANCH"; then
                printf '%s\n' published > "$EVIDENCE/PUBLISH_STATE"
                exit 0
              fi
            else
              git rebase --abort || true
              exit 1
            fi
            sleep 2
          done
          exit 1

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-varying-fifo-product-v2-${{ github.run_attempt }}
          path: /tmp/vc4-varying-fifo-product-v2
          if-no-files-found: warn
          retention-days: 14
