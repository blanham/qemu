name: VC4 multicore-sync integration v2

on:
  push:
    branches:
      - agent/vc4-post-preg-arm-release
    paths:
      - .github/workflows/vc4-msync-integration-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-msync-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integrate-build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/vc4-post-preg-arm-release
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build pkg-config python3 python3-venv \
            libglib2.0-dev libpixman-1-dev zlib1g-dev

      - name: Materialize and wire the device
        run: |
          set -euo pipefail
          if ! test -f include/hw/misc/bcm2835_msync.h || \
             ! test -f hw/misc/bcm2835_msync.c; then
            git fetch origin agent/vc4-preg-mutex
            git show FETCH_HEAD:include/hw/misc/bcm2835_msync.h \
              > include/hw/misc/bcm2835_msync.h
            git show FETCH_HEAD:hw/misc/bcm2835_msync.c \
              > hw/misc/bcm2835_msync.c
          fi

          python3 - <<'PY'
          from pathlib import Path

          def insert_once(path: str, anchor: str, addition: str,
                          *, before: bool = False) -> None:
              p = Path(path)
              text = p.read_text()
              if addition in text:
                  return
              if anchor not in text:
                  raise SystemExit(f'{path}: missing anchor {anchor!r}')
              replacement = addition + anchor if before else anchor + addition
              p.write_text(text.replace(anchor, replacement, 1))

          insert_once(
              'include/hw/arm/bcm2835_peripherals.h',
              '#include "hw/misc/bcm2835_mphi.h"\n',
              '#include "hw/misc/bcm2835_msync.h"\n',
          )
          insert_once(
              'include/hw/arm/bcm2835_peripherals.h',
              '    BCM2835SystemTimerState systmr;\n',
              '    BCM2835MSyncState msync;\n',
              before=True,
          )

          init = (
              '    /* Multicore synchronization */\n'
              '    object_initialize_child(obj, "msync", &s->msync,\n'
              '                            TYPE_BCM2835_MSYNC);\n\n'
          )
          insert_once(
              'hw/arm/bcm2835_peripherals.c',
              '    /* Interrupt Controller */\n'
              '    object_initialize_child(obj, "ic", &s->ic, '
              'TYPE_BCM2835_IC);\n\n',
              init,
              before=True,
          )

          realize = (
              '    /* Multicore synchronization */\n'
              '    if (!sysbus_realize(SYS_BUS_DEVICE(&s->msync), errp)) {\n'
              '        return;\n'
              '    }\n'
              '    memory_region_add_subregion(\n'
              '        &s->peri_mr, MSYNC_OFFSET,\n'
              '        sysbus_mmio_get_region(SYS_BUS_DEVICE(&s->msync), 0));\n'
              '    for (n = 0; n < BCM2835_MSYNC_IRQ_COUNT; n++) {\n'
              '        sysbus_connect_irq(\n'
              '            SYS_BUS_DEVICE(&s->msync), n,\n'
              '            qdev_get_gpio_in_named(DEVICE(&s->ic),\n'
              '                                   BCM2835_IC_GPU_IRQ,\n'
              '                                   INTERRUPT_MULTICORESYNC0 + n));\n'
              '    }\n\n'
          )
          insert_once(
              'hw/arm/bcm2835_peripherals.c',
              '    sysbus_pass_irq(SYS_BUS_DEVICE(s), '
              'SYS_BUS_DEVICE(&s->ic));\n\n',
              realize,
          )

          insert_once(
              'hw/misc/meson.build',
              "  'bcm2835_mphi.c',\n",
              "  'bcm2835_msync.c',\n",
          )
          PY

          cat > scripts/vc4/msync-smoke.py <<'PY'
          #!/usr/bin/env python3
          """Exercise BCM2835 multicore-sync through the qtest socket."""

          from __future__ import annotations

          import argparse
          from pathlib import Path
          import socket
          import subprocess
          import tempfile
          import time

          OFF_SEMA3 = 0x00C
          OFF_SEMA4 = 0x010
          OFF_STATUS = 0x080
          OFF_IREQ0 = 0x084
          OFF_ICSET0 = 0x090
          OFF_ICCLR0 = 0x098
          OFF_MBOX0 = 0x0A0
          OFF_MBOX7 = 0x0BC
          OFF_VPUSEMA0 = 0x0C0
          OFF_VPUSTAT = 0x0C8


          class QTest:
              def __init__(self, path: Path) -> None:
                  self.sock = socket.socket(socket.AF_UNIX,
                                            socket.SOCK_STREAM)
                  self.sock.connect(str(path))
                  self.file = self.sock.makefile('rwb', buffering=0)

              def command(self, command: str) -> list[str]:
                  self.file.write(command.encode('ascii') + b'\n')
                  reply = self.file.readline()
                  if not reply:
                      raise RuntimeError(
                          f'qtest closed during {command!r}'
                      )
                  fields = reply.decode(
                      'ascii', errors='replace'
                  ).strip().split()
                  if not fields or fields[0] != 'OK':
                      raise RuntimeError(
                          f'qtest rejected {command!r}: {fields!r}'
                      )
                  return fields

              def readl(self, address: int) -> int:
                  fields = self.command(f'readl 0x{address:x}')
                  if len(fields) != 2:
                      raise RuntimeError(
                          f'malformed qtest read reply: {fields!r}'
                      )
                  return int(fields[1], 0)

              def writel(self, address: int, value: int) -> None:
                  self.command(
                      f'writel 0x{address:x} 0x{value & 0xffffffff:x}'
                  )

              def close(self) -> None:
                  self.file.close()
                  self.sock.close()


          def wait_for_qtest(path: Path,
                             proc: subprocess.Popen[bytes]) -> QTest:
              deadline = time.monotonic() + 15
              last_error: OSError | None = None
              while time.monotonic() < deadline:
                  if proc.poll() is not None:
                      raise RuntimeError(
                          f'QEMU exited early with {proc.returncode}'
                      )
                  try:
                      return QTest(path)
                  except (FileNotFoundError,
                          ConnectionRefusedError) as exc:
                      last_error = exc
                      time.sleep(0.02)
              raise TimeoutError(
                  f'qtest socket unavailable: {path}'
              ) from last_error


          def expect(actual: int, expected: int, label: str) -> None:
              if actual != expected:
                  raise AssertionError(
                      f'{label}: got 0x{actual:08x}, '
                      f'expected 0x{expected:08x}'
                  )


          def stop(proc: subprocess.Popen[bytes]) -> None:
              if proc.poll() is not None:
                  return
              proc.terminate()
              try:
                  proc.wait(timeout=3)
              except subprocess.TimeoutExpired:
                  proc.kill()
                  proc.wait(timeout=3)


          def exercise(qtest: QTest, base: int) -> None:
              read = lambda offset: qtest.readl(base + offset)
              write = lambda offset, value: qtest.writel(
                  base + offset, value
              )

              expect(read(OFF_STATUS), 0, 'reset semaphore status')
              expect(read(OFF_SEMA3), 0, 'first semaphore claim')
              expect(read(OFF_STATUS), 1 << 3,
                     'claimed semaphore status')
              expect(read(OFF_SEMA3), 1, 'repeated semaphore claim')
              write(OFF_SEMA3, 0xDEADBEEF)
              expect(read(OFF_STATUS), 0,
                     'release ignores the write value')

              write(OFF_IREQ0, 1 << 4)
              expect(read(OFF_IREQ0), 1 << 4,
                     'interrupt request mask')
              expect(read(OFF_SEMA4), 0,
                     'selected semaphore claim')
              write(OFF_SEMA4, 0)

              write(OFF_ICSET0, 1)
              expect(read(OFF_ICSET0), 1, 'inter-core request set')
              write(OFF_ICCLR0, 1)
              expect(read(OFF_ICCLR0), 0, 'inter-core request clear')

              write(OFF_MBOX0, 0x01234567)
              write(OFF_MBOX7, 0x89ABCDEF)
              expect(read(OFF_MBOX0), 0x01234567,
                     'mailbox zero round trip')
              expect(read(OFF_MBOX7), 0x89ABCDEF,
                     'mailbox seven round trip')

              expect(read(OFF_VPUSEMA0), 0,
                     'first VPU semaphore claim')
              expect(read(OFF_VPUSEMA0), 1,
                     'repeated VPU semaphore claim')
              write(OFF_VPUSEMA0, 0xFFFFFFFF)
              expect(read(OFF_VPUSEMA0), 0,
                     'VPU semaphore release')
              write(OFF_VPUSEMA0, 0)
              expect(read(OFF_VPUSTAT), 0, 'single-VPU status')


          def main() -> int:
              parser = argparse.ArgumentParser()
              parser.add_argument('--qemu', required=True, type=Path)
              args = parser.parse_args()
              if not args.qemu.is_file():
                  parser.error(f'not a file: {args.qemu}')

              with tempfile.TemporaryDirectory(
                  prefix='vc4-msync-'
              ) as tmp_s:
                  tmp = Path(tmp_s)
                  qtest_path = tmp / 'qtest.sock'
                  stderr_path = tmp / 'qemu.stderr'
                  command = [
                      str(args.qemu.resolve()),
                      '-M', 'raspi3b-vc4-hetero',
                      '-m', '1G',
                      '-smp', '5',
                      '-accel', 'tcg,thread=single',
                      '-display', 'none',
                      '-monitor', 'none',
                      '-serial', 'none',
                      '-S',
                      '-qtest',
                      f'unix:{qtest_path},server=on,wait=off',
                  ]
                  with stderr_path.open('wb') as stderr:
                      proc = subprocess.Popen(
                          command,
                          stdout=subprocess.DEVNULL,
                          stderr=stderr,
                      )
                  qtest: QTest | None = None
                  try:
                      qtest = wait_for_qtest(qtest_path, proc)
                      exercise(qtest, 0x3F000000)
                  except Exception:
                      text = stderr_path.read_text(
                          encoding='utf-8', errors='replace'
                      )
                      raise RuntimeError(
                          'multicore-sync smoke failed; QEMU stderr:\n'
                          + text
                      )
                  finally:
                      if qtest is not None:
                          qtest.close()
                      stop(proc)

                  text = stderr_path.read_text(
                      encoding='utf-8', errors='replace'
                  )
                  unexpected = [
                      line for line in text.splitlines()
                      if 'bcm2835-msync: unimplemented' in line
                  ]
                  if unexpected:
                      raise AssertionError('\n'.join(unexpected))

              print('BCM2835 multicore-sync smoke test passed')
              return 0


          if __name__ == '__main__':
              raise SystemExit(main())
          PY
          chmod +x scripts/vc4/msync-smoke.py
          python3 -m py_compile scripts/vc4/msync-smoke.py
          git diff --check

      - name: Configure and build both affected targets
        run: |
          mkdir -p build-msync-v2
          cd build-msync-v2
          ../configure \
            --target-list=vc4-softmmu,aarch64-softmmu \
            --disable-docs \
            --disable-werror
          ninja qemu-system-vc4 qemu-system-aarch64

      - name: Run architectural and MMIO smoke tests
        run: |
          if test -f scripts/vc4/preg-mutex-smoke.py; then
            python3 scripts/vc4/preg-mutex-smoke.py \
              --qemu build-msync-v2/qemu-system-vc4
          fi
          python3 scripts/vc4/msync-smoke.py \
            --qemu build-msync-v2/qemu-system-vc4

      - name: Commit only after validation
        run: |
          set -euo pipefail
          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git rm -f \
            .github/workflows/vc4-msync-integration.yml \
            .github/workflows/vc4-msync-integration-v2.yml \
            2>/dev/null || true
          git add \
            include/hw/misc/bcm2835_msync.h \
            hw/misc/bcm2835_msync.c \
            include/hw/arm/bcm2835_peripherals.h \
            hw/arm/bcm2835_peripherals.c \
            hw/misc/meson.build \
            scripts/vc4/msync-smoke.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "hw/misc: model BCM2835 multicore synchronization"
          git pull --rebase origin agent/vc4-post-preg-arm-release
          git push origin HEAD:agent/vc4-post-preg-arm-release
