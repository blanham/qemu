name: VC4 V3D focused diagnostics

on:
  push:
    branches:
      - agent/vc4-v3d-bringup
    paths:
      - .github/workflows/vc4-v3d-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-v3d-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build pkg-config python3 python3-venv \
            libglib2.0-dev libpixman-1-dev zlib1g-dev

      - name: Materialize integration
        id: materialize
        shell: bash
        run: |
          set +e
          python3 -m py_compile \
            scripts/vc4/v3d-integrate.py \
            scripts/vc4/v3d-smoke.py \
            scripts/vc4/preg-mutex-smoke.py \
            scripts/vc4/msync-smoke.py \
            >/tmp/vc4-v3d-materialize.log 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            python3 scripts/vc4/v3d-integrate.py \
              >>/tmp/vc4-v3d-materialize.log 2>&1
            rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            python3 scripts/vc4/v3d-integrate.py \
              >>/tmp/vc4-v3d-materialize.log 2>&1
            rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            git diff --check >>/tmp/vc4-v3d-materialize.log 2>&1
            rc=$?
          fi
          echo "rc=$rc" >>"$GITHUB_OUTPUT"
          exit 0

      - name: Configure and build
        id: build
        shell: bash
        run: |
          set +e
          if [ "${{ steps.materialize.outputs.rc }}" != 0 ]; then
            echo "configure_rc=125" >>"$GITHUB_OUTPUT"
            echo "build_rc=125" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          ./configure \
            --target-list=aarch64-softmmu,vc4-softmmu \
            --disable-docs --disable-werror \
            >/tmp/vc4-v3d-configure.log 2>&1
          configure_rc=$?
          build_rc=125
          if [ "$configure_rc" -eq 0 ]; then
            ninja -C build qemu-system-aarch64 qemu-system-vc4 \
              >/tmp/vc4-v3d-build.log 2>&1
            build_rc=$?
          fi
          echo "configure_rc=$configure_rc" >>"$GITHUB_OUTPUT"
          echo "build_rc=$build_rc" >>"$GITHUB_OUTPUT"
          exit 0

      - name: Run focused regressions
        id: smoke
        shell: bash
        run: |
          set +e
          preg_rc=125
          msync_rc=125
          v3d_rc=125
          if [ "${{ steps.build.outputs.build_rc }}" -eq 0 ]; then
            python3 scripts/vc4/preg-mutex-smoke.py \
              --qemu build/qemu-system-vc4 \
              >/tmp/vc4-v3d-preg.log 2>&1
            preg_rc=$?
            python3 scripts/vc4/msync-smoke.py \
              --qemu build/qemu-system-aarch64 \
              >/tmp/vc4-v3d-msync.log 2>&1
            msync_rc=$?
            python3 scripts/vc4/v3d-smoke.py \
              --qemu build/qemu-system-aarch64 \
              >/tmp/vc4-v3d-smoke.log 2>&1
            v3d_rc=$?
          fi
          echo "preg_rc=$preg_rc" >>"$GITHUB_OUTPUT"
          echo "msync_rc=$msync_rc" >>"$GITHUB_OUTPUT"
          echo "v3d_rc=$v3d_rc" >>"$GITHUB_OUTPUT"
          exit 0

      - name: Record diagnostics
        id: record
        shell: bash
        env:
          MATERIALIZE_RC: ${{ steps.materialize.outputs.rc }}
          CONFIGURE_RC: ${{ steps.build.outputs.configure_rc }}
          BUILD_RC: ${{ steps.build.outputs.build_rc }}
          PREG_RC: ${{ steps.smoke.outputs.preg_rc }}
          MSYNC_RC: ${{ steps.smoke.outputs.msync_rc }}
          V3D_RC: ${{ steps.smoke.outputs.v3d_rc }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import os

          def tail(path, lines=160):
              item = Path(path)
              if not item.is_file():
                  return []
              return item.read_text(
                  encoding='utf-8', errors='replace'
              ).splitlines()[-lines:]

          codes = {
              'materialize': int(os.environ.get('MATERIALIZE_RC') or 125),
              'configure': int(os.environ.get('CONFIGURE_RC') or 125),
              'build': int(os.environ.get('BUILD_RC') or 125),
              'preg': int(os.environ.get('PREG_RC') or 125),
              'msync': int(os.environ.get('MSYNC_RC') or 125),
              'v3d': int(os.environ.get('V3D_RC') or 125),
          }
          passed = all(value == 0 for value in codes.values())
          status = {
              'schema_version': 1,
              'source_sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'passed': passed,
              'return_codes': codes,
              'logs': {
                  'materialize': tail('/tmp/vc4-v3d-materialize.log'),
                  'configure': tail('/tmp/vc4-v3d-configure.log'),
                  'build': tail('/tmp/vc4-v3d-build.log', 240),
                  'preg': tail('/tmp/vc4-v3d-preg.log'),
                  'msync': tail('/tmp/vc4-v3d-msync.log'),
                  'v3d': tail('/tmp/vc4-v3d-smoke.log'),
              },
          }
          Path('VC4_V3D_DIAGNOSTICS.json').write_text(
              json.dumps(status, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(status, indent=2, sort_keys=True))
          PY

      - name: Publish diagnostic record
        run: |
          set -euo pipefail
          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git rm -- .github/workflows/vc4-v3d-diagnostics.yml
          git add -- VC4_V3D_DIAGNOSTICS.json
          git diff --cached --check
          git commit -m "ci/vc4: record focused V3D diagnostics [skip ci]"
          git pull --rebase origin agent/vc4-v3d-bringup
          git push origin HEAD:agent/vc4-v3d-bringup
