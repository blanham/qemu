name: VC4 page-flip audit repair

on:
  push:
    branches:
      - agent/vc4-linux-kms-bind-diagnostics
    paths:
      - .github/workflows/vc4-pageflip-audit-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/vc4-linux-kms-bind-diagnostics
          fetch-depth: 1

      - name: Make static marker audit diagnostic
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/vc4-kms-pageflip-probe.yml")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          slash = chr(92)

          anchor = next(
              index
              for index, line in enumerate(lines)
              if line.strip() ==
              "- name: Build the page-flip initramfs and native-KMS DTB"
          )
          starts = [
              index
              for index in range(anchor + 1, len(lines))
              if lines[index].strip() == "for marker in " + slash
          ]
          if len(starts) != 1:
              raise SystemExit(
                  f"expected one marker loop after build step, found {len(starts)}"
              )
          start = starts[0]
          end = next(
              index
              for index in range(start + 1, len(lines))
              if lines[index].strip() == "done"
          )
          if 'grep -Fq "$marker" "$INITRAMFS_DIR/init.strings"' not in lines[end - 1]:
              raise SystemExit("unexpected marker-loop body")

          indent = lines[start][: len(lines[start]) - len(lines[start].lstrip())]
          inner = indent + "  "
          deeper = inner + "  "
          marker_lines = lines[start + 1:end - 1]
          replacement = [
              f"{indent}missing_markers=0\n",
              f"{indent}for marker in {slash}\n",
              *marker_lines,
              f'{inner}if ! grep -Fq "$marker" "$INITRAMFS_DIR/init.strings"; then\n',
              f"{deeper}printf 'page-flip marker absent from init.strings: %s\\n' {slash}\n",
              f'{deeper}  "$marker" >&2\n',
              f"{deeper}missing_markers=$((missing_markers + 1))\n",
              f"{inner}fi\n",
              f"{indent}done\n",
              f'{indent}if [ "$missing_markers" -ne 0 ]; then\n',
              f"{inner}printf 'continuing to runtime probe despite %s missing static marker(s)\\n' {slash}\n",
              f'{inner}  "$missing_markers" >&2\n',
              f"{indent}fi\n",
          ]
          path.write_text(
              "".join(lines[:start] + replacement + lines[end + 1:]),
              encoding="utf-8",
          )
          PY

          git diff --check
          grep -Fq 'missing_markers=0' \
            .github/workflows/vc4-kms-pageflip-probe.yml
          grep -Fq 'continuing to runtime probe' \
            .github/workflows/vc4-kms-pageflip-probe.yml

          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git rm .github/workflows/vc4-pageflip-audit-repair.yml
          git add .github/workflows/vc4-kms-pageflip-probe.yml
          git commit -m "ci/vc4: make page-flip marker audit diagnostic"
          git pull --rebase origin agent/vc4-linux-kms-bind-diagnostics
          git push origin HEAD:agent/vc4-linux-kms-bind-diagnostics
