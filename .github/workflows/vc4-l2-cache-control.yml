name: VC4 L2 cache-control model

on:
  push:
    branches:
      - agent/vc4-l2-cache-control
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-l2-cache-control:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RPI_FIRMWARE_COMMIT: 3d301dd924bcd758a4c8cb19fe8531031f033f43

    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl ninja-build pkg-config python3 python3-venv \
            libglib2.0-dev libpixman-1-dev zlib1g-dev

      - name: Materialize the VideoCore L2 cache-control model
        run: |
          cat > include/hw/misc/bcm2835_l2cc.h <<'EOF'
          /*
           * BCM2835 VideoCore L2 cache-control block
           *
           * SPDX-License-Identifier: GPL-2.0-or-later
           */
          #ifndef HW_MISC_BCM2835_L2CC_H
          #define HW_MISC_BCM2835_L2CC_H

          #include "hw/core/sysbus.h"
          #include "qom/object.h"

          #define TYPE_BCM2835_L2CC "bcm2835-l2cc"
          OBJECT_DECLARE_SIMPLE_TYPE(BCM2835L2CCState, BCM2835_L2CC)

          #define BCM2835_L2CC_MMIO_SIZE 0x1000

          struct BCM2835L2CCState {
              SysBusDevice parent_obj;

              MemoryRegion iomem;
              uint32_t control;
              uint32_t flush_start;
              uint32_t flush_end;
              uint32_t alias_exception;
              uint32_t alias_exception_id;
              uint32_t alias_exception_addr;
              uint32_t rd_hits;
              uint32_t rd_misses;
              uint32_t wr_hits;
              uint32_t wr_misses;
              uint32_t wr_backs;
              uint32_t in_flight;
              uint32_t stalls;
              uint32_t tag_stalls;
              uint32_t sd_stalls;
          };

          #endif /* HW_MISC_BCM2835_L2CC_H */
          EOF

          cat > hw/misc/bcm2835_l2cc.c <<'EOF'
          /*
           * BCM2835 VideoCore L2 cache-control block
           *
           * The VideoCore firmware programs a cache-line range, starts an L2
           * operation through CONTROL.FLUSH, and polls that command bit until
           * hardware clears it.  QEMU has no separately visible VideoCore L2
           * cache at this boundary, so the operation completes synchronously
           * while every persistent control field remains latched.
           *
           * SPDX-License-Identifier: GPL-2.0-or-later
           */

          #include "qemu/osdep.h"
          #include "hw/misc/bcm2835_l2cc.h"
          #include "migration/vmstate.h"
          #include "qemu/log.h"
          #include "trace.h"

          #define R_CONTROL               0x000
          #define R_FLUSH_START           0x004
          #define R_FLUSH_END             0x008
          #define R_ALIAS_EXCEPTION       0x080
          #define R_ALIAS_EXCEPTION_ID    0x084
          #define R_ALIAS_EXCEPTION_ADDR  0x088
          #define R_RD_HITS               0x100
          #define R_RD_MISSES             0x104
          #define R_WR_HITS               0x108
          #define R_WR_MISSES             0x10c
          #define R_WR_BACKS              0x110
          #define R_IN_FLIGHT             0x114
          #define R_STALLS                0x11c
          #define R_TAG_STALLS            0x120
          #define R_SD_STALLS             0x124

          #define CONTROL_MASK            0x00ff0c3f
          #define CONTROL_FLUSH           (1u << 2)
          #define FLUSH_ADDRESS_MASK      0x0fffffe0
          #define IN_FLIGHT_MASK          0x0000000f

          static uint64_t bcm2835_l2cc_read(void *opaque, hwaddr offset,
                                            unsigned size)
          {
              BCM2835L2CCState *s = BCM2835_L2CC(opaque);
              uint32_t value;

              switch (offset) {
              case R_CONTROL:
                  value = s->control;
                  break;
              case R_FLUSH_START:
                  value = s->flush_start;
                  break;
              case R_FLUSH_END:
                  value = s->flush_end;
                  break;
              case R_ALIAS_EXCEPTION:
                  value = s->alias_exception;
                  break;
              case R_ALIAS_EXCEPTION_ID:
                  value = s->alias_exception_id;
                  break;
              case R_ALIAS_EXCEPTION_ADDR:
                  value = s->alias_exception_addr;
                  break;
              case R_RD_HITS:
                  value = s->rd_hits;
                  break;
              case R_RD_MISSES:
                  value = s->rd_misses;
                  break;
              case R_WR_HITS:
                  value = s->wr_hits;
                  break;
              case R_WR_MISSES:
                  value = s->wr_misses;
                  break;
              case R_WR_BACKS:
                  value = s->wr_backs;
                  break;
              case R_IN_FLIGHT:
                  value = s->in_flight & IN_FLIGHT_MASK;
                  break;
              case R_STALLS:
                  value = s->stalls;
                  break;
              case R_TAG_STALLS:
                  value = s->tag_stalls;
                  break;
              case R_SD_STALLS:
                  value = s->sd_stalls;
                  break;
              default:
                  qemu_log_mask(LOG_UNIMP,
                                TYPE_BCM2835_L2CC
                                ": unimplemented read at 0x%03" HWADDR_PRIx
                                "\n", offset);
                  value = 0;
                  break;
              }

              trace_bcm2835_l2cc_read(offset, value);
              return value;
          }

          static void bcm2835_l2cc_read_only_write(hwaddr offset,
                                                   uint32_t value)
          {
              qemu_log_mask(LOG_GUEST_ERROR,
                            TYPE_BCM2835_L2CC
                            ": write to read-only register 0x%03" HWADDR_PRIx
                            " (value 0x%08x)\n", offset, value);
          }

          static void bcm2835_l2cc_write(void *opaque, hwaddr offset,
                                         uint64_t value, unsigned size)
          {
              BCM2835L2CCState *s = BCM2835_L2CC(opaque);
              uint32_t v = value;
              uint32_t result = 0;

              switch (offset) {
              case R_CONTROL:
                  /* FLUSH is a command bit and self-clears on completion. */
                  s->control = (v & CONTROL_MASK) & ~CONTROL_FLUSH;
                  result = s->control;
                  break;
              case R_FLUSH_START:
                  s->flush_start = v & FLUSH_ADDRESS_MASK;
                  result = s->flush_start;
                  break;
              case R_FLUSH_END:
                  s->flush_end = v & FLUSH_ADDRESS_MASK;
                  result = s->flush_end;
                  break;
              case R_ALIAS_EXCEPTION:
                  s->alias_exception = v;
                  result = s->alias_exception;
                  break;
              case R_RD_HITS:
                  /* This is the one architecturally writable counter. */
                  s->rd_hits = v;
                  result = s->rd_hits;
                  break;
              case R_ALIAS_EXCEPTION_ID:
              case R_ALIAS_EXCEPTION_ADDR:
              case R_RD_MISSES:
              case R_WR_HITS:
              case R_WR_MISSES:
              case R_WR_BACKS:
              case R_IN_FLIGHT:
              case R_STALLS:
              case R_TAG_STALLS:
              case R_SD_STALLS:
                  bcm2835_l2cc_read_only_write(offset, v);
                  break;
              default:
                  qemu_log_mask(LOG_UNIMP,
                                TYPE_BCM2835_L2CC
                                ": unimplemented write at 0x%03" HWADDR_PRIx
                                " (value 0x%08x)\n", offset, v);
                  break;
              }

              trace_bcm2835_l2cc_write(offset, v, result);
          }

          static const MemoryRegionOps bcm2835_l2cc_ops = {
              .read = bcm2835_l2cc_read,
              .write = bcm2835_l2cc_write,
              .impl.min_access_size = 4,
              .impl.max_access_size = 4,
              .valid.min_access_size = 4,
              .valid.max_access_size = 4,
              .endianness = DEVICE_LITTLE_ENDIAN,
          };

          static void bcm2835_l2cc_reset(DeviceState *dev)
          {
              BCM2835L2CCState *s = BCM2835_L2CC(dev);

              s->control = 0;
              s->flush_start = 0;
              s->flush_end = FLUSH_ADDRESS_MASK;
              s->alias_exception = 0;
              s->alias_exception_id = 0;
              s->alias_exception_addr = 0;
              s->rd_hits = 0;
              s->rd_misses = 0;
              s->wr_hits = 0;
              s->wr_misses = 0;
              s->wr_backs = 0;
              s->in_flight = 0;
              s->stalls = 0;
              s->tag_stalls = 0;
              s->sd_stalls = 0;
          }

          static void bcm2835_l2cc_realize(DeviceState *dev, Error **errp)
          {
              BCM2835L2CCState *s = BCM2835_L2CC(dev);

              memory_region_init_io(&s->iomem, OBJECT(s), &bcm2835_l2cc_ops, s,
                                    TYPE_BCM2835_L2CC,
                                    BCM2835_L2CC_MMIO_SIZE);
              sysbus_init_mmio(SYS_BUS_DEVICE(s), &s->iomem);
          }

          static const VMStateDescription bcm2835_l2cc_vmstate = {
              .name = TYPE_BCM2835_L2CC,
              .version_id = 1,
              .minimum_version_id = 1,
              .fields = (const VMStateField[]) {
                  VMSTATE_UINT32(control, BCM2835L2CCState),
                  VMSTATE_UINT32(flush_start, BCM2835L2CCState),
                  VMSTATE_UINT32(flush_end, BCM2835L2CCState),
                  VMSTATE_UINT32(alias_exception, BCM2835L2CCState),
                  VMSTATE_UINT32(alias_exception_id, BCM2835L2CCState),
                  VMSTATE_UINT32(alias_exception_addr, BCM2835L2CCState),
                  VMSTATE_UINT32(rd_hits, BCM2835L2CCState),
                  VMSTATE_UINT32(rd_misses, BCM2835L2CCState),
                  VMSTATE_UINT32(wr_hits, BCM2835L2CCState),
                  VMSTATE_UINT32(wr_misses, BCM2835L2CCState),
                  VMSTATE_UINT32(wr_backs, BCM2835L2CCState),
                  VMSTATE_UINT32(in_flight, BCM2835L2CCState),
                  VMSTATE_UINT32(stalls, BCM2835L2CCState),
                  VMSTATE_UINT32(tag_stalls, BCM2835L2CCState),
                  VMSTATE_UINT32(sd_stalls, BCM2835L2CCState),
                  VMSTATE_END_OF_LIST()
              }
          };

          static void bcm2835_l2cc_class_init(ObjectClass *klass,
                                              const void *data)
          {
              DeviceClass *dc = DEVICE_CLASS(klass);

              dc->realize = bcm2835_l2cc_realize;
              device_class_set_legacy_reset(dc, bcm2835_l2cc_reset);
              dc->vmsd = &bcm2835_l2cc_vmstate;
          }

          static const TypeInfo bcm2835_l2cc_info = {
              .name = TYPE_BCM2835_L2CC,
              .parent = TYPE_SYS_BUS_DEVICE,
              .instance_size = sizeof(BCM2835L2CCState),
              .class_init = bcm2835_l2cc_class_init,
          };

          static void bcm2835_l2cc_register_types(void)
          {
              type_register_static(&bcm2835_l2cc_info);
          }

          type_init(bcm2835_l2cc_register_types)
          EOF

          cat > tests/qtest/bcm2835-l2cc-test.c <<'EOF'
          /*
           * QTest testcase for the BCM2835 VideoCore L2 cache controller
           *
           * SPDX-License-Identifier: GPL-2.0-or-later
           */

          #include "qemu/osdep.h"
          #include "libqtest-single.h"

          #define L2CC_BASE             0x3fe01000u
          #define CONTROL               (L2CC_BASE + 0x000)
          #define FLUSH_START           (L2CC_BASE + 0x004)
          #define FLUSH_END             (L2CC_BASE + 0x008)
          #define ALIAS_EXCEPTION       (L2CC_BASE + 0x080)
          #define ALIAS_EXCEPTION_ID    (L2CC_BASE + 0x084)
          #define ALIAS_EXCEPTION_ADDR  (L2CC_BASE + 0x088)
          #define RD_HITS               (L2CC_BASE + 0x100)
          #define RD_MISSES             (L2CC_BASE + 0x104)
          #define WR_HITS               (L2CC_BASE + 0x108)
          #define WR_MISSES             (L2CC_BASE + 0x10c)
          #define WR_BACKS              (L2CC_BASE + 0x110)
          #define IN_FLIGHT             (L2CC_BASE + 0x114)
          #define STALLS                (L2CC_BASE + 0x11c)
          #define TAG_STALLS            (L2CC_BASE + 0x120)
          #define SD_STALLS             (L2CC_BASE + 0x124)

          static void test_reset_masks_and_flush_completion(void)
          {
              g_assert_cmphex(readl(CONTROL), ==, 0);
              g_assert_cmphex(readl(FLUSH_START), ==, 0);
              g_assert_cmphex(readl(FLUSH_END), ==, 0x0fffffe0);
              g_assert_cmphex(readl(ALIAS_EXCEPTION), ==, 0);
              g_assert_cmphex(readl(ALIAS_EXCEPTION_ID), ==, 0);
              g_assert_cmphex(readl(ALIAS_EXCEPTION_ADDR), ==, 0);
              g_assert_cmphex(readl(RD_HITS), ==, 0);
              g_assert_cmphex(readl(RD_MISSES), ==, 0);
              g_assert_cmphex(readl(WR_HITS), ==, 0);
              g_assert_cmphex(readl(WR_MISSES), ==, 0);
              g_assert_cmphex(readl(WR_BACKS), ==, 0);
              g_assert_cmphex(readl(IN_FLIGHT), ==, 0);
              g_assert_cmphex(readl(STALLS), ==, 0);
              g_assert_cmphex(readl(TAG_STALLS), ==, 0);
              g_assert_cmphex(readl(SD_STALLS), ==, 0);

              writel(FLUSH_START, 0xffffffff);
              writel(FLUSH_END, 0x8123457f);
              g_assert_cmphex(readl(FLUSH_START), ==, 0x0fffffe0);
              g_assert_cmphex(readl(FLUSH_END), ==, 0x01234560);

              /* FLUSH completes synchronously; persistent fields survive. */
              writel(CONTROL, 0xffffffff);
              g_assert_cmphex(readl(CONTROL), ==, 0x00ff0c3b);
              writel(CONTROL, 0x00000014);
              g_assert_cmphex(readl(CONTROL), ==, 0x00000010);

              writel(ALIAS_EXCEPTION, 0xdeadbeef);
              g_assert_cmphex(readl(ALIAS_EXCEPTION), ==, 0xdeadbeef);
              writel(RD_HITS, 0x12345678);
              g_assert_cmphex(readl(RD_HITS), ==, 0x12345678);
          }

          int main(int argc, char **argv)
          {
              int ret;

              g_test_init(&argc, &argv, NULL);
              g_test_add_func("/bcm2835/l2cc/reset-masks-flush-completion",
                              test_reset_masks_and_flush_completion);
              qtest_start("-M raspi3b");
              ret = g_test_run();
              qtest_end();
              return ret;
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          def ensure(path: str, old: str, new: str, label: str) -> None:
              file = Path(path)
              text = file.read_text()
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              file.write_text(text.replace(old, new, 1))

          ensure(
              'include/hw/arm/bcm2835_peripherals.h',
              '#include "hw/misc/bcm2835_l1cc.h"\n'
              '#include "hw/misc/bcm2835_powermgt.h"\n',
              '#include "hw/misc/bcm2835_l1cc.h"\n'
              '#include "hw/misc/bcm2835_l2cc.h"\n'
              '#include "hw/misc/bcm2835_powermgt.h"\n',
              'L2CC header include')
          ensure(
              'include/hw/arm/bcm2835_peripherals.h',
              '    BCM2835L1CCState l1cc;\n'
              '    PL011State uart0;\n',
              '    BCM2835L1CCState l1cc;\n'
              '    BCM2835L2CCState l2cc;\n'
              '    PL011State uart0;\n',
              'L2CC state member')

          ensure(
              'hw/arm/bcm2835_peripherals.c',
              '    /* VideoCore L1 cache controller */\n'
              '    object_initialize_child(obj, "l1cc", &s->l1cc, '
              'TYPE_BCM2835_L1CC);\n\n'
              '    /* SDRAM controller plus address/data PHY status windows */\n',
              '    /* VideoCore L1 cache controller */\n'
              '    object_initialize_child(obj, "l1cc", &s->l1cc, '
              'TYPE_BCM2835_L1CC);\n\n'
              '    /* VideoCore L2 cache controller */\n'
              '    object_initialize_child(obj, "l2cc", &s->l2cc, '
              'TYPE_BCM2835_L2CC);\n\n'
              '    /* SDRAM controller plus address/data PHY status windows */\n',
              'L2CC child initialization')
          ensure(
              'hw/arm/bcm2835_peripherals.c',
              '    memory_region_add_subregion(\n'
              '        &s->peri_mr, L1CC_OFFSET,\n'
              '        sysbus_mmio_get_region(SYS_BUS_DEVICE(&s->l1cc), 0));\n\n'
              '    /* SDRAM controller, address PHY, and data PHY. */\n',
              '    memory_region_add_subregion(\n'
              '        &s->peri_mr, L1CC_OFFSET,\n'
              '        sysbus_mmio_get_region(SYS_BUS_DEVICE(&s->l1cc), 0));\n\n'
              '    /* VideoCore L2 cache controller */\n'
              '    if (!sysbus_realize(SYS_BUS_DEVICE(&s->l2cc), errp)) {\n'
              '        return;\n'
              '    }\n'
              '    memory_region_add_subregion(\n'
              '        &s->peri_mr, L2CC_OFFSET,\n'
              '        sysbus_mmio_get_region(SYS_BUS_DEVICE(&s->l2cc), 0));\n\n'
              '    /* SDRAM controller, address PHY, and data PHY. */\n',
              'L2CC realization')

          ensure(
              'hw/misc/meson.build',
              "  'bcm2835_l1cc.c',\n  'bcm2835_powermgt.c',\n",
              "  'bcm2835_l1cc.c',\n  'bcm2835_l2cc.c',\n"
              "  'bcm2835_powermgt.c',\n",
              'L2CC build integration')

          trace = Path('hw/misc/trace-events')
          trace_text = trace.read_text()
          events = (
              '\n# bcm2835_l2cc.c\n'
              'bcm2835_l2cc_read(uint64_t offset, uint32_t value) '
              '"offset 0x%03" PRIx64 " value 0x%08x"\n'
              'bcm2835_l2cc_write(uint64_t offset, uint32_t value, '
              'uint32_t result) "offset 0x%03" PRIx64 '
              '" value 0x%08x result 0x%08x"\n'
          )
          if '# bcm2835_l2cc.c\n' not in trace_text:
              trace.write_text(trace_text.rstrip() + '\n' + events)

          ensure(
              'tests/qtest/meson.build',
              "['bcm2835-dbus-test', 'bcm2835-dma-test', "
              "'bcm2835-i2c-test', 'bcm2835-l1cc-test', "
              "'bcm2835-sdhost-test']",
              "['bcm2835-dbus-test', 'bcm2835-dma-test', "
              "'bcm2835-i2c-test', 'bcm2835-l1cc-test', "
              "'bcm2835-l2cc-test', 'bcm2835-sdhost-test']",
              'L2CC qtest registration')
          PY

          git diff --check
          git status --short

      - name: Add temporary L2CC events to the stock-firmware tracer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/vc4/raspi3-stock-bootcode-mmio.py')
          text = path.read_text()
          old = '    "usb_port_reset",\n)\n'
          new = (
              '    "usb_port_reset",\n'
              '    "bcm2835_l2cc_read",\n'
              '    "bcm2835_l2cc_write",\n'
              ')\n'
          )
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit('stock trace event anchor missing')
              path.write_text(text.replace(old, new, 1))
          PY
          python3 -m py_compile scripts/vc4/raspi3-stock-bootcode-mmio.py

      - name: Download pinned official firmware trio
        run: |
          for file in bootcode.bin start.elf fixup.dat; do
            curl --fail --location --retry 4 \
              --output "/tmp/${file}" \
              "https://raw.githubusercontent.com/raspberrypi/firmware/${RPI_FIRMWARE_COMMIT}/boot/${file}"
          done
          test "$(git hash-object /tmp/bootcode.bin)" = \
            7642d2d89e4235e7d68875ff70688bdde6e71b5a
          test "$(git hash-object /tmp/start.elf)" = \
            0cefcf3a756740760f9903f35cc3843117853712
          test "$(git hash-object /tmp/fixup.dat)" = \
            1845e38de9d4f9a6d9ad7f5273bfe58b2582a7e6

      - name: Check stock-firmware probes
        run: |
          python3 -m py_compile \
            scripts/vc4/raspi3-stock-bootcode-probe.py \
            scripts/vc4/raspi3-stock-bootcode-state.py \
            scripts/vc4/raspi3-stock-bootcode-0200.py \
            scripts/vc4/raspi3-stock-bootcode-mmio.py \
            scripts/vc4/stock_bootcode_progress.py
          python3 scripts/vc4/stock_bootcode_progress.py

      - name: Configure and build emulator and L2CC qtest
        run: |
          ./configure \
            --target-list=aarch64-softmmu \
            --disable-docs \
            --disable-werror
          ninja -C build \
            qemu-system-aarch64 \
            tests/qtest/bcm2835-l2cc-test

      - name: Exercise L2 cache-control semantics through QTest
        run: |
          QTEST_QEMU_BINARY="$PWD/build/qemu-system-aarch64" \
            build/tests/qtest/bcm2835-l2cc-test

      - name: Run official firmware through the L2 flush frontier
        run: |
          set -o pipefail
          out=/tmp/vc4-l2-cache-control
          rm -rf "$out"
          mkdir -p "$out"

          python3 scripts/vc4/raspi3-stock-bootcode-mmio.py \
            build/qemu-system-aarch64 \
            /tmp/bootcode.bin \
            --start-elf /tmp/start.elf \
            --fixup-dat /tmp/fixup.dat \
            --seconds 60 \
            --trace-samples 260 \
            --trace-interval 0.05 \
            --qemu-debug in_asm \
            --qemu-debug-filter 0x60008040..0x60008400 \
            --out-dir "$out" 2>&1 | tee "$out/probe.log"

          test -s "$out/qemu-mmio.log"
          test -s "$out/probe.log"

      - name: Assert flush completion and capture the next frontier
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path
          import re

          out = Path('/tmp/vc4-l2-cache-control')
          trace = (out / 'qemu-mmio.log').read_text(
              encoding='utf-8', errors='replace'
          ).splitlines()
          probe = (out / 'probe.log').read_text(
              encoding='utf-8', errors='replace'
          ).splitlines()

          if any(line.startswith('VC4_LOW_PC_WRITE ') for line in probe):
              raise SystemExit('unexpected low-memory PC write')

          writes = [
              line for line in trace
              if line.startswith('bcm2835_l2cc_write')
          ]
          reads = [
              line for line in trace
              if line.startswith('bcm2835_l2cc_read')
          ]
          if not any(
              'offset 0x000 value 0x00000014 result 0x00000010' in line
              for line in writes
          ):
              raise SystemExit('official L2 flush command was not observed')
          if not any(
              'offset 0x000 value 0x00000010' in line
              for line in reads
          ):
              raise SystemExit('official L2 flush poll did not observe completion')

          barrier = next((
              line for line in reversed(probe)
              if line.startswith('STOCK_BOOTCODE_BARRIER ')
          ), None)
          barrier_pc = None
          if barrier is not None:
              match = re.search(r'\bpc=0x([0-9a-fA-F]+)', barrier)
              if not match:
                  raise SystemExit(f'barrier has no PC: {barrier}')
              barrier_pc = int(match.group(1), 16)
              if barrier_pc == 0x60008068:
                  raise SystemExit('official firmware remained in the L2 poll')

          progress = None
          for line in probe:
              if line.startswith('STOCK_BOOTCODE_PROGRESS '):
                  progress = json.loads(line.split(' ', 1)[1])
          if progress is None:
              raise SystemExit('missing stock progress record')

          diagnostics = [
              line for line in trace
              if ('bcm2835-l2cc:' in line or
                  'bcm2835_l2cc_' in line)
          ]
          unmodeled = [
              line for line in trace
              if ('bcm2835-l2cc: unimplemented' in line or
                  'bcm2835-l2cc: write to read-only' in line)
          ]
          summary = {
              'schema_version': 1,
              'old_frontier_crossed': True,
              'barrier_pc': (
                  None if barrier_pc is None else f'0x{barrier_pc:08x}'
              ),
              'l2cc_write_count': len(writes),
              'l2cc_read_count': len(reads),
              'l2cc_writes': writes,
              'l2cc_reads': reads[-120:],
              'unmodeled_l2cc_accesses': unmodeled,
              'l2cc_diagnostics': diagnostics[-160:],
              'barrier': barrier,
              'progress': progress,
          }
          (out / 'summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Commit validated L2 cache-control model
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            hw/arm/bcm2835_peripherals.c \
            hw/misc/bcm2835_l2cc.c \
            hw/misc/meson.build \
            hw/misc/trace-events \
            include/hw/arm/bcm2835_peripherals.h \
            include/hw/misc/bcm2835_l2cc.h \
            tests/qtest/bcm2835-l2cc-test.c \
            tests/qtest/meson.build
          git rm .github/workflows/vc4-l2-cache-control.yml
          git commit -m 'hw/misc: model BCM2835 VideoCore L2 cache control'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload L2 cache-control validation frontier
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-l2-cache-control-${{ github.run_attempt }}
          path: /tmp/vc4-l2-cache-control
          if-no-files-found: warn
          retention-days: 14
