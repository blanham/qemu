name: VC4 Linux V3D witness cleanup

on:
  push:
    branches:
      - agent/vc4-linux-v3d-witness-cleanup
    paths:
      - .github/workflows/vc4-linux-v3d-witness-cleanup.yml
      - scripts/vc4/summarize-linux-v3d-modular.py
      - scripts/vc4/summarize-linux-v3d-uapi.py
      - tests/vc4/linux-v3d-modular-init.c
      - tests/vc4/linux-v3d-submit-init.c
      - tests/vc4/linux-v3d-uapi-init.c
      - tests/vc4/test-modular-summary.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-linux-v3d-witness-cleanup
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install cross-build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            binutils-aarch64-linux-gnu \
            file \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            libdrm-dev \
            linux-libc-dev-arm64-cross \
            python3

      - name: Validate summarizers and marker semantics
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/vc4/summarize-linux-v3d-modular.py \
            scripts/vc4/summarize-linux-v3d-uapi.py \
            tests/vc4/test-modular-summary.py
          python3 tests/vc4/test-modular-summary.py

      - name: Cross-build the self-terminating witness
        run: |
          set -euo pipefail
          aarch64-linux-gnu-gcc \
            -static -O2 -g0 -Wall -Wextra -Werror -fno-ident \
            -I/usr/include/libdrm \
            -Wl,--build-id=none \
            -o /tmp/vc4-linux-v3d-modular-init \
            tests/vc4/linux-v3d-modular-init.c
          file /tmp/vc4-linux-v3d-modular-init
          file /tmp/vc4-linux-v3d-modular-init | \
            grep -Fq 'ELF 64-bit LSB executable, ARM aarch64'
          strings /tmp/vc4-linux-v3d-modular-init > /tmp/init.strings
          for marker in \
            VC4_LINUX_DRM_RENDER128_OK \
            VC4_LINUX_DRM_CREATE_BO_OK \
            VC4_LINUX_DRM_MMAP_BO_OK \
            VC4_LINUX_DRM_GEM_MEMORY_OK \
            VC4_LINUX_DRM_SUBMIT_CL_OK \
            VC4_LINUX_DRM_SUBMIT_WAIT_OK \
            VC4_LINUX_V3D_MODULAR_OK \
            VC4_LINUX_V3D_MODULAR_REBOOT; do
            grep -Fq "$marker" /tmp/init.strings
          done

      - name: Check repository hygiene
        run: |
          set -euo pipefail
          git diff --check

      - name: Publish successful cleanup validation
        env:
          REF_NAME: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          import os

          status = {
              "schema_version": 1,
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "source_sha": os.environ["SOURCE_SHA"],
              "run_id": os.environ["RUN_ID"],
              "run_attempt": os.environ["RUN_ATTEMPT"],
              "passed": True,
              "checks": {
                  "python_compile": "success",
                  "summary_regressions": "success",
                  "aarch64_static_build": "success",
                  "required_markers": "success",
                  "diff_check": "success",
              },
          }
          Path("VC4_LINUX_V3D_WITNESS_CLEANUP_STATUS.json").write_text(
              json.dumps(status, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(status, indent=2, sort_keys=True))
          PY

          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git add -- VC4_LINUX_V3D_WITNESS_CLEANUP_STATUS.json
          git commit -m 'ci/vc4: record witness cleanup validation [skip ci]'
          git pull --rebase origin "$REF_NAME"
          git push origin "HEAD:$REF_NAME"
