name: VC4 post-boundary dispatch

on:
  push:
    branches:
      - agent/vc4-hetero-direct-linux
    paths:
      - .github/workflows/vc4-post-boundary-dispatch.yml
      - VC4_POST_BOUNDARY_LINUX_STATUS.json
      - VC4_DIRECT_ARM_BOUNDARY_STATUS.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select continuation
        id: select
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          import os

          post_path = Path('VC4_POST_BOUNDARY_LINUX_STATUS.json')
          boundary_path = Path('VC4_DIRECT_ARM_BOUNDARY_STATUS.json')
          post = json.loads(post_path.read_text()) if post_path.is_file() else {}
          boundary = (
              json.loads(boundary_path.read_text())
              if boundary_path.is_file() else {}
          )
          classification = post.get('classification')
          if classification == 'linux-framebuffer-scanout':
              action = 'promote-linux-framebuffer'
              branch = 'agent/vc4-linux-framebuffer-bringup'
          elif classification == 'linux-framebuffer-device-missing':
              action = 'enable-linux-legacy-framebuffer'
              branch = 'agent/vc4-linux-fb-device-fix'
          elif classification == 'linux-framebuffer-paint-blocked':
              action = 'repair-linux-framebuffer-mapping'
              branch = 'agent/vc4-linux-fb-mapping-fix'
          elif classification == 'linux-init-framebuffer-unclassified':
              action = 'trace-linux-framebuffer-registration'
              branch = 'agent/vc4-linux-fb-registration'
          elif classification == 'linux-kernel-initramfs-blocked':
              action = 'repair-linux-initramfs-handoff'
              branch = 'agent/vc4-linux-initramfs-fix'
          elif classification == 'linux-entry-or-console-blocked':
              action = 'repair-linux-image-entry'
              branch = 'agent/vc4-linux-image-entry-fix'
          else:
              action = 'repair-linux-probe-infrastructure'
              branch = 'agent/vc4-linux-probe-fix'
          status = {
              'schema_version': 1,
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'source_sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'post_boundary_classification': classification,
              'next_action': action,
              'continuation_branch': branch,
              'post_boundary_status': post,
              'direct_arm_boundary_status': boundary,
          }
          Path('VC4_POST_BOUNDARY_DISPATCH.json').write_text(
              json.dumps(status, indent=2, sort_keys=True) + '\n'
          )
          Path('VC4_POST_BOUNDARY_DISPATCH.md').write_text(
              '# VC4 post-boundary dispatch\n\n'
              f'Observed: **`{classification}`**\n\n'
              f'Next action: **`{action}`**\n\n'
              f'Continuation branch: `{branch}`\n'
          )
          print(json.dumps({
              'classification': classification,
              'next_action': action,
              'branch': branch,
          }, indent=2))
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'action={action}\n')
              output.write(f'branch={branch}\n')
          PY

      - name: Publish dispatch
        env:
          ACTION: ${{ steps.select.outputs.action }}
          BRANCH: ${{ steps.select.outputs.branch }}
        run: |
          set -euo pipefail
          cp VC4_POST_BOUNDARY_DISPATCH.json /tmp/post-dispatch.json
          cp VC4_POST_BOUNDARY_DISPATCH.md /tmp/post-dispatch.md
          git reset --hard "$GITHUB_SHA"
          cp /tmp/post-dispatch.json VC4_POST_BOUNDARY_DISPATCH.json
          cp /tmp/post-dispatch.md VC4_POST_BOUNDARY_DISPATCH.md
          git rm .github/workflows/vc4-post-boundary-dispatch.yml
          git add \
            VC4_POST_BOUNDARY_DISPATCH.json \
            VC4_POST_BOUNDARY_DISPATCH.md
          git diff --cached --check
          git config user.name 'VC4 CI'
          git config user.email 'vc4-ci@users.noreply.github.com'
          git commit -m "ci/vc4: dispatch ${ACTION} [skip ci]"
          git pull --rebase origin agent/vc4-hetero-direct-linux
          git push origin HEAD:agent/vc4-hetero-direct-linux
          git push --force-with-lease origin HEAD:"$BRANCH"
