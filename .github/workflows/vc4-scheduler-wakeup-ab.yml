name: VC4 scheduler wake-up A/B

on:
  push:
    branches:
      - agent/vc4-post-preg-arm-release
    paths:
      - .github/workflows/vc4-scheduler-wakeup-ab.yml
      - scripts/vc4/scheduler-ab.py
      - VC4_FRONTIER_CLASSIFICATION.json
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: vc4-scheduler-wakeup-ab
  cancel-in-progress: false

jobs:
  scheduler-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Check out post-preg evidence branch
        uses: actions/checkout@v5
        with:
          ref: agent/vc4-post-preg-arm-release
          fetch-depth: 0

      - name: Read frontier classification
        id: frontier
        run: |
          set -euo pipefail
          if ! test -f VC4_FRONTIER_CLASSIFICATION.json; then
            echo ready=false >> "$GITHUB_OUTPUT"
            echo classification=pending >> "$GITHUB_OUTPUT"
            exit 0
          fi
          classification=$(python3 - <<'PY'
          import json
          print(json.load(open('VC4_FRONTIER_CLASSIFICATION.json'))[
              'classification'
          ])
          PY
          )
          echo ready=true >> "$GITHUB_OUTPUT"
          echo "classification=$classification" >> "$GITHUB_OUTPUT"

      - name: Install QEMU build dependencies
        if: steps.frontier.outputs.classification == 'silent-halt'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            pkg-config \
            python3 \
            python3-venv \
            libglib2.0-dev \
            libpixman-1-dev \
            zlib1g-dev

      - name: Prepare silent-halt continuation branch
        if: steps.frontier.outputs.classification == 'silent-halt'
        id: prepare
        env:
          SOURCE_SHA: ${{ github.sha }}
          NEXT_BRANCH: agent/vc4-post-msync-silent-halt
        run: |
          set -euo pipefail
          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git fetch origin "$NEXT_BRANCH" || true
          if git show-ref --verify --quiet \
             "refs/remotes/origin/$NEXT_BRANCH"; then
            git checkout -B scheduler-ab "origin/$NEXT_BRANCH"
            git merge --no-edit "$SOURCE_SHA"
          else
            git checkout -b scheduler-ab "$SOURCE_SHA"
          fi
          git checkout "$SOURCE_SHA" -- scripts/vc4/scheduler-ab.py
          python3 -m py_compile scripts/vc4/scheduler-ab.py
          echo "branch=$NEXT_BRANCH" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Recover the exact stock-firmware SD image
        if: steps.frontier.outputs.classification == 'silent-halt'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          from io import BytesIO
          from pathlib import Path
          from zipfile import ZipFile, BadZipFile
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          api = f'https://api.github.com/repos/{repo}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'vc4-scheduler-ab',
          }

          def get_json(url: str) -> dict:
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=90) as response:
                  return json.load(response)

          def get_bytes(url: str) -> bytes:
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=240) as response:
                  return response.read()

          def images_in_zip(blob: bytes, prefix: str = ''):
              try:
                  with ZipFile(BytesIO(blob)) as archive:
                      for info in archive.infolist():
                          if info.is_dir():
                              continue
                          name = info.filename
                          lower = name.lower()
                          data = archive.read(info)
                          if lower.endswith(('.img', '.sd', '.raw')):
                              yield prefix + name, data
                          elif lower.endswith('.zip') and len(data) < 512 << 20:
                              yield from images_in_zip(
                                  data, prefix + name + '!'
                              )
              except BadZipFile:
                  return

          branches = [
              'agent/vc4-post-preg-arm-release',
              'agent/vc4-preg-mutex',
              'agent/vc4-arm-payload-stage-repair',
          ]
          candidate_runs = []
          for branch in branches:
              query = urllib.parse.urlencode({
                  'branch': branch,
                  'status': 'completed',
                  'per_page': 100,
              })
              payload = get_json(f'{api}/actions/runs?{query}')
              for run in payload.get('workflow_runs', []):
                  name = str(run.get('name', '')).lower()
                  if any(word in name for word in (
                      'stock', 'frontier', 'payload'
                  )):
                      candidate_runs.append(run)
          candidate_runs.sort(
              key=lambda run: str(run.get('created_at', '')),
              reverse=True,
          )
          # Known-good p-register frontier run remains a deterministic fallback.
          candidate_runs.append({'id': 32214686379,
                                 'name': 'known preg frontier'})

          destination = Path('/tmp/vc4-stock-arm-payload.img')
          provenance = None
          seen_runs = set()
          for run in candidate_runs:
              run_id = run.get('id')
              if not isinstance(run_id, int) or run_id in seen_runs:
                  continue
              seen_runs.add(run_id)
              try:
                  artifacts = get_json(
                      f'{api}/actions/runs/{run_id}/artifacts?per_page=100'
                  ).get('artifacts', [])
              except Exception:
                  continue
              artifacts.sort(
                  key=lambda item: (
                      'stock' not in str(item.get('name', '')).lower(),
                      'frontier' not in str(item.get('name', '')).lower(),
                  )
              for artifact in artifacts:
                  if artifact.get('expired'):
                      continue
                  try:
                      blob = get_bytes(artifact['archive_download_url'])
                  except Exception:
                      continue
                  found = list(images_in_zip(blob))
                  if not found:
                      continue
                  found.sort(key=lambda item: len(item[1]), reverse=True)
                  image_name, image = found[0]
                  if len(image) < 1 << 20:
                      continue
                  destination.write_bytes(image)
                  provenance = {
                      'run_id': run_id,
                      'run_name': run.get('name'),
                      'head_sha': run.get('head_sha'),
                      'artifact_id': artifact.get('id'),
                      'artifact_name': artifact.get('name'),
                      'image_name': image_name,
                      'image_size': len(image),
                  }
                  break
              if provenance is not None:
                  break

          if provenance is None:
              raise SystemExit('no stock-firmware SD image found in artifacts')
          Path('VC4_SCHEDULER_AB_IMAGE.json').write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(provenance, indent=2, sort_keys=True))
          PY
          test -s /tmp/vc4-stock-arm-payload.img

      - name: Configure and build the baseline
        if: steps.frontier.outputs.classification == 'silent-halt'
        run: |
          set -euo pipefail
          mkdir build-scheduler-base
          cd build-scheduler-base
          ../configure \
            --target-list=vc4-softmmu,aarch64-softmmu \
            --disable-docs \
            --disable-werror
          ninja qemu-system-vc4 qemu-system-aarch64
          cd ..
          if test -f scripts/vc4/preg-mutex-smoke.py; then
            python3 scripts/vc4/preg-mutex-smoke.py \
              --qemu build-scheduler-base/qemu-system-vc4
          fi
          if test -f scripts/vc4/msync-smoke.py; then
            python3 scripts/vc4/msync-smoke.py \
              --qemu build-scheduler-base/qemu-system-vc4
          fi

      - name: Probe baseline under single- and multi-thread TCG
        if: steps.frontier.outputs.classification == 'silent-halt'
        run: |
          set +e
          python3 scripts/vc4/scheduler-ab.py probe \
            --qemu build-scheduler-base/qemu-system-vc4 \
            --image /tmp/vc4-stock-arm-payload.img \
            --thread-mode single \
            --seconds 180 \
            --out VC4_SCHEDULER_BASELINE_SINGLE.json
          single_rc=$?
          python3 scripts/vc4/scheduler-ab.py probe \
            --qemu build-scheduler-base/qemu-system-vc4 \
            --image /tmp/vc4-stock-arm-payload.img \
            --thread-mode multi \
            --seconds 90 \
            --out VC4_SCHEDULER_BASELINE_MULTI.json
          multi_rc=$?
          set -e
          python3 - <<PY
          from pathlib import Path
          import json
          Path('VC4_SCHEDULER_BASELINE_STATUS.json').write_text(
              json.dumps({
                  'single_rc': $single_rc,
                  'multi_rc': $multi_rc,
              }, indent=2, sort_keys=True) + '\n'
          )
          PY

      - name: Materialize the one-variable wake-up candidate
        if: steps.frontier.outputs.classification == 'silent-halt'
        id: candidate
        run: |
          set +e
          python3 scripts/vc4/scheduler-ab.py materialize \
            --root . \
            --out VC4_SCHEDULER_WAKE_MATERIALIZATION.json
          rc=$?
          set -e
          echo "materialize_rc=$rc" >> "$GITHUB_OUTPUT"
          git diff --check
          git diff --stat
          git diff -- hw/arm hw/misc hw/core

      - name: Incrementally build and probe the candidate
        if: >-
          steps.frontier.outputs.classification == 'silent-halt' &&
          steps.candidate.outputs.materialize_rc == '0'
        run: |
          set -euo pipefail
          ninja -C build-scheduler-base \
            qemu-system-vc4 qemu-system-aarch64
          if test -f scripts/vc4/preg-mutex-smoke.py; then
            python3 scripts/vc4/preg-mutex-smoke.py \
              --qemu build-scheduler-base/qemu-system-vc4
          fi
          if test -f scripts/vc4/msync-smoke.py; then
            python3 scripts/vc4/msync-smoke.py \
              --qemu build-scheduler-base/qemu-system-vc4
          fi
          set +e
          python3 scripts/vc4/scheduler-ab.py probe \
            --qemu build-scheduler-base/qemu-system-vc4 \
            --image /tmp/vc4-stock-arm-payload.img \
            --thread-mode single \
            --seconds 240 \
            --out VC4_SCHEDULER_CANDIDATE_SINGLE.json
          single_rc=$?
          python3 scripts/vc4/scheduler-ab.py probe \
            --qemu build-scheduler-base/qemu-system-vc4 \
            --image /tmp/vc4-stock-arm-payload.img \
            --thread-mode multi \
            --seconds 120 \
            --out VC4_SCHEDULER_CANDIDATE_MULTI.json
          multi_rc=$?
          python3 scripts/vc4/scheduler-ab.py compare \
            --baseline VC4_SCHEDULER_BASELINE_SINGLE.json \
            --candidate VC4_SCHEDULER_CANDIDATE_SINGLE.json \
            --out VC4_SCHEDULER_WAKE_AB.json
          compare_rc=$?
          set -e
          python3 - <<PY
          from pathlib import Path
          import json
          Path('VC4_SCHEDULER_CANDIDATE_STATUS.json').write_text(
              json.dumps({
                  'single_rc': $single_rc,
                  'multi_rc': $multi_rc,
                  'compare_rc': $compare_rc,
              }, indent=2, sort_keys=True) + '\n'
          )
          PY

      - name: Decide the A/B result
        if: steps.frontier.outputs.classification == 'silent-halt'
        id: decision
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/vc4-scheduler-decision
          from pathlib import Path
          import json

          baseline = json.loads(
              Path('VC4_SCHEDULER_BASELINE_SINGLE.json').read_text()
          )
          candidate_path = Path('VC4_SCHEDULER_CANDIDATE_SINGLE.json')
          candidate = (
              json.loads(candidate_path.read_text())
              if candidate_path.is_file() else {}
          )
          baseline_seen = bool(baseline.get('signature_seen'))
          candidate_seen = bool(candidate.get('signature_seen'))
          if baseline_seen:
              print('baseline-reached')
          elif candidate_seen:
              print('candidate-proven')
          else:
              print('candidate-rejected')
          PY
          decision=$(cat /tmp/vc4-scheduler-decision)
          echo "value=$decision" >> "$GITHUB_OUTPUT"
          echo "Scheduler A/B decision: $decision"

      - name: Commit the proven candidate on its feature branch
        if: steps.decision.outputs.value == 'candidate-proven'
        env:
          NEXT_BRANCH: ${{ steps.prepare.outputs.branch }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          materialization = json.loads(Path(
              'VC4_SCHEDULER_WAKE_MATERIALIZATION.json'
          ).read_text())
          comparison = json.loads(Path(
              'VC4_SCHEDULER_WAKE_AB.json'
          ).read_text())
          lines = [
              '# VC4 scheduler wake-up A/B',
              '',
              'Result: **candidate proven**.',
              '',
              'The clean baseline did not reach the stock-firmware ARM '
              'payload signature.  The otherwise-identical candidate did.',
              '',
              '## Changed unhalt sites',
          ]
          for edit in materialization.get('edits', []):
              lines.append(
                  f"- `{edit['path']}:{edit['line']}` in "
                  f"`{edit.get('function')}`: kick `{edit['cpu_expression']}`"
              )
          lines.extend([
              '',
              '## Signature result',
              '',
              f"- Baseline: `{comparison['baseline_signature_seen']}`",
              f"- Candidate: `{comparison['candidate_signature_seen']}`",
          ])
          Path('VC4_SCHEDULER_WAKE_AB.md').write_text(
              '\n'.join(lines) + '\n'
          )
          PY
          git rm -f .github/workflows/vc4-scheduler-wakeup-ab.yml \
            2>/dev/null || true
          git add \
            hw/arm \
            hw/misc \
            hw/core \
            scripts/vc4/scheduler-ab.py \
            VC4_SCHEDULER_AB_IMAGE.json \
            VC4_SCHEDULER_BASELINE_SINGLE.json \
            VC4_SCHEDULER_BASELINE_MULTI.json \
            VC4_SCHEDULER_BASELINE_STATUS.json \
            VC4_SCHEDULER_CANDIDATE_SINGLE.json \
            VC4_SCHEDULER_CANDIDATE_MULTI.json \
            VC4_SCHEDULER_CANDIDATE_STATUS.json \
            VC4_SCHEDULER_WAKE_MATERIALIZATION.json \
            VC4_SCHEDULER_WAKE_AB.json \
            VC4_SCHEDULER_WAKE_AB.md
          git commit -m \
            "hw/arm: kick CPUs when firmware makes them runnable"
          git push origin HEAD:"$NEXT_BRANCH"
          echo "$(git rev-parse HEAD)" > /tmp/vc4-proven-sha

      - name: Record a rejected candidate without retaining its code
        if: steps.decision.outputs.value == 'candidate-rejected'
        env:
          NEXT_BRANCH: ${{ steps.prepare.outputs.branch }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/vc4-scheduler-report
          cp -f VC4_SCHEDULER_*.json /tmp/vc4-scheduler-report/ \
            2>/dev/null || true
          git reset --hard "${{ steps.prepare.outputs.base_sha }}"
          git checkout "$SOURCE_SHA" -- scripts/vc4/scheduler-ab.py
          cp -f /tmp/vc4-scheduler-report/* . 2>/dev/null || true
          python3 - <<'PY'
          from pathlib import Path
          import json

          def load(name: str):
              path = Path(name)
              return json.loads(path.read_text()) if path.is_file() else {}

          baseline = load('VC4_SCHEDULER_BASELINE_SINGLE.json')
          candidate = load('VC4_SCHEDULER_CANDIDATE_SINGLE.json')
          materialization = load(
              'VC4_SCHEDULER_WAKE_MATERIALIZATION.json'
          )
          lines = [
              '# VC4 scheduler wake-up A/B',
              '',
              'Result: **candidate rejected**.',
              '',
              'Adding scheduler kicks immediately after explicit CPU unhalt '
              'sites did not make the stock firmware reach the ARM payload. '
              'No candidate C changes were retained.',
              '',
              f"Baseline signature: `{baseline.get('signature_seen')}`",
              f"Candidate signature: `{candidate.get('signature_seen')}`",
              '',
              '## Tested sites',
          ]
          for edit in materialization.get('edits', []):
              lines.append(
                  f"- `{edit['path']}:{edit['line']}`; "
                  f"expression `{edit['cpu_expression']}`"
              )
          lines.extend([
              '',
              '## Next diagnostic',
              '',
              'Instrument ARM reset, halt, power, and PC transitions around '
              'the firmware handoff.  The next change must be selected from '
              'that transition trace rather than another global wake-up guess.',
          ])
          Path('VC4_SCHEDULER_WAKE_AB.md').write_text(
              '\n'.join(lines) + '\n'
          )
          PY
          git rm -f .github/workflows/vc4-scheduler-wakeup-ab.yml \
            2>/dev/null || true
          git add scripts/vc4/scheduler-ab.py VC4_SCHEDULER_*.json \
            VC4_SCHEDULER_WAKE_AB.md
          git commit -m "vc4: reject generic CPU wake-up candidate"
          git push origin HEAD:"$NEXT_BRANCH"

      - name: Record a stale classification whose baseline now passes
        if: steps.decision.outputs.value == 'baseline-reached'
        env:
          NEXT_BRANCH: ${{ steps.prepare.outputs.branch }}
        run: |
          set -euo pipefail
          cat > VC4_SCHEDULER_WAKE_AB.md <<'EOF'
          # VC4 scheduler wake-up A/B

          The unmodified baseline already reached the real stock-firmware ARM
          payload signature.  The earlier silent-halt classification was stale;
          no scheduler candidate was retained.
          EOF
          git reset --hard "${{ steps.prepare.outputs.base_sha }}"
          git checkout "${{ github.sha }}" -- scripts/vc4/scheduler-ab.py
          git rm -f .github/workflows/vc4-scheduler-wakeup-ab.yml \
            2>/dev/null || true
          git add scripts/vc4/scheduler-ab.py VC4_SCHEDULER_WAKE_AB.md
          git commit -m "vc4: confirm stock ARM handoff on clean baseline"
          git push origin HEAD:"$NEXT_BRANCH"
          echo "$(git rev-parse HEAD)" > /tmp/vc4-proven-sha

      - name: Merge a proven handoff into the ARM-payload stage
        if: >-
          steps.decision.outputs.value == 'candidate-proven' ||
          steps.decision.outputs.value == 'baseline-reached'
        env:
          NEXT_BRANCH: ${{ steps.prepare.outputs.branch }}
        run: |
          set -euo pipefail
          proven_sha=$(cat /tmp/vc4-proven-sha)
          git fetch origin agent/vc4-arm-payload-stage-repair
          git checkout -B promote-vc4 \
            origin/agent/vc4-arm-payload-stage-repair
          git merge --no-ff "$proven_sha" -m \
            "Merge proven VC4 stock-firmware ARM handoff"
          mkdir build-scheduler-promote
          cd build-scheduler-promote
          ../configure \
            --target-list=vc4-softmmu,aarch64-softmmu \
            --disable-docs \
            --disable-werror
          ninja qemu-system-vc4 qemu-system-aarch64
          cd ..
          if test -f scripts/vc4/preg-mutex-smoke.py; then
            python3 scripts/vc4/preg-mutex-smoke.py \
              --qemu build-scheduler-promote/qemu-system-vc4
          fi
          if test -f scripts/vc4/msync-smoke.py; then
            python3 scripts/vc4/msync-smoke.py \
              --qemu build-scheduler-promote/qemu-system-vc4
          fi
          python3 scripts/vc4/scheduler-ab.py probe \
            --qemu build-scheduler-promote/qemu-system-vc4 \
            --image /tmp/vc4-stock-arm-payload.img \
            --thread-mode single \
            --seconds 300 \
            --out VC4_PROMOTED_STAGE_STOCK_HANDOFF.json
          git add VC4_PROMOTED_STAGE_STOCK_HANDOFF.json
          git commit -m "ci/vc4: record promoted stock ARM handoff"
          git push origin HEAD:agent/vc4-arm-payload-stage-repair

      - name: Remove the A/B workflow from the source branch
        if: steps.frontier.outputs.ready == 'true'
        run: |
          set -euo pipefail
          git fetch origin agent/vc4-post-preg-arm-release
          git checkout -B cleanup-scheduler-ab \
            origin/agent/vc4-post-preg-arm-release
          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git rm -f .github/workflows/vc4-scheduler-wakeup-ab.yml \
            2>/dev/null || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci/vc4: clean scheduler A/B workflow"
          git pull --rebase origin agent/vc4-post-preg-arm-release
          git push origin HEAD:agent/vc4-post-preg-arm-release

      - name: Clean an irrelevant A/B workflow before classification dispatch
        if: >-
          steps.frontier.outputs.ready == 'true' &&
          steps.frontier.outputs.classification != 'silent-halt'
        run: |
          echo "Frontier is ${{ steps.frontier.outputs.classification }}; scheduler A/B not applicable."
