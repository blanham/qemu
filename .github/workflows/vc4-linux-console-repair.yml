name: VC4 Linux console routing repair

on:
  push:
    branches:
      - agent/vc4-hetero-direct-linux
    paths:
      - .github/workflows/vc4-linux-console-repair.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-linux-console-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Correct Linux console routing and strengthen progress evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          probe_path = Path('scripts/vc4/raspi3-linux-probe.py')
          probe = probe_path.read_text(encoding='utf-8')

          old_console = '    "console=ttyAMA0,115200 "\n'
          new_console = '    "console=ttyAMA1,115200 "\n'
          if probe.count(old_console) != 1:
              raise SystemExit(
                  f'expected one ttyAMA0 console setting, found '
                  f'{probe.count(old_console)}'
              )
          probe = probe.replace(old_console, new_console, 1)

          old_result = (
              '            "earlycon_seen": False,\n'
              '            "init_seen": False,\n'
          )
          new_result = (
              '            "earlycon_seen": False,\n'
              '            "userspace_handoff_seen": False,\n'
              '            "init_seen": False,\n'
          )
          if probe.count(old_result) != 1:
              raise SystemExit('could not locate result progress fields')
          probe = probe.replace(old_result, new_result, 1)

          old_detection = (
              '                result["init_seen"] = '
              '"VC4_LINUX_INIT_OK" in serial\n'
          )
          new_detection = (
              '                result["userspace_handoff_seen"] = (\n'
              '                    "Run /init as init process" in serial\n'
              '                )\n'
              '                result["init_seen"] = '
              '"VC4_LINUX_INIT_OK" in serial\n'
          )
          if probe.count(old_detection) != 1:
              raise SystemExit('could not locate init-marker detection')
          probe = probe.replace(old_detection, new_detection, 1)
          probe_path.write_text(probe, encoding='utf-8')

          init_path = Path('tests/vc4/linux-init.c')
          init = init_path.read_text(encoding='utf-8')
          old_function = '''static void reopen_console(void)
{
    int fd = open("/dev/console", O_RDWR | O_CLOEXEC);

    if (fd < 0) {
        return;
    }
    for (int target = STDIN_FILENO; target <= STDERR_FILENO; target++) {
        if (fd != target) {
            (void)dup2(fd, target);
        }
    }
    if (fd > STDERR_FILENO) {
        close(fd);
    }
}
'''
          new_function = '''static void reopen_console(void)
{
    static const char *const candidates[] = {
        "/dev/console",
        "/dev/ttyAMA1",
        "/dev/ttyAMA0",
    };
    int fd = -1;

    for (unsigned index = 0;
         index < sizeof(candidates) / sizeof(candidates[0]); index++) {
        fd = open(candidates[index], O_RDWR | O_CLOEXEC);
        if (fd >= 0) {
            break;
        }
    }
    if (fd < 0) {
        return;
    }
    for (int target = STDIN_FILENO; target <= STDERR_FILENO; target++) {
        if (fd != target) {
            (void)dup2(fd, target);
        }
    }
    if (fd > STDERR_FILENO) {
        close(fd);
    }
}
'''
          if init.count(old_function) != 1:
              raise SystemExit('could not locate console reopen helper')
          init = init.replace(old_function, new_function, 1)
          init_path.write_text(init, encoding='utf-8')
          PY

          python3 -m py_compile scripts/vc4/raspi3-linux-probe.py
          grep -q 'console=ttyAMA1,115200' scripts/vc4/raspi3-linux-probe.py
          grep -q 'userspace_handoff_seen' scripts/vc4/raspi3-linux-probe.py
          grep -q '/dev/ttyAMA1' tests/vc4/linux-init.c
          git diff --check

      - name: Publish repair and retire obsolete diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git rm -- .github/workflows/vc4-linux-console-repair.yml
          if test -f .github/workflows/vc4-hetero-linux-backtrace.yml; then
            git rm -- .github/workflows/vc4-hetero-linux-backtrace.yml
          fi
          git add -- \
            scripts/vc4/raspi3-linux-probe.py \
            tests/vc4/linux-init.c
          git diff --cached --check
          git commit -m 'tests/vc4: route Linux console to registered PL011'
          git pull --rebase origin agent/vc4-hetero-direct-linux
          git push origin HEAD:agent/vc4-hetero-direct-linux
