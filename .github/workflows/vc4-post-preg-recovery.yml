name: VC4 post-preg recovery validation

on:
  push:
    branches:
      - agent/vc4-post-preg-recovery
    paths:
      - .github/workflows/vc4-post-preg-recovery.yml
      - scripts/vc4/msync-integrate.py
      - scripts/vc4/msync-smoke.py
      - scripts/vc4/preg-mutex-smoke.py
      - scripts/vc4/raspi3-stock-arm-payload.py
      - scripts/vc4/raspi3-stock-bootcode-probe.py
      - hw/misc/bcm2835_msync.c
      - include/hw/misc/bcm2835_msync.h
      - include/hw/arm/bcm2835_peripherals.h
      - hw/arm/bcm2835_peripherals.c
      - hw/misc/meson.build
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-post-preg-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RPI_FIRMWARE_COMMIT: 3d301dd924bcd758a4c8cb19fe8531031f033f43
      OUT_DIR: /tmp/vc4-post-preg-recovery

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install build and payload dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            binutils-aarch64-linux-gnu \
            curl \
            ninja-build \
            pkg-config \
            python3 \
            python3-venv \
            libglib2.0-dev \
            libpixman-1-dev \
            zlib1g-dev

      - name: Materialize the production wiring
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/vc4/msync-integrate.py \
            scripts/vc4/msync-smoke.py \
            scripts/vc4/preg-mutex-smoke.py \
            scripts/vc4/raspi3-stock-arm-payload.py \
            scripts/vc4/raspi3-stock-bootcode-probe.py \
            scripts/vc4/stock_bootcode_progress.py
          python3 scripts/vc4/msync-integrate.py
          python3 scripts/vc4/msync-integrate.py
          python3 scripts/vc4/stock_bootcode_progress.py
          git diff --check
          grep -q "bcm2835_msync.c" hw/misc/meson.build
          grep -q "TYPE_BCM2835_MSYNC" hw/arm/bcm2835_peripherals.c
          grep -q "MSYNC_OFFSET" hw/arm/bcm2835_peripherals.c
          grep -q "INTERRUPT_MULTICORESYNC0" hw/arm/bcm2835_peripherals.c

      - name: Configure and build both frontends
        run: |
          set -euo pipefail
          ./configure \
            --target-list=aarch64-softmmu,vc4-softmmu \
            --disable-docs \
            --disable-werror \
            2>&1 | tee /tmp/vc4-recovery-configure.log
          ninja -C build qemu-system-aarch64 qemu-system-vc4 \
            2>&1 | tee /tmp/vc4-recovery-build.log
          if grep -E "bcm2835_msync\.c:.*warning:" \
               /tmp/vc4-recovery-build.log; then
            echo "multicore-sync compiled with warnings" >&2
            exit 1
          fi

      - name: Run focused register smoke tests
        run: |
          set -euo pipefail
          python3 scripts/vc4/preg-mutex-smoke.py \
            --qemu build/qemu-system-vc4 \
            2>&1 | tee /tmp/vc4-recovery-preg.log
          python3 scripts/vc4/msync-smoke.py \
            --qemu build/qemu-system-aarch64 \
            2>&1 | tee /tmp/vc4-recovery-msync.log

      - name: Download the pinned official firmware
        run: |
          set -euo pipefail
          for file in bootcode.bin start.elf fixup.dat; do
            curl --fail --location --retry 4 \
              --output "/tmp/${file}" \
              "https://raw.githubusercontent.com/raspberrypi/firmware/${RPI_FIRMWARE_COMMIT}/boot/${file}"
          done
          test "$(git hash-object /tmp/bootcode.bin)" = \
            7642d2d89e4235e7d68875ff70688bdde6e71b5a
          test "$(git hash-object /tmp/start.elf)" = \
            0cefcf3a756740760f9903f35cc3843117853712
          test "$(git hash-object /tmp/fixup.dat)" = \
            1845e38de9d4f9a6d9ad7f5273bfe58b2582a7e6

      - name: Build the freestanding AArch64 handoff witness
        run: |
          set -euo pipefail
          cat >/tmp/vc4-arm-payload.S <<'EOF'
          .section .text
          .global _start
          .type _start, %function
          _start:
              mov x4, x0
              mov x5, sp
              mrs x6, mpidr_el1
              ldr x0, =0x0000000000001000
              ldr x1, =0x5643345f41524d21
              str x1, [x0]
              str x4, [x0, #8]
              str x5, [x0, #16]
              str x6, [x0, #24]
              dsb sy
          1:
              wfe
              b 1b
              .ltorg
          .size _start, . - _start
          EOF
          aarch64-linux-gnu-as \
            -o /tmp/vc4-arm-payload.o /tmp/vc4-arm-payload.S
          aarch64-linux-gnu-ld \
            -nostdlib --entry=_start -Ttext=0x80000 \
            -o /tmp/vc4-arm-payload.elf /tmp/vc4-arm-payload.o
          aarch64-linux-gnu-objcopy \
            -O binary /tmp/vc4-arm-payload.elf /tmp/kernel8.img
          aarch64-linux-gnu-objdump -d /tmp/vc4-arm-payload.elf \
            >/tmp/vc4-arm-payload.dis
          test -s /tmp/kernel8.img

      - name: Capture the unchanged stock-firmware frontier
        id: frontier
        run: |
          set -euo pipefail
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"
          cp /tmp/kernel8.img "$OUT_DIR/kernel8.img"
          cp /tmp/vc4-arm-payload.dis "$OUT_DIR/payload.dis"
          set +e
          python3 scripts/vc4/raspi3-stock-arm-payload.py \
            build/qemu-system-aarch64 \
            /tmp/bootcode.bin \
            /tmp/start.elf \
            /tmp/fixup.dat \
            /tmp/kernel8.img \
            --seconds 120 \
            --out-dir "$OUT_DIR" \
            2>&1 | tee "$OUT_DIR/probe.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "return_code=$rc" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$rc" >"$OUT_DIR/probe.status"

      - name: Record recovery and frontier evidence
        env:
          PROBE_RETURN_CODE: ${{ steps.frontier.outputs.return_code }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import os

          out = Path(os.environ["OUT_DIR"])
          result_path = out / "result.json"
          result = (
              json.loads(result_path.read_text())
              if result_path.is_file() else {}
          )
          signature_seen = bool(result.get("signature_seen"))
          report = {
              "schema_version": 1,
              "source_sha": os.environ["GITHUB_SHA"],
              "ref_name": os.environ["GITHUB_REF_NAME"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "run_url": (
                  f"{os.environ['GITHUB_SERVER_URL']}/"
                  f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
                  f"{os.environ['GITHUB_RUN_ID']}"
              ),
              "production_validation": {
                  "dual_frontend_build": "passed",
                  "processor_control_smoke": "passed",
                  "multicore_sync_smoke": "passed",
                  "multicore_sync_warnings": 0,
              },
              "probe_return_code": os.environ.get(
                  "PROBE_RETURN_CODE", ""
              ),
              "arm_payload_signature_seen": signature_seen,
              "stock_firmware_frontier": result,
          }
          Path("VC4_POST_PREG_RECOVERY.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          lines = [
              "# VC4 post-p-register recovery",
              "",
              "The BCM2835 multicore-synchronization device, SoC wiring,",
              "AArch64 frontend, and VC4 frontend all built successfully.",
              "The processor-control and multicore-sync register smoke tests",
              "both passed, and the multicore-sync source compiled without",
              "warnings.",
              "",
              "## Stock-firmware frontier",
              "",
              f"- ARM payload signature reached: **{signature_seen}**",
              f"- Probe return code: `{report['probe_return_code']}`",
              f"- Workflow run: `{report['run_url']}`",
          ]
          if not signature_seen:
              lines.extend([
                  "",
                  "The production multicore-sync slice is validated; the",
                  "remaining ARM-handoff frontier is recorded in the JSON",
                  "report and the workflow artifact rather than guessed at",
                  "by another self-modifying diagnostic workflow.",
              ])
          Path("VC4_POST_PREG_RECOVERY.md").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY
          git diff --check

      - name: Upload recovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-post-preg-recovery-${{ github.run_attempt }}
          path: |
            /tmp/vc4-post-preg-recovery
            /tmp/vc4-recovery-configure.log
            /tmp/vc4-recovery-build.log
            /tmp/vc4-recovery-preg.log
            /tmp/vc4-recovery-msync.log
            VC4_POST_PREG_RECOVERY.json
            VC4_POST_PREG_RECOVERY.md
          if-no-files-found: warn
          retention-days: 14

      - name: Publish only the validated production slice
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          remote_head=$(git rev-parse "origin/$GITHUB_REF_NAME")
          if test "$remote_head" != "$GITHUB_SHA"; then
            echo "Branch moved from $GITHUB_SHA to $remote_head" >&2
            exit 1
          fi

          rm -f \
            .github/workflows/vc4-post-preg-recovery.yml \
            .github/workflows/vc4-post-preg-msync.yml \
            .github/workflows/vc4-post-preg-msync-v2.yml \
            .github/workflows/vc4-msync-integration.yml \
            .github/workflows/vc4-msync-integration-v2.yml \
            .github/workflows/vc4-generate-post-msync-frontier.yml \
            .github/workflows/vc4-capture-post-msync-frontier.yml \
            .github/workflows/vc4-classify-post-msync-frontier.yml \
            .github/workflows/vc4-dispatch-post-msync-frontier.yml \
            .github/workflows/vc4-scheduler-wakeup-ab.yml \
            .github/workflows/vc4-arm-transition-trace.yml \
            scripts/vc4/msync-integrate.py \
            scripts/vc4/scheduler-ab.py \
            scripts/vc4/arm-transition-trace.py \
            VC4_POST_PREG_MSYNC_STATUS.json

          grep -q "bcm2835_msync.c" hw/misc/meson.build
          grep -q "TYPE_BCM2835_MSYNC" hw/arm/bcm2835_peripherals.c
          grep -q "MSYNC_OFFSET" hw/arm/bcm2835_peripherals.c
          grep -q "INTERRUPT_MULTICORESYNC0" hw/arm/bcm2835_peripherals.c

          git add -A
          git diff --cached --check
          git config user.name "VC4 Recovery CI"
          git config user.email "vc4-recovery-ci@users.noreply.github.com"
          git commit -m \
            "hw/misc: land validated BCM2835 multicore sync [skip ci]"
          git push origin HEAD:"$GITHUB_REF_NAME"
