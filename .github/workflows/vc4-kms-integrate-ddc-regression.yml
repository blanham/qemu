name: VC4 integrate HDMI DDC regression

on:
  push:
    branches:
      - agent/vc4-linux-kms-bind-diagnostics
    paths:
      - .github/workflows/vc4-kms-integrate-ddc-regression.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-integrate-hdmi-ddc-regression
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Add the DDC witness to the persistent KMS gate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/vc4-linux-kms-bind-diagnostics.yml")
          lines = path.read_text().splitlines()
          slash = chr(92)

          def insert_after(exact: str, additions: list[str]) -> None:
              if all(addition in lines for addition in additions):
                  return
              matches = [index for index, line in enumerate(lines) if line == exact]
              if len(matches) != 1:
                  raise SystemExit(
                      f"expected one workflow line {exact!r}, found {len(matches)}"
                  )
              index = matches[0] + 1
              lines[index:index] = additions

          insert_after(
              "      - hw/arm/bcm2835_peripherals.c",
              ["      - hw/arm/Kconfig"],
          )
          insert_after(
              "      - scripts/vc4/property-clock-enumeration-smoke.py",
              ["      - scripts/vc4/bcm2835-hdmi-ddc-smoke.py"],
          )

          compile_line = (
              "            scripts/vc4/fetch-linux-vc4-modules.py " + slash
          )
          ddc_compile = (
              "            scripts/vc4/bcm2835-hdmi-ddc-smoke.py " + slash
          )
          if ddc_compile not in lines:
              matches = [
                  index for index, line in enumerate(lines)
                  if line == compile_line
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      f"expected one py_compile anchor, found {len(matches)}"
                  )
              lines.insert(matches[0], ddc_compile)

          runtime_marker = (
              "          python3 scripts/vc4/property-clock-enumeration-smoke.py "
              + slash
          )
          ddc_runtime_marker = (
              "          python3 scripts/vc4/bcm2835-hdmi-ddc-smoke.py " + slash
          )
          if ddc_runtime_marker not in lines:
              matches = [
                  index for index, line in enumerate(lines)
                  if line == runtime_marker
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      f"expected one property-clock runtime anchor, found {len(matches)}"
                  )
              start = matches[0]
              end = start
              while end < len(lines) and "property-clocks.log" not in lines[end]:
                  end += 1
              if end == len(lines):
                  raise SystemExit("property-clock runtime block has no log sink")
              lines[end + 1:end + 1] = [
                  ddc_runtime_marker,
                  "            --qemu build/qemu-system-aarch64 " + slash,
                  "            2>&1 | tee \"$EVIDENCE_DIR/hdmi-ddc.log\"",
              ]

          path.write_text("\n".join(lines) + "\n")
          PY

          python3 -m py_compile scripts/vc4/bcm2835-hdmi-ddc-smoke.py
          git diff --check
          grep -Fq bcm2835-hdmi-ddc-smoke.py \
            .github/workflows/vc4-linux-kms-bind-diagnostics.yml
          grep -Fq hdmi-ddc.log \
            .github/workflows/vc4-linux-kms-bind-diagnostics.yml

      - name: Publish the persistent gate update
        run: |
          set -euo pipefail
          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git add -- .github/workflows/vc4-linux-kms-bind-diagnostics.yml
          git rm -- .github/workflows/vc4-kms-integrate-ddc-regression.yml
          git commit -m "ci/vc4: preserve Raspberry Pi HDMI DDC behavior"
          git pull --rebase origin agent/vc4-linux-kms-bind-diagnostics
          git push origin HEAD:agent/vc4-linux-kms-bind-diagnostics
