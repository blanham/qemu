name: VC4 SDHOST sticky data flag

on:
  push:
    branches:
      - agent/vc4-sdhost-sticky-data-flag
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-sticky-data-flag:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RPI_FIRMWARE_COMMIT: 3d301dd924bcd758a4c8cb19fe8531031f033f43

    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl ninja-build pkg-config python3 python3-venv \
            libglib2.0-dev libpixman-1-dev zlib1g-dev

      - name: Preserve SDHOST DATA_FLAG until guest acknowledgement
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('hw/sd/bcm2835_sdhost.c')
          text = path.read_text()
          old = '''static void bcm2835_sdhost_update_data_flag(BCM2835SDHostState *s)
          {
              bool ready = false;

              if (s->cmd & SDCMD_READ_CMD) {
                  ready = s->fifo_len != 0;
              } else if (s->cmd & SDCMD_WRITE_CMD) {
                  ready = s->datacnt != 0 &&
                          s->fifo_len < BCM2835_SDHOST_FIFO_LEN;
              }

              if (ready) {
                  s->status |= SDHSTS_DATA_FLAG;
                  if (s->config & SDHCFG_DATA_IRPT_EN) {
                      s->status |= SDHSTS_SDIO_IRPT;
                  }
              } else {
                  s->status &= ~SDHSTS_DATA_FLAG;
              }
          }
          '''
          new = '''static void bcm2835_sdhost_update_data_flag(BCM2835SDHostState *s)
          {
              bool ready = false;

              if (s->cmd & SDCMD_READ_CMD) {
                  ready = s->fifo_len != 0;
              } else if (s->cmd & SDCMD_WRITE_CMD) {
                  ready = s->datacnt != 0 &&
                          s->fifo_len < BCM2835_SDHOST_FIFO_LEN;
              }

              /*
               * SDHSTS is a write-one-to-clear status register.  DATA_FLAG is
               * latched when the FIFO first becomes serviceable and remains
               * asserted after the last word is drained until software clears
               * it or terminates the transfer with CMD12.  Stock bootcode.bin
               * relies on that final assertion to leave its completion poll
               * and issue STOP_TRANSMISSION; treating the bit as a live
               * fifo-not-empty level strands the card in sending-data state.
               */
              if (ready) {
                  s->status |= SDHSTS_DATA_FLAG;
                  if (s->config & SDHCFG_DATA_IRPT_EN) {
                      s->status |= SDHSTS_SDIO_IRPT;
                  }
              }
          }
          '''
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit('DATA_FLAG helper anchor missing')
              path.write_text(text.replace(old, new, 1))

          test = Path('tests/qtest/bcm2835-sdhost-test.c')
          text = test.read_text()
          old = '''    /* A finite one-block transfer clears DATA_FLAG when drained. */
              writel(SDHBCT, 512);
              writel(SDHBLC, 1);
              sdhost_command(1024, SDCMD_READ_CMD | 18);
              read_and_check_sector(2);
              g_assert_cmphex(readl(SDHSTS) & SDHSTS_DATA_FLAG, ==, 0);
              g_assert_cmphex(readl(SDEDM) & SDEDM_FSM_MASK,
                              ==, SDEDM_FSM_DATAMODE);
              stop_transfer();
          '''
          new = '''    /*
               * DATA_FLAG is sticky status, not a live fifo-not-empty level.
               * It survives the final FIFO pop, is W1C, and CMD12 also clears
               * it while returning the controller to data mode.
               */
              writel(SDHBCT, 512);
              writel(SDHBLC, 1);
              sdhost_command(1024, SDCMD_READ_CMD | 18);
              read_and_check_sector(2);
              g_assert_cmphex(readl(SDHSTS) & SDHSTS_DATA_FLAG,
                              ==, SDHSTS_DATA_FLAG);
              g_assert_cmphex(readl(SDEDM) & SDEDM_FSM_MASK,
                              ==, SDEDM_FSM_DATAMODE);
              writel(SDHSTS, SDHSTS_DATA_FLAG);
              g_assert_cmphex(readl(SDHSTS) & SDHSTS_DATA_FLAG, ==, 0);
              stop_transfer();
          '''
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit('SDHOST qtest finite-transfer anchor missing')
              test.write_text(text.replace(old, new, 1))
          PY

          git diff --check
          git status --short

      - name: Add temporary storage traces to the stock-firmware probe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/vc4/raspi3-stock-bootcode-mmio.py')
          text = path.read_text()
          old = '    "usb_port_reset",\n)\n'
          new = '''    "usb_port_reset",
              "bcm2835_sdhost_read",
              "bcm2835_sdhost_write",
              "bcm2835_sdhost_edm_change",
              "sdbus_command",
              "sdcard_normal_command",
              "sdcard_response",
              "sdcard_req_addr",
              "sdcard_read_block",
          )
          '''
          if '    "sdcard_read_block",\n)\n' not in text:
              if text.count(old) != 1:
                  raise SystemExit('stock trace event anchor missing')
              path.write_text(text.replace(old, new, 1))
          PY
          python3 -m py_compile scripts/vc4/raspi3-stock-bootcode-mmio.py

      - name: Download pinned official firmware trio
        run: |
          for file in bootcode.bin start.elf fixup.dat; do
            curl --fail --location --retry 4 \
              --output "/tmp/${file}" \
              "https://raw.githubusercontent.com/raspberrypi/firmware/${RPI_FIRMWARE_COMMIT}/boot/${file}"
          done
          test "$(git hash-object /tmp/bootcode.bin)" = \
            7642d2d89e4235e7d68875ff70688bdde6e71b5a
          test "$(git hash-object /tmp/start.elf)" = \
            0cefcf3a756740760f9903f35cc3843117853712
          test "$(git hash-object /tmp/fixup.dat)" = \
            1845e38de9d4f9a6d9ad7f5273bfe58b2582a7e6

      - name: Check stock-firmware probes
        run: |
          python3 -m py_compile \
            scripts/vc4/raspi3-stock-bootcode-probe.py \
            scripts/vc4/raspi3-stock-bootcode-state.py \
            scripts/vc4/raspi3-stock-bootcode-0200.py \
            scripts/vc4/raspi3-stock-bootcode-mmio.py \
            scripts/vc4/stock_bootcode_progress.py
          python3 scripts/vc4/stock_bootcode_progress.py

      - name: Configure and build emulator and SDHOST qtest
        run: |
          ./configure \
            --target-list=aarch64-softmmu \
            --disable-docs \
            --disable-werror
          ninja -C build \
            qemu-system-aarch64 \
            tests/qtest/bcm2835-sdhost-test

      - name: Exercise sticky DATA_FLAG through QTest
        run: |
          QTEST_QEMU_BINARY="$PWD/build/qemu-system-aarch64" \
            build/tests/qtest/bcm2835-sdhost-test

      - name: Run official firmware through the start.elf continuation path
        run: |
          set -o pipefail
          out=/tmp/vc4-sdhost-sticky-data-flag
          rm -rf "$out"
          mkdir -p "$out"

          python3 scripts/vc4/raspi3-stock-bootcode-mmio.py \
            build/qemu-system-aarch64 \
            /tmp/bootcode.bin \
            --start-elf /tmp/start.elf \
            --fixup-dat /tmp/fixup.dat \
            --seconds 70 \
            --trace-samples 280 \
            --trace-interval 0.05 \
            --qemu-debug in_asm \
            --qemu-debug-filter 0x60008000..0x60008100 \
            --out-dir "$out" 2>&1 | tee "$out/probe.log"

          test -s "$out/qemu-mmio.log"
          test -s "$out/probe.log"

      - name: Assert CMD12 recovery and capture the new frontier
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path
          import re

          out = Path('/tmp/vc4-sdhost-sticky-data-flag')
          trace = (out / 'qemu-mmio.log').read_text(
              encoding='utf-8', errors='replace'
          ).splitlines()
          probe = (out / 'probe.log').read_text(
              encoding='utf-8', errors='replace'
          ).splitlines()

          if any(line.startswith('VC4_LOW_PC_WRITE ') for line in probe):
              raise SystemExit('unexpected low-memory PC write')

          start_cmd = next((
              i for i, line in enumerate(trace)
              if line.startswith('sdbus_command') and
                 'CMD18 arg 0x00311400' in line
          ), None)
          if start_cmd is None:
              raise SystemExit('the first start.elf extent was not requested')

          last_initial = next((
              i for i, line in enumerate(trace[start_cmd:], start_cmd)
              if line.startswith('sdcard_read_block') and
                 'addr 0x391200 ' in line
          ), None)
          if last_initial is None:
              raise SystemExit('the inherited 512 KiB start.elf transfer did not finish')

          stop_index = next((
              i for i, line in enumerate(trace[last_initial + 1:],
                                          last_initial + 1)
              if line.startswith('sdbus_command') and ' CMD12 ' in line
          ), None)
          next_read_cmd = next((
              i for i, line in enumerate(trace[last_initial + 1:],
                                          last_initial + 1)
              if line.startswith('sdbus_command') and ' CMD18 ' in line
          ), None)
          if stop_index is None or next_read_cmd is None or stop_index > next_read_cmd:
              raise SystemExit('bootcode did not stop the initial transfer before its next read')

          accepted_after_stop = any(
              line.startswith('sdcard_normal_command') and
              'READ_MULTIPLE_BLOCK' in line and
              '(mode transfer, state transfer)' in line
              for line in trace[stop_index + 1:]
          )
          if not accepted_after_stop:
              raise SystemExit('no post-CMD12 multiblock read was accepted')

          illegal = [
              line for line in trace
              if line.startswith('sdcard_normal_command') and
                 'ILLEGAL_COMMAND' in line
          ]
          if illegal:
              raise SystemExit('SD command stream remained illegal: ' + illegal[0])

          later_blocks = [
              line for line in trace[last_initial + 1:]
              if line.startswith('sdcard_read_block')
          ]
          if len(later_blocks) < 8:
              raise SystemExit(
                  f'too few successful reads after initial start.elf chunk: '
                  f'{len(later_blocks)}'
              )

          barrier = next((
              line for line in reversed(probe)
              if line.startswith('STOCK_BOOTCODE_BARRIER ')
          ), None)
          if barrier is None:
              raise SystemExit('missing stock boot barrier record')
          match = re.search(r'\bpc=0x([0-9a-fA-F]+)', barrier)
          if not match:
              raise SystemExit(f'barrier has no PC: {barrier}')
          barrier_pc = int(match.group(1), 16)
          if barrier_pc in (0x60008068, 0x0ecb61e2, 0x7880, 0x7882):
              raise SystemExit(
                  f'official firmware did not cross the repaired frontier: '
                  f'pc=0x{barrier_pc:08x}'
              )

          progress = None
          for line in probe:
              if line.startswith('STOCK_BOOTCODE_PROGRESS '):
                  progress = json.loads(line.split(' ', 1)[1])
          if progress is None:
              raise SystemExit('missing stock progress record')

          commands = [
              line for line in trace if line.startswith('sdbus_command')
          ]
          stops = [line for line in commands if ' CMD12 ' in line]
          read_blocks = [
              line for line in trace if line.startswith('sdcard_read_block')
          ]
          diagnostics = [
              line for line in trace
              if ('Bad offset' in line or 'unimplemented' in line)
          ]

          summary = {
              'schema_version': 1,
              'barrier_pc': f'0x{barrier_pc:08x}',
              'barrier': barrier,
              'command_count': len(commands),
              'stop_command_count': len(stops),
              'read_block_count': len(read_blocks),
              'post_initial_read_block_count': len(later_blocks),
              'post_initial_read_blocks': later_blocks[-80:],
              'last_commands': commands[-80:],
              'diagnostics': diagnostics[-80:],
              'progress': progress,
          }
          (out / 'summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Commit validated DATA_FLAG semantics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            hw/sd/bcm2835_sdhost.c \
            tests/qtest/bcm2835-sdhost-test.c
          git rm .github/workflows/vc4-sdhost-sticky-data-flag.yml
          git commit -m 'hw/sd: keep BCM2835 SDHOST DATA_FLAG latched'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload sticky DATA_FLAG validation frontier
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-sdhost-sticky-data-flag-${{ github.run_attempt }}
          path: /tmp/vc4-sdhost-sticky-data-flag
          if-no-files-found: warn
          retention-days: 14
