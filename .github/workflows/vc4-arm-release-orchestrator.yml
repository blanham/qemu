name: VC4 current-integration ARM release orchestrator

on:
  push:
    branches:
      - agent/vc4-arm-release-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-integrate-arm-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    env:
      INTEGRATION_BRANCH: agent/vc4-pc-write-origin-refresh
      SWI_BRANCH: agent/vc4-swi-exception-v3
      RPI_FIRMWARE_COMMIT: 3d301dd924bcd758a4c8cb19fe8531031f033f43

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl ninja-build pkg-config python3 python3-venv \
            libglib2.0-dev libpixman-1-dev zlib1g-dev

      - name: Wait for and assemble the validated current integration
        run: |
          set -euo pipefail
          git config user.name 'Bryce Lanham'
          git config user.email 'blanham@gmail.com'

          # The SWI lane may still be finishing its official-firmware run.
          # Poll rather than racing its guarded push.
          for attempt in $(seq 1 60); do
            git fetch --prune origin \
              "$INTEGRATION_BRANCH" \
              "$SWI_BRANCH" \
              "$GITHUB_REF_NAME"
            if git grep -q 'VC4_EXCP_SWI\|vc4_swi' \
                "origin/$INTEGRATION_BRANCH" -- \
                target/vc4 hw/vc4 include/hw/vc4 2>/dev/null; then
              break
            fi
            if git grep -q 'VC4_EXCP_SWI\|vc4_swi' \
                "origin/$SWI_BRANCH" -- \
                target/vc4 hw/vc4 include/hw/vc4 2>/dev/null; then
              break
            fi
            if test "$attempt" = 60; then
              echo 'Validated SWI source did not appear within ten minutes.' >&2
              exit 1
            fi
            sleep 10
          done

          integration_head=$(git rev-parse "origin/$INTEGRATION_BRANCH")
          git switch --detach "$integration_head"

          if ! git grep -q 'VC4_EXCP_SWI\|vc4_swi' HEAD -- \
              target/vc4 hw/vc4 include/hw/vc4 2>/dev/null; then
            swi_head=$(git rev-parse "origin/$SWI_BRANCH")
            git merge --no-ff "$swi_head" \
              -m 'Merge VC4 software interrupt exception support'
          fi

          grep -Rqs 'VC4_EXCP_SWI\|vc4_swi' \
            target/vc4 hw/vc4 include/hw/vc4
          git rev-parse HEAD >/tmp/pre-arm-integration-head

          # Refresh the candidate after its branch-specific workflow has had
          # a chance to materialize source changes from this trigger.
          for attempt in $(seq 1 60); do
            git fetch origin "$GITHUB_REF_NAME"
            candidate=$(git rev-parse "origin/$GITHUB_REF_NAME")
            base=$(git merge-base HEAD "$candidate")
            if git diff --name-only "$base..$candidate" \
                | grep -Eq '^(hw/|target/|include/hw/|tests/)'; then
              break
            fi
            if test "$attempt" = 60; then
              echo 'ARM release branch contains no production candidate.' >&2
              exit 1
            fi
            sleep 10
          done

          candidate=$(git rev-parse "origin/$GITHUB_REF_NAME")
          if ! git merge --no-ff "$candidate" \
              -m 'Merge VC4 ARM release candidate'; then
            git status --short
            git merge --abort
            echo 'ARM release candidate conflicts with current integration.' >&2
            exit 1
          fi

          git diff --check
          git rev-parse HEAD >/tmp/arm-release-merge-head
          git diff --name-only "$(cat /tmp/pre-arm-integration-head)..HEAD" \
            | tee /tmp/arm-release-changed-files.txt
          grep -Eq '^(hw/|target/|include/hw/|tests/)' \
            /tmp/arm-release-changed-files.txt

      - name: Download pinned official firmware trio
        run: |
          for file in bootcode.bin start.elf fixup.dat; do
            curl --fail --location --retry 4 \
              --output "/tmp/${file}" \
              "https://raw.githubusercontent.com/raspberrypi/firmware/${RPI_FIRMWARE_COMMIT}/boot/${file}"
          done
          test "$(git hash-object /tmp/bootcode.bin)" = 7642d2d89e4235e7d68875ff70688bdde6e71b5a
          test "$(git hash-object /tmp/start.elf)" = 0cefcf3a756740760f9903f35cc3843117853712
          test "$(git hash-object /tmp/fixup.dat)" = 1845e38de9d4f9a6d9ad7f5273bfe58b2582a7e6

      - name: Configure and build the merged candidate
        run: |
          mkdir -p /tmp/vc4-arm-release
          ./configure \
            --target-list=aarch64-softmmu \
            --disable-docs \
            --disable-werror
          set -o pipefail
          ninja -C build qemu-system-aarch64 2>&1 \
            | tee /tmp/vc4-arm-release/build.log

      - name: Run focused candidate regressions when present
        run: |
          set -euo pipefail
          mapfile -t test_targets < <(
            git diff --name-only "$(cat /tmp/pre-arm-integration-head)..HEAD" -- tests/qtest \
              | sed -n 's#^tests/qtest/\(.*-test\)\.c$#tests/qtest/\1#p'
          )
          if ((${#test_targets[@]})); then
            ninja -C build "${test_targets[@]}"
            for target in "${test_targets[@]}"; do
              QTEST_QEMU_BINARY="$PWD/build/qemu-system-aarch64" \
                "build/$target" \
                | tee -a /tmp/vc4-arm-release/tests.log
            done
          fi

      - name: Prove progress toward ARM execution
        run: |
          set -euo pipefail
          out=/tmp/vc4-arm-release
          python3 -m py_compile \
            scripts/vc4/raspi3-stock-bootcode-mmio.py \
            scripts/vc4/stock_bootcode_progress.py
          set -o pipefail
          python3 scripts/vc4/raspi3-stock-bootcode-mmio.py \
            build/qemu-system-aarch64 \
            /tmp/bootcode.bin \
            --start-elf /tmp/start.elf \
            --fixup-dat /tmp/fixup.dat \
            --seconds 240 \
            --trace-samples 700 \
            --trace-interval 0.05 \
            --qemu-debug unimp,guest_errors \
            --out-dir "$out" 2>&1 | tee "$out/probe.log"

          python3 - <<'PY'
          from __future__ import annotations
          from pathlib import Path
          import json
          import re

          root = Path('/tmp/vc4-arm-release')
          probe = (root / 'probe.log').read_text(errors='replace').splitlines()
          qemu = (root / 'qemu-mmio.log').read_text(errors='replace').splitlines()

          if any(line.startswith('VC4_LOW_PC_WRITE ') for line in probe):
              raise SystemExit('low-memory PC regression')
          if any('0x1eddba9a' in line.lower() and
                 ('illegal' in line.lower() or 'unimplemented opcode 0x01c0' in line.lower())
                 for line in probe + qemu):
              raise SystemExit('SWI zero regression')

          barriers = [line for line in probe
                      if line.startswith('STOCK_BOOTCODE_BARRIER ')]
          if not barriers:
              raise SystemExit('missing firmware barrier')
          barrier = barriers[-1]
          match = re.search(r'\bpc=0x([0-9a-fA-F]+)', barrier)
          barrier_pc = int(match.group(1), 16) if match else None

          baseline_pc = None
          baseline_path = Path('docs/devel/vc4-post-swi-frontier.json')
          if baseline_path.exists():
              baseline = json.loads(baseline_path.read_text())
              raw = baseline.get('new_barrier_pc') or baseline.get('barrier_pc')
              if isinstance(raw, str):
                  baseline_pc = int(raw, 0)

          def walk(value):
              if isinstance(value, dict):
                  yield value
                  for item in value.values():
                      yield from walk(item)
              elif isinstance(value, list):
                  for item in value:
                      yield from walk(item)

          arm_live = False
          decoded = []
          for line in probe:
              if ' {' not in line:
                  continue
              try:
                  obj = json.loads(line[line.index('{'):])
              except (ValueError, json.JSONDecodeError):
                  continue
              decoded.append(obj)
              for item in walk(obj):
                  index = item.get('cpu_index', item.get('cpu-index', item.get('index')))
                  if index != 0:
                      continue
                  halted = item.get('halted')
                  running = item.get('running')
                  pc = item.get('pc')
                  if isinstance(pc, str):
                      try:
                          pc = int(pc, 0)
                      except ValueError:
                          pc = None
                  if halted is False or running is True or (isinstance(pc, int) and pc != 0):
                      arm_live = True

          if not arm_live:
              text = '\n'.join(probe)
              arm_live = bool(re.search(
                  r'(?i)(cpu(?:-index)?[=: ]+0|CPU0).*'
                  r'(halted[=: ]+false|running[=: ]+true|pc[=: ]+0x[1-9a-f])',
                  text,
              ))

          frontier_changed = (
              barrier_pc is not None and
              baseline_pc is not None and
              barrier_pc != baseline_pc
          )
          if not arm_live and not frontier_changed:
              raise SystemExit(
                  'candidate neither released ARM CPU0 nor changed the post-SWI frontier'
              )

          summary = {
              'schema_version': 1,
              'arm_cpu0_live': arm_live,
              'baseline_barrier_pc': None if baseline_pc is None else f'0x{baseline_pc:08x}',
              'candidate_barrier_pc': None if barrier_pc is None else f'0x{barrier_pc:08x}',
              'frontier_changed': frontier_changed,
              'barrier': barrier,
              'unimplemented_records': [
                  line for line in qemu
                  if 'unimplemented' in line.lower() or 'unimp' in line.lower()
              ][-200:],
          }
          (root / 'summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Publish the validated merge without force-pushing
        run: |
          set -euo pipefail
          expected=$(git rev-parse "origin/$INTEGRATION_BRANCH")
          git push origin \
            "HEAD:refs/heads/$INTEGRATION_BRANCH" \
            --force-with-lease="refs/heads/$INTEGRATION_BRANCH:$expected"
          git rev-parse HEAD >/tmp/vc4-arm-release/integration-commit.txt

      - name: Upload ARM-release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-arm-release-current-${{ github.run_attempt }}
          path: /tmp/vc4-arm-release
          if-no-files-found: warn
          retention-days: 14
