name: VC4 Linux firmware-KMS scanout

on:
  push:
    branches:
      - agent/vc4-linux-fkms-scanout
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-linux-fkms-scanout
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      RPI_FIRMWARE_COMMIT: 3d301dd924bcd758a4c8cb19fe8531031f033f43
      RPI_KERNEL_RELEASE: 6.18.44-v8+
      OFFICIAL_DIR: /tmp/vc4-linux-fkms-official
      MODULE_DIR: /tmp/vc4-linux-fkms-modules
      INITRAMFS_DIR: /tmp/vc4-linux-fkms-initramfs
      DTB_DIR: /tmp/vc4-linux-fkms-dtbs
      OUT_DIR: /tmp/vc4-linux-fkms-witness
      EVIDENCE_DIR: vc4-linux-fkms-evidence
      STATUS_JSON: VC4_LINUX_FKMS_STATUS.json
      STATUS_MD: VC4_LINUX_FKMS_STATUS.md

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        id: dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            binutils-aarch64-linux-gnu \
            cpio curl device-tree-compiler file \
            gcc-aarch64-linux-gnu gzip libdrm-dev \
            libc6-dev-arm64-cross linux-libc-dev-arm64-cross \
            ninja-build pkg-config python3 python3-venv \
            libglib2.0-dev libpixman-1-dev xz-utils zlib1g-dev zstd
          rm -rf \
            "$OFFICIAL_DIR" "$MODULE_DIR" "$INITRAMFS_DIR" \
            "$DTB_DIR" "$OUT_DIR" "$EVIDENCE_DIR"
          mkdir -p \
            "$OFFICIAL_DIR" "$DTB_DIR" "$OUT_DIR" "$EVIDENCE_DIR"

      - name: Apply and validate firmware-KMS emulation
        id: source
        run: |
          set -euo pipefail
          python3 scripts/vc4/apply-fkms-emulation.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/vc4/linux-fkms-init.c")
          text = path.read_text()
          text = text.replace(
              '    marker("VC4_LINUX_FKMS_SCANOUT_OK\\n");\n'
              '    marker("VC4_LINUX_FB_OK\\n");',
              '    marker("VC4_LINUX_FKMS_SCANOUT_OK\\n");\n'
              '    marker("VC4_LINUX_FKMS_OK\\n");\n'
              '    marker("VC4_LINUX_FB_OK\\n");',
          )
          text = text.replace(
              '    if (modeset_result == 0) {\n'
              '        marker("VC4_LINUX_FKMS_OK\\n");\n'
              '    } else {\n'
              '        marker("VC4_LINUX_FKMS_PARTIAL\\n");\n'
              '    }',
              '    if (modeset_result != 0) {\n'
              '        marker("VC4_LINUX_FKMS_PARTIAL\\n");\n'
              '    }',
          )
          path.write_text(text)
          PY
          python3 -m py_compile \
            scripts/vc4/apply-fkms-emulation.py \
            scripts/vc4/fetch-linux-vc4-modules.py \
            scripts/vc4/raspi3-linux-probe.py
          bash -n \
            scripts/vc4/build-linux-fkms-initramfs.sh \
            scripts/vc4/build-v3d-linux-dtb.sh
          test "$(grep -c 'VC4_LINUX_FKMS_OK' tests/vc4/linux-fkms-init.c)" -eq 1
          git diff --check

      - name: Fetch pinned Linux artifacts
        id: pinned
        run: |
          set -euo pipefail
          for file in kernel8.img bcm2710-rpi-3-b.dtb; do
            curl --fail --location --retry 5 \
              --output "$OFFICIAL_DIR/$file" \
              "https://raw.githubusercontent.com/raspberrypi/firmware/${RPI_FIRMWARE_COMMIT}/boot/$file"
          done
          test "$(git hash-object "$OFFICIAL_DIR/kernel8.img")" = \
            a694aa64988bbecadc770c874488165303eac673
          test "$(git hash-object "$OFFICIAL_DIR/bcm2710-rpi-3-b.dtb")" = \
            398c480adc49a5fcb03aa4c095ea74db5d1f893b
          sha256sum "$OFFICIAL_DIR"/* > "$EVIDENCE_DIR/OFFICIAL_SHA256SUMS"

      - name: Fetch pinned VC4 module closure
        id: modules
        run: |
          set -euo pipefail
          python3 scripts/vc4/fetch-linux-vc4-modules.py \
            --base-url \
            "https://raw.githubusercontent.com/raspberrypi/firmware/${RPI_FIRMWARE_COMMIT}/modules/${RPI_KERNEL_RELEASE}" \
            --out-dir "$MODULE_DIR" \
            --target vc4 \
            2>&1 | tee "$EVIDENCE_DIR/modules.log"
          test -s "$MODULE_DIR/MANIFEST"
          test -s "$MODULE_DIR/PROVENANCE"
          cp "$MODULE_DIR/MANIFEST" "$EVIDENCE_DIR/MODULE_MANIFEST"
          cp "$MODULE_DIR/PROVENANCE" "$EVIDENCE_DIR/MODULE_PROVENANCE"
          sha256sum "$MODULE_DIR"/*.ko > "$EVIDENCE_DIR/MODULE_SHA256SUMS"

      - name: Build firmware-KMS initramfs
        id: fixture
        run: |
          set -euo pipefail
          bash scripts/vc4/build-linux-fkms-initramfs.sh \
            "$INITRAMFS_DIR" "$MODULE_DIR" \
            2>&1 | tee "$EVIDENCE_DIR/fixture.log"
          cp "$INITRAMFS_DIR/SHA256SUMS" \
            "$EVIDENCE_DIR/INITRAMFS_SHA256SUMS"

      - name: Build firmware-KMS device tree
        id: dtb
        run: |
          set -euo pipefail
          dtc -q -@ -I dts -O dtb \
            -o "$DTB_DIR/fkms.dtbo" \
            tests/vc4/vc4-fkms-overlay.dts
          bash scripts/vc4/build-v3d-linux-dtb.sh \
            "$OFFICIAL_DIR/bcm2710-rpi-3-b.dtb" \
            "$DTB_DIR/fkms.dtbo" \
            "$DTB_DIR/fkms.dtb"
          firmware_node=$(fdtget -l "$DTB_DIR/fkms.dtb" /soc | \
            grep -E '^firmwarekms@' | head -n 1)
          test -n "$firmware_node"
          test "$(fdtget -t s "$DTB_DIR/fkms.dtb" "/soc/$firmware_node" status)" = okay
          sha256sum "$DTB_DIR"/* > "$EVIDENCE_DIR/DTB_SHA256SUMS"

      - name: Configure and build QEMU frontends
        id: build
        run: |
          set -euo pipefail
          ./configure \
            --target-list=aarch64-softmmu,vc4-softmmu \
            --disable-docs --disable-werror \
            2>&1 | tee "$EVIDENCE_DIR/configure.log"
          ninja -C build qemu-system-aarch64 qemu-system-vc4 \
            2>&1 | tee "$EVIDENCE_DIR/build.log"

      - name: Preserve VC4 architectural regressions
        id: regressions
        run: |
          set -euo pipefail
          python3 scripts/vc4/property-power-domain-smoke.py \
            --qemu build/qemu-system-aarch64 \
            2>&1 | tee "$EVIDENCE_DIR/power-domain.log"
          python3 scripts/vc4/preg-mutex-smoke.py \
            --qemu build/qemu-system-vc4 \
            2>&1 | tee "$EVIDENCE_DIR/preg.log"
          python3 scripts/vc4/msync-smoke.py \
            --qemu build/qemu-system-aarch64 \
            2>&1 | tee "$EVIDENCE_DIR/msync.log"
          python3 scripts/vc4/v3d-smoke.py \
            --qemu build/qemu-system-aarch64 \
            2>&1 | tee "$EVIDENCE_DIR/v3d.log"

      - name: Modeset and scan out through Linux firmware KMS
        id: runtime
        run: |
          set -euo pipefail
          python3 scripts/vc4/raspi3-linux-probe.py \
            --mode linux-direct \
            --qemu build/qemu-system-aarch64 \
            --kernel "$OFFICIAL_DIR/kernel8.img" \
            --dtb "$DTB_DIR/fkms.dtb" \
            --initrd "$INITRAMFS_DIR/initramfs.cpio.gz" \
            --out-dir "$OUT_DIR" \
            --seconds 90 --sample-interval 2 \
            2>&1 | tee "$EVIDENCE_DIR/runtime.log"

      - name: Verify complete firmware-KMS witness
        id: verification
        run: |
          set -euo pipefail
          serial="$OUT_DIR/serial.log"
          for marker in \
            VC4_LINUX_FKMS_START \
            VC4_LINUX_MODULE_CLOSURE_OK \
            VC4_LINUX_FKMS_CARD0_OK \
            VC4_LINUX_FKMS_RESOURCES_OK \
            VC4_LINUX_FKMS_CONNECTOR_OK \
            VC4_LINUX_FKMS_CREATE_DUMB_OK \
            VC4_LINUX_FKMS_MMAP_OK \
            VC4_LINUX_FKMS_ADDFB_OK \
            VC4_LINUX_FKMS_MODESET_OK \
            VC4_LINUX_FKMS_SCANOUT_OK \
            VC4_LINUX_FKMS_OK \
            VC4_LINUX_FB_OK; do
            grep -Fq "$marker" "$serial"
          done
          ! grep -Fq 'VC4_LINUX_FKMS_PARTIAL' "$serial"
          ! grep -Fq 'Kernel panic' "$serial"

          python3 - "$OUT_DIR/result.json" <<'PY'
          import json
          import pathlib
          import sys

          result = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert result.get("passed") is True, result
          assert result.get("init_seen") is True, result
          assert result.get("framebuffer_marker_seen") is True, result
          assert result.get("screenshot", {}).get("quadrants_match") is True, result
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Record firmware-KMS status
        id: record
        run: |
          set -euo pipefail
          python3 - "$OUT_DIR/result.json" "$OUT_DIR/serial.log" \
            "$STATUS_JSON" "$STATUS_MD" <<'PY'
          import datetime
          import json
          import os
          import pathlib
          import sys

          result = json.loads(pathlib.Path(sys.argv[1]).read_text())
          serial = pathlib.Path(sys.argv[2]).read_text(errors="replace")
          record = {
              "schema_version": 1,
              "generated_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "source_sha": os.environ.get("GITHUB_SHA"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "passed": True,
              "frontier": "linux-firmware-kms-scanout-complete",
              "result": result,
              "serial_tail": serial.splitlines()[-240:],
          }
          pathlib.Path(sys.argv[3]).write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n"
          )
          screenshot = result.get("screenshot", {})
          pathlib.Path(sys.argv[4]).write_text(
              "# VC4 Linux firmware-KMS scanout\n\n"
              "Validation passed: **true**\n\n"
              "Frontier: **`linux-firmware-kms-scanout-complete`**\n\n"
              f"- DRM modeset and primary-plane scanout: `true`\n"
              f"- Screenshot quadrants verified: `{screenshot.get('quadrants_match') is True}`\n"
              f"- Resolution: `{screenshot.get('width')}x{screenshot.get('height')}`\n"
          )
          PY
          cp "$STATUS_JSON" "$EVIDENCE_DIR/"
          cp "$STATUS_MD" "$EVIDENCE_DIR/"

      - name: Preserve evidence
        uses: actions/upload-artifact@v4
        with:
          name: vc4-linux-fkms-scanout
          path: |
            /tmp/vc4-linux-fkms-witness
            vc4-linux-fkms-evidence
          if-no-files-found: error

      - name: Commit validated implementation
        run: |
          set -euo pipefail
          rm -f \
            scripts/vc4/apply-fkms-emulation.py \
            .github/workflows/vc4-linux-fkms-scanout.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            hw/arm/bcm2835_peripherals.c \
            hw/misc/bcm2835_property.c \
            include/hw/misc/bcm2835_property.h \
            tests/vc4/linux-fkms-init.c \
            "$STATUS_JSON" \
            "$STATUS_MD"
          git add -u -- \
            scripts/vc4/apply-fkms-emulation.py \
            .github/workflows/vc4-linux-fkms-scanout.yml
          git diff --cached --check
          git commit -m "hw/arm: add Raspberry Pi firmware KMS scanout [skip ci]"
          git push origin HEAD:agent/vc4-linux-fkms-scanout
