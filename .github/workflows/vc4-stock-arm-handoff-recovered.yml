name: VC4 stock firmware AArch64 handoff recovery

on:
  push:
    branches:
      - agent/vc4-stock-arm-handoff-recovered
    paths:
      - .github/workflows/vc4-stock-arm-handoff-recovered.yml
      - hw/arm/**
      - hw/display/**
      - hw/intc/**
      - hw/misc/**
      - hw/sd/**
      - include/hw/arm/**
      - include/hw/display/**
      - include/hw/misc/**
      - include/hw/sd/**
      - target/vc4/**
      - scripts/vc4/raspi3-arm-payload-probe.py
      - scripts/vc4/raspi3-stock-bootcode-probe.py
      - scripts/vc4/preg-mutex-smoke.py
      - scripts/vc4/msync-smoke.py
      - tests/vc4/aarch64-handoff.S
      - tests/vc4/aarch64-handoff.ld
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-stock-arm-handoff-recovered
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      RPI_FIRMWARE_COMMIT: 3d301dd924bcd758a4c8cb19fe8531031f033f43
      FIXTURE_DIR: /tmp/vc4-stock-arm-handoff-fixtures
      RESULT_DIR: /tmp/vc4-stock-arm-handoff-result

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install build dependencies
        id: dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            binutils-aarch64-linux-gnu \
            curl gcc-aarch64-linux-gnu \
            libglib2.0-dev libpixman-1-dev \
            ninja-build pkg-config python3 python3-venv zlib1g-dev
          rm -rf "$FIXTURE_DIR" "$RESULT_DIR"
          mkdir -p "$FIXTURE_DIR" "$RESULT_DIR"

      - name: Validate recovered sources and pin stock firmware
        id: fixtures
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/vc4/raspi3-arm-payload-probe.py \
            scripts/vc4/raspi3-stock-bootcode-probe.py \
            scripts/vc4/preg-mutex-smoke.py \
            scripts/vc4/msync-smoke.py
          git diff --check

          for file in bootcode.bin start.elf fixup.dat bcm2710-rpi-3-b.dtb; do
            curl --fail --location --retry 5 \
              --output "$FIXTURE_DIR/$file" \
              "https://raw.githubusercontent.com/raspberrypi/firmware/${RPI_FIRMWARE_COMMIT}/boot/$file"
          done
          test "$(git hash-object "$FIXTURE_DIR/bootcode.bin")" = \
            7642d2d89e4235e7d68875ff70688bdde6e71b5a
          test "$(git hash-object "$FIXTURE_DIR/start.elf")" = \
            0cefcf3a756740760f9903f35cc3843117853712
          test "$(git hash-object "$FIXTURE_DIR/fixup.dat")" = \
            1845e38de9d4f9a6d9ad7f5273bfe58b2582a7e6
          test "$(git hash-object "$FIXTURE_DIR/bcm2710-rpi-3-b.dtb")" = \
            398c480adc49a5fcb03aa4c095ea74db5d1f893b
          sha256sum "$FIXTURE_DIR"/* > "$FIXTURE_DIR/SHA256SUMS"

          aarch64-linux-gnu-as \
            -o "$FIXTURE_DIR/aarch64-handoff.o" \
            tests/vc4/aarch64-handoff.S
          aarch64-linux-gnu-ld \
            -nostdlib \
            -T tests/vc4/aarch64-handoff.ld \
            -o "$FIXTURE_DIR/aarch64-handoff.elf" \
            "$FIXTURE_DIR/aarch64-handoff.o"
          aarch64-linux-gnu-objcopy \
            -O binary \
            "$FIXTURE_DIR/aarch64-handoff.elf" \
            "$FIXTURE_DIR/kernel8.img"
          aarch64-linux-gnu-readelf -h "$FIXTURE_DIR/aarch64-handoff.elf" \
            | tee "$FIXTURE_DIR/aarch64-handoff.readelf"
          grep -Eq 'Entry point address:[[:space:]]+0x80000' \
            "$FIXTURE_DIR/aarch64-handoff.readelf"
          test -s "$FIXTURE_DIR/kernel8.img"
          sha256sum \
            "$FIXTURE_DIR/aarch64-handoff.elf" \
            "$FIXTURE_DIR/kernel8.img" \
            >> "$FIXTURE_DIR/SHA256SUMS"

      - name: Configure and build both VC4 frontends
        id: build
        run: |
          set -euo pipefail
          ./configure \
            --target-list=aarch64-softmmu,vc4-softmmu \
            --disable-docs --disable-werror \
            2>&1 | tee "$RESULT_DIR/configure.log"
          ninja -C build qemu-system-aarch64 qemu-system-vc4 \
            2>&1 | tee "$RESULT_DIR/build.log"

      - name: Preserve heterogeneous CPU regressions
        id: regressions
        run: |
          set -euo pipefail
          python3 scripts/vc4/preg-mutex-smoke.py \
            --qemu build/qemu-system-vc4 \
            2>&1 | tee "$RESULT_DIR/preg.log"
          python3 scripts/vc4/msync-smoke.py \
            --qemu build/qemu-system-aarch64 \
            2>&1 | tee "$RESULT_DIR/msync.log"

      - name: Run unchanged firmware through the real ARM handoff
        id: runtime
        run: |
          set +e
          python3 scripts/vc4/raspi3-arm-payload-probe.py \
            build/qemu-system-aarch64 \
            "$FIXTURE_DIR/bootcode.bin" \
            "$FIXTURE_DIR/start.elf" \
            "$FIXTURE_DIR/fixup.dat" \
            "$FIXTURE_DIR/bcm2710-rpi-3-b.dtb" \
            "$FIXTURE_DIR/kernel8.img" \
            --out-dir "$RESULT_DIR/probe" \
            --seconds 120 --strict \
            > "$RESULT_DIR/probe.stdout" \
            2> "$RESULT_DIR/probe.stderr"
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$RESULT_DIR/probe.return-code"
          cat "$RESULT_DIR/probe.stdout"
          cat "$RESULT_DIR/probe.stderr" >&2
          exit 0

      - name: Record exact stock-firmware handoff frontier
        id: record
        if: always()
        env:
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          FIXTURES_OUTCOME: ${{ steps.fixtures.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          REGRESSIONS_OUTCOME: ${{ steps.regressions.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          import os

          result_dir = Path(os.environ['RESULT_DIR'])
          probe_dir = result_dir / 'probe'

          def load(path):
              try:
                  return json.loads(path.read_text())
              except Exception:
                  return {}

          probe = load(probe_dir / 'VC4_ARM_PAYLOAD_STATUS.json')
          frontier = load(probe_dir / 'VC4_ARM_PAYLOAD_FRONTIER.json')
          rc_path = result_dir / 'probe.return-code'
          probe_rc = rc_path.read_text().strip() if rc_path.is_file() else None
          outcomes = {
              key.removesuffix('_OUTCOME').lower(): value
              for key, value in os.environ.items()
              if key.endswith('_OUTCOME')
          }
          infrastructure_ok = all(
              outcomes.get(key) == 'success'
              for key in ('dependencies', 'fixtures', 'build', 'regressions', 'runtime')
          )
          signature_seen = probe.get('signature_seen') is True
          passed = infrastructure_ok and signature_seen

          if passed:
              classification = 'stock-firmware-aarch64-handoff-clear'
          elif not infrastructure_ok:
              failed = next(
                  (key for key, value in outcomes.items() if value != 'success'),
                  'unknown',
              )
              classification = f'stock-handoff-infrastructure-{failed}-failed'
          elif probe.get('error'):
              classification = 'stock-handoff-probe-error'
          elif frontier.get('last_unimplemented_opcode'):
              item = frontier['last_unimplemented_opcode']
              opcode = str(item.get('opcode', 'unknown')).replace('0x', '')
              classification = f'stock-handoff-vc4-opcode-{opcode}'
          elif frontier.get('last_illegal_pc'):
              classification = 'stock-handoff-vc4-illegal-instruction'
          else:
              classification = 'stock-firmware-arm-handoff-not-reached'

          status = {
              'schema_version': 1,
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'source_sha': os.environ.get('GITHUB_SHA'),
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
              'passed': passed,
              'classification': classification,
              'probe_return_code': probe_rc,
              'outcomes': outcomes,
              'probe': probe,
              'frontier': frontier,
          }
          Path('VC4_STOCK_ARM_HANDOFF_STATUS.json').write_text(
              json.dumps(status, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )

          record = probe.get('record') or {}
          control = probe.get('arm_control') or frontier.get('arm_control') or {}
          opcode = frontier.get('last_unimplemented_opcode') or {}
          lines = [
              '# VC4 stock-firmware AArch64 handoff',
              '',
              f"Validation passed: **{str(passed).lower()}**",
              '',
              f"Frontier: **`{classification}`**",
              '',
              f"- ARM witness signature: `{probe.get('signature_seen', False)}`",
              f"- Observed signature: `{probe.get('signature_observed')}`",
              f"- Probe return code: `{probe_rc}`",
              f"- MPIDR_EL1: `{record.get('mpidr_el1')}`",
              f"- Initial SP: `{record.get('initial_sp')}`",
              f"- Firmware x0: `{record.get('x0')}`",
              f"- CurrentEL: `{record.get('current_el')}`",
              f"- SCTLR_EL1: `{record.get('sctlr_el1')}`",
              f"- ARM_CONTROL0: `{control.get('arm_control0')}`",
              f"- ARM_CONTROL1: `{control.get('arm_control1')}`",
              f"- ARM_STATUS: `{control.get('arm_status')}`",
              f"- PM_PROC: `{control.get('pm_proc')}`",
              f"- Last unimplemented opcode: `{opcode.get('opcode')}` at `{opcode.get('pc')}`",
              f"- Last illegal PC: `{frontier.get('last_illegal_pc')}`",
              '',
          ]
          diagnostics = frontier.get('diagnostics') or probe.get('diagnostics') or []
          if diagnostics:
              lines += ['## Diagnostic tail', '']
              lines += [f'- `{line}`' for line in diagnostics[-32:]]
              lines += ['']
          Path('VC4_STOCK_ARM_HANDOFF_STATUS.md').write_text(
              '\n'.join(lines), encoding='utf-8'
          )
          print(json.dumps(status, indent=2, sort_keys=True))
          PY

      - name: Upload complete handoff evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-stock-arm-handoff-${{ github.run_attempt }}
          path: |
            VC4_STOCK_ARM_HANDOFF_STATUS.json
            VC4_STOCK_ARM_HANDOFF_STATUS.md
            /tmp/vc4-stock-arm-handoff-fixtures/SHA256SUMS
            /tmp/vc4-stock-arm-handoff-fixtures/aarch64-handoff.readelf
            /tmp/vc4-stock-arm-handoff-result
          if-no-files-found: warn
          retention-days: 14

      - name: Publish the measured frontier
        if: always()
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -f VC4_STOCK_ARM_HANDOFF_STATUS.json
          passed=$(python3 - <<'PY'
          import json
          from pathlib import Path
          print('true' if json.loads(
              Path('VC4_STOCK_ARM_HANDOFF_STATUS.json').read_text()
          ).get('passed') else 'false')
          PY
          )

          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git add -- \
            VC4_STOCK_ARM_HANDOFF_STATUS.json \
            VC4_STOCK_ARM_HANDOFF_STATUS.md
          if [ "$passed" = true ]; then
            git rm -- .github/workflows/vc4-stock-arm-handoff-recovered.yml
            message='hw/arm: validate stock-firmware AArch64 handoff'
          else
            message='tests/vc4: record stock-firmware ARM handoff frontier [skip ci]'
          fi
          git diff --cached --check
          git commit -m "$message"
          git pull --rebase origin "$REF_NAME"
          git push origin "HEAD:$REF_NAME"

      - name: Require the real handoff
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(
              Path('VC4_STOCK_ARM_HANDOFF_STATUS.json').read_text()
          )
          if not status.get('passed'):
              raise SystemExit(1)
          PY
