name: Apply VC4 BTEST, USB settle, and SDHOST tranche

on:
  push:
    branches:
      - agent/vc4-stock-bootcode
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-apply-btest-usb-sdhost
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify bootstrap parent and patch identity
        run: |
          test "$(git rev-parse HEAD^)" = \
            a012503b54a08bb5aa6214d3ba93f1b883c23e15
          gzip -dc \
            scripts/vc4/vc4-btest-usb-sdhost-tranche.patch.gz \
            > /tmp/vc4-btest-usb-sdhost-tranche.patch
          echo \
            'ee5b40453dab5e0373abaa6496a6b16f67e553dd81bac71fb24243ebc8474011  /tmp/vc4-btest-usb-sdhost-tranche.patch' \
            | sha256sum --check --strict

      - name: Apply and validate tranche
        run: |
          git apply --check /tmp/vc4-btest-usb-sdhost-tranche.patch
          git apply /tmp/vc4-btest-usb-sdhost-tranche.patch
          python3 -m py_compile \
            scripts/vc4/btest-zero-fixup.py \
            scripts/vc4/raspi3-btest-zero-smoke.py \
            scripts/vc4/usb-phy-settle-fixup.py \
            scripts/vc4/raspi3-usb-phy-settle-smoke.py \
            scripts/vc4/sdhost-registers-fixup.py \
            scripts/vc4/raspi3-sdhost-registers-smoke.py
          git diff --check

      - name: Publish exact patch result
        run: |
          git config user.name "VC4 bring-up automation"
          git config user.email "vc4-bringup@users.noreply.github.com"
          git rm \
            .github/workflows/vc4-apply-btest-usb-sdhost.yml \
            scripts/vc4/vc4-btest-usb-sdhost-tranche.patch.gz
          git add -A
          git commit -m "ci: restore BTEST zero semantics and advance stock boot"
          git push origin HEAD:agent/vc4-stock-bootcode
