name: WD40 HMP argument introspection

on:
  push:
    branches:
      - wd40/qol-hmp-argument-introspection
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wd40-hmp-argument-introspection
  cancel-in-progress: false

jobs:
  transform-build-test-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure commit identity
        run: |
          git config user.name "WD40 Build Bot"
          git config user.email "wd40-build@users.noreply.github.com"

      - name: Apply, replay, and validate argument metadata
        run: |
          set -Eeuo pipefail
          python3 scripts/wd40/apply-hmp-argument-introspection.py
          git diff --no-ext-diff --binary > /tmp/wd40-hmp-args-pass1.diff
          python3 scripts/wd40/apply-hmp-argument-introspection.py
          git diff --no-ext-diff --binary > /tmp/wd40-hmp-args-pass2.diff
          cmp /tmp/wd40-hmp-args-pass1.diff /tmp/wd40-hmp-args-pass2.diff
          python3 scripts/ci/check-wd40-hmp-argument-introspection.py
          git diff --check

      - name: Install C build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            pkg-config \
            python3-venv \
            libglib2.0-dev \
            libpixman-1-dev

      - name: Build x86_64 without Rust
        run: |
          set -Eeuo pipefail
          mkdir .wd40-poison
          for tool in rustc cargo rustdoc rustfmt bindgen; do
            cat > ".wd40-poison/$tool" <<EOF
          #!/bin/sh
          echo "WD40 Rustless contract: unexpected invocation of $tool" >&2
          exit 99
          EOF
            chmod +x ".wd40-poison/$tool"
          done
          export PATH="$PWD/.wd40-poison:$PATH"
          mkdir build-hmp-args
          cd build-hmp-args
          ../configure \
            --target-list=x86_64-softmmu \
            --disable-rust \
            --enable-fdt=internal \
            --disable-docs \
            --disable-werror
          ninja -j2 qemu-system-x86_64
          cd ..

      - name: Exercise structured HMP argument discovery
        run: |
          set -Eeuo pipefail
          python3 scripts/ci/check-wd40-hmp-argument-introspection.py build-hmp-args

      - name: Publish validated argument metadata
        run: |
          set -Eeuo pipefail
          rm -rf .wd40-poison build-hmp-args
          python3 scripts/ci/check-wd40-hmp-argument-introspection.py
          git diff --check
          git add -A
          if git diff --cached --quiet; then
            echo "HMP argument introspection already applied"
            exit 0
          fi
          git commit -m "monitor: expose structured HMP argument metadata

          Decode the existing HMP args_type mini-language into machine-readable
          descriptors without changing parser or command execution semantics.
          Preserve raw args-type for compatibility and validate the generated
          QMP schema against a real x86_64 system binary."
          git push origin "HEAD:${GITHUB_REF_NAME}"
