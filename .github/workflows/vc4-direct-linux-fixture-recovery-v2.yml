name: VC4 direct Linux fixture recovery v2

on:
  push:
    branches:
      - agent/vc4-hetero-direct-linux
    paths:
      - .github/workflows/vc4-direct-linux-fixture-recovery-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-direct-linux-fixture-recovery-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Make the fixture invocation independent of working directory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/vc4-hetero-direct-linux.yml')
          text = path.read_text(encoding='utf-8')
          absolute = '$GITHUB_WORKSPACE/build/vc4-linux-initramfs'
          if absolute not in text:
              needle = '  build/vc4-linux-initramfs'
              if needle not in text:
                  raise SystemExit('direct-Linux fixture argument was not found')
              text = text.replace(
                  needle,
                  '  "$GITHUB_WORKSPACE/build/vc4-linux-initramfs"',
                  1,
              )
              path.write_text(text, encoding='utf-8')
          PY
          grep -q '\$GITHUB_WORKSPACE/build/vc4-linux-initramfs' \
            .github/workflows/vc4-hetero-direct-linux.yml
          git diff --check

      - name: Publish and remove both recovery workflows
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            .github/workflows/vc4-direct-linux-fixture-recovery.yml \
            .github/workflows/vc4-direct-linux-fixture-recovery-v2.yml
          git add .github/workflows/vc4-hetero-direct-linux.yml
          git diff --cached --check
          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git commit -m "tests/vc4: use an absolute direct-Linux fixture path"
          git pull --rebase origin agent/vc4-hetero-direct-linux
          git push origin HEAD:agent/vc4-hetero-direct-linux
