name: VC4 QPU varying FIFO product v3

on:
  push:
    branches:
      - agent/vc4-linux-mesa-gles2-frontier
    paths:
      - .github/workflows/vc4-varying-fifo-product-v3.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-qpu-varying-fifo-product
  cancel-in-progress: false

jobs:
  fallback:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      TARGET_BRANCH: agent/vc4-linux-mesa-gles2-frontier
      CANDIDATE_BRANCH: agent/vc4-qpu-varying-fifo
      EVIDENCE: /tmp/vc4-varying-fifo-product-v3
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Allow the primary publisher to finish
        id: gate
        run: |
          set -euo pipefail
          rm -rf "$EVIDENCE"
          mkdir -p "$EVIDENCE"
          for attempt in $(seq 1 72); do
            git fetch origin "$TARGET_BRANCH"
            if git show "origin/$TARGET_BRANCH:include/hw/display/vc4_qpu_exec.h" | \
                 grep -Fq VC4_QPU_EXEC_FAULT_VARYING_READ && \
               git show "origin/$TARGET_BRANCH:hw/display/vc4_qpu_exec.c" | \
                 grep -Fq VC4_QPU_REG_VARYING; then
              echo 'already_present=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo 'already_present=false' >> "$GITHUB_OUTPUT"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"

      - name: Install build dependencies
        if: steps.gate.outputs.already_present != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev libpixman-1-dev \
            ninja-build pkg-config python3 zlib1g-dev

      - name: Run candidate helper from its repository location
        if: steps.gate.outputs.already_present != 'true'
        run: |
          set -euo pipefail
          git fetch origin "$CANDIDATE_BRANCH"
          candidate=$(git rev-parse FETCH_HEAD)
          printf '%s\n' "$candidate" > "$EVIDENCE/CANDIDATE_SHA"
          helper=$(git ls-tree -r --name-only "$candidate" | \
            grep -E '^scripts/vc4/.*varying.*fifo.*\.py$' | head -n 1 || true)
          test -n "$helper"
          printf '%s\n' "$helper" > "$EVIDENCE/HELPER_PATH"

          if git cat-file -e "HEAD:$helper" 2>/dev/null; then
            printf '%s\n' tracked > "$EVIDENCE/HELPER_BASE_STATE"
          else
            printf '%s\n' untracked > "$EVIDENCE/HELPER_BASE_STATE"
          fi
          git checkout "$candidate" -- "$helper"
          python3 -m py_compile "$helper"
          python3 "$helper" 2>&1 | tee "$EVIDENCE/materialize.log"

          if test "$(cat "$EVIDENCE/HELPER_BASE_STATE")" = tracked; then
            git checkout HEAD -- "$helper"
          else
            rm -f "$helper"
          fi
          git diff --check
          git diff --name-only | sort > "$EVIDENCE/CHANGED_FILES"
          python3 - <<'PY'
          from pathlib import Path
          allowed = {
              'hw/display/vc4_qpu_exec.c',
              'include/hw/display/vc4_qpu_exec.h',
              'tests/unit/test-vc4-qpu.c',
              'tests/unit/test-vc4-qpu-contract.c',
          }
          changed = {
              line.strip()
              for line in Path('/tmp/vc4-varying-fifo-product-v3/CHANGED_FILES').read_text().splitlines()
              if line.strip()
          }
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit('unexpected paths: ' + ', '.join(unexpected))
          if not changed:
              raise SystemExit('helper produced no product or regression change')
          PY

          grep -Fq VC4_QPU_EXEC_FAULT_VARYING_READ \
            include/hw/display/vc4_qpu_exec.h
          grep -Fq VC4_QPU_REG_VARYING hw/display/vc4_qpu_exec.c
          grep -Fq vc4_qpu_exec_set_varyings \
            include/hw/display/vc4_qpu_exec.h
          grep -Fq 'state->accumulator[5]' hw/display/vc4_qpu_exec.c

      - name: Build and run full focused regression set
        if: steps.gate.outputs.already_present != 'true'
        run: |
          set -euo pipefail
          ./configure \
            --target-list=aarch64-softmmu,vc4-softmmu \
            --disable-docs --disable-werror \
            2>&1 | tee "$EVIDENCE/configure.log"
          ninja -C build \
            qemu-system-aarch64 qemu-system-vc4 \
            tests/unit/test-vc4-qpu \
            tests/unit/test-vc4-qpu-contract \
            tests/unit/test-vc4-tiling \
            tests/unit/test-vc4-v3d-pipeline \
            2>&1 | tee "$EVIDENCE/build.log"
          build/tests/unit/test-vc4-qpu --tap -k \
            2>&1 | tee "$EVIDENCE/qpu.tap"
          build/tests/unit/test-vc4-qpu-contract --tap -k \
            2>&1 | tee "$EVIDENCE/qpu-contract.tap"
          build/tests/unit/test-vc4-tiling --tap -k \
            2>&1 | tee "$EVIDENCE/tiling.tap"
          build/tests/unit/test-vc4-v3d-pipeline --tap -k \
            2>&1 | tee "$EVIDENCE/v3d-pipeline.tap"
          python3 scripts/vc4/v3d-smoke.py \
            --qemu build/qemu-system-aarch64 \
            2>&1 | tee "$EVIDENCE/v3d-smoke.log"

      - name: Publish or discard duplicate product
        if: steps.gate.outputs.already_present != 'true'
        run: |
          set -euo pipefail
          git config user.name 'VC4 CI'
          git config user.email 'vc4-ci@users.noreply.github.com'
          git add \
            hw/display/vc4_qpu_exec.c \
            include/hw/display/vc4_qpu_exec.h \
            tests/unit/test-vc4-qpu.c \
            tests/unit/test-vc4-qpu-contract.c
          git commit -m 'hw/display: implement VC4 QPU varying FIFO reads'

          git fetch origin "$TARGET_BRANCH"
          if git show "origin/$TARGET_BRANCH:include/hw/display/vc4_qpu_exec.h" | \
               grep -Fq VC4_QPU_EXEC_FAULT_VARYING_READ && \
             git show "origin/$TARGET_BRANCH:hw/display/vc4_qpu_exec.c" | \
               grep -Fq VC4_QPU_REG_VARYING; then
            git reset --hard "origin/$TARGET_BRANCH"
            printf '%s\n' duplicate-discarded > "$EVIDENCE/PUBLISH_STATE"
          else
            git rebase "origin/$TARGET_BRANCH"
            git push origin "HEAD:$TARGET_BRANCH"
            printf '%s\n' published > "$EVIDENCE/PUBLISH_STATE"
          fi

      - name: Retire fallback workflow
        if: always()
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          git config user.name 'VC4 CI'
          git config user.email 'vc4-ci@users.noreply.github.com'
          if test -e .github/workflows/vc4-varying-fifo-product-v3.yml; then
            git rm .github/workflows/vc4-varying-fifo-product-v3.yml
            git commit -m 'ci/vc4: retire varying FIFO fallback [skip ci]'
            git push origin "HEAD:$TARGET_BRANCH"
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-varying-fifo-product-v3-${{ github.run_attempt }}
          path: /tmp/vc4-varying-fifo-product-v3
          if-no-files-found: warn
          retention-days: 14
