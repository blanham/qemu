name: Generate post-msync stock-firmware frontier

on:
  push:
    branches:
      - agent/vc4-post-preg-arm-release
    paths:
      - .github/workflows/vc4-generate-post-msync-frontier.yml
      - hw/misc/bcm2835_msync.c
      - hw/arm/bcm2835_peripherals.c
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-post-msync-frontier-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/vc4-post-preg-arm-release
          fetch-depth: 0

      - name: Require validated multicore-sync wiring
        id: ready
        run: |
          if test -f hw/misc/bcm2835_msync.c && \
             grep -q 'TYPE_BCM2835_MSYNC' hw/arm/bcm2835_peripherals.c && \
             grep -q "'bcm2835_msync.c'" hw/misc/meson.build; then
            echo ready=true >> "$GITHUB_OUTPUT"
          else
            echo ready=false >> "$GITHUB_OUTPUT"
          fi

      - name: Derive the branch-local stock frontier
        if: steps.ready.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          candidates = [
              Path('.github/workflows/vc4-preg-stock-frontier.yml'),
              Path('.github/workflows/vc4-stock-arm-payload-preg.yml'),
              Path('.github/workflows/vc4-arm-payload-frontier.yml'),
          ]
          source = next((p for p in candidates if p.is_file()), None)
          if source is None:
              raise SystemExit('no stock-firmware frontier workflow found')

          destination = Path(
              '.github/workflows/vc4-post-msync-stock-frontier.yml'
          )
          text = source.read_text()
          replacements = {
              'agent/vc4-preg-mutex':
                  'agent/vc4-post-preg-arm-release',
              'agent/vc4-arm-payload-stage-repair':
                  'agent/vc4-post-preg-arm-release',
              source.name: destination.name,
              'VC4 stock firmware frontier after p-register support':
                  'VC4 stock firmware frontier after multicore sync',
              'VC4 stock ARM payload after p-register support':
                  'VC4 stock ARM payload after multicore sync',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          lines = text.splitlines()
          if lines and lines[0].startswith('name:'):
              lines[0] = (
                  'name: VC4 stock firmware frontier after multicore sync'
              )
          destination.write_text('\n'.join(lines) + '\n')
          print(f'derived {destination} from {source}')
          PY

          grep -q 'agent/vc4-post-preg-arm-release' \
            .github/workflows/vc4-post-msync-stock-frontier.yml

      - name: Publish generated frontier and remove generator
        if: steps.ready.outputs.ready == 'true'
        run: |
          set -euo pipefail
          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git add .github/workflows/vc4-post-msync-stock-frontier.yml
          git rm .github/workflows/vc4-generate-post-msync-frontier.yml
          git commit -m "ci/vc4: probe stock firmware after multicore sync"
          git pull --rebase origin agent/vc4-post-preg-arm-release
          git push origin HEAD:agent/vc4-post-preg-arm-release
