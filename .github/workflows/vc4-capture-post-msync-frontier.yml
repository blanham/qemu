name: Capture post-msync stock-firmware frontier

on:
  push:
    branches:
      - agent/vc4-post-preg-arm-release
    paths:
      - .github/workflows/vc4-post-msync-stock-frontier.yml
      - .github/workflows/vc4-capture-post-msync-frontier.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: vc4-post-msync-capture-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/vc4-post-preg-arm-release
          fetch-depth: 0

      - name: Wait for frontier run and capture artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: agent/vc4-post-preg-arm-release
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path
          from zipfile import ZipFile, BadZipFile
          import json
          import os
          import re
          import shutil
          import time
          import urllib.parse
          import urllib.request

          repo = os.environ['REPOSITORY']
          branch = os.environ['BRANCH']
          token = os.environ['GH_TOKEN']
          server = os.environ['SERVER_URL']
          api_root = f'https://api.github.com/repos/{repo}'
          workflow = 'vc4-post-msync-stock-frontier.yml'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'vc4-frontier-capture',
          }

          def request_json(url: str) -> dict:
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)

          def download(url: str, destination: Path) -> None:
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=180) as response:
                  destination.write_bytes(response.read())

          runs_url = (
              f'{api_root}/actions/workflows/{workflow}/runs?'
              + urllib.parse.urlencode({
                  'branch': branch,
                  'event': 'push',
                  'per_page': 20,
              })
          )
          deadline = time.monotonic() + 35 * 60
          selected: dict | None = None
          last_runs: list[dict] = []
          while time.monotonic() < deadline:
              payload = request_json(runs_url)
              last_runs = payload.get('workflow_runs', [])
              for run in last_runs:
                  if run.get('status') == 'completed':
                      selected = run
                      break
              if selected is not None:
                  break
              time.sleep(15)

          capture_root = Path('vc4-frontier-capture')
          shutil.rmtree(capture_root, ignore_errors=True)
          capture_root.mkdir()
          archives: list[Path] = []
          artifact_metadata: list[dict] = []
          logs_archive: Path | None = None

          if selected is not None:
              run_id = selected['id']
              artifacts = request_json(
                  f'{api_root}/actions/runs/{run_id}/artifacts?per_page=100'
              ).get('artifacts', [])
              for index, artifact in enumerate(artifacts):
                  if artifact.get('expired'):
                      continue
                  name = re.sub(
                      r'[^A-Za-z0-9_.-]+', '_',
                      artifact.get('name') or f'artifact-{index}',
                  )
                  path = capture_root / f'{index:02d}-{name}.zip'
                  download(artifact['archive_download_url'], path)
                  archives.append(path)
                  artifact_metadata.append({
                      key: artifact.get(key)
                      for key in (
                          'id', 'name', 'size_in_bytes', 'expired',
                          'created_at', 'updated_at', 'digest'
                      )
                  })
              try:
                  logs_archive = capture_root / 'workflow-logs.zip'
                  download(
                      f'{api_root}/actions/runs/{run_id}/logs',
                      logs_archive,
                  )
                  archives.append(logs_archive)
              except Exception as exc:
                  (capture_root / 'logs-download-error.txt').write_text(
                      f'{type(exc).__name__}: {exc}\n'
                  )

          extracted = capture_root / 'extracted'
          extracted.mkdir()
          extracted_files: list[Path] = []
          for index, archive in enumerate(archives):
              destination = extracted / f'{index:02d}-{archive.stem}'
              destination.mkdir()
              try:
                  with ZipFile(archive) as zf:
                      zf.extractall(destination)
              except BadZipFile:
                  continue
              extracted_files.extend(
                  p for p in destination.rglob('*') if p.is_file()
              )

          opcode_patterns = [
              re.compile(
                  r'unimplemented(?: scalar)? opcode\\s+'
                  r'(?:0x)?([0-9a-f]{4,8}).*?'
                  r'(?:pc|at)\\s*(?:=|:)?\\s*'
                  r'(?:0x)?([0-9a-f]{6,8})', re.I
              ),
              re.compile(
                  r'opcode\\s*(?:=|:)?\\s*0x([0-9a-f]{4,8})'
                  r'.*?pc\\s*(?:=|:)?\\s*0x([0-9a-f]{6,8})',
                  re.I
              ),
              re.compile(
                  r'pc\\s*(?:=|:)?\\s*0x([0-9a-f]{6,8})'
                  r'.*?opcode\\s*(?:=|:)?\\s*0x([0-9a-f]{4,8})',
                  re.I
              ),
          ]
          mmio_pattern = re.compile(
              r'(?:invalid|unimplemented|unsupported).{0,120}'
              r'(0x(?:7e|3f)[0-9a-f]{6})', re.I
          )
          opcodes: list[dict] = []
          mmio: list[dict] = []
          interesting: list[dict] = []
          json_documents: list[dict] = []

          for path in extracted_files:
              rel = str(path.relative_to(capture_root))
              text = path.read_bytes().decode('utf-8', errors='replace')
              if path.suffix.lower() == '.json':
                  try:
                      json_documents.append({
                          'path': rel,
                          'document': json.loads(text),
                      })
                  except Exception:
                      pass
              for line_number, line in enumerate(text.splitlines(), 1):
                  lower = line.lower()
                  if any(term in lower for term in (
                      'unimplemented', 'invalid read', 'invalid write',
                      'signature', 'payload', 'frontier', 'exception',
                      'halted', 'arm_status', 'kernel_word'
                  )):
                      interesting.append({
                          'path': rel,
                          'line': line_number,
                          'text': line[:1600],
                      })
                  for pattern_index, pattern in enumerate(opcode_patterns):
                      match = pattern.search(line)
                      if match is None:
                          continue
                      if pattern_index == 2:
                          pc, opcode = match.group(1), match.group(2)
                      else:
                          opcode, pc = match.group(1), match.group(2)
                      opcodes.append({
                          'opcode': opcode.lower(),
                          'pc': pc.lower(),
                          'path': rel,
                          'line': line_number,
                          'text': line[:1600],
                      })
                  for match in mmio_pattern.finditer(line):
                      mmio.append({
                          'address': match.group(1).lower(),
                          'path': rel,
                          'line': line_number,
                          'text': line[:1600],
                      })

          harvested_fields: list[dict] = []

          def harvest(value, path: list[str]) -> None:
              if isinstance(value, dict):
                  for key, child in value.items():
                      child_path = path + [str(key)]
                      key_lower = str(key).lower()
                      if any(term in key_lower for term in (
                          'signature', 'opcode', 'frontier', 'halt',
                          'payload', 'arm_status', 'kernel_word',
                          'returncode', 'validated', 'passed'
                      )) and not isinstance(child, (dict, list)):
                          harvested_fields.append({
                              'path': '.'.join(child_path),
                              'value': child,
                          })
                      harvest(child, child_path)
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      harvest(child, path + [str(index)])

          for item in json_documents:
              harvest(item['document'], [item['path']])

          opcode_counts = Counter(
              (item['opcode'], item['pc']) for item in opcodes
          )
          mmio_counts = Counter(item['address'] for item in mmio)
          former_p16_count = sum(
              count for (opcode, _pc), count in opcode_counts.items()
              if opcode.startswith('cc20')
          )

          signature_fields = [
              field for field in harvested_fields
              if 'signature' in field['path'].lower()
          ]
          signature_seen = any(
              field['value'] is True
              or str(field['value']).lower() in {'true', '1', 'yes'}
              for field in signature_fields
              if field['path'].lower().endswith('signature_seen')
          )

          report = {
              'schema_version': 1,
              'captured_at': datetime.now(timezone.utc).isoformat(),
              'source_workflow': workflow,
              'source_run': None if selected is None else {
                  key: selected.get(key)
                  for key in (
                      'id', 'name', 'head_branch', 'head_sha', 'status',
                      'conclusion', 'event', 'run_number', 'run_attempt',
                      'created_at', 'updated_at', 'html_url'
                  )
              },
              'recent_runs': [
                  {
                      key: run.get(key)
                      for key in (
                          'id', 'head_sha', 'status', 'conclusion',
                          'created_at', 'html_url'
                      )
                  }
                  for run in last_runs[:10]
              ],
              'artifacts': artifact_metadata,
              'extracted_file_count': len(extracted_files),
              'former_p16_blocker_count': former_p16_count,
              'arm_payload_signature_seen': signature_seen,
              'opcode_counts': [
                  {'opcode': opcode, 'pc': pc, 'count': count}
                  for (opcode, pc), count in opcode_counts.most_common()
              ],
              'mmio_counts': [
                  {'address': address, 'count': count}
                  for address, count in mmio_counts.most_common()
              ],
              'harvested_fields': harvested_fields[:2000],
              'interesting_lines': interesting[:4000],
          }
          Path('VC4_POST_MSYNC_FRONTIER.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n'
          )

          lines = [
              '# VC4 post-multicore-sync stock-firmware frontier',
              '',
              f"Source run: `{report['source_run']}`",
              '',
              f"ARM payload signature seen: **{signature_seen}**",
              f"Former `0xcc20` blocker hits: **{former_p16_count}**",
              '',
              '## Unimplemented scalar opcodes',
          ]
          if opcode_counts:
              lines.extend(
                  f'- `0x{opcode}` at `0x{pc}`: {count} hit(s)'
                  for (opcode, pc), count
                  in opcode_counts.most_common(30)
              )
          else:
              lines.append('- None parsed.')
          lines.extend(['', '## Invalid/unimplemented MMIO'])
          if mmio_counts:
              lines.extend(
                  f'- `{address}`: {count} hit(s)'
                  for address, count in mmio_counts.most_common(40)
              )
          else:
              lines.append('- None parsed.')
          lines.extend(['', '## Harvested result fields'])
          lines.extend(
              f"- `{field['path']}` = `{field['value']}`"
              for field in harvested_fields[:150]
          )
          Path('VC4_POST_MSYNC_FRONTIER.md').write_text(
              '\n'.join(lines) + '\n'
          )
          PY

      - name: Publish report and remove temporary frontier workflows
        run: |
          set -euo pipefail
          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git add \
            VC4_POST_MSYNC_FRONTIER.json \
            VC4_POST_MSYNC_FRONTIER.md
          git rm -f \
            .github/workflows/vc4-capture-post-msync-frontier.yml \
            .github/workflows/vc4-post-msync-stock-frontier.yml \
            .github/workflows/vc4-generate-post-msync-frontier.yml \
            2>/dev/null || true
          git commit -m "ci/vc4: record post-msync stock frontier"
          git pull --rebase origin agent/vc4-post-preg-arm-release
          git push origin HEAD:agent/vc4-post-preg-arm-release
