name: Stage VC4 live HVS state capture

on:
  push:
    branches:
      - agent/vc4-linux-kms-bind-diagnostics
    paths:
      - .github/workflows/vc4-hvs-live-state-stage.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-hvs-live-state-stage
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/vc4-linux-kms-bind-diagnostics
          fetch-depth: 0

