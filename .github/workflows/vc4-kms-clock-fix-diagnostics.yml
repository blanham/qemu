name: VC4 retire incorrect firmware clock hypothesis

on:
  push:
    branches:
      - agent/vc4-linux-kms-bind-diagnostics
    paths:
      - .github/workflows/vc4-kms-clock-fix-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-kms-clock-fix-diagnostics
  cancel-in-progress: true

jobs:
  retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore the pre-hypothesis source state
        run: |
          set -euo pipefail
          git checkout c16abcd3bba0644e4b97dc666e138c6ed0c0bf8a -- \
            include/hw/arm/raspberrypi-fw-defs.h \
            hw/misc/bcm2835_property.c \
            scripts/vc4/property-power-domain-smoke.py
          ! grep -Fq RPI_FIRMWARE_DISP_CLK_ID \
            include/hw/arm/raspberrypi-fw-defs.h
          git diff --check

      - name: Publish the cleanup and remove this transient workflow
        run: |
          set -euo pipefail
          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git add -- \
            include/hw/arm/raspberrypi-fw-defs.h \
            hw/misc/bcm2835_property.c \
            scripts/vc4/property-power-domain-smoke.py
          git rm -- .github/workflows/vc4-kms-clock-fix-diagnostics.yml
          git commit -m "ci/vc4: retire incorrect firmware-clock hypothesis"
          git pull --rebase origin agent/vc4-linux-kms-bind-diagnostics
          git push origin HEAD:agent/vc4-linux-kms-bind-diagnostics
