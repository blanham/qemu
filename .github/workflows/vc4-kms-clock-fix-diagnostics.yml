name: VC4 KMS firmware clock fix diagnostics

on:
  push:
    branches:
      - agent/vc4-linux-kms-bind-diagnostics
    paths:
      - .github/workflows/vc4-kms-clock-fix-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-kms-clock-fix-diagnostics
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Implement the ordered firmware clock ABI
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              return text.replace(old, new, 1)

          defs_path = Path("include/hw/arm/raspberrypi-fw-defs.h")
          defs = defs_path.read_text()
          defs = replace_once(
              defs,
              """    RPI_FIRMWARE_PIXEL_BVB_CLK_ID,
              RPI_FIRMWARE_VEC_CLK_ID,
              RPI_FIRMWARE_NUM_CLK_ID,
          """,
              """    RPI_FIRMWARE_PIXEL_BVB_CLK_ID,
              RPI_FIRMWARE_VEC_CLK_ID,
              RPI_FIRMWARE_DISP_CLK_ID,
              RPI_FIRMWARE_NUM_CLK_ID,
          """,
              "firmware clock enum",
          )
          defs_path.write_text(defs)

          property_path = Path("hw/misc/bcm2835_property.c")
          source = property_path.read_text()
          source = replace_once(
              source,
              """/*
           * The Linux firmware-clock provider sizes its onecell table from the
           * IDs returned by GET_CLOCKS.  Advertise every clock that QEMU can
           * service and that the upstream Raspberry Pi clock driver exports;
           * otherwise display consumers such as HDMI fail before component
           * binding when their clock index lies above the ARM clock.
           */
          static const uint32_t bcm2835_property_clock_ids[] = {
              RPI_FIRMWARE_ARM_CLK_ID,
              RPI_FIRMWARE_CORE_CLK_ID,
              RPI_FIRMWARE_V3D_CLK_ID,
              RPI_FIRMWARE_ISP_CLK_ID,
              RPI_FIRMWARE_PIXEL_CLK_ID,
              RPI_FIRMWARE_HEVC_CLK_ID,
              RPI_FIRMWARE_M2MC_CLK_ID,
              RPI_FIRMWARE_PIXEL_BVB_CLK_ID,
              RPI_FIRMWARE_VEC_CLK_ID,
          };
          """,
              """/*
           * GET_CLOCKS is an ordered firmware ABI, not a sparse capability
           * list.  Linux advances the size of its onecell provider while it
           * walks this response, so omitting an earlier ID can make later
           * clocks (notably HDMI pixel clock 9) impossible to address even if
           * that later ID is present.  Return every defined clock in order.
           */
          static const uint32_t bcm2835_property_clock_ids[] = {
              RPI_FIRMWARE_EMMC_CLK_ID,
              RPI_FIRMWARE_UART_CLK_ID,
              RPI_FIRMWARE_ARM_CLK_ID,
              RPI_FIRMWARE_CORE_CLK_ID,
              RPI_FIRMWARE_V3D_CLK_ID,
              RPI_FIRMWARE_H264_CLK_ID,
              RPI_FIRMWARE_ISP_CLK_ID,
              RPI_FIRMWARE_SDRAM_CLK_ID,
              RPI_FIRMWARE_PIXEL_CLK_ID,
              RPI_FIRMWARE_PWM_CLK_ID,
              RPI_FIRMWARE_HEVC_CLK_ID,
              RPI_FIRMWARE_EMMC2_CLK_ID,
              RPI_FIRMWARE_M2MC_CLK_ID,
              RPI_FIRMWARE_PIXEL_BVB_CLK_ID,
              RPI_FIRMWARE_VEC_CLK_ID,
              RPI_FIRMWARE_DISP_CLK_ID,
          };
          """,
              "GET_CLOCKS table",
          )
          property_path.write_text(source)

          smoke_path = Path("scripts/vc4/property-power-domain-smoke.py")
          smoke = smoke_path.read_text()
          smoke = replace_once(
              smoke,
              '"""Exercise Raspberry Pi firmware legacy and modern power-state tags."""',
              '"""Exercise Raspberry Pi firmware power, clock, and GPIO tags."""',
              "smoke description",
          )
          smoke = replace_once(
              smoke,
              """PROPERTY_RESPONSE_LENGTH = (1 << 31) | 8

          RPI_FWREQ_GET_POWER_STATE = 0x00020001
          """,
              """PROPERTY_RESPONSE_LENGTH = (1 << 31) | 8

          RPI_FWREQ_GET_CLOCKS = 0x00010007
          EXPECTED_FIRMWARE_CLOCK_IDS = tuple(range(1, 17))

          RPI_FWREQ_GET_POWER_STATE = 0x00020001
          """,
              "smoke clock constants",
          )

          helper = '''

          def firmware_clock_ids(qtest: QTestClient) -> tuple[int, ...]:
              pair_count = len(EXPECTED_FIRMWARE_CLOCK_IDS)
              response = property_words_request(
                  qtest,
                  RPI_FWREQ_GET_CLOCKS,
                  tuple(0 for _ in range(pair_count * 2)),
                  pair_count * 2 * 4,
              )
              parents = tuple(response[0::2])
              if any(parent != 0 for parent in parents):
                  raise RuntimeError(
                      f"GET_CLOCKS returned unsupported parents: {parents!r}"
                  )
              return tuple(response[1::2])
          '''
          marker = "def expect_state(\n"
          if smoke.count(marker) != 1:
              raise SystemExit("smoke helper insertion anchor changed")
          smoke = smoke.replace(marker, helper + "\n\n" + marker, 1)
          smoke = smoke.replace("        )\ndef expect_state(\n", "        )\n\n\ndef expect_state(\n", 1)

          runtime = """            clock_ids = firmware_clock_ids(qtest)
              if clock_ids != EXPECTED_FIRMWARE_CLOCK_IDS:
                  raise RuntimeError(
                      f"unexpected GET_CLOCKS response: {clock_ids!r}"
                  )

          """
          runtime_anchor = "            for offset in range(EXP_GPIO_COUNT):\n"
          if smoke.count(runtime_anchor) != 1:
              raise SystemExit("smoke runtime anchor changed")
          smoke = smoke.replace(runtime_anchor, runtime + runtime_anchor, 1)
          smoke = smoke.replace(
              'print("Raspberry Pi firmware power-domain and expander GPIO smoke test passed")',
              'print("Raspberry Pi firmware power, clock, and GPIO smoke test passed")',
              1,
          )
          smoke_path.write_text(smoke)
          PY

          python3 -m py_compile scripts/vc4/property-power-domain-smoke.py
          git diff --check
          grep -Fq RPI_FIRMWARE_DISP_CLK_ID include/hw/arm/raspberrypi-fw-defs.h
          grep -Fq EXPECTED_FIRMWARE_CLOCK_IDS scripts/vc4/property-power-domain-smoke.py

      - name: Build and run the property-channel witness
        run: |
          set -euo pipefail
          ./configure \
            --target-list=aarch64-softmmu \
            --disable-docs --disable-werror
          ninja -C build qemu-system-aarch64
          python3 scripts/vc4/property-power-domain-smoke.py \
            --qemu build/qemu-system-aarch64

      - name: Publish the validated repair
        run: |
          set -euo pipefail
          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git add -- \
            include/hw/arm/raspberrypi-fw-defs.h \
            hw/misc/bcm2835_property.c \
            scripts/vc4/property-power-domain-smoke.py
          git rm -- .github/workflows/vc4-kms-clock-fix-diagnostics.yml
          git commit -m "hw/misc: enumerate complete Raspberry Pi firmware clocks"
          git pull --rebase origin agent/vc4-linux-kms-bind-diagnostics
          git push origin HEAD:agent/vc4-linux-kms-bind-diagnostics
