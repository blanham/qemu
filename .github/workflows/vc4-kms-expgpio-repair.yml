name: VC4 KMS expander GPIO repair

on:
  push:
    branches:
      - agent/vc4-linux-kms-frontier
    paths:
      - .github/workflows/vc4-kms-expgpio-repair.yml

permissions:
  contents: write

concurrency:
  group: vc4-kms-expgpio-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply firmware expander GPIO support and regression coverage
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          header_path = Path("include/hw/misc/bcm2835_property.h")
          header = header_path.read_text()
          header_anchor = """    uint32_t legacy_power_state;
              uint32_t power_domain_state;
              char *command_line;
          """
          header_replacement = """    uint32_t legacy_power_state;
              uint32_t power_domain_state;
              uint32_t exp_gpio_direction;
              uint32_t exp_gpio_polarity;
              uint32_t exp_gpio_term_en;
              uint32_t exp_gpio_term_pull_up;
              uint32_t exp_gpio_state;
              char *command_line;
          """
          if header.count(header_anchor) != 1:
              raise SystemExit("property-state header anchor changed")
          header_path.write_text(header.replace(header_anchor, header_replacement, 1))

          prop_path = Path("hw/misc/bcm2835_property.c")
          prop = prop_path.read_text()
          define_anchor = "#define BCM2835_PROPERTY_POWER_STATE_COUNT 32\n"
          define_replacement = define_anchor + """#define BCM2835_PROPERTY_EXP_GPIO_BASE 128
          #define BCM2835_PROPERTY_EXP_GPIO_COUNT 8
          """
          if prop.count(define_anchor) != 1:
              raise SystemExit("property define anchor changed")
          prop = prop.replace(define_anchor, define_replacement, 1)

          prop = prop.replace(
              "bcm2835_property_get_power_state", "bcm2835_property_get_bit"
          )
          prop = prop.replace(
              "bcm2835_property_set_power_state", "bcm2835_property_set_bit"
          )

          helper_anchor = "static void bcm2835_property_mbox_push(BCM2835PropertyState *s, uint32_t value)\n"
          helper = """static bool bcm2835_property_exp_gpio_index(uint32_t id,
                                                         uint32_t *index)
          {
              if (id < BCM2835_PROPERTY_EXP_GPIO_BASE ||
                  id >= BCM2835_PROPERTY_EXP_GPIO_BASE +
                        BCM2835_PROPERTY_EXP_GPIO_COUNT) {
                  return false;
              }

              *index = id - BCM2835_PROPERTY_EXP_GPIO_BASE;
              return true;
          }

          """
          if prop.count(helper_anchor) != 1:
              raise SystemExit("mailbox helper anchor changed")
          prop = prop.replace(helper_anchor, helper + helper_anchor, 1)

          switch_anchor = """        /* Clocks */
          """
          gpio_cases = """        /* Firmware-controlled expander GPIOs */

                  case RPI_FWREQ_GET_GPIO_CONFIG:
                  {
                      uint32_t id = ldl_le_phys(&s->dma_as, value + 12);
                      uint32_t index;

                      resplen = 5 * sizeof(uint32_t);
                      if (!bcm2835_property_exp_gpio_index(id, &index)) {
                          qemu_log_mask(LOG_GUEST_ERROR,
                                        "bcm2835_property: invalid expander GPIO id %u\\n",
                                        id);
                          break;
                      }

                      stl_le_phys(&s->dma_as, value + 12, 0);
                      stl_le_phys(&s->dma_as, value + 16,
                                  bcm2835_property_get_bit(
                                      s->exp_gpio_direction, index));
                      stl_le_phys(&s->dma_as, value + 20,
                                  bcm2835_property_get_bit(
                                      s->exp_gpio_polarity, index));
                      stl_le_phys(&s->dma_as, value + 24,
                                  bcm2835_property_get_bit(
                                      s->exp_gpio_term_en, index));
                      stl_le_phys(&s->dma_as, value + 28,
                                  bcm2835_property_get_bit(
                                      s->exp_gpio_term_pull_up, index));
                      break;
                  }
                  case RPI_FWREQ_SET_GPIO_CONFIG:
                  {
                      uint32_t id = ldl_le_phys(&s->dma_as, value + 12);
                      uint32_t index;

                      resplen = 6 * sizeof(uint32_t);
                      if (!bcm2835_property_exp_gpio_index(id, &index)) {
                          qemu_log_mask(LOG_GUEST_ERROR,
                                        "bcm2835_property: invalid expander GPIO id %u\\n",
                                        id);
                          break;
                      }

                      bcm2835_property_set_bit(
                          &s->exp_gpio_direction, index,
                          ldl_le_phys(&s->dma_as, value + 16));
                      bcm2835_property_set_bit(
                          &s->exp_gpio_polarity, index,
                          ldl_le_phys(&s->dma_as, value + 20));
                      bcm2835_property_set_bit(
                          &s->exp_gpio_term_en, index,
                          ldl_le_phys(&s->dma_as, value + 24));
                      bcm2835_property_set_bit(
                          &s->exp_gpio_term_pull_up, index,
                          ldl_le_phys(&s->dma_as, value + 28));
                      if (bcm2835_property_get_bit(
                              s->exp_gpio_direction, index)) {
                          bcm2835_property_set_bit(
                              &s->exp_gpio_state, index,
                              ldl_le_phys(&s->dma_as, value + 32));
                      }
                      stl_le_phys(&s->dma_as, value + 12, 0);
                      break;
                  }
                  case RPI_FWREQ_GET_GPIO_STATE:
                  {
                      uint32_t id = ldl_le_phys(&s->dma_as, value + 12);
                      uint32_t index;

                      resplen = 2 * sizeof(uint32_t);
                      if (!bcm2835_property_exp_gpio_index(id, &index)) {
                          qemu_log_mask(LOG_GUEST_ERROR,
                                        "bcm2835_property: invalid expander GPIO id %u\\n",
                                        id);
                          break;
                      }

                      stl_le_phys(&s->dma_as, value + 12, 0);
                      stl_le_phys(&s->dma_as, value + 16,
                                  bcm2835_property_get_bit(
                                      s->exp_gpio_state, index));
                      break;
                  }
                  case RPI_FWREQ_SET_GPIO_STATE:
                  {
                      uint32_t id = ldl_le_phys(&s->dma_as, value + 12);
                      uint32_t requested = ldl_le_phys(&s->dma_as, value + 16);
                      uint32_t index;

                      resplen = 2 * sizeof(uint32_t);
                      if (!bcm2835_property_exp_gpio_index(id, &index)) {
                          qemu_log_mask(LOG_GUEST_ERROR,
                                        "bcm2835_property: invalid expander GPIO id %u\\n",
                                        id);
                          break;
                      }

                      stl_le_phys(&s->dma_as, value + 12, 0);
                      stl_le_phys(&s->dma_as, value + 16,
                                  bcm2835_property_set_bit(
                                      &s->exp_gpio_state, index, requested));
                      break;
                  }

                  /* Clocks */
          """
          if prop.count(switch_anchor) != 1:
              raise SystemExit("clock section anchor changed")
          prop = prop.replace(switch_anchor, gpio_cases, 1)

          prop = prop.replace(
              ".version_id = 2,\n", ".version_id = 3,\n", 1
          )
          vmstate_anchor = """        VMSTATE_UINT32_V(power_domain_state, BCM2835PropertyState, 2),
                  VMSTATE_BOOL(pending, BCM2835PropertyState),
          """
          vmstate_replacement = """        VMSTATE_UINT32_V(power_domain_state, BCM2835PropertyState, 2),
                  VMSTATE_UINT32_V(exp_gpio_direction, BCM2835PropertyState, 3),
                  VMSTATE_UINT32_V(exp_gpio_polarity, BCM2835PropertyState, 3),
                  VMSTATE_UINT32_V(exp_gpio_term_en, BCM2835PropertyState, 3),
                  VMSTATE_UINT32_V(exp_gpio_term_pull_up, BCM2835PropertyState, 3),
                  VMSTATE_UINT32_V(exp_gpio_state, BCM2835PropertyState, 3),
                  VMSTATE_BOOL(pending, BCM2835PropertyState),
          """
          if prop.count(vmstate_anchor) != 1:
              raise SystemExit("property vmstate anchor changed")
          prop = prop.replace(vmstate_anchor, vmstate_replacement, 1)

          reset_anchor = """    s->legacy_power_state = 0;
              s->power_domain_state = 0;
          """
          reset_replacement = """    s->legacy_power_state = 0;
              s->power_domain_state = 0;
              s->exp_gpio_direction = 0;
              s->exp_gpio_polarity = 0;
              s->exp_gpio_term_en = 0;
              s->exp_gpio_term_pull_up = 0;
              s->exp_gpio_state = 0;
          """
          if prop.count(reset_anchor) != 1:
              raise SystemExit("property reset anchor changed")
          prop_path.write_text(prop.replace(reset_anchor, reset_replacement, 1))

          smoke_path = Path("scripts/vc4/property-power-domain-smoke.py")
          smoke = smoke_path.read_text()
          constant_anchor = """RPI_FWREQ_GET_DOMAIN_STATE = 0x00030030
          RPI_FWREQ_SET_DOMAIN_STATE = 0x00038030

          LEGACY_V3D_POWER_ID = 10
          """
          constant_replacement = """RPI_FWREQ_GET_DOMAIN_STATE = 0x00030030
          RPI_FWREQ_SET_DOMAIN_STATE = 0x00038030
          RPI_FWREQ_GET_GPIO_STATE = 0x00030041
          RPI_FWREQ_GET_GPIO_CONFIG = 0x00030043
          RPI_FWREQ_SET_GPIO_STATE = 0x00038041
          RPI_FWREQ_SET_GPIO_CONFIG = 0x00038043

          LEGACY_V3D_POWER_ID = 10
          EXP_GPIO_BASE = 128
          EXP_GPIO_COUNT = 8
          EXP_GPIO_HDMI_HPD = 4
          """
          if smoke.count(constant_anchor) != 1:
              raise SystemExit("smoke constants anchor changed")
          smoke = smoke.replace(constant_anchor, constant_replacement, 1)

          request_start = smoke.index("def property_request(\n")
          request_end = smoke.index("\ndef expect_state(\n", request_start)
          generic_requests = '''def property_words_request(
              qtest: QTestClient,
              tag: int,
              payload: tuple[int, ...],
              expected_response_size: int,
          ) -> list[int]:
              if expected_response_size % 4:
                  raise ValueError("property responses must contain whole words")

              buffer_size = len(payload) * 4
              words = (
                  24 + buffer_size,
                  0,
                  tag,
                  buffer_size,
                  0,
                  *payload,
                  0,
              )
              for index, word in enumerate(words):
                  qtest.writel(PROPERTY_BUFFER + index * 4, word)

              qtest.writel(
                  MAILBOX_WRITE,
                  PROPERTY_BUFFER | MAILBOX_PROPERTY_CHANNEL,
              )
              response_address = qtest.readl(MAILBOX_READ)
              expected_address = PROPERTY_BUFFER | MAILBOX_PROPERTY_CHANNEL
              if response_address != expected_address:
                  raise RuntimeError(
                      "mailbox returned the wrong property buffer: "
                      f"0x{response_address:08x} != 0x{expected_address:08x}"
                  )

              response_code = qtest.readl(PROPERTY_BUFFER + 4)
              if response_code != PROPERTY_RESPONSE_SUCCESS:
                  raise RuntimeError(
                      f"property request failed: response=0x{response_code:08x}"
                  )
              response_length = qtest.readl(PROPERTY_BUFFER + 16)
              expected_length = (1 << 31) | expected_response_size
              if response_length != expected_length:
                  raise RuntimeError(
                      "property tag returned the wrong response length: "
                      f"0x{response_length:08x} != 0x{expected_length:08x}"
                  )

              return [
                  qtest.readl(PROPERTY_BUFFER + 20 + index * 4)
                  for index in range(expected_response_size // 4)
              ]


          def property_request(
              qtest: QTestClient,
              tag: int,
              resource_id: int,
              state: int,
          ) -> int:
              response = property_words_request(
                  qtest, tag, (resource_id, state), 8
              )
              returned_id, returned_state = response
              if returned_id != resource_id:
                  raise RuntimeError(
                      f"property tag changed resource id {resource_id} to {returned_id}"
                  )
              return returned_state


          def exp_gpio_get_config(
              qtest: QTestClient, offset: int
          ) -> tuple[int, int, int, int]:
              response = property_words_request(
                  qtest,
                  RPI_FWREQ_GET_GPIO_CONFIG,
                  (EXP_GPIO_BASE + offset, 0, 0, 0, 0),
                  20,
              )
              if response[0] != 0:
                  raise RuntimeError(
                      f"failed to read expander GPIO {offset} config: {response!r}"
                  )
              return tuple(response[1:])


          def exp_gpio_set_config(
              qtest: QTestClient,
              offset: int,
              direction: int,
              polarity: int,
              term_en: int,
              term_pull_up: int,
              state: int,
          ) -> None:
              response = property_words_request(
                  qtest,
                  RPI_FWREQ_SET_GPIO_CONFIG,
                  (
                      EXP_GPIO_BASE + offset,
                      direction,
                      polarity,
                      term_en,
                      term_pull_up,
                      state,
                  ),
                  24,
              )
              if response[0] != 0:
                  raise RuntimeError(
                      f"failed to write expander GPIO {offset} config: {response!r}"
                  )


          def exp_gpio_get_state(qtest: QTestClient, offset: int) -> int:
              response = property_words_request(
                  qtest,
                  RPI_FWREQ_GET_GPIO_STATE,
                  (EXP_GPIO_BASE + offset, 0),
                  8,
              )
              if response[0] != 0:
                  raise RuntimeError(
                      f"failed to read expander GPIO {offset} state: {response!r}"
                  )
              return response[1]


          def exp_gpio_set_state(
              qtest: QTestClient, offset: int, state: int
          ) -> None:
              response = property_words_request(
                  qtest,
                  RPI_FWREQ_SET_GPIO_STATE,
                  (EXP_GPIO_BASE + offset, state),
                  8,
              )
              if response[0] != 0 or response[1] != state:
                  raise RuntimeError(
                      f"failed to write expander GPIO {offset} state: {response!r}"
                  )
          '''
          smoke = smoke[:request_start] + generic_requests + smoke[request_end + 1:]

          test_anchor = """            expect_state(
                          qtest,
                          RPI_FWREQ_SET_DOMAIN_STATE,
                          32,
                          1,
                          0,
                      )
          """
          gpio_tests = test_anchor + """

                      for offset in range(EXP_GPIO_COUNT):
                          config = exp_gpio_get_config(qtest, offset)
                          if config != (0, 0, 0, 0):
                              raise RuntimeError(
                                  f"expander GPIO {offset} reset config is {config!r}"
                              )
                          if exp_gpio_get_state(qtest, offset) != 0:
                              raise RuntimeError(
                                  f"expander GPIO {offset} reset state is not low"
                              )

                      exp_gpio_set_config(
                          qtest,
                          EXP_GPIO_HDMI_HPD,
                          direction=1,
                          polarity=1,
                          term_en=1,
                          term_pull_up=0,
                          state=1,
                      )
                      if exp_gpio_get_config(qtest, EXP_GPIO_HDMI_HPD) != (1, 1, 1, 0):
                          raise RuntimeError("expander GPIO config did not persist")
                      if exp_gpio_get_state(qtest, EXP_GPIO_HDMI_HPD) != 1:
                          raise RuntimeError("expander GPIO configured state did not persist")

                      exp_gpio_set_state(qtest, EXP_GPIO_HDMI_HPD, 0)
                      if exp_gpio_get_state(qtest, EXP_GPIO_HDMI_HPD) != 0:
                          raise RuntimeError("expander GPIO state update did not persist")

                      invalid = property_words_request(
                          qtest,
                          RPI_FWREQ_GET_GPIO_CONFIG,
                          (EXP_GPIO_BASE - 1, 0, 0, 0, 0),
                          20,
                      )
                      if invalid[0] == 0:
                          raise RuntimeError("invalid expander GPIO was accepted")

                      qmp.execute("system_reset")
                      if exp_gpio_get_config(qtest, EXP_GPIO_HDMI_HPD) != (0, 0, 0, 0):
                          raise RuntimeError("expander GPIO config survived reset")
                      if exp_gpio_get_state(qtest, EXP_GPIO_HDMI_HPD) != 0:
                          raise RuntimeError("expander GPIO state survived reset")
          """
          if smoke.count(test_anchor) != 1:
              raise SystemExit("smoke test insertion anchor changed")
          smoke = smoke.replace(test_anchor, gpio_tests, 1)
          smoke = smoke.replace(
              'print("Raspberry Pi firmware power-domain smoke test passed")',
              'print("Raspberry Pi firmware power-domain and expander GPIO smoke test passed")',
              1,
          )
          smoke_path.write_text(smoke)
          PY

          python3 -m py_compile scripts/vc4/property-power-domain-smoke.py
          bash -n scripts/vc4/build-linux-v3d-modular-initramfs.sh
          git diff --check
          grep -Fq RPI_FWREQ_GET_GPIO_CONFIG hw/misc/bcm2835_property.c
          grep -Fq exp_gpio_state include/hw/misc/bcm2835_property.h
          grep -Fq exp_gpio_get_config scripts/vc4/property-power-domain-smoke.py

      - name: Publish the repair and remove this transient workflow
        run: |
          set -euo pipefail
          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git add -- \
            hw/misc/bcm2835_property.c \
            include/hw/misc/bcm2835_property.h \
            scripts/vc4/property-power-domain-smoke.py
          git rm -- .github/workflows/vc4-kms-expgpio-repair.yml
          git commit -m "hw/misc: model Raspberry Pi firmware expander GPIOs"
          git pull --rebase origin agent/vc4-linux-kms-frontier
          git push origin HEAD:agent/vc4-linux-kms-frontier
