name: VC4 stock VPU low-PC memory trace v2

on:
  push:
    branches:
      - agent/vc4-stock-arm-handoff-recovered
    paths:
      - .github/workflows/vc4-stock-vpu-lowpc-memtrace-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-stock-vpu-lowpc-memtrace-v2
  cancel-in-progress: false

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BRANCH: agent/vc4-stock-arm-handoff-recovered
      RPI_FIRMWARE_COMMIT: 3d301dd924bcd758a4c8cb19fe8531031f033f43
      FIXTURE_DIR: /tmp/vc4-stock-memtrace-v2-fixtures
      RESULT_DIR: /tmp/vc4-stock-memtrace-v2-result
      STATUS_JSON: VC4_STOCK_VPU_LOWPC_MEMTRACE_V2_STATUS.json
      STATUS_MD: VC4_STOCK_VPU_LOWPC_MEMTRACE_V2_STATUS.md
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies and build pinned fixtures
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            binutils-aarch64-linux-gnu curl gcc-aarch64-linux-gnu \
            libglib2.0-dev libpixman-1-dev ninja-build pkg-config \
            python3 zlib1g-dev
          rm -rf "$FIXTURE_DIR" "$RESULT_DIR"
          mkdir -p "$FIXTURE_DIR" "$RESULT_DIR"
          python3 -m py_compile \
            scripts/vc4/raspi3-stock-arm-payload.py \
            scripts/vc4/raspi3-stock-bootcode-probe.py \
            scripts/vc4/raspi3-stock-vpu-trace.py

          for file in bootcode.bin start.elf fixup.dat bcm2710-rpi-3-b.dtb; do
            curl --fail --location --retry 5 \
              --output "$FIXTURE_DIR/$file" \
              "https://raw.githubusercontent.com/raspberrypi/firmware/${RPI_FIRMWARE_COMMIT}/boot/$file"
          done
          test "$(git hash-object "$FIXTURE_DIR/bootcode.bin")" = \
            7642d2d89e4235e7d68875ff70688bdde6e71b5a
          test "$(git hash-object "$FIXTURE_DIR/start.elf")" = \
            0cefcf3a756740760f9903f35cc3843117853712
          test "$(git hash-object "$FIXTURE_DIR/fixup.dat")" = \
            1845e38de9d4f9a6d9ad7f5273bfe58b2582a7e6
          test "$(git hash-object "$FIXTURE_DIR/bcm2710-rpi-3-b.dtb")" = \
            398c480adc49a5fcb03aa4c095ea74db5d1f893b

          aarch64-linux-gnu-as \
            -o "$FIXTURE_DIR/aarch64-handoff.o" tests/vc4/aarch64-handoff.S
          aarch64-linux-gnu-ld \
            -nostdlib -T tests/vc4/aarch64-handoff.ld \
            -o "$FIXTURE_DIR/aarch64-handoff.elf" \
            "$FIXTURE_DIR/aarch64-handoff.o"
          aarch64-linux-gnu-objcopy \
            -O binary "$FIXTURE_DIR/aarch64-handoff.elf" \
            "$FIXTURE_DIR/kernel8.img"
          sha256sum "$FIXTURE_DIR"/* > "$FIXTURE_DIR/SHA256SUMS"

          python3 - <<'PY'
          from pathlib import Path
          import importlib.util

          scripts = Path('scripts/vc4')
          spec = importlib.util.spec_from_file_location(
              'vc4_stock_handoff', scripts / 'raspi3-stock-arm-payload.py')
          if spec is None or spec.loader is None:
              raise SystemExit('could not load stock handoff helper')
          handoff = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(handoff)
          stock = handoff.load_stock_probe()
          f = Path('/tmp/vc4-stock-memtrace-v2-fixtures')
          r = Path('/tmp/vc4-stock-memtrace-v2-result')
          files = [
              ('BOOTCODE.BIN', (f / 'bootcode.bin').read_bytes()),
              ('START.ELF', (f / 'start.elf').read_bytes()),
              ('FIXUP.DAT', (f / 'fixup.dat').read_bytes()),
              ('CONFIG.TXT', handoff.default_config(True)),
              ('CMDLINE.TXT', b'console=serial0,115200 earlycon=pl011,0x3f201000\n'),
              ('RPI3.DTB', (f / 'bcm2710-rpi-3-b.dtb').read_bytes()),
              ('KERNEL8.IMG', (f / 'kernel8.img').read_bytes()),
          ]
          layout = stock.build_fat32_image(r / 'stock-lowpc.img', files)
          (r / 'FAT_LAYOUT.txt').write_text(
              '\n'.join(f'{name}: {chain}' for name, chain in layout.items()) + '\n')
          PY

      - name: Build a diagnostic-only bounded memory plugin
        run: |
          set -euo pipefail
          cp tests/tcg/plugins/mem.c "$RESULT_DIR/mem.c.original"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/tcg/plugins/mem.c')
          s = p.read_text()
          old = '''        struct qemu_plugin_insn *insn = qemu_plugin_tb_get_insn(tb, i);\n\n        if (do_inline) {\n'''
          new = '''        struct qemu_plugin_insn *insn = qemu_plugin_tb_get_insn(tb, i);\n        uint64_t insn_vaddr = qemu_plugin_insn_vaddr(insn);\n\n        if (insn_vaddr > 0x10000) {\n            continue;\n        }\n\n        if (do_inline) {\n'''
          if s.count(old) != 1:
              raise SystemExit('mem plugin translation anchor changed')
          s = s.replace(old, new, 1)
          old = '''                    "0x%"PRIx64",%s,0x%"PRIx64",0x%"PRIx64",%d,%s,",\n                    insn_info->vaddr, insn_info->sym,\n                    vaddr, hwaddr, size, type);\n'''
          new = '''                    "%u,0x%"PRIx64",%s,0x%"PRIx64",0x%"PRIx64",%d,%s,",\n                    cpu_index, insn_info->vaddr, insn_info->sym,\n                    vaddr, hwaddr, size, type);\n'''
          if s.count(old) != 1:
              raise SystemExit('mem plugin CSV row anchor changed')
          s = s.replace(old, new, 1)
          old = '''                "insn_vaddr,insn_symbol,mem_vaddr,mem_hwaddr,"\n                "access_size,access_type,mem_value\\n");\n'''
          new = '''                "cpu_index,insn_vaddr,insn_symbol,mem_vaddr,mem_hwaddr,"\n                "access_size,access_type,mem_value\\n");\n'''
          if s.count(old) != 1:
              raise SystemExit('mem plugin CSV header anchor changed')
          p.write_text(s)
          PY

          ./configure \
            --target-list=aarch64-softmmu,vc4-softmmu \
            --enable-plugins --disable-docs --disable-werror \
            2>&1 | tee "$RESULT_DIR/configure.log"
          ninja -C build qemu-system-aarch64 qemu-system-vc4 test-plugins \
            2>&1 | tee "$RESULT_DIR/build.log"
          plugin=$(find build -type f -name 'libmem.so' -print -quit)
          test -n "$plugin"
          realpath "$plugin" > "$RESULT_DIR/PLUGIN_PATH"
          sha256sum "$plugin" > "$RESULT_DIR/PLUGIN_SHA256"

          git checkout -- tests/tcg/plugins/mem.c
          git diff --check

      - name: Preserve processor-control regressions
        run: |
          set -euo pipefail
          python3 scripts/vc4/preg-mutex-smoke.py \
            --qemu build/qemu-system-vc4 \
            2>&1 | tee "$RESULT_DIR/preg.log"
          python3 scripts/vc4/msync-smoke.py \
            --qemu build/qemu-system-aarch64 \
            2>&1 | tee "$RESULT_DIR/msync.log"

      - name: Run unchanged firmware and stop QEMU cleanly through QMP
        id: runtime
        run: |
          set -euo pipefail
          plugin=$(cat "$RESULT_DIR/PLUGIN_PATH")
          qmp="$RESULT_DIR/qmp.sock"
          rm -f "$qmp"
          command=(
            build/qemu-system-aarch64
            -M raspi3b-vc4-hetero
            -m 1G
            -smp 5
            -drive "file=$RESULT_DIR/stock-lowpc.img,format=raw,if=sd"
            -accel tcg,thread=single
            -display none
            -monitor none
            -serial none
            -no-reboot
            -qmp "unix:$qmp,server=on,wait=off"
            -plugin "$plugin,print-accesses=true,haddr=true,track=rw"
            -d plugin,guest_errors,unimp
            -D "$RESULT_DIR/plugin.log"
          )
          printf '%q ' "${command[@]}" > "$RESULT_DIR/COMMAND_SHELL"
          printf '\n' >> "$RESULT_DIR/COMMAND_SHELL"
          printf '%s\n' "${command[@]}" > "$RESULT_DIR/COMMAND_ARGS"

          set +e
          "${command[@]}" \
            >"$RESULT_DIR/qemu.stdout" \
            2>"$RESULT_DIR/qemu.stderr" &
          qemu_pid=$!
          set -e
          printf '%s\n' "$qemu_pid" > "$RESULT_DIR/QEMU_PID"

          python3 - "$qmp" "$qemu_pid" <<'PY'
          import json
          import os
          import socket
          import sys
          import time

          path = sys.argv[1]
          pid = int(sys.argv[2])
          deadline = time.monotonic() + 15.0
          while time.monotonic() < deadline:
              if not os.path.exists(f'/proc/{pid}'):
                  raise SystemExit('QEMU exited before QMP became available')
              if os.path.exists(path):
                  break
              time.sleep(0.05)
          else:
              raise SystemExit('QMP socket did not appear')

          sock = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          sock.settimeout(5.0)
          sock.connect(path)
          stream = sock.makefile('rwb', buffering=0)

          def recv_obj():
              while True:
                  line = stream.readline()
                  if not line:
                      raise SystemExit('QMP closed unexpectedly')
                  obj = json.loads(line)
                  if 'event' not in obj:
                      return obj

          greeting = recv_obj()
          if 'QMP' not in greeting:
              raise SystemExit(f'bad QMP greeting: {greeting!r}')
          stream.write(b'{"execute":"qmp_capabilities"}\r\n')
          response = recv_obj()
          if 'return' not in response:
              raise SystemExit(f'qmp_capabilities failed: {response!r}')

          time.sleep(8.0)
          stream.write(b'{"execute":"quit"}\r\n')
          response = recv_obj()
          if 'return' not in response:
              raise SystemExit(f'quit failed: {response!r}')
          sock.close()
          PY

          set +e
          wait "$qemu_pid"
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$RESULT_DIR/RETURN_CODE"
          case "$rc" in 0) ;; *)
            echo "QEMU returned $rc after QMP quit" >&2
            cat "$RESULT_DIR/qemu.stderr" >&2
            exit "$rc"
          esac

          sha256sum \
            "$RESULT_DIR/plugin.log" \
            "$RESULT_DIR/qemu.stdout" \
            "$RESULT_DIR/qemu.stderr" \
            > "$RESULT_DIR/TRACE_SHA256SUMS"

      - name: Extract and classify memory-access records
        id: classify
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path
          import csv
          import hashlib
          import json
          import re

          result = Path('/tmp/vc4-stock-memtrace-v2-result')
          candidates = [
              result / 'plugin.log',
              result / 'qemu.stdout',
              result / 'qemu.stderr',
          ]
          header = (
              'cpu_index,insn_vaddr,insn_symbol,mem_vaddr,mem_hwaddr,'
              'access_size,access_type,mem_value'
          )

          metadata = []
          selected = None
          selected_text = ''
          for path in candidates:
              if not path.exists():
                  metadata.append({'path': str(path), 'exists': False})
                  continue
              data = path.read_bytes()
              text = data.decode('utf-8', errors='replace')
              item = {
                  'path': str(path),
                  'exists': True,
                  'size': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'header_present': header in text,
                  'tail': text.splitlines()[-25:],
              }
              metadata.append(item)
              if selected is None and header in text:
                  selected = path
                  selected_text = text

          rows = []
          malformed = []
          if selected is not None:
              started = False
              for raw_line in selected_text.splitlines():
                  line = raw_line.strip()
                  if not started:
                      if header in line:
                          started = True
                      continue
                  # Plugin lines are CSV records.  Ignore unrelated QEMU log lines.
                  match = re.search(
                      r'(\d+,0x[0-9a-fA-F]+,[^,]*,0x[0-9a-fA-F]+,'
                      r'0x[0-9a-fA-F]+,\d+,[^,]+,0x[0-9a-fA-F]+)$',
                      line,
                  )
                  if not match:
                      continue
                  try:
                      fields = next(csv.reader([match.group(1)]))
                      if len(fields) != 8:
                          raise ValueError(f'expected 8 fields, got {len(fields)}')
                      row = {
                          'cpu_index': int(fields[0], 0),
                          'pc': int(fields[1], 0),
                          'symbol': fields[2],
                          'vaddr': int(fields[3], 0),
                          'hwaddr': int(fields[4], 0),
                          'size': int(fields[5], 0),
                          'type': fields[6],
                          'value': int(fields[7], 0),
                      }
                      rows.append(row)
                  except Exception as exc:
                      malformed.append({'line': line, 'error': str(exc)})

          def peripheral_offset(address: int):
              if 0x7e000000 <= address < 0x7f000000:
                  return address - 0x7e000000
              if 0x3f000000 <= address < 0x40000000:
                  return address - 0x3f000000
              if 0x20000000 <= address < 0x21000000:
                  return address - 0x20000000
              return None

          regions = [
              (0x000000, 0x001000, 'system-control'),
              (0x003000, 0x004000, 'system-timer'),
              (0x007000, 0x008000, 'dma'),
              (0x00b000, 0x00c000, 'arm-control-interrupt-mailbox'),
              (0x100000, 0x101000, 'power-management'),
              (0x101000, 0x102000, 'clock-management'),
              (0x200000, 0x201000, 'gpio'),
              (0x201000, 0x202000, 'uart0'),
              (0x202000, 0x203000, 'sdhost'),
              (0x204000, 0x205000, 'spi0'),
              (0x205000, 0x206000, 'bsc0'),
              (0x300000, 0x301000, 'emmc'),
              (0x980000, 0x990000, 'usb'),
          ]

          def classify_region(offset):
              if offset is None:
                  return 'non-peripheral'
              for start, end, name in regions:
                  if start <= offset < end:
                      return name
              return 'other-peripheral'

          for row in rows:
              offset = peripheral_offset(row['hwaddr'])
              row['peripheral_offset'] = offset
              row['region'] = classify_region(offset)

          low_window = [row for row in rows if 0x53c <= row['pc'] <= 0x550]
          pc_counts = Counter(row['pc'] for row in rows)
          access_counts = Counter(
              (row['pc'], row['hwaddr'], row['size'], row['type'])
              for row in rows
          )
          region_counts = Counter(row['region'] for row in rows)

          summary = {
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'source_sha': __import__('subprocess').check_output(
                  ['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'workflow_run_id': __import__('os').environ.get('GITHUB_RUN_ID'),
              'workflow_run_attempt': __import__('os').environ.get('GITHUB_RUN_ATTEMPT'),
              'firmware_commit': __import__('os').environ.get('RPI_FIRMWARE_COMMIT'),
              'normal_tcg': True,
              'qtest_clock_step': False,
              'firmware_modified': False,
              'trace_source': str(selected) if selected else None,
              'candidate_files': metadata,
              'record_count': len(rows),
              'malformed_count': len(malformed),
              'low_pc_window_record_count': len(low_window),
              'classification': (
                  'measured-low-pc-memory-contract'
                  if rows and low_window
                  else 'measured-memory-contract-no-0x53c-0x550'
                  if rows
                  else 'harness-no-csv-records'
              ),
              'top_pcs': [
                  {'pc': f'0x{pc:x}', 'count': count}
                  for pc, count in pc_counts.most_common(50)
              ],
              'region_counts': [
                  {'region': region, 'count': count}
                  for region, count in region_counts.most_common()
              ],
              'top_access_contracts': [
                  {
                      'pc': f'0x{pc:x}',
                      'hwaddr': f'0x{address:x}',
                      'size': size,
                      'type': kind,
                      'count': count,
                  }
                  for (pc, address, size, kind), count
                  in access_counts.most_common(100)
              ],
              'low_pc_window_records': [
                  {
                      **row,
                      'pc': f"0x{row['pc']:x}",
                      'vaddr': f"0x{row['vaddr']:x}",
                      'hwaddr': f"0x{row['hwaddr']:x}",
                      'value': f"0x{row['value']:x}",
                      'peripheral_offset': (
                          f"0x{row['peripheral_offset']:x}"
                          if row['peripheral_offset'] is not None else None
                      ),
                  }
                  for row in low_window[:2000]
              ],
              'malformed_examples': malformed[:50],
          }
          Path('VC4_STOCK_VPU_LOWPC_MEMTRACE_V2_STATUS.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n'
          )

          lines = [
              '# VC4 stock VPU low-PC memory trace v2',
              '',
              f"Classification: **{summary['classification']}**",
              '',
              f"Parsed records: **{len(rows)}**",
              f"Records from PC 0x53c–0x550: **{len(low_window)}**",
              f"Trace source: `{summary['trace_source']}`",
              '',
              '## Region counts',
              '',
          ]
          for item in summary['region_counts']:
              lines.append(f"- {item['region']}: {item['count']}")
          lines += ['', '## Low-PC access contracts', '']
          for item in summary['top_access_contracts']:
              if 0x53c <= int(item['pc'], 16) <= 0x550:
                  lines.append(
                      f"- PC `{item['pc']}` {item['type']} {item['size']} byte(s) "
                      f"at `{item['hwaddr']}`: {item['count']} access(es)"
                  )
          lines += ['', 'No product device behavior was changed by this run.', '']
          Path('VC4_STOCK_VPU_LOWPC_MEMTRACE_V2_STATUS.md').write_text(
              '\n'.join(lines)
          )
          PY

      - name: Publish durable measurement and retire workflow
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'VC4 CI'
          git config user.email 'vc4-ci@users.noreply.github.com'
          git add "$STATUS_JSON" "$STATUS_MD"
          git rm .github/workflows/vc4-stock-vpu-lowpc-memtrace-v2.yml
          git commit -m 'test/vc4: record low-PC memory trace v2 [skip ci]'
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            if git rebase "origin/$BRANCH" && \
               git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            git rebase --abort || true
            sleep 2
          done
          exit 1

      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-stock-lowpc-memtrace-v2-${{ github.run_attempt }}
          path: |
            VC4_STOCK_VPU_LOWPC_MEMTRACE_V2_STATUS.json
            VC4_STOCK_VPU_LOWPC_MEMTRACE_V2_STATUS.md
            /tmp/vc4-stock-memtrace-v2-fixtures/SHA256SUMS
            /tmp/vc4-stock-memtrace-v2-result
          if-no-files-found: warn
          retention-days: 14
