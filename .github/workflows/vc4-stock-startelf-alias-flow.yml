name: VC4 stock START.ELF alias-aware flow

on:
  push:
    branches:
      - agent/vc4-stock-arm-handoff-recovered
    paths:
      - .github/workflows/vc4-stock-startelf-alias-flow.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-stock-startelf-alias-flow
  cancel-in-progress: false

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      BRANCH: agent/vc4-stock-arm-handoff-recovered
      RPI_FIRMWARE_COMMIT: 3d301dd924bcd758a4c8cb19fe8531031f033f43
      FIXTURE_DIR: /tmp/vc4-stock-alias-fixtures
      RESULT_DIR: /tmp/vc4-stock-alias-result
      STATUS_JSON: VC4_STOCK_STARTELF_ALIAS_FLOW_STATUS.json
      STATUS_MD: VC4_STOCK_STARTELF_ALIAS_FLOW_STATUS.md

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Pin unchanged firmware and build ARM witness payload
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            binutils-aarch64-linux-gnu curl gcc-aarch64-linux-gnu \
            libglib2.0-dev libpixman-1-dev ninja-build pkg-config \
            python3 zlib1g-dev zstd
          rm -rf "$FIXTURE_DIR" "$RESULT_DIR"
          mkdir -p "$FIXTURE_DIR" "$RESULT_DIR"

          for file in bootcode.bin start.elf fixup.dat bcm2710-rpi-3-b.dtb; do
            curl --fail --location --retry 5 \
              --output "$FIXTURE_DIR/$file" \
              "https://raw.githubusercontent.com/raspberrypi/firmware/${RPI_FIRMWARE_COMMIT}/boot/$file"
          done
          test "$(git hash-object "$FIXTURE_DIR/bootcode.bin")" = \
            7642d2d89e4235e7d68875ff70688bdde6e71b5a
          test "$(git hash-object "$FIXTURE_DIR/start.elf")" = \
            0cefcf3a756740760f9903f35cc3843117853712
          test "$(git hash-object "$FIXTURE_DIR/fixup.dat")" = \
            1845e38de9d4f9a6d9ad7f5273bfe58b2582a7e6
          test "$(git hash-object "$FIXTURE_DIR/bcm2710-rpi-3-b.dtb")" = \
            398c480adc49a5fcb03aa4c095ea74db5d1f893b

          aarch64-linux-gnu-as \
            -o "$FIXTURE_DIR/aarch64-handoff.o" tests/vc4/aarch64-handoff.S
          aarch64-linux-gnu-ld \
            -nostdlib -T tests/vc4/aarch64-handoff.ld \
            -o "$FIXTURE_DIR/aarch64-handoff.elf" \
            "$FIXTURE_DIR/aarch64-handoff.o"
          aarch64-linux-gnu-objcopy \
            -O binary "$FIXTURE_DIR/aarch64-handoff.elf" \
            "$FIXTURE_DIR/kernel8.img"
          sha256sum "$FIXTURE_DIR"/* > "$FIXTURE_DIR/SHA256SUMS"

      - name: Build clean QEMU frontends and alias-aware execution plugin
        run: |
          set -euo pipefail
          cat > tests/tcg/plugins/startelf_alias_flow.c <<'EOF'
          #include <inttypes.h>
          #include <limits.h>
          #include <stdbool.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <glib.h>
          #include <qemu-plugin.h>

          QEMU_PLUGIN_EXPORT int qemu_plugin_version = QEMU_PLUGIN_VERSION;

          #define VPU_ALIAS_MASK UINT64_C(0x3fffffff)
          #define STARTELF_LO    UINT64_C(0x1ec00000)
          #define STARTELF_HI    UINT64_C(0x1f000000)
          #define RING_SIZE 8192
          #define MAX_EVENTS 128
          #define POST_ESCAPE 192

          typedef struct InsnInfo {
              uint64_t pc;
              uint32_t size;
          } InsnInfo;

          typedef struct RingEntry {
              uint64_t sequence;
              uint64_t pc;
              uint32_t size;
          } RingEntry;

          typedef struct FlowEvent {
              uint64_t sequence;
              uint64_t from_pc;
              uint64_t to_pc;
          } FlowEvent;

          static GPtrArray *infos;
          static GMutex lock;
          static RingEntry ring_entries[RING_SIZE];
          static FlowEvent alias_events[MAX_EVENTS];
          static FlowEvent escape_events[MAX_EVENTS];
          static size_t ring_head;
          static size_t ring_count;
          static size_t alias_event_count;
          static size_t escape_event_count;
          static uint64_t sequence;
          static uint64_t startelf_instruction_count;
          static uint64_t previous_pc;
          static unsigned tracked_cpu = UINT_MAX;
          static int post_escape = -1;
          static bool previous_was_startelf;
          static bool entered;
          static bool escaped;
          static bool frozen;
          static uint64_t escape_pc;

          static uint64_t canonical_pc(uint64_t pc)
          {
              return pc & VPU_ALIAS_MASK;
          }

          static bool is_startelf(uint64_t pc)
          {
              uint64_t canonical = canonical_pc(pc);
              return canonical >= STARTELF_LO && canonical < STARTELF_HI;
          }

          static uint64_t alias_class(uint64_t pc)
          {
              return pc & ~VPU_ALIAS_MASK;
          }

          static void record_ring(uint64_t pc, uint32_t size)
          {
              RingEntry *entry = &ring_entries[ring_head];

              entry->sequence = sequence;
              entry->pc = pc;
              entry->size = size;
              ring_head = (ring_head + 1) % RING_SIZE;
              if (ring_count < RING_SIZE) {
                  ring_count++;
              }
          }

          static void vcpu_insn_exec(unsigned int cpu_index, void *userdata)
          {
              const InsnInfo *info = userdata;
              bool current_is_startelf = is_startelf(info->pc);

              g_mutex_lock(&lock);
              if (frozen) {
                  g_mutex_unlock(&lock);
                  return;
              }

              if (!entered) {
                  if (!current_is_startelf) {
                      g_mutex_unlock(&lock);
                      return;
                  }
                  entered = true;
                  tracked_cpu = cpu_index;
              }
              if (cpu_index != tracked_cpu) {
                  g_mutex_unlock(&lock);
                  return;
              }

              sequence++;
              record_ring(info->pc, info->size);
              if (current_is_startelf) {
                  startelf_instruction_count++;
              }

              if (previous_was_startelf && current_is_startelf &&
                  alias_class(previous_pc) != alias_class(info->pc) &&
                  alias_event_count < MAX_EVENTS) {
                  alias_events[alias_event_count++] = (FlowEvent) {
                      .sequence = sequence,
                      .from_pc = previous_pc,
                      .to_pc = info->pc,
                  };
              }

              if (previous_was_startelf && !current_is_startelf) {
                  if (escape_event_count < MAX_EVENTS) {
                      escape_events[escape_event_count++] = (FlowEvent) {
                          .sequence = sequence,
                          .from_pc = previous_pc,
                          .to_pc = info->pc,
                      };
                  }
                  if (!escaped && startelf_instruction_count >= 64) {
                      escaped = true;
                      escape_pc = info->pc;
                      post_escape = POST_ESCAPE;
                  }
              }

              if (escaped && post_escape > 0) {
                  post_escape--;
                  if (post_escape == 0) {
                      frozen = true;
                  }
              }

              previous_pc = info->pc;
              previous_was_startelf = current_is_startelf;
              g_mutex_unlock(&lock);
          }

          static void vcpu_tb_trans(struct qemu_plugin_tb *tb, void *userdata)
          {
              size_t count = qemu_plugin_tb_n_insns(tb);

              for (size_t index = 0; index < count; index++) {
                  struct qemu_plugin_insn *insn =
                      qemu_plugin_tb_get_insn(tb, index);
                  InsnInfo *info = g_new0(InsnInfo, 1);

                  info->pc = qemu_plugin_insn_vaddr(insn);
                  info->size = qemu_plugin_insn_size(insn);
                  g_ptr_array_add(infos, info);
                  qemu_plugin_register_vcpu_insn_exec_cb(
                      insn, vcpu_insn_exec, QEMU_PLUGIN_CB_NO_REGS, info);
              }
          }

          static void append_events(GString *out, const char *kind,
                                    const FlowEvent *events, size_t count)
          {
              for (size_t index = 0; index < count; index++) {
                  const FlowEvent *event = &events[index];
                  g_string_append_printf(
                      out,
                      "STARTELF_ALIAS_%s sequence=%" PRIu64
                      " from=0x%016" PRIx64 " to=0x%016" PRIx64
                      " from_canonical=0x%016" PRIx64
                      " to_canonical=0x%016" PRIx64 "\n",
                      kind, event->sequence, event->from_pc, event->to_pc,
                      canonical_pc(event->from_pc), canonical_pc(event->to_pc));
              }
          }

          static void plugin_exit(void *opaque)
          {
              GString *out = g_string_new(NULL);
              size_t oldest;

              g_mutex_lock(&lock);
              g_string_append_printf(
                  out,
                  "STARTELF_ALIAS_SUMMARY entered=%u escaped=%u frozen=%u "
                  "cpu=%u startelf_insns=%" PRIu64
                  " aliases=%zu escapes=%zu escape=0x%016" PRIx64 "\n",
                  entered, escaped, frozen, tracked_cpu,
                  startelf_instruction_count, alias_event_count,
                  escape_event_count, escape_pc);
              append_events(out, "SWITCH", alias_events, alias_event_count);
              append_events(out, "ESCAPE", escape_events, escape_event_count);
              g_string_append(out, "STARTELF_ALIAS_RING_BEGIN\n");
              oldest = (ring_head + RING_SIZE - ring_count) % RING_SIZE;
              for (size_t index = 0; index < ring_count; index++) {
                  const RingEntry *entry =
                      &ring_entries[(oldest + index) % RING_SIZE];
                  g_string_append_printf(
                      out,
                      "STARTELF_ALIAS_RING sequence=%" PRIu64
                      " pc=0x%016" PRIx64
                      " canonical=0x%016" PRIx64 " size=%u\n",
                      entry->sequence, entry->pc,
                      canonical_pc(entry->pc), entry->size);
              }
              g_string_append(out, "STARTELF_ALIAS_RING_END\n");
              g_mutex_unlock(&lock);

              qemu_plugin_outs(out->str);
              g_string_free(out, TRUE);
              g_ptr_array_free(infos, TRUE);
          }

          QEMU_PLUGIN_EXPORT int qemu_plugin_install(
              qemu_plugin_id_t id, const qemu_info_t *info,
              int argc, char **argv)
          {
              infos = g_ptr_array_new_with_free_func(g_free);
              qemu_plugin_register_vcpu_tb_trans_cb(id, vcpu_tb_trans, NULL);
              qemu_plugin_register_atexit_cb(id, plugin_exit, NULL);
              return 0;
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/tcg/plugins/meson.build')
          text = path.read_text()
          anchor = "'insn.c',\n"
          if text.count(anchor) != 1:
              raise SystemExit('plugin meson anchor changed')
          path.write_text(text.replace(
              anchor, anchor + "'startelf_alias_flow.c',\n", 1))
          PY

          ./configure \
            --target-list=aarch64-softmmu,vc4-softmmu \
            --enable-plugins --disable-docs --disable-werror \
            2>&1 | tee "$RESULT_DIR/configure.log"
          ninja -C build qemu-system-aarch64 qemu-system-vc4 test-plugins \
            2>&1 | tee "$RESULT_DIR/build.log"
          plugin=$(find build -type f \
            -name 'libstartelf_alias_flow.so' -print -quit)
          test -n "$plugin"
          realpath "$plugin" > "$RESULT_DIR/PLUGIN_PATH"
          sha256sum "$plugin" > "$RESULT_DIR/PLUGIN_SHA256"

          git checkout -- tests/tcg/plugins/meson.build
          rm -f tests/tcg/plugins/startelf_alias_flow.c
          git diff --check

      - name: Preserve heterogeneous CPU contracts and build firmware volume
        run: |
          set -euo pipefail
          python3 scripts/vc4/preg-mutex-smoke.py \
            --qemu build/qemu-system-vc4 \
            2>&1 | tee "$RESULT_DIR/preg.log"
          python3 scripts/vc4/msync-smoke.py \
            --qemu build/qemu-system-aarch64 \
            2>&1 | tee "$RESULT_DIR/msync.log"

          python3 - <<'PY'
          from pathlib import Path
          import importlib.util

          scripts = Path('scripts/vc4')
          spec = importlib.util.spec_from_file_location(
              'vc4_stock_handoff', scripts / 'raspi3-stock-arm-payload.py')
          if spec is None or spec.loader is None:
              raise SystemExit('could not load stock handoff helper')
          handoff = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(handoff)
          stock = handoff.load_stock_probe()
          fixtures = Path('/tmp/vc4-stock-alias-fixtures')
          result = Path('/tmp/vc4-stock-alias-result')
          files = [
              ('BOOTCODE.BIN', (fixtures / 'bootcode.bin').read_bytes()),
              ('START.ELF', (fixtures / 'start.elf').read_bytes()),
              ('FIXUP.DAT', (fixtures / 'fixup.dat').read_bytes()),
              ('CONFIG.TXT', handoff.default_config(True)),
              ('CMDLINE.TXT',
               b'console=serial0,115200 earlycon=pl011,0x3f201000\n'),
              ('RPI3.DTB',
               (fixtures / 'bcm2710-rpi-3-b.dtb').read_bytes()),
              ('KERNEL8.IMG', (fixtures / 'kernel8.img').read_bytes()),
          ]
          layout = stock.build_fat32_image(result / 'stock-alias.img', files)
          (result / 'FAT_LAYOUT.txt').write_text(
              '\n'.join(f'{name}: {chain}' for name, chain in layout.items()) +
              '\n'
          )
          PY

      - name: Follow START.ELF across cache aliases under normal TCG
        run: |
          set -euo pipefail
          plugin=$(cat "$RESULT_DIR/PLUGIN_PATH")
          command=(
            build/qemu-system-aarch64
            -M raspi3b-vc4-hetero
            -m 1G
            -smp 5
            -drive "file=$RESULT_DIR/stock-alias.img,format=raw,if=sd"
            -accel tcg,thread=single
            -display none
            -monitor none
            -serial none
            -no-reboot
            -plugin "$plugin"
            -d plugin,guest_errors,unimp
            -D "$RESULT_DIR/alias-flow.log"
          )
          printf '%s\n' "${command[@]}" > "$RESULT_DIR/COMMAND_ARGS"
          set +e
          timeout --signal=TERM --kill-after=5s 45s \
            "${command[@]}" \
            >"$RESULT_DIR/qemu.stdout" \
            2>"$RESULT_DIR/qemu.stderr"
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$RESULT_DIR/RETURN_CODE"
          case "$rc" in
            0|124|143) ;;
            *) cat "$RESULT_DIR/qemu.stderr" >&2; exit "$rc" ;;
          esac
          cat "$RESULT_DIR/alias-flow.log" \
              "$RESULT_DIR/qemu.stdout" \
              "$RESULT_DIR/qemu.stderr" \
              > "$RESULT_DIR/combined.log"
          grep -Fq 'STARTELF_ALIAS_SUMMARY' "$RESULT_DIR/combined.log"

      - name: Prove the prior target is an official ELF alias and classify next frontier
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import hashlib
          import json
          import os
          import re
          import struct

          ALIAS_MASK = 0x3fffffff
          PRIOR_TARGET = 0xdec00da0
          PRIOR_CANONICAL = PRIOR_TARGET & ALIAS_MASK
          result_dir = Path('/tmp/vc4-stock-alias-result')
          fixture_dir = Path('/tmp/vc4-stock-alias-fixtures')
          text = (result_dir / 'combined.log').read_text(errors='replace')
          start_elf = (fixture_dir / 'start.elf').read_bytes()

          summaries = re.findall(
              r'STARTELF_ALIAS_SUMMARY entered=(\d+) escaped=(\d+) '
              r'frozen=(\d+) cpu=(\d+) startelf_insns=(\d+) '
              r'aliases=(\d+) escapes=(\d+) escape=(0x[0-9a-fA-F]+)',
              text,
          )
          if not summaries:
              raise SystemExit('missing alias-aware START.ELF summary')
          (entered_s, escaped_s, frozen_s, cpu_s, insns_s,
           aliases_s, escapes_s, escape_s) = summaries[-1]
          entered = entered_s == '1'
          escaped = escaped_s == '1'
          frozen = frozen_s == '1'
          tracked_cpu = int(cpu_s)
          startelf_insns = int(insns_s)
          escape_pc = int(escape_s, 16)

          event_re = re.compile(
              r'STARTELF_ALIAS_(SWITCH|ESCAPE) sequence=(\d+) '
              r'from=(0x[0-9a-fA-F]+) to=(0x[0-9a-fA-F]+) '
              r'from_canonical=(0x[0-9a-fA-F]+) '
              r'to_canonical=(0x[0-9a-fA-F]+)'
          )
          alias_events = []
          escape_events = []
          for kind, seq, source, target, source_c, target_c in \
                  event_re.findall(text):
              event = {
                  'sequence': int(seq),
                  'from_pc': source,
                  'to_pc': target,
                  'from_canonical': source_c,
                  'to_canonical': target_c,
              }
              (alias_events if kind == 'SWITCH' else escape_events).append(
                  event)

          ring = []
          for seq, pc, canonical, size in re.findall(
              r'STARTELF_ALIAS_RING sequence=(\d+) '
              r'pc=(0x[0-9a-fA-F]+) '
              r'canonical=(0x[0-9a-fA-F]+) size=(\d+)', text
          ):
              ring.append({
                  'sequence': int(seq),
                  'pc': pc,
                  'pc_int': int(pc, 16),
                  'canonical': canonical,
                  'canonical_int': int(canonical, 16),
                  'size': int(size),
              })

          if (start_elf[:4] != b'\x7fELF' or start_elf[4] != 1 or
                  start_elf[5] != 1):
              raise SystemExit('START.ELF is not little-endian ELF32')
          e_phoff = struct.unpack_from('<I', start_elf, 28)[0]
          e_phentsize = struct.unpack_from('<H', start_elf, 42)[0]
          e_phnum = struct.unpack_from('<H', start_elf, 44)[0]
          segments = []
          for index in range(e_phnum):
              offset = e_phoff + index * e_phentsize
              values = struct.unpack_from('<IIIIIIII', start_elf, offset)
              p_type, p_offset, p_vaddr, _, p_filesz, p_memsz, p_flags, _ = \
                  values
              if p_type != 1 or p_filesz == 0:
                  continue
              runtime_base = 0x10000000 + (p_vaddr & ALIAS_MASK)
              segments.append({
                  'index': index,
                  'file_offset': p_offset,
                  'runtime_base': runtime_base,
                  'file_size': p_filesz,
                  'memory_size': p_memsz,
                  'flags': p_flags,
              })

          def map_pc(pc, size=4):
              canonical = pc & ALIAS_MASK
              for segment in segments:
                  base = segment['runtime_base']
                  if base <= canonical < base + segment['file_size']:
                      file_offset = (
                          segment['file_offset'] + canonical - base)
                      return {
                          'mapped': True,
                          'pc': f'0x{pc:08x}',
                          'canonical': f'0x{canonical:08x}',
                          'segment': segment['index'],
                          'file_offset': file_offset,
                          'bytes': start_elf[
                              file_offset:file_offset + max(1, min(size, 10))
                          ].hex(),
                      }
              return {
                  'mapped': False,
                  'pc': f'0x{pc:08x}',
                  'canonical': f'0x{canonical:08x}',
              }

          prior_mapping = map_pc(PRIOR_TARGET)
          prior_alias_seen = any(
              int(event['to_pc'], 16) == PRIOR_TARGET and
              int(event['to_canonical'], 16) == PRIOR_CANONICAL
              for event in alias_events
          )
          mapped_ring = [
              {**entry, **map_pc(entry['pc_int'], entry['size'])}
              for entry in ring
          ]

          command_args = (result_dir / 'COMMAND_ARGS').read_text().splitlines()
          normal_tcg = (
              '-accel' in command_args and
              command_args[command_args.index('-accel') + 1] ==
              'tcg,thread=single' and
              '-icount' not in command_args and
              not any('one-insn' in arg for arg in command_args)
          )

          if not entered:
              classification = 'stock-startelf-alias-flow-not-entered'
              next_contract = 'repair the pre-entry firmware regression'
          elif not prior_alias_seen or not prior_mapping['mapped']:
              classification = 'stock-startelf-prior-alias-not-proven'
              next_contract = 'reproduce and map the prior alias transfer'
          elif escaped:
              escape_canonical = escape_pc & ALIAS_MASK
              if escape_canonical < 0x10000:
                  classification = \
                      'stock-startelf-alias-aware-low-pc-frontier'
              else:
                  classification = \
                      'stock-startelf-alias-aware-external-frontier'
              next_contract = \
                  'decode the first alias-normalized departure and its producer'
          else:
              classification = \
                  'stock-startelf-alias-transfer-valid-no-bounded-escape'
              next_contract = \
                  'extend execution or trace the next unimplemented device contract'

          status = {
              'schema_version': 1,
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'source_sha': os.environ.get('GITHUB_SHA', ''),
              'run_id': os.environ.get('GITHUB_RUN_ID', ''),
              'classification': classification,
              'next_contract': next_contract,
              'normal_tcg': normal_tcg,
              'official_firmware_commit': os.environ['RPI_FIRMWARE_COMMIT'],
              'official_start_elf_sha256': hashlib.sha256(
                  start_elf).hexdigest(),
              'entered_startelf': entered,
              'tracked_cpu': tracked_cpu,
              'startelf_instruction_count': startelf_insns,
              'prior_target': f'0x{PRIOR_TARGET:08x}',
              'prior_target_canonical': f'0x{PRIOR_CANONICAL:08x}',
              'prior_alias_seen': prior_alias_seen,
              'prior_target_mapping': prior_mapping,
              'alias_event_count': len(alias_events),
              'alias_events': alias_events,
              'escaped_after_alias_normalization': escaped,
              'escape_pc': f'0x{escape_pc:08x}',
              'escape_canonical': f'0x{escape_pc & ALIAS_MASK:08x}',
              'escape_events': escape_events,
              'ring_frozen_after_escape': frozen,
              'ring_entry_count': len(ring),
              'final_mapped_ring': mapped_ring[-192:],
          }
          Path(os.environ['STATUS_JSON']).write_text(
              json.dumps(status, indent=2, sort_keys=True) + '\n'
          )

          lines = [
              '# VC4 stock START.ELF alias-aware control flow', '',
              f'Classification: **`{classification}`**', '',
              f'- Normal TCG: `{normal_tcg}`',
              f'- Entered START.ELF: `{entered}`',
              f'- START.ELF instructions: `{startelf_insns}`',
              f'- Prior target: `0x{PRIOR_TARGET:08x}`',
              f'- Canonical target: `0x{PRIOR_CANONICAL:08x}`',
              f'- Prior alias transfer observed: `{prior_alias_seen}`',
              f"- Official ELF segment: `{prior_mapping.get('segment')}`",
              f"- Official ELF file offset: "
              f"`0x{prior_mapping.get('file_offset', 0):x}`",
              f"- Official bytes: `{prior_mapping.get('bytes', '')}`",
              f'- Later true departure observed: `{escaped}`',
              f'- Later target: `0x{escape_pc:08x}`', '',
              '## Next contract', '', next_contract, '',
          ]
          Path(os.environ['STATUS_MD']).write_text('\n'.join(lines))
          print(json.dumps(status, indent=2, sort_keys=True))

          if not normal_tcg:
              raise SystemExit('normal TCG contract was not preserved')
          if not entered:
              raise SystemExit('START.ELF was not entered')
          if not prior_alias_seen:
              raise SystemExit('prior alias transfer was not reproduced')
          if not prior_mapping['mapped']:
              raise SystemExit('prior alias target did not map into official ELF')
          PY

      - name: Publish alias-aware firmware frontier
        run: |
          set -euo pipefail
          git config user.name 'VC4 START.ELF Alias CI'
          git config user.email \
            'vc4-startelf-alias-ci@users.noreply.github.com'
          git add -- "$STATUS_JSON" "$STATUS_MD"
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m \
            'tests/vc4: record alias-aware START.ELF frontier [skip ci]'
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            if git rebase "origin/$BRANCH" && \
               git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            git rebase --abort || true
            sleep 2
          done
          exit 1

      - name: Compress diagnostic evidence
        if: always()
        run: |
          set -euo pipefail
          rm -f "$RESULT_DIR/stock-alias.img"
          for file in alias-flow.log combined.log; do
            if test -s "$RESULT_DIR/$file"; then
              zstd -T0 -3 -f "$RESULT_DIR/$file" \
                -o "$RESULT_DIR/$file.zst"
              rm -f "$RESULT_DIR/$file"
            fi
          done

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-stock-startelf-alias-flow-${{ github.run_attempt }}
          path: |
            VC4_STOCK_STARTELF_ALIAS_FLOW_STATUS.json
            VC4_STOCK_STARTELF_ALIAS_FLOW_STATUS.md
            /tmp/vc4-stock-alias-fixtures/SHA256SUMS
            /tmp/vc4-stock-alias-result
          if-no-files-found: warn
          retention-days: 14
