name: WD40 structured log control

on:
  push:
    branches:
      - wd40/qol-structured-log-control
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wd40-structured-log-control
  cancel-in-progress: false

jobs:
  transform-build-test-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure commit identity
        run: |
          git config user.name "WD40 Build Bot"
          git config user.email "wd40-build@users.noreply.github.com"

      - name: Apply, replay, and validate structured logging
        run: |
          set -Eeuo pipefail

          apply_contract() {
            python3 scripts/wd40/apply-rustless-build.py
            python3 scripts/wd40/apply-amd-1tb-hole-control-hardening.py
            python3 scripts/wd40/apply-amd-1tb-hole-control.py
            python3 scripts/wd40/apply-subtractive-log-mask.py
            python3 scripts/wd40/apply-hmp-command-introspection-hardening.py
            python3 scripts/wd40/apply-hmp-command-introspection.py
            python3 scripts/wd40/apply-structured-log-control.py
            python3 scripts/wd40/apply-structured-log-control-hardening.py
          }

          apply_contract
          git diff --no-ext-diff --binary > /tmp/wd40-structured-pass1.diff
          apply_contract
          git diff --no-ext-diff --binary > /tmp/wd40-structured-pass2.diff
          cmp /tmp/wd40-structured-pass1.diff /tmp/wd40-structured-pass2.diff

          python3 scripts/ci/check-wd40-rustless.py
          python3 scripts/ci/check-wd40-amd-1tb-hole.py
          python3 scripts/ci/check-wd40-subtractive-log-mask.py
          python3 scripts/ci/check-wd40-hmp-command-introspection.py
          python3 scripts/ci/check-wd40-structured-log-control.py
          git diff --check

      - name: Install C build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            pkg-config \
            python3-venv \
            libglib2.0-dev \
            libpixman-1-dev

      - name: Build x86_64, AArch64, and logging tests without Rust
        run: |
          set -Eeuo pipefail
          mkdir .wd40-poison
          for tool in rustc cargo rustdoc rustfmt bindgen; do
            cat > ".wd40-poison/$tool" <<EOF
          #!/bin/sh
          echo "WD40 Rustless contract: unexpected invocation of $tool" >&2
          exit 99
          EOF
            chmod +x ".wd40-poison/$tool"
          done
          export PATH="$PWD/.wd40-poison:$PATH"

          mkdir build-structured-log
          cd build-structured-log
          ../configure \
            --target-list=x86_64-softmmu,aarch64-softmmu \
            --disable-rust \
            --enable-fdt=internal \
            --disable-docs \
            --disable-werror
          ninja -j2 \
            tests/unit/test-logging \
            qemu-system-x86_64 \
            qemu-system-aarch64
          cd ..

      - name: Exercise logging units, ready state, and preconfig
        run: |
          set -Eeuo pipefail
          ./build-structured-log/tests/unit/test-logging --tap -k
          python3 scripts/ci/check-wd40-rustless.py build-structured-log
          python3 scripts/ci/check-wd40-structured-log-control.py \
            build-structured-log

      - name: Publish the validated structured logging implementation
        run: |
          set -Eeuo pipefail
          rm -rf .wd40-poison build-structured-log
          python3 scripts/ci/check-wd40-rustless.py
          python3 scripts/ci/check-wd40-amd-1tb-hole.py
          python3 scripts/ci/check-wd40-subtractive-log-mask.py
          python3 scripts/ci/check-wd40-hmp-command-introspection.py
          python3 scripts/ci/check-wd40-structured-log-control.py
          git diff --check
          git add -A
          if git diff --cached --quiet; then
            echo "Structured log-category control already applied"
            exit 0
          fi
          git commit -m "monitor: add structured QMP log-category control

          Expose the existing log-category registry and current enabled state
          through query-log-categories, and add atomic replace, enable, and
          disable operations through set-log-categories. Preserve QEMU's
          sticky per-thread logging rule explicitly instead of silently
          reporting a state transition that the logger cannot perform."
          git push origin "HEAD:${GITHUB_REF_NAME}"
