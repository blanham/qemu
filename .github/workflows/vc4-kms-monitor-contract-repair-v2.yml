name: VC4 monitor contract gate repair v2

on:
  push:
    branches:
      - agent/vc4-linux-kms-bind-diagnostics
    paths:
      - .github/workflows/vc4-kms-monitor-contract-repair-v2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Repair publication by structure rather than indentation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/vc4-kms-monitor-contract.yml")
          source = path.read_text()
          lines = source.splitlines()
          needle = "scripts/vc4/property-expander-gpio-smoke.py"
          matches = [
              index for index, line in enumerate(lines)
              if line.strip() == needle
          ]
          if matches:
              if len(matches) != 2:
                  raise SystemExit(
                      f"unexpected expander witness references: {matches!r}"
                  )
              # The first reference is the generated script path in the run
              # step.  The second is the optional git-add path.
              index = matches[-1]
              if index == 0 or not lines[index - 1].rstrip().endswith("\\"):
                  raise SystemExit("optional git-add continuation anchor changed")
              lines[index - 1] = lines[index - 1].rstrip()[:-1].rstrip()
              indent = lines[index][:len(lines[index]) - len(lines[index].lstrip())]
              lines[index:index + 1] = [
                  indent[:-2] + "if test -e " + needle + "; then",
                  indent + "git add -- " + needle,
                  indent[:-2] + "fi",
              ]
              path.write_text("\n".join(lines) + "\n")
          elif "if test -e scripts/vc4/property-expander-gpio-smoke.py" not in source:
              raise SystemExit("monitor publication was changed unexpectedly")
          PY
          git diff --check

      - name: Publish the robust repair
        run: |
          set -euo pipefail
          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git add -- .github/workflows/vc4-kms-monitor-contract.yml
          git rm -f --ignore-unmatch -- \
            .github/workflows/vc4-kms-monitor-contract-repair.yml \
            .github/workflows/vc4-kms-monitor-contract-repair-v2.yml
          git commit -m "ci/vc4: robustly handle optional monitor witnesses"
          git pull --rebase origin agent/vc4-linux-kms-bind-diagnostics
          git push origin HEAD:agent/vc4-linux-kms-bind-diagnostics
