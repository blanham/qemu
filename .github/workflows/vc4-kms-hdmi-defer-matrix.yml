name: VC4 Linux HDMI silent-defer matrix

on:
  push:
    branches:
      - agent/vc4-linux-kms-bind-diagnostics
    paths:
      - .github/workflows/vc4-kms-hdmi-defer-matrix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-linux-hdmi-defer-matrix
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RPI_FIRMWARE_COMMIT: 3d301dd924bcd758a4c8cb19fe8531031f033f43
      RPI_KERNEL_RELEASE: 6.18.44-v8+
      OFFICIAL_DIR: /tmp/vc4-hdmi-defer-official
      MODULE_DIR: /tmp/vc4-hdmi-defer-modules
      INITRAMFS_DIR: /tmp/vc4-hdmi-defer-initramfs
      DTB_DIR: /tmp/vc4-hdmi-defer-dtbs
      RENDER_OUT: /tmp/vc4-hdmi-defer-render
      RESULT_DIR: vc4-hdmi-defer-matrix-evidence
      STATUS_JSON: VC4_LINUX_KMS_HDMI_DEFER_MATRIX.json
      STATUS_MD: VC4_LINUX_KMS_HDMI_DEFER_MATRIX.md

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            binutils-aarch64-linux-gnu \
            cpio curl device-tree-compiler file \
            gcc-aarch64-linux-gnu gzip libdrm-dev \
            libc6-dev-arm64-cross linux-libc-dev-arm64-cross \
            ninja-build pkg-config python3 \
            libglib2.0-dev libpixman-1-dev xz-utils zlib1g-dev zstd
          rm -rf \
            "$OFFICIAL_DIR" "$MODULE_DIR" "$INITRAMFS_DIR" \
            "$DTB_DIR" "$RENDER_OUT" "$RESULT_DIR"
          mkdir -p \
            "$OFFICIAL_DIR" "$DTB_DIR" "$RENDER_OUT" "$RESULT_DIR"

      - name: Validate matrix sources
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/vc4/bcm2835-hdmi-ddc-smoke.py \
            scripts/vc4/fetch-linux-vc4-modules.py \
            scripts/vc4/property-clock-enumeration-smoke.py \
            scripts/vc4/property-power-domain-smoke.py \
            scripts/vc4/raspi3-linux-probe.py \
            scripts/vc4/msync-smoke.py \
            scripts/vc4/v3d-smoke.py
          bash -n \
            scripts/vc4/build-linux-v3d-modular-initramfs.sh \
            scripts/vc4/build-v3d-linux-dtb.sh \
            scripts/vc4/build-vc4-kms-linux-dtb.sh
          for source in \
            tests/vc4/vc4-render-only-overlay.dts \
            tests/vc4/vc4-kms-frontier-overlay.dts \
            tests/vc4/vc4-kms-hdmi-disabled-overlay.dts \
            tests/vc4/vc4-kms-hdmi-known-firmware-clocks-overlay.dts \
            tests/vc4/vc4-kms-hdmi-i2c1-ddc-overlay.dts \
            tests/vc4/vc4-kms-hdmi-known-clocks-i2c1-ddc-overlay.dts \
            tests/vc4/vc4-kms-hdmi-cprman-clocks-overlay.dts; do
            dtc -q -@ -I dts -O dtb -o /tmp/overlay.dtbo "$source"
          done
          git diff --check

      - name: Fetch pinned Linux fixture
        run: |
          set -euo pipefail
          for file in kernel8.img bcm2710-rpi-3-b.dtb; do
            curl --fail --location --retry 5 \
              --output "$OFFICIAL_DIR/$file" \
              "https://raw.githubusercontent.com/raspberrypi/firmware/${RPI_FIRMWARE_COMMIT}/boot/$file"
          done
          test "$(git hash-object "$OFFICIAL_DIR/kernel8.img")" = \
            a694aa64988bbecadc770c874488165303eac673
          test "$(git hash-object "$OFFICIAL_DIR/bcm2710-rpi-3-b.dtb")" = \
            398c480adc49a5fcb03aa4c095ea74db5d1f893b
          python3 scripts/vc4/fetch-linux-vc4-modules.py \
            --base-url \
            "https://raw.githubusercontent.com/raspberrypi/firmware/${RPI_FIRMWARE_COMMIT}/modules/${RPI_KERNEL_RELEASE}" \
            --out-dir "$MODULE_DIR" \
            --target i2c-bcm2835 \
            --target vc4 \
            2>&1 | tee "$RESULT_DIR/modules.log"
          grep -Fq i2c-bcm2835 "$MODULE_DIR/MANIFEST"
          grep -Fq snd-soc-hdmi-codec "$MODULE_DIR/MANIFEST"
          grep -Fq vc4.ko "$MODULE_DIR/MANIFEST"
          i2c_line=$(grep -n i2c-bcm2835 "$MODULE_DIR/MANIFEST" | cut -d: -f1)
          vc4_line=$(grep -n vc4.ko "$MODULE_DIR/MANIFEST" | cut -d: -f1)
          test "$i2c_line" -lt "$vc4_line"
          bash scripts/vc4/build-linux-v3d-modular-initramfs.sh \
            "$INITRAMFS_DIR" "$MODULE_DIR" \
            2>&1 | tee "$RESULT_DIR/fixture.log"

      - name: Build render and HDMI defer-matrix device trees
        run: |
          set -euo pipefail
          dtc -q -@ -I dts -O dtb \
            -o "$DTB_DIR/render-only.dtbo" \
            tests/vc4/vc4-render-only-overlay.dts
          bash scripts/vc4/build-v3d-linux-dtb.sh \
            "$OFFICIAL_DIR/bcm2710-rpi-3-b.dtb" \
            "$DTB_DIR/render-only.dtbo" \
            "$DTB_DIR/render-only.dtb"

          dtc -q -@ -I dts -O dtb \
            -o "$DTB_DIR/native-kms.dtbo" \
            tests/vc4/vc4-kms-frontier-overlay.dts
          bash scripts/vc4/build-vc4-kms-linux-dtb.sh \
            "$OFFICIAL_DIR/bcm2710-rpi-3-b.dtb" \
            "$DTB_DIR/native-kms.dtbo" \
            "$DTB_DIR/baseline.dtb"

          for variant in \
            hdmi-disabled \
            known-firmware-clocks \
            i2c1-ddc \
            known-clocks-i2c1-ddc \
            cprman-clocks; do
            source="tests/vc4/vc4-kms-hdmi-${variant}-overlay.dts"
            dtc -q -@ -I dts -O dtb \
              -o "$DTB_DIR/$variant.dtbo" "$source"
            fdtoverlay \
              -i "$DTB_DIR/baseline.dtb" \
              -o "$DTB_DIR/$variant.dtb" \
              "$DTB_DIR/$variant.dtbo"
            dtc -q -I dtb -O dts \
              -o "$DTB_DIR/$variant.dtb.dts" \
              "$DTB_DIR/$variant.dtb"
          done

          cp "$DTB_DIR/baseline.dtb.dts" "$RESULT_DIR/"
          cp "$DTB_DIR"/*.dtb.dts "$RESULT_DIR/"
          grep -A16 -B2 'hdmi@7e902000' \
            "$DTB_DIR/baseline.dtb.dts" \
            > "$RESULT_DIR/baseline-hdmi.txt"
          grep -A12 -B2 'i2c@7e805000' \
            "$DTB_DIR/baseline.dtb.dts" \
            > "$RESULT_DIR/baseline-ddc.txt"
          grep -A12 -B2 'i2c@7e804000' \
            "$DTB_DIR/i2c1-ddc.dtb.dts" \
            > "$RESULT_DIR/i2c1-ddc.txt"

      - name: Build QEMU
        run: |
          set -euo pipefail
          ./configure \
            --target-list=aarch64-softmmu,vc4-softmmu \
            --disable-docs --disable-werror \
            2>&1 | tee "$RESULT_DIR/configure.log"
          ninja -C build qemu-system-aarch64 qemu-system-vc4 \
            2>&1 | tee "$RESULT_DIR/build.log"

      - name: Preserve property, DDC, and architectural regressions
        run: |
          set -euo pipefail
          python3 scripts/vc4/property-power-domain-smoke.py \
            --qemu build/qemu-system-aarch64 \
            2>&1 | tee "$RESULT_DIR/property-state.log"
          python3 scripts/vc4/property-clock-enumeration-smoke.py \
            --qemu build/qemu-system-aarch64 \
            2>&1 | tee "$RESULT_DIR/property-clocks.log"
          python3 scripts/vc4/bcm2835-hdmi-ddc-smoke.py \
            --qemu build/qemu-system-aarch64 \
            2>&1 | tee "$RESULT_DIR/hdmi-ddc.log"
          python3 scripts/vc4/msync-smoke.py \
            --qemu build/qemu-system-aarch64 \
            2>&1 | tee "$RESULT_DIR/msync.log"
          python3 scripts/vc4/v3d-smoke.py \
            --qemu build/qemu-system-aarch64 \
            2>&1 | tee "$RESULT_DIR/v3d.log"

      - name: Preserve the completed render-submit frontier
        run: |
          set -euo pipefail
          python3 scripts/vc4/raspi3-linux-probe.py \
            --mode linux-direct \
            --qemu build/qemu-system-aarch64 \
            --kernel "$OFFICIAL_DIR/kernel8.img" \
            --dtb "$DTB_DIR/render-only.dtb" \
            --initrd "$INITRAMFS_DIR/initramfs.cpio.gz" \
            --out-dir "$RENDER_OUT" \
            --seconds 45 --sample-interval 5
          grep -Fq VC4_LINUX_MODULE_CLOSURE_OK "$RENDER_OUT/serial.log"
          grep -Fq VC4_LINUX_DRM_SUBMIT_OK "$RENDER_OUT/serial.log"
          grep -Fq VC4_LINUX_V3D_MODULAR_OK "$RENDER_OUT/serial.log"
          cp -a "$RENDER_OUT" "$RESULT_DIR/render-regression"

      - name: Run HDMI silent-defer matrix
        run: |
          set -euo pipefail
          for variant in \
            baseline \
            hdmi-disabled \
            known-firmware-clocks \
            i2c1-ddc \
            known-clocks-i2c1-ddc \
            cprman-clocks; do
            out="$RESULT_DIR/$variant"
            mkdir -p "$out"
            set +e
            python3 scripts/vc4/raspi3-linux-probe.py \
              --mode linux-direct \
              --qemu build/qemu-system-aarch64 \
              --kernel "$OFFICIAL_DIR/kernel8.img" \
              --dtb "$DTB_DIR/$variant.dtb" \
              --initrd "$INITRAMFS_DIR/initramfs.cpio.gz" \
              --out-dir "$out" \
              --seconds 48 --sample-interval 6 \
              > "$out/probe.stdout" 2>&1
            printf '%s\n' "$?" > "$out/return-code"
            set -e
            grep -E \
              'vc4-drm soc:gpu: bound|VC4_LINUX_(KMS|DRM|MODULE)|deferred probe|invalid index|Failed to get|failed to bind|probe with driver' \
              "$out/serial.log" > "$out/frontier.log" || true
            cat "$out/frontier.log"
          done

      - name: Classify the first silent HDMI defer
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import datetime as dt
          import json
          from pathlib import Path
          import re

          root = Path("vc4-hdmi-defer-matrix-evidence")
          variants = (
              "baseline",
              "hdmi-disabled",
              "known-firmware-clocks",
              "i2c1-ddc",
              "known-clocks-i2c1-ddc",
              "cprman-clocks",
          )
          bind_re = re.compile(
              r"vc4-drm soc:gpu: bound (?P<device>\S+) "
              r"\(ops (?P<ops>\S+) \[vc4\]\)"
          )

          results = {}
          for name in variants:
              serial = (root / name / "serial.log").read_text(errors="replace")
              lines = serial.splitlines()
              components = [match.groupdict() for match in bind_re.finditer(serial)]
              non_hvs = [
                  component for component in components
                  if component["device"] != "3f400000.hvs"
              ]
              results[name] = {
                  "components": components,
                  "hvs_bind_count": serial.count("bound 3f400000.hvs"),
                  "hdmi_bind_count": serial.count("bound 3f902000.hdmi"),
                  "non_hvs_bind_count": len(non_hvs),
                  "resources_seen": "VC4_LINUX_KMS_RESOURCES_OK" in serial,
                  "crtc_seen": "VC4_LINUX_KMS_CRTC_OK" in serial,
                  "card_seen": "VC4_LINUX_DRM_CARD0_OK" in serial,
                  "topology_seen": "VC4_LINUX_KMS_TOPOLOGY_OK" in serial,
                  "gpu_deferred": (
                      "platform soc:gpu: deferred probe pending" in serial
                  ),
                  "invalid_clock_index": "of_clk_hw_onecell_get: invalid index" in serial,
                  "pixel_clock_error": "Failed to get pixel clock" in serial,
                  "hsm_clock_error": (
                      "Failed to get HDMI state machine clock" in serial
                  ),
                  "frontier": [
                      line for line in lines
                      if (
                          "vc4-drm soc:gpu:" in line
                          or "VC4_LINUX_KMS_" in line
                          or "VC4_LINUX_DRM_" in line
                          or "deferred probe" in line
                          or "invalid index" in line
                          or "Failed to get" in line
                          or "failed to bind" in line
                          or "probe with driver" in line
                      )
                  ][-120:],
              }

          advanced = {
              name: (
                  result["non_hvs_bind_count"] > 0
                  or result["resources_seen"]
                  or result["card_seen"]
              )
              for name, result in results.items()
          }

          if advanced["baseline"]:
              classification = "baseline-advanced"
          elif not advanced["hdmi-disabled"]:
              classification = "first-non-hdmi-component-defer"
          elif (
              advanced["known-firmware-clocks"]
              and not advanced["i2c1-ddc"]
          ):
              classification = "pixel-or-hsm-firmware-clock-defer"
          elif (
              advanced["i2c1-ddc"]
              and not advanced["known-firmware-clocks"]
          ):
              classification = "bsc2-ddc-adapter-defer"
          elif (
              advanced["known-firmware-clocks"]
              and advanced["i2c1-ddc"]
          ):
              classification = "both-single-substitutions-advance"
          elif advanced["known-clocks-i2c1-ddc"]:
              classification = "compound-clock-and-ddc-defer"
          elif advanced["cprman-clocks"]:
              classification = "firmware-clock-provider-defer"
          else:
              classification = "hdmi-cec-irq-power-or-internal-defer"

          record = {
              "schema_version": 1,
              "generated_at": dt.datetime.now(dt.timezone.utc).isoformat(),
              "source_sha": "${{ github.sha }}",
              "run_id": "${{ github.run_id }}",
              "run_attempt": "${{ github.run_attempt }}",
              "classification": classification,
              "render_submission_preserved": True,
              "advanced": advanced,
              "results": results,
          }
          Path("VC4_LINUX_KMS_HDMI_DEFER_MATRIX.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n"
          )

          lines = [
              "# VC4 Linux HDMI silent-defer matrix",
              "",
              f"Classification: **`{classification}`**",
              "",
              "The completed Linux render-submit frontier remained mandatory.",
              "",
              "| Variant | HVS binds | HDMI binds | Other binds | Resources | CRTC | Card | GPU deferred |",
              "|---|---:|---:|---:|---:|---:|---:|---:|",
          ]
          for name in variants:
              result = results[name]
              lines.append(
                  f"| `{name}` | {result['hvs_bind_count']} | "
                  f"{result['hdmi_bind_count']} | "
                  f"{result['non_hvs_bind_count']} | "
                  f"{result['resources_seen']} | {result['crtc_seen']} | "
                  f"{result['card_seen']} | {result['gpu_deferred']} |"
              )
          Path("VC4_LINUX_KMS_HDMI_DEFER_MATRIX.md").write_text(
              "\n".join(lines) + "\n"
          )
          print(json.dumps(record, indent=2, sort_keys=True))
          PY

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-linux-hdmi-defer-matrix-${{ github.run_attempt }}
          path: |
            vc4-hdmi-defer-matrix-evidence
            VC4_LINUX_KMS_HDMI_DEFER_MATRIX.json
            VC4_LINUX_KMS_HDMI_DEFER_MATRIX.md
          if-no-files-found: warn
          retention-days: 14

      - name: Publish HDMI silent-defer frontier
        if: always()
        run: |
          set -euo pipefail
          test -f "$STATUS_JSON"
          test -f "$STATUS_MD"
          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git add -- "$STATUS_JSON" "$STATUS_MD"
          if ! git diff --cached --quiet; then
            git commit -m \
              "test/vc4: record HDMI silent-defer matrix [skip ci]"
            git pull --rebase origin agent/vc4-linux-kms-bind-diagnostics
            git push origin HEAD:agent/vc4-linux-kms-bind-diagnostics
          fi
