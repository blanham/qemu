name: VC4 QPU varying FIFO contract

on:
  push:
    branches:
      - agent/vc4-qpu-varying-fifo
    paths:
      - .github/workflows/vc4-qpu-varying-fifo.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-qpu-varying-fifo
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BRANCH: agent/vc4-qpu-varying-fifo
      EVIDENCE: /tmp/vc4-varying-fifo

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev libpixman-1-dev \
            ninja-build pkg-config python3 zlib1g-dev
          rm -rf "$EVIDENCE"
          mkdir -p "$EVIDENCE"

      - name: Materialize architectural varying FIFO input
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/vc4/materialize-varying-fifo.py
          python3 scripts/vc4/materialize-varying-fifo.py
          git diff --check
          git diff > "$EVIDENCE/product.diff"

      - name: Configure and build QPU contracts
        run: |
          set -euo pipefail
          ./configure \
            --target-list=aarch64-softmmu,vc4-softmmu \
            --disable-docs --disable-werror \
            2>&1 | tee "$EVIDENCE/configure.log"
          ninja -C build \
            qemu-system-aarch64 qemu-system-vc4 \
            tests/unit/test-vc4-qpu \
            tests/unit/test-vc4-qpu-contract \
            tests/unit/test-vc4-v3d-pipeline \
            2>&1 | tee "$EVIDENCE/build.log"

      - name: Validate measured and compatibility gates
        run: |
          set -euo pipefail
          build/tests/unit/test-vc4-qpu --tap -k \
            2>&1 | tee "$EVIDENCE/qpu.tap"
          build/tests/unit/test-vc4-qpu-contract --tap -k \
            2>&1 | tee "$EVIDENCE/qpu-contract.tap"
          build/tests/unit/test-vc4-v3d-pipeline --tap -k \
            2>&1 | tee "$EVIDENCE/pipeline.tap"
          python3 scripts/vc4/v3d-smoke.py \
            --qemu build/qemu-system-aarch64 \
            2>&1 | tee "$EVIDENCE/v3d.log"
          git diff --check

      - name: Publish validated product files
        run: |
          set -euo pipefail
          git add -- \
            include/hw/display/vc4_qpu_exec.h \
            hw/display/vc4_qpu_exec.c \
            tests/unit/test-vc4-qpu.c
          git diff --cached --check
          git config user.name 'VC4 Varying FIFO CI'
          git config user.email 'vc4-varying-fifo-ci@users.noreply.github.com'
          git commit -m 'hw/display: model VC4 QPU varying FIFO reads'
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-qpu-varying-fifo-${{ github.run_attempt }}
          path: /tmp/vc4-varying-fifo
          if-no-files-found: warn
          retention-days: 14
