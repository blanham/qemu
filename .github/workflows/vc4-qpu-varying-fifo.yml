name: VC4 QPU varying FIFO contract

on:
  push:
    branches:
      - agent/vc4-qpu-varying-fifo
    paths:
      - .github/workflows/vc4-qpu-varying-fifo.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BRANCH: agent/vc4-qpu-varying-fifo
      EVIDENCE: /tmp/vc4-varying-fifo

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Materialize architectural varying FIFO input
        run: |
          set -euo pipefail
          rm -rf "$EVIDENCE"
          mkdir -p "$EVIDENCE"
          python3 - <<'PY'
          from pathlib import Path

          h = Path('include/hw/display/vc4_qpu_exec.h')
          s = h.read_text()
          old = '''    VC4_QPU_EXEC_FAULT_CODE_READ,\n    VC4_QPU_EXEC_FAULT_UNIFORM_READ,\n    VC4_QPU_EXEC_FAULT_PROGRAM_LIMIT,\n'''
          new = '''    VC4_QPU_EXEC_FAULT_CODE_READ,\n    VC4_QPU_EXEC_FAULT_UNIFORM_READ,\n    VC4_QPU_EXEC_FAULT_VARYING_READ,\n    VC4_QPU_EXEC_FAULT_PROGRAM_LIMIT,\n'''
          if s.count(old) != 1:
              raise SystemExit('fault enum anchor changed')
          s = s.replace(old, new, 1)

          old = '''    uint32_t uniform_address;\n    uint32_t pc;\n    unsigned instruction_count;\n'''
          new = '''    uint32_t uniform_address;\n\n    /*\n     * Fragment-pipeline varying FIFO input.  A VARYING_READ returns the\n     * precomputed VP term and simultaneously loads its C coefficient into r5.\n     * The caller owns these vectors for the duration of vc4_qpu_execute().\n     */\n    const VC4QPUVector *varying_partial;\n    const VC4QPUVector *varying_c;\n    unsigned varying_count;\n    unsigned varying_index;\n\n    uint32_t pc;\n    unsigned instruction_count;\n'''
          if s.count(old) != 1:
              raise SystemExit('state anchor changed')
          s = s.replace(old, new, 1)

          old = '''bool vc4_qpu_exec_set_active_lanes(VC4QPUExecState *state,\n                                   unsigned active_lanes);\n\nbool vc4_qpu_execute'''
          new = '''bool vc4_qpu_exec_set_active_lanes(VC4QPUExecState *state,\n                                   unsigned active_lanes);\n\nbool vc4_qpu_exec_set_varyings(VC4QPUExecState *state,\n                                const VC4QPUVector *partial,\n                                const VC4QPUVector *c, unsigned count);\n\nbool vc4_qpu_execute'''
          if s.count(old) != 1:
              raise SystemExit('API anchor changed')
          h.write_text(s.replace(old, new, 1))

          c = Path('hw/display/vc4_qpu_exec.c')
          s = c.read_text()
          old = '''#define VC4_QPU_REG_UNIFORM              32\n#define VC4_QPU_REG_NULL                 39\n'''
          new = '''#define VC4_QPU_REG_UNIFORM              32\n#define VC4_QPU_REG_VARYING              35\n#define VC4_QPU_REG_NULL                 39\n'''
          if s.count(old) != 1:
              raise SystemExit('register anchor changed')
          s = s.replace(old, new, 1)

          old = '''static bool vc4_qpu_exec_read_port(VC4QPUReadFunc read_func, void *opaque,\n                                   VC4QPUExecState *state, bool file_a,\n                                   unsigned address, VC4QPUVector *value)\n{\n'''
          helper = '''static bool vc4_qpu_exec_read_varying(VC4QPUExecState *state,\n                                          VC4QPUVector *value)\n{\n    unsigned index = state->varying_index;\n\n    if (index >= state->varying_count ||\n        state->varying_partial == NULL || state->varying_c == NULL) {\n        return vc4_qpu_exec_set_fault(\n            state, VC4_QPU_EXEC_FAULT_VARYING_READ, index);\n    }\n\n    *value = state->varying_partial[index];\n    state->accumulator[5] = state->varying_c[index];\n    state->varying_index = index + 1;\n    return true;\n}\n\n''' + old
          if s.count(old) != 1:
              raise SystemExit('read-port anchor changed')
          s = s.replace(old, helper, 1)

          old = '''    case VC4_QPU_REG_UNIFORM:\n        return vc4_qpu_exec_read_uniform(\n            read_func, opaque, state, value);\n    case VC4_QPU_REG_NULL:\n'''
          new = '''    case VC4_QPU_REG_UNIFORM:\n        return vc4_qpu_exec_read_uniform(\n            read_func, opaque, state, value);\n    case VC4_QPU_REG_VARYING:\n        return vc4_qpu_exec_read_varying(state, value);\n    case VC4_QPU_REG_NULL:\n'''
          if s.count(old) != 1:
              raise SystemExit('special-read anchor changed')
          s = s.replace(old, new, 1)

          old = '''                   (instruction->raddr_a == VC4_QPU_REG_UNIFORM ||\n                    instruction->raddr_a == VC4_QPU_REG_NULL ||\n                    instruction->raddr_a == VC4_QPU_REG_VPM)) {\n'''
          new = '''                   (instruction->raddr_a == VC4_QPU_REG_UNIFORM ||\n                    instruction->raddr_a == VC4_QPU_REG_VARYING ||\n                    instruction->raddr_a == VC4_QPU_REG_NULL ||\n                    instruction->raddr_a == VC4_QPU_REG_VPM)) {\n'''
          if s.count(old) != 1:
              raise SystemExit('shared-special-read anchor changed')
          s = s.replace(old, new, 1)

          old = '''bool vc4_qpu_exec_set_active_lanes(VC4QPUExecState *state,\n                                   unsigned active_lanes)\n{\n    if (state == NULL || active_lanes == 0 ||\n        active_lanes > VC4_QPU_LANES) {\n        return false;\n    }\n\n    state->active_lanes = active_lanes;\n    return true;\n}\n\nbool vc4_qpu_execute'''
          new = '''bool vc4_qpu_exec_set_active_lanes(VC4QPUExecState *state,\n                                   unsigned active_lanes)\n{\n    if (state == NULL || active_lanes == 0 ||\n        active_lanes > VC4_QPU_LANES) {\n        return false;\n    }\n\n    state->active_lanes = active_lanes;\n    return true;\n}\n\nbool vc4_qpu_exec_set_varyings(VC4QPUExecState *state,\n                                const VC4QPUVector *partial,\n                                const VC4QPUVector *c, unsigned count)\n{\n    if (state == NULL || (count != 0 && (partial == NULL || c == NULL))) {\n        return false;\n    }\n\n    state->varying_partial = partial;\n    state->varying_c = c;\n    state->varying_count = count;\n    state->varying_index = 0;\n    return true;\n}\n\nbool vc4_qpu_execute'''
          if s.count(old) != 1:
              raise SystemExit('active-lane API anchor changed')
          s = s.replace(old, new, 1)

          old = '''        [VC4_QPU_EXEC_FAULT_CODE_READ] = "code-read",\n        [VC4_QPU_EXEC_FAULT_UNIFORM_READ] = "uniform-read",\n        [VC4_QPU_EXEC_FAULT_PROGRAM_LIMIT] = "program-limit",\n'''
          new = '''        [VC4_QPU_EXEC_FAULT_CODE_READ] = "code-read",\n        [VC4_QPU_EXEC_FAULT_UNIFORM_READ] = "uniform-read",\n        [VC4_QPU_EXEC_FAULT_VARYING_READ] = "varying-read",\n        [VC4_QPU_EXEC_FAULT_PROGRAM_LIMIT] = "program-limit",\n'''
          if s.count(old) != 1:
              raise SystemExit('fault-name anchor changed')
          c.write_text(s.replace(old, new, 1))

          t = Path('tests/unit/test-vc4-qpu.c')
          s = t.read_text()
          anchor = '''static void test_unsupported_signal_fails_closed(void)\n{\n'''
          test = r'''static void test_measured_varying_read_contract(void)
{
    enum { CODE = 0x6800 };
    static const uint64_t program[] = {
        /* First instruction from the measured Mesa readback fragment shader. */
        0x100049e0203e303eULL,
        0x300009e7009e7000ULL,
        0x100009e7009e7000ULL,
        0x100009e7009e7000ULL,
    };
    uint8_t code[sizeof(program)];
    TestMemory memory = { 0 };
    VC4QPUExecState state;
    VC4QPUVector partial = { 0 };
    VC4QPUVector coefficient = { 0 };

    encode_words(code, program, ARRAY_SIZE(program));
    test_memory_add(&memory, CODE, code, sizeof(code));
    vc4_qpu_exec_init(&state, 0);
    for (unsigned lane = 0; lane < VC4_QPU_LANES; lane++) {
        state.reg_a[15].lane[lane] = 0x3f800000; /* W = 1.0 */
        partial.lane[lane] = 0x40000000;         /* VP = 2.0 */
        coefficient.lane[lane] = 0x40400000;     /* C = 3.0 */
    }
    g_assert_true(vc4_qpu_exec_set_varyings(
        &state, &partial, &coefficient, 1));

    g_assert_true(vc4_qpu_execute(test_memory_read, &memory, CODE, &state));
    g_assert_cmpint(state.fault, ==, VC4_QPU_EXEC_FAULT_NONE);
    g_assert_cmpuint(state.varying_index, ==, 1);
    for (unsigned lane = 0; lane < VC4_QPU_LANES; lane++) {
        g_assert_cmphex(state.accumulator[0].lane[lane], ==, 0x40000000);
        g_assert_cmphex(state.accumulator[5].lane[lane], ==, 0x40400000);
    }
}

static void test_varying_fifo_underflow_fails_closed(void)
{
    enum { CODE = 0x6900 };
    static const uint64_t program[] = {
        0x100049e0203e303eULL,
        0x300009e7009e7000ULL,
        0x100009e7009e7000ULL,
        0x100009e7009e7000ULL,
    };
    uint8_t code[sizeof(program)];
    TestMemory memory = { 0 };
    VC4QPUExecState state;

    encode_words(code, program, ARRAY_SIZE(program));
    test_memory_add(&memory, CODE, code, sizeof(code));
    vc4_qpu_exec_init(&state, 0);

    g_assert_false(vc4_qpu_execute(test_memory_read, &memory, CODE, &state));
    g_assert_cmpint(state.fault, ==, VC4_QPU_EXEC_FAULT_VARYING_READ);
    g_assert_cmpuint(state.fault_detail, ==, 0);
    g_assert_cmpstr(vc4_qpu_exec_fault_name(state.fault), ==, "varying-read");
}

''' + anchor
          if s.count(anchor) != 1:
              raise SystemExit('unit-test insertion anchor changed')
          s = s.replace(anchor, test, 1)
          old = '''    g_test_add_func("/vc4/qpu/measured-fs", test_measured_fragment_shader);\n    g_test_add_func("/vc4/qpu/fail-closed",\n                    test_unsupported_signal_fails_closed);\n'''
          new = '''    g_test_add_func("/vc4/qpu/measured-fs", test_measured_fragment_shader);\n    g_test_add_func("/vc4/qpu/measured-varying-read",\n                    test_measured_varying_read_contract);\n    g_test_add_func("/vc4/qpu/varying-underflow",\n                    test_varying_fifo_underflow_fails_closed);\n    g_test_add_func("/vc4/qpu/fail-closed",\n                    test_unsupported_signal_fails_closed);\n'''
          if s.count(old) != 1:
              raise SystemExit('unit-test registration anchor changed')
          t.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git diff > "$EVIDENCE/product.diff"

      - name: Build and validate QPU and pipeline contracts
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev libpixman-1-dev ninja-build pkg-config python3 zlib1g-dev
          ./configure \
            --target-list=aarch64-softmmu,vc4-softmmu \
            --disable-docs --disable-werror \
            2>&1 | tee "$EVIDENCE/configure.log"
          ninja -C build \
            qemu-system-aarch64 qemu-system-vc4 \
            tests/unit/test-vc4-qpu \
            tests/unit/test-vc4-qpu-contract \
            tests/unit/test-vc4-v3d-pipeline \
            2>&1 | tee "$EVIDENCE/build.log"
          build/tests/unit/test-vc4-qpu --tap -k \
            2>&1 | tee "$EVIDENCE/qpu.tap"
          build/tests/unit/test-vc4-qpu-contract --tap -k \
            2>&1 | tee "$EVIDENCE/qpu-contract.tap"
          build/tests/unit/test-vc4-v3d-pipeline --tap -k \
            2>&1 | tee "$EVIDENCE/pipeline.tap"
          python3 scripts/vc4/v3d-smoke.py \
            --qemu build/qemu-system-aarch64 \
            2>&1 | tee "$EVIDENCE/v3d.log"
          git diff --check

      - name: Publish validated product files
        run: |
          set -euo pipefail
          git add -- \
            include/hw/display/vc4_qpu_exec.h \
            hw/display/vc4_qpu_exec.c \
            tests/unit/test-vc4-qpu.c
          git diff --cached --check
          git config user.name 'VC4 Varying FIFO CI'
          git config user.email 'vc4-varying-fifo-ci@users.noreply.github.com'
          git commit -m 'hw/display: model VC4 QPU varying FIFO reads'
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-qpu-varying-fifo-${{ github.run_attempt }}
          path: /tmp/vc4-varying-fifo
          if-no-files-found: warn
          retention-days: 14
