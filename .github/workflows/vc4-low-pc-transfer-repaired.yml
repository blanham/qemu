name: VC4 bootcode failure leaf

on:
  push:
    branches:
      - agent/vc4-low-pc-transfer
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vc4-bootcode-failure-leaf
  cancel-in-progress: true

jobs:
  trace-failure-leaf:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RPI_FIRMWARE_COMMIT: 3d301dd924bcd758a4c8cb19fe8531031f033f43

    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl ninja-build pkg-config python3 python3-venv \
            libglib2.0-dev libpixman-1-dev zlib1g-dev

      - name: Download pinned official firmware trio
        run: |
          for file in bootcode.bin start.elf fixup.dat; do
            curl --fail --location --retry 4 \
              --output "/tmp/${file}" \
              "https://raw.githubusercontent.com/raspberrypi/firmware/${RPI_FIRMWARE_COMMIT}/boot/${file}"
          done
          test "$(git hash-object /tmp/bootcode.bin)" = \
            7642d2d89e4235e7d68875ff70688bdde6e71b5a
          test "$(git hash-object /tmp/start.elf)" = \
            0cefcf3a756740760f9903f35cc3843117853712
          test "$(git hash-object /tmp/fixup.dat)" = \
            1845e38de9d4f9a6d9ad7f5273bfe58b2582a7e6

      - name: Instrument the failing leaf routine
        run: |
          python3 -m py_compile scripts/vc4/instrument-leaf-failure.py
          python3 scripts/vc4/instrument-leaf-failure.py
          git diff --check

      - name: Configure and build heterogeneous system emulator
        run: |
          ./configure \
            --target-list=aarch64-softmmu \
            --disable-docs \
            --disable-werror
          ninja -C build qemu-system-aarch64

      - name: Capture leaf register, branch, and memory history
        run: |
          set -o pipefail
          python3 scripts/vc4/raspi3-stock-bootcode-0200.py \
            build/qemu-system-aarch64 \
            /tmp/bootcode.bin \
            --start-elf /tmp/start.elf \
            --fixup-dat /tmp/fixup.dat \
            --seconds 8 \
            --fast-tcg \
            --barrier-is-success 2>&1 | tee /tmp/vc4-failure-leaf.log

          python3 - <<'PY'
          from pathlib import Path

          log = Path("/tmp/vc4-failure-leaf.log")
          summary = Path("/tmp/vc4-failure-leaf-summary.log")
          markers = (
              "VC4_LOW_TARGET",
              "VC4_LEAF_FAILURE_BEGIN",
              "VC4_LEAF_R9",
              "VC4_LEAF_BRANCH",
              "VC4_LEAF_MEM",
              "VC4_LEAF_FAILURE_END",
          )
          text = log.read_text(encoding="utf-8", errors="replace")
          lines = []
          for fragment in text.replace(" | ", "\n").splitlines():
              positions = [fragment.find(marker) for marker in markers]
              positions = [position for position in positions if position >= 0]
              if positions:
                  lines.append(fragment[min(positions):].rstrip())
          summary.write_text(
              "".join(line + "\n" for line in lines),
              encoding="utf-8",
          )
          PY

          cat /tmp/vc4-failure-leaf-summary.log
          grep -q \
            'VC4_LOW_TARGET source=0x0000166c target=0x00000000 kind=10' \
            /tmp/vc4-failure-leaf-summary.log
          grep -q 'VC4_LEAF_FAILURE_BEGIN' \
            /tmp/vc4-failure-leaf-summary.log
          grep -q '^VC4_LEAF_R9 ' /tmp/vc4-failure-leaf-summary.log
          grep -q '^VC4_LEAF_BRANCH ' /tmp/vc4-failure-leaf-summary.log
          grep -q '^VC4_LEAF_MEM ' /tmp/vc4-failure-leaf-summary.log
          grep -q 'VC4_LEAF_FAILURE_END' \
            /tmp/vc4-failure-leaf-summary.log

      - name: Upload leaf trace and pinned bootcode
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-failure-leaf-${{ github.run_attempt }}
          path: |
            /tmp/vc4-failure-leaf.log
            /tmp/vc4-failure-leaf-summary.log
            /tmp/bootcode.bin
          if-no-files-found: warn
          retention-days: 14
