name: VC4 repaired low-PC transfer trace

on:
  push:
    branches:
      - agent/vc4-low-pc-transfer
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace-low-pc-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RPI_FIRMWARE_COMMIT: 3d301dd924bcd758a4c8cb19fe8531031f033f43

    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl ninja-build pkg-config python3 python3-venv \
            libglib2.0-dev libpixman-1-dev zlib1g-dev

      - name: Download pinned official firmware trio
        run: |
          for file in bootcode.bin start.elf fixup.dat; do
            curl --fail --location --retry 4 \
              --output "/tmp/${file}" \
              "https://raw.githubusercontent.com/raspberrypi/firmware/${RPI_FIRMWARE_COMMIT}/boot/${file}"
          done
          test "$(git hash-object /tmp/bootcode.bin)" = \
            7642d2d89e4235e7d68875ff70688bdde6e71b5a
          test "$(git hash-object /tmp/start.elf)" = \
            0cefcf3a756740760f9903f35cc3843117853712
          test "$(git hash-object /tmp/fixup.dat)" = \
            1845e38de9d4f9a6d9ad7f5273bfe58b2582a7e6

      - name: Instrument every VC4 PC-writing path
        run: |
          python3 scripts/vc4/instrument-low-pc-transfer.py
          git diff --check

      - name: Configure and build heterogeneous system emulator
        run: |
          ./configure \
            --target-list=aarch64-softmmu \
            --disable-docs \
            --disable-werror
          ninja -C build qemu-system-aarch64

      - name: Run official firmware until first high-to-low PC transfer
        run: |
          set -o pipefail
          python3 scripts/vc4/raspi3-stock-bootcode-0200.py \
            build/qemu-system-aarch64 \
            /tmp/bootcode.bin \
            --start-elf /tmp/start.elf \
            --fixup-dat /tmp/fixup.dat \
            --seconds 8 \
            --fast-tcg \
            --barrier-is-success 2>&1 | tee /tmp/vc4-low-pc-transfer.log

          python3 - <<'PY'
          from pathlib import Path
          import re

          log = Path("/tmp/vc4-low-pc-transfer.log")
          summary = Path("/tmp/vc4-low-pc-transfer-summary.log")
          text = log.read_text(encoding="utf-8", errors="replace")
          matches = list(dict.fromkeys(
              re.findall(r"VC4_LOW_TARGET [^|\n]+", text)
          ))
          summary.write_text(
              "".join(match.rstrip() + "\n" for match in matches),
              encoding="utf-8",
          )
          PY

          cat /tmp/vc4-low-pc-transfer-summary.log
          test -s /tmp/vc4-low-pc-transfer-summary.log

      - name: Upload complete low-PC trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-low-pc-transfer-${{ github.run_attempt }}
          path: |
            /tmp/vc4-low-pc-transfer.log
            /tmp/vc4-low-pc-transfer-summary.log
          if-no-files-found: warn
          retention-days: 14
