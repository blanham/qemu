name: VC4 V3D control-thread accuracy

on:
  push:
    branches:
      - agent/vc4-linux-mesa-gles2-frontier
    paths:
      - .github/workflows/vc4-v3d-control-flow-accuracy.yml
      - scripts/vc4/v3d-control-flow-accuracy-fix.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-v3d-control-flow-accuracy
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BRANCH: agent/vc4-linux-mesa-gles2-frontier

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install QEMU build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev libpixman-1-dev ninja-build \
            python3 python3-venv zlib1g-dev

      - name: Correct control-thread register semantics
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/vc4/v3d-control-flow-accuracy-fix.py
          python3 scripts/vc4/v3d-control-flow-accuracy-fix.py
          python3 -m py_compile scripts/vc4/v3d-smoke.py
          git diff --check
          grep -Fq 'V3D_CTRTSD_MASK' hw/display/bcm2835_v3d.c
          grep -Fq 'bcm2835_v3d_increment_list_counter' \
            hw/display/bcm2835_v3d.c
          grep -Fq 'bounded branch flush count' \
            scripts/vc4/v3d-smoke.py
          grep -Fq 'failed nested sub-list return count' \
            scripts/vc4/v3d-smoke.py

      - name: Configure and build QEMU
        run: |
          set -euo pipefail
          ./configure \
            --target-list=aarch64-softmmu \
            --disable-docs --disable-werror
          ninja -C build qemu-system-aarch64

      - name: Run V3D control-thread regression
        run: |
          set -euo pipefail
          python3 scripts/vc4/v3d-smoke.py \
            --qemu build/qemu-system-aarch64

      - name: Publish validated product commit
        run: |
          set -euo pipefail
          git config user.name "VC4 Agent"
          git config user.email "vc4-agent@users.noreply.github.com"
          git rm -- \
            .github/workflows/vc4-v3d-control-flow-accuracy.yml \
            scripts/vc4/v3d-control-flow-accuracy-fix.py
          git add -- \
            hw/display/bcm2835_v3d.c \
            scripts/vc4/v3d-smoke.py
          git diff --cached --check
          git commit -m \
            "hw/display: correct V3D control-thread counters"
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
