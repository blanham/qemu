name: VC4 Linux bring-up decision v2

on:
  push:
    branches:
      - agent/vc4-hetero-direct-linux
    paths:
      - .github/workflows/vc4-linux-bringup-decision-v2.yml
      - VC4_DIRECT_ARM_BOUNDARY_STATUS.json
      - VC4_DIRECT_LINUX_CONTROL_STATUS.json
      - VC4_DIRECT_LINUX_DIAGNOSTIC_STATUS.json
      - VC4_DIRECT_LINUX_DUAL_UART_STATUS.json
      - VC4_DIRECT_ARM_LINUX_ENTRY_MATRIX.json
      - VC4_LINUX_ENTRY_NORMALIZER_STATUS.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-linux-bringup-decision-v2
  cancel-in-progress: true

jobs:
  decide:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select the first unproven boundary
        id: select
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          import os

          filenames = [
              'VC4_DIRECT_ARM_BOUNDARY_STATUS.json',
              'VC4_DIRECT_LINUX_CONTROL_STATUS.json',
              'VC4_DIRECT_LINUX_DIAGNOSTIC_STATUS.json',
              'VC4_DIRECT_LINUX_DUAL_UART_STATUS.json',
              'VC4_DIRECT_ARM_LINUX_ENTRY_MATRIX.json',
              'VC4_LINUX_ENTRY_NORMALIZER_STATUS.json',
          ]
          docs = {}
          for filename in filenames:
              path = Path(filename)
              if path.is_file():
                  try:
                      docs[filename] = json.loads(path.read_text())
                  except Exception as exc:
                      docs[filename] = {
                          'parse_error': f'{type(exc).__name__}: {exc}'
                      }

          boundary = docs.get('VC4_DIRECT_ARM_BOUNDARY_STATUS.json', {})
          witness = boundary.get('witness', {})
          normalizer_boundary = boundary.get('normalizer', {})

          def checks_match(document, key):
              checks = document.get(key, [])
              return bool(checks) and all(
                  bool(check.get('matched')) for check in checks
              )

          primary_loaded = checks_match(witness, 'load_checks')
          direct_ram = checks_match(witness, 'memory_marker_checks')
          direct_serial = bool(witness.get('serial_marker_seen'))
          secondary_loaded = checks_match(normalizer_boundary, 'load_checks')
          normalizer_ram = checks_match(
              normalizer_boundary, 'memory_marker_checks'
          )
          normalizer_serial = bool(
              normalizer_boundary.get('serial_marker_seen')
          )

          def any_true(keys):
              found = False
              def walk(value):
                  nonlocal found
                  if found:
                      return
                  if isinstance(value, dict):
                      for key, child in value.items():
                          if key in keys and child is True:
                              found = True
                              return
                          walk(child)
                  elif isinstance(value, list):
                      for child in value:
                          walk(child)
              walk(docs)
              return found

          transcripts = []
          def collect(value):
              if isinstance(value, dict):
                  for key, child in value.items():
                      if key in {
                          'serial_tail', 'pl011_tail', 'aux_tail',
                          'direct_serial', 'stderr_tail'
                      }:
                          if isinstance(child, list):
                              transcripts.extend(str(item) for item in child)
                          elif isinstance(child, str):
                              transcripts.append(child)
                      collect(child)
              elif isinstance(value, list):
                  for child in value:
                      collect(child)
          collect(docs)
          transcript = '\n'.join(transcripts)

          linux = any_true({
              'linux_version_seen', 'combined_linux_version_seen',
              'pl011_linux_version_seen', 'aux_linux_version_seen'
          }) or 'Linux version ' in transcript
          init_seen = any_true({'init_seen', 'combined_init_seen'}) or \
                      'VC4_LINUX_INIT_START' in transcript
          fb_marker = any_true({
              'framebuffer_marker_seen',
              'combined_framebuffer_marker_seen'
          }) or 'VC4_LINUX_FB_OK' in transcript
          scanout = any_true({'scanout_passed'})
          fb_open_fail = 'VC4_LINUX_FB_FAIL stage=open' in transcript
          fb_paint_fail = 'VC4_LINUX_FB_FAIL stage=paint' in transcript

          if not primary_loaded:
              action = 'fix-direct-arm-primary-image-loader'
              branch = 'agent/vc4-direct-arm-loader-fix'
          elif not direct_ram:
              action = 'fix-direct-arm-cpu-release'
              branch = 'agent/vc4-direct-arm-release-fix'
          elif not direct_serial:
              action = 'fix-direct-arm-pl011'
              branch = 'agent/vc4-direct-arm-pl011-fix'
          elif not secondary_loaded:
              action = 'fix-direct-secondary-image-loader'
              branch = 'agent/vc4-linux-loader-fix'
          elif not normalizer_ram:
              action = 'fix-normalized-linux-jump-execution'
              branch = 'agent/vc4-linux-normalizer-fix'
          elif not normalizer_serial:
              action = 'fix-normalizer-pl011'
              branch = 'agent/vc4-linux-normalizer-pl011-fix'
          elif not linux:
              action = 'fix-linux-image-entry-or-boot-protocol'
              branch = 'agent/vc4-linux-image-entry-fix'
          elif not init_seen:
              action = 'fix-linux-initramfs-handoff'
              branch = 'agent/vc4-linux-initramfs-fix'
          elif not fb_marker and fb_open_fail:
              action = 'provide-linux-framebuffer-device'
              branch = 'agent/vc4-linux-fb-device-fix'
          elif not fb_marker and fb_paint_fail:
              action = 'fix-linux-framebuffer-mapping'
              branch = 'agent/vc4-linux-fb-mapping-fix'
          elif not fb_marker:
              action = 'diagnose-linux-framebuffer-registration'
              branch = 'agent/vc4-linux-fb-registration'
          elif not scanout:
              action = 'fix-qemu-framebuffer-scanout'
              branch = 'agent/vc4-linux-scanout-fix'
          else:
              action = 'direct-linux-framebuffer-validated'
              branch = 'agent/vc4-linux-framebuffer-bringup'

          decision = {
              'schema_version': 2,
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'source_sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'next_action': action,
              'continuation_branch': branch,
              'boundaries': {
                  'primary_image_loaded': primary_loaded,
                  'direct_arm_ram_marker': direct_ram,
                  'direct_arm_serial_marker': direct_serial,
                  'secondary_linux_image_loaded': secondary_loaded,
                  'normalizer_ram_marker': normalizer_ram,
                  'normalizer_serial_marker': normalizer_serial,
                  'linux_version_seen': linux,
                  'init_seen': init_seen,
                  'framebuffer_marker_seen': fb_marker,
                  'scanout_passed': scanout,
                  'framebuffer_open_failure': fb_open_fail,
                  'framebuffer_paint_failure': fb_paint_fail,
              },
              'source_documents': docs,
          }
          Path('VC4_LINUX_BRINGUP_DECISION_V2.json').write_text(
              json.dumps(decision, indent=2, sort_keys=True) + '\n'
          )
          lines = [
              '# VC4 Linux bring-up decision v2',
              '',
              f'Next action: **`{action}`**',
              '',
              f'Continuation branch: `{branch}`',
              '',
              '| Boundary | Reached |',
              '|---|---:|',
          ]
          for key, value in decision['boundaries'].items():
              lines.append(f'| `{key}` | `{value}` |')
          Path('VC4_LINUX_BRINGUP_DECISION_V2.md').write_text(
              '\n'.join(lines) + '\n'
          )
          print(json.dumps({
              'next_action': action,
              'continuation_branch': branch,
              'boundaries': decision['boundaries'],
          }, indent=2))
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'action={action}\n')
              output.write(f'branch={branch}\n')
          PY

      - name: Publish and dispatch
        env:
          ACTION: ${{ steps.select.outputs.action }}
          BRANCH: ${{ steps.select.outputs.branch }}
        run: |
          set -euo pipefail
          cp VC4_LINUX_BRINGUP_DECISION_V2.json /tmp/decision-v2.json
          cp VC4_LINUX_BRINGUP_DECISION_V2.md /tmp/decision-v2.md
          git reset --hard "$GITHUB_SHA"
          cp /tmp/decision-v2.json VC4_LINUX_BRINGUP_DECISION_V2.json
          cp /tmp/decision-v2.md VC4_LINUX_BRINGUP_DECISION_V2.md
          git rm .github/workflows/vc4-linux-bringup-decision-v2.yml
          git add \
            VC4_LINUX_BRINGUP_DECISION_V2.json \
            VC4_LINUX_BRINGUP_DECISION_V2.md
          git diff --cached --check
          git config user.name 'VC4 CI'
          git config user.email 'vc4-ci@users.noreply.github.com'
          git commit -m "ci/vc4: select ${ACTION} [skip ci]"
          git pull --rebase origin agent/vc4-hetero-direct-linux
          git push origin HEAD:agent/vc4-hetero-direct-linux
          git push --force-with-lease origin HEAD:"$BRANCH"
