name: VC4 V3D clear-scanout final dispatch

on:
  push:
    branches:
      - agent/vc4-v3d-clear-scanout
    paths:
      - .github/workflows/vc4-v3d-clear-dispatch-final.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch the quiescent live-scanout gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          payload=$(printf '{"ref":"%s"}' "$REF_NAME")
          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/vc4-v3d-clear-scanout.yml/dispatches" \
            --data "$payload"
