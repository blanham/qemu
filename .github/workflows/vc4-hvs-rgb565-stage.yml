      - name: Build and run focused HVS scanout tests
        run: |
          set -euo pipefail
          ./configure \
            --target-list=aarch64-softmmu \
            --disable-docs --disable-werror
          ninja -C build qemu-system-aarch64
          python3 scripts/vc4/hvs-dlist-smoke.py \
            --qemu build/qemu-system-aarch64

      - name: Publish the validated RGB565 model
        run: |
          set -euo pipefail
          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git add \
            hw/display/bcm2835_hvs.c \
            scripts/vc4/hvs-dlist-smoke.py
          git diff --cached --check
          git diff --cached --name-status
          git commit -m "hw/display: scan out VC4 RGB565 display lists"
          git pull --rebase origin agent/vc4-linux-kms-bind-diagnostics
          git push origin HEAD:agent/vc4-linux-kms-bind-diagnostics
