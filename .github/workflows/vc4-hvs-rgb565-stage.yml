name: Stage VC4 RGB565 HVS scanout

on:
  push:
    branches:
      - agent/vc4-linux-kms-bind-diagnostics
    paths:
      - .github/workflows/vc4-hvs-rgb565-stage.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-hvs-rgb565-stage
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/vc4-linux-kms-bind-diagnostics
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev libpixman-1-dev \
            ninja-build pkg-config python3 zlib1g-dev

      - name: Add RGB565 HVS scanout and regression coverage
        run: |
          set -euo pipefail
          cat .github/vc4-hvs-rgb565-parts/* | \
            base64 --decode > /tmp/patch-vc4-rgb565.py
          test "$(sha256sum /tmp/patch-vc4-rgb565.py | cut -d' ' -f1)" = \
            da8532592de290bef4d67cb3f6e3d3e1f0fb6e62587cda7e187c00b5b2aea159
          python3 /tmp/patch-vc4-rgb565.py
          python3 -m py_compile scripts/vc4/hvs-dlist-smoke.py
          git diff --check
          git diff --stat
          git diff -- hw/display/bcm2835_hvs.c
          git diff -- scripts/vc4/hvs-dlist-smoke.py

      - name: Build and run focused HVS scanout tests
        run: |
          set -euo pipefail
          ./configure \
            --target-list=aarch64-softmmu \
            --disable-docs --disable-werror
          ninja -C build qemu-system-aarch64
          python3 scripts/vc4/hvs-dlist-smoke.py \
            --qemu build/qemu-system-aarch64

      - name: Publish the validated RGB565 model
        run: |
          set -euo pipefail
          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git add \
            hw/display/bcm2835_hvs.c \
            scripts/vc4/hvs-dlist-smoke.py
          git diff --cached --check
          git diff --cached --name-status
          git commit -m "hw/display: scan out VC4 RGB565 display lists"
          git pull --rebase origin agent/vc4-linux-kms-bind-diagnostics
          git push origin HEAD:agent/vc4-linux-kms-bind-diagnostics
