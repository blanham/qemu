name: WD40 execution-control QAPI doc repair

on:
  push:
    branches:
      - wd40/qol-execution-control
    paths:
      - .github/workflows/wd40-execution-doc-wrap-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: wd40/qol-execution-control
          fetch-depth: 0

      - name: Wrap execution-control QAPI documentation
        run: |
          set -Eeuo pipefail
          git config user.name "WD40 Build Bot"
          git config user.email "wd40-build@users.noreply.github.com"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/wd40/apply-execution-control.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "# Accepted request to execute exactly one instruction on one virtual CPU.\n":
                  "# Accepted request to execute exactly one instruction on one virtual\n"
                  "# CPU.\n",
              "# @sequence: nonzero request identifier used to correlate the stop event\n":
                  "# @sequence: nonzero request identifier used to correlate the stop\n"
                  "#     event\n",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"missing unique QAPI line: {old!r}")
              text = text.replace(old, new, 1)
          compile(text, str(path), "exec")
          path.write_text(text, encoding="utf-8")
          PY

          git diff --check
          git add scripts/wd40/apply-execution-control.py
          git commit -m "wd40: wrap execution-control QAPI docs"
          git push origin HEAD:wd40/qol-execution-control
