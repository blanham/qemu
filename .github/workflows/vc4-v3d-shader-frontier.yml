name: VC4 V3D shader frontier

on:
  push:
    branches:
      - agent/vc4-linux-mesa-gles2-frontier
    paths:
      - .github/workflows/vc4-v3d-shader-frontier.yml
      - hw/display/bcm2835_v3d.c
      - hw/display/meson.build
      - hw/display/vc4_qpu.c
      - hw/display/vc4_qpu_exec.c
      - hw/display/vc4_v3d_frontier.c
      - include/hw/display/bcm2835_v3d.h
      - include/hw/display/vc4_qpu.h
      - include/hw/display/vc4_qpu_exec.h
      - include/hw/display/vc4_v3d_frontier.h
      - scripts/vc4/qpu-exec-integrate.py
      - scripts/vc4/v3d-shader-frontier-fix.py
      - scripts/vc4/v3d-shader-frontier-smoke.py
      - tests/unit/meson.build
      - tests/unit/test-vc4-qpu.c
      - tests/unit/test-vc4-qpu-contract.c
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: vc4-v3d-shader-frontier
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BRANCH: agent/vc4-linux-mesa-gles2-frontier
      EVIDENCE_DIR: ${{ runner.temp }}/vc4-qpu-evidence

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install QEMU build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev libpixman-1-dev ninja-build \
            python3 python3-venv zlib1g-dev

      - name: Materialize and verify idempotent QPU repairs
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          git rev-parse HEAD > "$EVIDENCE_DIR/BASE_SHA"
          python3 -m py_compile \
            scripts/vc4/qpu-exec-integrate.py \
            scripts/vc4/v3d-shader-frontier-fix.py \
            scripts/vc4/v3d-shader-frontier-smoke.py
          python3 scripts/vc4/v3d-shader-frontier-fix.py
          python3 scripts/vc4/qpu-exec-integrate.py
          sha256sum hw/display/vc4_qpu_exec.c \
            hw/display/meson.build tests/unit/meson.build \
            > "$EVIDENCE_DIR/IDEMPOTENT_SHA256SUMS"
          python3 scripts/vc4/qpu-exec-integrate.py
          sha256sum -c "$EVIDENCE_DIR/IDEMPOTENT_SHA256SUMS"
          git diff --check
          git diff --no-ext-diff > "$EVIDENCE_DIR/product.patch"

      - name: Configure and build focused QPU tests first
        run: |
          set -euo pipefail
          ./configure \
            --target-list=aarch64-softmmu \
            --disable-docs --disable-werror \
            --extra-cflags=-Werror=implicit-function-declaration \
            2>&1 | tee "$EVIDENCE_DIR/configure.log"
          ninja -C build \
            tests/unit/test-vc4-qpu tests/unit/test-vc4-qpu-contract \
            2>&1 | tee "$EVIDENCE_DIR/unit-build.log"

      - name: Validate measured shaders and independent ISA contracts
        run: |
          set -euo pipefail
          build/tests/unit/test-vc4-qpu --tap -k \
            2>&1 | tee "$EVIDENCE_DIR/measured.tap"
          build/tests/unit/test-vc4-qpu-contract --tap -k \
            2>&1 | tee "$EVIDENCE_DIR/contracts.tap"

      - name: Validate QPU tests under address and undefined-behavior sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          set -euo pipefail
          mkdir -p build-vc4-sanitize
          (
            cd build-vc4-sanitize
            ../configure --target-list=aarch64-softmmu \
              --disable-docs --disable-werror \
              --extra-cflags='-fsanitize=address,undefined,float-cast-overflow -fno-sanitize-recover=all -Werror=implicit-function-declaration' \
              --extra-ldflags='-fsanitize=address,undefined,float-cast-overflow'
          ) 2>&1 | tee "$EVIDENCE_DIR/sanitizer-configure.log"
          ninja -C build-vc4-sanitize \
            tests/unit/test-vc4-qpu tests/unit/test-vc4-qpu-contract \
            2>&1 | tee "$EVIDENCE_DIR/sanitizer-build.log"
          build-vc4-sanitize/tests/unit/test-vc4-qpu --tap -k \
            2>&1 | tee "$EVIDENCE_DIR/measured-sanitized.tap"
          build-vc4-sanitize/tests/unit/test-vc4-qpu-contract --tap -k \
            2>&1 | tee "$EVIDENCE_DIR/contracts-sanitized.tap"

      - name: Build QEMU after the focused tests pass
        run: |
          set -euo pipefail
          ninja -C build qemu-system-aarch64 \
            2>&1 | tee "$EVIDENCE_DIR/qemu-build.log"

      - name: Preserve the existing V3D regression
        run: |
          set -euo pipefail
          python3 scripts/vc4/v3d-smoke.py \
            --qemu build/qemu-system-aarch64 \
            2>&1 | tee "$EVIDENCE_DIR/v3d-smoke.log"

      - name: Validate the shader-record frontier
        run: |
          set -euo pipefail
          python3 scripts/vc4/v3d-shader-frontier-smoke.py \
            --qemu build/qemu-system-aarch64 \
            2>&1 | tee "$EVIDENCE_DIR/shader-frontier.log"

      - name: Publish only the tested product tree
        id: publish
        run: |
          set -euo pipefail
          printf 'published=false\n' >> "$GITHUB_OUTPUT"
          git config user.name "VC4 Agent"
          git config user.email "vc4-agent@users.noreply.github.com"
          git restore -- \
            scripts/vc4/qpu-exec-integrate.py \
            scripts/vc4/v3d-shader-frontier-fix.py
          git add -- \
            hw/display/bcm2835_v3d.c \
            hw/display/meson.build \
            hw/display/vc4_qpu_exec.c \
            include/hw/display/bcm2835_v3d.h \
            tests/unit/meson.build
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Shader/QPU product already materialized"
            git rev-parse HEAD > "$EVIDENCE_DIR/PRODUCT_SHA"
            exit 0
          fi
          git commit -m \
            "hw/display: publish tested VC4 QPU conversion and packing repairs"
          tested_tree=$(git rev-parse 'HEAD^{tree}')
          printf '%s\n' "$tested_tree" > "$EVIDENCE_DIR/TESTED_TREE"
          git pull --rebase origin "$BRANCH"
          if [ "$(git rev-parse 'HEAD^{tree}')" != "$tested_tree" ]; then
            echo "Branch advanced to a different tree; rerun validation before publication" >&2
            exit 1
          fi
          git push origin HEAD:"$BRANCH"
          git rev-parse HEAD > "$EVIDENCE_DIR/PRODUCT_SHA"
          printf 'published=true\n' >> "$GITHUB_OUTPUT"

      - name: Dispatch pinned Linux Mesa GLES2 frontier
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run vc4-linux-mesa-gles2-frontier.yml \
            --ref "$BRANCH"

      - name: Upload QPU validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-qpu-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: warn
