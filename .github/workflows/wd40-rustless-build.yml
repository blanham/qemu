name: WD40 Rustless build contract

on:
  push:
    branches:
      - wd40/qol-rustless-build-contract
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wd40-rustless-build-contract
  cancel-in-progress: false

jobs:
  transform-build-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure commit identity
        run: |
          git config user.name "WD40 Build Bot"
          git config user.email "wd40-build@users.noreply.github.com"

      - name: Apply the C-only build contract
        run: |
          set -Eeuo pipefail
          python3 scripts/wd40/apply-rustless-build.py
          python3 scripts/ci/check-wd40-rustless.py
          git diff --check

      - name: Install C build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            pkg-config \
            python3-venv \
            libglib2.0-dev \
            libpixman-1-dev

      - name: Poison Rust tools and configure representative targets
        run: |
          set -Eeuo pipefail
          mkdir .wd40-poison
          for tool in rustc cargo rustdoc rustfmt bindgen; do
            cat > ".wd40-poison/$tool" <<EOF
          #!/bin/sh
          echo "WD40 Rustless contract: unexpected invocation of $tool" >&2
          exit 99
          EOF
            chmod +x ".wd40-poison/$tool"
          done
          export PATH="$PWD/.wd40-poison:$PATH"

          mkdir build
          cd build
          ../configure \
            --target-list=x86_64-softmmu,aarch64-softmmu \
            --disable-rust \
            --enable-fdt=internal \
            --disable-docs \
            --disable-werror
          make update-buildoptions
          ninja -j2 qemu-system-x86_64 qemu-system-aarch64
          cd ..

          python3 scripts/ci/check-wd40-rustless.py build

      - name: Verify that enabling Rust is rejected explicitly
        run: |
          set -Eeuo pipefail
          export PATH="$PWD/.wd40-poison:$PATH"
          mkdir build-rust-reject
          set +e
          (
            cd build-rust-reject
            ../configure \
              --target-list=x86_64-softmmu \
              --enable-rust \
              --disable-docs \
              --disable-werror
          ) >rust-enable.log 2>&1
          rc=$?
          set -e
          if [[ $rc -eq 0 ]]; then
            cat rust-enable.log
            echo "--enable-rust unexpectedly succeeded" >&2
            exit 1
          fi
          grep -q "Rust support is intentionally disabled in the WD40 fork" \
            rust-enable.log

      - name: Publish validated transformation
        run: |
          set -Eeuo pipefail
          rm -rf .wd40-poison build build-rust-reject rust-enable.log
          python3 scripts/ci/check-wd40-rustless.py
          git diff --check
          git add -A
          if git diff --cached --quiet; then
            echo "Rustless contract already applied"
            exit 0
          fi
          git commit -m "build: enforce WD40's C-only Rustless contract

          Remove Rust toolchain discovery and active Rust build integration.
          Keep the upstream Rust source directory only as provenance, always
          select the C PL011 and HPET implementations, reject --enable-rust,
          and validate that generated build metadata contains no Rust command
          or source input."
          git push origin "HEAD:${GITHUB_REF_NAME}"
