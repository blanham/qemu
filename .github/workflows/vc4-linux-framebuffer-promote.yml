name: VC4 Linux framebuffer milestone promotion

on:
  push:
    branches:
      - agent/vc4-hetero-direct-linux
    paths:
      - .github/workflows/vc4-linux-framebuffer-promote.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require the complete Linux framebuffer evidence chain
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          path = Path('VC4_HETERO_DIRECT_LINUX_STATUS.json')
          if not path.is_file():
              raise SystemExit('missing VC4_HETERO_DIRECT_LINUX_STATUS.json')

          status = json.loads(path.read_text())
          bare = status.get('bare') or {}
          linux = status.get('linux') or {}
          outcomes = status.get('outcomes') or {}

          required_outcomes = ('materialize', 'artifacts', 'build',
                               'regressions', 'fixtures', 'bare', 'linux')
          failures = []
          for key in required_outcomes:
              value = outcomes.get(key)
              if value != 'success':
                  failures.append(f'outcome {key}={value!r}')

          required_flags = {
              'bare framebuffer witness': bool(bare.get('passed')),
              'Linux version marker': bool(linux.get('linux_version_seen')),
              'Linux init marker': bool(linux.get('init_seen')),
              'Linux framebuffer scanout': bool(linux.get('passed')),
          }
          for label, value in required_flags.items():
              if not value:
                  failures.append(f'{label}=false')

          # Newer probes expose the component checks separately.  Require
          # every component when the field is present, while retaining
          # compatibility with the initial result schema.
          for key in (
              'serial_marker_seen',
              'memory_marker_seen',
              'guest_pixels_match',
              'qtest_pixels_match',
              'screendump_pixels_match',
          ):
              if key in linux and not linux.get(key):
                  failures.append(f'linux.{key}=false')

          if failures:
              raise SystemExit(
                  'Linux framebuffer milestone is not promotable:\n  - '
                  + '\n  - '.join(failures)
              )

          print('complete Linux framebuffer evidence chain passed')
          PY

      - name: Record the milestone and the next V3D boundary
        shell: bash
        run: |
          set -euo pipefail
          cat >VC4_LINUX_FRAMEBUFFER_MILESTONE.md <<'EOF'
          # VC4 heterogeneous Linux framebuffer milestone

          The heterogeneous Raspberry Pi 3 machine has passed the complete
          direct-ARM Linux framebuffer evidence chain:

          - both the AArch64 and VC4 QEMU frontends build together;
          - the VC4 processor-control and BCM2835 multicore-sync regressions pass;
          - the bare-metal ARM property-mailbox witness allocates and paints a
            640x480x32 framebuffer;
          - a pinned Raspberry Pi AArch64 Linux kernel reaches the deterministic
            initramfs `/init`;
          - `/init` opens and maps `/dev/fb0`, paints four deterministic quadrants,
            and emits the success marker;
          - guest metadata, qtest framebuffer-RAM reads, and QMP `screendump`
            agree on the displayed pixels.

          The optional direct-ARM control remains intentionally separate from
          the stock `bootcode.bin -> start.elf -> kernel8.img` path.  It is a
          validated Linux development lane, not a substitute for completing the
          stock firmware handoff.

          ## Next graphics boundary

          Accelerated 3D work should begin with narrow V3D witnesses rather than
          a desktop compositor:

          1. enumerate V3D identity, status, interrupt, and MMU registers;
          2. validate firmware/property power and clock control for V3D;
          3. submit a minimal control list that clears a tile buffer;
          4. validate binning and rendering completion interrupts;
          5. run a single-triangle test through the Linux DRM/V3D ABI;
          6. only then attempt Mesa `v3d`/`vc4` acceleration and KMS composition.

          Each stage must retain a guest-memory witness and an independently
          captured QEMU scanout or rendered-buffer comparison.
          EOF
          git add VC4_LINUX_FRAMEBUFFER_MILESTONE.md
          git diff --cached --check

      - name: Publish the validated milestone branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VC4 CI'
          git config user.email 'vc4-ci@users.noreply.github.com'
          git commit -m 'docs/vc4: record Linux framebuffer milestone'
          git push --force-with-lease \
            origin HEAD:refs/heads/agent/vc4-linux-framebuffer-release

      - name: Remove the one-shot promotion workflow from the source branch
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$GITHUB_SHA"
          git rm .github/workflows/vc4-linux-framebuffer-promote.yml
          git config user.name 'VC4 CI'
          git config user.email 'vc4-ci@users.noreply.github.com'
          git commit -m 'ci/vc4: retire framebuffer promotion gate [skip ci]'
          git pull --rebase origin agent/vc4-hetero-direct-linux
          git push origin HEAD:agent/vc4-hetero-direct-linux
