name: VC4 V3D clear scanout validation

on:
  push:
    branches:
      - agent/vc4-v3d-clear-scanout
    paths:
      - .github/workflows/vc4-v3d-clear-scanout.yml
      - hw/display/bcm2835_v3d.c
      - include/hw/display/bcm2835_v3d.h
      - scripts/vc4/v3d-integrate.py
      - scripts/vc4/v3d-smoke.py
      - scripts/vc4/build-arm-v3d-clear.sh
      - scripts/vc4/raspi3-v3d-clear-probe.py
      - tests/vc4/arm-v3d-clear.c
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-v3d-clear-scanout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RPI_FIRMWARE_COMMIT: 3d301dd924bcd758a4c8cb19fe8531031f033f43
      OFFICIAL_DIR: /tmp/vc4-v3d-clear-official
      CLEAR_DIR: /tmp/vc4-v3d-clear-proof
      LINUX_DIR: /tmp/vc4-v3d-clear-linux

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install build and fixture dependencies
        id: dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            binutils-aarch64-linux-gnu \
            cpio curl file gcc-aarch64-linux-gnu gzip \
            libc6-dev-arm64-cross linux-libc-dev-arm64-cross \
            ninja-build pkg-config python3 python3-venv \
            libglib2.0-dev libpixman-1-dev zlib1g-dev

      - name: Materialize and lint the V3D device
        id: materialize
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/vc4/v3d-integrate.py \
            scripts/vc4/v3d-smoke.py \
            scripts/vc4/raspi3-v3d-clear-probe.py \
            scripts/vc4/preg-mutex-smoke.py \
            scripts/vc4/msync-smoke.py \
            scripts/vc4/raspi3-linux-probe.py
          python3 scripts/vc4/v3d-integrate.py
          python3 scripts/vc4/v3d-integrate.py
          git diff --check
          grep -q "bcm2835_v3d.c" hw/display/meson.build
          grep -q "BCM2835V3DState v3d" \
            include/hw/arm/bcm2835_peripherals.h
          grep -q 'object_initialize_child(obj, "v3d"' \
            hw/arm/bcm2835_peripherals.c
          grep -q "INTERRUPT_3D" hw/arm/bcm2835_peripherals.c
          ! grep -q 'create_unimp(s, &s->v3d' \
            hw/arm/bcm2835_peripherals.c

      - name: Configure and build AArch64 and VC4 frontends
        id: build
        run: |
          set -euo pipefail
          ./configure \
            --target-list=aarch64-softmmu,vc4-softmmu \
            --disable-docs --disable-werror \
            2>&1 | tee /tmp/vc4-v3d-clear-configure.log
          ninja -C build qemu-system-aarch64 qemu-system-vc4 \
            2>&1 | tee /tmp/vc4-v3d-clear-build.log

      - name: Preserve processor, synchronization, and V3D MMIO regressions
        id: regressions
        run: |
          set -euo pipefail
          python3 scripts/vc4/preg-mutex-smoke.py \
            --qemu build/qemu-system-vc4 \
            2>&1 | tee /tmp/vc4-v3d-clear-preg.log
          python3 scripts/vc4/msync-smoke.py \
            --qemu build/qemu-system-aarch64 \
            2>&1 | tee /tmp/vc4-v3d-clear-msync.log
          python3 scripts/vc4/v3d-smoke.py \
            --qemu build/qemu-system-aarch64 \
            2>&1 | tee /tmp/vc4-v3d-clear-mmio.log

      - name: Build bare-metal V3D scanout witness
        id: clear_fixture
        run: |
          set -euo pipefail
          bash scripts/vc4/build-arm-v3d-clear.sh \
            build/vc4-arm-v3d-clear
          test -s build/vc4-arm-v3d-clear/kernel8.img

      - name: Prove V3D writes a live framebuffer scanout
        id: clear_probe
        run: |
          set -euo pipefail
          rm -rf "$CLEAR_DIR"
          python3 scripts/vc4/raspi3-v3d-clear-probe.py \
            --qemu build/qemu-system-aarch64 \
            --kernel build/vc4-arm-v3d-clear/kernel8.img \
            --out-dir "$CLEAR_DIR" \
            --seconds 120 --sample-interval 1 \
            2>&1 | tee /tmp/vc4-v3d-clear-probe.log

      - name: Fetch pinned Raspberry Pi Linux artifacts
        id: linux_artifacts
        run: |
          set -euo pipefail
          rm -rf "$OFFICIAL_DIR"
          mkdir -p "$OFFICIAL_DIR"
          for file in kernel8.img bcm2710-rpi-3-b.dtb; do
            curl --fail --location --retry 5 \
              --output "$OFFICIAL_DIR/$file" \
              "https://raw.githubusercontent.com/raspberrypi/firmware/${RPI_FIRMWARE_COMMIT}/boot/$file"
          done
          test "$(git hash-object "$OFFICIAL_DIR/kernel8.img")" = \
            a694aa64988bbecadc770c874488165303eac673
          test "$(git hash-object "$OFFICIAL_DIR/bcm2710-rpi-3-b.dtb")" = \
            398c480adc49a5fcb03aa4c095ea74db5d1f893b
          sha256sum "$OFFICIAL_DIR"/* > "$OFFICIAL_DIR/SHA256SUMS"

      - name: Build deterministic Linux initramfs
        id: linux_fixture
        run: |
          set -euo pipefail
          bash scripts/vc4/build-linux-initramfs.sh \
            build/vc4-linux-initramfs
          test -s build/vc4-linux-initramfs/initramfs.cpio.gz

      - name: Preserve pinned Linux boot and framebuffer scanout
        id: linux
        run: |
          set -euo pipefail
          rm -rf "$LINUX_DIR"
          python3 scripts/vc4/raspi3-linux-probe.py \
            --mode linux-direct \
            --qemu build/qemu-system-aarch64 \
            --kernel "$OFFICIAL_DIR/kernel8.img" \
            --dtb "$OFFICIAL_DIR/bcm2710-rpi-3-b.dtb" \
            --initrd build/vc4-linux-initramfs/initramfs.cpio.gz \
            --out-dir "$LINUX_DIR" \
            --seconds 300 --sample-interval 5

      - name: Record validation frontier
        id: record
        if: always()
        env:
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          MATERIALIZE_OUTCOME: ${{ steps.materialize.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          REGRESSIONS_OUTCOME: ${{ steps.regressions.outcome }}
          CLEAR_FIXTURE_OUTCOME: ${{ steps.clear_fixture.outcome }}
          CLEAR_PROBE_OUTCOME: ${{ steps.clear_probe.outcome }}
          LINUX_ARTIFACTS_OUTCOME: ${{ steps.linux_artifacts.outcome }}
          LINUX_FIXTURE_OUTCOME: ${{ steps.linux_fixture.outcome }}
          LINUX_OUTCOME: ${{ steps.linux.outcome }}
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          import os

          def load(path):
              item = Path(path)
              return json.loads(item.read_text()) if item.is_file() else {}

          def tail(path, lines=160):
              item = Path(path)
              if not item.is_file():
                  return []
              return item.read_text(
                  encoding='utf-8', errors='replace'
              ).splitlines()[-lines:]

          outcomes = {
              key.removesuffix('_OUTCOME').lower(): value
              for key, value in os.environ.items()
              if key.endswith('_OUTCOME')
          }
          clear = load(Path(os.environ['CLEAR_DIR']) / 'result.json')
          linux = load(Path(os.environ['LINUX_DIR']) / 'result.json')
          required = (
              'dependencies', 'materialize', 'build', 'regressions',
              'clear_fixture', 'clear_probe', 'linux_artifacts',
              'linux_fixture', 'linux',
          )
          passed = (
              all(outcomes.get(key) == 'success' for key in required)
              and clear.get('passed') is True
              and linux.get('passed') is True
          )
          status = {
              'schema_version': 1,
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'source_sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'passed': passed,
              'outcomes': outcomes,
              'v3d_clear_scanout': {
                  'passed': clear.get('passed'),
                  'serial_success_seen': clear.get('serial_success_seen'),
                  'guest_memory_passed': clear.get('guest_memory_passed'),
                  'framebuffer': clear.get('framebuffer'),
                  'v3d': clear.get('v3d'),
                  'screenshot': clear.get('screenshot'),
                  'elapsed_seconds': clear.get('elapsed_seconds'),
                  'failure': clear.get('failure'),
              },
              'linux_regression': {
                  'passed': linux.get('passed'),
                  'version_seen': linux.get('linux_version_seen'),
                  'init_seen': linux.get('init_seen'),
                  'framebuffer_marker_seen': linux.get(
                      'framebuffer_marker_seen'),
                  'screenshot': linux.get('screenshot'),
                  'elapsed_seconds': linux.get('elapsed_seconds'),
              },
              'log_tails': {
                  'configure': tail('/tmp/vc4-v3d-clear-configure.log'),
                  'build': tail('/tmp/vc4-v3d-clear-build.log', 240),
                  'preg': tail('/tmp/vc4-v3d-clear-preg.log'),
                  'msync': tail('/tmp/vc4-v3d-clear-msync.log'),
                  'v3d_mmio': tail('/tmp/vc4-v3d-clear-mmio.log'),
                  'clear_probe': tail('/tmp/vc4-v3d-clear-probe.log'),
              },
          }
          Path('VC4_V3D_CLEAR_SCANOUT_STATUS.json').write_text(
              json.dumps(status, indent=2, sort_keys=True) + '\n'
          )
          Path('VC4_V3D_CLEAR_SCANOUT_STATUS.md').write_text(
              '# VC4 V3D clear scanout\n\n'
              f'Validation passed: **{str(passed).lower()}**\n\n'
              f'- Dual AArch64/VC4 build: '
              f'`{outcomes.get("build") == "success"}`\n'
              f'- Processor-control, multicore-sync, and V3D MMIO '
              f'regressions: `{outcomes.get("regressions") == "success"}`\n'
              f'- V3D central-tile clear visible in QMP scanout: '
              f'`{clear.get("passed") is True}`\n'
              f'- Pinned Linux framebuffer regression: '
              f'`{linux.get("passed") is True}`\n\n'
              'The control-list clear path is hardware accelerated inside '
              'the emulated V3D block. Primitive binning and QPU shader '
              'execution remain the next frontier.\n'
          )
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write('passed=' + str(passed).lower() + '\n')
          print(json.dumps(status, indent=2, sort_keys=True))
          PY

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-v3d-clear-scanout-${{ github.run_attempt }}
          path: |
            VC4_V3D_CLEAR_SCANOUT_STATUS.json
            VC4_V3D_CLEAR_SCANOUT_STATUS.md
            /tmp/vc4-v3d-clear-configure.log
            /tmp/vc4-v3d-clear-build.log
            /tmp/vc4-v3d-clear-preg.log
            /tmp/vc4-v3d-clear-msync.log
            /tmp/vc4-v3d-clear-mmio.log
            /tmp/vc4-v3d-clear-probe.log
            /tmp/vc4-v3d-clear-proof
            /tmp/vc4-v3d-clear-linux
            /tmp/vc4-v3d-clear-official/SHA256SUMS
            build/vc4-arm-v3d-clear/SHA256SUMS
            build/vc4-linux-initramfs/SHA256SUMS
          if-no-files-found: warn
          retention-days: 14

      - name: Publish validated slice or failure record
        if: always()
        env:
          PASSED: ${{ steps.record.outputs.passed }}
        run: |
          set -euo pipefail
          cp VC4_V3D_CLEAR_SCANOUT_STATUS.json /tmp/status.json
          cp VC4_V3D_CLEAR_SCANOUT_STATUS.md /tmp/status.md
          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"

          if [ "$PASSED" = true ]; then
            git rm --ignore-unmatch -- \
              .github/workflows/vc4-v3d-clear-scanout.yml \
              .github/workflows/vc4-v3d-bringup.yml \
              .github/workflows/vc4-v3d-diagnostics.yml \
              scripts/vc4/v3d-integrate.py \
              VC4_ACTIONS_HEARTBEAT.json
            git add -- \
              hw/display/bcm2835_v3d.c \
              hw/display/meson.build \
              include/hw/display/bcm2835_v3d.h \
              include/hw/arm/bcm2835_peripherals.h \
              hw/arm/bcm2835_peripherals.c \
              scripts/vc4/v3d-smoke.py \
              scripts/vc4/build-arm-v3d-clear.sh \
              scripts/vc4/raspi3-v3d-clear-probe.py \
              tests/vc4/arm-v3d-clear.c \
              VC4_V3D_CLEAR_SCANOUT_STATUS.json \
              VC4_V3D_CLEAR_SCANOUT_STATUS.md
            message="hw/display: validate V3D clear into live scanout"
          else
            git reset --hard "$GITHUB_SHA"
            cp /tmp/status.json VC4_V3D_CLEAR_SCANOUT_STATUS.json
            cp /tmp/status.md VC4_V3D_CLEAR_SCANOUT_STATUS.md
            git add -- \
              VC4_V3D_CLEAR_SCANOUT_STATUS.json \
              VC4_V3D_CLEAR_SCANOUT_STATUS.md
            message="ci/vc4: record V3D clear scanout failure [skip ci]"
          fi

          git diff --cached --check
          git commit -m "$message"
          git pull --rebase origin agent/vc4-v3d-clear-scanout
          git push origin HEAD:agent/vc4-v3d-clear-scanout
