name: Publish VC4 atomic GETRESOURCES capacity fix

on:
  push:
    branches:
      - agent/vc4-atomic-primary-publisher
    paths:
      - .github/workflows/vc4-atomic-primary-publisher.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc4-atomic-primary-resource-fix
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_BRANCH: agent/vc4-linux-kms-bind-diagnostics
      EXPECTED_BASE: 8d4344aae8336df54ebf775be6b3edb52a0dcecf
      EXPECTED_SOURCE_BLOB: 2561323b934756e4940dc98d0ba142e3e4b75637
      EXPECTED_RESULT_BLOB: 86d30e55d43ecb38e1826414b015cf056dd76b24
      SOURCE_PATH: tests/vc4/linux-kms-master-reacquire-probe.inc.c

    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/vc4-atomic-primary-publisher
          fetch-depth: 0

      - name: Install witness compilation dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            binutils-aarch64-linux-gnu \
            gcc-aarch64-linux-gnu \
            libdrm-dev \
            libc6-dev-arm64-cross \
            linux-libc-dev-arm64-cross \
            python3

      - name: Check out the exact measured frontier
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          actual=$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")
          test "$actual" = "$EXPECTED_BASE"
          git checkout --detach "$EXPECTED_BASE"
          test "$(git hash-object "$SOURCE_PATH")" = "$EXPECTED_SOURCE_BLOB"

      - name: Repair GETRESOURCES array capacities
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "tests/vc4/linux-kms-master-reacquire-probe.inc.c"
          )
          source = path.read_text(encoding="utf-8")
          anchor = """    resources.crtc_id_ptr = (uintptr_t)crtc_ids;
          """
          replacement = """    /*
           * The count-only call also returns the sizes of the framebuffer,
           * connector, and encoder arrays.  We are only providing storage for
           * CRTC IDs here, so advertise zero capacity for every unused array.
           * Otherwise drm_mode_getresources() quite correctly attempts to copy
           * those IDs through our still-NULL pointers and returns EFAULT.
           */
          resources.count_fbs = 0;
          resources.count_connectors = 0;
          resources.count_encoders = 0;
          resources.crtc_id_ptr = (uintptr_t)crtc_ids;
          """
          if source.count(anchor) != 1:
              raise SystemExit(
                  f"expected one GETRESOURCES pointer anchor, "
                  f"found {source.count(anchor)}"
              )
          path.write_text(
              source.replace(anchor, replacement, 1),
              encoding="utf-8",
          )
          PY
          test "$(git hash-object "$SOURCE_PATH")" = "$EXPECTED_RESULT_BLOB"
          git diff --check
          git diff --stat

      - name: Validate the complete static AArch64 witness
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/vc4/enable-linux-kms-master-reacquire-probe.py \
            scripts/vc4/summarize-linux-kms-master-reacquire.py \
            scripts/vc4/summarize-linux-kms-master-reacquire-smoke.py
          python3 scripts/vc4/summarize-linux-kms-master-reacquire-smoke.py

          cp tests/vc4/linux-v3d-modular-init.c /tmp/vc4-atomic-init.c
          python3 scripts/vc4/enable-linux-kms-master-reacquire-probe.py \
            /tmp/vc4-atomic-init.c
          aarch64-linux-gnu-gcc \
            -static -O2 -g0 -Wall -Wextra -Werror -fno-ident \
            -I/usr/include/libdrm -Itests/vc4 \
            -Wl,--build-id=none \
            -o /tmp/vc4-atomic-init \
            /tmp/vc4-atomic-init.c
          file /tmp/vc4-atomic-init
          strings /tmp/vc4-atomic-init > /tmp/vc4-atomic-init.strings
          grep -Fq VC4_LINUX_KMS_MASTER_REACQUIRE_ATOMIC_CAPS_OK \
            /tmp/vc4-atomic-init.strings
          grep -Fq VC4_LINUX_KMS_MASTER_REACQUIRE_ATOMIC_PRIMARY_PLANE_OK \
            /tmp/vc4-atomic-init.strings
          grep -Fq VC4_LINUX_KMS_MASTER_REACQUIRE_ATOMIC_OK \
            /tmp/vc4-atomic-init.strings

      - name: Create the product commit
        id: product
        run: |
          set -euo pipefail
          git config user.name "VC4 Development"
          git config user.email "vc4-dev@users.noreply.github.com"
          git add -- "$SOURCE_PATH"
          git commit -m "test/vc4: fix atomic resource enumeration" -m \
            "GETRESOURCES returns capacities for every resource array during the count-only query. Before requesting only the CRTC IDs, clear the unused framebuffer, connector, and encoder capacities so the kernel does not copy through null userspace pointers and return EFAULT."
          product_sha=$(git rev-parse HEAD)
          printf 'product_sha=%s\n' "$product_sha" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$product_sha" > /tmp/vc4-atomic-resource-product-sha

      - name: Publish with an exact ref lease
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          actual=$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")
          test "$actual" = "$EXPECTED_BASE"
          git push \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${EXPECTED_BASE}" \
            origin "HEAD:refs/heads/${TARGET_BRANCH}"
          printf 'Published product commit `%s` to `%s`.\n' \
            "${{ steps.product.outputs.product_sha }}" "$TARGET_BRANCH" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload publisher evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc4-atomic-resource-fix-${{ github.run_attempt }}
          path: |
            /tmp/vc4-atomic-resource-product-sha
            /tmp/vc4-atomic-init.strings
          if-no-files-found: warn
          retention-days: 14
