name: VC4 KMS CI observer

on:
  push:
    branches:
      - agent/vc4-kms-ci-observer
    paths:
      - .github/workflows/vc4-kms-ci-observer.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Capture the actual KMS workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow vc4-linux-kms-bind-diagnostics.yml \
            --branch agent/vc4-linux-kms-bind-diagnostics \
            --limit 20 \
            --json databaseId,status,conclusion,headSha,event,createdAt,updatedAt,url,displayTitle,workflowName \
            > VC4_KMS_CI_RUNS.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("VC4_KMS_CI_RUNS.json")
          runs = json.loads(path.read_text())
          if not runs:
              raise SystemExit("no VC4 KMS diagnostic workflow runs found")
          Path("VC4_KMS_CI_RUNS.md").write_text(
              "# VC4 KMS diagnostic workflow runs\n\n"
              + "| Run | Status | Conclusion | Head | Created | Updated |\n"
              + "|---:|---|---|---|---|---|\n"
              + "\n".join(
                  "| {databaseId} | {status} | {conclusion} | `{head}` | "
                  "{createdAt} | {updatedAt} |".format(
                      head=run["headSha"][:12], **run
                  )
                  for run in runs
              )
              + "\n"
          )
          print(json.dumps(runs, indent=2))
          PY

      - name: Publish the observer snapshot
        run: |
          set -euo pipefail
          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git add -- VC4_KMS_CI_RUNS.json VC4_KMS_CI_RUNS.md
          git rm -- .github/workflows/vc4-kms-ci-observer.yml
          git commit -m "ci/vc4: record diagnostic workflow run state [skip ci]"
          git push origin HEAD:agent/vc4-kms-ci-observer
