name: VC4 firmware clock contract apply

on:
  push:
    branches:
      - agent/vc4-linux-kms-bind-diagnostics
    paths:
      - .github/workflows/vc4-kms-clock-contract-apply.yml

permissions:
  contents: write

concurrency:
  group: vc4-firmware-clock-contract-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Implement the firmware clock enumeration contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          header_path = Path("include/hw/arm/raspberrypi-fw-defs.h")
          header = header_path.read_text()
          if "RPI_FIRMWARE_DISP_CLK_ID" not in header:
              anchor = """    RPI_FIRMWARE_PIXEL_BVB_CLK_ID,
              RPI_FIRMWARE_VEC_CLK_ID,
              RPI_FIRMWARE_NUM_CLK_ID,
          """
              replacement = """    RPI_FIRMWARE_PIXEL_BVB_CLK_ID,
              RPI_FIRMWARE_VEC_CLK_ID,
              RPI_FIRMWARE_DISP_CLK_ID,
              RPI_FIRMWARE_NUM_CLK_ID,
          """
              if header.count(anchor) != 1:
                  raise SystemExit("firmware clock enum anchor changed")
              header = header.replace(anchor, replacement, 1)
              header_path.write_text(header)

          property_path = Path("hw/misc/bcm2835_property.c")
          source = property_path.read_text()
          array = """
          /*
           * GET_CLOCKS is discovery, not a request for a single clock.  Linux
           * sizes the firmware-clock provider from the IDs returned here; a
           * provider that advertises only ARM makes consumers such as HDMI
           * fail with of_clk_hw_onecell_get() for the pixel clock.
           *
           * Keep this list aligned with the clocks exported by the Raspberry
           * Pi firmware clock driver.  Parent zero denotes a firmware root.
           */
          static const uint32_t bcm2835_property_clock_ids[] = {
              RPI_FIRMWARE_ARM_CLK_ID,
              RPI_FIRMWARE_CORE_CLK_ID,
              RPI_FIRMWARE_V3D_CLK_ID,
              RPI_FIRMWARE_ISP_CLK_ID,
              RPI_FIRMWARE_PIXEL_CLK_ID,
              RPI_FIRMWARE_HEVC_CLK_ID,
              RPI_FIRMWARE_M2MC_CLK_ID,
              RPI_FIRMWARE_PIXEL_BVB_CLK_ID,
              RPI_FIRMWARE_VEC_CLK_ID,
              RPI_FIRMWARE_DISP_CLK_ID,
          };
          """
          if "bcm2835_property_clock_ids" not in source:
              matches = list(re.finditer(
                  r"(#define BCM2835_PROPERTY_POWER_STATE_COUNT 32\n(?:#define[^\n]+\n)*)",
                  source,
              ))
              if len(matches) != 1:
                  raise SystemExit("property define anchor changed")
              end = matches[0].end()
              source = source[:end] + array + source[end:]
          elif "RPI_FIRMWARE_DISP_CLK_ID" not in source.split("};", 1)[0]:
              anchor = """    RPI_FIRMWARE_PIXEL_BVB_CLK_ID,
              RPI_FIRMWARE_VEC_CLK_ID,
          """
              replacement = anchor + "    RPI_FIRMWARE_DISP_CLK_ID,\n"
              if source.count(anchor) != 1:
                  raise SystemExit("existing clock list anchor changed")
              source = source.replace(anchor, replacement, 1)

          start = source.find("        case RPI_FWREQ_GET_CLOCKS:")
          end = source.find("        case RPI_FWREQ_SET_CLOCK_RATE:", start)
          if start < 0 or end < 0:
              raise SystemExit("GET_CLOCKS switch anchors changed")
          block = """        case RPI_FWREQ_GET_CLOCKS:
              {
                  size_t clock_count = MIN(ARRAY_SIZE(bcm2835_property_clock_ids),
                                           bufsize / (2 * sizeof(uint32_t)));

                  for (size_t i = 0; i < clock_count; i++) {
                      stl_le_phys(&s->dma_as,
                                  value + 12 + i * 2 * sizeof(uint32_t), 0);
                      stl_le_phys(&s->dma_as,
                                  value + 16 + i * 2 * sizeof(uint32_t),
                                  bcm2835_property_clock_ids[i]);
                  }
                  resplen = clock_count * 2 * sizeof(uint32_t);
                  break;
              }

          """
          source = source[:start] + block + source[end:]
          property_path.write_text(source)

          smoke_path = Path("scripts/vc4/property-clock-enumeration-smoke.py")
          smoke_path.write_text(r'''#!/usr/bin/env python3
          """Verify the Raspberry Pi firmware GET_CLOCKS discovery contract."""

          from __future__ import annotations

          import argparse
          from pathlib import Path
          import socket
          import subprocess
          import tempfile
          import time


          RPI3_PERIPHERAL_BASE = 0x3F000000
          MAILBOX_READ = RPI3_PERIPHERAL_BASE + 0x0000B880
          MAILBOX_WRITE = RPI3_PERIPHERAL_BASE + 0x0000B8A0
          MAILBOX_PROPERTY_CHANNEL = 8
          PROPERTY_BUFFER = 0x00010000
          PROPERTY_RESPONSE_SUCCESS = 1 << 31
          RPI_FWREQ_GET_CLOCKS = 0x00010007

          EXPECTED_CLOCKS = (
              3,   # ARM
              4,   # CORE
              5,   # V3D
              7,   # ISP
              9,   # PIXEL
              11,  # HEVC
              13,  # M2MC
              14,  # PIXEL_BVB
              15,  # VEC
              16,  # DISP
          )


          class QTestClient:
              def __init__(self, path: Path) -> None:
                  self._sock = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
                  self._sock.connect(str(path))
                  self._reader = self._sock.makefile("r", encoding="utf-8")

              def close(self) -> None:
                  self._reader.close()
                  self._sock.close()

              def command(self, command: str) -> list[str]:
                  self._sock.sendall((command + "\n").encode())
                  while True:
                      response = self._reader.readline()
                      if not response:
                          raise RuntimeError(
                              f"qtest closed while handling {command!r}"
                          )
                      words = response.strip().split()
                      if not words or words[0] == "IRQ":
                          continue
                      if words[0] != "OK":
                          raise RuntimeError(
                              f"qtest command failed: {response.strip()}"
                          )
                      return words[1:]

              def writel(self, address: int, value: int) -> None:
                  self.command(f"writel 0x{address:x} 0x{value & 0xffffffff:x}")

              def readl(self, address: int) -> int:
                  values = self.command(f"readl 0x{address:x}")
                  if len(values) != 1:
                      raise RuntimeError(f"bad qtest read response: {values!r}")
                  return int(values[0], 0)


          def connect(path: Path, process: subprocess.Popen[str]) -> QTestClient:
              deadline = time.monotonic() + 10
              last_error: OSError | None = None
              while time.monotonic() < deadline:
                  if process.poll() is not None:
                      stderr = process.stderr.read() if process.stderr else ""
                      raise RuntimeError(
                          f"QEMU exited with {process.returncode}:\n{stderr}"
                      )
                  try:
                      return QTestClient(path)
                  except (FileNotFoundError, ConnectionRefusedError) as error:
                      last_error = error
                      time.sleep(0.02)
              raise RuntimeError(f"timed out connecting to qtest: {last_error}")


          def main() -> int:
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument(
                  "--qemu",
                  type=Path,
                  default=Path("build/qemu-system-aarch64"),
              )
              args = parser.parse_args()
              qemu = args.qemu.resolve()
              if not qemu.is_file():
                  parser.error(f"QEMU binary does not exist: {qemu}")

              with tempfile.TemporaryDirectory(prefix="vc4-clocks-") as directory:
                  socket_path = Path(directory) / "qtest.sock"
                  process = subprocess.Popen(
                      (
                          str(qemu),
                          "-M", "raspi3b",
                          "-accel", "qtest",
                          "-S",
                          "-display", "none",
                          "-serial", "none",
                          "-monitor", "none",
                          "-qtest", f"unix:{socket_path},server=on,wait=off",
                      ),
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.PIPE,
                      text=True,
                  )
                  client: QTestClient | None = None
                  try:
                      client = connect(socket_path, process)
                      pair_capacity = 17
                      payload_words = pair_capacity * 2
                      buffer_size = payload_words * 4
                      total_size = 24 + buffer_size
                      words = (
                          total_size,
                          0,
                          RPI_FWREQ_GET_CLOCKS,
                          buffer_size,
                          0,
                          *(0 for _ in range(payload_words)),
                          0,
                      )
                      for index, word in enumerate(words):
                          client.writel(PROPERTY_BUFFER + 4 * index, word)

                      client.writel(
                          MAILBOX_WRITE,
                          PROPERTY_BUFFER | MAILBOX_PROPERTY_CHANNEL,
                      )
                      returned = client.readl(MAILBOX_READ)
                      expected_return = PROPERTY_BUFFER | MAILBOX_PROPERTY_CHANNEL
                      if returned != expected_return:
                          raise RuntimeError(
                              f"mailbox returned 0x{returned:08x}, "
                              f"expected 0x{expected_return:08x}"
                          )
                      response = client.readl(PROPERTY_BUFFER + 4)
                      if response != PROPERTY_RESPONSE_SUCCESS:
                          raise RuntimeError(
                              f"property response failed: 0x{response:08x}"
                          )
                      response_size = client.readl(PROPERTY_BUFFER + 16)
                      expected_size = (1 << 31) | (len(EXPECTED_CLOCKS) * 8)
                      if response_size != expected_size:
                          raise RuntimeError(
                              f"GET_CLOCKS length 0x{response_size:08x}, "
                              f"expected 0x{expected_size:08x}"
                          )

                      pairs = tuple(
                          (
                              client.readl(PROPERTY_BUFFER + 20 + index * 8),
                              client.readl(PROPERTY_BUFFER + 24 + index * 8),
                          )
                          for index in range(len(EXPECTED_CLOCKS))
                      )
                      expected_pairs = tuple((0, clock) for clock in EXPECTED_CLOCKS)
                      if pairs != expected_pairs:
                          raise RuntimeError(
                              f"GET_CLOCKS returned {pairs!r}, "
                              f"expected {expected_pairs!r}"
                          )
                  finally:
                      if client is not None:
                          client.close()
                      process.terminate()
                      try:
                          process.wait(timeout=5)
                      except subprocess.TimeoutExpired:
                          process.kill()
                          process.wait(timeout=5)

              print("Raspberry Pi firmware clock enumeration smoke test passed")
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          '''.replace("          ", ""))
          smoke_path.chmod(0o755)
          PY

          python3 -m py_compile scripts/vc4/property-clock-enumeration-smoke.py
          git diff --check

      - name: Build and run the focused qtest witness
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build pkg-config python3 \
            libglib2.0-dev libpixman-1-dev zlib1g-dev
          ./configure \
            --target-list=aarch64-softmmu \
            --disable-docs --disable-werror
          ninja -C build qemu-system-aarch64
          python3 scripts/vc4/property-clock-enumeration-smoke.py \
            --qemu build/qemu-system-aarch64

      - name: Publish the tested contract and remove this transient workflow
        run: |
          set -euo pipefail
          git config user.name "VC4 CI"
          git config user.email "vc4-ci@users.noreply.github.com"
          git add -- \
            hw/misc/bcm2835_property.c \
            include/hw/arm/raspberrypi-fw-defs.h \
            scripts/vc4/property-clock-enumeration-smoke.py
          git rm -- .github/workflows/vc4-kms-clock-contract-apply.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "hw/misc: enumerate Raspberry Pi firmware clocks"
          git pull --rebase origin agent/vc4-linux-kms-bind-diagnostics
          git push origin HEAD:agent/vc4-linux-kms-bind-diagnostics
